<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Claude Code 使いこなし問題集（非公式）</title>
<meta name="robots" content="noindex,nofollow">
<script>
(function () {
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === "withSuccessHandler") return function (f) { return make(f, fail); };
      if (name === "withFailureHandler") return function (f) { return make(ok, f); };
      return function () {
        var reading = /^(apiLoad|apiGet)/.test(String(name));
        setTimeout(function () {
          if (reading) { if (ok) ok(null); }
          else if (fail) fail(new Error("公開版では記録・AI助言は使えません"));
        }, 0);
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
  <style>
    :root {
      --theme-color: #8a4b2a;
      --theme-color-dark: #4f2a15;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon { font-size: 32px; }

.header-text { min-width: 0; flex: 1 1 140px; }   /* ボタンに押されてタイトルが1文字幅に潰れ、縦書きのように見えるのを防ぐ */
.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; writing-mode: horizontal-tb; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.quiz-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

.screen { width: 100%; max-width: 520px; margin: 0 auto; }

/* --- モード選択画面 --- */
/* カード数が増えても幅が細くなりすぎないよう、flexではなくgridで自動折り返しする
   （4つ目の「追加問題2」追加時にスマホで窮屈にならないための変更）。 */
.mode-select {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.mode-card {
  min-width: 0;
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.mode-card:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

/* 復習モードのカードだけ、出題元の問題集カードと見分けられるよう薄く色を敷く。 */
.review-card {
  background: #fffaf2;
  border-color: #f0d9b5;
}
.review-card:hover { border-color: #e0a75e; }
.mode-card:disabled { opacity: 0.6; cursor: wait; }

.mode-icon { font-size: 36px; margin-bottom: 8px; }
.mode-title { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 4px; }
.mode-desc { font-size: 13px; color: #888; }

/* --- 範囲選択画面（全部 / 章ごとにチャレンジ） --- */
.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 4px 0;
  font-family: inherit;
}

.back-link:hover { color: var(--theme-color); }

.scope-select {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-all-btn {
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  margin-bottom: 8px;
}

.scope-all-btn:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

.scope-all-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 4px; }
.scope-all-desc { font-size: 13px; color: #888; }

.scope-chapter-heading {
  font-size: 12px;
  font-weight: 700;
  color: #999;
  margin: 4px 0 2px;
}

.scope-chapter-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scope-chapter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 48px;
  background: #f8f9ff;
  border: 1.5px solid #e8eaf6;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.scope-chapter-btn:hover { border-color: var(--theme-color); }

.scope-chapter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.scope-chapter-btn:disabled:hover { border-color: #e6e8ee; }

/* 範囲選択画面の下に出す補足（復習モードの「克服」ルールの説明など） */
.scope-note {
  margin-top: 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.scope-chapter-btn .name { flex: 1; padding-right: 12px; }
.scope-chapter-btn .count { flex-shrink: 0; color: var(--theme-color); font-weight: 700; font-size: 13px; }

/* --- 出題画面 --- */
.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.chapter-label {
  text-align: center;
  font-size: 12px;
  color: var(--theme-color);
  font-weight: 600;
  margin-bottom: 16px;
}

.question-card {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stem {
  font-size: 15.5px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.option-btn:hover { border-color: var(--theme-color); }

.option-btn.selected {
  border-color: var(--theme-color);
  background: #f0f0ff;
  font-weight: 600;
}

.option-btn.tf-btn {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

/* 回答後の表示状態 */
.option-btn.correct {
  border-color: #2e7d32;
  background: #e8f5e9;
}

.option-btn.incorrect {
  border-color: #c62828;
  background: #fdecea;
}

.option-btn:disabled { cursor: default; }

.option-badge {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
}

.option-explain {
  display: block;
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.6;
  font-weight: 400;
}

.answer-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.answer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 回答（複数選択のときだけ表示）とスキップを縦に並べる操作行。
   mc / tf は選択した時点で判定するため、この行にはスキップだけが残る。 */
.question-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.skip-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  background: white;
  color: #888;
  border: 1.5px solid #e6e8ee;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.skip-btn:hover { border-color: var(--theme-color); color: var(--theme-color); }

.reveal-area { margin-top: 20px; }

.reveal-options { margin-bottom: 16px; }

.reveal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.action-btn:hover { border-color: var(--theme-color); }

.action-btn.primary {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
}

/* --- 終了サマリー画面 --- */
#screenSummary { text-align: center; }
#screenSummary h2 { font-size: 22px; color: #333; margin-bottom: 16px; }

.summary-score {
  font-size: 32px;
  font-weight: 700;
  color: var(--theme-color);
  margin-bottom: 20px;
}

.summary-chapters {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.summary-chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}

.summary-chapter-row .name { color: #333; }
.summary-chapter-row .score { color: var(--theme-color); font-weight: 700; }

.summary-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 間違えた問題だけを解き直すボタン。記録ボタンの次に置いて目に入るようにする。 */
.action-btn.retry-wrong {
  border-color: #f0d9b5;
  background: #fffaf2;
  color: #a1670f;
  font-weight: 700;
}
.action-btn.retry-wrong:hover { border-color: #e0a75e; }

.summary-note {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.record-status,
.advice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #888;
  min-height: 18px;
}

.advice-area {
  margin-top: 12px;
  text-align: left;
  white-space: pre-wrap;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 12px;
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #333;
}

.quiz-body::-webkit-scrollbar { width: 5px; }
.quiz-body::-webkit-scrollbar-track { background: transparent; }
.quiz-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

/* --- PCブラウザ（幅900px以上）: 画面幅を広く使う ---
   以前は .screen が max-width:520px の中央寄せで、PCでは画面の中央に細い1列が出るだけだった（2026-09-20 に変更）。
   スマホ（600px以下）の指定とは範囲が重ならない。行が長くなりすぎないよう、上限は 1120px（1400px以上は 1240px）。
   ボタン類は横いっぱいに伸ばさず、中央に寄せた幅に留める。 */
@media (min-width: 900px) {
  .header { padding: 18px 40px; }
  .header-text h1 { font-size: 20px; }
  .header-text p { font-size: 13px; }
  .header-btn { font-size: 12px; padding: 7px 14px; }

  .quiz-body { padding: 32px 48px; }
  .screen { max-width: 1120px; }

  /* モード選択: カードを横に並べて広く使う（4枚なら1行） */
  .mode-select { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 16px; }
  .mode-card { padding: 30px 20px; }
  .mode-icon { font-size: 40px; }
  .mode-title { font-size: 18px; }
  .mode-desc { font-size: 14px; }

  /* 範囲選択: 章のボタンを2列に（章が多くても縦に長くなりすぎない） */
  .scope-chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  .scope-chapter-btn { font-size: 15px; }

  /* 出題: 問題文・選択肢を広く、文字も一段大きく */
  .question-card { padding: 28px 36px; }
  .stem { font-size: 18px; line-height: 1.8; }
  .options { gap: 12px; }
  .option-btn { font-size: 16px; padding: 14px 20px; }
  .answer-btn, .action-btn, .skip-btn { max-width: 520px; margin-left: auto; margin-right: auto; }
  .question-actions { align-items: center; }
  .question-actions .answer-btn, .question-actions .skip-btn { width: 100%; }
  .summary-note, .scope-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .reveal-actions { align-items: stretch; }

  /* 終了サマリー: 章別の結果を2列に */
  .summary-chapters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .summary-chapter-row { font-size: 14.5px; padding: 12px 16px; }
  .summary-actions { align-items: center; }
  .summary-actions .action-btn { width: 100%; }
}

@media (min-width: 1400px) {
  .screen { max-width: 1240px; }
}

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 8px 10px; flex-wrap: wrap; }   /* 狭い画面ではボタン類を2行目へ折り返す */
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 16px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; flex-wrap: wrap; flex-basis: 100%; margin-left: 0; }
  .header-btn { font-size: 11px; padding: 6px 10px; }
  .quiz-body { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .stem { font-size: 16.5px; }
  .option-btn { font-size: 16px; }
  .mode-select { gap: 10px; }
  .mode-card { padding: 16px 8px; }
  .mode-icon { font-size: 26px; margin-bottom: 4px; }
  .mode-title { font-size: 14px; margin-bottom: 2px; }
  .mode-desc { font-size: 11px; }
}

@media (max-height: 480px) {
  .quiz-body { padding-top: 14px; }
  .mode-card { padding: 12px 8px; }
  .mode-icon { font-size: 22px; margin-bottom: 2px; }
}

/* --- 中断した問題集の再開バナー（モード選択画面の先頭） --- */
.resume-banner {
  border: 2px solid var(--theme-color);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.resume-text { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
.resume-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-actions .action-btn { flex: 1 1 140px; width: auto; }

  </style>
<style>#askBtn,#adviceBtn{display:none !important}</style>
</head>
<body>
<div style="background:#fff4d6;color:#5b4300;padding:10px 14px;font-size:14px;line-height:1.6;border-bottom:1px solid #e6c96b">
<strong>非公式・個人作成の仮問題です。</strong>Anthropic（Claude Code）の公式の試験・規格とは無関係で、公式の出題・難度とは一致しません。事実関係は公式ドキュメントで確認した内容に基づきますが、Claude Code は頻繁に更新されるため最新の公式ドキュメントで確認してください。この公開版では成績・途中経過は保存されません。
</div>
<div class="container">
  <div class="header">
    <div class="header-icon">⌨️</div>
    <div class="header-text">
      <h1>Claude Code 使いこなし問題集（非公式）</h1>
      <p id="headerSub">モードを選んでください</p>
    </div>
    <div class="header-actions">
      
      
      
      <button type="button" class="header-btn" id="soundBtn" onclick="toggleSound()">🔊 音</button>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="screen" id="screenMode">
      <div class="resume-banner" id="resumeBanner" style="display:none;">
        <div class="resume-text" id="resumeText"></div>
        <div class="resume-actions">
          <button class="action-btn primary" id="resumeBtn" onclick="resumeProgress()">▶ 続きから再開</button>
          <button class="action-btn" onclick="discardProgress()">破棄</button>
        </div>
      </div>
      <div class="mode-select">
        <button class="mode-card" onclick="chooseMode('mc')">
          <div class="mode-icon">📝</div>
          <div class="mode-title" id="mcTitle">模擬試験</div>
          <div class="mode-desc"><span id="mcCount">0</span>問・<span id="mcKind">4択</span></div>
        </button>
        <button class="mode-card" id="tfCard" onclick="chooseMode('tf')">
          <div class="mode-icon">⭕</div>
          <div class="mode-title">一問一答</div>
          <div class="mode-desc"><span id="tfCount">0</span>問・正誤判定</div>
        </button>
        <button class="mode-card" id="extraCard" onclick="chooseMode('extra')">
          <div class="mode-icon">📘</div>
          <div class="mode-title">追加問題</div>
          <div class="mode-desc"><span id="extraCount">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra2Card" onclick="chooseMode('extra2')">
          <div class="mode-icon">📗</div>
          <div class="mode-title">追加問題2</div>
          <div class="mode-desc"><span id="extra2Count">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra3Card" onclick="chooseMode('extra3')">
          <div class="mode-icon">🆕</div>
          <div class="mode-title">新シラバス仮問題</div>
          <div class="mode-desc"><span id="extra3Count">0</span>問・4択（2027年2月〜の追加分）</div>
        </button>
        <button class="mode-card review-card" id="reviewCard" onclick="chooseMode('review')">
          <div class="mode-icon">🔁</div>
          <div class="mode-title">復習</div>
          <div class="mode-desc" id="reviewCount">間違えた問題だけ</div>
        </button>
      </div>
    </div>

    <div class="screen" id="screenScope" style="display:none;">
      <button class="back-link" onclick="backToModeSelect()">← モード選択に戻る</button>
      <div class="scope-select" id="scopeSelect"></div>
    </div>

    <div class="screen" id="screenQuestion" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="chapter-label" id="chapterLabel"></div>
      <div class="question-card">
        <p class="stem" id="stem"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="question-actions" id="questionActions">
        <button class="answer-btn" id="answerBtn" onclick="reveal()" disabled>回答</button>
        <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">回答せずに次へ →</button>
      </div>
      <div class="reveal-area" id="revealArea" style="display:none;">
        <div class="reveal-options" id="revealOptions"></div>
        <div class="reveal-actions">
          <button class="action-btn" id="askBtn" style="display:none !important" onclick="askInChat()">🤖 チャットに詳しく聞く</button>
          <button class="action-btn primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSummary" style="display:none;">
      <h2>お疲れさまでした！</h2>
      <div class="summary-score" id="summaryScore"></div>
      <div class="summary-chapters" id="summaryChapters"></div>
      <div class="summary-actions">
        <button class="action-btn primary" id="recordBtn" onclick="recordResults()">この回の結果を記録</button>
        <button class="action-btn retry-wrong" id="retryWrongBtn" onclick="retryWrongInSession()" style="display:none;">🔁 間違えた問題だけもう一度</button>
        <button class="action-btn" id="adviceBtn" style="display:none !important" onclick="getAdvice()">🎯 学習アドバイスを見る</button>

<script>
  const GAS_WEBAPP_URL = '';
  const EXAM_ID = 'claudecode';
  const EXAM_SHORT_TITLE = 'Claude Code';
  const TRACKING_EXAM_ID = 'claudecode';
  const MC_TITLE = '問題集';
  const QUESTIONS = [{"id":"claudecode-1","type":"mc","chapterIndex":0,"stem":"テストを実行し、その出力を会話に取り込んだうえで Claude に失敗の原因を分析してもらいたい。入力欄でコマンドの先頭に付ける文字として正しいものはどれか。","options":["`$` を先頭に付けると、入力したコマンドが Claude を経由せずシェルで直接動くようになる","`!` を先頭に付けてシェルモードにする","`@` を先頭に付けると、続くコマンドが実行されて出力が会話に入る","専用の `/run` コマンドを使う以外に、シェルの実行はできない仕組みである"],"correctIndex":1,"explanations":["× `$` にそのような働きはない。シェルモードに入る文字は `!` である。","○ 入力が `!` で始まるとシェルモードになり、コマンドの出力がセッションに追加されて、Claude がそれに応答できる。","× `@` はファイルパスの補完を開くための記号で、コマンドを実行するものではない。","× `/run` という専用の入口が必須なわけではなく、`!` で始めれば直接実行できる。"]},{"id":"claudecode-2","type":"mc","chapterIndex":0,"stem":"`@` でファイルを参照するとき、会話に取り込まれないものとして正しいのはどれか。","options":["拡張子が `.md` のファイルは、内容にかかわらず取り込まれない","隠しファイル（先頭がドットのファイル）は、サイズに関係なく必ず除外される","256KB を超えるテキストファイルは含まれない","1 回の入力で 2 つ目以降に指定したファイルは、内容が取り込まれない"],"correctIndex":2,"explanations":["× 拡張子による除外はなく、Markdown も通常どおり取り込める。","× 隠しファイルだからという理由で一律に除外される仕様ではない。正しくは「256KB を超えるテキストファイルは含まれない」である。","○ `@` で読み込まれる量には Read ツールの既定上限があり、256KB を超えるテキストファイルは含まれない。","× 複数のファイルを 1 回の入力で参照すること自体は可能である。正しくは「256KB を超えるテキストファイルは含まれない」である。"]},{"id":"claudecode-3","type":"mc","chapterIndex":0,"stem":"プロジェクトの `src/` ディレクトリを `@src/` のように `@` で指定した。このとき会話に入るものとして正しいのはどれか。","options":["配下のすべてのファイルの内容が、再帰的にまとめて入る","ディレクトリは指定できないため、エラーになって何も入らない","直下のファイルのうち、先頭の 10 件の内容だけが入る","ファイルの一覧が入る。内容は入らない"],"correctIndex":3,"explanations":["× 内容は入らないため、大きなディレクトリを指定しても一気にコンテキストが埋まることはない。","× ディレクトリは指定でき、エラーにはならずに一覧が入る。正しくは「ファイルの一覧が入る」である。","× 件数を区切って内容を取り込むような動作ではなく、入るのは一覧のみである。","○ ディレクトリを指定するとファイル一覧が入る。中身が必要なら個々のファイルを `@` で指定する。"]},{"id":"claudecode-4","type":"mc","chapterIndex":0,"stem":"接続済みの MCP サーバーが公開しているリソースを会話で参照するときの書式として正しいのはどれか。","options":["`@server:resource` の形式で書く","`#server/resource` という形式で書く。ハッシュ記号で始める","`mcp://server/resource` を `!` に続けて書く。URL として指定する","`/server resource` とスラッシュコマンドの形で書く"],"correctIndex":0,"explanations":["○ `@server:resource` のように、サーバー名とリソース名をコロンでつないで参照する。","× `#` で始める書式は用意されていない。正しくは「`@server:resource` の形式で書く」である。","× `!` はシェルモードを開始する記号であり、リソースの参照とは関係がない。","× スラッシュコマンドではなく、`@` を使った参照で行う。正しくは「`@server:resource` の形式で書く」である。"]},{"id":"claudecode-5","type":"mc","chapterIndex":0,"stem":"Claude が長い応答の途中で、望まない方向へ進み始めた。それまでの作業内容は残したまま止めたい。最も適切な操作はどれか。","options":["`Ctrl+C` を 2 回押して、セッションを終了してから再開する","`Esc` を押して応答やツール呼び出しを途中で止める","`/clear` を実行して、会話全体を空にしてから指示し直す","`Ctrl+S` を押して、作業内容をすべて取り消す"],"correctIndex":1,"explanations":["× `Ctrl+C` はこの場面でも中断の操作だが、2 回押すのは何も実行していないときの終了手順であり、ここでは過剰である。","○ `Esc` は応答やツール呼び出しを止めるだけで、それまでの作業は保持される。軌道修正は早めに行うのが良い。","× `/clear` は会話のコンテキストを完全に捨てるので、残したい作業まで失われる。","× `Ctrl+S` は入力中のプロンプトを一時退避する操作で、作業の取り消しではない。"]},{"id":"claudecode-6","type":"mc","chapterIndex":0,"stem":"入力欄が空の状態で `Esc` を 2 回押すと、何が起こるか。","options":["直前の応答がもう一度生成される。内容は再度作り直される","画面の表示がクリアされ、新しい会話が始まる","巻き戻しメニュー（rewind menu）が開く","現在の権限モードが `default` に戻る"],"correctIndex":2,"explanations":["× 再生成の操作ではない。巻き戻しは、選んだ時点の状態へ戻すためのものである。","× 新しい会話を始めるのは `/clear` であり、`Esc` の 2 回押しではない。","○ 入力が空のときの `Esc` 2 回は、以前の状態に戻すための巻き戻しメニューを開く。`/rewind` でも同様に開ける。","× 権限モードの切り替えは `Shift+Tab` で行うもので、`Esc` とは関係がない。"]},{"id":"claudecode-7","type":"mc","chapterIndex":0,"stem":"Claude が Bash で `rm` を実行して、必要なファイルまで削除してしまった。巻き戻し（チェックポイント）機能についての説明として正しいのはどれか。","options":["Bash の `rm` による削除も追跡されるため、巻き戻しで元のファイルが復元される","削除を復元できるのは、直前の 1 操作に限られる","追跡の対象はコード全体で、削除は復元できる","追跡されるのは Claude のファイル編集ツールによる変更だけ"],"correctIndex":3,"explanations":["× Bash による変更は追跡されないため、復元はされない。正しくは「追跡されるのは Claude のファイル編集ツールによる変更だけ」である。","× 復元できる範囲の限定は「直前の 1 操作」ではなく、そもそも追跡対象かどうかで決まる。","× 巻き戻しメニューには会話とコードの両方を戻す選択肢もある。論点は、Bash の変更が対象外である点である。","○ Bash 経由の `rm`・`mv`・`cp` などによる変更はチェックポイントの追跡対象外である。重要なファイルは git などでも守っておくべきである。"]},{"id":"claudecode-8","type":"mc","chapterIndex":0,"stem":"`/rewind` コマンドの別名として正しい組み合わせはどれか。","options":["`/checkpoint` と `/undo`","`/restore` と `/revert`","`/reset` と `/undo`","`/back` と `/checkpoint` の 2 つ"],"correctIndex":0,"explanations":["○ `/rewind` は `/checkpoint` と `/undo` という別名を持つ。","× `/restore` も `/revert` も別名ではない。正しくは「`/checkpoint` と `/undo`」である。","× `/undo` は別名だが、`/reset` は別名ではないので組み合わせとしては誤りである。","× `/checkpoint` は別名だが、`/back` は別名ではないので組み合わせとしては誤りである。"]},{"id":"claudecode-9","type":"mc","chapterIndex":0,"stem":"何も実行していない待機中の状態で `Ctrl+C` を押したとき、どのように動くか。","options":["1 回押すだけで、すぐに Claude Code が終了することになる","1 回目で入力がクリアされ、2 回目で終了する","1 回目で巻き戻しメニューが開き、2 回目で閉じる","押しても何も起こらず、終了には `/exit` が必須である"],"correctIndex":1,"explanations":["× 1 回目では入力のクリアだけで、終了には 2 回目が必要である。","○ `Ctrl+C` は実行中の操作を中断し、何もしていなければ 1 回目で入力をクリア、2 回目で終了する。","× 巻き戻しメニューを開くのは `Esc` の 2 回押しであり、`Ctrl+C` ではない。","× `Ctrl+C` にも終了の働きがあるので、終了に `/exit` が必須というわけではない。"]},{"id":"claudecode-10","type":"mc","chapterIndex":0,"stem":"数分かかるビルドコマンドを Claude が実行している。待たずに、その間も別の指示を出して作業を進めたい。使える操作はどれか。","options":["`Ctrl+R` を押して、実行中のコマンドを一時停止する。別の指示は出せない","`Ctrl+G` を押して、コマンドを別のエディタで開く。編集した内容で再実行する","`Ctrl+B` で実行中の Bash コマンドをバックグラウンドに移す","`Shift+Tab` を押して、ビルドを自動的に高速化する"],"correctIndex":2,"explanations":["× `Ctrl+R` は過去のコマンド履歴を逆方向に検索する操作であり、実行中のコマンドを止めるものではない。","× `Ctrl+G` は入力中のプロンプトを既定のエディタで編集するための操作である。","○ `Ctrl+B` は実行中の Bash コマンドやエージェントをバックグラウンドに移す。tmux 利用時は 2 回押す。","× `Shift+Tab` は権限モードを循環させる操作で、ビルドの速度には関係しない。"]},{"id":"claudecode-11","type":"mc","chapterIndex":0,"stem":"数十行に及ぶ長い指示を書くので、普段使っているテキストエディタで編集してから送信したい。使えるキー操作はどれか。","options":["`Ctrl+V` でプロンプト全体を外部エディタに貼り付ける。画像の貼り付けにも使える","`Ctrl+S` でプロンプトを外部ファイルに自動保存して開く。保存先は設定で変えられる","`Alt+P` でエディタ用のモードに切り替える","`Ctrl+G` でプロンプトを既定のエディタで開く"],"correctIndex":3,"explanations":["× `Ctrl+V` は画像を貼り付けるための操作であり、エディタを開くものではない。","× `Ctrl+S` は入力中のプロンプトを一時退避する操作である。空の入力欄で再度押すと復元される。","× `Alt+P`（macOS では `Option+P`）はプロンプトを消さずにモデルを切り替える操作である。","○ `Ctrl+G` または `Ctrl+X Ctrl+E` で、プロンプトを既定のテキストエディタで編集できる。"]},{"id":"claudecode-12","type":"mc","chapterIndex":0,"stem":"昨日まで作業していた会話を、同じディレクトリで選択画面なしにそのまま再開したい。コマンドとして正しいのはどれか。","options":["`claude --continue`（`-c`）","`claude --resume`（`-r`）に何も付けずに実行する","`claude --last` を実行する","`claude --restore` を実行する"],"correctIndex":0,"explanations":["○ `--continue`（`-c`）は、現在のディレクトリで最も新しい会話を再開する。","× `--resume`（`-r`）は一覧から選ぶか、ID や名前を指定して再開する方式なので、選択画面なしにはならない。","× `--last` というオプションは用意されていない。正しくは「`claude --continue`（`-c`）」である。","× `--restore` というオプションは用意されていない。正しくは「`claude --continue`（`-c`）」である。"]},{"id":"claudecode-13","type":"mc","chapterIndex":0,"stem":"作業の流れを止めたくないが、ちょっとした疑問だけを聞き、会話履歴やコンテキストを増やしたくない。使えるものはどれか。","options":["`/compact` で会話を要約してから質問する","`/btw` で側質問をする","`!` に続けて質問文をそのまま書く","`@` に続けて質問文をそのまま書いて送る"],"correctIndex":1,"explanations":["× `/compact` は会話を要約してコンテキストを空ける操作で、側質問のための機能ではない。","○ `/btw` は会話履歴に追加されない側質問を行える。コンテキストを増やさずに詳細を確認できる。","× `!` はシェルモードの記号で、質問文はコマンドとして実行されてしまう。","× `@` はファイルなどの参照に使う記号で、質問を投げるものではない。"]},{"id":"claudecode-14","type":"mc","chapterIndex":0,"stem":"先週入力した長い `git` コマンドを再利用したい。履歴を対話的に逆方向へ検索できるキー操作はどれか。","options":["`Ctrl+B` を 2 回続けて押す","`Ctrl+G` を押してエディタを開く","`Ctrl+R` を押す","`Ctrl+S`"],"correctIndex":2,"explanations":["× `Ctrl+B` は実行中のコマンドをバックグラウンドに移す操作で、履歴検索ではない。","× `Ctrl+G` はプロンプトを外部のエディタで編集する操作で、履歴検索ではない。","○ `Ctrl+R` で過去のコマンド履歴を対話的に逆方向検索できる。","× `Ctrl+S` は入力中のプロンプトを一時退避する操作で、履歴検索ではない。"]},{"id":"claudecode-15","type":"mc","chapterIndex":0,"stem":"`Shift+Tab` を押すと何ができるか。","options":["使用するモデルを順番に切り替えられる（それは別のキーの役割）","直前に実行したコマンドをもう一度実行できる","画面の表示を開発者向けの詳細表示に切り替えられる","権限モードを循環させて切り替えられる"],"correctIndex":3,"explanations":["× モデルの切り替えは `Option+P`（macOS）または `Alt+P`（Windows/Linux）である。","× `Shift+Tab` にコマンドの再実行の機能はない。正しくは「権限モードを循環させて切り替えられる」である。","× `Shift+Tab` は表示の切り替えではなく、権限モードの切り替えのキーである。","○ `Shift+Tab` は権限モードを循環させる。プランモードに入るときにも使われる。"]},{"id":"claudecode-16","type":"mc","chapterIndex":1,"stem":"組織が全社員の Linux 環境へ配布する管理ポリシーの CLAUDE.md は、どのパスに置くことになっているか。","options":["`/etc/claude-code/CLAUDE.md`","`/etc/claude/CLAUDE.md` に置く","`/opt/claude-code/CLAUDE.md` に置く","`~/.config/claude-code/CLAUDE.md` に置く"],"correctIndex":0,"explanations":["○ Linux と WSL の管理ポリシーは `/etc/claude-code/CLAUDE.md` に置く。macOS は `/Library/Application Support/ClaudeCode/CLAUDE.md` である。","× ディレクトリ名が `claude` ではなく `claude-code` である。","× `/opt` 配下ではなく、`/etc/claude-code/` が管理ポリシーの置き場である。","× ユーザーの設定ディレクトリ配下ではなく、システム全体の `/etc` 配下に置く。"]},{"id":"claudecode-17","type":"mc","chapterIndex":1,"stem":"どのプロジェクトで作業するときでも、自分用の口調や好みを Claude に守らせたい。置き場所として最も適切なものはどれか。","options":["プロジェクト直下の `./CLAUDE.md` に書く。リポジトリを共有する全員に適用される","`~/.claude/CLAUDE.md` に書く。全プロジェクトに適用される","`./CLAUDE.local.md` に書く","`/etc/claude-code/CLAUDE.md` に書く"],"correctIndex":1,"explanations":["× `./CLAUDE.md` はそのプロジェクトの共有用で、他のプロジェクトには効かない。","○ ユーザー用の CLAUDE.md は `~/.claude/CLAUDE.md` に置き、全プロジェクトに適用される。","× `./CLAUDE.local.md` は個人専用だが対象は現在のプロジェクトだけで、全プロジェクトには効かない。","× `/etc/claude-code/CLAUDE.md` は管理ポリシー用で、個人の好みを書く場所ではない。"]},{"id":"claudecode-18","type":"mc","chapterIndex":1,"stem":"自分のローカル環境だけで使う検証用 URL を、チームのリポジトリにコミットせずに現在のプロジェクト用の指示として Claude に覚えさせたい。適切なのはどれか。","options":["`./CLAUDE.md` に書いて、チームにレビューしてもらう。共有の指示として扱われる","`~/.claude/CLAUDE.md` に書いて、全プロジェクトで有効にする","`./CLAUDE.local.md` に書き","`.claude/settings.json` に書いて、リポジトリにコミットする"],"correctIndex":2,"explanations":["× `./CLAUDE.md` は共有する前提のファイルで、個人用の URL を書く場所には向かない。","× `~/.claude/CLAUDE.md` は全プロジェクトに適用されるため、特定のプロジェクト用の内容には広すぎる。","○ 個人専用のプロジェクト指示は `./CLAUDE.local.md` に置き、`.gitignore` に入れるよう案内されている。","× `.claude/settings.json` はチームで共有する設定ファイルで、コミットすると他の人にも渡ってしまう。"]},{"id":"claudecode-19","type":"mc","chapterIndex":1,"stem":"作業ディレクトリとその上位ディレクトリにある CLAUDE.md の読み込みについて、正しい説明はどれか。","options":["起動時に読み込まれ、作業ディレクトリのものが最初に入る","上位ディレクトリのものは読まれず、作業ディレクトリのものだけが読まれる","起動時には読まれず、最初のプロンプトを送るたびに毎回読み直される","起動時に読み込まれ、上位のものが先に入る（読み込みは一度だけ）"],"correctIndex":3,"explanations":["× 入る順序は逆で、上位のものが先である。正しくは「起動時に読み込まれ、上位のものが先に入る」である。","× 上位ディレクトリの CLAUDE.md も読み込み対象に含まれる。","× 毎回の読み直しではなく、起動時に読み込まれる。正しくは「起動時に読み込まれ、上位のものが先に入る」である。","○ 作業ディレクトリとその上位の CLAUDE.md は起動時に読み込まれ、上位のものが先に入る。"]},{"id":"claudecode-20","type":"mc","chapterIndex":1,"stem":"モノレポで `packages/api/CLAUDE.md` に API 専用のルールを書いた。リポジトリのルートで Claude Code を起動した場合、この CLAUDE.md が読み込まれるのはいつか。","options":["Claude が `packages/api/` 配下のファイルを読む、または編集したとき","起動した時点で、ルートの CLAUDE.md と一緒に必ず読み込まれる","`/init` を実行したときだけ、まとめて読み込まれる","`packages/api/` に `cd` で作業ディレクトリを移さない限り、読み込まれることはない"],"correctIndex":0,"explanations":["○ サブディレクトリの CLAUDE.md は起動時には読まれず、そのディレクトリのファイルを読む・編集したときに読み込まれる。","× 起動時に読み込まれるのは作業ディレクトリと上位のものであり、サブディレクトリのものは含まれない。","× `/init` は CLAUDE.md の生成・改善のためのコマンドで、読み込みの契機ではない。","× 作業ディレクトリを移さなくても、配下のファイルを扱えば読み込まれる。"]},{"id":"claudecode-21","type":"mc","chapterIndex":1,"stem":"CLAUDE.md から別のファイル（たとえば README）の内容を取り込みたい。正しい書き方はどれか。","options":["`#include README.md` の形でインポート文を書く","本文中に `@README.md` のように `@` で始まるパスを書く","`[[README.md]]` の形でリンクを書く。ノート形式の記法である","`import: README.md` を先頭のフロントマターに書く"],"correctIndex":1,"explanations":["× `#include` という構文は用意されていない。正しくは「本文中に `@README.md` のように `@` で始まるパスを書く」である。","○ CLAUDE.md は `@path/to/import` の構文で別ファイルをインポートでき、起動時に展開される。","× `[[ ]]` によるリンクはインポートの構文ではない。正しくは「本文中に `@README.md` のように `@` で始まるパスを書く」である。","× フロントマターに `import` キーを書く方式ではなく、本文中の `@` 構文を使う。"]},{"id":"claudecode-22","type":"mc","chapterIndex":1,"stem":"CLAUDE.md に、文章の中で `` `@README` `` とバッククォートで囲んで書いた。この記述はどう扱われるか。","options":["`README` の内容が展開され、バッククォートだけ取り除かれる","構文エラーとなり、CLAUDE.md 全体が読み込まれなくなる","インポートされず、文字列のまま残る","起動時ではなく、Claude が README を読んだときに展開される"],"correctIndex":2,"explanations":["× 囲んだ場合は展開の対象外である。正しくは「インポートされず、文字列のまま残る」である。","× 書き方によって CLAUDE.md 全体が無効になることはない。","○ バッククォートで囲んだ `@README` はインポートされず、文字列のまま残る。","× 後から展開されることもなく、そのまま文字列として扱われる。正しくは「インポートされず、文字列のまま残る」である。"]},{"id":"claudecode-23","type":"mc","chapterIndex":1,"stem":"人間の読み手向けの補足メモを CLAUDE.md に残したいが、Claude のコンテキストにはトークンを使わせたくない。うまい方法はどれか。","options":["コードブロックの中に HTML コメントとして書く","行頭に `//` を付けてコメント行にする","メモを `CLAUDE.local.md` に移して、`.gitignore` に追加する","ブロックレベルの HTML コメントとして書く"],"correctIndex":3,"explanations":["× コードブロック内の HTML コメントは取り除かれず残る。正しくは「ブロックレベルの HTML コメントとして書く」である。","× `//` はコメントとして処理される記法ではなく、そのまま文章として入る。","× `CLAUDE.local.md` も読み込まれるので、トークンは消費される。メモを隠したいだけなら別の手段が必要である。","○ ブロックレベルの HTML コメントは、CLAUDE.md がコンテキストに入る前に取り除かれる。"]},{"id":"claudecode-24","type":"mc","chapterIndex":1,"stem":"テストファイル（`*.test.ts`）を扱うときだけ適用したいルールがある。ルール全体を毎回のコンテキストに載せたくない場合、適切な方法はどれか。","options":["`.claude/rules/` に Markdown を置き","`.claude/rules/` にそのまま置く","`CLAUDE.md` の先頭に「テストのときだけ従う」と書く。読み込みも条件付きになる","`~/.claude/rules/` に Markdown を置く。マシン上の全プロジェクトで条件付きに読み込まれる"],"correctIndex":0,"explanations":["○ `paths` フロントマターを付けたルールは、対象ファイルを扱うときだけ読み込まれる。","× `paths` を付けないルールは、ファイル名にかかわらず通常どおり読み込まれる。","× CLAUDE.md の文章で条件を書いても、読み込み自体は減らない。常に全文がコンテキストに入る。","× `~/.claude/rules/` のルールは全プロジェクトに適用されるものであり、`paths` なしでは条件付きにならない。"]},{"id":"claudecode-25","type":"mc","chapterIndex":1,"stem":"モノレポの上位ディレクトリに他チームの CLAUDE.md があり、自分の作業には不要でノイズになっている。読み込ませないための設定として適切なのはどれか。","options":["`claudeMd` を空文字にする","`claudeMdExcludes` に指定する、そのパスやグロブを書く","`ignoreClaudeMd` を `true` にして、上位のものを無視する","`.gitignore` にそのパスを追加する"],"correctIndex":1,"explanations":["× `claudeMd` は managed settings の中でのみ有効なキーで、無効化のためのものではない。","○ `claudeMdExcludes` で、パスやグロブに一致する CLAUDE.md を読み込まないようにできる。ただし管理ポリシーの CLAUDE.md は除外できない。","× `ignoreClaudeMd` というキーは用意されていない。","× `.gitignore` は git の管理対象を決めるもので、Claude Code の読み込み対象には影響しない。"]},{"id":"claudecode-26","type":"mc","chapterIndex":1,"stem":"すでに CLAUDE.md があるプロジェクトで `/init` を実行した。どうなるか。","options":["既存の内容が、新しく生成された内容で上書きされる。変更履歴は残らない","既存の内容が `CLAUDE.md.bak` に退避され、新規作成される","既存のファイルは上書きされず、改善案が提示される","既存のファイルがあるため、エラーになり何も実行されない。先に削除する必要がある"],"correctIndex":2,"explanations":["× 上書きはされない。内容の改善は提案として示される。正しくは「既存のファイルは上書きされず」である。","× バックアップを自動で作って置き換える動作ではない。正しくは「既存のファイルは上書きされず」である。","○ `/init` は既存の CLAUDE.md があれば上書きせず、改善案を提示する。","× エラーで止まるのではなく、改善案の提示という形で動く。正しくは「既存のファイルは上書きされず」である。"]},{"id":"claudecode-27","type":"mc","chapterIndex":1,"stem":"自動メモリの `MEMORY.md` について、起動時に読み込まれる範囲の説明として正しいのはどれか。","options":["全文が、サイズに関係なく読み込まれる","先頭の 50 行までと、末尾の 50 行が読み込まれる","最近更新された 1 件分のメモだけが読み込まれる。残りは必要時に参照する","先頭の 200 行または 25KB のうち、先に達した方まで"],"correctIndex":3,"explanations":["× 上限があるため、全文が読まれるとは限らない。インデックスは簡潔に保つのが良い。","× 先頭と末尾を組み合わせるような読み込み方ではない。正しくは「先頭の 200 行または 25KB のうち」である。","× 最近更新したものを選ぶのではなく、先頭から上限まで読み込まれる。","○ 起動時に読み込まれるのは `MEMORY.md` の先頭 200 行または 25KB のうち、先に達した方までである。"]},{"id":"claudecode-28","type":"mc","chapterIndex":1,"stem":"自動メモリ（auto memory）をセッション単位で無効にしたい。環境変数として正しいものはどれか。","options":["`CLAUDE_CODE_DISABLE_AUTO_MEMORY=1`","`CLAUDE_CODE_NO_MEMORY=1` を設定すると、自動メモリが無効になる","`DISABLE_CLAUDE_MEMORY=true` を設定する","`CLAUDE_AUTO_MEMORY=off` を設定すると、自動メモリが無効になる"],"correctIndex":0,"explanations":["○ `CLAUDE_CODE_DISABLE_AUTO_MEMORY=1` で自動メモリを無効にできる。`/memory` での切替は `autoMemoryEnabled` に保存される。","× `CLAUDE_CODE_NO_MEMORY` という変数は用意されていない。","× `DISABLE_CLAUDE_MEMORY` という変数は用意されていない。","× `CLAUDE_AUTO_MEMORY` という変数は用意されていない。"]},{"id":"claudecode-29","type":"mc","chapterIndex":1,"stem":"`--add-dir` で追加した別ディレクトリにある CLAUDE.md を、既定のままでは読ませたいのに読まれていない。読み込ませるために必要なのはどれか。","options":["追加したディレクトリに `.claude/settings.json` を置く","環境変数 `CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1` を設定する","`--add-dir` を 2 回続けて指定する","起動後に `/init` を実行して再生成する"],"correctIndex":1,"explanations":["× 設定ファイルを置くだけでは、CLAUDE.md の読み込みは有効にならない。","○ `--add-dir` で追加したディレクトリの CLAUDE.md は既定では読まれず、この環境変数に 1 を設定すると読まれる。","× オプションを繰り返し指定しても、読み込みの挙動は変わらない。","× `/init` は CLAUDE.md の生成・改善用であり、追加ディレクトリの読み込みを切り替えるものではない。"]},{"id":"claudecode-30","type":"mc","chapterIndex":1,"stem":"「`.env` を絶対に編集させない」ことを確実に守らせたい。CLAUDE.md に書くだけで十分か。適切な考え方はどれか。","options":["十分である。CLAUDE.md に書いた禁止事項は、必ず強制される","`/memory` に同じ内容を書けば、強制力が加わる","十分ではない。CLAUDE.md は強制ではなくコンテキストなので、確実に止めるなら PreToolUse フックを使う","文頭に「IMPORTANT」を付ければ、必ず守られるようになる"],"correctIndex":2,"explanations":["× CLAUDE.md の指示は助言であり、強制ではない。","× `/memory` は CLAUDE.md や自動メモリを開いて編集するための入口で、強制力を与えるものではない。","○ CLAUDE.md の内容は「強制ではなくコンテキスト」であり、確実に止めたい操作には PreToolUse フックを使うよう勧められている。","× 「IMPORTANT」は強調の手段だが、多くの行に付けると効果が薄れる。確実に止める手段にはならない。"]},{"id":"claudecode-31","type":"mc","chapterIndex":2,"stem":"`--permission-mode` や `defaultMode` で、`default` と同じ意味の別名として使えるものはどれか。","options":["`standard` という名前で指定できる","`safe`","`ask`","`manual`"],"correctIndex":3,"explanations":["× `standard` という別名は用意されていない。正しくは「`manual`」である。","× `safe` という別名は用意されていない。正しくは「`manual`」である。","× `ask` はルールの種類（allow・ask・deny）に出てくる語だが、モード名の別名ではない。","○ `default`（UI では Manual と表示）は、`manual` という別名でも指定できる。"]},{"id":"claudecode-32","type":"mc","chapterIndex":2,"stem":"ファイルの編集は都度の確認なしで任せたい。ただし、それ以外の操作は通常どおり確認してほしい。最も近い権限モードはどれか。","options":["`acceptEdits`","`plan`","`dontAsk`","`bypassPermissions` モードにして確認を省く"],"correctIndex":0,"explanations":["○ `acceptEdits` は読み取りとファイル編集に加え、mkdir・touch・mv・cp などの一般的なファイル操作を確認なしで実行する。","× `plan` は計画を承認するまで編集を行わないモードで、編集を任せる用途とは逆である。","× `dontAsk` は確認が必要な操作をすべて拒否するモードで、編集を許可するものではない。","× `bypassPermissions` は全操作を確認なしにするため、「それ以外は確認する」という要件を満たさない。"]},{"id":"claudecode-33","type":"mc","chapterIndex":2,"stem":"大規模なリファクタリングに着手する前に、まずコードを読ませて方針を立てさせ、自分が承認するまでは一切編集させたくない。どのモードを使うか。","options":["`acceptEdits` モードにして、変更を随時確認する","`plan` モード。計画を承認するまでは編集されない","`dontAsk` モードにして、確認を省く","`default` モードで、読み取り専用のコマンドだけ許可する"],"correctIndex":1,"explanations":["× `acceptEdits` は編集を確認なしで実行するモードで、承認前の編集を防げない。","○ `plan` モードはファイルを読んで計画を立てるが、計画を承認するまで編集を行わない。","× `dontAsk` は確認が必要な操作をすべて拒否するモードで、計画を立てさせて承認する流れにはならない。","× `default` では編集の都度確認が出るが、計画の段階を踏ませて承認する仕組みではない。"]},{"id":"claudecode-34","type":"mc","chapterIndex":2,"stem":"CI 上で無人実行している。事前に許可したツールだけを動かし、それ以外で確認が必要になった操作は、止まらずに拒否してほしい。適切なモードはどれか。","options":["`default` モードのまま、確認に人が答えるのを待つ","`acceptEdits` モードにして、編集だけを自動で許可する","`dontAsk`","`bypassPermissions` モードにして、すべてを自動で許可する"],"correctIndex":2,"explanations":["× `default` では確認が必要な操作で入力待ちになり、無人実行が止まってしまう。","× `acceptEdits` は編集などを許可するモードで、「それ以外は拒否」にはならない。","○ `dontAsk` は確認が必要な操作をすべて拒否し、事前許可したツールだけを実行する。無人実行に向く。","× `bypassPermissions` は全操作を許可するモードで、ここでの要件と逆である。"]},{"id":"claudecode-35","type":"mc","chapterIndex":2,"stem":"`--dangerously-skip-permissions` と同等のモードと、その想定される使い方の組み合わせとして正しいのはどれか。","options":["`dontAsk` で、ローカルの開発機での日常的な利用向け","`acceptEdits` で、共有サーバー上での利用向け","`auto`","`bypassPermissions`"],"correctIndex":3,"explanations":["× `dontAsk` は確認が必要な操作を拒否するモードで、このフラグとは別物である。","× `acceptEdits` は確認を省く範囲が限定されており、このフラグとは別物である。","× `auto` はこのフラグと同等のモードではない。正しくは「`bypassPermissions`」である。","○ `--dangerously-skip-permissions` は `--permission-mode bypassPermissions` と同等で、ドキュメントは隔離されたコンテナや VM 向けと明記している。"]},{"id":"claudecode-36","type":"mc","chapterIndex":2,"stem":"`bypassPermissions` モードで起動している。`deny` ルールに `Bash(rm *)` を入れていた場合、`rm` は実行されるか。","options":["実行されない。deny ルールは全モードで有効である","実行される。このモードは deny ルールも含めて無視する","実行されるが、事前に一度だけ確認が出る","確認ダイアログが出て、承認すれば実行される"],"correctIndex":0,"explanations":["○ deny ルールは `bypassPermissions` を含むすべての権限モードで有効である。","× このモードでも deny は無視されない。正しくは「実行されない」である。","× 確認が出るのではなく、deny によって拒否される。正しくは「実行されない」である。","× deny ルールに一致した操作は、確認ダイアログを出さずに拒否される。承認で実行できるわけではない。"]},{"id":"claudecode-37","type":"mc","chapterIndex":2,"stem":"権限ルールの評価順として正しいものはどれか。","options":["allow、ask、deny の順に評価され、最後に一致したものが採用される","deny、ask、allow の順に評価され、最初に一致したものが結果を決める","ルールを書いた順に評価され、allow が 1 つでも一致すれば許可される。deny は参考扱いになる","ask は常に最優先で、deny と allow は 2 番目以降を同順位で評価する"],"correctIndex":1,"explanations":["× 評価順は逆であり、後勝ちでもない。正しくは「deny、ask、allow の順に評価され、最初に一致したものが結果を決める」である。","○ 権限ルールは deny → ask → allow の順に評価され、最初に一致したものが結果を決める。","× 書いた順ではなく、種類の順で評価される。deny が一致すれば allow があっても拒否になる。","× 最優先は deny であり、ask ではない。正しくは「deny、ask、allow の順に評価され、最初に一致したものが結果を決める」である。"]},{"id":"claudecode-38","type":"mc","chapterIndex":2,"stem":"`deny` に `Bash(aws *)` を入れたうえで、`allow` に `Bash(aws s3 ls)` を追加した。`aws s3 ls` はどうなるか。","options":["許可されて、実行できる","許可されるが、毎回確認が必要になる","許可されず、実行できない","ルールが矛盾するので、設定の読み込み時にエラーになる"],"correctIndex":2,"explanations":["× 狭いルールが優先されるという仕組みではない。正しくは「許可されず、実行できない」である。","× deny に一致するため、確認が出ることもなく拒否される。正しくは「許可されず、実行できない」である。","○ 広い deny（例 `Bash(aws *)`）は、より狭い allow（例 `Bash(aws s3 ls)`）で例外にできない。deny が先に評価されて一致する。","× 矛盾としてエラーになるのではなく、評価順に従って deny が採用される。"]},{"id":"claudecode-39","type":"mc","chapterIndex":2,"stem":"`Bash(ls *)` という allow ルールについて、正しい説明はどれか。","options":["`ls` 単体にはマッチせず、`ls -la` のように引数が付いたものだけにマッチする","`ls` で始まるコマンドすべてにマッチし、`lsof` も含まれる","`ls` と完全に一致する場合にだけマッチする。引数付きは対象外である","`ls` 単体にもマッチするが、`lsof` にはマッチしない"],"correctIndex":3,"explanations":["× `ls` 単体も対象に含まれる。正しくは「`ls` 単体にもマッチするが、`lsof` にはマッチしない」である。","× 空白を挟むため、`lsof` のような別コマンドは対象外である。","× 引数付きも対象になるので、完全一致だけではない。正しくは「`ls` 単体にもマッチするが、`lsof` にはマッチしない」である。","○ 末尾に空白付きで `*` を書くと接頭辞マッチになり、`ls` 単体にもマッチするが `lsof` にはマッチしない。"]},{"id":"claudecode-40","type":"mc","chapterIndex":2,"stem":"`Read` ルールのパスで、絶対パスを表す書き方として正しいのはどれか。","options":["`//` で始める（二重のスラッシュ）","`/` で始める。ファイルシステムのルートからの絶対パスとして扱われる","`~/` で始める。絶対パスとして扱われる（ホームを基準にしたパス）","`./` で始める"],"correctIndex":0,"explanations":["○ `//` は絶対パスを表す。`~/` はホーム相対、`/` は設定ファイル基準、`./` はカレントディレクトリ基準である。","× `/` で始めると設定ファイルを基準にした相対パスの扱いになる。","× `~/` はホームディレクトリからの相対パスである。正しくは「`//` で始める」である。","× `./` はカレントディレクトリからの相対パスである。正しくは「`//` で始める」である。"]},{"id":"claudecode-41","type":"mc","chapterIndex":2,"stem":"特定のディレクトリへの書き込みを禁止したいので、`permissions` に `Write(./secrets/**)` を deny として書いた。この設定について正しいのはどれか。","options":["そのとおりに機能し、`./secrets/` 以下への書き込みが拒否される","`Write` にパスのルールを書いても無視される","`Write` のパスルールは機能するが、`Glob` では機能しない","警告が出たうえで、`Edit(path)` に自動的に読み替えられる"],"correctIndex":1,"explanations":["× `Write` へのパスルールは無視されるので、期待した拒否にはならない。","○ ファイル権限は `Edit(path)` と `Read(path)` のルールだけが参照され、`Write` や `Glob` にパスのルールを書いても無視される。","× `Write` も `Glob` も、パスのルールは無視される点で同じである。","× 自動的な読み替えは行われない。ルール自体が参照されない。正しくは「`Write` にパスのルールを書いても無視される」である。"]},{"id":"claudecode-42","type":"mc","chapterIndex":2,"stem":"`allow` に `Bash(git add *)` だけを入れている。Claude が `git add . && git commit -m \"fix\"` を実行しようとした。どうなるか。","options":["`git add *` にマッチしているので、全体が許可される","`&&` の後ろは別の実行として扱われ、常に自動で許可される","`git commit` の部分にマッチする allow がないため、確認が必要になる","先頭のコマンドだけで判定されるため、確認なしで実行される"],"correctIndex":2,"explanations":["× 先頭だけでは判定されず、`git commit` も許可の対象になっていなければならない。","× 後続のサブコマンドが自動で許可されることはない。正しくは「`git commit` の部分にマッチする allow がないため、確認が必要になる」である。","○ 複合コマンドでは、`&&`・`||`・`;`・`|` などで区切った各サブコマンドが、allow ルールに個別にマッチする必要がある。","× 先頭だけで全体を判定する仕組みではなく、各サブコマンドが個別に判定される。"]},{"id":"claudecode-43","type":"mc","chapterIndex":2,"stem":"Bash サンドボックスが動作する環境として正しいのはどれか。","options":["macOS と ネイティブ Windows のみ。Linux では動作しない","Linux と ネイティブ Windows のみ","macOS・Linux・ネイティブ Windows のすべてで、追加のソフトウェアなしで動作する","macOS（Seatbelt）と Linux・WSL2（bubblewrap と socat が必要）。ネイティブ Windows では動作しない"],"correctIndex":3,"explanations":["× Linux・WSL2 でも動作し、ネイティブ Windows が非対応である。","× ネイティブ Windows は非対応である。","× ネイティブ Windows は非対応で、Linux では bubblewrap と socat が必要である。","○ サンドボックスは macOS（Seatbelt）と Linux・WSL2（bubblewrap と socat が必要）で動作し、ネイティブ Windows では動作せずコマンドはサンドボックスなしで実行される。"]},{"id":"claudecode-44","type":"mc","chapterIndex":2,"stem":"サンドボックスを有効にしたプロジェクトで、MCP サーバーやフックも含めたすべての処理が隔離されると考えてよいか。","options":["よくない。対象は Bash のシェルコマンドだけである","よい。ファイル編集ツール、MCP サーバー、フックもすべてサンドボックス内で動く","よいが、MCP サーバーだけは設定で除外できる","よくない。対象はファイル編集ツールだけで、Bash は含まれない"],"correctIndex":0,"explanations":["○ サンドボックスは Bash のシェルコマンドだけを対象とし、ファイル編集ツール・MCP サーバー・フックはその外で動く。","× MCP サーバーやフックなどは、サンドボックスの外で動く。正しくは「よくない。対象は Bash のシェルコマンドだけである」である。","× 除外の設定を用意するまでもなく、そもそも対象外である。正しくは「よくない。対象は Bash のシェルコマンドだけである」である。","× 対象は逆で、Bash のシェルコマンドが対象である。正しくは「よくない。対象は Bash のシェルコマンドだけである」である。"]},{"id":"claudecode-45","type":"mc","chapterIndex":2,"stem":"設定ファイルの `permissions.defaultMode` を `plan` にしている。ところが一時的に `claude --permission-mode acceptEdits` で起動した。このセッションの開始モードはどうなるか。","options":["`plan`","`acceptEdits`","`plan` と `acceptEdits` の両方の制限が適用される","起動時にエラーとなり、どちらのモードでも開始されない"],"correctIndex":1,"explanations":["× フラグは無視されず、設定より優先される。正しくは「`acceptEdits`」である。","○ `permissions.defaultMode` は既定の開始モードを決め、`--permission-mode` フラグがこれを上書きする。","× 両者を合成するのではなく、フラグの指定が採用される。正しくは「`acceptEdits`」である。","× 競合としてエラーになることはない。正しくは「`acceptEdits`」である。"]},{"id":"claudecode-46","type":"mc","chapterIndex":3,"stem":"設定の優先順位が最も高いものはどれか。","options":["コマンドラインの `--settings` で渡した設定","`.claude/settings.local.json` に書かれた個人設定","managed settings","`~/.claude/settings.json` に書かれたユーザー設定"],"correctIndex":2,"explanations":["× `--settings` は managed settings の次であり、最上位ではない。","× `.claude/settings.local.json` は `--settings` より下位である。","○ 優先順位は高い順に、managed settings、`--settings`、`.claude/settings.local.json`、`.claude/settings.json`、`~/.claude/settings.json` である。","× `~/.claude/settings.json` は最も下位である。"]},{"id":"claudecode-47","type":"mc","chapterIndex":3,"stem":"チーム全員に同じ許可ルール（`permissions`）を使わせたい。リポジトリに含めて共有する前提で、書く場所として最も適切なのはどれか。","options":["`.claude/settings.local.json` に書き、各自の環境に配る","`~/.claude/settings.json`","`CLAUDE.local.md`","`.claude/settings.json` に書き、バージョン管理に入れる"],"correctIndex":3,"explanations":["× `.claude/settings.local.json` は自分だけのプロジェクト設定で、共有されない。","× `~/.claude/settings.json` は自分の全プロジェクト向けの設定で、リポジトリで共有する仕組みではない。","× `CLAUDE.local.md` は個人用の指示を書くファイルで、権限ルールを置く場所ではない。","○ `.claude/settings.json` はプロジェクトの共有設定で、バージョン管理に入れてチームで共有する。"]},{"id":"claudecode-48","type":"mc","chapterIndex":3,"stem":"自分だけが使うプロジェクトの設定（共有しない）を置くファイルはどれか。","options":["`.claude/settings.local.json`","`.claude/settings.json` に、個人用であることを明記して書く","`~/.claude/settings.json`","`.claude/settings.private.json` という名前で作成する"],"correctIndex":0,"explanations":["○ `.claude/settings.local.json` は自分だけのプロジェクト設定で、共有されない。","× `.claude/settings.json` は共有用の設定ファイルである。","× `~/.claude/settings.json` は全プロジェクト向けで、パスを指定してプロジェクトごとに分ける用途のものではない。","× `settings.private.json` というファイルは用意されていない。"]},{"id":"claudecode-49","type":"mc","chapterIndex":3,"stem":"`~/.claude/settings.json` で `model` を設定し、プロジェクトの `.claude/settings.json` でも同じキーに別の値を設定した。このプロジェクトでは、どちらの値が使われるか。","options":["`~/.claude/settings.json` の値。ユーザー設定が常に優先される","プロジェクトの `.claude/settings.json` の値","両方の値を合成した値。配列のように結合される","最後に編集された方のファイルの値"],"correctIndex":1,"explanations":["× ユーザー設定は最下位のレベルであり、プロジェクト設定に負ける。正しくは「プロジェクトの `.claude/settings.json` の値」である。","○ 上位のレベルで設定されたキーは、下位レベルの同じキーを上書きする。`.claude/settings.json` は `~/.claude/settings.json` より上位である。","× 同じキーは上位のレベルの値で上書きされ、合成の対象ではない。正しくは「プロジェクトの `.claude/settings.json` の値」である。","× 編集時刻ではなく、レベルの優先順位で決まる。正しくは「プロジェクトの `.claude/settings.json` の値」である。"]},{"id":"claudecode-50","type":"mc","chapterIndex":3,"stem":"設定ファイルの `permissions` キーで設定できる内容として正しいのはどれか。","options":["使用するモデルとその推論の強さ","セッション開始時に実行するフックのコマンド","allow・ask・deny のルールと、開始時の権限モード","ステータスラインに表示するコマンド"],"correctIndex":2,"explanations":["× モデルは `model` キーで設定する。正しくは「allow・ask・deny のルールと、開始時の権限モード」である。","× フックは `hooks` キーで設定する。正しくは「allow・ask・deny のルールと、開始時の権限モード」である。","○ `permissions` キーは allow・ask・deny のルールと開始権限モードを設定する。","× ステータスラインは `statusLine` キーで設定する。正しくは「allow・ask・deny のルールと、開始時の権限モード」である。"]},{"id":"claudecode-51","type":"mc","chapterIndex":3,"stem":"すべてのセッションと、そこから起動されるサブプロセスに、特定の環境変数を設定したい。設定ファイルのどのキーを使うか。","options":["`environment` キーに書く","`shell` キーに書く","`variables` キーに書く","`env`"],"correctIndex":3,"explanations":["× `environment` というキーは用意されていない。正しくは「`env`」である。","× `shell` は環境変数を設定するキーではない。正しくは「`env`」である。","× `variables` というキーは用意されていない。正しくは「`env`」である。","○ `env` キーは、すべてのセッションとそのサブプロセスに環境変数を設定する。"]},{"id":"claudecode-52","type":"mc","chapterIndex":3,"stem":"`statusLine` を設定するときの形式として正しいのはどれか。","options":["`{\"type\": \"command\", \"command\": \"...\"}` で、スクリプトは stdin からセッションの JSON を受け取る","`{\"type\": \"text\", \"value\": \"...\"}` で、固定の文字列だけを表示する","`{\"type\": \"command\", \"command\": \"...\"}` で、スクリプトは環境変数からだけ情報を受け取る","`{\"type\": \"http\", \"url\": \"...\"}` で、Web API の応答を表示する"],"correctIndex":0,"explanations":["○ `statusLine` は `{\"type\": \"command\", \"command\": \"...\"}` の形式で、スクリプトは stdin からセッションの JSON を受け取る。","× `text` 型のような固定文字列の形式は挙げられていない。","× スクリプトに情報が渡されるのは stdin 経由の JSON である。","× `statusLine` の type として `http` が使えるとは示されていない。"]},{"id":"claudecode-53","type":"mc","chapterIndex":3,"stem":"`statusLine` の `refreshInterval` について、正しい説明はどれか。","options":["再実行の間隔をミリ秒で指定する。最小値は 100 である","再実行の間隔を秒で指定する。最小値は 1 である","再実行の間隔を分で指定する","再実行する回数の上限を指定する。最小値は 1 である"],"correctIndex":1,"explanations":["× 単位はミリ秒ではなく秒である。正しくは「再実行の間隔を秒で指定する」である。","○ `refreshInterval` は再実行の間隔を秒で指定し、最小値は 1 である。","× 単位は分ではなく秒である。正しくは「再実行の間隔を秒で指定する」である。","× 回数の上限ではなく、実行の間隔を指定する設定である。正しくは「再実行の間隔を秒で指定する」である。"]},{"id":"claudecode-54","type":"mc","chapterIndex":3,"stem":"`autoCompactWindow` の説明として正しいのはどれか。","options":["特定のモデルにのみ適用され、範囲は 1K〜10K トークンである","自動コンパクトを無効にするためのスイッチで、真偽値を受け付ける","全モデルに適用される自動コンパクトのウィンドウ設定で、受け付ける範囲は 100K〜1M トークンである","会話の保持日数を設定するキーで、日数を受け付ける"],"correctIndex":2,"explanations":["× 全モデルが対象で、範囲も 100K〜1M である。","× オン・オフを切り替えるのは `autoCompactEnabled` である。","○ `autoCompactWindow` は全モデルに適用される自動コンパクトのウィンドウ設定で、100K〜1M トークンを受け付ける。","× 文字起こしの保持日数は `cleanupPeriodDays` で設定する。"]},{"id":"claudecode-55","type":"mc","chapterIndex":3,"stem":"過去の会話の文字起こしを何日間保持するかを設定するキーはどれか。","options":["`transcriptRetention` キー","`historyDays` キー","`sessionTtl` キー","`cleanupPeriodDays`"],"correctIndex":3,"explanations":["× `transcriptRetention` というキーは用意されていない。","× `historyDays` というキーは用意されていない。正しくは「`cleanupPeriodDays`」である。","× `sessionTtl` というキーは用意されていない。正しくは「`cleanupPeriodDays`」である。","○ `cleanupPeriodDays` は文字起こしを保持する日数を設定する。"]},{"id":"claudecode-56","type":"mc","chapterIndex":3,"stem":"フックの不具合を切り分けるため、フックをまとめて無効にしたい。設定名と、一緒に無効になるものの組み合わせとして正しいのはどれか。","options":["`disableAllHooks` を設定すると、ステータスラインも無効になる。@ ファイル補完コマンドも対象になる","`disableHooks` を設定すると、スキルも無効になる","`disableAllHooks` を設定すると、MCP サーバーも無効になる","`allowManagedHooksOnly` を設定すると、ステータスラインも無効になる"],"correctIndex":0,"explanations":["○ `disableAllHooks` を設定すると、フック・ステータスライン・@ ファイル補完コマンドがすべて無効になる。","× `disableHooks` というキーは示されていない。正しくは「`disableAllHooks` を設定すると、ステータスラインも無効になる」である。","× 無効になるのはフック・ステータスライン・@ ファイル補完コマンドで、MCP サーバーは含まれない。","× `allowManagedHooksOnly` は組織が配布したフックだけを実行する設定で、ステータスラインを無効にするものではない。"]},{"id":"claudecode-57","type":"mc","chapterIndex":3,"stem":"一度きりの検証のため、設定ファイルを書き換えずに、そのセッションだけ設定を上書きしたい。使えるオプションはどれか。","options":["`--override` に、キーと値のペアを渡す","`--settings`","`--config-file` に、ファイルのパスだけを渡す","`--temp-settings` に、JSON 文字列だけを渡す"],"correctIndex":1,"explanations":["× `--override` というオプションは示されていない。正しくは「`--settings`」である。","○ `--settings` は設定 JSON のファイルまたはインライン JSON 文字列を受け取り、そのセッションだけ既存の設定を上書きする。","× `--config-file` というオプションは示されていない。","× `--temp-settings` というオプションは示されていない。"]},{"id":"claudecode-58","type":"mc","chapterIndex":3,"stem":"`--setting-sources` で指定できる値の組み合わせとして正しいのはどれか。","options":["`global`・`project`・`session`","`user`・`managed`・`enterprise`","`user`・`project`・`local`","`system`・`user`・`workspace`"],"correctIndex":2,"explanations":["× `global` や `session` は指定値として挙げられていない。","× `managed` や `enterprise` は、このオプションの指定値ではない。","○ `--setting-sources` は読み込む設定ソースを `user`・`project`・`local` から選んで制限する。","× `system` や `workspace` は、このオプションの指定値ではない。"]},{"id":"claudecode-59","type":"mc","chapterIndex":3,"stem":"`effortLevel` 設定が受け付ける値として正しいのはどれか。","options":["`low`・`medium`・`high`・`xhigh`・`max` のすべて（5 種類を受け付ける）","`low`・`high` の 2 種類だけ","`low`・`medium`・`high` の 3 種類だけで、`xhigh` も受け付けない","`low`・`medium`・`high`・`xhigh` で、`max` は受け付けない"],"correctIndex":3,"explanations":["× `max` は受け付けない。正しくは「`low`・`medium`・`high`・`xhigh`」である。","× `medium` と `xhigh` も受け付ける。正しくは「`low`・`medium`・`high`・`xhigh`」である。","× `xhigh` も受け付ける。正しくは「`low`・`medium`・`high`・`xhigh`」である。","○ `effortLevel` 設定は `low`・`medium`・`high`・`xhigh` を受け付けるが、`max` は受け付けない。"]},{"id":"claudecode-60","type":"mc","chapterIndex":3,"stem":"MCP サーバーの起動タイムアウトを制御する環境変数 `MCP_TIMEOUT` について、正しい説明はどれか。","options":["既定は 30 秒で、単位はミリ秒である","既定は 30 秒で、単位は秒である","既定は 600 秒で、単位は秒である","既定は 5 分で、単位は分である"],"correctIndex":0,"explanations":["○ `MCP_TIMEOUT` は MCP サーバーの起動タイムアウトを既定 30 秒で制御し、単位はミリ秒である。","× 既定の 30 秒は正しいが、値を指定するときの単位はミリ秒である。","× 既定値は 600 秒ではない。なお 600 秒はフックの `command` の既定タイムアウトである。","× 単位は分ではなくミリ秒である。正しくは「既定は 30 秒で、単位はミリ秒である」である。"]},{"id":"claudecode-61","type":"mc","chapterIndex":4,"stem":"`/clear` に名前を渡して実行した（例: `/clear 認証の調査`）。このとき何が起こるか。","options":["今の会話がその名前で要約され、要約が新しい会話の冒頭に入る","空のコンテキストで新しい会話が始まり、前の会話に `/resume` 用の名前が付く","今の会話の履歴が残ったまま、先頭の見出しだけがその名前になる","名前は無視され、前の会話は保存されずに破棄される"],"correctIndex":1,"explanations":["× 要約して引き継ぐのは `/compact` の働きである。正しくは「空のコンテキストで新しい会話が始まり、前の会話に `/resume` 用の名前が付く」である。","○ `/clear` は空のコンテキストで新しい会話を始める。名前を渡すと、前の会話に `/resume` 用の名前を付けられる。","× `/clear` では履歴を引き継がず、新しい会話になる。正しくは「空のコンテキストで新しい会話が始まり、前の会話に `/resume` 用の名前が付く」である。","× 名前は無視されず、前の会話の呼び出し名として使われる。正しくは「空のコンテキストで新しい会話が始まり、前の会話に `/resume` 用の名前が付く」である。"]},{"id":"claudecode-62","type":"mc","chapterIndex":4,"stem":"`/compact` に引数を付けて実行する場合の説明として正しいのはどれか。","options":["会話を要約せず、引数で指定した行数だけ古い履歴を削除する","会話を完全に破棄して、引数の内容で新しく会話を始める","会話を要約してコンテキストを空け、要約の焦点を指示として渡せる","要約の保存先ファイルを指定できる"],"correctIndex":2,"explanations":["× `/compact` は削除ではなく要約を行う。正しくは「会話を要約してコンテキストを空け、要約の焦点を指示として渡せる」である。","× 会話を破棄して新しく始めるのは `/clear` である。正しくは「会話を要約してコンテキストを空け、要約の焦点を指示として渡せる」である。","○ `/compact [instructions]` は会話を要約してコンテキストを空け、要約の焦点を指示で渡せる。","× 引数は保存先ではなく、要約で何に焦点を当てるかの指示である。正しくは「会話を要約してコンテキストを空け、要約の焦点を指示として渡せる」である。"]},{"id":"claudecode-63","type":"mc","chapterIndex":4,"stem":"セッションのコストとプランの利用状況を表示する `/usage` の別名として、正しい組み合わせはどれか。","options":["`/cost` と `/tokens` の 2 つ","`/billing` と `/stats` の 2 つ","`/limits` と `/tokens`","`/cost` と `/stats`"],"correctIndex":3,"explanations":["× `/cost` は別名だが、`/tokens` は別名として挙げられていない。","× `/stats` は別名だが、`/billing` は別名として挙げられていない。","× `/limits` も `/tokens` も別名として挙げられていない。","○ `/usage` はセッションのコストとプランの利用状況を表示し、`/cost` と `/stats` はその別名である。"]},{"id":"claudecode-64","type":"mc","chapterIndex":4,"stem":"現在のコンテキストの使用状況を、色付きのグリッドで視覚的に確認したい。使うコマンドはどれか。","options":["`/context`","`/memory` を実行する","`/hooks`","`/permissions` を実行する"],"correctIndex":0,"explanations":["○ `/context` は現在のコンテキスト使用量を色付きのグリッドで表示する。","× `/memory` は CLAUDE.md の編集と自動メモリのオン・オフを行うコマンドである。","× `/hooks` はフックの設定を表示するコマンドである。正しくは「`/context`」である。","× `/permissions` は allow・ask・deny のルールを対話的に管理するコマンドである。"]},{"id":"claudecode-65","type":"mc","chapterIndex":4,"stem":"「ログイン処理のリファクタリング方針を立てて」と依頼文を付けたまま、一気にプランモードに入りたい。使えるコマンドはどれか。","options":["`/plan` だけを実行して、改めて依頼を書く","`/plan` に続けて説明文を書く","`/mode plan` と実行する。入力欄から切り替える","`/think` に続けて説明文を書く"],"correctIndex":1,"explanations":["× `/plan` は説明文も一緒に渡せるので、改めて依頼を書く手間を省ける。","○ `/plan [description]` は、プロンプトから直接プランモードに入る。","× `/mode` というコマンドは示されていない。正しくは「`/plan` に続けて説明文を書く」である。","× `/think` はプランモードに入るコマンドとして挙げられていない。"]},{"id":"claudecode-66","type":"mc","chapterIndex":4,"stem":"作業の途中で、現在のセッションに別のディレクトリ（隣のリポジトリ）も読み書きの対象として追加したい。使えるコマンドはどれか。","options":["`/include \u003cpath>` を実行する","`/cd \u003cpath>` を実行する","`/add-dir \u003cpath>`","`/mount \u003cpath>`"],"correctIndex":2,"explanations":["× `/include` というコマンドは示されていない。正しくは「`/add-dir \u003cpath>`」である。","× `/cd` は作業ディレクトリを追加するコマンドとして挙げられていない。","○ `/add-dir \u003cpath>` は、現在のセッションに作業ディレクトリを追加する。","× `/mount` というコマンドは示されていない。正しくは「`/add-dir \u003cpath>`」である。"]},{"id":"claudecode-67","type":"mc","chapterIndex":4,"stem":"全プロジェクトで使える個人用のスキルを作る。置き場所として正しいのはどれか。","options":["`~/.claude/skills/\u003cskill-name>.md` に、1 ファイルで置く","`~/.claude/commands/\u003cskill-name>/SKILL.md`","`~/.claude/agents/\u003cskill-name>/SKILL.md` に置く","`~/.claude/skills/\u003cskill-name>/SKILL.md`"],"correctIndex":3,"explanations":["× スキルはディレクトリを作り、その中の `SKILL.md` に書く。","× `commands` ディレクトリは従来のコマンドの置き場所で、スキルの置き場所ではない。","× `agents` ディレクトリはサブエージェントの定義を置く場所である。","○ スキルは `~/.claude/skills/\u003cskill-name>/SKILL.md`（全プロジェクト）または `.claude/skills/\u003cskill-name>/SKILL.md`（プロジェクト）に置く。"]},{"id":"claudecode-68","type":"mc","chapterIndex":4,"stem":"プラグインに含まれるスキル `review` を呼び出すとき、プラグイン名が `my-plugin` なら、どの形で呼び出すか。","options":["`/my-plugin:review`","`/my-plugin.review` と、ドットでつなぐ","`/my-plugin/review` と、スラッシュでつなぐ","`/review` だけで、プラグイン名は不要である"],"correctIndex":0,"explanations":["○ プラグインのスキルは `/プラグイン名:スキル名` の形で呼び出す。","× 区切りはドットではなくコロンである。正しくは「`/my-plugin:review`」である。","× 区切りはスラッシュではなくコロンである。正しくは「`/my-plugin:review`」である。","× プラグイン由来のスキルは、プラグイン名を付けた形で呼び出す。正しくは「`/my-plugin:review`」である。"]},{"id":"claudecode-69","type":"mc","chapterIndex":4,"stem":"本番デプロイの手順をスキルにした。Claude が勝手に判断して実行しないよう、人が `/deploy` と入力したときだけ動かしたい。フロントマターにどう書くか。","options":["`user-invocable: false` を書く","`disable-model-invocation: true`","`allowed-tools: none` を書く","`context: fork` を書く"],"correctIndex":1,"explanations":["× `user-invocable: false` は逆に、`/` メニューから隠して Claude だけが呼び出せるようにする。","○ `disable-model-invocation: true` を付けると Claude は自動で読み込まず、ユーザーが `/name` で手動実行する。","× `allowed-tools` はスキル実行中に確認なしで許可するツールを指定するもので、呼び出し主体を制限しない。","× `context: fork` はスキルをサブエージェントで実行する設定である。"]},{"id":"claudecode-70","type":"mc","chapterIndex":4,"stem":"背景知識を提供するだけのスキルで、ユーザーが `/` メニューから直接呼ぶ必要はなく、Claude だけが必要に応じて使えばよい。適切な設定はどれか。","options":["`disable-model-invocation: true`","`context: fork`","`user-invocable: false`","`allowed-tools: Read`"],"correctIndex":2,"explanations":["× `disable-model-invocation: true` は逆に、Claude の自動呼び出しを止めて手動実行専用にする。","× `context: fork` はスキルをサブエージェントで実行する設定で、呼び出し主体は変わらない。","○ `user-invocable: false` を付けると `/` メニューから隠れ、Claude だけが呼び出せる。","× `allowed-tools` は確認なしで許可するツールの指定であり、`/` メニューの表示とは関係がない。"]},{"id":"claudecode-71","type":"mc","chapterIndex":4,"stem":"スキルのフロントマターの `allowed-tools` について、正しい説明はどれか。","options":["そのセッションが終わるまで、指定したツールが確認なしで許可され続ける","指定したツール以外は、スキルの実行中に使えなくなる","指定したツールは、スキルの実行後にグローバルの allow ルールへ追加される","そのスキルを呼び出したターンの間だけ、指定したツールが確認なしで許可される"],"correctIndex":3,"explanations":["× 許可はターンの間に限られ、セッション全体には及ばない。正しくは「そのスキルを呼び出したターンの間だけ、指定したツールが確認なしで許可される」である。","× 他のツールを使えなくする制限ではなく、確認を省く許可である。正しくは「そのスキルを呼び出したターンの間だけ、指定したツールが確認なしで許可される」である。","× 設定ファイルの allow ルールを書き換えることはない。正しくは「そのスキルを呼び出したターンの間だけ、指定したツールが確認なしで許可される」である。","○ `allowed-tools` は、そのスキルを呼び出したターンの間だけ指定ツールを確認なしで許可する。"]},{"id":"claudecode-72","type":"mc","chapterIndex":4,"stem":"大量のファイルを調べるスキルで、調べた過程はメインの会話に残さず、結果だけを受け取りたい。フロントマターに何を付けるか。","options":["`context: fork` を付ける","`context: inherit` を付ける","`isolation: worktree`","`background: true` を付けて、バックグラウンドで動かす"],"correctIndex":0,"explanations":["○ `context: fork` を付けるとスキルはサブエージェントで実行される。","× `context: inherit` という指定は示されていない。","× `isolation: worktree` はサブエージェントの設定で、スキルのフロントマターに書くものではない。","× `background: true` はサブエージェントの設定であり、スキルを別コンテキストで動かすものではない。"]},{"id":"claudecode-73","type":"mc","chapterIndex":4,"stem":"スキルの本文中の `$ARGUMENTS` は、実行時にどう扱われるか。","options":["最初の引数 1 つだけに置き換えられる","渡された引数の全文に置き換えられる","スキルの説明文（`description`）に置き換えられる","実行中のセッション ID に置き換えられる"],"correctIndex":1,"explanations":["× 1 つ目だけではなく、全文に置き換わる。正しくは「渡された引数の全文に置き換えられる」である。","○ スキル内の `$ARGUMENTS` は渡された引数の全文に置き換えられ、`$ARGUMENTS[N]` や `$N` で位置指定もできる。","× `description` に置き換わることはない。正しくは「渡された引数の全文に置き換えられる」である。","× セッション ID には置き換わらない。正しくは「渡された引数の全文に置き換えられる」である。"]},{"id":"claudecode-74","type":"mc","chapterIndex":4,"stem":"`.claude/commands/deploy.md` と `.claude/skills/deploy/SKILL.md` の両方が存在する。`/deploy` を実行したときはどうなるか。","options":["コマンドが優先され、スキルは無視される","競合のためエラーになり、どちらも実行されない","同名の場合はスキルが優先される","両方が順番に実行され、先にスキルが走る。コマンドはその後で動く"],"correctIndex":2,"explanations":["× 優先されるのはスキルのほうである。正しくは「同名の場合はスキルが優先される」である。","× エラーにはならず、スキルが採用される。正しくは「同名の場合はスキルが優先される」である。","○ `.claude/commands/deploy.md` と `.claude/skills/deploy/SKILL.md` はどちらも `/deploy` を作り、同名の場合はスキルが優先される。","× 両方が実行されるのではなく、優先される一方だけが使われる。正しくは「同名の場合はスキルが優先される」である。"]},{"id":"claudecode-75","type":"mc","chapterIndex":4,"stem":"`.claude/skills/code-review/SKILL.md` のフロントマターに `name` を書かなかった。`/` メニューに表示される名前はどうなるか。","options":["`SKILL.md` というファイル名がそのまま使われる","フロントマターがないため、スキルとして認識されず表示されない","本文の最初の見出しが名前として使われる","ディレクトリ名の `code-review` になる"],"correctIndex":3,"explanations":["× ファイル名ではなく、ディレクトリ名が使われる。正しくは「ディレクトリ名の `code-review` になる」である。","× `name` を省略してもスキルは認識され、ディレクトリ名で表示される。","× 本文の見出しではなく、ディレクトリ名が使われる。正しくは「ディレクトリ名の `code-review` になる」である。","○ SKILL.md のフロントマターの `name` は `/` メニューの名前になり、省略時はディレクトリ名になる。"]},{"id":"claudecode-76","type":"mc","chapterIndex":5,"stem":"`rm -rf` を含む Bash コマンドを、実行される前に確実に止めたい。どのフックイベントで、どう終了すればよいか。","options":["`PreToolUse` で、終了コード 2 を返す。実行前にブロックされる","`PostToolUse` で、終了コード 2 を返す","`PreToolUse` で、終了コード 1 を返す","`Stop` で、終了コード 0 を返す"],"correctIndex":0,"explanations":["○ `PreToolUse` はツール実行前に発火し、終了コード 2 でそのツール呼び出しをブロックする。","× `PostToolUse` はツールの成功後に発火するので、既に実行済みで止められない。","× 終了コード 2 以外の非ゼロ終了は非ブロッキングのエラーとなり、実行は続く。","× `Stop` は Claude が応答を終えたときに発火するもので、実行前の阻止には使えない。"]},{"id":"claudecode-77","type":"mc","chapterIndex":5,"stem":"`PostToolUse` フックが終了コード 2 で終了した。何が起こるか。","options":["ツールの実行が取り消され、変更が元に戻る","stderr が Claude に表示されるが、ツールは既に実行済みである","stderr は無視され、Claude には何も表示されない","セッション全体が強制終了される"],"correctIndex":1,"explanations":["× 実行済みのツールの結果が自動で取り消されることはない。正しくは「stderr が Claude に表示されるが、ツールは既に実行済みである」である。","○ `PostToolUse` はツールの成功後に発火する。終了コード 2 の stderr は Claude に表示されるが、ツールは既に実行済みである。","× stderr は Claude に表示される。正しくは「stderr が Claude に表示されるが、ツールは既に実行済みである」である。","× セッションが終了することはない。正しくは「stderr が Claude に表示されるが、ツールは既に実行済みである」である。"]},{"id":"claudecode-78","type":"mc","chapterIndex":5,"stem":"ユーザーのプロンプトを、Claude が処理を始める前に検査し、機密情報を含むものは弾きたい。どのイベントを使うか。","options":["`SessionStart`","`PreToolUse`","`UserPromptSubmit`","`PermissionRequest`"],"correctIndex":2,"explanations":["× `SessionStart` はセッション開始時に発火するもので、各プロンプトの検査用ではない。","× `PreToolUse` はツール呼び出しの前に発火するもので、プロンプト自体を検査するものではない。","○ `UserPromptSubmit` はプロンプトの送信直後、処理前に発火し、終了コード 2 でプロンプトをブロックする。","× `PermissionRequest` は権限確認が発生したときのイベントで、プロンプトの検査用ではない。"]},{"id":"claudecode-79","type":"mc","chapterIndex":5,"stem":"Claude が「完了しました」と応答を終えようとしたときに、テストが失敗していれば終わらせず、作業を続けさせたい。適切なのはどれか。","options":["`SubagentStop` フックで、終了コード 0 を返す","`SessionEnd` フックで、終了コード 2 を返す","`PostToolUse` フックで、終了コード 1 を返す","`Stop` フックで、終了コード 2 を返す"],"correctIndex":3,"explanations":["× `SubagentStop` はサブエージェントの停止時のイベントで、メインの応答の終了を止める用途ではない。","× `SessionEnd` はセッション終了時のイベントであり、会話を続けさせるものではない。","× 終了コード 1 は非ブロッキングのエラーとなり、実行は続くだけである。","○ `Stop` は Claude が応答を終えたときに発火し、終了コード 2 で停止を防いで会話を続けさせる。"]},{"id":"claudecode-80","type":"mc","chapterIndex":5,"stem":"`PermissionRequest` フックについて、正しい説明はどれか。","options":["終了コード 2 は無視され、許可・拒否は `decision` オブジェクトで返す","終了コード 2 で拒否、終了コード 0 で許可を表す","終了コード 2 で、確認ダイアログが人に再度表示される","終了コードは使わず、環境変数 `PERMISSION` に値を設定して返す"],"correctIndex":0,"explanations":["○ `PermissionRequest` では終了コード 2 は無視され、許可・拒否は `decision` オブジェクトで返す。","× 他のイベントのように、終了コードで許可・拒否を表すことはできない。","× 終了コード 2 に再表示の働きはなく、無視される。正しくは「終了コード 2 は無視され、許可・拒否は `decision` オブジェクトで返す」である。","× 環境変数で返すのではなく、`decision` オブジェクトを使う。"]},{"id":"claudecode-81","type":"mc","chapterIndex":5,"stem":"`SessionStart` フックのマッチャーで指定できる値の組み合わせとして正しいのはどれか。","options":["`start`・`stop`・`pause`・`resume`・`fork`（作業の一時停止を含む組）","`startup`・`resume`・`clear`・`compact`・`fork` の 5 種類","`startup`・`manual`・`auto`・`clear`・`end`","`new`・`continue`・`resume`・`compact`（時間経過を表す値が並ぶ）"],"correctIndex":1,"explanations":["× `stop`・`pause` などはマッチャーの値ではない。正しくは「`startup`・`resume`・`clear`・`compact`・`fork`」である。","○ `SessionStart` のマッチャーは `startup`・`resume`・`clear`・`compact`・`fork` である。","× `manual` と `auto` は `PreCompact` と `PostCompact` のマッチャーである。","× `new`・`continue`・`reset` などはマッチャーの値ではない。"]},{"id":"claudecode-82","type":"mc","chapterIndex":5,"stem":"コンパクトの直前に発火する `PreCompact` フックを、手動で `/compact` したときだけ動かしたい。マッチャーにはどれを指定するか。","options":["`user`","`command`","`manual`","`slash`"],"correctIndex":2,"explanations":["× `user` はマッチャーの値として挙げられていない。正しくは「`manual`」である。","× `command` はマッチャーの値として挙げられていない。正しくは「`manual`」である。","○ `PreCompact` と `PostCompact` のマッチャーは `manual` と `auto` である。手動実行は `manual`、自動コンパクトは `auto` である。","× `slash` はマッチャーの値として挙げられていない。正しくは「`manual`」である。"]},{"id":"claudecode-83","type":"mc","chapterIndex":5,"stem":"フックの `matcher` に `Edit|Write` と書いた。このマッチャーはどう解釈されるか。","options":["`|` を含むため、必ず JavaScript の正規表現として扱われる","文字列全体と完全一致した場合にだけ、マッチする","`*` を含まないため、どのツールにも一致しない","英数字と `|` だけなので、`Edit` または `Write` を表す名前のリストとして扱われる"],"correctIndex":3,"explanations":["× `|` だけなら正規表現ではなくリストとして扱われる。","× 全体の完全一致ではなく、`|` で区切った名前のいずれかに一致する。","× `*` は必須ではない。リストとして `Edit` または `Write` に一致する。","○ 英数字・`_`・`-`・空白・`,`・`|` だけなら、完全一致か名前のリストになる。それ以外の文字を含むと JavaScript の正規表現として扱われる。"]},{"id":"claudecode-84","type":"mc","chapterIndex":5,"stem":"フックの種類として正しい組み合わせはどれか。","options":["`command`・`http`・`mcp_tool`・`prompt`・`agent` の 5 種類","`command`・`script`・`webhook`・`prompt` の 4 種類","`command`・`http`・`prompt` の 3 種類","`shell`・`http`・`mcp_tool`・`agent`・`skill` の 5 種類"],"correctIndex":0,"explanations":["○ フックの種類は `command`・`http`・`mcp_tool`・`prompt`・`agent` の 5 種類である。","× `script` と `webhook` は種類として挙げられていない。","× 種類は 3 つではなく、`mcp_tool` と `agent` を加えた 5 種類である。","× `shell` と `skill` は種類として挙げられていない。"]},{"id":"claudecode-85","type":"mc","chapterIndex":5,"stem":"フックの既定のタイムアウトとして、正しい組み合わせはどれか。","options":["`command` は 30 秒、`prompt` は 60 秒、`agent` は 600 秒（`agent` が最長）","`command` は 600 秒、`prompt` は 30 秒、`agent` は 60 秒","`command` は 60 秒、`prompt` は 600 秒、`agent` は 30 秒（`prompt` が最長）","どれも 30 秒で共通。種類による違いはない"],"correctIndex":1,"explanations":["× 数字の対応が入れ替わっている。正しくは「`command` は 600 秒、`prompt` は 30 秒、`agent` は 60 秒」である。","○ `command` フックの既定タイムアウトは 600 秒、`prompt` は 30 秒、`agent` は 60 秒である。","× 数字の対応が入れ替わっている。正しくは「`command` は 600 秒、`prompt` は 30 秒、`agent` は 60 秒」である。","× 種類ごとに既定値が異なる。正しくは「`command` は 600 秒、`prompt` は 30 秒、`agent` は 60 秒」である。"]},{"id":"claudecode-86","type":"mc","chapterIndex":5,"stem":"`PreToolUse` フックのスクリプトが、標準入力から受け取る JSON に含まれる項目として正しいものはどれか。","options":["`command_name`・`command_args`・`command_id`","`tool`・`params`・`call_id`","`tool_name`・`tool_input`・`tool_use_id`","`function`・`arguments`・`request_id`"],"correctIndex":2,"explanations":["× `command_name` などの名前は使われていない。正しくは「`tool_name`・`tool_input`・`tool_use_id`」である。","× `tool`・`params`・`call_id` は項目名として挙げられていない。","○ `PreToolUse` の stdin には `tool_name`・`tool_input`・`tool_use_id` が含まれる。共通フィールドには `session_id`・`transcript_path`・`cwd` などがある。","× `function`・`arguments`・`request_id` は項目名として挙げられていない。"]},{"id":"claudecode-87","type":"mc","chapterIndex":5,"stem":"フックが終了コード 0 で終了し、標準出力に単一の JSON オブジェクトを出した。どう扱われるか。","options":["常にプレーンテキストとして扱われる","JSON は無視され、終了コードだけが使われる","JSON であっても、`stderr` に出した場合のみ解析される","JSON として解析される"],"correctIndex":3,"explanations":["× 単一の JSON オブジェクトであれば、プレーンテキストではなく JSON として解析される。","× 終了コードだけでなく、JSON の内容も解析されて利用される。正しくは「JSON として解析される」である。","× 解析の対象は stdout であり、stderr ではない。正しくは「JSON として解析される」である。","○ 終了コード 0 のとき、stdout が単一の JSON オブジェクトならそれが解析され、そうでなければプレーンテキストとして扱われる。"]},{"id":"claudecode-88","type":"mc","chapterIndex":5,"stem":"フックのスクリプトが終了コード 1 で終了した。実行はどうなるか。","options":["非ブロッキングのエラーになる。実行は続く","ブロッキングエラーとなり、ツール呼び出しが拒否される","終了コード 2 と同じ扱いになり、プロンプトが拒否される","セッションが強制終了され、再開できなくなる"],"correctIndex":0,"explanations":["○ 終了コード 2 以外の非ゼロ終了は非ブロッキングのエラーとなり、実行は続く。","× ブロックされるのは終了コード 2 のときである。正しくは「非ブロッキングのエラーになる」である。","× 終了コード 1 は 2 と同じ扱いにはならない。正しくは「非ブロッキングのエラーになる」である。","× セッションが終了することはない。正しくは「非ブロッキングのエラーになる」である。"]},{"id":"claudecode-89","type":"mc","chapterIndex":5,"stem":"「編集のたびに毎回、例外なくフォーマッタを実行したい」。この要件に最も適した方法はどれか。","options":["`CLAUDE.md` に「必ず実行する」と書く","フックで実行する。決定論的に毎回動かせる","`/memory` に実行手順を書き留める","プロンプトの先頭に毎回「フォーマッタを実行して」と付ける"],"correctIndex":1,"explanations":["× CLAUDE.md は助言であり、必ず実行される保証はない。正しくは「フックで実行する」である。","○ ベストプラクティスは「毎回例外なく必ず起きるべき動作」にはフックを使うよう勧め、CLAUDE.md は助言であると位置づけている。","× `/memory` に書いても強制力は生まれず、助言にとどまる。","× 毎回付ける運用は漏れやすく、決定論的な仕組みではない。正しくは「フックで実行する」である。"]},{"id":"claudecode-90","type":"mc","chapterIndex":5,"stem":"フック定義の `if` フィールドについて、正しい説明はどれか。","options":["正規表現の構文で条件を書け、すべてのイベントで使える","JavaScript の式で条件を書け、`SessionStart` でのみ使える","パーミッションルールの構文で条件を書け、ツール系のイベントでのみ使える","環境変数の値で条件を書け、`command` 型のフックでのみ使える"],"correctIndex":2,"explanations":["× 正規表現を書くのはマッチャーの話であり、`if` はパーミッションルールの構文である。また使えるのはツール系イベントに限られる。","× `if` は JavaScript の式ではなく、パーミッションルールの構文を使う。","○ `if` フィールドにはパーミッションルールの構文を書け、ツール系イベントでのみ使える。","× 環境変数の値で判定するものではなく、`command` 型に限られるわけでもない。"]},{"id":"claudecode-91","type":"mc","chapterIndex":6,"stem":"全プロジェクトで使える、自分専用のサブエージェントの定義を置く場所はどれか。","options":["`~/.claude/subagents/` ディレクトリ","`~/.claude/skills/agents/` ディレクトリ","`~/agents/` ディレクトリ","`~/.claude/agents/`"],"correctIndex":3,"explanations":["× `subagents` というディレクトリ名ではない。正しくは「`~/.claude/agents/`」である。","× `skills` 配下はスキルの置き場所で、サブエージェント用ではない。","× ホーム直下の `agents` ではなく、`~/.claude/` の下に置く。","○ サブエージェントの定義は `.claude/agents/`（プロジェクト）または `~/.claude/agents/`（全プロジェクト）に置く。"]},{"id":"claudecode-92","type":"mc","chapterIndex":6,"stem":"同じ名前のサブエージェントが、プロジェクトの `.claude/agents/` と `~/.claude/agents/` の両方に定義されている。どちらが使われるか。","options":["プロジェクトの `.claude/agents/` のもの","`~/.claude/agents/` のもの。ユーザー定義が常に優先される","先に作られたほうのもの","両方が合成され、フィールドごとに新しいほうが採用される"],"correctIndex":0,"explanations":["○ 優先順位は managed settings、`--agents` フラグ、`.claude/agents/`、`~/.claude/agents/`、プラグインの `agents/` の順である。","× ユーザー定義はプロジェクト定義よりも下位である。正しくは「プロジェクトの `.claude/agents/` のもの」である。","× 作成の先後ではなく、置き場所の優先順位で決まる。正しくは「プロジェクトの `.claude/agents/` のもの」である。","× 合成はされず、優先順位の高いものが使われる。正しくは「プロジェクトの `.claude/agents/` のもの」である。"]},{"id":"claudecode-93","type":"mc","chapterIndex":6,"stem":"サブエージェント定義のフロントマターで、必須の項目はどれか。","options":["`name` と `tools` の 2 つ","`name` と `description` の 2 つ","`name`・`description`・`model` の 3 つ","`description` のみで、`name` はファイル名から決まる"],"correctIndex":1,"explanations":["× `tools` は省略でき、省略すると継承する。正しくは「`name` と `description` の 2 つ」である。","○ 必須のフロントマターは `name` と `description` の 2 つである。","× `model` は必須ではない。正しくは「`name` と `description` の 2 つ」である。","× `name` も必須である。正しくは「`name` と `description` の 2 つ」である。"]},{"id":"claudecode-94","type":"mc","chapterIndex":6,"stem":"サブエージェントの `name` に使えない形式はどれか。","options":["英小文字とハイフンだけで 20 文字の名前","数字を含む名前","`-` で始まる名前","英小文字と `_` だけでできた名前"],"correctIndex":2,"explanations":["× 20 文字は 256 文字以内であり、ハイフンを含んでも先頭でなければ問題ない。","× 数字を含むこと自体は制約に含まれない。正しくは「`-` で始まる名前」である。","○ `name` は 256 文字以内で、`:` を含まず、`-` で始めてはならない。","× `_` の使用は制約に含まれない。正しくは「`-` で始まる名前」である。"]},{"id":"claudecode-95","type":"mc","chapterIndex":6,"stem":"調査用のサブエージェントに、ファイルを書き換える権限だけを持たせたくない。ほかのツールは継承のままにしたい。最も適した設定はどれか。","options":["`tools` に読み取り系のツールをすべて書く","`permissionMode` を `plan` にして、親の設定と無関係に固定する","`maxTurns` を 1 にして、1 回しか動かせないようにする","`disallowedTools` で書き込み系のツールを取り除く"],"correctIndex":3,"explanations":["× `tools` は許可するツールを列挙する allowlist で、省略すると継承する。一部だけ除きたいなら denylist の `disallowedTools` のほうが簡潔である。","× `permissionMode` は親が `bypassPermissions` などのときは親の設定が優先されるため、確実な制限にならない。","× `maxTurns` は最大ターン数の上限であり、ツールの制限とは関係がない。","○ `disallowedTools` は継承または指定されたツール一覧から取り除く denylist で、他は継承のままにできる。"]},{"id":"claudecode-96","type":"mc","chapterIndex":6,"stem":"サブエージェントの `model` に指定できる値として、正しい組み合わせはどれか。","options":["`sonnet`・`opus`・`haiku`・`fable`・完全なモデル ID・`inherit`","`small`・`medium`・`large`・`inherit` のみ","`fast`・`smart`・`default` のみ","完全なモデル ID のみで、エイリアスは使えない"],"correctIndex":0,"explanations":["○ `model` には `sonnet`・`opus`・`haiku`・`fable`・完全なモデル ID・`inherit` を指定できる。","× `small` などのサイズ名は指定値ではない。","× `fast`・`smart` などは指定値ではない。","× エイリアスも指定でき、完全な ID だけに限られない。"]},{"id":"claudecode-97","type":"mc","chapterIndex":6,"stem":"サブエージェントの `permissionMode` を `default` にしたが、親セッションは `bypassPermissions` で動いている。サブエージェントの権限はどうなるか。","options":["サブエージェントの `default` が優先され、確認が必要になる","親の `bypassPermissions` が優先される","両者のうち厳しいほうが自動的に選ばれる","エラーになり、サブエージェントは起動できない"],"correctIndex":1,"explanations":["× 親が `bypassPermissions` のときは親の設定が優先される。","○ `permissionMode` はサブエージェントの権限モードを設定するが、親が `bypassPermissions`・`acceptEdits`・auto のときは親の設定が優先される。","× 厳しいほうを選ぶ仕組みではなく、親の設定が優先される。正しくは「親の `bypassPermissions` が優先される」である。","× エラーにはならず、親の設定が使われる。正しくは「親の `bypassPermissions` が優先される」である。"]},{"id":"claudecode-98","type":"mc","chapterIndex":6,"stem":"サブエージェントが `maxTurns` の上限に達した。その出力はどう扱われるか。","options":["失敗として破棄され、再開もできない","自動的に上限が倍に引き上げられ、そのまま完了する","partial として扱われ、再開できる","最後のターンの出力だけが返され、再開はできない"],"correctIndex":2,"explanations":["× 破棄されず、partial の出力として残る。正しくは「partial として扱われ、再開できる」である。","× 上限が自動で引き上げられることはない。正しくは「partial として扱われ、再開できる」である。","○ `maxTurns` は最大のエージェントターン数で、上限に達した出力は partial として扱われ、再開できる。","× 再開できる点が重要である。正しくは「partial として扱われ、再開できる」である。"]},{"id":"claudecode-99","type":"mc","chapterIndex":6,"stem":"サブエージェントのフロントマターの `skills` について、正しい説明はどれか。","options":["起動時にスキル名の一覧だけを読み込む","必要になった時点でスキルを遅延読み込みする。件数に上限はない","スキルの全文を読み込むが、指定できるのは 1 件だけである","起動時に指定したスキルの全文を読み込む"],"correctIndex":3,"explanations":["× 一覧だけではなく全文を読み込む。正しくは「起動時に指定したスキルの全文を読み込む」である。","× 遅延読み込みではなく、起動時に全文を読み込み、上限もある。正しくは「起動時に指定したスキルの全文を読み込む」である。","× 1 件だけに限られず、最大 32 件である。正しくは「起動時に指定したスキルの全文を読み込む」である。","○ `skills` は起動時に指定したスキルの全文を読み込み、最大 32 件まで指定できる。"]},{"id":"claudecode-100","type":"mc","chapterIndex":6,"stem":"サブエージェントが、会話をまたいで学びを蓄積できるようにしたい。フロントマターのどれを使うか。","options":["`memory`","`persist: true` を指定する","`remember` に保存先のパスを指定する","`history` に保持するターン数を指定する"],"correctIndex":0,"explanations":["○ `memory` は `user`・`project`・`local` の永続メモリスコープを指定し、Read・Write・Edit ツールを有効にする。","× `persist` というフィールドは示されていない。正しくは「`memory`」である。","× `remember` というフィールドは示されていない。正しくは「`memory`」である。","× `history` というフィールドは示されていない。正しくは「`memory`」である。"]},{"id":"claudecode-101","type":"mc","chapterIndex":6,"stem":"複数のサブエージェントが同時に同じファイル群を編集して衝突することを避けたい。サブエージェントのフロントマターに何を書くか。","options":["`isolation: sandbox`","`isolation: worktree`","`isolation: copy`","`background: true`"],"correctIndex":1,"explanations":["× `sandbox` という値は示されていない。正しくは「`isolation: worktree`」である。","○ `isolation: worktree` を付けると、サブエージェントは一時的な git worktree の中で実行される。","× `copy` という値は示されていない。正しくは「`isolation: worktree`」である。","× `background: true` はバックグラウンドで動かす設定で、作業ツリーを分離するものではない。"]},{"id":"claudecode-102","type":"mc","chapterIndex":6,"stem":"サブエージェントのフロントマターに `background: true` を書いた。この設定の効果として正しいのはどれか。","options":["Claude が前景での実行を求めたときは、前景に切り替わる","メインの会話から完全に切り離され、結果が戻らなくなる","Claude が前景での実行を求めても、バックグラウンドのまま動く","親セッションが終了するまで、必ず停止しない"],"correctIndex":2,"explanations":["× 前景での実行を求められても、前景には切り替わらない。正しくは「Claude が前景での実行を求めても、バックグラウンドのまま動く」である。","× 結果を返さなくなる設定ではない。正しくは「Claude が前景での実行を求めても、バックグラウンドのまま動く」である。","○ `background: true` を付けると、Claude が前景実行を求めてもサブエージェントはバックグラウンドのままになる。","× 寿命を延ばす設定ではなく、実行の前景・背景を固定する設定である。"]},{"id":"claudecode-103","type":"mc","chapterIndex":6,"stem":"特定のセッションだけで一時的にサブエージェントを定義したい。ディスクにファイルは残したくない。使える方法はどれか。","options":["`.claude/agents/` に作成して、使い終わったら削除する","`--temp-agent` フラグに Markdown を渡す","`--subagents` フラグに Markdown ファイルのパスを渡す","`--agents` フラグに JSON で定義を渡す"],"correctIndex":3,"explanations":["× ファイルを作ってから削除する方法も可能だが、ディスクに残さない目的には `--agents` が適している。","× `--temp-agent` というフラグは示されていない。正しくは「`--agents` フラグに JSON で定義を渡す」である。","× `--subagents` というフラグは示されていない。ディスクに残さずに定義できるのは、JSON を渡す `--agents` フラグである。","○ `--agents` フラグは JSON で定義するサブエージェントで、そのセッションだけ有効でディスクには保存されない。"]},{"id":"claudecode-104","type":"mc","chapterIndex":6,"stem":"組み込みのサブエージェント Explore の特徴として正しいのはどれか。","options":["読み取り専用で、Write と Edit が拒否される","調査と変更の両方ができ、すべてのツールを持つ","計画を立てるためだけに存在し、ファイルの読み取りもできない","常に最も小さいモデルで動作し、設定を変更できない"],"correctIndex":0,"explanations":["○ Explore は読み取り専用で、Write と Edit が拒否される。","× 調査と変更の両方に使えるのは general-purpose である。","× Plan はプランモードで使われる読み取り専用のエージェントだが、ファイルの読み取りはできる。","× 使うモデルを固定するという記述はない。正しくは「読み取り専用で、Write と Edit が拒否される」である。"]},{"id":"claudecode-105","type":"mc","chapterIndex":6,"stem":"多数のファイルを横断して読む必要のある調査を、メインの会話のコンテキストを圧迫せずに行いたい。ベストプラクティスに沿った進め方はどれか。","options":["メインの会話で、関係するファイルをすべて `@` で読み込ませる","サブエージェントに調べさせ、要約だけを返させる","`/compact` を 10 回続けて実行しながら、メインで調べる","`bypassPermissions` モードに切り替えて、速度を上げる"],"correctIndex":1,"explanations":["× すべてを `@` で読み込むとコンテキストが一気に埋まってしまう。","○ 大量のファイルを読む調査をサブエージェントに任せ、要約だけを返させると、メインのコンテキストを守れる。","× 圧縮を繰り返しても、調査の読み込み自体がメインのコンテキストを使う点は変わらない。","× 権限モードは調査の量やコンテキストの消費とは無関係である。正しくは「サブエージェントに調べさせ、要約だけを返させる」である。"]},{"id":"claudecode-106","type":"mc","chapterIndex":7,"stem":"リモートの HTTP 型 MCP サーバーを追加するコマンドとして正しいのはどれか。","options":["`claude mcp add --type remote \u003cname> \u003curl>` のように書く","`claude mcp install http \u003cname> \u003curl>` のように書く（インストール型）","`claude mcp add --transport http \u003cname> \u003curl>`","`claude mcp connect \u003curl> --as \u003cname>`"],"correctIndex":2,"explanations":["× `--type remote` というオプションは示されていない。","× `mcp install` というサブコマンドは示されていない。","○ HTTP 型のリモートサーバーは `claude mcp add --transport http \u003cname> \u003curl>` で追加する。","× `mcp connect` というサブコマンドは示されていない。"]},{"id":"claudecode-107","type":"mc","chapterIndex":7,"stem":"ローカルで動く stdio 型の MCP サーバーを環境変数付きで追加するときの書式として正しいのはどれか。","options":["`claude mcp add --transport http \u003cname> --env KEY=value -- \u003ccommand>` のように、`stdio` ではなく `http` を指定する","`claude mcp add --transport local \u003cname> -- \u003ccommand> [args...]` のように、`stdio` ではなく `local` を指定する","`claude mcp add --transport stdio \u003cname> --url \u003ccommand>` のように、コマンドを URL として渡す","`claude mcp add --transport stdio \u003cname> --env KEY=value -- \u003ccommand> [args...]`"],"correctIndex":3,"explanations":["× `http` はリモートサーバーを URL で追加するトランスポートで、コマンドを起動するローカルサーバーには `stdio` を指定する。","× stdio のトランスポート名は `local` ではなく `stdio` である。","× stdio 型は URL ではなく、起動するコマンドを `--` の後ろに書く。","○ stdio 型は `--env KEY=value` を指定し、`--` の後ろにサーバーを起動するコマンドと引数を書く。"]},{"id":"claudecode-108","type":"mc","chapterIndex":7,"stem":"`--transport` の値について、正しい説明はどれか。","options":["`http`（リモートで推奨）・`sse`（非推奨）・`stdio` があり、`ws` は `.mcp.json` か `claude mcp add-json` でのみ設定できる","`http`・`sse`・`stdio`・`ws` のすべてが `claude mcp add` で指定でき、`sse` が推奨である","`stdio` と `http` の 2 つだけで、`sse` や `ws` はサポートされない","`http` は非推奨で、リモートには `sse` を使うべきである"],"correctIndex":0,"explanations":["○ `http` はリモートで推奨、`sse` は非推奨、`stdio` はローカル用で、`ws` は `.mcp.json` か `add-json` でのみ設定できる。","× `sse` は非推奨であり、`ws` は `add` では指定できない。","× `sse` と `ws` も扱えるが、`ws` は設定方法が限られる。","× 推奨と非推奨が逆である。"]},{"id":"claudecode-109","type":"mc","chapterIndex":7,"stem":"複雑な設定（ヘッダーやタイムアウトなど）を持つ MCP サーバーを、JSON でまとめて追加したい。使えるコマンドはどれか。","options":["`claude mcp import \u003cfile>.json`","`claude mcp add-json \u003cname> '\u003cjson>'` を実行する","`claude mcp add --json \u003cname> \u003cfile>`","`claude mcp load \u003cname> '\u003cjson>'` を実行する"],"correctIndex":1,"explanations":["× `mcp import` というサブコマンドは示されていない。正しくは「`claude mcp add-json \u003cname> '\u003cjson>'`」である。","○ `claude mcp add-json \u003cname> '\u003cjson>'` は JSON を指定してサーバーを追加する。","× `--json` というオプションは示されていない。正しくは「`claude mcp add-json \u003cname> '\u003cjson>'`」である。","× `mcp load` というサブコマンドは示されていない。正しくは「`claude mcp add-json \u003cname> '\u003cjson>'`」である。"]},{"id":"claudecode-110","type":"mc","chapterIndex":7,"stem":"MCP のスコープについて、正しい説明はどれか。","options":["`global`（既定）・`project`・`session` の 3 種類がある","`project`（既定）・`user` の 2 種類だけである","`local`（既定）・`project`・`user` の 3 種類がある","`local`・`project`・`user`・`managed` の 4 種類があり、既定は `user` である"],"correctIndex":2,"explanations":["× `global` と `session` はスコープの名前ではない。","× `local` を加えた 3 種類で、既定も `local` である。","○ MCP のスコープは `local`（既定）・`project`・`user` の 3 種類である。","× `managed` はスコープとして挙げられておらず、既定も `user` ではない。"]},{"id":"claudecode-111","type":"mc","chapterIndex":7,"stem":"個人的に試している MCP サーバーを、今のプロジェクトでだけ自分用に使いたい。チームには共有しない。既定のスコープでは、設定はどこに保存されるか。","options":["プロジェクトルートの `.mcp.json`","`.claude/settings.json`","`~/.claude/mcp/` ディレクトリ配下","`~/.claude.json` の、プロジェクトのパスの下"],"correctIndex":3,"explanations":["× `.mcp.json` は `project` スコープの保存先で、チームと共有される。","× MCP の `local` スコープの保存先は `.claude/settings.json` ではない。","× `~/.claude/mcp/` ディレクトリは保存先として挙げられていない。","○ `local` スコープは現在のプロジェクトだけで使われ、自分専用で、`~/.claude.json` にプロジェクトのパスの下に保存される。"]},{"id":"claudecode-112","type":"mc","chapterIndex":7,"stem":"チーム全員が同じ MCP サーバーを使えるように、バージョン管理で共有したい。どのスコープを選ぶか。","options":["`project` スコープ","`local` スコープ","`user` スコープ。全プロジェクトで読み込まれる","`team` スコープ"],"correctIndex":0,"explanations":["○ `project` スコープはプロジェクトルートの `.mcp.json` に保存され、バージョン管理でチームと共有される。","× `local` は自分専用で、チームには共有されない。正しくは「`project` スコープ」である。","× `user` は自分の全プロジェクトで読み込まれるスコープで、チーム共有の仕組みではない。","× `team` というスコープは示されていない。正しくは「`project` スコープ」である。"]},{"id":"claudecode-113","type":"mc","chapterIndex":7,"stem":"同じ名前の MCP サーバーが `local`・`project`・`user` の各スコープに別々の内容で定義されている。どうなるか。","options":["`user` のものが優先され、`project` と `local` は無視される","`local` のものが優先され、フィールドは統合されず 1 つの定義全体が採用される","3 つの定義がフィールドごとに統合される","エラーになり、サーバーが起動しない"],"correctIndex":1,"explanations":["× 優先されるのは `local` である。正しくは「`local` のものが優先され、フィールドは統合されず 1 つの定義全体が採用される」である。","○ 優先順位は local、project、user、プラグイン提供、claude.ai コネクタの順で、フィールドは統合されず 1 つの定義全体が採用される。","× フィールドごとの統合は行われない。正しくは「`local` のものが優先され、フィールドは統合されず 1 つの定義全体が採用される」である。","× エラーにはならず、優先順位の高い定義が採用される。正しくは「`local` のものが優先され、フィールドは統合されず 1 つの定義全体が採用される」である。"]},{"id":"claudecode-114","type":"mc","chapterIndex":7,"stem":"`.mcp.json` に MCP サーバーを書くとき、トップレベルのキーは何か。","options":["`servers`","`mcp`","`mcpServers`","`tools`"],"correctIndex":2,"explanations":["× `servers` ではなく `mcpServers` である。","× `mcp` ではなく `mcpSer
