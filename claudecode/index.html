vers` である。","○ `.mcp.json` のトップレベルキーは `mcpServers` である。","× `tools` はトップレベルキーではない。正しくは「`mcpServers`」である。"]},{"id":"claudecode-115","type":"mc","chapterIndex":7,"stem":"リポジトリの `.mcp.json` にあるサーバーを、初めて使おうとした。何が起こるか。また、過去の承認の選択をやり直すにはどうするか。","options":["承認なしで自動的に接続され、設定ファイルを編集しないとやり直せない","承認が必要だが、一度許可すると取り消せない","承認は不要だが、`/mcp` から接続を切るたびにリセットされる","使用前に対話的な承認が必要で、`claude mcp reset-project-choices` でリセットできる"],"correctIndex":3,"explanations":["× 自動では接続されず、承認が必要である。","× 承認はリセットできる。","× 承認は必要で、リセットも専用コマンドでできる。","○ `.mcp.json` のプロジェクトサーバーは使用前に対話的な承認が必要で、`claude mcp reset-project-choices` で承認をリセットできる。"]},{"id":"claudecode-116","type":"mc","chapterIndex":7,"stem":"`.mcp.json` で環境変数を展開する書き方と、使える場所の説明として正しいのはどれか。","options":["`${VAR}` と `${VAR:-default}` が、`command`・`args`・`env`・`url`・`headers` で使える","`$VAR` と `%VAR%` が、`command` でのみ使える","`%{VAR}%` が、`env` と `headers` でのみ使える","環境変数の展開には対応しておらず、値は直接書く必要がある"],"correctIndex":0,"explanations":["○ `.mcp.json` では `${VAR}` と `${VAR:-default}` による環境変数の展開が、`command`・`args`・`env`・`url`・`headers` で使える。","× `$VAR` や `%VAR%` の形式、`command` のみという限定は示されていない。","× `%{VAR}%` の形式は示されていない。","× 展開に対応しており、既定値の指定もできる。"]},{"id":"claudecode-117","type":"mc","chapterIndex":7,"stem":"MCP ツールの実行結果が 50,000 文字を超えた。どう扱われるか。","options":["先頭の 50,000 文字だけが切り詰められて返され、残りは捨てられる","結果はファイルに保存される","エラーになり、ツールの実行が失敗扱いになる","結果は自動的に要約されてから返される"],"correctIndex":1,"explanations":["× 切り捨てるのではなく、ファイルに保存される。正しくは「結果はファイルに保存される」である。","○ ツールの結果が 50,000 文字を超えると、結果はファイルに保存される。","× エラーにはならない。正しくは「結果はファイルに保存される」である。","× 要約されるとは示されていない。保存されたファイルが使われる。正しくは「結果はファイルに保存される」である。"]},{"id":"claudecode-118","type":"mc","chapterIndex":7,"stem":"MCP サーバーを多数登録しているが、ツール定義がコンテキストを圧迫しないか心配だ。既定の動作として正しいのはどれか。","options":["起動時にすべてのツール定義の全文がコンテキストに入る","ツール名も含めて、使うまで一切コンテキストに入らない（定義は呼び出し時に初めて渡される）","ツール定義は遅延読み込みされ、必要になるまでツール名だけがコンテキストに入る","ツール定義は 10 個まで読み込まれ、それ以降は無視される"],"correctIndex":2,"explanations":["× 全文が起動時に入るわけではない。正しくは「ツール定義は遅延読み込みされ、必要になるまでツール名だけがコンテキストに入る」である。","× ツール名は入る。正しくは「ツール定義は遅延読み込みされ、必要になるまでツール名だけがコンテキストに入る」である。","○ MCP のツール定義は既定で遅延読み込みされ、Claude が必要とするまでツール名だけがコンテキストに入る。","× 個数で打ち切る仕組みではない。正しくは「ツール定義は遅延読み込みされ、必要になるまでツール名だけがコンテキストに入る」である。"]},{"id":"claudecode-119","type":"mc","chapterIndex":7,"stem":"`/mcp` コマンドの説明として正しいのはどれか。","options":["MCP サーバーの追加と削除だけを行い、接続状態は表示しない","MCP サーバーのログを `.mcp.json` に書き出す。接続状態は表示しない","サーバーのツール一覧を JSON ファイルとして保存する","接続状態を表示し、リモートサーバーの OAuth 認証を開始する"],"correctIndex":3,"explanations":["× 追加・削除は `claude mcp add`・`remove` で行う。`/mcp` は接続状態の確認が主である。","× ログを `.mcp.json` に書き出す機能は示されていない。","× ツール一覧を JSON に保存する機能は示されていない。正しくは「接続状態を表示し、リモートサーバーの OAuth 認証を開始する」である。","○ `/mcp` は接続状態を表示し、リモートサーバーの OAuth 認証を開始する。"]},{"id":"claudecode-120","type":"mc","chapterIndex":7,"stem":"今回の実行では、`--mcp-config` で指定した MCP 設定だけを使い、ほかの場所で定義されたサーバーは使いたくない。どう指定するか。","options":["`--mcp-config` と `--strict-mcp-config` を組み合わせる","`--mcp-config` だけを指定する。他の設定は自動で無視される","`--only-mcp` を指定する","`ENABLE_CLAUDEAI_MCP_SERVERS=false` だけを設定する"],"correctIndex":0,"explanations":["○ `--mcp-config` と `--strict-mcp-config` を組み合わせると、指定した MCP 設定だけを使える。","× `--mcp-config` だけでは、他の設定も有効のままである。","× `--only-mcp` というオプションは示されていない。正しくは「`--mcp-config` と `--strict-mcp-config` を組み合わせる」である。","× `ENABLE_CLAUDEAI_MCP_SERVERS=false` は claude.ai コネクタを無効にするもので、他の設定の無視ではない。"]},{"id":"claudecode-121","type":"mc","chapterIndex":8,"stem":"認証機能の実装が終わった。次は、まったく関係のない帳票の不具合修正に取りかかる。同じセッションで続けたとき起こる問題と、対処として適切なのはどれか。","options":["問題はないので、そのまま続ける。古い履歴が多いほど精度が上がる","古いコンテキストがトークンを浪費するので、`/clear` で新しく始める","`/compact` を 1 回実行すれば、古い履歴は完全に消える","`/usage` を実行すると、古い履歴がリセットされる"],"correctIndex":1,"explanations":["× コンテキストが埋まるほど性能が落ちるため、履歴が多いほど良いとは言えない。","○ 無関係なタスクの切り替えでは `/clear` を使い、古いコンテキストがトークンを浪費しないようにする。","× `/compact` は要約であって完全な消去ではなく、要約は残る。無関係な作業には `/clear` が向く。","× `/usage` はコストや利用状況を表示するコマンドで、履歴をリセットしない。"]},{"id":"claudecode-122","type":"mc","chapterIndex":8,"stem":"長時間の作業でコンテキストが埋まってきた。ただし、直前に決めた設計方針だけは要約に確実に残したい。どう実行するか。","options":["`/clear` で一度空にしてから、設計方針を最初に書き直す","`/context` を実行して、不要な部分を自動削除する","`/compact` に、設計方針を重視する指示を付けて実行する","`/memory` で自動メモリを無効にしてから実行する"],"correctIndex":2,"explanations":["× `/clear` は会話を完全に捨てるため、方針は自分で書き直す必要があり、要約の焦点を指定する手段ではない。","× `/context` は使用量を表示するコマンドで、自動削除はしない。","○ `/compact [instructions]` は会話を要約してコンテキストを空け、要約の焦点を指示で渡せる。","× `/memory` は CLAUDE.md や自動メモリを編集・切替するもので、要約の内容には関与しない。"]},{"id":"claudecode-123","type":"mc","chapterIndex":8,"stem":"自動コンパクトの動作として正しいのはどれか。","options":["会話が 1 時間続くたびに、一定間隔で必ず実行される","コンテキストが空になったときだけ実行される","ユーザーが `/compact` を実行したときだけ働く","コンテキストがウィンドウの上限に近づくと、会話履歴を要約して空きを作る"],"correctIndex":3,"explanations":["× 時間間隔ではなく、コンテキストの量に応じて働く。正しくは「コンテキストがウィンドウの上限に近づくと、会話履歴を要約して空きを作る」である。","× 空になったときではなく、上限に近づいたときに働く。正しくは「コンテキストがウィンドウの上限に近づくと、会話履歴を要約して空きを作る」である。","× 手動の `/compact` とは別に、自動でも実行される。正しくは「コンテキストがウィンドウの上限に近づくと、会話履歴を要約して空きを作る」である。","○ 自動コンパクトは、コンテキストがウィンドウの上限に近づくと会話履歴を要約して空きを作る。"]},{"id":"claudecode-124","type":"mc","chapterIndex":8,"stem":"自動コンパクトのウィンドウが、コマンド・フラグ・設定ファイル・環境変数のすべてで別々の値に指定されている。最終的に優先されるのはどれか。","options":["環境変数 `CLAUDE_CODE_AUTO_COMPACT_WINDOW`","コマンド（`/autocompact`）での指定","`--settings` で渡したフラグの指定","設定ファイルの `autoCompactWindow` の指定"],"correctIndex":0,"explanations":["○ 環境変数 `CLAUDE_CODE_AUTO_COMPACT_WINDOW` は、コマンド・フラグ・設定より優先される。","× コマンドでの指定は、環境変数に負ける。正しくは「環境変数 `CLAUDE_CODE_AUTO_COMPACT_WINDOW`」である。","× フラグでの指定は、環境変数に負ける。正しくは「環境変数 `CLAUDE_CODE_AUTO_COMPACT_WINDOW`」である。","× 設定ファイルの値は、環境変数に負ける。正しくは「環境変数 `CLAUDE_CODE_AUTO_COMPACT_WINDOW`」である。"]},{"id":"claudecode-125","type":"mc","chapterIndex":8,"stem":"`/usage` の Session ブロックについて、定額プランを使っている場合の注意として正しいのはどれか。","options":["表示される費用は、毎月の請求額と必ず一致する。定額プランでも同じである","API トークンの使用量と概算の費用が出る","定額プランでは、`/usage` は使用できない（API キー利用時のみ使える）","表示されるのは費用だけで、トークン数は出ない"],"correctIndex":1,"explanations":["× 金額は推定であり、請求額と一致するとは限らない。正しくは「API トークンの使用量と概算の費用が出る」である。","○ `/usage` の Session ブロックは API トークンの使用量と概算の費用を表示し、定額プランでは課金上の意味がないと注記されている。","× 定額プランでも使用でき、課金上の意味がないという注記がつくだけである。","× トークンの使用量も表示される。正しくは「API トークンの使用量と概算の費用が出る」である。"]},{"id":"claudecode-126","type":"mc","chapterIndex":8,"stem":"`/usage` に表示される金額は、既定ではどのように計算されているか。","options":["サーバー側の実際の請求データを取得した確定値である","契約単価が自動的に検出され、常に反映される","リスト価格によるローカルでの推定値で、`modelPricing` が設定された場合のみ契約単価で計算される","トークン数のみで、金額は計算されない"],"correctIndex":2,"explanations":["× 確定値ではなく、ローカルでの推定値である。","× 契約単価は、`modelPricing` を設定しない限り反映されない。","○ 金額は既定ではリスト価格で計算されたローカル推定値で、管理者が `modelPricing` を設定した場合のみ契約単価で計算される。","× 金額も推定として計算されて表示される。"]},{"id":"claudecode-127","type":"mc","chapterIndex":8,"stem":"セッション中に `/clear` を実行した。`/usage` に表示されるセッションの合計費用はどうなるか。","options":["そのまま累積され、リセットされない","前の会話分だけが引かれる","月初からの累計に置き換わる","0 にリセットされる"],"correctIndex":3,"explanations":["× `/clear` で新しい会話になるため、累積されない。正しくは「0 にリセットされる」である。","× 差し引きではなく、0 にリセットされる。","× 累計表示に切り替わるのではなく、0 になる。正しくは「0 にリセットされる」である。","○ `/clear` を実行すると、`/usage` のセッション合計費用は 0 にリセットされる。"]},{"id":"claudecode-128","type":"mc","chapterIndex":8,"stem":"プロンプトキャッシュの既定の寿命として、正しい組み合わせはどれか。","options":["API キーやクラウドプロバイダーでは 5 分、サブスクリプションでは 1 時間","API キーでは 1 時間、サブスクリプションでは 5 分","どちらも 24 時間","どちらも 1 分"],"correctIndex":0,"explanations":["○ プロンプトキャッシュの寿命は、API キーやクラウドプロバイダーでは既定 5 分、サブスクリプションでは 1 時間である。","× 5 分と 1 時間の対応が逆である。正しくは「API キーやクラウドプロバイダーでは 5 分、サブスクリプションでは 1 時間」である。","× 24 時間ではない。正しくは「API キーやクラウドプロバイダーでは 5 分、サブスクリプションでは 1 時間」である。","× 1 分ではない。正しくは「API キーやクラウドプロバイダーでは 5 分、サブスクリプションでは 1 時間」である。"]},{"id":"claudecode-129","type":"mc","chapterIndex":8,"stem":"昼休みで 1 時間以上席を外した後、同じ長いセッションに戻って最初のメッセージを送ったら、いつもより費用が高かった。説明として正しいのはどれか。","options":["長く放置したセッションには、追加の待機料金が課金されるため","キャッシュが切れた後の最初のメッセージは、全コンテキストを再処理するため高くなる","メッセージが長かったため、必ず高くなる","席を外している間、コンテキストが 2 倍に増えるため"],"correctIndex":1,"explanations":["× 待機料金のような仕組みは示されていない。正しくは「キャッシュが切れた後の最初のメッセージは、全コンテキストを再処理するため高くなる」である。","○ 長時間のセッションでキャッシュが切れた後の最初のメッセージは、全コンテキストを再処理するためコストが高くなる。","× メッセージの長さではなく、キャッシュが切れたことが原因である。正しくは「キャッシュが切れた後の最初のメッセージは、全コンテキストを再処理するため高くなる」である。","× 席を外している間にコンテキストが増えることはない。正しくは「キャッシュが切れた後の最初のメッセージは、全コンテキストを再処理するため高くなる」である。"]},{"id":"claudecode-130","type":"mc","chapterIndex":8,"stem":"`claude -p` の実行内で `/model` を使ってモデルを切り替えた。この切り替えの扱いとして正しいのはどれか。","options":["既定のモデルとして保存され、次回以降も使われる","エラーになり、`-p` では `/model` を使えない","そのセッションだけに効き、既定としては保存されない","同じディレクトリのすべてのセッションに即座に反映される"],"correctIndex":2,"explanations":["× 保存されるのは対話モードでの `/model \u003cname>` であり、`-p` 内ではない。","× `/model` を使うことは可能で、そのセッションにだけ効く。","○ `/model \u003cname>` は既定として保存されるが、`-p` 実行内の `/model` はそのセッションだけに効く。","× 他のセッションには反映されない。正しくは「そのセッションだけに効き、既定としては保存されない」である。"]},{"id":"claudecode-131","type":"mc","chapterIndex":8,"stem":"モデルエイリアス `opusplan` の動作として正しいのはどれか。","options":["plan モードでは sonnet に、実行時には opus に切り替える。実行の段階に強いモデルを使う","常に opus を使い、plan モードのときだけ速度を落とす","plan モードでは haiku を使い、実行時には opus に切り替える","plan モードでは opus に、実行時には sonnet に切り替える"],"correctIndex":3,"explanations":["× モデルの割り当てが逆である。正しくは「plan モードでは opus を使い」である。","× 常に opus というわけではなく、実行時は sonnet である。","× plan モードで使うのは haiku ではなく opus である。","○ `opusplan` は plan モードでは opus を使い、実行時には sonnet に切り替える。"]},{"id":"claudecode-132","type":"mc","chapterIndex":8,"stem":"`/effort auto` を実行した。どうなるか。","options":["保存済みの effort の指定が解除される","effort が最大の `max` に固定される","effort が最小の `low` に固定される。以後は変更できない","effort の指定にかかわらず、拡張思考が無効になる"],"correctIndex":0,"explanations":["○ `/effort` の値は `low`・`medium`・`high`・`xhigh`・`max`・`auto` で、`auto` は保存済みの指定を解除する。","× `max` に固定するのは `max` を指定したときである。正しくは「保存済みの effort の指定が解除される」である。","× `low` に固定するのは `low` を指定したときである。正しくは「保存済みの effort の指定が解除される」である。","× 拡張思考の無効化とは関係がない。正しくは「保存済みの effort の指定が解除される」である。"]},{"id":"claudecode-133","type":"mc","chapterIndex":8,"stem":"サブエージェントやチームメイトが使う既定のモデルを、環境変数で指定したい。どの変数を使うか。","options":["`CLAUDE_CODE_AGENT_MODEL`","`CLAUDE_CODE_SUBAGENT_MODEL`","`SUBAGENT_DEFAULT_MODEL`","`CLAUDE_SUBAGENT_MODEL_ID`"],"correctIndex":1,"explanations":["× `CLAUDE_CODE_AGENT_MODEL` は示されていない。","○ 環境変数 `CLAUDE_CODE_SUBAGENT_MODEL` は、サブエージェントやチームメイトの既定モデルを指定する。","× `SUBAGENT_DEFAULT_MODEL` は示されていない。","× `CLAUDE_SUBAGENT_MODEL_ID` は示されていない。"]},{"id":"claudecode-134","type":"mc","chapterIndex":8,"stem":"ファイル検索や単純な整形だけを行うサブエージェントのコストを抑えたい。適切な方法はどれか。","options":["すべてのサブエージェントを `model: opus` にする","`maxTurns` を大きくして、一度で終わらせる","そのサブエージェントに `model: haiku` を指定する","`isolation: worktree` を指定して、処理を軽くする"],"correctIndex":2,"explanations":["× `opus` は複雑な設計判断向けで、単純な作業にはコストが過剰である。","× `maxTurns` は上限であり、大きくするほどコストが減るものではない。","○ サブエージェントの単純な作業では `model: haiku` を指定してコストを抑えられる。","× `isolation: worktree` は作業ツリーの分離であり、コスト削減とは関係がない。"]},{"id":"claudecode-135","type":"mc","chapterIndex":8,"stem":"環境変数 `MAX_THINKING_TOKENS` について、正しい説明はどれか。","options":["すべてのモデルで、出力の最大トークン数を設定する","会話全体のコンテキストウィンドウの大きさを設定する","サブエージェントのターン数の上限を設定する","固定の思考予算を持つモデルで上限を設定し、適応型推論のモデルでは無視される"],"correctIndex":3,"explanations":["× 出力全体ではなく、思考に使うトークンの上限である。正しくは「固定の思考予算を持つモデルで上限を設定し、適応型推論のモデルでは無視される」である。","× コンテキストウィンドウの大きさではなく、思考の予算である。正しくは「固定の思考予算を持つモデルで上限を設定し、適応型推論のモデルでは無視される」である。","× ターン数の上限は `maxTurns` で設定する。正しくは「固定の思考予算を持つモデルで上限を設定し、適応型推論のモデルでは無視される」である。","○ `MAX_THINKING_TOKENS` は固定の思考予算を持つモデルで上限を設定し、適応型推論のモデルでは無視される。"]},{"id":"claudecode-136","type":"mc","chapterIndex":9,"stem":"`claude --worktree feature-x`（または `-w`）を実行した。隔離された作業ツリーは、どこに作られるか。","options":["`\u003crepo>/.claude/worktrees/feature-x/`","`\u003crepo>/../feature-x/` という親ディレクトリ","`~/.claude/worktrees/feature-x/` というホーム配下","`\u003crepo>/.git/worktrees/feature-x/` という git の管理領域"],"correctIndex":0,"explanations":["○ `claude --worktree \u003cname>` は `\u003crepo>/.claude/worktrees/\u003cname>/` に隔離された worktree を作って Claude を起動する。","× 親ディレクトリではなく、リポジトリ内の `.claude/worktrees/` に作られる。","× ホーム配下ではなく、リポジトリ内に作られる。正しくは「`\u003crepo>/.claude/worktrees/feature-x/`」である。","× `.git/` の管理領域ではなく、`.claude/worktrees/` に作られる。"]},{"id":"claudecode-137","type":"mc","chapterIndex":9,"stem":"`claude --worktree feature-x` で作られる worktree のブランチ名はどれか。","options":["`feature-x` そのもの","`worktree-feature-x`","`claude/feature-x`","`wt/feature-x`"],"correctIndex":1,"explanations":["× 指定した名前そのものではなく、`worktree-` が付く。正しくは「`worktree-feature-x`」である。","○ 作られる worktree のブランチ名は `worktree-\u003cname>` になる。","× `claude/` で始まる形式ではない。正しくは「`worktree-feature-x`」である。","× `wt/` で始まる形式ではない。正しくは「`worktree-feature-x`」である。"]},{"id":"claudecode-138","type":"mc","chapterIndex":9,"stem":"GitHub の PR #1234 の内容を、手元で隔離して確認しながら作業したい。使えるコマンドはどれか。","options":["`claude --pr 1234 --checkout` で隔離する","`claude --worktree \"pr:1234\"` と書く","`claude --worktree \"#1234\"`","`claude --review 1234`"],"correctIndex":2,"explanations":["× `--pr` と `--checkout` の組み合わせは示されていない。","× `pr:1234` という書式は示されていない。正しくは「`claude --worktree \"#1234\"`」である。","○ `claude --worktree \"#1234\"` は PR #1234 を `origin` から取得し、`.claude/worktrees/pr-1234` に worktree を作る。","× `--review` というオプションは示されていない。正しくは「`claude --worktree \"#1234\"`」である。"]},{"id":"claudecode-139","type":"mc","chapterIndex":9,"stem":"worktree で作業を始めたら、`.env` が存在せず、アプリが起動しなかった。`.env` は `.gitignore` に入っている。新しい worktree にも自動でコピーされるようにするには、どうするか。","options":["`.gitignore` から `.env` を外してコミットする","`CLAUDE.md` に「`.env` をコピーする」と書く。次回から自動で複製される","`worktree.baseRef` を `head` にすることで、ローカルのファイルを引き継ぐ","`.worktreeinclude` に `.env` を書く"],"correctIndex":3,"explanations":["× `.env` をコミットするのは、機密情報の取り扱いとして適切でない。","× CLAUDE.md の記述は助言で、コピーを実行する仕組みではない。","× `baseRef` は worktree の作成元を決める設定で、ファイルのコピーとは関係がない。","○ `.worktreeinclude` は gitignore の構文で書き、一致し、かつ gitignore されたファイルを新しい worktree にコピーする。"]},{"id":"claudecode-140","type":"mc","chapterIndex":9,"stem":"`worktree.baseRef` の説明として正しいのはどれか。","options":["`\"fresh\"`（既定）はリモートのデフォルトブランチから、`\"head\"` は現在のローカル HEAD から作る","`\"fresh\"` は現在のローカル HEAD から、`\"head\"` はリモートのデフォルトブランチから作る","`\"fresh\"` は空のリポジトリから、`\"head\"` は直前のコミットから作る","`\"fresh\"` は既定で、`\"head\"` は `main` ブランチから作る"],"correctIndex":0,"explanations":["○ `\"fresh\"`（既定）ならリモートのデフォルトブランチから、`\"head\"` なら現在のローカル HEAD から worktree を作る。","× 対応が逆である。","× `fresh` は空のリポジトリを作る意味ではない。","× `head` は `main` ブランチを指す値ではない。"]},{"id":"claudecode-141","type":"mc","chapterIndex":9,"stem":"worktree で作業してセッションを終了した。変更を一切加えていなかった場合、worktree はどうなるか。","options":["保持され、手動で削除するまで残る","自動で削除される","保持するか削除するかを、必ず尋ねられる","`.claude/worktrees/` の外に退避される"],"correctIndex":1,"explanations":["× 変更がなければ手動での削除は不要である。正しくは「自動で削除される」である。","○ 終了時、変更がない worktree は自動で削除され、変更がある場合は保持するか削除するかを尋ねられる。","× 尋ねられるのは、変更がある場合である。正しくは「自動で削除される」である。","× 退避される仕組みは示されていない。正しくは「自動で削除される」である。"]},{"id":"claudecode-142","type":"mc","chapterIndex":9,"stem":"`.claude/worktrees/` について、ドキュメントが推奨していることはどれか。","options":["`.gitattributes` で LFS の対象にする","`CLAUDE.md` から参照する","`.gitignore` に入れる","`settings.json` の `permissions` で読み取りを拒否する"],"correctIndex":2,"explanations":["× LFS の対象にする推奨は示されていない。正しくは「`.gitignore` に入れる」である。","× CLAUDE.md から参照する推奨は示されていない。正しくは「`.gitignore` に入れる」である。","○ `.claude/worktrees/` を `.gitignore` に入れることが推奨されている。","× 読み取りを拒否する推奨は示されていない。正しくは「`.gitignore` に入れる」である。"]},{"id":"claudecode-143","type":"mc","chapterIndex":9,"stem":"`/install-github-app` の説明として正しいのはどれか。","options":["GitHub Enterprise Server でもそのまま動作する","ローカルで動作し、GitHub とは通信せずに設定を作る","実行に GitHub CLI は不要で、ブラウザだけで完結する","GitHub App・シークレット・ワークフロー用の PR を設定するコマンドで、github.com のリポジトリだけで動作する"],"correctIndex":3,"explanations":["× github.com のリポジトリだけで動作する。","× GitHub と連携して設定を行う。","× GitHub CLI（`gh`）が必要である。","○ `/install-github-app` は GitHub App・シークレット・ワークフロー用の PR を設定し、github.com のリポジトリだけで動作する。実行には `gh` が必要で、`gh auth login` で認証しておく。"]},{"id":"claudecode-144","type":"mc","chapterIndex":9,"stem":"GitHub Actions で Claude Code を動かす、公式のアクションの名前はどれか。","options":["`anthropics/claude-code-action`","`anthropic/claude-action`","`claude-code/github-action`","`anthropics/claude-actions-runner`"],"correctIndex":0,"explanations":["○ 公式アクションは `anthropics/claude-code-action` である。","× `anthropic/claude-action` ではない。正しくは「`anthropics/claude-code-action`」である。","× `claude-code/github-action` ではない。","× `claude-actions-runner` ではない。正しくは「`anthropics/claude-code-action`」である。"]},{"id":"claudecode-145","type":"mc","chapterIndex":9,"stem":"対話モードで GitHub Actions を使うとき、issue や PR のコメントに何を書くと Claude が反応するか。","options":["`/claude` から始まるコメント","`@claude`（既定のトリガーフレーズ）","`#claude` を含むコメント","`@anthropic` を含むコメント"],"correctIndex":1,"explanations":["× `/claude` ではない。正しくは「`@claude`（既定のトリガーフレーズ）」である。","○ 対話モードでは、issue や PR のコメントに含まれる `@claude`（既定のトリガーフレーズ）に反応する。","× `#claude` ではない。正しくは「`@claude`（既定のトリガーフレーズ）」である。","× `@anthropic` ではない。正しくは「`@claude`（既定のトリガーフレーズ）」である。"]},{"id":"claudecode-146","type":"mc","chapterIndex":9,"stem":"GitHub Actions で、サブスクリプションの認証を使いたい。ローカルで長期のトークンを作るコマンドと、Actions に登録するシークレット名の組み合わせとして正しいのはどれか。","options":["`claude login --ci` で作り、`ANTHROPIC_API_KEY` に登録する","`claude auth token` で作り、`GITHUB_TOKEN` に登録する","`claude setup-token` で作り、`CLAUDE_CODE_OAUTH_TOKEN` に登録する","`claude setup-token` で作り、`ANTHROPIC_API_KEY` に登録する"],"correctIndex":2,"explanations":["× `claude login --ci` というコマンドは示されていない。API キーなら `ANTHROPIC_API_KEY` を使う。","× `claude auth token` や `GITHUB_TOKEN` の組み合わせは示されていない。","○ `claude setup-token` は CI 用の長期 OAuth トークンを生成し、保存せずに端末へ表示する。サブスクリプションのトークンは `CLAUDE_CODE_OAUTH_TOKEN` を使う。","× トークンの作成は合っているが、`ANTHROPIC_API_KEY` は API キー用であり、OAuth トークンの登録先ではない。"]},{"id":"claudecode-147","type":"mc","chapterIndex":9,"stem":"GitHub Actions のワークフローで、既定の GitHub App 認証を使うために必要と記載されている権限はどれか。","options":["`contents: admin` の権限を付与する（リポジトリ管理者権限）","`secrets: write`","`actions: manage` の権限を付与する（ワークフロー管理用）","`id-token: write` の権限を付与する"],"correctIndex":3,"explanations":["× `contents: admin` は示されていない。正しくは「`id-token: write`」である。","× `secrets: write` は示されていない。正しくは「`id-token: write`」である。","× `actions: manage` は示されていない。正しくは「`id-token: write`」である。","○ ワークフローには `id-token: write` の権限が必要と記載されている（既定の GitHub App 認証に必要）。"]},{"id":"claudecode-148","type":"mc","chapterIndex":9,"stem":"GitHub Actions で `prompt` 入力を指定したワークフローは、どのように動くか。","options":["`@claude` を待たずに、指定内容で実行される自動化モードになる","`@claude` のコメントがあったときだけ、実行される","指定しても無視され、常に対話モードになる","手動でワークフローを承認するまで、実行されない"],"correctIndex":0,"explanations":["○ `prompt` 入力を省略すると対話モードになり、指定すると `@claude` を待たずに実行される自動化モードになる。","× コメントを待つのは省略時の対話モードである。正しくは「`@claude` を待たずに、指定内容で実行される自動化モードになる」である。","× 指定は無視されず、自動化モードになる。正しくは「`@claude` を待たずに、指定内容で実行される自動化モードになる」である。","× 承認が必要になるとは示されていない。正しくは「`@claude` を待たずに、指定内容で実行される自動化モードになる」である。"]},{"id":"claudecode-149","type":"mc","chapterIndex":9,"stem":"同じリポジトリで 2 つの Claude Code セッションを並行して動かすとき、同じファイルへの編集の衝突を防ぐ方法はどれか。","options":["両方のセッションで同じ作業ディレクトリを使い、`Esc` を押して順番を調整する","各セッションを別々の worktree で動かす","一方のセッションを `bypassPermissions` にする","どちらかのセッションで `/compact` を実行する"],"correctIndex":1,"explanations":["× 同じ作業ディレクトリでは、編集の衝突は避けられない。正しくは「各セッションを別々の worktree で動かす」である。","○ 並行セッションでは、各セッションを別々の worktree で動かすことで、同じファイルへの編集の衝突を防げる。","× 権限モードは編集の衝突の回避と関係がない。正しくは「各セッションを別々の worktree で動かす」である。","× `/compact` は会話の要約で、ファイルの衝突とは関係がない。"]},{"id":"claudecode-150","type":"mc","chapterIndex":9,"stem":"PR #123 に関連するセッションだけを選び直して再開したい。`claude --from-pr 123` を実行すると何が起こるか。","options":["PR #123 の差分が自動的に取り込まれ、新しいセッションが始まる","PR #123 が自動的にマージされる","PR に紐づくセッションだけが選択画面で絞り込まれて開く","PR #123 に紐づく worktree が作られ、そのまま削除される"],"correctIndex":2,"explanations":["× 新しいセッションの開始ではなく、既存のセッションの絞り込みである。","× マージする機能ではない。正しくは「PR に紐づくセッションだけが選択画面で絞り込まれて開く」である。","○ `claude --from-pr 123` は、PR に紐づくセッションだけを選択画面で絞り込んで開く。`gh pr create` で作られた PR はセッションに自動的に紐づく。","× worktree を作成・削除するオプションではない。正しくは「PR に紐づくセッションだけが選択画面で絞り込まれて開く」である。"]},{"id":"claudecode-151","type":"mc","chapterIndex":10,"stem":"シェルスクリプトから Claude Code を一度だけ呼び出し、回答を得たらそのまま終了させたい。使うコマンドはどれか。","options":["`claude \"query\"` だけを実行する","`claude --once \"query\"` を実行する","`claude --exit \"query\"`","`claude -p \"query\"`（`--print`）"],"correctIndex":3,"explanations":["× `claude \"query\"` は初期プロンプト付きで対話セッションを起動するもので、終了しない。","× `--once` というオプションは示されていない。正しくは「`claude -p \"query\"`（`--print`）」である。","× `--exit` というオプションは示されていない。正しくは「`claude -p \"query\"`（`--print`）」である。","○ `claude -p \"query\"`（`--print`）は非対話で 1 回実行して終了する。"]},{"id":"claudecode-152","type":"mc","chapterIndex":10,"stem":"`claude -p` の実行中に、SIGTERM で停止した。終了コードはどうなるか。","options":["143 になる","0 になる。正常終了として扱われる","1 になる。一般的なエラーとして扱われる","2 になる"],"correctIndex":0,"explanations":["○ SIGTERM で `claude -p` を停止すると、終了コードは 143 になる。","× 0 は成功時の終了コードで、SIGTERM による停止は該当しない。","× 1 ではなく 143 である。正しくは「143 になる」である。","× 2 はフックでブロックするときの終了コードの話であり、ここでは無関係である。"]},{"id":"claudecode-153","type":"mc","chapterIndex":10,"stem":"`claude -p` の `--output-format` に指定できる値と、既定値の組み合わせとして正しいのはどれか。","options":["`text`・`json`（既定）・`yaml`","`text`（既定）・`json`・`stream-json`","`plain`（既定）・`json`・`xml`・`csv`","`text`・`markdown`（既定）・`json` の 3 種類で、そのうち 1 つを選ぶ"],"correctIndex":1,"explanations":["× 既定は `json` ではなく `text` で、`yaml` も示されていない。","○ `--output-format` は `text`（既定）・`json`・`stream-json` のいずれかを受け付ける。","× `plain` や `xml` は示されていない。正しくは「`text`（既定）・`json`・`stream-json`」である。","× `markdown` は示されていない。正しくは「`text`（既定）・`json`・`stream-json`」である。"]},{"id":"claudecode-154","type":"mc","chapterIndex":10,"stem":"`--output-format json` で実行した結果をスクリプトで処理したい。本文とセッション ID は、それぞれどのフィールドに入るか。","options":["本文は `output`、セッション ID は `id`","本文は `text`、セッション ID は `session`","本文は `result`、セッション ID は `session_id`","本文は `message`、セッション ID は `conversation_id`"],"correctIndex":2,"explanations":["× `output` や `id` というフィールド名ではない。正しくは「本文は `result`、セッション ID は `session_id`」である。","× `text` や `session` というフィールド名ではない。","○ `--output-format json` の出力の `result` フィールドに本文、`session_id` にセッション ID が入る。","× `message` や `conversation_id` というフィールド名ではない。"]},{"id":"claudecode-155","type":"mc","chapterIndex":10,"stem":"出力を決まった形式の JSON として受け取りたい。`--json-schema` と `--output-format json` を併用したとき、結果はどのフィールドに出力されるか。","options":["`result` フィールド","`schema_output` フィールド","`data` フィールド","`structured_output`"],"correctIndex":3,"explanations":["× `result` は通常の本文が入るフィールドである。正しくは「`structured_output`」である。","× `schema_output` というフィールド名ではない。正しくは「`structured_output`」である。","× `data` というフィールド名ではない。正しくは「`structured_output`」である。","○ `--json-schema` と `--output-format json` を併用すると、結果は `structured_output` フィールドに出力される。"]},{"id":"claudecode-156","type":"mc","chapterIndex":10,"stem":"`--output-format stream-json` を使うときの条件として、正しいのはどれか。","options":["`--verbose` と併用する必要があり、`--include-partial-messages` で部分メッセージも流せる","`--bare` と併用する必要があり、`--stream` で部分メッセージも流せる","単独で使え、`--include-partial-messages` を付けると警告が出る","`--output-format json` と同時に指定する必要がある"],"correctIndex":0,"explanations":["○ `--output-format stream-json` は `--verbose` と併用が必要で、`--include-partial-messages` を付けると部分的なメッセージも流れる。","× 併用が必要なのは `--bare` ではなく `--verbose` である。","× 単独では使えず、`--verbose` との併用が必要である。","× `json` と同時には指定しない。`stream-json` が単独の出力形式である。"]},{"id":"claudecode-157","type":"mc","chapterIndex":10,"stem":"無人の自動実行で、暴走して費用がかさむのを防ぎたい。`-p` 実行で、推定費用が上限に達したら実行を止めるオプションはどれか。","options":["`--max-cost` を指定して、費用の上限を決める","`--max-budget-usd` を指定する","`--budget-limit`","`--cap-usd`"],"correctIndex":1,"explanations":["× `--max-cost` は示されていない。正しくは「`--max-budget-usd`」である。","○ `--max-budget-usd` は推定費用が上限に達すると実行を止める（`-p` 実行のみ）。ターン数の制限は `--max-turns` で、上限に達するとエラーで終了する。","× `--budget-limit` は示されていない。正しくは「`--max-budget-usd`」である。","× `--cap-usd` は示されていない。正しくは「`--max-budget-usd`」である。"]},{"id":"claudecode-158","type":"mc","chapterIndex":10,"stem":"`-p` 実行で、`git diff` 系のコマンドだけを確認なしで許可したい。`--allowedTools` の書き方として正しいのはどれか。","options":["`--allowedTools \"git diff\"` とコマンド名だけを書く","`--allowedTools \"Bash:git-diff\"`","`--allowedTools \"Bash(git diff *)\"`","`--allowedTools \"allow:git diff\"`"],"correctIndex":2,"explanations":["× 権限ルールの書式では、ツール名に括弧でパターンを付ける。正しくは「`--allowedTools \"Bash(git diff *)\"`」である。","× コロンでつなぐ書式は示されていない。正しくは「`--allowedTools \"Bash(git diff *)\"`」である。","○ `--allowedTools` は確認なしで実行を許可するツールを指定し、権限ルールの書式を使える。`Bash(git diff *)` のように範囲を絞れる。","× `allow:` を付ける書式は示されていない。正しくは「`--allowedTools \"Bash(git diff *)\"`」である。"]},{"id":"claudecode-159","type":"mc","chapterIndex":10,"stem":"`--disallowedTools` に `WebFetch` のように単独のツール名を書くと、どうなるか。","options":["そのツールの利用時にだけ、毎回確認が出る。以後は許可すれば使える","そのツールは使えるが、実行ログが出力されなくなる。ログだけが非表示になる","そのツールの設定がエラーとなり、起動しなくなる","そのツールが Claude のコンテキストから取り除かれる"],"correctIndex":3,"explanations":["× 確認が出るのは ask ルールの話であり、拒否ルールではない。正しくは「そのツールが Claude のコンテキストから取り除かれる」である。","× ログの出力とは関係がなく、ツールが使えなくなる。正しくは「そのツールが Claude のコンテキストから取り除かれる」である。","× 起動に失敗することはない。正しくは「そのツールが Claude のコンテキストから取り除かれる」である。","○ `--disallowedTools` は拒否ルールで、単独のツール名を書くとそのツールを Claude のコンテキストから取り除く。"]},{"id":"claudecode-160","type":"mc","chapterIndex":10,"stem":"CI で `claude -p` を無人実行している。事前に許可していない操作で確認が必要になった場合に、止まらず拒否させたい。どう指定するか。","options":["`--permission-mode dontAsk` を付ける","`--permission-mode plan` を付ける","`--permission-mode default` のまま、標準入力に `y` を流し込む","`--dangerously-skip-permissions` を付ける"],"correctIndex":0,"explanations":["○ `--permission-mode dontAsk` を付けると、事前許可されていない操作は確認せず拒否される。","× `plan` は計画を承認するまで編集しないモードで、無人実行の拒否の仕組みではない。","× 確認のたびに `y` を流し込む運用は、意図しない許可を招く。正しくは「`--permission-mode dontAsk` を付ける」である。","× `--dangerously-skip-permissions` は全操作を許可してしまい、拒否の要件と逆である。"]},{"id":"claudecode-161","type":"mc","chapterIndex":10,"stem":"`--bare` を付けて `claude -p` を実行した。起動時に省かれるものと、API を使うための条件の組み合わせとして正しいのはどれか。","options":["hooks だけが省かれ、OAuth 認証もそのまま使える。API キーは不要である","hooks・skills・MCP・CLAUDE.md・自動メモリの自動検出が省かれ、`ANTHROPIC_API_KEY` が必要になる","CLAUDE.md だけが省かれ、キーチェーンの認証情報も使える。API キーは任意である","すべてが読み込まれたまま、起動のログだけが省かれる。API キーは不要である"],"correctIndex":1,"explanations":["× 省かれるのは hooks だけではなく、OAuth も読まない。","○ `--bare` は hooks・skills・MCP・CLAUDE.md・自動メモリの自動検出を省いて起動を速くする。OAuth 認証情報とキーチェーンを読まないので `ANTHROPIC_API_KEY` が必要である。","× CLAUDE.md だけではなく、キーチェーンも読まない。","× ログではなく、自動検出が省かれる。"]},{"id":"claudecode-162","type":"mc","chapterIndex":10,"stem":"信頼できない第三者のリポジトリを CI で解析する際、`claude -p` を実行する。リポジトリの `.claude/settings.json` にあるフックや `.mcp.json` のサーバーが勝手に動くのが心配だ。どうすべきか。","options":["`-p` なら信頼ダイアログが必ず出るので、そのままで問題ない","`CLAUDE.md` に「フックを実行しない」と書く","`--bare` を付けて、自動検出を省く","`--output-format json` を付ければ、フックは動かなくなる"],"correctIndex":2,"explanations":["× `-p` では信頼ダイアログは出ず、そのまま実行・接続される。正しくは「`--bare` を付けて、自動検出を省く」である。","× CLAUDE.md は助言であり、フックの実行を止める強制力がない。","○ `--bare` を付けない `-p` 実行は、信頼ダイアログなしにプロジェクトのフックと `.mcp.json` のサーバーを実行・接続する。無人実行では `--bare` が推奨される。","× 出力形式はフックの実行とは無関係である。正しくは「`--bare` を付けて、自動検出を省く」である。"]},{"id":"claudecode-163","type":"mc","chapterIndex":10,"stem":"`claude -p` で実行した会話の続きを、別の実行で引き継ぎたい。使えるものとして正しいのはどれか。","options":["`claude -p --append \u003csession_id>`","`claude -p --attach`","`claude -p --same-session` で前回の続きから始める","`claude -p --continue`"],"correctIndex":3,"explanations":["× `--append` は示されていない（`--append-system-prompt` は別物）。","× `--attach` は示されていない。正しくは「`claude -p --continue`」である。","× `--same-session` は示されていない。正しくは「`claude -p --continue`」である。","○ `claude -p --continue` と `--resume \u003csession_id>` で、同じ会話を続けて実行できる。"]},{"id":"claudecode-164","type":"mc","chapterIndex":10,"stem":"既定のシステムプロンプトは残したまま、独自の指示を足したい。使うオプションはどれか。","options":["`--append-system-prompt` を付ける","`--system-prompt` を付ける","`--extend-system-prompt` を付けて指示を足す","`--add-prompt`"],"correctIndex":0,"explanations":["○ `--append-system-prompt` は既定のシステムプロンプトに文言を追加し、`--system-prompt` は既定のプロンプトを全体置き換える。","× `--system-prompt` は既定のプロンプトを置き換えてしまう。","× `--extend-system-prompt` は示されていない。","× `--add-prompt` は示されていない。正しくは「`--append-system-prompt`」である。"]},{"id":"claudecode-165","type":"mc","chapterIndex":10,"stem":"`claude -p` に標準入力でデータをパイプで渡している。入力サイズについて、正しいのはどれか。","options":["上限はなく、どんな大きさでも渡せる","上限は 10MB で、超えるとエラーで終了する","上限は 1MB で、超えた分は切り捨てられる","上限は 100MB で、超えると警告が出るだけである"],"correctIndex":1,"explanations":["× 上限は存在する。正しくは「上限は 10MB で、超えるとエラーで終了する」である。","○ 標準入力のパイプ入力は 10MB が上限で、超えるとエラーで終了する。","× 上限は 1MB ではなく、超えても切り捨てではなくエラーで終了する。","× 上限は 100MB ではなく 10MB で、超えるとエラーで終了する。"]},{"id":"claudecode-166","type":"mc","chapterIndex":11,"stem":"ベストプラクティスが「最も重要な資源」として挙げているものはどれか。","options":["利用できるモデルの種類。上位モデルほど性能が高い","使えるツールの数。多いほど性能が上がる","コンテキストウィンドウ。埋まるほど性能が落ちる","CLAUDE.md の行数"],"correctIndex":2,"explanations":["× モデルの種類が最重要の資源とは述べられていない。正しくは「コンテキストウィンドウ」である。","× ツールの数が多いほど性能が上がるとは述べられていない。正しくは「コンテキストウィンドウ」である。","○ ベストプラクティスは、コンテキストウィンドウが最も重要な資源であり、埋まるほど性能が落ちると述べている。","× CLAUDE.md は短く保つのが良く、行数が多いほど守られやすいわけではない。"]},{"id":"claudecode-167","type":"mc","chapterIndex":11,"stem":"Claude に実装を任せるとき、出来栄えを高めるために最も効果的とされる工夫はどれか。","options":["完成までの手順を、すべて自然言語の長文で先に書いて渡す","権限モードを `bypassPermissions` にして、確認で止まらないようにする","できるだけ短い指示にして、解釈の余地を残す","テスト・ビルド・スクリーンショットなど、自分で結果を確かめられる検証手段を与える"],"correctIndex":3,"explanations":["× 長文の手順は、検証の代わりにはならない。正しくは「テスト・ビルド・スクリーンショットなど、自分で結果を確かめられる検証手段を与える」である。","× 権限モードは、品質を高める手段ではない。正しくは「テスト・ビルド・スクリーンショットなど、自分で結果を確かめられる検証手段を与える」である。","× 指示が短すぎると手戻りが増える。具体的な指示のほうが修正の回数を減らせる。","○ Claude に実行できる検証手段（テスト、ビルド、スクリーンショットなど）を与えると、自分で結果を確かめながら反復できる。"]},{"id":"claudecode-168","type":"mc","chapterIndex":11,"stem":"ベストプラクティスで推奨されているワークフローの段階として、正しい順序はどれか。","options":["探索（Explore）→ 計画（Plan）→ 実装（Implement）→ コミット（Commit）","計画（Plan）→ 実装（Implement）→ 探索（Explore）→ コミット（Commit）の順","実装（Implement）→ 探索（Explore）→ 計画（Plan）→ コミット（Commit）の順（まず作って確かめる）","探索 → 実装 → 計画 → コミット"],"correctIndex":0,"explanations":["○ 推奨ワークフローは「探索 → 計画 → 実装 → コミット」の 4 段階である。","× 探索が最初の段階で、計画が先頭ではない。","× 実装の前に探索と計画を行う。","× 計画は実装の前に行う。"]},{"id":"claudecode-169","type":"mc","chapterIndex":11,"stem":"探索の段階で、うっかり Claude にファイルを編集させたくない。ベストプラクティスに沿った方法はどれか。","options":["`claude --permission-mode dontAsk` で起動する","`Shift+Tab` でプランモードに入る","`claude --read-only` で起動する。編集だけが禁止される","`Ctrl+G` を押して、エディタを閉じたままにする。送信前に確認する"],"correctIndex":1,"explanations":["× `dontAsk` は確認が必要な操作を拒否するモードで、探索のための推奨手段としては挙げられていない。","○ 探索段階では、Shift+Tab でプランモードに入るか `claude --permission-mode plan` で起動して、編集を防ぐ。","× `--read-only` というオプションは示されていない。正しくは「`Shift+Tab` でプランモードに入る」である。","× `Ctrl+G` はプロンプトをエディタで編集するキーで、編集の防止とは関係がない。"]},{"id":"claudecode-170","type":"mc","chapterIndex":11,"stem":"「このテストが通るまで」といった条件を設定し、条件を満たすまで Claude がターンをまたいで作業を続けるようにしたい。使えるコマンドはどれか。","options":["`/until` を使う","`/loop`","`/goal` を使う","`/target`"],"correctIndex":2,"explanations":["× `/until` は示されていない。正しくは「`/goal`」である。","× `/loop` は示されていない。正しくは「`/goal`」である。","○ `/goal` で条件を設定すると、条件を満たすまで Claude がターンをまたいで作業を続ける。","× `/target` は示されていない。正しくは「`/goal`」である。"]},{"id":"claudecode-171","type":"mc","chapterIndex":11,"stem":"変更内容を 1 文で説明できるほど小さな作業(例: タイプミスの修正)について、ベストプラクティスの考え方として正しいのはどれか。","options":["小さな作業でも、必ず計画を立てて承認してから実装するのが基本である","小さな作業ほど、プランモードで時間をかけるべきである（見落としが出やすい）","小さな作業も、サブエージェントに必ず任せるべきである","計画の段階を省いてよい"],"correctIndex":3,"explanations":["× 計画は、規模の大きな作業で価値が大きい。正しくは「計画の段階を省いてよい」である。","× 小さな作業で時間をかけるのは、費用対効果が低い。正しくは「計画の段階を省いてよい」である。","× サブエージェントへの委任が必須とは述べられていない。正しくは「計画の段階を省いてよい」である。","○ 変更内容を 1 文で説明できるほど小さい作業では、計画を省いてよいとされている。"]},{"id":"claudecode-172","type":"mc","chapterIndex":11,"stem":"バグ修正を依頼するとき、手戻りや修正の回数を減らすために最も効果的な書き方はどれか。","options":["ファイル名・制約・既存パターンへの参照を含めて、具体的に指示する","「いい感じに直しておいて」と短く伝える。書く手間を最も省ける方法だ","背景を伏せて結論だけを伝え、Claude に推測させる","指示は最小限にして、直るまで何度でもやり直させる"],"correctIndex":0,"explanations":["○ ファイル名・制約・既存パターンへの参照を含めた具体的な指示は、手戻りと修正の回数を減らす。","× 曖昧な指示は、修正の回数を増やしやすい。正しくは「ファイル名・制約・既存パターンへの参照を含めて、具体的に指示する」である。","× 推測に頼ると、意図とずれた結果になりやすい。正しくは「ファイル名・制約・既存パターンへの参照を含めて、具体的に指示する」である。","× やり直しを前提にすると、コンテキストを浪費する。正しくは「ファイル名・制約・既存パターンへの参照を含めて、具体的に指示する」である。"]},{"id":"claudecode-173","type":"mc","chapterIndex":11,"stem":"CLAUDE.md に何を書くべきかの判断基準として、ベストプラクティスが勧めているのはどれか。","options":["プロジェクトの README の内容を、漏れなくすべて書き写す。重複を恐れず全文を載せる","「それを消すと Claude が間違えるか」を基準に、Claude が推測できない内容だけを書く","コードを読めば分かる内容も含めて、できるだけ詳しく書く。長いほど守られやすい","一般的なプログラミングの作法を網羅して書く。どの言語にも通じる内容にする"],"correctIndex":1,"explanations":["× README の丸写しは、推測できる内容を含んでしまう。正しくは「「それを消すと Claude が間違えるか」を基準に、Claude が推測できない内容だけを書く」である。","○ CLAUDE.md には「それを消すと Claude が間違えるか」を基準に、Claude が推測できない内容だけを書くよう勧めている。","× 詳しすぎると重要な指示が埋もれる。正しくは「「それを消すと Claude が間違えるか」を基準に、Claude が推測できない内容だけを書く」である。","× 一般的な作法は、Claude が既に知っている内容である。正しくは「「それを消すと Claude が間違えるか」を基準に、Claude が推測できない内容だけを書く」である。"]},{"id":"claudecode-174","type":"mc","chapterIndex":11,"stem":"CLAUDE.md の重要な行に「IMPORTANT」を付けて強調しようと思う。ベストプラクティスの考え方として正しいのはどれか。","options":["すべての行に付けるほど、効果が強まる。多いほど守られやすくなる","付けると、その行が強制的に守られるようになる","特定の行の強調には使えるが、多くの行に付けると効果が薄れる","付けても、常に無視される。強調は意味を持たない"],"correctIndex":2,"explanations":["× 多用するほど強まるのではなく、効果が薄れる。正しくは「特定の行の強調には使えるが、多くの行に付けると効果が薄れる」である。","× 強制力は生まれず、あくまで強調である。正しくは「特定の行の強調には使えるが、多くの行に付けると効果が薄れる」である。","○ CLAUDE.md の特定の行を強調したいときは「IMPORTANT」などを付けるが、多くの行に付けると効果が薄れると述べている。","× 無視されるわけではなく、強調として働く。正しくは「特定の行の強調には使えるが、多くの行に付けると効果が薄れる」である。"]},{"id":"claudecode-175","type":"mc","chapterIndex":11,"stem":"同じ問題の修正を 2 回以上試みたが、どれも失敗している。会話には失敗した試行が積み重なっている。ベストプラクティスの推奨はどれか。","options":["同じ会話のまま、同じ指示をもう一度繰り返す","`/compact` を実行し、同じ会話の中で試行を続ける","権限モードを切り替えて、同じ指示をやり直す（モードの違いが原因とみなす）","`/clear` して、学んだことを反映した新しいプロンプトで始める"],"correctIndex":3,"explanations":["× 失敗が積み重なった会話では、同じ指示を繰り返しても改善しにくい。","× 要約しても失敗した試行の影響が残り得るため、新しく始めるほうが良い。","× 権限モードの切り替えは、失敗の原因とは無関係である。正しくは「`/clear` して、学んだことを反映した新しいプロンプトで始める」である。","○ 同じ問題で 2 回以上修正が失敗したら、`/clear` して学んだことを反映した新しいプロンプトで始めるよう勧めている。"]},{"id":"claudecode-176","type":"mc","chapterIndex":11,"stem":"Claude が間違った方向へ進み始めたと気づいた。ベストプラクティスの勧める対処はどれか。","options":["早めに `Esc` で止め、巻き戻して軌道修正する","最後まで実行させてから、全部を作り直させる","`Ctrl+C` を 2 回押してセッションを終了する。作業は残しておく","`/clear` で会話を消して、最初の指示を忘れさせる。やり直しが簡単になる"],"correctIndex":0,"explanations":["○ 軌道修正は早く行い、`Esc` で止めて、`Esc` 2 回または `/rewind` で以前の状態に戻すよう勧めている。","× 最後まで進めると、手戻りの量が増える。正しくは「早めに `Esc` で止め」である。","× セッションを終了する必要はなく、巻き戻しで戻せる。正しくは「早めに `Esc` で止め」である。","× `/clear` は会話全体を捨てるため、必要な文脈も失われる。"]},{"id":"claudecode-177","type":"mc","chapterIndex":11,"stem":"1 つのセッションで、機能追加、ログ調査、ドキュメント修正と、無関係な作業を次々に詰め込んでしまった。ベストプラクティスでは何と呼ばれる失敗パターンで、どう解消するか。","options":["infinite exploration と呼ばれ、`/compact` で解消する","kitchen sink session と呼ばれ、`/clear` で解消する","over-prompting と呼ばれ、`/rewind` で解消する","context overflow と呼ばれ、`/usage` で解消する"],"correctIndex":1,"explanations":["× infinite exploration は範囲を決めない調査の失敗パターンで、範囲を絞るかサブエージェントに任せる。","○ 無関係な作業を 1 つのセッションに詰め込む「kitchen sink session」は失敗パターンとされ、`/clear` で解消する。","× over-prompting という失敗パターンは示されていない。","× context overflow という失敗パターンは示されていない。"]},{"id":"claudecode-178","type":"mc","chapterIndex":11,"stem":"大きな機能を作る前に、仕様を固めてから別のセッションで実装したい。ベストプラクティスの進め方はどれか。","options":["最初の 1 行だけ指示して、後は自由に実装させる","仕様は書かず、同じセッションで実装を続ける","Claude に AskUserQuestion で質問させ","仕様書は人間が最後に書き、実装後に Claude に確認させる。質問はさせない"],"correctIndex":2,"explanations":["× 仕様の詰めを省くと、手戻りが増える。正しくは「Claude に AskUserQuestion で質問させ」である。","× 仕様を書かずに続けると、探索で使ったコンテキストが実装に持ち越される。","○ 大きな機能では、Claude に AskUserQuestion で質問させてから仕様を SPEC.md に書かせ、新しいセッションで実装させる。","× 仕様は先に固めるほうが良い。正しくは「Claude に AskUserQuestion で質問させ」である。"]},{"id":"claudecode-179","type":"mc","chapterIndex":11,"stem":"作成者のバイアスを減らしたコードレビューをしたい。ベストプラクティスの進め方はどれか。","options":["実装したセッションのまま、同じ会話でレビューまで行わせる","レビューは必ずサブエージェントではなく人間だけで行う","レビューのために、実装セッションで `/compact` を実行する","ライター（実装）とレビュアーを別々のセッションに分ける"],"correctIndex":3,"explanations":["× 同じ会話では、作成時の判断に引きずられやすい。正しくは「ライター（実装）とレビュアーを別々のセッションに分ける」である。","× 人間だけに限る必要は述べられていない。正しくは「ライター（実装）とレビュアーを別々のセッションに分ける」である。","× `/compact` はバイアスを減らす手段ではない。正しくは「ライター（実装）とレビュアーを別々のセッションに分ける」である。","○ ライター（実装）とレビュアー（別セッション）に分けると、作成したモデルのバイアスを減らせるとされている。"]},{"id":"claudecode-180","type":"mc","chapterIndex":11,"stem":"大規模な変更を、多数のサブエージェントに分担させ、それぞれを独立した worktree で実行させたい。使えるコマンドはどれか。","options":["`/batch \u003cinstruction>`","`/parallel \u003cinstruction>`。2 個のサブエージェントに分担される","`/fanout \u003cinstruction>`","`/split \u003cinstruction>`。同一の作業ツリーで並列に実行される"],"correctIndex":0,"explanations":["○ `/batch \u003cinstruction>` は大規模変更を 5〜30 個のサブエージェントに分担させ、それぞれ独立した worktree で実行する。","× `/parallel` は示されていない。正しくは「`/batch \u003cinstruction>`」である。","× `/fanout` は示されていない。正しくは「`/batch \u003cinstruction>`」である。","× `/split` は示されておらず、独立した worktree で実行されるのが `/batch` の特徴である。"]}];
  const CHAPTERS = ["基本操作","CLAUDE.md とメモリ","権限と安全","設定ファイル","スラッシュコマンドとスキル","フック","サブエージェント","MCP","コンテキストとコスト","Git・GitHub","ヘッドレス・自動化","実践のベストプラクティス"];
  const BASE_CHAPTER_COUNT = 12;   // これ以降の章は新シラバス仮問題集（deck:'extra3'）用
// GAS_WEBAPP_URL / EXAM_ID / EXAM_SHORT_TITLE / TRACKING_EXAM_ID / QUESTIONS / CHAPTERS は build_html.js が
// ビルド時にこのファイルの直前へ注入する。QUESTIONS は {id, type:'mc'|'tf'|'mc-multi', chapterIndex, stem, ...}
// の配列。TRACKING_EXAM_ID は成績記録シート名（<TRACKING_EXAM_ID>_<mode>）専用のIDで、
// 同じexam.id配下に複数の問題集（quiz/quiz2）がある場合に成績を分離するため EXAM_ID とは別に持つ
// （EXAM_ID はチャットへ戻る遷移先ページなので exam.id のまま変えない）。
// 'mc-multi' は「すべて選びなさい」形式（正解が複数）。見た目は 'mc' と同じ選択肢ボタンだが、
// クリックのたびにトグル選択（複数選択可）になり、正解は correctIndexes（配列）で持つ。

const MODE_LABEL = { mc: '模擬試験', tf: '一問一答', extra: '追加問題', extra2: '追加問題2', extra3: '新シラバス仮問題', review: '復習' };
// 成績記録（QuizTracking.js）のシートを分けるための mode 変換。
// 'extra'（追加問題、別ソースの問題集）は既存の 模擬試験(seiseiai_mc) と混在しないよう
// 'mc2' という別モード名で記録する。'extra2'（3つ目の問題集）は同様に'mc3'。
// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。
const TRACKING_MODE = { mc: 'mc', tf: 'tf', extra: 'mc2', extra2: 'mc3', extra3: 'mc4', review: 'review' };

// 復習モードの「卒業」条件。復習でこの回数だけ連続正解したら、既定の出題対象から外す
// （「記録にある全部」を選べば卒業ぶんも出題できる）。バックエンド QuizReview.js は
// 生の連続正解数(streak)だけを返し、閾値の判断はこの画面側で持つ。
const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}
