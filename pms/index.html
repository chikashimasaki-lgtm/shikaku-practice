要となる。","× 委員会の承認は必要ない。通知又は公表が求められる。","× 利用目的を変更したときは、変更後の目的を本人に通知又は公表する必要がある。"]},{"id":"pms-129","type":"mc","chapterIndex":5,"stem":"要配慮個人情報の取得について、適切なものはどれか。","options":["利用目的を公表していれば、取得時に本人の同意は不要である。","要配慮個人情報は、社内の限られた者だけが管理する限り、本人の同意を得なくても取得して利用することが認められる。","要配慮個人情報は、原則として本人の同意を得ずに取得してはならない。","委員会への事前届出があれば、同意が不要となる。"],"correctIndex":2,"explanations":["× 利用目的の公表だけでは、同意の例外にはならない。","× 社内管理かどうかは、同意の要否とは関係がない。","○ 要配慮個人情報の取得は原則として本人の同意が必要である。","× 委員会への届出は、同意の例外の根拠にはならない。"]},{"id":"pms-130","type":"mc","chapterIndex":6,"stem":"個人データの取扱いを委託先に任せた場合の委託元の責任について、一般的に適切なものはどれか。","options":["委託元は委託先に対する監督義務を負い、委託先で生じた漏えい等についても委託元として対応が求められる。","委託先で発生した漏えいは、委託先が単独で責任を負うため、委託契約上も委託元が事故の報告や原因調査に関与する必要はない。","委託先が委託元の承諾を得て再委託すれば、委託元の監督義務は消滅する。","委託契約を締結していれば、委託先が定期的に報告する内容を確認せず、委託先の管理状況を委託元が確認する必要はない。"],"correctIndex":0,"explanations":["○ 委託元の監督義務が基本であり、委託先の事故でも委託元の対応が求められる。","× 委託先の事故でも、委託元は監督者として対応を求められ、単独で責任を免れるわけではない。","× 再委託があっても、委託元の監督義務は残る。","× 契約の締結だけでは監督義務を果たしたことにならない。"]},{"id":"pms-131","type":"mc","chapterIndex":5,"stem":"オプトアウト方式で個人データを第三者に提供する場合の要件として適切なものはどれか。","options":["本人の同意を取得して、同意の撤回を受け付ける体制を整え、提供先の利用目的や再提供の範囲を契約で制限し、提供後の管理状況を定期的に確認して提供する。","提供先の全社員から個別に同意を書面で取得し、提供を行う際にはその写しを保管すれば、オプトアウトの要件を満たすものとして扱われる。","提供の対象を要配慮個人情報に限定し、本人の求めに応じて提供を停止する仕組みを設けずに、提供の事実を公表しないまま提供する。","本人の求めに応じて提供を停止することを認め、提供する個人データの項目等を本人へ通知又は公表し、委員会へ届け出る。"],"correctIndex":3,"explanations":["× オプトアウトは本人の同意を得ずに提供する方式であり、同意を取得する方式とは要件が異なる。","× 全社員の同意を取得する方式は、オプトアウトの要件ではなく、本人の同意による提供の方法である。","× 要配慮個人情報は本来オプトアウトによる第三者提供の対象にできず、停止の仕組みや公表も必要である。","○ オプトアウトでは、停止の求めへの対応と通知・公表、委員会への届出が要件となる。"]},{"id":"pms-132","type":"mc","chapterIndex":5,"stem":"保有個人データの開示請求への対応として適切なものはどれか。","options":["開示請求は書面に限られ、口頭での請求は受け付けてはならない。","本人から開示請求があった場合、法の定める例外を除き、遅滞なく開示しなければならない。","開示請求を受けた場合は、必ず手数料を徴収し、無料での開示は認められない。","開示請求は、請求から1年を経過すると応じる義務がなくなる。"],"correctIndex":1,"explanations":["× 口頭での請求を一律に拒否することは適切でない。","○ 開示は原則として義務であり、例外は法で定められた場合に限られる。","× 手数料は実費の範囲で定めることができるが、無料での開示を一律に禁じるものではない。","× 請求から1年経過で義務が消えるとする規定はない。"]},{"id":"pms-133","type":"mc","chapterIndex":6,"stem":"報告対象事態の一つとして適切なものはどれか。","options":["個人データを暗号化して誤送信したが、暗号鍵の漏えいがなく、第三者が復号できない状態にあった場合。","従業員が個人データの入力を1件誤り、本人の依頼で直ちに修正した場合。","要配慮個人情報が含まれる個人データの漏えい等が発生し、又はそのおそれがある場合。","社内で個人データを閲覧する権限を持つ者が、業務上必要な閲覧を行った場合。"],"correctIndex":2,"explanations":["× 暗号化され鍵も漏えいしていない場合は、報告対象の例外とされる。","× 誤入力の修正は漏えい等に当たらない。","○ 要配慮個人情報を含む漏えい等は、報告対象事態の代表例である。","× 業務上必要な閲覧は、漏えい等に当たらない。"]},{"id":"pms-134","type":"mc","chapterIndex":6,"stem":"個人データの漏えい等が報告対象事態に当たる場合の本人への通知について、適切なものはどれか。","options":["原則として本人へ通知しなければならず、通知が困難な場合は代替措置をとる。","個人データが1件のみの場合は、報告対象事態に当たるものの、本人への通知は、件数が少ないことを理由に省略して差し支えない。","本人への通知は、委員会への報告が完了した後、事情が落ち着いてから1年以内に行えばよく、通知の時期に特段の制限はない。","本人への通知は、本人から問い合わせがあった場合にのみ行う。"],"correctIndex":0,"explanations":["○ 原則として本人への通知が求められ、困難な場合は代替措置が認められる。","× 件数が少ないことは、通知の免除理由にはならない。","× 通知は速やかに行うことが求められ、委員会への報告後も期限を先延ばしにしてよいわけではない。","× 問い合わせを待つ運用では、通知の義務を果たしたことにはならない。"]},{"id":"pms-135","type":"mc","chapterIndex":6,"stem":"安全管理措置の説明として適切なものはどれか。","options":["安全管理措置は、物理的な施錠や入退室管理の仕組みを整えるだけで足り、アクセス制御といった技術的な対策は要しない。","従業員が個人データに触れない業務体制をとっている場合は、個人情報保護に関する教育や訓練は、実施しなくてもよい。","委託先に個人データの取扱いを全面的に任せ、委託先の安全管理の状況や事故の有無について、事業者自身が確認を行う必要はない。","組織的・人的・物理的・技術的の観点から、取り扱う個人データの安全管理措置を講じる。"],"correctIndex":3,"explanations":["× 安全管理措置には技術的な対策も含まれ、物理的な対策だけでは足りない。","× 個人データに触れない場合でも、従業員への教育や訓練は安全管理措置として必要である。","× 委託先任せは、事業者の安全管理義務を果たさない。","○ 安全管理措置は4つの観点で整理され、組織全体で講じることが求められる。"]},{"id":"pms-136","type":"mc","chapterIndex":0,"stem":"「第三者」に該当しないものとして適切なものはどれか。","options":["同じグループに属する独立した別法人への提供。","利用目的の達成に必要な範囲で個人データの取扱いを委託する先（委託先）。","業務提携先の別法人へ、協力目的で提供する場合。","研究機関への提供は、共同研究の目的であれば同意は不要である。"],"correctIndex":1,"explanations":["× 別法人は原則として第三者に当たる。","○ 委託先への提供は、第三者提供の例外となる。","× 業務提携先は第三者に当たる。","× 研究機関は第三者に当たり、共同研究の目的であっても、原則として本人の同意が必要である。"]},{"id":"pms-137","type":"mc","chapterIndex":5,"stem":"個人情報の利用目的の特定について、適切なものはどれか。","options":["利用目的は「事業活動のため」と記載すれば、特定したものとみなされる。","利用目的は社内の内部文書に記載すれば、本人への通知は不要である。","利用目的をできる限り具体的に特定し、本人が利用目的を予測できる程度に明示する。","利用目的は、取得後1年を経過した時点で一度だけ特定すればよく、その後に利用目的を変更する場合も、特定し直す必要はない。"],"correctIndex":2,"explanations":["× 「事業活動のため」のような包括的な記載では、利用目的を特定したとは認められない。","× 社内文書への記載だけでは、通知の要件を満たさない。","○ できる限り具体的に特定することが求められる。","× 利用目的は取得時点で特定が必要であり、1年後に一度だけ行えばよいわけではない。"]},{"id":"pms-138","type":"mc","chapterIndex":0,"stem":"個人情報取扱事業者の説明として適切なものはどれか。","options":["個人情報データベース等を事業の用に供している者であれば、取り扱う件数にかかわらず該当する。","取り扱う個人情報が5,000件以下の事業者は、該当しない。","営利事業者に限られ、学校法人や公益法人、NPO法人は、個人情報を事業の用に供していても該当しない。","個人情報取扱事業者は法人に限られ、個人事業主が個人情報データベース等を事業の用に供していても、法の義務は一切課されない。"],"correctIndex":0,"explanations":["○ 件数に関係なく、個人情報データベース等を事業の用に供していれば該当する。","× 件数で該当性が決まるわけではなく、5,000件以下でも該当しうる。","× 非営利の団体も、個人情報データベース等を事業の用に供していれば、個人情報取扱事業者に該当しうる。","× 個人事業主も該当しうるため、法人に限られるわけではなく、義務が一切課されないことはない。"]},{"id":"pms-139","type":"mc","chapterIndex":6,"stem":"漏えい等の事故が発覚した際に、最初に行うべき対応として最も適切なものはどれか。","options":["原因が特定できるまで社内外へ一切報告せず、影響範囲や関係者の状況を把握し、調査を終えてから、すべての報告をまとめて行う。","漏えいの事実が判明したら、本人に個別に連絡して謝罪し、本人が納得したことを確認できた時点で、委員会への報告は省略する。","事実を公表せず、社内の関係者だけで原因と再発防止策を決め、被害を受けた本人や委員会への連絡は、必要性を判断して個別に行う。","被害の拡大を防ぐ措置をとり、影響範囲を確認したうえで、社内の報告体制に従って速やかに責任者へ報告する。"],"correctIndex":3,"explanations":["× 報告を調査終了まで止めると、速報や本人への通知が遅れ、被害の拡大を防げなくなる。","× 本人への連絡だけで報告義務は代替されない。","× 本人や委員会への連絡の要否を社内だけで判断して省略するのは、適切な対応ではない。","○ まず被害の拡大防止と影響範囲の把握、そして速やかな報告が基本である。"]},{"id":"pms-140","type":"mc","chapterIndex":0,"stem":"仮名加工情報と匿名加工情報の違いとして適切なものはどれか。","options":["仮名加工情報は、事業者内部でも他の情報と照合してはならないものである。","仮名加工情報は他の情報と照合すれば本人を識別できるが、匿名加工情報は特定の個人を識別できないように加工したものである。","匿名加工情報は、氏名や住所を仮IDに置き換えたものを指し、他の情報は元のまま残してよい。","両者はいずれも、本人の同意なく第三者に自由に提供できる点で同一と言える。"],"correctIndex":1,"explanations":["× 事業者内部での照合が禁止されるわけではない。","○ 仮名加工情報は照合により識別が可能な点が特徴である。","× 仮IDへの置き換えだけでは匿名加工情報にはならず、他の情報の加工も必要である。","× 仮名加工情報は第三者への提供が原則として制限されており、同一ではない。"]},{"id":"pms-141","type":"mc","chapterIndex":5,"stem":"個人データの第三者提供で、同意の取得方法として適切なものはどれか。","options":["同意は提供の後に包括的に得ればよく、提供の前に提供先や利用目的を本人に示す必要はなく、事後の通知で足りるものとされている。","同意は一度得れば、すべての提供に永続的に有効である。","本人が同意の内容を認識できる方法で、提供先や利用目的を明示して同意を得る。","本人が沈黙していれば、同意が成立したとみなす。"],"correctIndex":2,"explanations":["× 提供の後の包括的な同意では、提供時の同意の要件を満たさない。","× 同意は得た範囲・目的に限って有効であり、すべての提供に永続的に及ぶものではない。","○ 同意は提供の前に、本人が内容を認識できる形で得ることが必要である。","× 沈黙を同意とみなす取扱いは認められない。"]},{"id":"pms-142","type":"mc","chapterIndex":0,"stem":"要配慮個人情報の例として適切なものはどれか。","options":["病歴、犯罪の経歴、障害の事実。","氏名、住所、電話番号。","購買履歴や閲覧履歴、位置情報といった行動に関する記録は、取り扱いに注意が必要な情報として、要配慮個人情報に含まれるものである。","勤務先の名称、職種、勤務地、雇用形態に関する情報。"],"correctIndex":0,"explanations":["○ 病歴・犯罪の経歴・障害の事実は要配慮個人情報の例である。","× 氏名・住所・電話番号は、要配慮個人情報には当たらない。","× 行動に関する記録は、一般に要配慮個人情報には含まれず、取扱いに注意は必要でも要配慮個人情報の定義には当たらない。","× 勤務先や職種は要配慮個人情報に当たらない。"]},{"id":"pms-143","type":"mc","chapterIndex":5,"stem":"個人関連情報の第三者提供について、適切なものはどれか。","options":["個人関連情報は個人情報に当たるため、提供先で本人の同意がなくても、提供元が提供の記録を残せば、第三者に提供することができる。","個人関連情報は、提供元が本人から直接取得したものであれば、提供先の確認や同意の取得を行わなくても、第三者提供は自由に行うことができる。","個人関連情報を第三者へ提供する場合には、提供先で個人データとして取得されるかどうかにかかわらず、委員会へ事前に届け出ることが必要である。","提供先が個人データとして取得することが想定される場合、提供元は提供先で本人の同意が得られていることを確認する。"],"correctIndex":3,"explanations":["× 個人関連情報は個人情報ではないが、提供先で個人データとして取得されるなら、同意の確認が必要である。","× 取得の経緯にかかわらず、提供先が個人データとして取得する場合は同意の確認が必要である。","× 事前の届出が求められるわけではない。","○ 提供先が個人データとして取得する場合は、同意の確認が求められる。"]},{"id":"pms-144","type":"mc","chapterIndex":6,"stem":"個人データの取扱いの委託先に対する監督について、適切なものはどれか。","options":["委託先が業者である場合は、監督義務は生じない。","委託契約の締結や定期的な確認などにより、委託先の安全管理が図られるよう必要かつ適切な監督を行う。","委託先の選定は、価格や納期だけで決めてよく、安全管理の能力は基準に含めなくてよい。","委託後は、委託先の管理状況を一度確認すれば、以後の確認は不要である。"],"correctIndex":1,"explanations":["× 業者への委託でも監督義務は生じる。","○ 委託元は必要かつ適切な監督の義務を負う。","× 委託先の選定では、安全管理の措置を講じられるかどうかを基準に含める必要がある。","× 委託後も継続的な確認が求められる。"]},{"id":"pms-145","type":"mc","chapterIndex":5,"stem":"共同利用を行う場合の本人への通知等について、適切なものはどれか。","options":["共同利用は、同じグループ会社の間で行う限り、共同利用の範囲や利用目的を本人へ通知する必要はなく、社内で周知するだけで足りる。","共同利用の範囲は、事業者が社内で決めれば、本人への通知は不要である。","共同して利用する者の範囲、利用目的、管理責任者の氏名等を本人に通知するか、本人が容易に知り得る状態に置く。","共同利用する者の範囲は、本人から申し出があった場合にのみ公表すればよい。"],"correctIndex":2,"explanations":["× グループ会社間でも、共同利用の通知又は公表は必要である。","× 社内での決定だけでは、本人への通知の要件を満たさない。","○ 共同利用の要件として、本人への通知又は本人が知り得る状態の確保が求められる。","× 求めがあった場合のみの公表では、要件を満たさない。"]},{"id":"pms-146","type":"mc","chapterIndex":5,"stem":"保有個人データの訂正等の請求への対応として適切なものはどれか。","options":["利用目的の達成に必要な範囲で、遅滞なく訂正等を行い、その旨を本人に通知する義務がある（例外を除く）。","訂正請求には、事業者は応じる義務はない。","訂正は、本人が費用を負担する場合にのみ行い、事業者が必要と認める範囲に限って、利用目的とは関係なく訂正内容を決めてよい。","訂正請求は、訂正の対象となる保有個人データが1件に限られ、複数の項目にまたがる訂正を求める請求には、応じる義務がない。"],"correctIndex":0,"explanations":["○ 訂正等の請求には原則として応じる義務がある。","× 応じる義務がないとする規定はない。","× 訂正の判断は利用目的の達成に必要な範囲で行うもので、事業者の裁量で範囲を決めてよいわけではない。","× 訂正の請求は1件に限られるものではない。"]},{"id":"pms-147","type":"mc","chapterIndex":0,"stem":"個人情報の不正な取扱いと罰則について、適切なものはどれか。","options":["個人情報の漏えいは、事業者に過失がなければ、本人への通知や委員会への報告を含め、いかなる罰則の対象にもならない。","罰則の対象は、故意に漏えいした従業員のみであり、個人情報を取り扱う事業者は、組織として管理義務を負うものの罰則の対象外である。","個人情報保護法に違反する取扱いがあっても、事業者が自主的に改善していれば、委員会からの指導や勧告が行われることはない。","個人情報データベース等を不正な利益を図る目的で提供又は盗用した者は、刑事罰の対象となる。"],"correctIndex":3,"explanations":["× 罰則の範囲は法律で具体的に定められており、「過失がなければいかなる罰則もない」とまでは言えない。","× 従業員だけでなく、法人である事業者も両罰規定により罰金刑の対象となりうる。","× 違反に対しては指導や勧告が行われうる。","○ 不正な利益を図る目的での提供・盗用は、刑事罰の対象となる。"]},{"id":"pms-148","type":"mc","chapterIndex":5,"stem":"個人情報の取得時の利用目的の通知又は公表について、適切なものはどれか。","options":["利用目的の通知は、取得後3年以内に行えばよく、それまでは本人へ知らせなくてもよい。","あらかじめ公表している場合を除き、個人情報を取得した後、速やかに利用目的を本人に通知又は公表する。","利用目的は、本人から求められた場合にのみ通知すればよい。","ホームページに掲載していれば、取得時の通知は何があっても不要である。"],"correctIndex":1,"explanations":["× 利用目的は取得後速やかに通知又は公表する必要があり、3年の猶予はない。","○ 取得後は速やかな通知又は公表が求められる。","× 求めがあった場合のみという運用は、通知の義務を満たさない。","× 公表の方法は、取得時の状況により判断すべきで、常に不要とはならない。"]},{"id":"pms-149","type":"mc","chapterIndex":0,"stem":"個人情報の定義について、適切なものはどれか。","options":["死者に関する情報も、遺族が識別できる場合には個人情報に含まれる。","法人に関する情報は、役員の氏名を含む場合でも個人情報に該当しない。","生存する個人に関する情報であって、氏名・生年月日等により特定の個人を識別できるもの、又は個人識別符号を含むもの。","会社の代表電話番号や、部署の代表メールアドレスといった情報は、いずれも特定の個人を識別できるため、すべて個人情報に該当する。"],"correctIndex":2,"explanations":["× 死者に関する情報は個人情報の対象ではない。","× 役員の氏名は、個人を識別できる限り個人情報に該当しうる。","○ 個人情報は生存する個人に関する情報が対象である。","× 会社や部署の代表的な連絡先は、特定の個人を識別できる場合に限って個人情報に当たる。"]},{"id":"pms-150","type":"mc","chapterIndex":6,"stem":"再委託を行う場合の取扱いとして適切なものはどれか。","options":["委託契約に定めた条件（委託元の承諾等）を満たし、再委託先についても監督が必要となる。","再委託は、委託先が委託元に事前に知らせれば、委託先の判断だけで自由に行うことができ、委託元の承諾を得る必要はない。","再委託先は、委託元が直接選定しなければ監督義務の対象外である。","再委託先に対する監督は、最初の委託先に任せれば足り、委託元が再委託の状況や再委託先の安全管理を確認する義務は、以後一切消える。"],"correctIndex":0,"explanations":["○ 再委託には委託契約上の条件を満たすことが必要である。","× 委託元の承諾など、選定の関与が求められる場合がある。","× 再委託先への監督も含めて、委託元の義務は残る。","× 再委託先に対する監督義務は、最初の委託先に任せても委託元から消えるものではない。"]},{"id":"pms-151","type":"mc","chapterIndex":7,"stem":"内部監査の目的として最も適切なものはどれか。","options":["従業員の業務態度や勤務成績を評価し、その結果を人事考課や昇進の判断材料として活用することを目的とする。","監査で指摘された件数を減らし、審査機関の審査員から高い評価を得て、認証の更新を確実にすることを目的とする。","内部監査の結果は、外部の審査機関が行う審査の結論を先取りして、内部監査の担当者が直接決定するものとして扱うべきである。","PMSが要求事項に適合し、有効に運用されているかを、独立した立場から確認・評価すること。"],"correctIndex":3,"explanations":["× 内部監査は人事評価のための制度ではなく、PMSの適合性と有効性を確認するものである。","× 指摘件数の削減や審査での評価を目的とすると、監査の独立性と客観性が損なわれる。","× 審査結果を決めるのは外部の審査機関であり、内部監査ではない。","○ 内部監査はPMSの適合性と有効性を確認するための監査である。"]},{"id":"pms-152","type":"mc","chapterIndex":7,"stem":"内部監査員の独立性について、適切なものはどれか。","options":["監査対象部門の管理者が監査員を兼務すれば、効率的である。","監査対象の業務から独立した者が監査を行い、自己の業務を自ら監査しない。","監査対象部門の日常業務を担当していても、公正さは損なわれない。","内部監査員は、監査の直前にだけ任命し、終われば任を解いてもよい。"],"correctIndex":1,"explanations":["× 管理者の兼務は、自己監査になるため独立性を損なう。","○ 独立性は、自己の業務を監査しないことで確保される。","× 監査対象の業務を担当する者は、自己の業務を監査することになり、独立性が保てない。","× 監査員は計画的に任命し、監査の独立性を継続的に保つ必要がある。"]},{"id":"pms-153","type":"mc","chapterIndex":7,"stem":"内部監査の計画について、適切なものはどれか。","options":["全部門を毎月同じ内容で監査する計画が、最も適切である。","前回の監査で指摘のあった部門は、同じ指摘を繰り返さないよう、その後の監査対象から除外し、改善の確認を次回以降も行わない。","監査プログラムで、各部門のリスクや前回の結果を考慮し、監査の対象・範囲・頻度・方法を計画する。","監査計画は、被監査部門に事前に全ての監査項目を伝えておく必要がある。"],"correctIndex":2,"explanations":["× 毎回同じ内容の監査は、リスクに応じた計画とはいえない。","× 前回指摘のあった部門は、むしろ重点的に確認すべきである。","○ リスクや過去の結果に基づく計画が基本である。","× 監査項目を全て事前に伝える義務はなく、計画の基準にもならない。"]},{"id":"pms-154","type":"mc","chapterIndex":7,"stem":"監査証拠の評価について、適切なものはどれか。","options":["監査証拠は、記録・観察・照合などの客観的な裏付けに基づき、担当者の口頭説明のみに依存しない。","担当者の口頭説明が一貫しており、説明の内容に矛盾が見られなければ、記録や現物を確認しなくても監査の根拠として十分である。","電子データは改ざんの可能性があるため、監査証拠として一切使えない。","監査証拠は、監査の結論を先に決めてから、結論に都合の良いものを選んで集め、反証となる記録は必要に応じて除外する。"],"correctIndex":0,"explanations":["○ 客観的な裏付けを重視し、口頭説明のみに頼らないことが求められる。","× 一貫した説明があっても、記録の確認は省略できない。","× 電子データも適切な統制のもとでは監査証拠として使える。","× 結論に都合の良い証拠だけを集め、反証を除外することは、監査証拠の客観性を損なう。"]},{"id":"pms-155","type":"mc","chapterIndex":8,"stem":"監査で検出された指摘事項の扱いとして適切なものはどれか。","options":["すべての指摘は不適合として扱い、指摘の件数が多いほど、被監査部門の管理上の問題を網羅的に示せた優れた監査であると評価する。","不適合は、事業者の判断で是正が不要と決められ、是正の期限や是正処置の記録を残さなくても、監査上の問題にはならない場合がある。","観察事項は、是正期限を必ず定めて是正報告を求め、改善の状況を次回の監査まで継続して確認し、確認結果と改善の効果を記録として残し、次回の監査計画に反映する。","要求事項を満たしていない事象は不適合として是正処置を求め、改善の機会は観察事項として助言にとどめることが多い。"],"correctIndex":3,"explanations":["× 指摘件数の多さは監査の優劣を示すものではなく、不適合と観察事項を区別して扱う必要がある。","× 不適合と判定したものは、事業者の判断だけで是正を不要とすることはできず、記録も必要である。","× 観察事項は不適合ではないため、是正期限を定めて是正報告を求めるものではない。","○ 要求事項を満たさない場合は不適合として扱い、是正処置を求める。"]},{"id":"pms-156","type":"mc","chapterIndex":8,"stem":"是正処置について、適切なものはどれか。","options":["不適合の表面的な症状だけを直せば、原因分析は不要である。","不適合の原因を特定し、再発防止のための是正処置を実施して、その有効性を確認する。","是正処置は、監査員が自ら実施し、被監査部門が行うことは認められていない。","是正処置を実施した時点で、有効性の確認は不要と判断してよい。"],"correctIndex":1,"explanations":["× 症状の修正だけでは、再発防止にならない。","○ 原因の特定と再発防止が是正処置の基本である。","× 是正処置は原則として被監査部門が原因に基づいて実施するものであり、監査員が代行するものではない。","× 有効性の確認は是正処置の一部であり、省略はできない。"]},{"id":"pms-157","type":"mc","chapterIndex":4,"stem":"PMSの文書（規程・手順・記録）の管理について、適切なものはどれか。","options":["文書は紙で一部だけ保存すれば足り、改訂の履歴を残す必要も、旧版の扱いを記録する必要もないため、版管理は不要である。","改訂した文書の旧版は、直ちに全て破棄し、記録は残さない。","文書の版管理を行い、最新版を利用できるように配布・改訂履歴を管理する。","文書は作成者のみが閲覧できるように管理し、他部門には共有しない。"],"correctIndex":2,"explanations":["× 紙の一部保存では、版管理の要件を満たさない。","× 旧版の扱いは、適切な管理と記録が求められる。","○ 版管理と配布の管理が文書管理の基本である。","× 必要な部門が閲覧できない管理は、運用に支障をきたす。"]},{"id":"pms-158","type":"mc","chapterIndex":7,"stem":"マネジメントレビューについて、適切なものはどれか。","options":["経営層が、PMSの適切性・妥当性・有効性を定期的にレビューし、改善の判断を行う。","マネジメントレビューは、担当者レベルで年に1回だけ行えば足り、経営層が結果の報告を受けて改善の判断を行う必要はない。","経営層は、監査結果の報告を受ける必要はない。","外部の審査機関による審査の前にのみ、審査の準備の一環として実施すれば、その他の時期には行う必要がない。"],"correctIndex":0,"explanations":["○ マネジメントレビューは経営層が行い、改善の判断を下すことが求められる。","× 担当者レベルだけでは、経営層の関与が不足する。","× 監査結果は経営層へのインプットであり、報告が必要である。","× マネジメントレビューは審査前だけでなく、計画した間隔で定期的に行う必要がある。"]},{"id":"pms-159","type":"mc","chapterIndex":4,"stem":"教育・訓練について、適切なものはどれか。","options":["教育は新入社員のみを対象とし、入社後に業務内容や取り扱う個人情報が変わっても、以後は改めて受ける必要はない。","教育は、個人情報を扱わない部門には実施しなくてよく、個人情報を扱う部門についても、受講記録は残さなくてもよい。","教育の効果は、受講者の人数や受講の回数だけで評価すればよく、受講後の理解度や業務での実践の状況を確認する必要はない。","従業員の役割に応じて、個人情報保護に関する教育を計画的に実施し、その実施記録を残す。"],"correctIndex":3,"explanations":["× 業務内容や扱う個人情報が変わったときは、役割に応じた教育を改めて受ける必要がある。","× 個人情報を扱う部門の教育では、受講の記録を残すことが求められる。","× 受講者数だけでは、理解度などの効果を評価できない。","○ 役割に応じた計画的な教育と記録が求められる。"]},{"id":"pms-160","type":"mc","chapterIndex":7,"stem":"Pマーク（PMS）の審査の観点として適切なものはどれか。","options":["規程の文言が要求事項に似ていれば、運用の確認は省略される。","規程・手順が要求事項に適合しているかと、実際の運用で記録が残っているかの両面を確認する。","審査は、担当者の知識量のみで評価され、規程や運用の状況は対象にならない。","審査の指摘は、審査後に記録しなくても有効である。"],"correctIndex":1,"explanations":["× 規程の文言だけでは、運用の適合性を確認したことにならない。","○ 審査は規程と運用の両面から確認される。","× 審査では、規程や記録の整備だけでなく、実際の運用の状況も確認される。","× 指摘は記録して改善に結び付けることが求められる。"]},{"id":"pms-161","type":"mc","chapterIndex":7,"stem":"内部監査の報告について、適切なものはどれか。","options":["被監査部門の意向に沿って、指摘を削除したほうが円滑である。","報告書には、指摘事項を記載せず、良好な点のみを記載する。","監査結果を事実に基づき、根拠・指摘事項・推奨事項を明確にして、経営層等に報告する。","監査報告は、監査員が口頭で被監査部門と経営層に伝えれば足り、報告の内容を文書として残す必要はないため、文書化は不要である。"],"correctIndex":2,"explanations":["× 指摘事項を削除すると、報告の客観性を損なう。","× 指摘事項を記載しないと、改善につながらない。","○ 事実と根拠に基づく報告が基本である。","× 文書による報告が必要であり、口頭だけでは足りない。"]},{"id":"pms-162","type":"mc","chapterIndex":8,"stem":"事故の発生後の再発防止について、適切なものはどれか。","options":["事故の原因を分析し、手順の見直しや教育などの再発防止策を実施する。","担当者を交代させれば、原因の分析と再発防止策は不要である。","事故の内容は、原因の究明に関わった一部の関係者にのみ伝えることとし、社内の記録には残さず、外部に知られないように管理する。","再発防止策は、事故から3年経過するまで実施しなくてよく、その間は原因の分析や手順の見直しも行わなくてよい。"],"correctIndex":0,"explanations":["○ 原因分析に基づく再発防止が求められる。","× 担当者の交代だけでは、組織の原因の解決にならない。","× 記録の保持と組織的な共有が必要である。","× 再発防止策は事故後に速やかに実施するもので、期間を空けてよいものではない。"]},{"id":"pms-163","type":"mc","chapterIndex":7,"stem":"Pマーク認証の維持について、適切なものはどれか。","options":["認証は、一度取得すれば以後の運用は任意となり、定期的な審査や内部監査、PMSの見直しを行わなくても、認証の効力は続くとされている。","認証の維持には、審査機関に毎月報告し、その都度、審査機関の承認を得てPMSの運用計画を変更する必要がある。","認証は、取得時の審査結果があれば、以後の運用状況や従業員の教育の実施状況を問われることなく、有効性が保たれる。","PMSを継続的に運用し、定期的な審査・内部監査を通じて改善を続ける。"],"correctIndex":3,"explanations":["× 一度の取得で運用が任意になるわけではない。","× 認証の維持に毎月の報告や承認は要求されておらず、定期的な審査と内部監査が求められる。","× 認証の維持には、運用状況や教育の実施状況の継続的な確認が必要で、取得時の結果だけでは足りない。","○ 継続的な運用と改善が認証の維持に必要である。"]},{"id":"pms-164","type":"mc","chapterIndex":7,"stem":"内部監査のサンプリングについて、適切なものはどれか。","options":["監査員が気になる件だけを選び、抽出根拠は残さない。","監査対象の母集団から代表的な標本を抽出し、抽出の根拠を記録しておく。","サンプルは前回と同じものを使えば、判断材料として十分である。","最初の1件のみを確認すれば、全体の判断として十分である。"],"correctIndex":1,"explanations":["× 恣意的な選択は、代表性を損なう。","○ 代表性のある抽出と根拠の記録が求められる。","× 前回と同じサンプルでは、今回の監査対象の状況を反映できない。","× 1件のみでは、全体の状況を判断する根拠にならない。"]},{"id":"pms-165","type":"mc","chapterIndex":7,"stem":"委託先の管理状況の監査について、適切なものはどれか。","options":["委託先の管理は、契約書を締結し、個人情報の取扱いに関する条項を盛り込んだ時点で完了したものとみなし、以後の確認は不要とする。","委託先の監査は、委託先の自己申告のみで行うのが原則である。","委託先の管理状況を、契約内容と照らして定期的に確認し、記録を残す。","委託先で事故があった場合、委託元側は内部監査の対象外とする。"],"correctIndex":2,"explanations":["× 契約締結は管理の始まりであり、完了ではない。","× 自己申告だけでは、客観的な確認にならない。","○ 契約内容に照らした定期的な確認が求められる。","× 委託先の事故は、委託元の内部監査で確認すべき対象である。"]},{"id":"pms-166","type":"mc","chapterIndex":1,"stem":"個人情報の棚卸しについて、適切なものはどれか。","options":["取り扱う個人情報の種類・利用目的・保管場所・保存期間等を棚卸しし、台帳として定期的に更新する。","棚卸しは、システム担当者が一度だけ行えば、以後の更新は不要である。","台帳には、利用しているシステムの名称や担当部署を記載すれば足り、取り扱う個人情報の種類や保管場所は記載の対象に含めなくてよい。","保管場所は台帳に記載せず、担当者の記憶や個人の判断で管理してよく、台帳の更新も必要に応じて行えばよい。"],"correctIndex":0,"explanations":["○ 棚卸し台帳は定期的な更新が求められる。","× 棚卸しは一度きりでは足りず、定期的な更新が必要である。","× 台帳には、利用目的や保管場所などを含める必要があり、システム名や担当部署だけでは足りない。","× 保管場所は台帳に記載し、担当者の記憶に頼らず管理する必要がある。"]},{"id":"pms-167","type":"mc","chapterIndex":5,"stem":"個人情報に関する苦情・問い合わせへの対応について、適切なものはどれか。","options":["苦情は、担当者が個人的に処理し、組織としての記録は残さず、対応した内容を報告する必要もない。","苦情や問い合わせは、一定の期間が過ぎたものについては、受付の記録を残し、担当者の判断により対応しないことができる。","問い合わせは、窓口を公表せず、個別に申し出があったものだけ対応し、対応の記録や結果の共有は行わなくてよい。","苦情・問い合わせの窓口を定め、受付・対応・記録の手順を整備し、対応結果を記録する。"],"correctIndex":3,"explanations":["× 苦情は組織として受け付け、対応の記録を残す必要がある。","× 受付の記録を残しても、担当者の判断で苦情への対応を省略することはできない。","× 窓口は公表して受付の仕組みを整えるものであり、対応の記録や共有を省略してはならない。","○ 窓口の設置と手順の整備、記録が求められる。"]},{"id":"pms-168","type":"mc","chapterIndex":8,"stem":"内部監査で発見された不適合の是正期限について、適切なものはどれか。","options":["是正期限は、影響度に関係なく一律に同じ期限とする。","是正期限は不適合の影響度に応じて決め、期限内に是正結果を確認する。","是正期限は設けず、完了の報告があれば足りる。","是正期限は、被監査部門の判断で自由に延長できる。"],"correctIndex":1,"explanations":["× 一律の期限は、影響度を反映しない。","○ 影響度に応じた期限設定と、結果の確認が求められる。","× 期限を設けないと、是正の進捗を管理できない。","× 是正期限の延長は、理由と承認者を記録し、監査上の管理の下で行う必要がある。"]},{"id":"pms-169","type":"mc","chapterIndex":4,"stem":"内部監査員に求められる力量について、適切なものはどれか。","options":["内部監査員の資格を取得すれば、以後は監査の知識や技能を維持するための教育や訓練を受ける必要はなく、力量が自然に維持される。","監査員の力量は、監査対象部門の業務知識だけで十分である。","監査に必要な知識・技能（規格・監査手法）を備え、教育・訓練によって力量を維持する。","監査員は、監査の経験があれば、規格の知識は不要である。"],"correctIndex":2,"explanations":["× 資格取得後も、監査の力量は維持のための教育・訓練が必要であり、自然に維持されるわけではない。","× 業務知識だけでは、監査の知識・技能の要件を満たさない。","○ 監査に必要な知識・技能を備え、教育・訓練で力量を維持することが求められる。","× 規格の知識は、監査の基礎として必要であり、経験だけで代えられない。"]},{"id":"pms-170","type":"mc","chapterIndex":7,"stem":"監査プログラムの見直しについて、適切なものはどれか。","options":["監査結果や組織の変化を踏まえ、監査プログラムを定期的に見直す。","監査プログラムは最初に一度作成すれば、以後は組織の変化や監査結果にかかわらず、変更してはならず、同じ内容で繰り返し実施する。","見直しは審査機関の指示がある場合にのみ行う。","監査プログラムは、監査員の都合や予定に合わせて毎回変えるのが望ましく、変更の理由を記録する必要はない。"],"correctIndex":0,"explanations":["○ 監査結果や組織の変化に応じて見直すことが求められる。","× 監査プログラムは、監査結果や組織の変化を踏まえて見直す必要がある。","× 見直しは審査機関の指示を待つものではなく、監査結果や組織の変化に応じて定期的に行う。","× 監査員の都合で毎回変えることは、監査の計画性や一貫性を損なう。"]},{"id":"pms-171","type":"mc","chapterIndex":4,"stem":"PMSの運用記録の保管について、適切なものはどれか。","options":["記録は、作成者が個人のパソコンや手元で保管すれば足り、組織としての保管や保管場所の管理は一切不要であり、廃棄の記録も残さなくてよい。","監査の記録は、監査が終了した直後に全て廃棄し、次回の監査では前回の記録を参照せずに、ゼロから計画を立て直すことが望ましい。","記録は電子化すれば、いつでも内容を書き換えてよく、書き換えた履歴や改訂の記録を残す必要はなく、保管期間の管理も一切不要である。","教育記録・点検記録・監査記録などの運用記録を、定められた期間保管し、必要に応じて提示できるようにする。"],"correctIndex":3,"explanations":["× 運用記録は組織として保管し、必要に応じて提示できるようにしておく必要がある。","× 監査記録の直ちの廃棄は、運用の証拠を失う。","× 電子化した記録でも、内容を書き換える場合は履歴を残し、改ざんを防ぐ必要がある。","○ 運用記録は組織として定められた期間保管し、提示できる状態にする必要がある。"]},{"id":"pms-172","type":"mc","chapterIndex":7,"stem":"各部門の運用点検について、適切なものはどれか。","options":["点検は、事故が起きた後にのみ実施すればよい。","各部門の責任者が、個人情報の取扱いが規程どおり行われているかを定期的に点検し、結果を記録する。","点検は、担当者が必要ないと判断した場合には省略してよい。","点検結果は部 const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}

</script>
</body>
</html>
