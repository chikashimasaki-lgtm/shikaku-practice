erIndex":10,"stem":"データポイズニング（data poisoning）の説明として、最も適切なものはどれか。","options":["本番環境でのリクエストが急増し、サービスが停止すること。これは、負荷の集中によって処理が追いつかなくなり、利用者全体が一時的にサービスを利用できなくなる現象であり、学習データへの混入とは無関係とされている。","推論時の入力に微小な摂動を加えて誤分類させ、入力検証を省略すること。","誤った出力を防ぐため、モデルの出力を大量に取得して、模倣モデルを作るために、学習に使われるすべての入力データと出力の組を外部へ公開し、誰でも再利用できる状態にしておくこと。","学習やファインチューニングのデータに悪意のあるデータを混入させ、バックドアや偏り、性能劣化を生じさせる攻撃。"],"correctIndex":3,"explanations":["× これはリソース消費や過負荷の問題で、データポイズニングとは異なる。","× 推論時の入力を狙う回避攻撃の説明であり、学習データへの混入ではない。","× これはモデル抽出（model extraction）の説明である。","○ 学習データの出所と品質の管理が、重要な対策となる。"]},{"id":"aaia-163","type":"mc","chapterIndex":10,"stem":"モデル抽出（model extraction / stealing）攻撃への対策として、最も適切なものはどれか。","options":["APIの認証、レート制限、異常なクエリパターンの監視を行う。","APIを匿名で無制限に公開し、認証や利用量の制限を設けず、利用者の自由な利用に任せること。","モデルの出力の精度を、できるだけ高い桁数まで細かく返し、利用者がその詳細な数値を自由に参照できる状態を維持すること。","ログを取得せず、利用状況や問い合わせの内容は一切把握せず、攻撃や不正の兆候があっても対応しない運用を続けること。"],"correctIndex":0,"explanations":["○ 大量の問い合わせから模倣モデルを作る攻撃には、利用の制限と監視が有効である。","× 無制限の公開は、攻撃を容易にする。","× 詳細な出力を返すほど、抽出されやすくなる。","× ログがなければ、攻撃の検知も調査もできない。"]},{"id":"aaia-164","type":"mc","chapterIndex":10,"stem":"回避攻撃（evasion attack / adversarial examples）の説明として、最も適切なものはどれか。","options":["学習時にデータへ悪意のあるデータを混ぜる攻撃。","推論時の入力に人間には気づきにくい細工を加え、モデルに誤った分類をさせる攻撃。","管理者パスワードを推測して不正にログインする攻撃。","モデルの学習に必要な電力を増加させる攻撃。"],"correctIndex":1,"explanations":["× これは学習段階を狙うデータポイズニングである。","○ 例えば画像にわずかな摂動を加えて、別のクラスと誤認させる。","× これは一般的な認証への攻撃である。","× 電力の増加は、回避攻撃の仕組みではない。"]},{"id":"aaia-165","type":"mc","chapterIndex":10,"stem":"OWASP LLM Top 10にある「過剰な権限（Excessive Agency）」への対策として、最も適切なものはどれか。","options":["LLMベースのエージェントに付与する機能・権限・自律性を必要最小限にし、重要な操作には人間の承認を挟む。","エージェントに、すべてのシステムの管理者権限を与え、業務効率を最大化するため、重要な操作にも人間の承認を求めず、監査ログの記録も必要に応じて行うこととすること。","エージェントの行動ログを一切取らない。","エージェントが生成する指示を、そのまま全て自動で実行する。"],"correctIndex":0,"explanations":["○ 過大な権限があると、誤りや攻撃により意図しない操作が実行される。","× 最小権限の原則に反する。","× 監視と追跡ができなくなる。","× 検証なしの自動実行は、被害を拡大させる。"]},{"id":"aaia-166","type":"mc","chapterIndex":10,"stem":"OWASP LLM Top 10の「不適切な出力処理（Improper Output Handling）」に該当する例として、最も適切なものはどれか。","options":["LLMの学習データに古い情報が含まれていて、そのため出力が時代遅れになり、利用者が古い情報に基づいて判断してしまう可能性があるため、定期的な再学習と情報の更新が必要になること。","LLMが生成した出力を検証・サニタイズせずに、ウェブ画面やコマンドとして後続の処理に渡してしまうこと。","学習データの量が増え続け、保存されるデータが大きくなって、保管の費用が年々増大し、データの管理に専任の担当者を割く必要が生じること。","利用者が長い質問を入力すること。"],"correctIndex":1,"explanations":["× これは情報の鮮度の問題で、出力処理の脆弱性とは異なる。","○ 出力を信頼しすぎると、スクリプトの実行などの脆弱性につながる。","× 保管コストは運用上の課題で、出力処理の不備とは異なる。","× 入力の長さそのものは脆弱性ではない。"]},{"id":"aaia-167","type":"mc","chapterIndex":10,"stem":"OWASP LLM Top 10のサプライチェーン（LLM03）に関するリスクへの対策として、最も適切なものはどれか。","options":["ダウンロード数が多いモデルは安全であるとして、利用者の評価や出所の確認を行わずに、そのまま社内の本番環境へ無検証で採用することを標準の手順とすること。","非公式の配布元から入手したモデルを、そのまま本番に使い、入手元の信頼性や改ざんの有無は、稼働後に問題が起きた場合にのみ、必要に応じて確認することとすること。","事前学習モデルやライブラリの出所を検証し、改ざんの有無を確認するとともに、構成要素の一覧を管理する。","依存関係の一覧は作らず、ライブラリや部品の更新も行わず、一度導入したものを長期間そのまま使い続け、脆弱性の情報も確認しないこととすること。"],"correctIndex":2,"explanations":["× 人気は安全性を保証しない。","× 出所不明のモデルは、リスクが高い。","○ 外部コンポーネントの信頼性を確認することで、悪意あるモデルや脆弱な依存関係の混入を防げる。","× 管理されない依存は、脆弱性の温床となる。"]},{"id":"aaia-168","type":"mc","chapterIndex":10,"stem":"MITRE ATLASの説明として、最も適切なものはどれか。","options":["AIモデルの学習を高速化するためのソフトウェアライブラリ。","AIに関する税務上の取扱いの規則。","AIの倫理委員会の設置を義務づける法律。","AIシステムに対する攻撃者の戦術・技術・事例をまとめたナレッジベースで、脅威モデリングや対策の検討に使える。"],"correctIndex":3,"explanations":["× ATLASは、脅威情報のナレッジベースである。","× 税務の規則ではない。","× 法律ではなく、攻撃手法の知識体系である。","○ ATT&CKに倣った枠組みで、実際の攻撃事例やレッドチームの知見に基づいている。"]},{"id":"aaia-169","type":"mc","chapterIndex":10,"stem":"OWASP LLM Top 10の「無制限の消費（Unbounded Consumption）」への対策として、最も適切なものはどれか。","options":["利用量の上限は設けず、事後に費用の内訳を調べる運用とする。","すべての利用者に、同一の無制限のAPIキーを配布する。","出力の長さに上限を設けず、可能な限り長く生成させることを基本とし、その結果として資源とコストを過剰に消費しても、問題としては扱わないこととする。","リクエストのレート制限、入力サイズの上限、利用量のクォータ、コストの監視を設定する。"],"correctIndex":3,"explanations":["× 事後にしか気づけず、被害が拡大する。","× 共有キーは追跡できず、乱用も止められない。","× 制限がないと、資源とコストを過剰に消費しうる。","○ 過剰な利用によるサービス停止や想定外の費用増加を抑えられる。"]},{"id":"aaia-170","type":"mc","chapterIndex":10,"stem":"メンバーシップ推論攻撃（membership inference attack）の説明として、最も適切なものはどれか。","options":["モデルの学習を停止させ、さらにサービスを利用不能にし、その結果として学習データの一部を外部へ流出させる攻撃で、障害の復旧と同時に情報の回収を狙うもの。","入力に画像を加え、モデルを誤分類させる攻撃。","特定のデータが、モデルの学習データに含まれていたかどうかを推測する攻撃で、プライバシー侵害につながる。","利用者に偽のログイン画面を表示して、認証情報を入力させ、その情報を用いて不正にアクセスする攻撃で、モデルの学習データの推測を目的とするもの。"],"correctIndex":2,"explanations":["× これはサービス妨害であり、推論攻撃ではない。","× これは回避攻撃の説明である。","○ 対策として、差分プライバシーの適用や過学習の抑制、出力情報の制限などがある。","× フィッシングであり、モデルの学習データを推測する攻撃ではない。"]},{"id":"aaia-171","type":"mc","chapterIndex":10,"stem":"AIモデルのAPIキーや接続情報の管理に関する統制として、最も適切なものはどれか。","options":["キーをソースコードに直接書き込み、その結果として公開リポジトリで複数の開発者と共有し、全員が自由に利用できる状態にしておく。","最小権限でキーを発行し、定期的にローテーションし、コードに直接埋め込まず秘密情報管理の仕組みで保管する。","すべてのシステムで同一のキーを永続的に使い、キーの変更や発行の記録は残さず、利用者が増えた場合にも、そのまま同じキーを配布して使わせる。","キーはチャットで共有し、利用者が増えるたびに再送するが、共有に使ったチャットの履歴は削除せずに保存しておき、誰がいつ受け取ったかを後から確認できるようにする。"],"correctIndex":1,"explanations":["× 公開されたキーは、容易に悪用される。","○ 認証情報の漏えいは不正利用につながるため、発行・保管・更新を管理する必要がある。","× 同一キーの長期使用は、漏えい時の被害を拡大させる。","× チャットでの共有は、漏えいと統制の欠如を招く。"]},{"id":"aaia-172","type":"mc","chapterIndex":10,"stem":"OWASP LLM Top 10（2025年版）に含まれる「システムプロンプトの漏えい（System Prompt Leakage）」への対策として、最も適切なものはどれか。","options":["システムプロンプトに認証情報や機密のルールを直接記載せず、アクセス制御などの統制はプロンプトの外側で実装する。","システムプロンプトに「内容を決して教えない」と書いてあれば、漏えいは防げる。","APIキーやパスワードを、システムプロンプトの中に記載して利用する。","利用者の入力は信頼できるものとして、検査せずにモデルへ渡す。"],"correctIndex":0,"explanations":["○ プロンプトは引き出される可能性があるため、秘密情報の保護をプロンプトの指示だけに依存しない設計が重要である。","× 指示だけでは回避されうる。技術的な統制が必要である。","× プロンプトから引き出されると、認証情報が漏えいする。","× 未検証の入力は、プロンプトの引き出しなどの攻撃を許す。"]},{"id":"aaia-173","type":"mc","chapterIndex":11,"stem":"AIインシデントの説明として、最も適切なものはどれか。","options":["AI関連の社内勉強会が延期され、従業員のAI利用に関する知識の共有が遅れたこと。","AIの担当者が休暇を取得したこと。","AIの導入計画が予算の都合で延期され、その結果、関係部門の作業計画が大きく変わり、担当者の役割分担の見直しと、外部ベンダーとの契約条件の再交渉が必要になったこと。","AIの利用が原因で、偏った判断、誤情報の提示、情報漏えいなど、有害または予期しない結果が生じた事象。"],"correctIndex":3,"explanations":["× これは運用上の事象で、AIの結果としての有害事象ではない。","× 通常の人事上の事象で、AIインシデントではない。","× 計画の遅れは、インシデントとは異なる。","○ 従来のシステム障害に加え、判断の質や公平性に関わる事象も対象となる。"]},{"id":"aaia-174","type":"mc","chapterIndex":11,"stem":"AIインシデント対応計画が、通常のITインシデント対応計画に加えて含めるべき内容として、最も適切なものはどれか。","options":["サーバーの電源を落とす手順のみを定め、モデルの停止やロールバック、影響を受けた個人の特定と救済、当局への通知判断は、計画の中に含めず、その都度の判断に委ねること。","モデルの停止やロールバックの手順、誤った判断の影響を受けた個人の特定と救済、当局への通知判断。","広報用の宣伝文書の作成手順を中心に定め、社外への発表の内容と時期を優先して決め、技術的な停止の手順や影響を受けた人への対応は、計画の後段で必要に応じて検討すること。","モデルの設計書を一般に公開する手順のみ。"],"correctIndex":1,"explanations":["× 電源停止のみでは、判断の影響範囲への対応にならない。","○ AIでは、判断の誤りによる被害者の特定と救済も重要になる。","× 宣伝は対応計画の中心ではない。","× 公開が必須ではなく、対応の優先事項でもない。"]},{"id":"aaia-175","type":"mc","chapterIndex":11,"stem":"AIが不適切な出力を大量に生成していることが判明した。初動として最も適切な対応はどれか。","options":["原因が特定されるまで、通常どおり稼働を続け、利用者への影響は観察しながら、必要と判断した時点で、関係者に報告するかどうかを検討することとする。","利用者には知らせず、静かに修正して済ませ、影響を受けた個人への通知は、問題が公になってから必要性を検討することとし、当面は社内の対応だけで完結させる。","影響の拡大を止めるため、該当機能の停止や、従来手順・安全なモデルへの切り替えなどの封じ込めを行う。","問題の原因を担当者個人の責任と位置づけ、その担当者を処分して事態の収拾を図り、以後の対応は組織の判断として進めること。"],"correctIndex":2,"explanations":["× 稼働継続は被害の拡大を招く。","× 影響を受けた者への対応と、必要な報告を怠るおそれがある。","○ 被害の拡大を防ぐことが先決であり、原因調査はその後に行う。","× 処分は封じ込めにならず、再発防止にも寄与しない。"]},{"id":"aaia-176","type":"mc","chapterIndex":11,"stem":"AIインシデントの根本原因分析（RCA）として、最も適切なものはどれか。","options":["データ、モデル、プロンプト、運用手順など複数の層にわたって原因を調査し、再発防止策を特定する。","モデルの名前を変更し、旧バージョンの記録を削除して、対応を完了として扱う。","直接の担当者個人の過失のみを原因として扱う。","原因分析は行わず、再起動で復旧させる。"],"correctIndex":0,"explanations":["○ AIの問題は複数の要因が絡むため、層ごとに検証して恒久対策につなげる。","× 名称変更は原因の解消にならない。","× 個人の責任に帰すだけでは、仕組みの問題を見逃す。","× 原因を調べなければ、再発する。"]},{"id":"aaia-177","type":"mc","chapterIndex":11,"stem":"AI関連のインシデントを早期に検知するための仕組みとして、最も適切なものはどれか。","options":["利用者からの報告は受け付けず、内部の監視のみで判断する。","性能・ドリフト・公平性の自動モニタリングに加え、利用者や従業員が問題を報告できる窓口を設ける。","年に1度の定期監査の結果だけで、問題を把握する。","問題が報道されてから対応を始め、社内の検知の仕組みは従来のまま据え置き、必要に応じて事後に見直すこととし、外部からの指摘を受けてから、対応の優先度と体制を検討する。"],"correctIndex":1,"explanations":["× 現場からの報告は、重要な検知の手段である。","○ 技術的な監視と人からの報告を併用すると、検知の漏れが減る。","× 検知までの時間が長く、被害が拡大する。","× 外部からの指摘を待つのでは遅い。"]},{"id":"aaia-178","type":"mc","chapterIndex":11,"stem":"AIシステムが停止した場合の業務継続のため、最も適切な準備はどれか。","options":["AIは停止しないと仮定して、代替手順は作らず、停止が起きた場合も、その時点の判断で業務の再開を試みるものとし、事前の準備は最小限にとどめる。","停止した場合は、業務を数日間止めてよいとし、代替の手順は必要に応じて担当者が現場で判断して対応し、事後の検証や記録の作成は一切行わない方針とする。","代替手順は作成するが、一度も試験しない。","手作業や従来のルールベースの処理へ切り替えるフォールバック手順を事前に定め、試験しておく。"],"correctIndex":3,"explanations":["× 停止は起こりうる事象であり、備える必要がある。","× 業務の重要度によっては許容されない。","× 試験していなければ、実際に使えるか分からない。","○ AIに依存する業務は、停止時の代替手段がなければ業務が止まる。"]},{"id":"aaia-179","type":"mc","chapterIndex":11,"stem":"AIが個人データを漏えいしたインシデントが発生した。最も適切な対応はどれか。","options":["適用される法令の通知義務と期限を確認し、法務・プライバシー担当と連携して対応する。","AIの問題であるため、通知義務は発生しないと判断し、法務部門との相談や報告の準備は行わずに、その判断を社内に通知して対応を終える。","通知は、問題が収束してから半年後に行えば十分であり、被害者への説明は、必要が生じたときに個別に検討すれば足りると整理しておく。","漏えいの事実は社内にも共有せず、関係者にも伝えず、必要な期限が来るまで、外部への通知を含むすべての対応を見送り、そのまま隠し通す方針とする。"],"correctIndex":0,"explanations":["○ 通知義務は法域ごとに異なるため、早期に専門部門と判断する必要がある。","× AIが原因でも、個人データの漏えいには法令上の義務が生じうる。","× 期限があるため、遅れると法令違反となるおそれがある。","× 隠蔽は、被害と責任をさらに拡大させる。"]},{"id":"aaia-180","type":"mc","chapterIndex":11,"stem":"同様のAIの誤判断が繰り返し発生している。最も適切な対応はどれか。","options":["発生のたびに個別に応急処置を行い、記録は残さない。","誤判断はAIの宿命として受け入れ、改善は後回しにする。","問題管理のプロセスで根本原因を特定し、恒久的な対策を実施する。","問題を報告した担当者に注意を与える。"],"correctIndex":2,"explanations":["× 記録がなければ、傾向の把握も改善もできない。","× 原因分析と改善の努力を放棄している。","○ 個別対応を繰り返すだけでは再発するため、原因の除去が必要である。","× 報告を抑制し、問題の発見を遅らせる。"]},{"id":"aaia-181","type":"mc","chapterIndex":11,"stem":"AIサービスを提供する外部ベンダーで障害が発生した場合に備え、事前に整えておくべきことはどれか。","options":["ベンダーに任せきりで、連絡体制は特に決めない。","契約上のSLA、インシデント通知義務、連絡体制、障害時の協力範囲を明確にしておく。","障害時には、ベンダーを法的に訴えることだけを検討する。","ベンダーの障害情報は、業務への影響が実際に出るまで確認せず、契約上の通知義務も定期的な連絡体制も必要とせず、障害の発生後に必要な範囲で対応を決めればよいと整理しておく。"],"correctIndex":1,"explanations":["× 連絡の取り決めがないと、初動が遅れる。","○ ベンダーの障害は自社の業務に直結するため、通知と連携の取り決めが必要である。","× 法的措置は一手段にすぎず、まず復旧と連携が優先される。","× 早期の把握が影響の軽減に重要である。"]},{"id":"aaia-182","type":"mc","chapterIndex":11,"stem":"AIインシデント対応計画の実効性を確認する方法として、最も適切なものはどれか。","options":["AIに関するシナリオを用いた机上演習（tabletop exercise）を行い、手順や役割の不備を洗い出す。","計画書を作成した時点で、実効性は確認済みとみなす。","実際のインシデントが起きるまで確認せず、発生時に初めて手順を試し、その際に課題が見つかれば、その都度対応を改善することとして、事前の演習は行わない。","演習は技術者だけで実施し、経営層や広報は参加させず、結果も社内で共有せずに関係者のみで保管し、次回の演習計画にも反映させない運用とする。"],"correctIndex":0,"explanations":["○ 実際の対応前に演習で課題を見つけて改善できる。","× 計画書の存在だけでは、実際に機能するか分からない。","× 実際の発生時では、準備不足の影響が大きい。","× 関係部門が参加しないと、組織全体の対応を確認できない。"]},{"id":"aaia-183","type":"mc","chapterIndex":11,"stem":"AIインシデントの事後レビューで記録すべき内容として、最も適切なものはどれか。","options":["担当者の個人的な感想のみを記録し、事実関係や原因の分析は、感想の内容に応じて必要な範囲で記録すれば足りるとし、詳細な記録は残さない運用とする。","問題は解決済みであるため、一切記録せず、同種の問題が起きた際には担当者の記憶をもとに、その場で判断して対応すればよい。","責任者を特定して処分することを中心に記録し、その結果を社内の関係者に通知することで、再発防止の取組みを一区切りとする運用とする。","発生の経緯、影響範囲、原因、対応内容、再発防止策、および教訓を記録し、リスク管理に反映する。"],"correctIndex":3,"explanations":["× 感想だけでは、改善に必要な情報が不足する。","× 記録しなければ、同種の問題に学べない。","× 仕組みの改善に結びつかない。","○ 記録を蓄積すれば、傾向分析や統制の改善に活用できる。"]},{"id":"aaia-201","type":"mc","chapterIndex":12,"stem":"あなたはAIを用いた与信審査モデルの監査を担当している。監査計画の初期段階で最初に行うべき最も適切な対応はどれか。","options":["社内のデータサイエンティストが正式に監査チームへ加わり、AIの技術的な論点を十分に整理できる体制が整うまで、監査計画全体を保留する。","AIの利用目的・影響度・使用データ・意思決定への関与度を把握し、リスク評価に基づいて監査範囲と重点領域を決める。","モデルのアルゴリズムの数理的な詳細をすべて理解してから、監査範囲を決める。","経営陣が提示した過去のモデル性能報告書だけに基づき、テスト手続を確定し、追加の検証は求めない。"],"correctIndex":1,"explanations":["× 誤り。専門家の参加を待って計画全体を保留すると、初期段階で必要なリスク評価が行われない。","○ 正しい。利用目的、影響度、使用データ、意思決定への関与を把握し、リスク評価に基づいて範囲と重点を決める。","× 誤り。数理の詳細の理解は、監査範囲を決める前提ではなく、リスク評価の方が先である。","× 誤り。経営陣の報告だけに依存すると独立した証拠にならず、テスト手続を先に確定すべきでもない。"]},{"id":"aaia-202","type":"mc","chapterIndex":12,"stem":"リスクベースのAI監査計画で、複数のAIシステムの中から監査対象の優先順位を決める基準として最も適切なものはどれか。","options":["導入時期が新しいシステムほど統制が未整備の可能性が高いと考えられるため、導入の新しい順に優先して監査対象へ選ぶ。","使われている技術が最新であるほど優先する。","開発費用の大きい順に監査対象を選ぶと、業務上のリスクや個人への影響が反映されないまま、優先順位が決まってしまい、重要な対象を見逃すおそれがある。","個人の権利や安全に影響する自動意思決定への関与度と、誤作動・誤判断が生じた場合の影響の大きさ。"],"correctIndex":3,"explanations":["× 誤り。導入時期が新しいことは統制の未整備を示す根拠にはなりうるが、リスクの大きさそのものを示さない。","× 誤り。技術の新しさは、それ自体がリスクの大きさを示さない。","× 誤り。費用の大きさは、業務への影響や権利侵害のリスクとは一致しないため、優先順位の基準として不十分である。","○ 正しい。個人の権利や安全への影響と、誤りの影響の大きさは、リスクに基づく優先順位付けの中心的な基準である。"]},{"id":"aaia-203","type":"mc","chapterIndex":12,"stem":"AIシステムの監査に必要な専門知識が監査チームに不足していることが分かった。監査人の対応として最も適切なものはどれか。","options":["研修・要員追加・外部専門家の活用などで必要な専門知識を計画段階で確保し、結論への責任は監査人が保持する。","専門知識が必要な部分は監査範囲から外し、その事実を報告書に記載せずに、判断の対象を減らして監査を早く終えてしまう。","開発ベンダーの担当者に、監査手続の設計と結果の評価をすべて任せ、監査人は確認せずに結論を受け取ることで、作業量を減らす。","専門知識が不足している以上、監査の目的を達成できないと判断して、監査そのものを中止し、その旨を経営陣へ通知せずに完了させる。"],"correctIndex":0,"explanations":["○ 正しい。専門知識は研修・要員追加・外部専門家で補い、結論の責任は監査人が負う。","× 誤り。範囲から外して記載しないことは、監査の透明性と報告の完全性を損なう。","× 誤り。手続の設計と評価を被監査側に任せると、独立性が失われる。","× 誤り。監査を中止して経営陣へ通知しないことは、報告義務に反する。"]},{"id":"aaia-204","type":"mc","chapterIndex":12,"stem":"ある企業が採用選考にAIによるスクリーニングを導入している。この監査の目的として最も適切なものはどれか。","options":["AIの予測精度が業界で最も高いことを証明すること。","AI導入によるコスト削減額を算定すること。","採用判断へのAI利用が、組織の方針、適用される法規制、公平性の要求事項に沿って管理されているかを評価すること。","開発に使われた言語が社内の技術標準に合うかを確認すること。"],"correctIndex":2,"explanations":["× 誤り。監査は業界最高の精度を証明する目的ではなく、統制の妥当性を評価するためのものである。","× 誤り。コスト削減額の算定は、監査の目的ではない。","○ 正しい。方針・法規制・公平性への適合を統制の観点から評価することが監査の目的である。","× 誤り。技術標準への適合は、AIの採用判断に関する統制の評価とは別の論点である。"]},{"id":"aaia-205","type":"mc","chapterIndex":12,"stem":"AI監査プログラムの設計で、AIソリューションのライフサイクル（設計・開発・導入・運用・廃止）を踏まえる主な理由はどれか。","options":["本番稼働後はモデルが一度も変化しない前提のため、開発段階の統制と検証結果を確認すれば、監査の目的は十分に達成できるから。","各段階に固有のリスクとコントロールがあり、段階ごとに監査手続を対応づける必要があるから。","廃止段階には通常リスクがないため、監査から除外してよいから。","段階が多いほど、監査報酬を高く設定できるから。"],"correctIndex":1,"explanations":["× 誤り。モデルは運用中にも変化しうるため、開発段階の確認だけでは目的を達成できない。","○ 正しい。各段階に固有のリスクとコントロールがあるため、段階ごとに監査手続を対応づける必要がある。","× 誤り。廃止段階にも、データの扱いや記録の確保などのリスクがあり、監査から外してよいとは限らない。","× 誤り。段階の数は、監査報酬の設定根拠にならない。"]},{"id":"aaia-206","type":"mc","chapterIndex":12,"stem":"組織が外部ベンダー提供のSaaS型AIサービスを業務で利用している。監査計画で最も重要な考慮事項はどれか。","options":["契約上の監査権、保証報告書の入手可否、データの取扱いなどを確認し、ベンダー統制を評価できる範囲と不足分を補う手続を計画する。","ベンダーが所有するモデルなので、監査範囲外と判断する。","ベンダーの販促資料と営業担当者の説明、既存顧客からの推薦コメントを主な証拠とし、委託先の統制は実地の確認を省いても、有効であると結論づけるのに十分な根拠になると判断する。","同等のモデルを自社で再開発し、その結果とベンダーの出力を比較することを前提として、委託先の統制評価そのものを省略し、契約の継続可否を比較結果だけで判断する。"],"correctIndex":0,"explanations":["○ 正しい。契約上の監査権や保証報告書、データ取扱いを確認し、不足分を補う手続を計画する。","× 誤り。委託している以上、利用者側は委託先の統制を評価する責任を負い、範囲外とはならない。","× 誤り。販促資料や推薦コメントは独立した客観的証拠ではなく、統制の有効性の根拠にならない。","× 誤り。自社での再開発は、委託先の統制評価の代替にならず、評価を省略する理由にもならない。"]},{"id":"aaia-207","type":"mc","chapterIndex":12,"stem":"AIシステムに対して継続的監査（continuous auditing）を適用する利点として、最も適切なものはどれか。","options":["自動化されたテストを導入すれば、内部統制の整備状況や運用状況を個別に評価する必要がなくなり、監査の証拠はすべて自動的に揃う。","監査人の独立性の要件が適用されなくなるため、評価を担当者の裁量で自由に決めることができ、結果を客観的に示す必要もなくなる。","テスト対象の母集団の定義を省略できるため、どの取引を検証したかを記録せずに、全体の結論を即座に示すことができる。","モデルの出力や入力データの異常を年次監査を待たずに継続的に検知でき、ドリフトなどの兆候に早く対応できる。"],"correctIndex":3,"explanations":["× 誤り。自動テストを導入しても、統制の整備と運用状況の評価は必要で、証拠が自動的に揃うわけではない。","× 誤り。継続的監査の利点は独立性要件の免除ではなく、独立性は維持すべきものである。","× 誤り。母集団の定義は検証結果の解釈に欠かせず、省略できる利点ではない。","○ 正しい。出力や入力の異常を継続的に検知し、ドリフトなどに早く対応できる点が利点である。"]},{"id":"aaia-208","type":"mc","chapterIndex":13,"stem":"AIモデルが特定の属性集団に不利な結果を出していないかを確認するテストとして、最も適切なものはどれか。","options":["全体の平均精度と正解率だけを確認し、基準を上回れば問題ないと判断する。","ソースコードの行数と複雑度を測定する。","属性別のグループごとに出力や誤り率を比較し、差異が許容範囲内かを評価する（公平性テスト）。","学習に使用したハードウェアの仕様を確認する。"],"correctIndex":2,"explanations":["× 誤り。全体の平均は一部の属性集団での不利な結果を隠しうるため、それだけでは判断できない。","× 誤り。ソースコードの行数は、公平性の評価と直接の関係がない。","○ 正しい。属性別に出力や誤り率を比較し、差異が許容範囲にあるかを確かめる。","× 誤り。学習に使ったハードウェアの仕様は、属性集団への不利の有無を確かめる手続ではない。"]},{"id":"aaia-209","type":"mc","chapterIndex":13,"stem":"AIモデルの検証で、監査人による独立した再実行（reperformance）が強い証拠となる理由として、最も適切なものはどれか。","options":["監査人自身が同じ入力で結果を再現するため、経営陣の報告に依存せずに結果の一致を確認できるから。","経営陣が作成した結果をそのまま転記すれば足りるから。","口頭での質問に対する回答を、そのまま証拠として採用できるから。","再実行の結果が一致すれば、モデルへの入力データの正確性・網羅性を別途確認する必要がなくなり、データ系譜の検証も省略できるから。"],"correctIndex":0,"explanations":["○ 正しい。監査人が同じ入力から結果を再現し、経営陣の報告に依存せずに一致を確かめられるため。","× 誤り。経営陣の転記では、監査人が独立に結果を確かめたことにならない。","× 誤り。口頭の回答は、再実行による検証と同じ証拠力を持たない。","× 誤り。再実行が一致しても、入力データの正確性やデータ系譜の確認は省略できない。"]},{"id":"aaia-210","type":"mc","chapterIndex":13,"stem":"本番環境のAIが生成した決定が非常に多数ある。統計的サンプリングを用いる主な利点はどれか。","options":["統計的サンプリングを用いれば、母集団の定義や抽出方法、判断の根拠を文書化する必要がなくなり、監査人の判断が一切不要になる。","標本が小さいほど、結論が必ず正確になる。","母集団全体のテストが常に可能になるため、抽出方法の文書化や標本の判断は不要となり、結論はそのまま確定する。","標本誤差（サンプリングリスク）を定量的に評価でき、母集団に対する結論を客観的に裏付けられる。"],"correctIndex":3,"explanations":["× 誤り。統計的サンプリングでも、母集団の定義や抽出方法の文書化、判断の根拠は必要である。","× 誤り。標本が小さいほど誤差は大きくなりやすく、結論が正確になるとは限らない。","× 誤り。母集団全体のテストが常に可能なわけではなく、利点として挙げられない。","○ 正しい。標本誤差を定量的に評価でき、母集団に対する結論を客観的に裏付けられる。"]},{"id":"aaia-211","type":"mc","chapterIndex":13,"stem":"非統計的（判断）サンプリングに関する説明として、最も適切なものはどれか。","options":["標本誤差を数量的に評価できるため、母集団の定義や抽出方法の記録を省略しても、どのような状況でも統計的サンプリングの結論は判断サンプリングより優れている。","標本数や抽出を監査人の判断で決めるが、母集団への結論は慎重に導く必要があり、標本誤差を数量的には評価できない。","母集団の定義は、非統計的サンプリングでは判断の対象外となるため、監査人の裁量で任意に決めてよく、文書化も不要である。","抽出の方法と理由は、結論の妥当性を説明する必要がないため記録せずに済ませ、監査人の判断だけで結論を示し、根拠の提示は省いてよい。"],"correctIndex":1,"explanations":["× 誤り。統計的サンプリングにも利点と限界があり、母集団の定義や抽出方法の記録は省略できない。","○ 正しい。標本数と抽出は判断で決めるが、母集団への結論は慎重に導き、誤差を数量的には評価できない。","× 誤り。非統計的サンプリングでも、母集団の定義や抽出方法の記録は必要である。","× 誤り。抽出の方法と理由は、結論の妥当性を説明するために記録が必要である。"]},{"id":"aaia-212","type":"mc","chapterIndex":13,"stem":"運用中のAIモデルの性能劣化（モデルドリフト）を検出するテスト手続として、最も適切なものはどれか。","options":["開発時の性能確認だけで十分であり、導入後は自己申告で把握する。","利用者から苦情が寄せられるまで待つ。","一定期間ごとに入力データの分布や出力の性能指標を基準値と比較し、閾値を超えた際の対応記録を確認する。","モデルの再学習を一切禁止する。"],"correctIndex":2,"explanations":["× 誤り。導入後の性能変化は継続的な確認で把握すべきで、自己申告では不十分である。","× 誤り。苦情を待つだけでは、劣化を早期に検出できない。","○ 正しい。入力分布や性能指標を基準値と比較し、閾値超過時の対応記録を確認する。","× 誤り。再学習の禁止は、劣化への対応として適切ではない。"]},{"id":"aaia-213","type":"mc","chapterIndex":13,"stem":"敵対的テスト（adversarial testing／レッドチーミング）に関する説明として、最も適切なものはどれか。","options":["意図的に悪意のある入力や想定外の入力を与えて、モデルの弱点や安全対策の不備を探る手法で、通常のテストでは見つからない欠陥を発見しうる。","正常な業務データだけを与えて平均的な性能を測り、テスト結果の数値が前回の基準値と比べて安定しているかを、定期的な報告書で確認する手法である。","監査人の独立性を確保するための報告手続である。","学習データを増やすための手続である。"],"correctIndex":0,"explanations":["○ 正しい。意図的に悪意のある入力や想定外の入力を与え、通常のテストでは見つからない欠陥を探る手法である。","× 誤り。正常データだけで平均性能を測る手法は、悪意ある入力や想定外の入力による弱点を探すものではない。","× 誤り。監査人の独立性を確保するための報告手続ではない。","× 誤り。学習データを増やす手続ではない。"]},{"id":"aaia-214","type":"mc","chapterIndex":13,"stem":"AIモデルやデータを変更した後の回帰テスト（regression testing）について、監査人が確認すべき最も適切な証拠はどれか。","options":["変更が軽微な場合は、既存機能への影響を確認するテストを省略し、テストの記録も不要とする方針を全社的に定めて運用する。","開発者が口頭で「問題ない」と述べた記録。","変更後に追加された新機能の動作確認のみを記録し、既存機能の影響は、担当者の判断で確認範囲から除いてよいとする。","変更が既存の機能・性能・公平性に悪影響を与えていないことを、変更前後の比較で確認した記録。"],"correctIndex":3,"explanations":["× 誤り。回帰テストを省略し記録も不要とする方針は、変更の影響を把握できず、適切な証拠とならない。","× 誤り。口頭での「問題ない」という記録は、客観的な証拠とならない。","× 誤り。新機能の確認だけでは、既存機能への悪影響を確認したことにならない。","○ 正しい。変更前後の比較で、機能・性能・公平性に悪影響がないことを確認した記録が求められる。"]},{"id":"aaia-215","type":"mc","chapterIndex":14,"stem":"AIによる意思決定の説明可能性（explainability）を確認するため、最も信頼性の高い証拠はどれか。","options":["開発部門が作成した「説明可能である」という声明書と、ベンダーが提供する説明機能のマニュアルの記載内容を、そのまま監査調書に転記する。","監査人が実際の判断事例を抽出し、説明手法の出力と入力データを照合して、判断理由が合理的かを自ら確認した結果。","利用者アンケートで「分かりやすい」という回答が多かったことをもって、説明可能性が確保されていると判断し、それ以上の確認は行わない。","ベンダーの販促パンフレットに、説明可能である旨の記載があることを根拠として、説明可能性を確認したとみなし、監査手続を簡略化する。"],"correctIndex":1,"explanations":["× 誤り。開発部門の声明とマニュアルの記載をそのまま転記しても、監査人が確かめた証拠にならない。","○ 正しい。監査人が判断事例を抽出し、説明と入出力を照合して判断理由の合理性を自ら確かめている。","× 誤り。利用者の印象は、判断理由が合理的かを示す証拠としては弱い。","× 誤り。販促資料は独立した証拠ではなく、説明可能性の根拠にならない。"]},{"id":"aaia-216","type":"mc","chapterIndex":14,"stem":"監査証拠の「十分性」と「適切性」の説明として、正しいものはどれか。","options":["十分性は証拠の質、適切性は証拠の量を指す。","十分性を満たせば、適切性は考慮しなくてよい。","十分性は証拠の量、適切性は証拠の質（目的との関連性と信頼性）を指し、両方を満たす必要がある。","適切性とは、証拠の入手にかかる時間とコストが低いことを指す。"],"correctIndex":2,"explanations":["× 誤り。十分性は証拠の量、適切性は証拠の質であり、逆ではない。","× 誤り。十分性を満たしても、適切性を考慮しなければ証拠として不十分である。","○ 正しい。十分性は証拠の量、適切性は証拠の質で、両方が必要である。","× 誤り。適切性は効率性ではなく、結論との関連性と信頼性を指す。"]},{"id":"aaia-217","type":"mc","chapterIndex":14,"stem":"次の証拠のうち、一般に最も信頼性が高いのはどれか。","options":["監査人がログ管理基盤から直接取得した、改ざん防止措置のある稼働ログ。","担当者が監査の依頼を受けてから、システムの稼働状況を振り返って後から作成した、詳細な説明を含む文書と図表の資料一式。","担当者が編集したスプレッドシートの抜粋。","担当者への口頭での確認のみで、記録は残さない。"],"correctIndex":0,"explanations":["○ 正しい。監査人が直接取得し、改ざん防止措置のある稼働ログは、信頼性が高い。","× 誤り。事後に作成された説明資料は、元の記録に比べて信頼性が低い。","× 誤り。担当者が編集したスプレッドシートは、改変の可能性があり信頼性が低い。","× 誤り。口頭の確認だけで記録が残らない証拠は、一般に信頼性が低い。"]},{"id":"aaia-218","type":"mc","chapterIndex":14,"stem":"AIモデルの学習データが適切に管理されているかを確かめるために、最も有効な手続はどれか。","options":["担当者の経歴を確認し、過去の成功事例が複数あることから、データ管理の能力は十分と判断する。","契約金額、保管期間、契約更新の条件を確認し、保存場所の費用が適切かどうかを判断の中心とするとともに、ストレージ提供会社の評判や過去の障害実績も考慮する。","モデルの学習に要した時間の記録と、計算資源が想定どおりに使われたかを確認し、学習データの来歴は問わないものとして、学習の効率性だけを判断の中心とし、データの管理状況の評価は省略する。","データ系譜（data lineage）の記録を入手し、サンプルのデータについて元データから学習データまでの変換・承認の経路をたどる。"],"correctIndex":3,"explanations":["× 誤り。経歴や過去の成功事例は、データが適切に管理されたことを示す証拠にならない。","× 誤り。保管の契約金額は、学習データの管理状況を確かめる手続ではない。","× 誤り。学習時間の記録は、データの管理の適切性を示さない。","○ 正しい。データ系譜の記録を入手し、変換や承認の経路を実際にたどって確かめる。"]},{"id":"aaia-219","type":"mc","chapterIndex":14,"stem":"インタビュー（質問）で得られた回答を監査証拠として扱う際の対応として、最も適切なものはどれか。","options":["責任者の回答であれば、その権限と経験を理由に、裏付けとなる文書や観察を求めることなく、最も強い監査証拠として調書に記録する。","質問だけでは証拠として弱いため、文書の閲覧・観察・再実行など他の手続で裏付ける。","複数の担当者の回答が一致していれば、その内容は確認されたものとみなし、文書の閲覧や観察といった他の手続は行わない。","質問は証拠として扱うことができないため、監査手続の中で質問を一切行わず、文書や観察のみで結論を導く。"],"correctIndex":1,"explanations":["× 誤り。責任者であっても、回答だけを最も強い証拠として扱うことはできず、裏付けが必要である。","○ 正しい。質問だけでは証拠として弱いため、他の手続で裏付ける。","× 誤り。複数の回答の一致だけでは、他の手続を省略する根拠にならない。","× 誤り。質問は証拠として弱いが、他の手続と組み合わせれば有用であり、行わない理由にはならない。"]},{"id":"aaia-220","type":"mc","chapterIndex":14,"stem":"監査人が生成AIの出力を参考に調書を作成する場合、最も重要な対応はどれか。","options":["出力は常に正確なので、検証せずにそのまま調書へ貼り付ける。","機密性の高い入手資料を、そのまま外部の生成AIに入力して要約させる。","出力を一次資料と照合して検証し、ハルシネーション（hallucination）の可能性を踏まえたうえで、人間である監査人が責任をもって結論を出す。","出力の内容は検証せず、AIが作成した旨を調書に記載して、結論の責任はベンダーに負わせる。"],"correctIndex":2,"explanations":["× 誤り。生成AIの出力は誤りを含みうるため、検証せずに利用してはならない。","× 誤り。機密性の高い資料を外部の生成AIに入力すると、情報漏えいのおそれがある。","○ 正しい。出力を一次資料と照合し、人間である監査人が結論の責任を負う。","× 誤り。出力の検証を省き、責任をベンダーに負わせることはできない。"]},{"id":"aaia-221","type":"mc","chapterIndex":14,"stem":"承認されていないAI利用（シャドーAI）の実態を把握するための手続として、最も適切なものはどれか。","options":["ネットワーク・アクセスログ、調達・経費の記録、部門への質問などを組み合わせて、未承認のAIサービスの利用を把握する。","IT部門が管理する承認済みリストだけを確認する。","利用禁止の方針が文書として存在し、全部門の責任者が署名していることから、未承認のAI利用は組織内に存在しないと判断して、追加の手続は行わない。","全従業員のPCを一斉に回収して調べる。"],"correctIndex":0,"explanations":["○ 正しい。ログ、経費記録、部門への質問などを組み合わせて未承認利用を把握する。","× 誤り。承認済みリストだけでは、未承認の利用を把握できない。","× 誤り。方針が存在することは、未承認のAI利用がないことの証拠にならない。","× 誤り。全従業員のPCを回収する手続は、過度であり、実務的でもない。"]},{"id":"aaia-222","type":"mc","chapterIndex":15,"stem":"学習データにサンプリングバイアスがある場合に生じうる問題として、最も適切なものはどれか。","options":["モデルの精度が必ずすべての層で向上し、学習データの偏りはむしろ予測の公平性を高めるため、サンプルの代表性は監査の対象外となる。","本番データの分布に一切影響しない。","暗号化の強度が低下し、学習データを保護する手段が失われて、モデルの出力に影響が及ぶ可能性がある。","特定の層が過少に代表され、モデルがその層に対して不正確・不公平な結果を出しやすくなる。"],"correctIndex":3,"explanations":["× 誤り。サンプルの偏りがあっても精度が必ず向上するわけではなく、公平性も損なわれうる。","× 誤り。学習データの偏りは、本番データに対する予測の精度に影響しうる。","× 誤り。サンプリングバイアスは、直接には暗号化の強度を低下させない。","○ 正しい。特定の層が過少に代表されると、その層への不正確・不公平な結果が生じやすい。"]},{"id":"aaia-223","type":"mc","chapterIndex":15,"stem":"監査人がデータ分析を行う前に、使用するデータの完全性と正確性を確認すべき主な理由はどれか。","options":["データ量が多いほど、内容は必ず正確になり、個別の誤りや欠落を確認する必要がなくなるから。","データに欠落や誤りがあると分析結果が誤り、誤った監査結論につながるから。","分析ツールが、欠落や誤りを自動的に補正し、分析の前に人が確認する必要をなくしてくれるから。","結論は経営陣が出すため、監査人はデータの完全性や正確性を確認する必要がなく、分析結果をそのまま経営陣へ伝達すれば監査の役割を果たせるから。"],"correctIndex":1,"explanations":["× 誤り。データ量が多くても、誤りや欠落が含まれていれば結果は不正確になる。","○ 正しい。データに欠落や誤りがあると、分析結果が誤り、誤った監査結論につながるため。","× 誤り。分析ツールは、欠落や誤りを確実に補正するものではない。","× 誤り。結論の責任は監査人にあり、データの完全性や正確性の確認を省くことはできない。"]},{"id":"aaia-224","type":"mc","chapterIndex":15,"stem":"データ品質の次元のうち、「適時性（timeliness）」に問題がある例として、最も適切なものはどれか。","options":["与信モデルが、半年前の古いデータに基づいて、顧客の現在の状況を反映しないまま判断している。","顧客の照合が手作業になっており、同じ顧客の情報に一貫性がない。","必須項目がすべて入力されている。","日付の形式がシステム間で統一されている。"],"correctIndex":0,"explanations":["○ 正しい。古いデータに基づき、現在の状況を反映していないことが適時性の問題である。","× 誤り。一貫性の問題であり、適時性の問題ではない。","× 誤り。必須項目の入力は、完全性に関する事項であり、適時性とは関係しない。","× 誤り。形式の統一は、一貫性や正確性に関わる事項である。"]},{"id":"aaia-225","type":"mc","chapterIndex":15,"stem":"個人情報を含むデータを監査人が分析する際の対応として、最も適切なものはどれか。","options":["分析を容易にするため、全項目を個人PCにコピーする。","監査人は個人情報の保護に関する法令の適用外である。","目的に必要な最小限のデータに限定し、仮名化・匿名化やアクセス制御を適用して、組織の方針と法規制を守る。","分析後もデータは将来の監査や別の目的で再利用される可能性があるため、念のため保存期間を定めず無期限に保存し、個人情報の利用記録も残す。"],"correctIndex":2,"explanations":["× 誤り。全項目を個人PCにコピーすることは、必要最小限の原則に反する。","× 誤り。監査人も個人情報の保護に関する法令の適用を受けうる。","○ 正しい。目的に必要な最小限のデータに限定し、仮名化・匿名化やアクセス制御を適用する。","× 誤り。保存期間を定めず無期限に保存することは、個人情報の保護の観点から不適切である。"]},{"id":"aaia-226","type":"mc","chapterIndex":15,"stem":"監査人がAIの予測値と実績値の乖離を分析する目的として、最も適切なものはどれか。","options":["乖離が大きいほどモデルが優れていると結論づけるため。","乖離の有無にかかわらず、開発者の成果を一律の基準で判定して評価を決めるため、個々の乖離の原因は確認しない。","乖離のデータを開示せず、経営陣のみに伝えることで、モデルの弱点が現場に広まらないようにし、改善の議論を経営陣の判断に限定するため。","モデルが目的どおりの精度で機能しているか、偏りや劣化が生じていないかを評価するため。"],"correctIndex":3,"explanations":["× 誤り。乖離が大きいほどモデルが優れているとはいえず、むしろ精度の低下を示す。","× 誤り。乖離の有無にかかわらず、評価を決めることは分析の目的ではない。","× 誤り。乖離のデータを経営陣のみに限定することは、改善の議論を妨げ、監査の目的に反する。","○ 正しい。精度が目的どおりか、偏りや劣化がないかを評価するため。"]},{"id":"aaia-227","type":"mc","chapterIndex":15,"stem":"機械学習における「ターゲットリーケージ（データリーケージ）」の説明として、最も適切なものはどれか。","options":["通信の盗聴により、学習データが外部の第三者に盗まれ、そのデータを用いて別の企業が同じ性能のモデルを不正に構築できてしまう状態。","学習時に、本来は予測時点で得られない情報（正解に関わる情報）が特徴量に含まれ、検証結果が実運用よりも良く見える状態。","欠損値が補完されずに残っていて、欠損の有無を確認しないまま、データの全件を学習に用いるとともに、欠損の偏りが結果に与える影響は評価しない状態。","モデルの重みが暗号化されずに保管され、開発者以外の人も参照できる状態で、アクセス記録も残されず、誰が重みを取り出したかを追跡できない状態。"],"correctIndex":1,"explanations":["× 誤り。盗聴による情報漏えいであり、リーケージの説明ではない。","○ 正しい。予測時点で得られない情報が特徴量に含まれ、検証結果が実運用より良く見える状態。","× 誤り。欠損値が残る状態は、データ品質の問題であり、リーケージとは別の論点である。","× 誤り。モデルの重みの保管方法は、セキュリティの問題であり、リーケージの説明ではない。"]},{"id":"aaia-228","type":"mc","chapterIndex":15,"stem":"分析対象のデータに、外れ値や欠損値が多数含まれていることが分かった。監査人の対応として最も適切なものはどれか。","options":["発生原因とモデルや結果への影響を評価し、経営陣の処理方針とその記録を確認する。","影響を調べずに、外れ値と欠損値を自動的に削除して分析を完了させる。","分析に影響しないと仮定して無視する。","すべて正常値とみなして、そのまま分析を進める。"],"correctIndex":0,"explanations":["○ 正しい。発生原因と影響を評価し、経営陣の処理方針と記録を確認する。","× 誤り。影響を調べずに削除すると、結論が偏るおそれがある。","× 誤り。影響を無視してよい前提は、確認なしには成立しない。","× 誤り。外れ値や欠損値をすべて正常値とみなすことは、分析の誤りにつながる。"]},{"id":"aaia-229","type":"mc","chapterIndex":15,"stem":"監査人が標本抽出ではなく、母集団全体を対象とした分析（全数分析）を行う利点として、最も適切なものはどれか。","options":["データ品質の確認が不要になる。","標本抽出よりも、常に低コストで実施できる。","母集団全体を対象とするためサンプリングリスクを低減でき、例外を網羅的に検出しやすい。","全数分析を行えば、検出された例外に対する判断や追加の調査が不要になり、監査人は結果を機械的に報告書へ転記するだけでよくなる。"],"correctIndex":2,"explanations":["× 誤り。全数分析でも、データ品質の確認は必要である。","× 誤り。全数分析が常に低コストとは限らない。","○ 正しい。母集団全体を対象とするため、サンプリングリスクを低減でき、例外を網羅的に検出しやすい。","× 誤り。例外の判断や追加調査は、全数分析を行っても省略できない。"]},{"id":"aaia-230","type":"mc","chapterIndex":16,"stem":"監査報告書の指摘事項に含めるべき要素として、最も適切なものはどれか。","options":["事実（状況）、基準、原因、影響を、証拠に基づいて記述し、是正提案を付す。","担当者の氏名を併記し、その人物に対する処罰の提案を、報告書の該当箇所に明記する。","推測と監査人の感想に基づいて、結論を記述する。","専門用語を羅列し、技術的な説明を網羅することで、読者が内容を正確に理解できるようにする。"],"correctIndex":0,"explanations":["○ 正しい。事実、基準、原因、影響を証拠に基づいて記述し、是正提案を付す。","× 誤り。担当者の氏名や処罰の提案は、指摘事項の要素に含めない。","× 誤り。推測や感想に基づく記述は証拠に裏づけられず、指摘事項として適切でない。","× 誤り。専門用語の羅列は、読者が理解できない。"]},{"id":"aaia-231","type":"mc","chapterIndex":16,"stem":"検証用データが限られるため、モデルの性能評価の確度に制約がある。報告書での扱いとして最も適切なものはどれか。","options":["制約には触れず、限られた検証データでも性能が十分に確認できたと確信をもって結論を示し、利用者が追加の確認を行う必要がないよう配慮する。","結論を一切出さず、制約があることを理由に監査そのものを中止し、報告書を作成しない。","範囲の制約や前提・限界を明記し、結論が及ぶ範囲を読者が誤解しないようにする。","制約については、口頭で関係者に伝えるだけにとどめ、報告書には記載せずに、必要に応じて説明する。"],"correctIndex":2,"explanations":["× 誤り。制約を示さずに確信をもって結論を示すと、読者が結論の適用範囲を誤解する。","× 誤り。制約があるからといって監査を中止するのは適切ではない。","○ 正しい。範囲の制約や前提・限界を明記し、結論が及ぶ範囲を読者が誤解しないようにする。","× 誤り。制約は報告書に明記すべきであり、口頭のみで伝えるのは不十分である。"]},{"id":"aaia-232","type":"mc","chapterIndex":16,"stem":"経営陣が監査の指摘事項に同意しない場合の、監査人の対応として最も適切なものはどれか。","options":["経営陣が反対したので、指摘事項を削除する。","経営陣の見解に合わせて結論を変更する。","協議せず、指摘事項を維持して報告書を速やかに公表する。","証拠と基準を再確認して協議し、不一致が解消しない場合も、監査人と経営陣それぞれの見解を適切な宛先に報告する。"],"correctIndex":3,"explanations":["× 誤り。反対されたことを理由に指摘を削除することは、監査の独立性を損なう。","× 誤り。経営陣の見解に合わせて結論を変えることは、監査の客観性を損なう。","× 誤り。協議を省き、反対理由を記載しないことは、報告の公正さを欠く。","○ 正しい。証拠と基準を再確認して協議し、不一致が残る場合も双方の見解を適切な宛先に報告する。"]},{"id":"aaia-233","type":"mc","chapterIndex":16,"stem":"取締役会向けのAIリスクに関する監査報告で、最も重要なのはどれか。","options":["アルゴリズムの数式、学習コードおよびモデルの内部パラメータを網羅的に掲載し、技術的な根拠を完全に示すことで、取締役会が判断できるようにすること。","事業目標への影響を踏まえ、重要なリスクと是正の優先度を、技術的な詳細よりも分かりやすく示すこと。","軽微な指摘を大量に列挙すること。","結論を付けずに、専門用語の定義だけを示すこと。"],"correctIndex":1,"explanations":["× 誤り。取締役会に技術的詳細を網羅的に示すと、重要なリスクが埋もれて判断しにくい。","○ 正しい。事業目標への影響を踏まえ、重要なリスクと是正の優先度を分かりやすく示す。","× 誤り。軽微な指摘を大量に列挙すると、重要事項が伝わりにくくなる。","× 誤り。結論を示さない報告は、取締役会の判断に役立たない。"]},{"id":"aaia-234","type":"mc","chapterIndex":16,"stem":"フォローアップ監査の主な目的として、最も適切なものはどれか。","options":["合意された是正措置が、適切かつ適時に実施され、リスクが低減されたかを確認すること。","新たな指摘事項を探すことを目的として、既存の指摘の是正状況は確認せずに、監査範囲を広げること。","経営陣の承認を得てから、是正状況の確認は省略すること。","前回の指摘を撤回し、経営陣の報告書の記載だけで完了扱いにして、是正の状況を現地で確認しない。"],"correctIndex":0,"explanations":["○ 正しい。合意された是正措置が適切かつ適時に実施され、リスクが低減されたかを確認する。","× 誤り。フォローアップ監査の目的は、既存の指摘の是正の確認であり、新たな指摘を探すことではない。","× 誤り。是正状況の確認を省略すると、是正が適切かつ適時に行われ、リスクが低減されたかを確かめられない。","× 誤り。是正が未了の項目を経営陣の記載だけで完了扱いにすることは、独立した確認を欠く。"]},{"id":"aaia-235","type":"mc","chapterIndex":16,"stem":"監査人がAIを活用して監査手続の効率化を図る場合、透明性の確保の観点で最も適切な対応はどれか。","options":["AIの利用は、通常の手続と区別する必要がないため一切開示せず、監査調書にも記載せず、報告書の利用者にも伝えないまま、通常どおりの監査として扱う。","AIの出力をそのまま結論として採用し、人による検証の手続を省略することで、監査の効率を最大限に高める方針をとる。","AIを使ったため、結論の責任はAIベンダーにあることを報告書に明記し、利用者が結論を判断する際の前提として扱い、監査人の確認は省く。","AIを使用した範囲、人間による検証内容、AIの限界を把握して、結論の責任は監査人が負うことを明確にする。"],"correctIndex":3,"explanations":["× 誤り。AI利用を開示しないことは、透明性の原則に反する。","× 誤り。AIの出力は、検証なしに結論として採用できない。","× 誤り。結論の責任は、AIベンダーではなく監査人が負う。","○ 正しい。AIを使用した範囲、人による検証内容、AIの限界を把握し、結論の責任は監査人が負うことを明確にする。"]},{"id":"aaia-236","type":"mc","chapterIndex":16,"stem":"AIに関するKRI／KPIの報告として、最も適切なものはどれか。","options":["指標の定義を示さず、数値のみを報告する。","良好な指標だけを選んで報告し、悪化している項目は報告対象から外すことで、経営陣に安心感を与え、議論を簡潔にする。","モデル性能・ドリフト検知・インシデント件数・是正状況などの指標を、基準値と比較した推移として示し、判断に使えるようにする。","年1回だけ、年度末の総括として報告し、前年からの推移は示さない。"],"correctIndex":2,"explanations":["× 誤り。指標の定義を示さない数値だけの報告は、判断に使えない。","× 誤り。良好な指標だけの報告は、リスクの実態を隠すため不適切である。","○ 正しい。モデル性能、ドリフト、インシデント件数、是正状況を基準値と比較した推移として示す。","× 誤り。年1回の総括だけでは、推移が分からず、是正の判断に使えない。"]},{"id":"aaia-237","type":"mc","chapterIndex":16,"stem":"AI監査の調書（ワーキングペーパー）の作成で、最も重要な観点はどれか。","options":["監査人個人のメモで足り、他者が読めなくてよい。","第三者が読んで、実施した手続・入手した証拠・結論の根拠を理解し、必要に応じて再現できること。","結論のみを記載し、根拠は担当者の記憶に頼り、必要が生じた時点で関係者への口頭説明によって補足することで、調書の作成時間を大幅に短縮する。","調書は最終報告書の提出後に直ちに削除し、後日の説明は担当者の記憶に頼る。"],"correctIndex":1,"explanations":["× 誤り。個人のメモだけでは、第三者が手続や結論の根拠を確認できない。","○ 正しい。第三者が読んで、実施した手続・入手した証拠・結論の根拠を理解し、再現できること。","× 誤り。結論のみを記載し、根拠を記憶に頼ることは、調書として不十分である。","× 誤り。提出後すぐに削除し、記憶に頼ることは、説明責任を果たせない。"]}];
  const CHAPTERS = ["AIモデル・考慮事項・要件","AIガバナンスとプログラム管理","AIリスク管理","プライバシーとデータガバナンス","AIの先進事例・倫理・規制・標準","AI特有のデータ管理","AIソリューション開発手法とライフサイクル","AI特有の変更管理","AIソリューションの監督（出力・影響・判断）","AIのテスト技法","AI特有の脅威と脆弱性","AI特有のインシデント対応","AI監査の計画と設計","監査テストとサンプリング手法","監査証拠の収集技法","監査データ品質とデータ分析","AI監査の成果物と報告"];
  const BASE_CHAPTER_COUNT = 17;   // これ以降の章は新シラバス仮問題集（deck:'extra3'）用
// GAS_WEBAPP_URL / EXAM_ID / EXAM_SHORT_TITLE / TRACKING_EXAM_ID / QUESTIONS / CHAPTERS は build_html.js が
// ビルド時にこのファイルの直前へ注入する。QUESTIONS は {id, type:'mc'|'tf'|'mc-multi', chapterIndex, stem, ...}
// の配列。TRACKING_EXAM_ID は成績記録シート名（<TRACKING_EXAM_ID>_<mode>）専用のIDで、
// 同じexam.id配下に複数の問題集（quiz/quiz2）がある場合に成績を分離するため EXAM_ID とは別に持つ
// （EXAM_ID はチャットへ戻る遷移先ページなので exam.id のまま変えない）。
// 'mc-multi' は「すべて選びなさい」形式（正解が複数）。見た目は 'mc' と同じ選択肢ボタンだが、
// クリックのたびにトグル選択（複数選択可）になり、正解は correctIndexes（配列）で持つ。

const MODE_LABEL = { mc: '模擬試験', tf: '一問一答', extra: '追加問題', extra2: '追加問題2', extra3: '新シラバス仮問題', review: '復習' };
// 成績記録（QuizTracking.js）のシートを分けるための mode 変換。
// 'extra'（追加問題、別ソースの問題集）は既存の 模擬試験(seiseiai_mc) と混在しないよう
// 'mc2' という別モード名で記録する。'extra2'（3つ目の問題集）は同様に'mc3'。
// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。
const TRACKING_MODE = { mc: 'mc', tf: 'tf', extra: 'mc2', extra2: 'mc3', extra3: 'mc4', review: 'review' };

// 復習モードの「卒業」条件。復習でこの回数だけ連続正解したら、既定の出題対象から外す
// （「記録にある全部」を選べば卒業ぶんも出題できる）。バックエンド QuizReview.js は
// 生の連続正解数(streak)だけを返し、閾値の判断はこの画面側で持つ。
const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}
