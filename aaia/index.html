<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ISACA AAIA問題集（仮問題）</title>
<meta name="robots" content="noindex,nofollow">
<script>
(function () {
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === "withSuccessHandler") return function (f) { return make(f, fail); };
      if (name === "withFailureHandler") return function (f) { return make(ok, f); };
      return function () {
        var reading = /^(apiLoad|apiGet)/.test(String(name));
        setTimeout(function () {
          if (reading) { if (ok) ok(null); }
          else if (fail) fail(new Error("公開版では記録・AI助言は使えません"));
        }, 0);
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
  <style>
    :root {
      --theme-color: #0f5a6e;
      --theme-color-dark: #093540;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon { font-size: 32px; }

.header-text { min-width: 0; flex: 1 1 140px; }   /* ボタンに押されてタイトルが1文字幅に潰れ、縦書きのように見えるのを防ぐ */
.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; writing-mode: horizontal-tb; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.quiz-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

.screen { width: 100%; max-width: 520px; margin: 0 auto; }

/* --- モード選択画面 --- */
/* カード数が増えても幅が細くなりすぎないよう、flexではなくgridで自動折り返しする
   （4つ目の「追加問題2」追加時にスマホで窮屈にならないための変更）。 */
.mode-select {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.mode-card {
  min-width: 0;
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.mode-card:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

/* 復習モードのカードだけ、出題元の問題集カードと見分けられるよう薄く色を敷く。 */
.review-card {
  background: #fffaf2;
  border-color: #f0d9b5;
}
.review-card:hover { border-color: #e0a75e; }
.mode-card:disabled { opacity: 0.6; cursor: wait; }

.mode-icon { font-size: 36px; margin-bottom: 8px; }
.mode-title { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 4px; }
.mode-desc { font-size: 13px; color: #888; }

/* --- 範囲選択画面（全部 / 章ごとにチャレンジ） --- */
.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 4px 0;
  font-family: inherit;
}

.back-link:hover { color: var(--theme-color); }

.scope-select {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-all-btn {
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  margin-bottom: 8px;
}

.scope-all-btn:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

.scope-all-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 4px; }
.scope-all-desc { font-size: 13px; color: #888; }

.scope-chapter-heading {
  font-size: 12px;
  font-weight: 700;
  color: #999;
  margin: 4px 0 2px;
}

.scope-chapter-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scope-chapter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 48px;
  background: #f8f9ff;
  border: 1.5px solid #e8eaf6;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.scope-chapter-btn:hover { border-color: var(--theme-color); }

.scope-chapter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.scope-chapter-btn:disabled:hover { border-color: #e6e8ee; }

/* 範囲選択画面の下に出す補足（復習モードの「克服」ルールの説明など） */
.scope-note {
  margin-top: 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.scope-chapter-btn .name { flex: 1; padding-right: 12px; }
.scope-chapter-btn .count { flex-shrink: 0; color: var(--theme-color); font-weight: 700; font-size: 13px; }

/* --- 出題画面 --- */
.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.chapter-label {
  text-align: center;
  font-size: 12px;
  color: var(--theme-color);
  font-weight: 600;
  margin-bottom: 16px;
}

.question-card {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stem {
  font-size: 15.5px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.option-btn:hover { border-color: var(--theme-color); }

.option-btn.selected {
  border-color: var(--theme-color);
  background: #f0f0ff;
  font-weight: 600;
}

.option-btn.tf-btn {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

/* 回答後の表示状態 */
.option-btn.correct {
  border-color: #2e7d32;
  background: #e8f5e9;
}

.option-btn.incorrect {
  border-color: #c62828;
  background: #fdecea;
}

.option-btn:disabled { cursor: default; }

.option-badge {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
}

.option-explain {
  display: block;
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.6;
  font-weight: 400;
}

.answer-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.answer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 回答（複数選択のときだけ表示）とスキップを縦に並べる操作行。
   mc / tf は選択した時点で判定するため、この行にはスキップだけが残る。 */
.question-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.skip-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  background: white;
  color: #888;
  border: 1.5px solid #e6e8ee;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.skip-btn:hover { border-color: var(--theme-color); color: var(--theme-color); }

.reveal-area { margin-top: 20px; }

.reveal-options { margin-bottom: 16px; }

.reveal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.action-btn:hover { border-color: var(--theme-color); }

.action-btn.primary {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
}

/* --- 終了サマリー画面 --- */
#screenSummary { text-align: center; }
#screenSummary h2 { font-size: 22px; color: #333; margin-bottom: 16px; }

.summary-score {
  font-size: 32px;
  font-weight: 700;
  color: var(--theme-color);
  margin-bottom: 20px;
}

.summary-chapters {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.summary-chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}

.summary-chapter-row .name { color: #333; }
.summary-chapter-row .score { color: var(--theme-color); font-weight: 700; }

.summary-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 間違えた問題だけを解き直すボタン。記録ボタンの次に置いて目に入るようにする。 */
.action-btn.retry-wrong {
  border-color: #f0d9b5;
  background: #fffaf2;
  color: #a1670f;
  font-weight: 700;
}
.action-btn.retry-wrong:hover { border-color: #e0a75e; }

.summary-note {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.record-status,
.advice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #888;
  min-height: 18px;
}

.advice-area {
  margin-top: 12px;
  text-align: left;
  white-space: pre-wrap;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 12px;
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #333;
}

.quiz-body::-webkit-scrollbar { width: 5px; }
.quiz-body::-webkit-scrollbar-track { background: transparent; }
.quiz-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

/* --- PCブラウザ（幅900px以上）: 画面幅を広く使う ---
   以前は .screen が max-width:520px の中央寄せで、PCでは画面の中央に細い1列が出るだけだった（2026-09-20 に変更）。
   スマホ（600px以下）の指定とは範囲が重ならない。行が長くなりすぎないよう、上限は 1120px（1400px以上は 1240px）。
   ボタン類は横いっぱいに伸ばさず、中央に寄せた幅に留める。 */
@media (min-width: 900px) {
  .header { padding: 18px 40px; }
  .header-text h1 { font-size: 20px; }
  .header-text p { font-size: 13px; }
  .header-btn { font-size: 12px; padding: 7px 14px; }

  .quiz-body { padding: 32px 48px; }
  .screen { max-width: 1120px; }

  /* モード選択: カードを横に並べて広く使う（4枚なら1行） */
  .mode-select { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 16px; }
  .mode-card { padding: 30px 20px; }
  .mode-icon { font-size: 40px; }
  .mode-title { font-size: 18px; }
  .mode-desc { font-size: 14px; }

  /* 範囲選択: 章のボタンを2列に（章が多くても縦に長くなりすぎない） */
  .scope-chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  .scope-chapter-btn { font-size: 15px; }

  /* 出題: 問題文・選択肢を広く、文字も一段大きく */
  .question-card { padding: 28px 36px; }
  .stem { font-size: 18px; line-height: 1.8; }
  .options { gap: 12px; }
  .option-btn { font-size: 16px; padding: 14px 20px; }
  .answer-btn, .action-btn, .skip-btn { max-width: 520px; margin-left: auto; margin-right: auto; }
  .question-actions { align-items: center; }
  .question-actions .answer-btn, .question-actions .skip-btn { width: 100%; }
  .summary-note, .scope-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .reveal-actions { align-items: stretch; }

  /* 終了サマリー: 章別の結果を2列に */
  .summary-chapters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .summary-chapter-row { font-size: 14.5px; padding: 12px 16px; }
  .summary-actions { align-items: center; }
  .summary-actions .action-btn { width: 100%; }
}

@media (min-width: 1400px) {
  .screen { max-width: 1240px; }
}

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 8px 10px; flex-wrap: wrap; }   /* 狭い画面ではボタン類を2行目へ折り返す */
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 16px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; flex-wrap: wrap; flex-basis: 100%; margin-left: 0; }
  .header-btn { font-size: 11px; padding: 6px 10px; }
  .quiz-body { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .stem { font-size: 16.5px; }
  .option-btn { font-size: 16px; }
  .mode-select { gap: 10px; }
  .mode-card { padding: 16px 8px; }
  .mode-icon { font-size: 26px; margin-bottom: 4px; }
  .mode-title { font-size: 14px; margin-bottom: 2px; }
  .mode-desc { font-size: 11px; }
}

@media (max-height: 480px) {
  .quiz-body { padding-top: 14px; }
  .mode-card { padding: 12px 8px; }
  .mode-icon { font-size: 22px; margin-bottom: 2px; }
}

/* --- 中断した問題集の再開バナー（モード選択画面の先頭） --- */
.resume-banner {
  border: 2px solid var(--theme-color);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.resume-text { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
.resume-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-actions .action-btn { flex: 1 1 140px; width: auto; }

  </style>
<style>#askBtn,#adviceBtn{display:none !important}</style>
</head>
<body>
<div style="background:#fff4d6;color:#5b4300;padding:10px 14px;font-size:14px;line-height:1.6;border-bottom:1px solid #e6c96b">
<strong>非公式・個人作成の仮問題です。</strong>ISACA（AAIA）の公式の試験・規格とは無関係で、公式の出題・難度とは一致しません。事実関係は公式テキストで未照合です。この公開版では成績・途中経過は保存されません。
</div>
<div class="container">
  <div class="header">
    <div class="header-icon">🛡️</div>
    <div class="header-text">
      <h1>ISACA AAIA問題集（仮問題）</h1>
      <p id="headerSub">モードを選んでください</p>
    </div>
    <div class="header-actions">
      
      
      
      <button type="button" class="header-btn" id="soundBtn" onclick="toggleSound()">🔊 音</button>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="screen" id="screenMode">
      <div class="resume-banner" id="resumeBanner" style="display:none;">
        <div class="resume-text" id="resumeText"></div>
        <div class="resume-actions">
          <button class="action-btn primary" id="resumeBtn" onclick="resumeProgress()">▶ 続きから再開</button>
          <button class="action-btn" onclick="discardProgress()">破棄</button>
        </div>
      </div>
      <div class="mode-select">
        <button class="mode-card" onclick="chooseMode('mc')">
          <div class="mode-icon">📝</div>
          <div class="mode-title" id="mcTitle">模擬試験</div>
          <div class="mode-desc"><span id="mcCount">0</span>問・<span id="mcKind">4択</span></div>
        </button>
        <button class="mode-card" id="tfCard" onclick="chooseMode('tf')">
          <div class="mode-icon">⭕</div>
          <div class="mode-title">一問一答</div>
          <div class="mode-desc"><span id="tfCount">0</span>問・正誤判定</div>
        </button>
        <button class="mode-card" id="extraCard" onclick="chooseMode('extra')">
          <div class="mode-icon">📘</div>
          <div class="mode-title">追加問題</div>
          <div class="mode-desc"><span id="extraCount">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra2Card" onclick="chooseMode('extra2')">
          <div class="mode-icon">📗</div>
          <div class="mode-title">追加問題2</div>
          <div class="mode-desc"><span id="extra2Count">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra3Card" onclick="chooseMode('extra3')">
          <div class="mode-icon">🆕</div>
          <div class="mode-title">新シラバス仮問題</div>
          <div class="mode-desc"><span id="extra3Count">0</span>問・4択（2027年2月〜の追加分）</div>
        </button>
        <button class="mode-card review-card" id="reviewCard" onclick="chooseMode('review')">
          <div class="mode-icon">🔁</div>
          <div class="mode-title">復習</div>
          <div class="mode-desc" id="reviewCount">間違えた問題だけ</div>
        </button>
      </div>
    </div>

    <div class="screen" id="screenScope" style="display:none;">
      <button class="back-link" onclick="backToModeSelect()">← モード選択に戻る</button>
      <div class="scope-select" id="scopeSelect"></div>
    </div>

    <div class="screen" id="screenQuestion" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="chapter-label" id="chapterLabel"></div>
      <div class="question-card">
        <p class="stem" id="stem"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="question-actions" id="questionActions">
        <button class="answer-btn" id="answerBtn" onclick="reveal()" disabled>回答</button>
        <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">回答せずに次へ →</button>
      </div>
      <div class="reveal-area" id="revealArea" style="display:none;">
        <div class="reveal-options" id="revealOptions"></div>
        <div class="reveal-actions">
          <button class="action-btn" id="askBtn" onclick="askInChat()">🤖 チャットに詳しく聞く</button>
          <button class="action-btn primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSummary" style="display:none;">
      <h2>お疲れさまでした！</h2>
      <div class="summary-score" id="summaryScore"></div>
      <div class="summary-chapters" id="summaryChapters"></div>
      <div class="summary-actions">
        <button class="action-btn primary" id="recordBtn" onclick="recordResults()">この回の結果を記録</button>
        <button class="action-btn retry-wrong" id="retryWrongBtn" onclick="retryWrongInSession()" style="display:none;">🔁 間違えた問題だけもう一度</button>
        <button class="action-btn" id="adviceBtn" onclick="getAdvice()">🎯 学習アドバイスを見る</button>
        <button class="action-btn" onclick="restartMode()">もう一度</button>
        <button class="action-btn" onclick="backToScopeSelect()">別の範囲へ</button>

<script>
  const GAS_WEBAPP_URL = '';
  const EXAM_ID = 'aaia';
  const EXAM_SHORT_TITLE = 'AAIA';
  const TRACKING_EXAM_ID = 'aaia';
  const MC_TITLE = '問題集';
  const QUESTIONS = [{"id":"aaia-1","type":"mc","chapterIndex":0,"stem":"監査人が与信審査に使われる機械学習モデルを評価している。過学習（overfitting）の兆候として最も適切なものはどれか。","options":["学習データでも検証データでも精度が低く、モデルが入力と出力の関係を十分に学習できていない状態である。","学習データでは高い精度を示すが、未知の検証データでは精度が大きく低下する。","本番データの分布が時間とともに変化している。","モデルが使う特徴量の数が少ない。"],"correctIndex":1,"explanations":["× これは学習不足（underfitting）の兆候であり、過学習とは逆の状態である。","○ 正しい。学習データへの当てはまりが極めて良い一方で汎化できていないことが過学習の典型である。","× これはデータドリフトの説明であり、学習時点の汎化不良を指す過学習とは別の現象である。","× 特徴量が少ないこと自体は過学習の兆候ではない。むしろ過度に複雑なモデルの方が過学習しやすい。"]},{"id":"aaia-2","type":"mc","chapterIndex":2,"stem":"顧客対応に大規模言語モデル（LLM）を導入する計画がある。ハルシネーション（もっともらしい誤情報の生成）リスクに対して、監査人が最も有効と評価する統制はどれか。","options":["回答の最大文字数を短く制限すれば、誤情報の生成は起きなくなる。","モデルのパラメータ数をより大きなものに入れ替え、性能が向上すれば回答の正確さは自然に担保されるため、根拠文書の確認や人によるレビューは不要と判断する。","プロンプトを英語に統一し、モデルの学習データに含まれる一般知識だけで回答を生成させ、外部の検索や人の確認は行わない。","根拠となる社内文書を検索して回答に反映する仕組み（RAG）と、重要な回答に対する人間の確認を組み合わせる。"],"correctIndex":3,"explanations":["× 誤り。文字数の制限は誤情報の生成を減らさず、根拠の確認やレビューの代わりにはならない。","× 誤り。パラメータ数の増加だけでは誤情報の生成は防げず、根拠の確認やレビューが必要である。","× 言語の統一は誤情報の生成を防ぐ手段ではない。","○ 正しい。回答を根拠文書に紐づけ、高リスクの回答は人が確認することで、誤情報の流出を現実的に抑えられる。"]},{"id":"aaia-3","type":"mc","chapterIndex":0,"stem":"融資判断に、判断理由の説明が困難なブラックボックス型モデルが採用されようとしている。顧客や規制当局への説明が求められる場合、監査人が最初に確認すべきことはどれか。","options":["説明可能性の要件が事前に定義され、モデル選定時に精度と説明可能性のトレードオフが評価されているか。","モデルの学習に使用したGPUの性能と、その計算資源の調達にかかった費用だけを確認し、説明可能性に関する要件は、導入後のモデル改修の段階で検討すればよいと判断する。","ベンダーの財務状況の公開資料と過去の導入実績の一覧を取得し、委託先としての信頼性を十分に確認できたことをもって、融資判断の適格性の確認としてよいと判断する。","学習に要した時間の記録と、学習に用いたサーバーの稼働ログを保存し、モデルの性能が監査基準を満たしているかを事後的に判断する運用が整っているかを確認する。"],"correctIndex":0,"explanations":["○ 正しい。説明責任の要件を満たせないモデルを後から採用するのは手戻りが大きく、要件定義と選定段階の確認が最優先である。","× 誤り。GPUの性能は説明可能性の要件とは関係がなく、導入後の改修で扱うものでもない。","× 誤り。委託先の財務状況は、モデルの説明可能性を確かめる監査手続とは別の論点である。","× 誤り。学習時間の記録や稼働ログは事後の記録であり、事前の要件定義に代わるものではない。"]},{"id":"aaia-4","type":"mc","chapterIndex":0,"stem":"監査人は、正解ラベルの付いていない大量の取引データから、通常と異なるパターンの取引を見つけようとするベンダー提案を評価している。ここで中心となる学習方式はどれか。","options":["教師あり学習（正解ラベルを使用）","強化学習（試行錯誤を通じて報酬を最大化する）","教師なし学習（unsupervised learning）","ルールベースの手作業チェックのみ。"],"correctIndex":2,"explanations":["× 誤り。正解ラベルを必要とする方式であり、ラベルのないデータには適さない。","× 誤り。強化学習は行動に対する報酬から学ぶ手法で、正解ラベルのないデータの分析にはそのまま当てはまらない。","○ 正しい。ラベルなしデータから構造や外れ値を見つける方式であり、クラスタリングや異常検知に使われる。","× 誤り。機械学習モデルを用いない方式であり、大量の取引データを評価する提案の中心的な学習方式ではない。"]},{"id":"aaia-5","type":"mc","chapterIndex":1,"stem":"組織が第三者提供の基盤モデルAPIを利用して業務アプリを開発する。契約段階で最も重要な考慮事項はどれか。","options":["モデルのソースコードをすべて自社が保有すること。","ベンダーのユーザー画面のデザイン。","入力データの学習への利用可否・保持期間・処理場所と、障害や誤出力時の責任分界を契約で定めること。","ベンダーの従業員の総数と本社所在地、および役員の過去五年の職歴を、契約書の本文に詳細に記載させること。"],"correctIndex":2,"explanations":["× 基盤モデルAPI利用ではソース保有は通常期待されず、重要性はデータ取扱いと責任分界より低い。","× 利便性の論点であり、リスク統制上の優先事項ではない。","○ 正しい。自社データの取扱いと責任の所在は、自社でモデルを管理できない状況で最も影響が大きいリスクである。","× 規模は参考情報にすぎず、契約上の統制事項ではない。"]},{"id":"aaia-6","type":"mc","chapterIndex":0,"stem":"AI導入プロジェクトで、事業目的と成功指標（KPI）が定義されないままモデル開発が進んでいる。監査人の指摘として最も適切なものはどれか。","options":["事業目的、成功指標、リスク許容度を事前に定義し、モデルの目的がビジネス要件と整合していることを確認すべきである。","精度99%以上を一律の目標とし、開発の初期段階でその数値を達成できるまでモデルの再学習を繰り返し、目標との差を埋める作業を優先すべきである。","モデルをより複雑にして性能余地を確保し、将来の業務拡大にも備えるため、初期段階では評価指標を定めず、性能の伸びを見ながら要件を後から決めるべきである。","要件はデプロイ後に運用しながら決めればよい。"],"correctIndex":0,"explanations":["○ 正しい。要件が不明確だと、評価基準もリスク判断もできず、AIの価値とリスクの両面で統制が効かない。","× 誤り。一律の精度目標は業務要件と整合せず、事業目的に応じた評価の設計を妨げる。","× 誤り。評価指標を定めずに複雑化を進めると、事業目的との整合性を確認できない。","× 事後では評価基準がなく、リスクが顕在化してからの対応になる。"]},{"id":"aaia-7","type":"mc","chapterIndex":8,"stem":"本番稼働中の需要予測モデルの精度が、数か月かけて徐々に低下している。最も可能性が高い原因はどれか。","options":["学習時に設定した乱数シードの値と、学習に用いたデータの前処理の手順を変えたことが、数か月かけての精度低下の直接の原因と考えられる。","利用者数が増え、応答速度が低下したことで、利用者が予測結果を十分に参照しなくなり、その結果としてモデルの精度評価そのものが行えなくなったこと。","端末の画面解像度の変更と、利用者が使う画面のテーマを変更した影響が、数か月かけて徐々に進んだ精度低下の直接の原因と判断できる。","入力データの統計的性質や、入力と目的変数の関係が学習時から変化した（データドリフト／コンセプトドリフト）。"],"correctIndex":3,"explanations":["× 誤り。乱数シードは学習の再現性に関わるが、数か月にわたる緩やかな精度低下の原因にはなりにくい。","× 利用者数の増加は性能や負荷の問題を生んでも、予測精度の漸減の説明にはなりにくい。","× 誤り。画面の表示設定はモデルの入力データに影響せず、精度低下の原因にはならない。","○ 正しい。環境変化で学習時の前提が崩れると精度は徐々に落ちるため、継続的な監視と再学習・再評価の仕組みが必要となる。"]},{"id":"aaia-8","type":"mc","chapterIndex":8,"stem":"採用スクリーニングAIが応募者の合否を最終的に自動決定している。リスクを最小化するための設計として最も適切なものはどれか。","options":["一貫性を最大にするため、完全自動化する。","重要な判断は人が結果を確認し、AIの出力を覆す権限と能力を持つ設計にする。","人事担当者にはAIの出力を見せない。","年1回のモデル再学習のみを定期的に実施する。"],"correctIndex":1,"explanations":["× 一貫性は得られても、誤りやバイアスの是正手段を失い、重大な影響を人に与え得る。","○ 正しい。人間による実効的な監督（human oversight）は、誤りやバイアスの是正に不可欠であり、雇用分野は高リスクとされる代表例である。","× 人間の確認を不能にし、監督を無効化する。","× 誤り。再学習だけでは、個別の不合格判定に対する異議申立ての機会を確保できない。"]},{"id":"aaia-9","type":"mc","chapterIndex":5,"stem":"学習データに、過去の偏った人事評価の結果が多く含まれることが判明した。監査人が求める対応として最も適切なものはどれか。","options":["学習データの代表性とバイアスを評価し、保護属性だけでなく代理変数（proxy）の影響も検証する。","保護属性の列を削除すればバイアスは解消する。","データ量が十分に多ければ公平性は自動的に確保される。","全体の精度が高ければ偏りはないと判断してよく、特定の集団ごとの誤り率の差は、精度の向上によって自然に解消される。"],"correctIndex":0,"explanations":["○ 正しい。過去の偏りは学習で再現・増幅され得る。属性を除いても代理変数を通じて偏りが残るため、検証が必要である。","× 郵便番号や経歴などの代理変数を通じて偏りが残り得るため、列の削除だけでは不十分である。","× 量が多くても偏りがあれば、その偏りを学習する。","× 全体精度が高くても、特定集団で誤りが集中していることがある。"]},{"id":"aaia-10","type":"mc","chapterIndex":0,"stem":"モデルカード（モデルの想定用途・限界・評価結果を記した文書）に相当する文書化を、監査人はどのように評価するか。","options":["文書は広告目的であり、利用者の関心を引くために、モデルの性能を実際より高く見せることを主な役割とするため、統制の対象からは外すべきである。","コードの圧縮に役立つため、技術部門だけが参照すればよく、事業部門や監査部門が内容を確認する必要はないと判断する。","想定外の用途での利用を抑え、透明性とレビューの証跡になるため、整備と維持が望ましい。","モデルの稼働後は更新不要である。"],"correctIndex":2,"explanations":["× 誤り。文書化は透明性やレビューのための統制であり、広告目的として扱うものではない。","× 誤り。モデルカードは想定用途や限界を関係者が確認するための文書であり、技術部門だけの資料ではない。","○ 正しい。用途と限界の明示は、利用者の誤用防止と、監査・説明責任の根拠資料として機能する。","× モデルやデータが変われば内容も陳腐化する。維持が必要である。"]},{"id":"aaia-11","type":"mc","chapterIndex":6,"stem":"組織が基盤モデルを自社データでファインチューニングして社内利用する。追加で評価すべきことはどれか。","options":["元モデルの商標登録の有無と、そのモデルを提供する企業の知名度、ならびに過去に発表された性能比較の記事の内容を、事前にすべて確認しておけば十分である。","ファインチューニング用データの品質と権利関係、および調整後もモデルの性能と安全性が維持されているかの再評価。","元モデルを検証済みなので、調整後は検証を省略してよく、性能の再評価は、利用部門から不具合の報告を受けてから、必要に応じて個別に行えばよいと判断し、その結果を記録しておく。","調整に使うGPUの台数と、担当エンジニアの経験年数、作業時間帯の電力使用量、作業記録の保管期間を、社内の監査証跡として文書化して保管すること。"],"correctIndex":1,"explanations":["× 誤り。商標登録や企業の知名度は、調整後のモデルの性能や安全性の評価とは関係がない。","○ 正しい。調整は挙動を変え、元の安全性を損なう場合もあるため、データと調整後モデルの両方の評価が必要である。","× 誤り。元モデルの検証は調整後のモデルの検証を代替しない。","× 計算資源の規模は統制の有効性を示さない。"]},{"id":"aaia-12","type":"mc","chapterIndex":9,"stem":"不正検知モデルについて、不正は全取引の0.1%にすぎないにもかかわらず、開発部門は「正解率99.9%」と報告している。監査人の最も適切な懸念はどれか。","options":["正解率が高いので、追加の確認は不要である。","正解率が高すぎるため、不正の定義を緩めるべきである。","取引件数が少ないことが精度の低下の原因であり、まずはデータ収集を優先すべきである。","クラスの不均衡下では正解率は誤解を招くため、再現率（recall）や適合率（precision）など目的に応じた指標を確認すべきである。"],"correctIndex":3,"explanations":["× 正解率だけでは不正をどれだけ検知しているか分からない。","× 評価指標の選択の問題であり、不正の定義を緩める理由にはならない。","× 誤り。件数の不足は一因になりえても、正解率の読み方の問題とは別であり、指標の確認を省略する理由にはならない。","○ 正しい。すべてを「不正でない」と予測しても正解率は99.9%になり得る。検知すべき不正をどれだけ捉えたかを見る必要がある。"]},{"id":"aaia-13","type":"mc","chapterIndex":1,"stem":"組織がAIガバナンス体制を構築する。最初に整備すべき要素として最も適切なものはどれか。","options":["高性能なAI開発ツールの大量購入。","社内でのAI利用を全面的に禁止し、既に業務で使われているツールも含めて、従業員に一切の利用を停止させること。","経営層が承認したAI方針と、責任・権限（アカウンタビリティ）の明確化。","AI専門部署だけでの意思決定。"],"correctIndex":2,"explanations":["× ツール先行ではガバナンスが追いつかず、統制の土台にならない。","× 全面禁止は実態（シャドーAI）を見えなくし、価値創出の機会も失う。","○ 正しい。方針と責任体制は、他のすべての統制の土台であり、トップの承認が実効性を左右する。","× 事業・法務・リスク・監査など関係部門を含めないと、偏った判断になる。"]},{"id":"aaia-14","type":"mc","chapterIndex":1,"stem":"従業員が承認されていない生成AIサービスを業務で使う「シャドーAI」が疑われる。監査人が最初に確認することはどれか。","options":["組織内で利用・開発中のAIシステムを網羅したインベントリがあり、重要度やリスク分類が付与されているか。","利用中の生成AIサービス名を業務部門ごとに一覧にして管理者へ報告さえすれば、インベントリに当たる網羅的な台帳がなくても、統制は十分に整っていると判断する。","AIベンダーの数が過去より増えたか。","AIに関する社内ニュースの配信回数と、社内報の閲覧数、および全社員向け説明会への出席者数を四半期ごとに集計しているか。"],"correctIndex":0,"explanations":["○ 正しい。把握していないAIは管理できない。インベントリは統制の出発点である。","× 誤り。網羅的な台帳がなければ、シャドーAIの有無や範囲を把握できず、重要度に応じた管理もできない。","× 数の増減ではなく、網羅的な把握と分類の有無が重要である。","× 周知は補助的な統制にすぎない。"]},{"id":"aaia-15","type":"mc","chapterIndex":1,"stem":"AI開発チームが、自らが作成したモデルの有効性検証と本番承認も担当している。最も大きな問題はどれか。","options":["作業のスピードが遅くなり、関係者の調整に時間がかかることが、AIの開発プロジェクトにおける最も大きな問題であると判断する。","開発と検証の職務分離がなく、独立性（利益相反）が確保されていない。","ドキュメントの量が増え、関係者がそれを読み込むまでに時間がかかることが、AIの開発プロジェクトにおける最も大きな問題であると判断する。","開発コストが当初予算を超過し、それに伴って本番移行の日程が数か月遅れ、関係部門との調整にも多くの時間が費やされる。"],"correctIndex":1,"explanations":["× 誤り。作業速度は効率の問題であり、独立性の欠如という統制上の問題とは性質が異なる。","○ 正しい。自己検証では見落としや過小評価のリスクが高く、独立した第2線・第3線の関与が求められる。","× 誤り。ドキュメントの量は作業負荷の問題であり、利益相反の統制上の問題ではない。","× コストは副次的である。"]},{"id":"aaia-16","type":"mc","chapterIndex":4,"stem":"ISO/IEC 42001に関する説明として最も適切なものはどれか。","options":["AIのリスク管理のガイダンスのみで、認証の対象にはならない。","認証を取得すればAI製品の精度と安全性が保証される。","認証を取得すれば、EU AI Actへの適合が自動的に証明される。","AIマネジメントシステム（AIMS）の要求事項を定めた規格で、組織は第三者認証を受けられるが、個々のAI製品の性能を保証するものではない。"],"correctIndex":3,"explanations":["× 42001は認証可能な規格である。ガイダンスにとどまるのはISO/IEC 23894である。","× 誤り。認証は管理体制の要求事項への適合を示すもので、個々の製品性能を保証するものではない。","× 適合は法令の個別要求事項に基づき判断される。認証が自動的に法適合を意味するわけではない。","○ 正しい。マネジメントシステムの認証は組織の運用体制を対象とし、特定製品の精度や安全性を保証するものではない。"]},{"id":"aaia-17","type":"mc","chapterIndex":1,"stem":"NIST AI RMF（AIリスクマネジメントフレームワーク）における「GOVERN」機能の役割として最も適切なものはどれか。","options":["個別モデルの精度を測定し、結果を四半期ごとに報告する。","インシデント発生後の復旧のみを扱う。","特定データセットの収集手順を定め、その手順に従った収集が行われているかを、四半期ごとに個別のモデルの精度と照らし合わせて確認する。","リスク管理の文化、方針、プロセス、責任体制を確立し、他の機能全体に横断的に適用される。"],"correctIndex":3,"explanations":["× 誤り。個別モデルの精度測定は、GOVERN（統治）よりも MEASURE（測定）の機能に当たる。","× 対応・復旧はMANAGEに関わり、GOVERNはより広く体制全体を扱う。","× 誤り。データ収集の手順はMAPなどの機能に属し、GOVERNの役割を説明するものではない。","○ 正しい。GOVERNは他のMAP・MEASURE・MANAGEを支える横断的な機能である。"]},{"id":"aaia-18","type":"mc","chapterIndex":2,"stem":"AIシステムごとのリスクオーナーが定義されておらず、問題発生時に誰が受容判断を行うか不明である。推奨事項として最も適切なものはどれか。","options":["外部ベンダーにリスクの責任を一任する。","AIシステムごとに責任者（オーナー）を指名し、リスク受容の権限と報告ラインを文書化する。","監査部門がすべてのAIリスクのオーナーとなり、各システムの業務上の判断やリスク受容の判断を、業務部門に代わって一元的に行う。","問題が顕在化した時点で、その場に居合わせた担当者の中から臨時に責任者を選び、その判断を後から文書化する。"],"correctIndex":1,"explanations":["× ベンダー管理は可能でも、最終的な説明責任は組織に残る。","○ 正しい。オーナーが明確でないと、リスク受容や是正の意思決定が遅れ、責任も不明確になる。","× 誤り。監査部門がオーナーになると独立性が損なわれ、リスクの責任は業務部門にあるという原則に反する。","× 事後の対応では判断が遅れ、統制として不十分である。"]},{"id":"aaia-19","type":"mc","chapterIndex":1,"stem":"高リスクと思われる新規のAIユースケースを承認するプロセスの有効性を評価したい。最も良好と判断できる状態はどれか。","options":["提案がリスク分類に基づくゲートで審査され、承認基準、記録、再審査の条件が整備されている。","審査委員会が年に1回だけ開催され、その時点で承認が必要となる案件を一括して審議するため、個々の提案にリスク分類を当てはめることは行わない。","開発者自身が承認し、そのうえで事後に報告するだけで足り、承認基準や記録は、担当者の判断で必要に応じて定めることにしている。","案件の概要を社内メールで関係者に共有し、担当部署の判断で、特段の承認基準や記録を設けずに実施を進めている。"],"correctIndex":0,"explanations":["○ 正しい。リスクに応じた審査と記録、再審査の条件があることで、承認が形式にとどまらず実効性を持つ。","× 誤り。年1回の一括審議では、個別の高リスク案件を適時に統制できない。","× 誤り。開発者による自己承認は、承認の独立性を損なうため認められない。","× 共有だけでは審査や承認の統制にならない。"]},{"id":"aaia-20","type":"mc","chapterIndex":2,"stem":"AIガバナンスの主要リスク指標（KRI）として最も適切なものはどれか。","options":["AI研修の受講者数のみで、学習の効果や行動変化は見ない。","モデルのパラメータ数と学習のGPU台数を集計した数値。","公平性指標の閾値超過件数、ドリフト検知アラート数、未解決のAIインシデント数。","PoCの実施件数のみで、リスクの水準は評価しない。"],"correctIndex":2,"explanations":["× 誤り。受講者数は活動量の指標にすぎず、リスクの水準を示すKRIとしては適切でない。","× 誤り。学習資源の規模は、ガバナンス上のリスクの大きさを直接示す指標とは言えない。","○ 正しい。リスクの兆候を早期に捉える指標であり、閾値と連動させて対応を促せる。","× 誤り。PoCの件数は実施の量を示すだけで、リスクの水準を把握する指標ではない。"]},{"id":"aaia-21","type":"mc","chapterIndex":1,"stem":"AIベンダーとの契約を監査する。AI特有の観点で最も重要な契約条項の組み合わせはどれか。","options":["価格と支払条件のみを確認し、契約書の他の条項は確認しない。","入力データの学習利用の可否、監査権、インシデント通知、モデル変更の通知、再委託先（サブプロセッサ）の開示。","ベンダーのロゴを自社の広告で使う許諾の有無のみ。","ベンダーの従業員数、本社所在地、設立年、取引銀行名、過去五年の売上実績の推移を、契約書の本文に詳細に明記すること。"],"correctIndex":1,"explanations":["× 誤り。価格や支払条件だけでは、AI特有の統制を担保する条項の有無を確認できない。","○ 正しい。AIでは、データ利用と、モデル更新による挙動変化、再委託先を含む透明性が重要である。","× 誤り。ロゴの使用許諾は契約の監査上の重要論点ではなく、AI特有の統制には関係しない。","× 基本情報であり、統制を担保する契約条項ではない。"]},{"id":"aaia-22","type":"mc","chapterIndex":1,"stem":"AIに関する従業員教育の有効性を評価する。最も適切な状態はどれか。","options":["全員に同一の動画を一度視聴させ、受講後のアンケートで満足度を確認するだけで、教育の有効性は十分に評価できたと判断する。","経営層のみが受講し、現場の従業員への教育は実施していない。","教育は実施せず、ポリシーを社内の掲示板に掲示し、従業員が自主的に読み、各自が業務で必要な内容を理解しておくことを前提に運用する。","役割（開発者、利用者、管理者、経営層）ごとに内容を設計し、理解度や行動変化で有効性を測定している。"],"correctIndex":3,"explanations":["× 誤り。満足度の確認だけでは、役割に応じた理解や行動の変化を評価できない。","× 誤り。経営層だけの受講では、開発者や利用者など役割ごとの理解と行動変化を確かめられない。","× 誤り。掲示だけの運用では、従業員の理解や行動の変化を確認できず、教育の有効性を評価できない。","○ 正しい。役割ごとのリスクが異なるため、内容の最適化と効果測定が必要である。"]},{"id":"aaia-23","type":"mc","chapterIndex":1,"stem":"生成AIの利用ポリシーが未整備で、従業員が個人アカウントに機密情報を入力していた。最初の是正策として最も適切なものはどれか。","options":["全面禁止を宣言し、違反が見つかった場合には、その時点で個別に事情を確認して処分を決めるため、以後の利用状況の確認は行わない運用とする。","問題の従業員に罰則を科すだけで十分であり、ほかの従業員への周知や、利用ツールの見直し、技術的な制限を行うことは、業務の妨げになるため行わない。","許容される利用範囲、データ分類別の入力可否、承認済みツールを定めたポリシーを策定し、周知と技術的統制（DLP等）を併用する。","事故が実際に起きるまでは利用実態の把握も周知も行わず、発生した時点で初めて、関係者を集めて対応策をまとめて検討するという方針で様子を見る。"],"correctIndex":2,"explanations":["× 誤り。全面禁止の宣言だけでは、利用実態を把握できず、再発の防止にもならない。","× 誤り。罰則だけでは、ほかの従業員への周知や技術的な統制が欠けており、再発を防げない。","○ 正しい。方針の明確化と技術的な歯止めの組み合わせが、実態の改善に有効である。","× 機密流出の恐れがあり、予防的な是正が必要である。"]},{"id":"aaia-24","type":"mc","chapterIndex":7,"stem":"AIプロジェクトの本番移行に関する統制として最も適切なものはどれか。","options":["ライフサイクルの各段階で、リスクレベルに応じた承認基準（テスト結果、影響評価、セキュリティ審査など）を満たすまで次段階へ進めない。","PoCが完了したら自動的に本番へ移行する。","開発完了後に初めてリスク評価を実施する。","経営報告書の末尾に概要を記載するだけで足り、各段階の承認は担当者の判断に任せてよい。"],"correctIndex":0,"explanations":["○ 正しい。ステージゲートにより、リスクに応じた確認なしの本番化を防げる。","× PoCでの成功は、本番に必要な統制の充足を保証しない。","× 事後の評価では手戻りが大きく、リスクが見過ごされやすい。","× 誤り。段階ごとの承認基準がなければ、本番移行の可否を統制できない。"]},{"id":"aaia-25","type":"mc","chapterIndex":2,"stem":"AIシステムのリスク評価で、従来のITリスク評価に加えて特に考慮すべきものはどれか。","options":["サーバーの設置場所の床面積と、窓の数を比べて評価する。","オフィスの空調機の型式と、その保守契約。","従業員の通勤手段と、通勤時間の長さ、ならびに自宅からの距離が、AIシステムのリスク評価で特に考慮すべき項目である。","学習データの品質、モデルの不透明性、バイアス、継続学習による挙動変化などのAI特有のリスク。"],"correctIndex":3,"explanations":["× 誤り。床面積や窓の数は、AI特有のリスク評価で考慮する要素ではない。","× 誤り。空調機の型式や保守契約は、AI特有のリスク評価の観点には含まれない。","× 誤り。通勤手段は従業員の労務の論点であり、AIシステムのリスク評価で特に考慮すべき事項ではない。","○ 正しい。データとモデルの性質に起因するリスクは、従来のITシステムにはない特徴である。"]},{"id":"aaia-26","type":"mc","chapterIndex":2,"stem":"ISO/IEC 23894の位置づけとして最も適切なものはどれか。","options":["認証が可能なマネジメントシステム規格である。","AIに特有のリスク管理に関するガイダンスであり、ISO 31000の枠組みを基にしている。","EU AI Actの条文に定められている、高リスクAIの適合性評価の具体的な手続そのものであり、この規格に従うことで直ちに法的義務を満たすことができる。","各国の刑法に基づいて課される義務を定めた規定であり、組織の内部統制の一部として、違反時には刑事上の責任を負うことを前提とした文書である。"],"correctIndex":1,"explanations":["× 認証可能な規格はISO/IEC 42001である。","○ 正しい。認証を前提とする要求事項規格ではなく、AIリスク管理の実務指針である。","× 誤り。ISO/IEC 23894はEU AI Actの条文ではなく、規格に従うことで法的義務が自動的に満たされるわけでもない。","× 誤り。ISO/IEC 23894は刑法上の義務規定ではなく、リスク管理のガイダンスである。"]},{"id":"aaia-27","type":"mc","chapterIndex":2,"stem":"高リスクのAIシステムについて、残存リスクがリスク許容度を超えている。リスク対応として最も適切なものはどれか。","options":["リスクを認識しているが、記録や承認を残さず現場の判断のみで運用を続け、問題が起きた時点で個別に対応を検討する。","リスク登録簿から該当リスクを削除し、その結果として残存リスクの報告対象から外すことで、経営層への説明を簡素化する。","追加統制や設計変更、利用範囲の縮小で低減するか、経営層が根拠を示して正式に受容、または導入を見送る。","保険に加入すれば、残存リスクの評価や追加統制、利用範囲の見直し、経営層の正式な受容判断は、いずれも不要であると判断する。"],"correctIndex":2,"explanations":["× 記録も承認もない運用は、説明責任を果たせない。","× 誤り。リスクを登録簿から削除しても実際のリスクは残り、統制の対象から外れるだけである。","○ 正しい。許容度を超えるリスクは、低減・受容（正式承認）・回避のいずれかを明示的に判断する。","× 誤り。保険は損失の一部を移転するだけで、残存リスクの評価や統制の代わりにはならない。"]},{"id":"aaia-28","type":"mc","chapterIndex":4,"stem":"EU AI Actのリスク区分に関する説明として最も適切なものはどれか。","options":["許容できないリスク（禁止）、高リスク、限定的リスク（透明性義務）、最小リスクの区分に応じて義務が異なる。","すべてのAIに同一の義務が課される。","高リスクのみが規制対象で、他はすべて対象外である。","禁止されるAI慣行は存在しない。"],"correctIndex":0,"explanations":["○ 正しい。リスクベース・アプローチを採用し、区分ごとに義務や禁止の内容が異なる。","× リスクに応じて義務の重さが異なる。","× 禁止や透明性義務も規定されている。","× 誤り。禁止されるAI慣行は存在し、EU AI Actの第5条で明確に定められている。"]},{"id":"aaia-29","type":"mc","chapterIndex":4,"stem":"EU AI Actにおいて、禁止されるAI慣行（第5条）に違反した場合の制裁金の上限として最も適切なものはどれか。","options":["3,500万ユーロ、または企業の場合は全世界年間売上高の7%のいずれか高い額。","1,500万ユーロ、または全世界年間売上高の3%。","750万ユーロ、または全世界年間売上高の1%。","制裁金は定められていないため、違反に対しては行政指導や公表による対応のみとなり、金額による上限は設けられていない。"],"correctIndex":0,"explanations":["○ 正しい。禁止慣行違反は最も重い区分の制裁金が適用される。","× 主に高リスクの義務違反など、より軽い区分の上限である。","× 当局への不正確な情報提供などの区分の上限である。","× 誤り。禁止違反には制裁金が定められており、上限額は具体的に規定されている。"]},{"id":"aaia-30","type":"mc","chapterIndex":2,"stem":"AIモデルの大幅な更新後も、リスク登録簿とリスク評価が更新されていない。最も重要な問題はどれか。","options":["リスク登録簿の見た目が古く、デザインの更新が必要である。","評価担当者の人数が少なく、評価に充てられる時間も限られているため、リスク評価の作業を外部の専門業者に全面的に委託するべき状況である。","モデル変更や運用環境の変化でリスクが変わるため、評価が最新でなく、残存リスクが不正確になる。","報告書の書式を統一し、評価の結果を担当者ごとに管理すれば、リスク評価の内容が古くなる問題は解消されると考えられる。"],"correctIndex":2,"explanations":["× 誤り。見た目の問題は、評価が最新でないことによる残存リスクの不正確さを説明しない。","× 人数より、変更に連動して再評価される仕組みの有無が重要である。","○ 正しい。リスク評価は変更に応じて見直されて初めて意思決定に使える。","× 誤り。書式の統一は報告の体裁の問題であり、評価が最新でない問題の本質的な解決にはならない。"]},{"id":"aaia-31","type":"mc","chapterIndex":2,"stem":"NIST AI RMFが「信頼できるAI」の特性として挙げているものはどれか。","options":["処理速度の最大化を目標とし、精度や安全性の要件は、運用が始まった後に担当部門の判断で必要に応じて追加すればよいと判断する。","安全性（safe）や、有害なバイアスが管理された公平性（fair）、説明可能性と解釈可能性など。","市場占有率の向上を最優先に設定し、そのための指標を経営層が定め、利用者の安全性やバイアスに関する評価は、事業の成果が出た段階で検討する。","広告効果の最大化と、ユーザーの行動データを広く収集して、ターゲティングの精度を継続的に高めることを、信頼できるAIの特性として位置づける。"],"correctIndex":1,"explanations":["× 誤り。処理速度は信頼できるAIの特性の一つではなく、安全性や公平性を後回しにする理由にはならない。","○ 正しい。信頼できるAIの特性として、妥当性と信頼性、安全、セキュリティと回復力、説明責任と透明性、説明可能性と解釈可能性、プライバシー強化、公平性などが挙げられる。","× 誤り。市場占有率は信頼できるAIの特性ではなく、安全性やバイアスの評価を後回しにしてはならない。","× 事業上の成果であり、特性ではない。"]},{"id":"aaia-32","type":"mc","chapterIndex":2,"stem":"AIリスクの許容度（リスクアペタイト）について、最も適切な状態はどれか。","options":["各開発者が個別に判断している。","ベンダーが提示した基準にそのまま従っている。","監査人が一方的に設定し、経営層の関与を最小限にする。","取締役会・経営層が戦略や規制環境を踏まえて定め、ユースケース別の閾値に落とし込んでいる。"],"correctIndex":3,"explanations":["× 基準が統一されず、組織としての許容度が存在しない。","× 許容度は自組織の戦略と責任に基づいて決めるべきである。","× 誤り。経営層が戦略として関与しない設定では、組織としての許容度とは言えない。","○ 正しい。許容度は経営の意思決定であり、現場での判断基準まで具体化されて初めて機能する。"]},{"id":"aaia-33","type":"mc","chapterIndex":2,"stem":"AI影響評価（impact assessment）を実施する適切なタイミングはどれか。","options":["廃止の直前にのみ実施し、導入前の評価は行わない。","重大な事故が発生した後にのみ実施する。","設計・導入の前に実施し、重大な変更があるときに更新する。","法令で求められない限り不要であり、社内の判断で実施時期を決めればよく、事業の変化に応じた見直しも行わない。"],"correctIndex":2,"explanations":["× 誤り。廃止の直前だけの実施では、導入の前にリスクを把握して設計に反映できない。","× 事後的な評価では、被害の予防に役立たない。","○ 正しい。事前に影響を把握して設計に反映し、変更時に見直すことで実効性が高まる。","× 誤り。影響評価は法令の有無にかかわらず、設計や導入の前に行い、重大な変更時に見直すものである。"]},{"id":"aaia-34","type":"mc","chapterIndex":2,"stem":"生成AIの出力の知的財産（IP）リスクに対して、最も適切な統制はどれか。","options":["出力のIP侵害リスクの評価、利用規約や補償条項の確認、公開前のレビュープロセス。","生成物は常に権利侵害がないものとして扱う。","出力をレビューせず、そのまま公開することで業務の速度を上げ、利用部門の判断で必要に応じて事後に確認すれば、知的財産のリスクは十分に管理できる。","生成AIには著作権の問題は存在せず、AIが生成した成果物は自動的に利用者の権利として帰属するため、法的な確認は不要である。"],"correctIndex":0,"explanations":["○ 正しい。権利侵害の可能性を前提に、契約と運用の両面で統制する。","× 侵害の可能性を無視することになり、リスクが顕在化する。","× 誤り。レビューなしの公開は知的財産侵害のリスクを統制せず、事後の確認では防げない。","× 学習データや出力に関する著作権の論点は存在する。"]},{"id":"aaia-35","type":"mc","chapterIndex":8,"stem":"人間によるレビューの形骸化（自動化バイアス）が疑われる。監査人の評価方法として最も適切なものはどれか。","options":["承認率が99%なので、レビューは有効に機能しており、担当者の確認が形式的になっていないと判断し、現状のレビュー手順を変更する必要はないとする。","レビュー担当者の人数を増やし、担当者ごとに割り当てる件数を増やすことだけで、レビューの質は自然に向上すると判断できる。","承認までの時間が短いほど、レビューの効率が高く良好であると評価し、その数値を部門の業績指標として使い、目標値を年々引き上げていくことにする。","AI出力を人が覆した割合、レビュー時間、根拠確認の実績を分析し、形骸化の兆候を評価する。"],"correctIndex":3,"explanations":["× 誤り。承認率が高いだけでは、形骸化していないとは判断できず、覆した割合などの分析が必要である。","× 人数ではなく、レビューの質が問題である。","× 誤り。承認時間が短いことは、十分な確認が行われていない兆候となりうる。","○ 正しい。承認率が極端に高く、レビュー時間が短い場合は、実質的な確認がなされていない可能性がある。"]},{"id":"aaia-36","type":"mc","chapterIndex":2,"stem":"AIのリスク対応としての「リスク移転」の例として最も適切なものはどれか。","options":["リスクのあるデータをすべて削除する。","契約上の補償条項やサイバー保険などで、リスクの一部を第三者に移す。","リスクを認識しつつ、対応の計画は行わない。","高リスクのAIの導入を中止する。"],"correctIndex":1,"explanations":["× データ削除はリスクの低減または回避に近い対応である。","○ 正しい。移転は損失の財務的影響などを第三者と分担する対応であり、リスクそのものを消すものではない。","× 誤り。対応を行わない受容は、リスク移転ではなく、リスク対応の放棄である。","× 回避にあたる。"]},{"id":"aaia-37","type":"mc","chapterIndex":3,"stem":"個人データを使ってAIモデルを学習させる計画がある。監査人が最初に確認すべきことはどれか。","options":["収集時に示した利用目的、同意、法的根拠が、学習用途を含んでいるか。","データの総量が十分に多いかどうかだけを確認すればよい。","保存先サーバーの外観と設置年の古さを確認する。","学習にかかる時間の見積りと、学習に使う計算資源の費用の概算を立て、予算の範囲内で学習を進めることを、最初に確認すべき事項とする。"],"correctIndex":0,"explanations":["○ 正しい。目的外利用や根拠の欠如は、プライバシー上の重大な不備となる。","× 誤り。データ量の多さは、利用目的や同意の適法性を確認する代わりにはならない。","× 誤り。サーバーの外観や設置年は、学習用途の適法性を判断する観点ではない。","× 誤り。予算や時間の見積りは事業上の論点であり、個人データの利用の適法性を最初に確認すべき事項ではない。"]},{"id":"aaia-38","type":"mc","chapterIndex":3,"stem":"データ最小化の原則に沿った対応として最も適切なものはどれか。","options":["将来使うかもしれないので、可能な限り多く収集する。","すべてのデータを永久に保存し、保持期限を定めず、利用目的が消えた後も、必要に応じて随時分析に使える状態に置く。","モデルの目的に必要な範囲に収集と保持を限定し、不要なデータを削除または匿名化する。","分析のため、必要に応じて全データを外部へ送信し、外部の分析ツールの処理結果をそのまま利用して、社内の分析の正確さを確認する。"],"correctIndex":2,"explanations":["× 目的外の収集は最小化の原則に反する。","× 保持期限の設定が最小化の観点で必要である。","○ 正しい。目的に不要なデータを持たないことで、漏えいや目的外利用のリスクを減らせる。","× 誤り。全データの外部送信は、データ最小化の原則に反し、漏えいや目的外利用のリスクを高める。"]},{"id":"aaia-39","type":"mc","chapterIndex":3,"stem":"氏名を削除した仮名化データを学習に使う予定である。再識別リスクに関する監査人の考え方として最も適切なものはどれか。","options":["氏名列を削除すれば完全に匿名化されたとみなせるため、その後の取扱いは通常の業務データと同様に扱ってよく、特段の追加の管理措置は必要ないと判断する。","仮名化データは、そのデータ自体の取扱いを規定する法令の適用対象から完全に外れ、個人データとしての保護も一切不要になる。","暗号化すれば、データの中身を外部から読めなくなるため、それを匿名化したことと同じになり、再識別のリスクを評価する必要はないと判断する。","他のデータとの突合や推論により再識別され得るため、再識別リスクの評価を行うべきである。"],"correctIndex":3,"explanations":["× 誤り。氏名を削除しただけでは、他のデータとの突合によって再識別されうるため、完全な匿名化とはいえない。","× 仮名化されたデータも、追加情報で個人を識別できるなら個人データとして扱われ得る。","× 誤り。暗号化は匿名化とは異なり、復号できる者には再識別が可能である。","○ 正しい。単純な識別子の削除だけでは匿名化にならない場合があり、再識別可能性の評価が必要である。"]},{"id":"aaia-40","type":"mc","chapterIndex":3,"stem":"GDPRにおける自動化された意思決定（第22条）に関する説明として最も適切なものはどれか。","options":["自動化された意思決定に関する規定はなく、事後の説明で足りる。","法的効果や同様の重大な影響を及ぼす完全自動の決定については、人間の関与や異議申立てなどの保護措置が求められる。","自動化された意思決定は一切禁止されている。","本人の同意があれば保護措置は不要である。"],"correctIndex":1,"explanations":["× 誤り。GDPR第22条は、法的効果を伴う完全自動の決定について保護措置を定めている。","○ 正しい。重大な影響を伴う自動意思決定には、個人の権利を守る措置が必要である。","× 一定の条件と保護措置のもとで認められる場合がある。","× 同意に基づく場合でも、人間の関与などの保護措置が求められる。"]},{"id":"aaia-41","type":"mc","chapterIndex":5,"stem":"データ系統（data lineage）や来歴（provenance）の管理がAI監査で重視される理由として最も適切なものはどれか。","options":["画面の見栄えが良くなり、利用者の満足度が必ず上がるから。","学習データの出所と変換履歴を追跡でき、品質問題、バイアス、権利問題の原因調査や再現に役立つから。","モデルの処理が必ず高速になるから。","AIでは不要で、従来システムの統制のみで十分なため、データの出所や変換履歴の管理は、監査の対象から外して差し支えない。"],"correctIndex":1,"explanations":["× 誤り。見栄えの向上は、データの出所や変換の追跡が監査で重視される理由にはならない。","○ 正しい。由来と加工履歴が分かれば、問題の原因を特定し、説明責任を果たせる。","× 性能向上は主目的ではない。","× 誤り。AIでは学習データの出所や変換履歴が品質やバイアスの原因究明に重要であり、監査の対象から外せない。"]},{"id":"aaia-42","type":"mc","chapterIndex":3,"stem":"従業員が個人データを含む文章を外部の生成AIサービスに入力している。日本の事業者として最も注意すべき点はどれか。","options":["外部サービスへの入力は、常に問題がない。","外部サービスへの入力は、利用規約に同意している限り常に問題がなく、社内の情報管理規程の対象外として扱い、個人データの取扱いの記録も残す必要はない。","利用者の国籍が日本でなければ規制対象外であり、入力する情報の内容や保存先にかかわらず、個人情報の保護に関する法令の検討は、必要に応じて事後に行えば十分である。","提供先が入力を学習に利用するか、第三者提供や委託に当たるか、安全管理措置や越境移転の整理が必要である。"],"correctIndex":3,"explanations":["× 個人データの扱いによっては規制上の問題が生じ得る。","× 誤り。利用規約への同意だけでは、個人データの取扱いに関する法令や社内規程の要件は満たされない。","× 誤り。国籍ではなく、取扱う個人情報の内容や提供先によって、法令上の義務が生じる。","○ 正しい。入力の取扱いは契約と法令上の位置づけで扱いが変わるため、事前整理が必要である。"]},{"id":"aaia-43","type":"mc","chapterIndex":5,"stem":"AI用データセットのガバナンスとして、最も有効な体制はどれか。","options":["IT部門だけが管理し、事業部門は関与させず、データの品質基準やアクセス権の設定も、IT部門の判断だけで決定し、利用目的の確認は行わない。","管理者は置かず、利用者が各自の判断で保存先やアクセス権を決め、品質の確認も利用者の自主管理に任せ、必要な場合にだけ後から見直す運用とする。","データセットごとに責任者を定め、品質基準、アクセス権、保持期間、利用目的を管理する。","データ管理を全面的に外部へ委託し、委託先の選定基準や監督の仕組みを設けず、委託先の判断に任せて運用する。"],"correctIndex":2,"explanations":["× 誤り。事業部門の関与がなければ、利用目的や品質基準の判断が現場の実態と合わず、責任の所在も不明確になる。","× 誤り。責任者を置かない自主管理では、品質基準やアクセス権を統制できない。","○ 正しい。責任者と管理基準が明確であれば、品質低下や不正利用を防ぎやすい。","× 委託しても、組織の責任と監督は残る。"]},{"id":"aaia-44","type":"mc","chapterIndex":3,"stem":"個人データを大規模に処理する新しいAIシステムを導入する。プライバシー影響評価（DPIA/PIA）の実施として最も適切なものはどれか。","options":["導入前に実施し、リスクと軽減策を記録して、重大な変更時に見直す。","導入後に問題が起きてから実施する。","小規模でなければ、実施は一切不要とみなす。","外部のニュースで他社事例を読めば足りる。"],"correctIndex":0,"explanations":["○ 正しい。事前評価により、設計段階でリスクを低減できる。","× 事後では、被害の予防にならない。","× 大規模・新技術での処理こそ、評価の必要性が高い。","× 自社システムの固有のリスクを評価する代わりにならない。"]},{"id":"aaia-45","type":"mc","chapterIndex":5,"stem":"EU AI Act第10条は、高リスクAIの学習・検証・テスト用データに関して、どのような要求をしているか。","options":["データは無作為に収集されたものに限られ、目的との関連性や代表性、正確性の検討は、規制上の要求事項に含まれず、任意の確認事項として扱うことで足りるとされている。","データ量が大きければ質は問われない。","非公開のデータのみ使用できる。","目的に関連し、十分に代表的で、誤りが可能な限り少なく、完全であること、およびバイアスの検討を含むデータガバナンスを求める。"],"correctIndex":3,"explanations":["× 無作為性のみを求めているわけではない。","× 量ではなく、関連性・代表性・正確性などの質が問われる。","× 公開か非公開かではなく、質とガバナンスが求められる。","○ 正しい。データの質と代表性、バイアス検討を含む管理体制が要求される。"]},{"id":"aaia-46","type":"mc","chapterIndex":5,"stem":"合成データ（synthetic data）をAI学習に使う場合の監査上の観点として最も適切なものはどれか。","options":["合成データは常に実データと同等の品質を持つ。","プライバシー保護に有用な場合があるが、元データのバイアスの継承や再識別の可能性、現実との乖離を評価する必要がある。","合成データは、プライバシー規制の対象外となるため、元データに含まれる個人情報の再識別の可能性を検討せず、社内の承認も不要で、自由に利用してよいと判断する。","合成データを使えば、元データに含まれるバイアスや誤りは完全に取り除かれ、モデルの精度は実データを用いた場合より必ず高くなるため、評価は不要である。"],"correctIndex":1,"explanations":["× 現実との乖離や偏りの混入があり得る。","○ 正しい。合成データも元データの特性を引き継ぐ。万能ではなく評価が必要である。","× 誤り。合成データであっても、プライバシー規制や再識別の検討が必要な場合がある。","× 精度は保証されない。評価が必要である。"]},{"id":"aaia-47","type":"mc","chapterIndex":3,"stem":"データ主体から削除要求があったが、当該データはすでにモデルの学習に使われている。最も適切な対応はどれか。","options":["削除要求への対応方針（再学習、アンラーニング、リスク受容の判断など）を事前に定め、決定を記録する。","社内の判断で削除要求を無視し、データ主体からの問い合わせにも応じず、学習結果は変更せずに維持して運用を続けることを、あらかじめ決定しておくべきである。","必ずモデル全体を削除しなければならず、削除が完了するまでの期間は、サービスを停止し、学習に使われた全データについても、関係者への説明を省略すべきである。","技術的に困難なので説明する必要はなく、削除要求に対しては、データ主体への回答を省略し、社内の記録も残さないことで対応を終える。"],"correctIndex":0,"explanations":["○ 正しい。事前の方針があれば、要求に一貫して対応でき、説明責任も果たせる。","× 誤り。削除要求を無視することは、データ主体の権利を侵害し、法令上の対応義務に反する。","× 誤り。必ずモデル全体を削除する義務はなく、対応方針は状況に応じて定めればよい。","× 困難でも、対応方針と根拠を説明することが求められる。"]},{"id":"aaia-48","type":"mc","chapterIndex":3,"stem":"クラウド上のLLMがリージョン外でデータを処理している。監査人が最初に確認すべきことはどれか。","options":["処理速度が速いかどうかと、応答の見た目の良さを確認する。","利用者数の推移と、月次の問い合わせ件数を確認する。","データの保存・処理場所、移転の法的根拠、契約上の保証（標準契約条項など）の有無。","管理画面の色や配置、ロゴの位置を確認する。"],"correctIndex":2,"explanations":["× 誤り。処理速度や見た目は、データの保存・処理場所や移転の法的根拠の確認に代わるものではない。","× 誤り。利用者数の推移は、越境移転のリスクを確認する最初の論点にはならない。","○ 正しい。越境移転は法令上の要件があり、契約と運用の確認が不可欠である。","× 誤り。管理画面のデザインは、データの越境移転に関する統制の確認には関係しない。"]},{"id":"aaia-49","type":"mc","chapterIndex":4,"stem":"OECDのAI原則に含まれる内容として最も適切なものはどれか。","options":["利益の最大化を最優先し、個人情報の保護は後回しにする。","国家安全保障のための秘密保持と、国家機関による全データへのアクセス権限の一元的な付与、ならびに民間企業の国有化を含む。","包摂的な成長、人間中心の価値と公平性、透明性と説明可能性、頑健性と安全性、アカウンタビリティ。","処理速度の向上を最優先し、透明性の確保は一切考慮しない。"],"correctIndex":2,"explanations":["× 誤り。利益の最大化を優先し個人情報の保護を後回しにすることは、OECD AI原則の人間中心の価値と矛盾する。","× 原則の中心的な内容ではない。","○ 正しい。OECD AI原則は、信頼できるAIの責任ある管理のための価値基準を示している。","× 誤り。処理速度の向上を優先して透明性を一切考慮しないことは、OECD AI原則の透明性と説明可能性に反する。"]},{"id":"aaia-50","type":"mc","chapterIndex":4,"stem":"日本の「AI事業者ガイドライン」の性格として最も適切なものはどれか。","options":["違反に罰則が科される法律である。","開発者・提供者・利用者といった事業者向けの、法的拘束力のない指針（ソフトロー）で、リスクベースの対応を促す。","行政機関のみを対象としており、民間の事業者は対象外とされ、行政が定めた基準に従って独自に運用方針を決めることができる。","個人利用者のみを対象としており、事業者や行政機関は対象外であるため、組織の方針や社内統制は、この指針とは関係なく定めればよいとされている。"],"correctIndex":1,"explanations":["× ガイドラインは法的拘束力を持たない。","○ 正しい。日本ではガイドラインによる自主的な取組みを重視している。","× 事業者を対象としている。","× 誤り。AI事業者ガイドラインは、事業者（開発者・提供者・利用者）を主な対象としている。"]},{"id":"aaia-51","type":"mc","chapterIndex":4,"stem":"EU AI Actで禁止されるAI慣行の例として最も適切なものはどれか。","options":["公的機関等による社会的スコアリングや、職場・教育機関での感情推定。","すべてのチャットボットの提供を禁止対象とし、利用者への説明の有無にかかわらず、社内の利用ガイドラインの対象外として扱うことが、EU AI Actの要求である。","画像編集アプリの提供を、すべて禁止対象として扱い、利用者の年齢や用途を問わず、個人の利用も含めて全面的に提供を停止することが求められている。","翻訳サービスの提供と、一般の利用者に向けた語学学習アプリの配信を、すべて禁止対象として扱うこととされている。"],"correctIndex":0,"explanations":["○ 正しい。社会的スコアリングなどは許容できないリスクとして禁止されている。","× 誤り。チャットボットは禁止ではなく、AIであることの表示などの透明性義務の対象である。","× 誤り。画像編集アプリは一般に禁止対象ではなく、EU AI Actの禁止慣行には該当しない。","× 一般的な翻訳サービスは禁止対象ではない。"]},{"id":"aaia-52","type":"mc","chapterIndex":8,"stem":"EU AI Act第14条（人間による監督）の趣旨として最も適切なものはどれか。","options":["人間による監督は不要であり、AIが自律的に判断する。","AIの出力は常に自動承認される。","監督者は結果を閲覧するだけでよい。","高リスクAIが利用期間中に自然人によって実効的に監督できるよう設計し、異常の検知、自動化バイアスへの注意、介入や停止を可能にする。"],"correctIndex":3,"explanations":["× 誤り。高リスクAIには、利用期間中に自然人が実効的に監督できる仕組みが求められる。","× 自動承認は監督と矛盾する。","× 介入や停止ができなければ、実効的な監督とはいえない。","○ 正しい。監督は形式ではなく、実際に介入できる設計が求められる。"]},{"id":"aaia-53","type":"mc","chapterIndex":4,"stem":"AIの誤判断で顧客に被害が生じた。説明責任に関する記述として最も適切なものはどれか。","options":["組織が責任主体であり、人間のオーナーを明確にし、苦情対応と是正の手続を整備しておくべきである。","AIが責任を負うため、組織に責任はない。","ベンダーのみが責任を負い、組織の監督責任は問われない。","AIが責任を負うため、組織に責任はなく、顧客への対応も、AIシステムの提供元であるベンダーの判断に委ねることが適切であり、社内の手続は不要とされている。"],"correctIndex":0,"explanations":["○ 正しい。AIは責任主体にならず、組織が責任を負う。","× AIは法的責任主体にならない。","× 誤り。AIの誤判断でも、利用する組織が責任主体であり、監督と是正の責任は免れない。","× 誤り。AIは責任主体にはなりえず、組織が責任を負い、説明や是正の手続を整える必要がある。"]},{"id":"aaia-54","type":"mc","chapterIndex":4,"stem":"チャットボットが利用者と対話する際、EU AI Actで想定される透明性の要求として最も適切なものはどれか。","options":["AIであることは開示してはならない。","役員だけに通知すればよく、利用者への開示は、社内の判断で必要と認められた場合に限り行えばよいとされている。","透明性に関する要求は一切ないが、利用者から問い合わせがあった場合にのみ、AIを利用しているかを回答すればよいとされている。","利用者がAIと対話していることを知らせる（AI生成コンテンツの表示を含む）。"],"correctIndex":3,"explanations":["× 開示が求められる。","× 誤り。利用者がAIと対話していることを知らせる透明性の要求は、役員への通知では満たされない。","× 透明性義務が定められている。","○ 正しい。限定的リスクのAIには、AIであることの開示などの透明性義務がある。"]},{"id":"aaia-55","type":"mc","chapterIndex":4,"stem":"NIST AI RMFの位置づけとして最も適切なものはどれか。","options":["準拠が法的に義務づけられており、違反した組織には、NISTから直接に制裁金や業務停止の命令が科されるため、事前の届出と確認が必要である。","自主的（voluntary）なフレームワークであり、NISTによる認証制度は存在しない。","NISTが認証を発行し、その認証の取得が事業を行ううえで必須であり、認証を持たない組織は、政府機関との取引を含めて一切の取引が制限される。","EUの規則の一部であり、EU域内で提供されるAIシステムについては、EU AI Actと同様に適用される義務を、組織の規模にかかわらず負う。"],"correctIndex":1,"explanations":["× 誤り。NIST AI RMFは自主的な枠組みであり、準拠が法的に義務づけられているわけではない。","○ 正しい。RMFは法的義務ではなく、活用して成熟度を高めるための指針である。","× 誤り。NIST AI RMFには認証制度はなく、取得が必須となる制度ではない。","× 誤り。NIST AI RMFはEUの規則ではなく、EU AI Actとは別の自主的な枠組みである。"]},{"id":"aaia-56","type":"mc","chapterIndex":4,"stem":"複数の国・地域でAIサービスを提供する組織の規制対応について、監査人が評価する最も適切な状態はどれか。","options":["最も規制の緩い国の基準に合わせている。","本国の法令のみを確認し、進出先の規制は後から調べる。","事業展開地域ごとの適用法令を特定し、要求事項を統制にマッピングして、遵守状況を継続的に評価している。","規制は問題が起きたときに調べる方針である。"],"correctIndex":2,"explanations":["× 他の地域の要求を満たせず、違反の恐れがある。","× 誤り。進出先の規制を事前に確認しないと、事業開始時点で違反が生じるおそれがある。","○ 正しい。適用法令を特定し、統制に結びつけて継続評価することで、法令遵守の実効性が担保される。","× 事後対応では、違反や制裁のリスクが高い。"]},{"id":"aaia-57","type":"mc","chapterIndex":4,"stem":"ISO/IEC 42001の附属書Aの管理策について、監査人が確認すべき点として最も適切なものはどれか。","options":["すべての管理策を例外なく実装することが必須である。","管理策は、組織の規模や業種に関係なく、同一の水準で、すべてを実装しなければならず、適用宣言書は、その実装状況を示すために作成すればよい。","適用宣言書は作成してはならない。","組織のリスクと影響の評価に基づいて管理策を選定し、適用または除外の理由を適用宣言書（SoA）で説明していること。"],"correctIndex":3,"explanations":["× リスクに基づいて選定するものであり、全部の実装が必須ではない。","× 誤り。管理策は組織のリスクと影響の評価に基づいて選定すべきで、一律の実装は求められていない。","× 作成と維持が求められる。","○ 正しい。管理策はリスクに応じて選定し、適用・除外の根拠を文書化する。"]},{"id":"aaia-58","type":"mc","chapterIndex":4,"stem":"AIの公平性の指標に関して、最も適切な考え方はどれか。","options":["公平性の定義は複数あり、同時に満たせない場合もあるため、ユースケースに応じて採用基準を定義し文書化する。","ひとつの指標を選べば、常に公平性が正しく判定できる。","公平性の定義は一つに決まっており、ユースケースにかかわらず、その指標を常に満たすことを採用基準とし、満たせない場合は、モデルを使わずに人が判断する。","全体の精度だけを見れば十分であり、集団ごとの誤り率や公平性指標を別途評価する必要はないと、社内の標準で定められている。"],"correctIndex":0,"explanations":["○ 正しい。指標間にトレードオフがあるため、目的と文脈に応じた選択と説明が必要である。","× 誤り。公平性の定義は複数あり、一つの指標で常に正しく判定できるわけではない。","× 誤り。公平性の定義は複数あり、同時に満たせない場合があるため、一つの指標を前提に判断することは誤りである。","× 精度は集団間の公平性を示さない。"]},{"id":"aaia-59","type":"mc","chapterIndex":4,"stem":"EU AI Actにおいて、高リスクAIの提供者・利用者の義務（第16条、第26条など）に違反した場合の制裁金の上限として最も適切なものはどれか。","options":["750万ユーロ、または全世界年間売上高の1%のいずれか高い額であり、そのほかに、違反事実の公表と業務停止命令が併せて科される。","3,500万ユーロ、または全世界年間売上高の7%のいずれか高い額であり、違反事実の公表や業務停止命令は、制裁金に加えて科されないとされている。","1,500万ユーロ、または企業の場合は全世界年間売上高の3%のいずれか高い額。","100万ユーロ、または全世界年間売上高の0.1%のいずれか高い額であり、違反した提供者は、それ以外の義務を負わないとされている。"],"correctIndex":2,"explanations":["× 当局への不正確な情報提供などの区分である。","× 誤り。3,500万ユーロまたは売上高7%は、禁止慣行違反の上限額である。","○ 正しい。禁止慣行より低く、不正確な情報提供より高い、中間の区分である。","× 誤り。100万ユーロや0.1%という上限額は、EU AI Actの規定とは一致しない。"]},{"id":"aaia-60","type":"mc","chapterIndex":4,"stem":"AI倫理原則は策定されているが、運用に落とし込まれていない。監査人の指摘として最も適切なものはどれか。","options":["原則が策定されていれば十分である。","原則を方針、手順、統制、測定指標へ具体化し、遵守状況を定期的に報告すべきである。","原則を削除して、簡素化すべきである。","原則は広報目的で策定されたものであり、運用は不要である。"],"correctIndex":1,"explanations":["× 運用に反映されない原則は、形骸化している。","○ 正しい。原則が運用に反映されて初めて、実効性のあるガバナンスとなる。","× 原則の削除は説明責任の後退になる。","× 誤り。原則を運用に落とし込まないと、遵守状況を検証できず、倫理的なリスクを統制できない。"]},{"id":"aaia-101","type":"mc","chapterIndex":5,"stem":"監査人が、AIモデルの学習データについてデータ来歴（data lineage）の管理状況を確認している。来歴を記録する最も重要な目的はどれか。","options":["学習データの出所と変換履歴を追跡でき、問題が見つかったときに原因となったデータまで遡れること。","学習データの量を増やし、変換履歴は保存せず、学習に使った全データを本番環境へそのまま複製して、精度を高めることが来歴記録の主な目的である。","学習データの量を自動的に増やして精度を高めること。","古いデータを自動削除して容量を節約すること。"],"correctIndex":0,"explanations":["○ データの出所・加工・利用の経路が記録されていれば、品質問題や不正利用の疑いが生じた際に原因を特定し、影響範囲を絞り込める。","× 来歴記録は、データを増やしたり本番へ複製したりする仕組みではなく、追跡可能性のための仕組みである。","× 来歴管理はデータ量を増やす機能ではない。","× 容量削減は保持・削除方針の話で、来歴管理の主目的ではない。削除すると追跡できなくなる場合がある。"]},{"id":"aaia-102","type":"mc","chapterIndex":5,"stem":"採用候補者のスクリーニングAIの学習データに、過去の採用実績に基づく特定属性への偏りがある疑いが見つかった。監査人がまず実施すべきことはどれか。","options":["採用の判断は今後もモデルに任せ、現時点の結果を変えずに運用を続け、偏りの有無は次回の定期棚卸しで確認すれば足りる。","保護属性ごとの学習データの分布と、モデルの選考結果の差をデータ分析で評価する。","保護属性の列を削除すれば偏りは完全に解消されるため、削除の実施記録を確認するだけで監査は完了となる。","ベンダーの全体精度が高いことを確認し、問題なしと結論づける。"],"correctIndex":1,"explanations":["× 事実確認を怠り、現状のまま運用を続ける対応は不適切である。","○ 偏りの有無と程度は、属性別の分布と結果の比較で定量的に把握できる。事実を確認したうえで是正策を検討するのが順序として適切である。","× 居住地域などの特徴量が代理変数（proxy）として働くことがあり、列の削除だけでは偏りは解消しない。","× 全体精度は集団間の不公平を示さない。属性別の分析が必要である。"]},{"id":"aaia-103","type":"mc","chapterIndex":3,"stem":"個人情報を含む顧客データを、当初の収集目的とは異なるAI学習に利用する計画がある。監査人が最も重視すべき確認事項はどれか。","options":["学習完了後に元データを削除すれば、学習済みモデルからも個人の情報は完全に消えるため、目的外利用の問題は発生せず、プライバシー上の確認も一切不要になると考えられる。","社内だけで利用するデータであれば、利用目的の確認や同意の範囲の検討は、外部提供がない限り一切必要ない。","収集時に示した利用目的や同意の範囲に照らして、学習利用の法的根拠が確立しているか。","データを暗号化してさえいれば、利用目的や同意の範囲にかかわらず、どのような学習にも自由に利用してよく、事前の確認や記録も一切不要である。"],"correctIndex":2,"explanations":["× 学習済みモデルが個人データの特徴を記憶している可能性があり、元データの削除だけでは目的外利用の問題は解消しない。","× 社内利用であっても、個人データの利用目的の制限は適用される。","○ 目的外利用の可否は、収集時の目的・同意・適用法令で決まる。必要に応じて同意の再取得や仮名化・匿名化を検討する。","× 暗号化は安全管理措置であり、利用目的の適法性は担保しない。"]},{"id":"aaia-104","type":"mc","chapterIndex":5,"stem":"テストデータの一部が学習データに混入していること（データリーク）が判明した。最も大きなリスクはどれか。","options":["学習に必要な時間が長くなること。","モデルのファイルサイズが小さくなること。","推論の応答速度が低下すること。","評価指標が実力以上に良く見え、本番での性能を過大評価してしまうこと。"],"correctIndex":3,"explanations":["× 学習時間とは直接関係しない。","× リークはモデルサイズに影響しない。","× 推論速度は評価データの混入とは無関係である。","○ モデルが評価用データをすでに学習しているため、未知データに対する性能が正しく測れず、リスクを過小評価する。"]},{"id":"aaia-105","type":"mc","chapterIndex":8,"stem":"AIモデルの運用において「データドリフト（data drift）」の説明として最も適切なものはどれか。","options":["データセンターの障害により、学習データが消失すること。","担当者が学習データのラベルを手作業で一括修正し、その修正内容を記録せずに本番へ反映してしまうこと。","モデルのパラメータ数が学習中に増加していくこと。","本番環境の入力データの分布が、学習時のデータの分布から変化していくこと。"],"correctIndex":3,"explanations":["× これは可用性・バックアップの問題であり、分布変化を指すデータドリフトではない。","× ラベル修正の記録がないことは統制上の問題だが、ドリフトの定義ではない。","× モデル構造の変化は、データの分布変化とは別の話である。","○ 入力の統計的性質が学習時と乖離すると、モデルの精度が低下するおそれがある。PSIなどの指標で監視する。"]},{"id":"aaia-106","type":"mc","chapterIndex":5,"stem":"組織が合成データ（synthetic data）を学習に用いている。監査人が特に確認すべき事項はどれか。","options":["合成データは常に実データより品質が高いため、生成したデータをそのまま採用し、元データとの比較や品質検証は学習の前にも後にも一切行わなくてよいと判断してよい。","合成データは規制の対象外とされているため、個人データを元にしていても、個人情報保護の統制を一切適用せず、社内の通常のデータ管理ルールだけで扱ってよいとされている。","元データの特性を保ちつつ個人が再識別されないこと、およびバイアスを増幅していないことが検証されているか。","合成データの生成速度が速く、大量のデータを短時間で作成できることを確認する。"],"correctIndex":2,"explanations":["× 合成データの品質は生成方法に依存し、常に実データを上回るわけではない。","× 元データが個人データの場合、一律に対象外とはいえない。","○ 合成データは元データの偏りを引き継ぎ増幅することがあり、元データとの近さによっては再識別のリスクもある。有用性とプライバシーの双方を検証する必要がある。","× 生成速度は運用効率の問題であり、リスク評価の中心ではない。"]},{"id":"aaia-107","type":"mc","chapterIndex":5,"stem":"データのラベリング作業を外部業者に委託している。ラベル品質に関する最も適切な統制はどれか。","options":["納期を守っているかどうかだけを確認し、ラベルの内容や正確さについては、委託先の自己申告を信頼して、特段の検査は行わないこととする。","ラベリング基準を文書化し、品質のサンプリング検査とラベラー間の一致度の測定を行う。","委託先は費用が最も安い業者を選定し、品質に関する契約上の要件や検査の実施は、委託後に必要に応じて検討することとする。","ラベル品質はモデルの精度から自動的に保証されるため、精度が一定以上であれば、ラベルに対する個別の統制は一切不要であるとみなしてよい。"],"correctIndex":1,"explanations":["× 納期は品質を示さない。ラベルの誤りはモデルの性能と公平性に直結する。","○ 基準の明確化と品質の定量的な確認により、ラベルの誤りや一貫性の欠如がモデルに混入するのを抑えられる。","× 費用のみで選定すると品質管理がおろそかになるおそれがある。","× 誤ったラベルで学習すると、誤りを含んだまま精度が出る場合があり、精度から品質は保証できない。"]},{"id":"aaia-108","type":"mc","chapterIndex":5,"stem":"AIのデータ品質評価について、最初に行うべきことはどれか。","options":["AIの利用目的に照らして、完全性・正確性・一貫性・適時性などの品質基準を定義し、データがそれを満たすか測定する。","データ量を最大化すれば品質も向上するとして、収集を拡大する。","欠損値はすべて一律に0で置き換える方針を適用する。","最新のアルゴリズムに変更して、欠損や偏りの問題を補う。"],"correctIndex":0,"explanations":["○ 品質は利用目的に対して定義されるものであり、基準が定まって初めて評価と是正が可能になる。","× 量が多くても誤りや偏りを含めば品質は低い。量と質は別である。","× 一律の補完は分布を歪めバイアスを生むことがある。","× アルゴリズムの変更でデータ品質の問題は解決しない。"]},{"id":"aaia-109","type":"mc","chapterIndex":3,"stem":"データ主体から個人データの削除を求められた。学習済みモデルに関して、組織が検討すべき課題として最も適切なものはどれか。","options":["データベースから削除すれば、モデルへの影響も消えるため、再学習は不要である。","AIに使われたデータは削除の対象にならないため、要求を断ってよい。","要求者に対して、モデルの構造の詳細や学習に使った全データの一覧を開示し、削除されたかどうかは要求者自身に確認させればよい。","削除対象のデータの影響が学習済みモデルに残る可能性があるため、再学習などの対応方針を定めること。"],"correctIndex":3,"explanations":["× データベースから消しても、モデルのパラメータにその影響が残る場合がある。","× 一律に対象外とはならず、個別に適用法令を確認する必要がある。","× 構造の開示は削除要求への対応ではない。","○ データベースから消しても、モデルのパラメータにその影響が残る場合がある。法令と技術的実現性を踏まえた対応方針が必要になる。"]},{"id":"aaia-110","type":"mc","chapterIndex":6,"stem":"AIの運用で「学習時と推論時のデータ変換の不一致（training-serving skew）」を防ぐために最も有効な統制はどれか。","options":["推論時には、学習時より高性能なサーバーや大規模な計算資源を常に使用し、処理能力を高めることで、学習と推論の違いによる影響を十分に吸収できるようにする。","前処理・特徴量変換のロジックをバージョン管理し、学習と推論で同じ処理を使う仕組みを整える。","学習時と推論時で、それぞれ担当者が独自に変換を実装し、各自の判断で処理の細部を決めてよいこととして、一致の確認は行わない。","不一致が起きたら、その都度モデルを再学習し、原因は調べない。"],"correctIndex":1,"explanations":["× 処理性能と変換ロジックの一致は別の問題で、サーバーの性能は不一致を解消しない。","○ 同一の変換コードや特徴量ストアを共用すれば、学習時と本番時の入力の食い違いによる性能劣化を防げる。","× 別々に実装すると差異が生じやすく、不一致を引き起こす。","× 原因を除かない再学習は対症療法であり、再発する。"]},{"id":"aaia-111","type":"mc","chapterIndex":5,"stem":"組織が第三者から購入したデータセットをAIの学習に利用している。監査人が最も重視すべき確認はどれか。","options":["データの価格が市場価格と比べて妥当であることを、購買担当者の見積もり比較の記録を根拠に、学習の利用範囲とは切り離して、まず第一に確認すること。","データ形式がCSVで提供されており、他のシステムへの取り込みが簡単に行えることを、学習の前に技術担当者と一緒に確認すること。","提供元がデータを適法に取得しており、学習利用がライセンス範囲に含まれることが契約と証跡で確認できるか。","提供元が大手企業であれば、取得経緯や利用条件の確認は省略でき、契約書の内容は利用開始後に事後確認すれば、監査上は十分と判断してよい。"],"correctIndex":2,"explanations":["× 価格は購買管理の論点で、適法性とは関係がない。","× 形式は技術的な利便性の問題であり、リスクの中心ではない。","○ 適法性とライセンスの範囲が不明確だと、権利侵害や規制違反によりモデルの利用自体が制限されるおそれがある。","× 企業の規模は適法性を保証しない。契約と証跡での確認が必要である。"]},{"id":"aaia-112","type":"mc","chapterIndex":5,"stem":"AIの学習用データセットへのアクセス管理について、最も適切な統制はどれか。","options":["職務に基づく最小権限でアクセスを付与し、アクセス記録を監視する。","開発チーム全員に全データの読み取りを付与する。","共有パスワードを使い、個別記録は残さない。","本番データを個人端末へ無加工でコピーして作業させる。"],"correctIndex":0,"explanations":["○ 機微なデータを含むことが多い学習データは、必要な者だけに限定し、操作を追跡可能にすることが基本である。","× 必要性を超える権限付与は、漏えいや不正利用のリスクを高める。","× 共有アカウントでは誰が何をしたか追跡できない。","× 個人端末への無加工コピーは、漏えいリスクが高い。"]},{"id":"aaia-113","type":"mc","chapterIndex":6,"stem":"AIソリューションのライフサイクルを監査する際、設計段階で最初に確認すべき事項はどれか。","options":["最新の深層学習アルゴリズムが採用されていること。","AIを使う目的と成功基準がビジネス要件として文書化され、承認されていること。","モデルの学習に使う計算資源が十分にあること。","本番稼働後の運用担当者と保守の役割分担が決まっており、運用開始後の変更権限も運用側に一任されていることや、障害時の連絡網の整備も含めて確認すること。"],"correctIndex":1,"explanations":["× 手法の新しさは目的の妥当性を示さない。","○ 目的と成功基準が不明確だと、開発・評価・運用の各段階で妥当性を判断できない。","× 計算資源は実装の詳細であり、要件の妥当性より後に検討する。","× 運用体制も重要だが、まず何のために作るのかという要件が先に必要である。"]},{"id":"aaia-114","type":"mc","chapterIndex":6,"stem":"MLOpsの説明として最も適切なものはどれか。","options":["機械学習モデルの数式を人手で検証するための統計手法であり、学習データの形式やモデルの構造を、作成者が一人で確認するための手順を定めたもの。","AIの学習データを暗号化して保管し、その復号鍵を開発者個人が専有して管理するための認証規格で、外部の審査を必要とするもの。","AIを導入する際の費用を算出するための会計基準。","機械学習モデルの学習・デプロイ・監視などを自動化し、再現可能な形で継続的に運用する実務。"],"correctIndex":3,"explanations":["× MLOpsは数式の検証手法ではなく、運用プロセスの考え方である。","× 暗号化は個別の統制であり、MLOpsの定義ではない。","× 会計基準ではなく、開発運用のプラクティスである。","○ データ準備から運用監視までを一貫した手順とツールで管理し、品質と再現性を高める考え方である。"]},{"id":"aaia-115","type":"mc","chapterIndex":7,"stem":"モデルのバージョン管理が行われていない場合の最も重要なリスクはどれか。","options":["本番で稼働していたモデルを再現できず、問題発生時の原因調査・ロールバック・監査証跡が困難になること。","バージョン管理を行わなくても、モデルの精度は時間の経過とともに必ず低下し続け、その原因は学習データの量の増加にあるため、データ量の管理が最も重要なリスクとなること。","学習データの量が自動的に増加し、保存容量が毎月大きく増えて、データセンターの運用費用が予算を超えてしまうこと。","モデルのファイル名が長くなり、システムの画面や帳票の一覧表示で、担当者の業務効率が低下し、確認作業の時間も増えてしまうこと。"],"correctIndex":0,"explanations":["○ どのデータ・コード・パラメータで作ったモデルかを特定できないため、説明責任と復旧に支障をきたす。","× 管理がなくても精度が必ず低下するわけではない。問題は再現性と追跡性である。","× バージョン管理とデータ量は無関係である。","× ファイル名の長さはリスクではない。"]},{"id":"aaia-116","type":"mc","chapterIndex":9,"stem":"モデル検証（validation）の独立性について、最も適切な統制はどれか。","options":["開発者本人が自らのモデルの検証を担当し、結果を報告する。","検証は本番稼働後に利用者の苦情で代替する。","モデルを開発したチームとは別の、独立した担当者が検証を実施する。","ベンダーの精度保証書を採用の判断材料とする。"],"correctIndex":2,"explanations":["× 自己検証では客観性が確保されにくい。","× 苦情を待つ方法は事後対応であり、事前の検証の代わりにならない。","○ 開発者自身が検証すると利益相反が生じやすい。独立した検証により、見落としや楽観的評価を抑えられる。","× ベンダーの保証書だけでは、自社の用途での妥当性は確認できない。"]},{"id":"aaia-117","type":"mc","chapterIndex":7,"stem":"AIモデルを本番環境へ移行する前のゲート（承認関門）として、最も適切なものはどれか。","options":["開発担当者が準備できたと判断した時点で、速やかに本番へ移行する。","事前に定めた受入基準（精度・公平性・頑健性など）を満たしたことを確認し、権限のある承認者が承認する。","本番移行後に問題が起きたら、その時点で承認を取る。","承認の記録は残さず、口頭の合意と担当者同士の了解のみで移行を進め、必要が生じた場合は後から記録を作成して辻褄を合わせることとし、監査時の説明に備える。"],"correctIndex":1,"explanations":["× 担当者の主観のみでは統制にならない。独立した承認が必要である。","○ 基準の事前定義と承認の記録により、恣意的な判断を避け、移行の妥当性を示す証跡が残る。","× 事後承認は事前の関門にならず、リスクを管理できない。","× 記録がなければ監査で承認の有無を確認できない。"]},{"id":"aaia-118","type":"mc","chapterIndex":6,"stem":"モデルカードやデータシートといった文書化の主な目的として、最も適切なものはどれか。","options":["想定用途、制限事項、評価結果、既知のバイアスなどを記録し、利用者や監査人が適切に判断できるようにすること。","モデルの学習を高速化し、計算資源の使用量を大幅に減らすためのプログラムや設定をまとめた文書で、運用チームの作業手順を標準化するための社内の資料として、毎月更新して保管するもの。","競合他社にモデルの内部構造を積極的に公開して、自社の技術力を宣伝するための広告用の資料をまとめ、対外的な発表会の場で配布するための文書として作成するもの。","ソースコードのコメントを自動生成する仕組み。"],"correctIndex":0,"explanations":["○ モデルやデータの特性・限界を透明にすることで、不適切な利用を防ぎ、説明責任を果たしやすくする。","× 文書化は透明性のための手段で、学習速度を上げるものではない。","× 目的は透明性と責任ある利用であり、宣伝ではない。","× コメント生成ではなく、モデルの用途と特性を伝える文書である。"]},{"id":"aaia-119","type":"mc","chapterIndex":10,"stem":"組織が外部の事前学習済みモデル（基盤モデル）をファインチューニングして業務に利用している。上流のモデルに関して、最も重要なリスクはどれか。","options":["ファインチューニングをすれば、上流モデルの学習データやライセンス、脆弱性、バイアスのリスクはすべて消え、自社による評価や確認は不要になるため、導入後も追加の統制は必要ない。","上流モデルは第三者が作成したものであるため、利用して提供するサービスの結果についても、自社には一切責任は生じず、契約上の責任もすべて提供元に帰属する。","モデルのファイルが大きく、ディスク容量を多く消費するため、保管先の増設や定期的な容量管理が必要になること。","上流モデルの学習データ、ライセンス、脆弱性、バイアスが引き継がれる可能性があること。"],"correctIndex":3,"explanations":["× 追加学習で上流の性質がすべて消えるわけではない。","× 利用して提供するサービスの結果には、自社の責任が及ぶ。","× 容量は運用上の課題だが、監査上の主要なリスクではない。","○ 基盤モデルの特性は派生モデルに影響する。出所やライセンス条件を確認し、必要な保証を契約で求めるべきである。"]},{"id":"aaia-120","type":"mc","chapterIndex":6,"stem":"アジャイルでAIを反復開発している組織について、監査人が確認すべき最も適切な統制はどれか。","options":["迅速性を優先し、反復中の承認は省略する。","ドキュメントは作らず、会話で済ませる。","各反復においても、変更管理とリスクレビューの関門が維持され、記録が残っていること。","最終リリース時にのみ全体を一度だけレビューし、途中の記録は省略する。"],"correctIndex":2,"explanations":["× 承認の省略は統制の欠如につながる。","× 記録がなければ後から検証できない。","○ 短いサイクルでも、品質・公平性・セキュリティの確認と承認を省略しなければ、統制を保ったまま柔軟に開発できる。","× 最後だけでは、途中で入り込んだ問題の発見が遅れる。"]},{"id":"aaia-121","type":"mc","chapterIndex":6,"stem":"AIソリューションの廃止（decommissioning）段階で、監査人が確認すべき最も適切な事項はどれか。","options":["モデル・学習データ・ログの保存または削除の方針、依存システムの切り替え、責任者の承認が定められていること。","廃止後もモデルを無期限に本番に放置しておくこと。","廃止は開発者の判断で、通知なしにいつでも実施できること。","学習データは一切確認せず、法令上の保存義務や監査証跡の要否も検討しないまま、全てのデータとログを即座に消去し、依存システムへの影響も確認せずに、廃止を一方的に通知すること。"],"correctIndex":0,"explanations":["○ 廃止時には、法令や契約に沿ったデータの扱いと、下流への影響の管理が必要になる。","× 不要なモデルの放置は、管理されない資産となりリスクを生む。","× 依存するシステムや利用者への影響を考慮した手続きが必要である。","× 法令上の保存義務や監査証跡の要否を確認せずに消去するのは不適切である。"]},{"id":"aaia-122","type":"mc","chapterIndex":0,"stem":"AIシステムの要件が、エンタープライズアーキテクチャと整合しているかを評価する際、最も適切な確認はどれか。","options":["AI部門が独自に構築したシステムとして、全社の設計標準や既存のシステムとの連携方式とは切り離し、部門の判断で仕様を自由に決め、統一的な管理の対象からは外しておくこと。","要件の整合は本番稼働後に、利用者からの問い合わせや不具合報告を確認しながら、必要に応じて事後的に調整すれば十分であり、設計段階での確認は不要とすること。","既存のシステム、データフロー、セキュリティ標準との整合を、設計段階でレビューしていること。","クラウドを利用していれば、既存システムとの連携確認も省略できる。"],"correctIndex":2,"explanations":["× 標準から切り離すと、統制・統合・保守上の問題を招く。","× 後から整合を取るのは手戻りが大きくリスクが高い。","○ 全体のアーキテクチャと整合させることで、重複投資や統制の抜けを防げる。","× クラウド利用は設計の代わりにならない。"]},{"id":"aaia-123","type":"mc","chapterIndex":9,"stem":"ハイパーパラメータを繰り返し調整した結果、学習データでは非常に高い精度だが、未知のデータでは精度が大きく低下することがわかった。この状態を示す用語はどれか。","options":["過少適合（underfitting）。学習データでも精度が低い状態を指し、この状況とは逆の状態である。","過学習（overfitting）","概念ドリフトの解消。本番での関係性の変化が止まり、モデルの性能が安定したことを指す。","正則化の完了。過学習を抑える手法の適用が終わったことを示すもので、この状態の名称ではない。"],"correctIndex":1,"explanations":["× 過少適合は学習データでも精度が低い状態で、この状況とは逆である。","○ 学習データに過度に適合し、汎化性能が低下している状態である。","× 概念ドリフトは本番での関係性の変化で、学習時点の過剰適合とは異なる。","× 正則化は過学習を抑える手法であり、この状態の名称ではない。"]},{"id":"aaia-124","type":"mc","chapterIndex":0,"stem":"与信審査にAIを導入する計画で、説明可能性の要件が開発前に定められていない。最も大きなリスクはどれか。","options":["モデルの学習に使う電力が増加し、冷却設備の増強が必要になる。","利用者の画面のデザインが統一されなくなる。","モデルの名称が重複してしまう。","審査結果の理由を顧客や規制当局に説明できず、後から要件を満たすための修正に大きな手戻りが生じること。"],"correctIndex":3,"explanations":["× 電力は主要な論点ではない。","× 説明可能性とUIデザインの統一は別の話である。","× 名称の重複は本件のリスクではない。","○ 説明責任が求められる意思決定では、設計段階から説明可能性を要件に含めるべきである。"]},{"id":"aaia-125","type":"mc","chapterIndex":7,"stem":"AIモデルの再学習（retraining）について、変更管理の観点から最も適切な考え方はどれか。","options":["コードを変更しないため、変更管理の対象外である。","データサイエンティストが自由に再学習して、本番に直ちに反映してよい。","本番の挙動に影響する変更であり、承認・テスト・ロールバック計画を伴う変更管理の対象とすべきである。","再学習は月次で自動に行うため、実行の記録や結果の確認、承認の証跡は、システムの自動実行ログがあれば十分であり、別途の保存や確認の作業は一切不要であるとみなしてよい。"],"correctIndex":2,"explanations":["× コードが不変でも、モデルの挙動は大きく変わりうる。","× 無承認の反映は、統制を逸脱する。","○ 再学習でモデルの判断が変わるため、通常のシステム変更と同様、事前の審査と事後の確認が必要である。","× 自動であっても、実行の記録と結果の確認は必要である。"]},{"id":"aaia-126","type":"mc","chapterIndex":7,"stem":"オンライン学習により、本番モデルが利用データを取り込んで継続的に自動更新される仕組みがある。最も重要なリスクはどれか。","options":["承認や検証を経ないまま挙動が変化し、性能低下や意図しない出力の発生、監査証跡の欠落が起こりうること。","モデルが利用データを取り込むたびに精度を向上し続けるため、検証や監視を行わなくても、問題は発生せず、継続的に性能が改善していくため、運用の負担も増えないこと。","データ量が増えるため、ストレージの容量が不足し、保存先の増設や古いデータの削除を毎月行う必要が生じて、運用の手間と費用が大幅に増えてしまうこと。","利用者が自動更新に気づかないこと。"],"correctIndex":0,"explanations":["○ 継続学習では変更の都度の審査が行われにくい。更新頻度・範囲の制限、監視、検証の仕組みが必要になる。","× 継続的な更新は性能を下げる場合もあり、常に向上するとは限らない。","× 容量は運用課題だが、監査上の主な懸念は統制の欠如である。","× 認知の問題より、検証されないまま挙動が変わることの方が重大である。"]},{"id":"aaia-127","type":"mc","chapterIndex":7,"stem":"クラウドのAIサービス事業者が、予告なくLLMのバージョンを更新した。この種のリスクに対して、最も適切な統制はどれか。","options":["更新は事業者の責任であり、契約上も技術上も利用者側に確認の義務はないため、自社での確認や検証は一切不要であると整理し、今後も変更内容を追跡せず、担当部署への報告も行わないこととする。","更新のたびに、全社員へ注意を促すメールを送り、業務で使う際には慎重に扱うよう周知を繰り返すことで、出力の変化に対応したとみなす。","更新を避けるため、生成AIサービスの利用を一切やめ、文章作成や分析を含めた業務をすべて手作業に切り替えて、今後も外部のAIを使わない運用を続けること。","契約で変更の事前通知とバージョン固定の選択肢を求め、更新時には自社の主要ユースケースで回帰テストを実施する。"],"correctIndex":3,"explanations":["× 出力を業務に使う以上、利用者側にも検証責任が残る。","× 周知だけでは性能変化の検証にならない。","× 過度な対応であり、まず通知・固定・回帰テストの統制を検討すべきである。","○ 出力の変化が業務に影響しうるため、通知を受けて検証する仕組みが有効である。"]},{"id":"aaia-128","type":"mc","chapterIndex":7,"stem":"LLMを利用するアプリケーションで、システムプロンプトやプロンプトテンプレートの変更に関する統制として最も適切なものはどれか。","options":["プロンプトは文章であり、誰でも自由に本番で編集してよい。","出力に影響する構成要素として、バージョン管理しレビュー・承認の対象とする。","変更履歴は、担当者の記憶と口頭の引き継ぎに頼って管理する。","プロンプトの変更後は、テストせず稼働を続ける。"],"correctIndex":1,"explanations":["× 無統制の編集は、予期せぬ出力や不正な指示の混入を招く。","○ プロンプトの変更は挙動を大きく変えうるため、コードと同様に変更履歴と審査を管理する。","× 記憶に頼ると追跡できず、監査証跡にならない。","× 変更後の動作確認を省略するのは不適切である。"]},{"id":"aaia-129","type":"mc","chapterIndex":7,"stem":"AIモデルの変更を本番に適用する際のロールバック計画として、最も適切なものはどれか。","options":["問題が起きたら、その場で新しいモデルを一から開発する。","旧モデルは移行後すぐに削除し、必要時は新たに開発し直す。","旧バージョンのモデルと、それが依存するデータや特徴量定義を復元できる手順が定められ、事前に試験されていること。","ロールバックは不要であり、新モデルは常に旧モデルより優れていて、精度も安定性も向上しているため、問題が起きることは想定せず、万一の場合も対応は後回しにしてよい。"],"correctIndex":2,"explanations":["× 復旧に時間がかかり、計画とはいえない。","× 削除すると戻せなくなる。保持期間を設けるべきである。","○ モデルだけでなく依存する前処理や特徴量も戻せなければ、旧状態は再現できない。","× 新モデルが優れていることは保証されない。"]},{"id":"aaia-130","type":"mc","chapterIndex":1,"stem":"AI導入に伴う業務変更について、ワークフォース（従業員）への影響を評価する目的として、最も適切なものはどれか。","options":["AIの導入によって削減できる人員数だけを算出し、その結果を経営判断の材料として、対象となる従業員へは配置転換の理由を個別に通知しないまま、人員計画を進めること。","従業員には導入直前まで知らせずに進める。","影響評価は、AIの精度が低下して問題が顕在化した場合にのみ実施すればよく、導入前の事前評価や従業員への説明は、後から必要に応じて行えば足りるとすること。","役割や業務の変化に対応した教育・再配置・支援を計画し、導入による混乱や不公平を抑えること。"],"correctIndex":3,"explanations":["× 人員削減のみに着目するのは、評価の目的として偏っている。","× 適切な準備と周知が行われず、反発や運用ミスを生む。","× 導入前に評価することが重要で、精度低下を待つものではない。","○ 従業員への影響を把握すれば、必要なスキル研修や役割の再設計を準備できる。"]},{"id":"aaia-131","type":"mc","chapterIndex":7,"stem":"構成管理（configuration management）をAIに適用する際、構成アイテムとして管理すべきものとして最も適切なものはどれか。","options":["モデル、学習データセット、前処理コード、依存ライブラリ、プロンプトなどの構成要素。","完成したモデルの実行ファイルと、その稼働時刻や利用者の一覧のみを、運用ログとして定期的に保存し、再現に必要なデータや設定は記録しないこととする。","開発者の氏名の一覧を、担当者ごとに整理して保管し、変更の経緯や作業内容は記録せずに、人の情報だけを管理対象とすることとする。","経営会議の議事録のみを保管し、システムの構成や変更の経緯、担当者の作業内容は、管理の対象から外しておく方針とする。"],"correctIndex":0,"explanations":["○ どの組み合わせで本番が稼働しているかを特定できなければ、再現と変更管理が成り立たない。","× 実行ファイルだけでは、再現に必要なデータや設定が追跡できない。","× 担当者の情報だけでは構成管理にならない。","× 議事録は重要な記録だが、システム構成の管理とは別物である。"]},{"id":"aaia-132","type":"mc","chapterIndex":7,"stem":"障害対応のため、承認手続きを省略して緊急にモデルを差し替えた。事後の統制として最も適切なものはどれか。","options":["緊急だったため、記録は残さない。","差し替えの理由・内容・影響を文書化し、事後に遡及してレビューと承認を行う。","同じ方法で今後もすべての変更を承認なしで行う。","結果に問題がなければ、事後のレビューは省略してよい。"],"correctIndex":1,"explanations":["× 記録がなければ、後の検証や再発防止ができない。","○ 緊急変更を認める場合でも、事後の確認と記録により統制の抜けを補う必要がある。","× 緊急措置を常態化させるのは、統制の形骸化につながる。","× 結果が良くても、手続き上の逸脱は事後に確認する必要がある。"]},{"id":"aaia-133","type":"mc","chapterIndex":7,"stem":"AIモデルの変更に対する影響評価で、最も重要な観点はどれか。","options":["その変更が、下流のシステム・意思決定プロセス・利用者や関係者に及ぼす影響。","勤務時間と社内チャットの利用状況を事前に把握すること。","変更作業を行うサーバーの設置場所。","モデルの名称が分かりやすく、利用者が初めて見ても内容を理解できるかどうか、およびその名称が社内の用語集に登録されているかどうかを確認すること。"],"correctIndex":0,"explanations":["○ モデルの出力は他の業務判断に連鎖して使われるため、波及先まで含めて評価する必要がある。","× 勤務時間は、影響評価の観点として中心ではない。","× 設置場所は主要な論点ではない。","× 名称は影響評価の本質ではない。"]},{"id":"aaia-134","type":"mc","chapterIndex":7,"stem":"変更諮問委員会（CAB）がAIモデルの変更を審査する際、最も適切な体制はどれか。","options":["AIの専門知識がなくても、形式的に承認する会議体であればよく、個々の変更については担当者が個別に判断し、審査の記録は担当者の判断により必要に応じて残すこととすればよい。","通常のIT担当者に加え、モデルリスクやデータサイエンスの知見を持つ者が参加し、性能や公平性の変化を評価できること。","モデルを作成した本人が、単独で承認を行い、変更の内容や影響の評価も本人の判断で行い、審査の会議は、必要に応じて事後に開催すれば、承認としては十分とみなすことができる。","メールの既読と、口頭の了承だけで承認とする。"],"correctIndex":1,"explanations":["× 形式的な承認では、AI固有のリスクを見逃すおそれがある。","○ AI特有の観点（精度、バイアス、ドリフト）を評価できる専門性が、実効的な審査に欠かせない。","× 作成者のみの承認は、職務分離の観点から不適切である。","× 既読は審査や承認の証跡にならない。"]},{"id":"aaia-135","type":"mc","chapterIndex":1,"stem":"従業員が業務上の機密情報を外部の生成AIサービスに入力してしまうリスクに対して、最も適切な統制はどれか。","options":["一度の全体メールで注意喚起すれば十分であり、以後の周知や研修、技術的な制御については、必要が生じた時点で個別に検討するだけで足りると判断する。","生成AIの利用を黙認し、従業員の自主的な判断に任せ、問題が起きたときにだけ事後の対応を行えば、組織として十分な対策になるとみなす。","AI利用方針の周知と研修に加え、データ漏えい防止（DLP）など技術的制御で入力を制限する。","機密情報の分類は行わず、どの情報をAIに入力してよいかの判断は、従業員の個人の裁量に任せて、基準は設けないこととする。"],"correctIndex":2,"explanations":["× 一度の周知だけでは定着せず、技術的制御も欠く。","× 事後対応のみでは、情報漏えいを防げない。","○ ルールの周知と技術的な歯止めを組み合わせると、ヒューマンエラーに対する実効性が高まる。","× 分類基準がなければ、判断が属人化し一貫性を欠く。"]},{"id":"aaia-136","type":"mc","chapterIndex":1,"stem":"AI関連の方針・手順について、従業員の意識向上（awareness）プログラムが整合しているかを評価する際、最も適切な確認はどれか。","options":["プログラムを実施した事実のみを確認する。","資料の見た目が統一され、デザインのガイドラインに沿っているかを重点的に確認する。","経営層のみが受講していればよい。","プログラムの内容が組織のAI方針と一致し、対象者の受講状況と理解度が確認されていること。"],"correctIndex":3,"explanations":["× 実施しただけでは、内容の妥当性や理解の定着は確認できない。","× 見栄えは副次的で、方針との整合とは別の論点である。","× 実務でAIを使う従業員が対象に含まれなければ効果が乏しい。","○ 内容の整合に加え、実施と効果の確認があって初めてプログラムが機能しているといえる。"]},{"id":"aaia-137","type":"mc","chapterIndex":8,"stem":"重要な意思決定にAIを用いる際の「人間による関与（human-in-the-loop）」の説明として、最も適切なものはどれか。","options":["AIの出力は、人間が一切確認せずに自動実行され、事後の記録や異議申立ての窓口も設けず、判断の見直しも行わない運用とすること。","人間がモデルの学習データを手作業で入力すること。","人間が閲覧するだけで、判断を変更する権限は持たないこと。","重要な判断で、人間がAIの出力をレビューし、必要に応じて覆せる仕組みを設けること。"],"correctIndex":3,"explanations":["× これは人間が関与しない完全自動化であり、逆の設計である。","× データ入力と判断への関与は別である。","× 覆す権限がなければ、実効的な監督にならない。","○ 最終判断や例外処理に人間が関与することで、AIの誤りや想定外の事態に対処できる。"]},{"id":"aaia-138","type":"mc","chapterIndex":8,"stem":"自動化バイアス（automation bias）の説明として最も適切なものはどれか。","options":["AIが人間の提案を一切受け付けなくなり、人間の判断が完全に排除されてしまう、システムの仕様上の欠陥を指す概念で、運用の設計段階で必ず対策すべきもの。","学習データの偏りが、モデルに引き継がれ、その結果として運用上の判断も偏ってしまうことで、データの収集段階から偏りを除去する必要があるとされる問題。","人間がAIの提案を過度に信頼し、自ら検証せずに受け入れてしまう傾向。","業務を自動化することで、コストが削減されること。"],"correctIndex":2,"explanations":["× これは人間側の傾向ではなくシステムの仕様の話である。","× これはデータバイアスで、自動化バイアスとは別の概念である。","○ レビュー担当者が形式的に承認するだけになると、人による監督が機能しなくなる。","× 効果の話であり、バイアスの説明ではない。"]},{"id":"aaia-139","type":"mc","chapterIndex":8,"stem":"AIモデルの運用状況を継続的に把握するための指標（KPI/KRI）として、最も適切な組合せはどれか。","options":["モデルの学習に使ったサーバーの稼働年数や、そのサーバーの購入時期、保守契約の内容、保管場所の一覧などを、毎月の運用報告の中心的な指標として管理すること。","精度、データドリフトの指標、公平性の指標、苦情件数、およびしきい値超過時のエスカレーション基準。","開発チームの人数、チームの年齢構成、勤務の形態、担当者ごとの経験年数などを、運用の状態を示す指標として毎月報告すること。","導入時の精度のみを記録し、以後は測定しないことで、運用コストを抑えつつ一定の品質を維持できるとする考え方を、運用の基本方針として採用すること。"],"correctIndex":1,"explanations":["× 稼働年数はAIの性能やリスクを示す指標にならない。","○ 性能・分布・公平性・利用者の声を継続的に計測し、基準を超えたら対応する枠組みが必要である。","× 人数は、運用の状態を示す指標にならない。","× 運用中に変動するため、継続的な測定が必要である。"]},{"id":"aaia-140","type":"mc","chapterIndex":8,"stem":"融資審査AIの承認率を属性グループ別に分析したところ、特定のグループで承認率が著しく低かった。監査人が最も懸念すべき点はどれか。","options":["グループ間の差に対する正当な業務上の根拠が示されておらず、不公平な取扱い（差別）にあたるおそれがあること。","承認率の集計に使った表計算ソフトのバージョンが古いこと。","全体の平均承認率が高いので、特定グループの差は偶然として扱い、調査は不要とすること。","分析結果が図表で表現されていること。"],"correctIndex":0,"explanations":["○ 格差が説明できない場合、法的・評判上のリスクに加え、モデルの偏りを疑って原因を調査すべきである。","× 集計ツールの版数は、格差の妥当性を左右する中心的な論点ではない。","× 平均が高くても、特定グループへの不利益は隠れうる。","× 表現方法はリスクの本質ではない。"]},{"id":"aaia-141","type":"mc","chapterIndex":8,"stem":"説明可能性の手法であるSHAPの説明として、最も適切なものはどれか。","options":["学習データを暗号化して保護する手法。","モデルの学習時間を短縮する最適化の手法。","個人を特定できる情報を自動で削除し、予測の根拠を隠してしまう匿名化の手法であり、説明可能性を損なわずに個人情報の保護を図る目的で広く利用されるもの。","ゲーム理論のシャープレイ値に基づき、各特徴量が予測にどれだけ寄与したかを示す手法。"],"correctIndex":3,"explanations":["× 暗号化ではなく、予測の根拠を説明する手法である。","× 学習の高速化ではなく、事後的な説明の手法である。","× 匿名化の手法ではない。","○ 個々の予測に対する説明と、全体的な特徴量の重要度の把握の両方に利用できる。"]},{"id":"aaia-142","type":"mc","chapterIndex":8,"stem":"説明可能性の手法であるLIMEの説明として、最も適切なものはどれか。","options":["モデル全体を単一の数式に置き換えて、すべての予測の結果を保証し、個別の予測についても、その理由を完全に確定させることができる手法。","個別の予測の周辺で、複雑なモデルを単純で解釈しやすいモデルで近似して説明する局所的な手法。","データベースへの不正アクセスを検知し、利用者の操作ログを一定期間ごとに分析して、異常な操作を自動的に遮断する、セキュリティ監視のための手法。","モデルの公平性を自動的に回復させる手法。"],"correctIndex":1,"explanations":["× LIMEは局所的な近似であり、全体を保証するものではない。","○ LIMEは1件の予測について近似モデルで根拠を示す。モデル全体の振る舞いの説明には向かない。","× セキュリティ監視の手法ではない。","× LIMEは説明の手法で、公平性の是正を自動で行うものではない。"]},{"id":"aaia-143","type":"mc","chapterIndex":8,"stem":"生成AIのハルシネーション（hallucination）への対策として、監督の観点から最も適切なものはどれか。","options":["生成AIの出力は常に正確なので、どのような用途でも検証は不要であり、利用者は出力をそのまま業務の成果物として提出してよいと整理すること。","利用者にハルシネーションを禁止する通知を表示し、出力の内容は利用者の判断で自由に業務へ使ってよいこととすれば、統制として十分であるとみなす。","出典に基づく回答（RAGなど）を活用し、重要な用途では人間によるレビューと出力のサンプリング検査を行う。","出力が長く、詳しく書かれているほど信頼できると判断し、その基準に従って、業務で使う回答を選ぶ運用とし、検証は省略する。"],"correctIndex":2,"explanations":["× 生成AIは事実と異なる内容をもっともらしく出力することがある。","× 通知だけでは出力の誤りを防げない。","○ 誤情報の混入は避けられないため、根拠の提示と人による確認を組み合わせた統制が有効である。","× 長さと正確さに関係はない。"]},{"id":"aaia-144","type":"mc","chapterIndex":8,"stem":"AIによる自動的な判断が個人に重大な影響を与える場合（例：ローンの拒否）に、組織が整備すべきものとして最も適切なものはどれか。","options":["判断の理由の説明と、異議申立てや人間による再審査を求める手段。","AIの判断は最終的なものとし、申立ては受け付けない。","判断の理由は社外秘として開示しない。","苦情は年に一度まとめて対応する。"],"correctIndex":0,"explanations":["○ 個人の権利利益に重大な影響がある判断には、説明可能性と救済手段の提供が重要である。","× 救済手段のない運用は、法令や公正性の観点から問題がある。","× 合理的な範囲での説明は求められる。","× 遅い対応は、被害の拡大を招く。"]},{"id":"aaia-145","type":"mc","chapterIndex":1,"stem":"AIに関するリスク、統制、手順、判断の「所有者（オーナー）」の定義に関する評価として、最も適切なものはどれか。","options":["AIは自律的に動作するため、責任者は不要である。","AIシステムごとに責任者が明確に定められ、文書化されていること。","責任者は、問題が発生した後に決めればよい。","開発ベンダーが責任をすべて負うため、自社に責任者は置かず、運用中に問題が起きた場合もベンダーへの連絡のみで対応が完結すると整理すること。"],"correctIndex":1,"explanations":["× AIを使う組織の責任は消えない。","○ 責任の所在が曖昧だと、問題が起きたときの対応や改善が滞る。オーナーを明確にしておくべきである。","× 事前に定めなければ、初動が遅れる。","× ベンダー任せにしても、自社の説明責任は残る。"]},{"id":"aaia-146","type":"mc","chapterIndex":8,"stem":"モデルのドリフトが検知された後の対応として、監査人が確認すべき最も適切な事項はどれか。","options":["検知結果は、担当者の記憶にとどめておけばよい。","ドリフトは時間の経過とともに自然に収束するため、対応は不要であり、利用者への影響が出ない限り、監視の結果や原因の調査を行わずに放置して問題ない。","ドリフトの検知ツールを停止して、アラートの件数を減らし、担当者が通常業務に集中できる環境を優先する。","しきい値超過時の対応手順（調査・再学習・停止など）が定義され、実際に実行された記録があること。"],"correctIndex":3,"explanations":["× 記録がなければ、対応状況を検証できない。","× 放置すると性能低下が続くおそれがある。","× 監視を止めるのは、リスクを見えなくするだけである。","○ 検知するだけでなく、対応の基準と実施が伴って初めて統制が機能する。"]},{"id":"aaia-147","type":"mc","chapterIndex":10,"stem":"生成AIのガードレール（guardrails）の説明として、最も適切なものはどれか。","options":["不適切・有害・機密を含む入出力を検出して制限するなど、AIの振る舞いを安全な範囲に収めるための仕組み。","生成AIの応答速度を向上させ、利用者の待ち時間を短くするためのキャッシュ機構を導入し、これにより安全性の確保も同時に実現されるとする考え方。","学習データの量を増やすための収集計画を毎年立て直し、収集したデータを大量に学習させて、AIの振る舞いを安全な範囲に収める方針を整えること。","モデルの著作権を登録する制度で、登録によって、生成されたすべての出力の安全性が法的に保証されるとされる、国の認定制度の一つ。"],"correctIndex":0,"explanations":["○ 入力と出力をフィルタリング・検査することで、リスクのある内容の流通を抑える。","× 速度改善の仕組みであり、安全のための統制ではない。","× データ収集計画ではなく、運用時の安全策である。","× 制度ではなく技術・運用上の仕組みである。"]},{"id":"aaia-148","type":"mc","chapterIndex":8,"stem":"ベンダー提供のAIモデルは内部が不透明（ブラックボックス）である。この場合の監督として最も適切なものはどれか。","options":["内部が不透明なため、監督は不可能であり、検証は一切行わない。","ウェブの宣伝文句と公開数値を確認するだけで、契約による監査権の要求は不要とする。","契約で監査権や性能報告を求めるとともに、自社で出力を基にした独自のモニタリングを行う。","利用者からの苦情が来るまで、特に対応しない。"],"correctIndex":2,"explanations":["× 出力ベースの検証など、実施できる統制はある。","× 宣伝は検証の根拠にならない。","○ 内部が見えなくても、入力と出力の観察と契約上の権利により、一定の監督は可能である。","× 受け身の姿勢では、問題の早期発見ができない。"]},{"id":"aaia-149","type":"mc","chapterIndex":9,"stem":"不正取引が全体の0.5%しか存在しないデータで、不正検知モデルの正解率（accuracy）が99.5%だった。監査人の見解として最も適切なものはどれか。","options":["正解率が99.5%なので、モデルは十分に高性能である。","すべてを「正常」と予測するだけでも達成できる数値であり、再現率（recall）や適合率などを確認する必要がある。","正解率が高いほど、再現率も必ず高くなる。","テスト結果は、正解率だけを報告すれば十分とし、報告の簡潔さを優先して、再現率や適合率の詳細は付録にも記載せず、説明の資料からも省くことを基本方針とする。"],"correctIndex":1,"explanations":["× 不均衡なデータでは、高い正解率は検出能力を意味しない。","○ 不均衡データでは正解率は誤解を招く。不正を実際に検出できたかを示す指標で評価すべきである。","× 両者は必ずしも連動しない。","× 単一指標では偏りを見落とす。"]},{"id":"aaia-150","type":"mc","chapterIndex":9,"stem":"過学習（overfitting）を検知するための最も適切な方法はどれか。","options":["学習データでの性能と、学習に使っていないデータでの性能を比較し、乖離を確認する。","学習データでの精度が高ければ、モデルは未知のデータでも同等の性能を発揮すると判断し、学習データの結果だけで合否を決め、追加の検証は不要とする。","学習データの量を減らして、結果を比べる。","モデルの名称や開発の時期、担当者の経歴などを参考にして、過学習の有無を推測し、その推測に基づいて検証の範囲を決めることとする。"],"correctIndex":0,"explanations":["○ 学習時に高く未知データで低い場合、過学習が疑われる。","× 学習データの精度だけでは汎化性能を判断できない。","× データ量を減らしても、過学習の検知にならない。","× 名称は性能と無関係である。"]},{"id":"aaia-151","type":"mc","chapterIndex":9,"stem":"AIに対するレッドチーミング（red teaming）の説明として、最も適切なものはどれか。","options":["モデルの学習データを大量に収集するための活動を、外部の業者に委託して、データの量を増やし、学習の精度を高めるための作業を行うこと。","モデルの精度を高めるために、学習データの量を増やし、ハイパーパラメータを系統的に探索して最適な組合せを選ぶ作業を行うこと。","ユーザー向けのマニュアルを作成し、操作手順と注意事項をまとめて配布する作業を行うこと。","攻撃者の視点で、意図的に誤動作や有害な出力を引き出して脆弱性を発見するテスト。"],"correctIndex":3,"explanations":["× レッドチーミングはデータ収集ではなく、攻撃的な観点のテストである。","× 性能改善の手法ではなく、安全性の検証である。","× 文書作成ではなく、脆弱性を探すテストである。","○ 想定外の入力や悪用を試みることで、通常のテストでは見つからない問題を洗い出す。"]},{"id":"aaia-152","type":"mc","chapterIndex":9,"stem":"再現率（recall）の定義として、最も適切なものはどれか。","options":["陽性と予測したもののうち、実際に陽性だった割合。","全データのうち、正しく分類できたものの割合。","実際に陽性であるもののうち、モデルが正しく陽性と検出できた割合。","陽性と陰性の数が等しいデータの比率。"],"correctIndex":2,"explanations":["× これは適合率（precision）の定義である。","× これは正解率（accuracy）の定義である。","○ 見逃しの少なさを示す指標であり、不正や疾病の検出などで重視される。","× データの均衡を示す概念であり、再現率の定義ではない。"]},{"id":"aaia-153","type":"mc","chapterIndex":9,"stem":"新しいAIモデルを、本番と並行して稼働させるが、その出力は実際の意思決定には使わず結果を比較する検証手法を何というか。","options":["シャドウ運用（shadow mode）","本番に一括で切り替え、旧モデルを即座に廃止する方式（ビッグバン移行）","過学習を抑えるため正則化を使う。","旧モデルを即座に廃棄する手続き"],"correctIndex":0,"explanations":["○ 実際の影響を与えずに、本番データで新モデルの挙動を検証できる。","× 一括切替は、検証なしに全面移行する方法である。","× 誤り。正則化は過学習を抑える手法であり、並行稼働で結果を比較する検証手法の名称ではない。","× 誤り。旧モデルの廃棄手続きは移行後の運用の話で、並行稼働の検証手法の名称ではない。"]},{"id":"aaia-154","type":"mc","chapterIndex":9,"stem":"信用スコアリングモデルの安定性を、過去のデータで検証したい。適切なテスト技法はどれか。","options":["学習データのみで精度を測定する","モデルの画面デザインや操作性を利用者の好みに合わせて確認し、そのうえで安定性を評価する方法を用いることで、モデル性能の検証を兼ねる。","バックテスト（過去の時点のデータを用いて、モデルの予測と実際の結果を比較する）","担当者の経験に基づく感覚で判断し、過去の実績や数値の記録は参照せずに、その時点の印象をもとに安定性を評価する方法を採る。"],"correctIndex":2,"explanations":["× 学習データでの測定は、汎化性能を示さない。","× モデル性能の検証ではない。","○ 過去データで予測精度や安定性を事後的に検証できる。","× 客観的な根拠がなく、検証にならない。"]},{"id":"aaia-155","type":"mc","chapterIndex":9,"stem":"モデルを更新した後に、既存の機能や性能が維持されていることを確認するテストを何というか。","options":["負荷テストを、利用者の数が急増した場合の処理能力の検証のみに限定し、既存の機能や性能の維持は確認の対象としないこと。","回帰テスト（regression testing）","ユーザーの好みを調べる市場調査を、モデル更新の前後に毎回実施し、利用者の満足度の変化を追跡すること。","ペネトレーションテストのみを実施し、既存機能や性能の維持については、別途テストを行わなくても問題ない方式を採用すること。"],"correctIndex":1,"explanations":["× 負荷テストは処理能力の検証で、既存性能の維持の確認とは異なる。","○ 変更により既存の動作が悪化していないかを確認するテストである。","× 市場調査はテストではない。","× セキュリティ検証であり、機能の維持確認の主目的とは異なる。"]},{"id":"aaia-156","type":"mc","chapterIndex":9,"stem":"AIの頑健性（robustness）テストとして、最も適切なものはどれか。","options":["モデルの学習データだけで、再度精度を測る。","利用者の数が増えた場合の画面表示と、負荷時の応答時間を確認する。","入力に、常に理想的なデータだけを与えて、精度が安定しているかを確認する。","入力にノイズや欠損を加えたり、分布外のデータを与えたりして、性能の低下が許容範囲に収まるかを確認する。"],"correctIndex":3,"explanations":["× 既知のデータでは、頑健性を評価できない。","× 画面表示の確認は、モデルの頑健性とは別である。","× 理想的な入力だけでは、現実の乱れに対する耐性が分からない。","○ 想定外の入力に対する安定性を確認する。"]},{"id":"aaia-157","type":"mc","chapterIndex":9,"stem":"AIの公平性テストとして、最も適切な方法はどれか。","options":["全体の平均精度だけを確認する。","属性別の分析は行わず、開発者の印象で判断する。","属性別に、承認率や誤検知率などの指標を比較し、差が許容範囲かを確認する。","利用者数が多く、サービスの利用者が幅広い層に広がっていれば、公平性はおおむね確保されているとみなすことができ、属性別の分析や指標の比較を省略してよいとする。"],"correctIndex":2,"explanations":["× 平均は集団間の差を隠す。","× 客観的な根拠がない。","○ グループ間の結果の差を定量的に比較することで、不公平を発見できる。","× 利用者数は公平性を保証しない。"]},{"id":"aaia-158","type":"mc","chapterIndex":9,"stem":"AIモデルのテストデータに求められる条件として、最も重要なものはどれか。","options":["本番で想定される母集団を代表し、学習データとは独立していること。","学習データと全く同じ内容のデータであり、評価を行う前に学習に使ったサンプルを確実に含めておくことが必要であること。","できるだけ小さいデータ量であること。","性能が良く出るデータだけを選んだものであり、評価の結果が一定の基準を満たすように、データの選択を担当者の判断で調整してよいこと。"],"correctIndex":0,"explanations":["○ 代表性と独立性があって初めて、本番での性能を適切に推定できる。","× 同一データでは、汎化性能を測れない。","× 少なすぎると統計的に信頼できない。","× 恣意的な選択は、評価の信頼性を損なう。"]},{"id":"aaia-159","type":"mc","chapterIndex":9,"stem":"AIのテストで、合否の基準（受入基準）を事前に定義しておく理由として、最も適切なものはどれか。","options":["基準を決めなければ、テストを実施できないという技術的制約があるため、テストの前に必ず基準を定めて、その後の変更は認めないこととしているから。","基準を決めると、モデルの精度が自動的に向上し、その後の運用でも性能が低下しないことが保証されるため、基準の設定を最優先の作業と位置づけている。","基準を定めると、テストの費用が必ず削減されるため、担当者の作業時間も短くなり、全体の予算も大きく減らせることが期待できるから。","結果を見てから恣意的に基準を変えることを防ぎ、客観的な合否判断を可能にするため。"],"correctIndex":3,"explanations":["× 技術的制約ではなく、統制上の理由である。","× 基準を設けるだけでは精度は向上しない。","× 費用削減が目的ではない。","○ 事前の基準があれば、承認の根拠が明確になる。"]},{"id":"aaia-160","type":"mc","chapterIndex":9,"stem":"LLMの評価に使うベンチマークについて、監査人が留意すべき点として最も適切なものはどれか。","options":["公開ベンチマークの得点が高ければ、あらゆる業務で安全に使える。","ベンチマークの問題が学習データに含まれている可能性（汚染）があり、実業務に即した独自の評価も併用すべきである。","ベンチマークの得点は、モデルの大きさだけで決まる。","評価は自動評価のスコアのみに限り、人間による評価や実業務に即した検証は行わなくてよい。"],"correctIndex":1,"explanations":["× ベンチマークは限定的な能力しか測定しない。","○ 公開ベンチマークの高得点だけでは、自社の用途での品質や安全性は保証できない。","× モデルの大きさだけで得点が決まるわけではない。","× 人手の評価も重要な手段である。"]},{"id":"aaia-161","type":"mc","chapterIndex":10,"stem":"OWASPのLLMアプリケーション向けTop 10で第1位（LLM01）に挙げられているプロンプトインジェクションの説明として、最も適切なものはどれか。","options":["モデルの学習用データを大量に収集し、利用者の同意を得ずに学習させる正当な手法。","ネットワークの帯域を増強するための設定。","悪意のある入力によって、LLMに開発者が意図しない指示を実行させたり、振る舞いを操作したりする攻撃。","モデルの出力を自動的に翻訳し、利用者の母国語で回答を表示する機能で、入力された質問の言語を自動判定して、その結果を後続の処理にそのまま渡す仕組み。"],"correctIndex":2,"explanations":["× 攻撃であり、正当なデータ収集の手法ではない。","× ネットワーク設定の話ではない。","○ 対策として、入力・出力の検証、権限の最小化、外部の指示と信頼できる指示の分離などが挙げられる。","× 出力を翻訳する機能の説明であり、攻撃の定義ではない。"]},{"id":"aaia-162","type":"mc","chapt
