源の過剰な割当てを避けつつ、クリティカルチェーンなどの方法で期間を見直す。","資源の制約は、作業の期間を延ばさずに、資源の数を無制限に増やして対応する。"],"correctIndex":2,"explanations":["× 誤り。資源の制約を無視すると、実行できない計画になる。","× 誤り。計画の段階で考慮しないと、実行時に無理が生じる。","○ 正しい。資源制約を考慮し、過剰な割当てを避けて期間を見直す。","× 誤り。資源を無制限に増やすことは、現実的な対応ではない。"]},{"id":"pmp-126","type":"mc","chapterIndex":1,"stem":"品質のコストの分類として最も適切なものはどれか。","options":["検査の費用だけを含み、予防の費用は含まない。","失敗が発生した後の費用だけを指し、予防や評価の費用は対象外とし、顧客への補償の費用だけを集計する。","顧客の満足度を金額で示したものであり、コストの分類には使わず、品質の評価にも用いず、報告書にも記載しない。","予防、評価、失敗のコストに分けられ、予防と評価に投資することで失敗のコストを減らす。"],"correctIndex":3,"explanations":["× 誤り。予防の費用も品質のコストに含まれる。","× 誤り。予防や評価の費用も、品質のコストの対象である。","× 誤り。品質のコストの分類は、顧客満足の金額換算とは異なる。","○ 正しい。予防、評価、失敗のコストに分け、予防と評価で失敗を減らす。"]},{"id":"pmp-127","type":"mc","chapterIndex":1,"stem":"調達で複数の売手から見積りを取得する目的として最も適切なものはどれか。","options":["複数の見積りを比較して価格と能力を比べ、公平で根拠のある売手の選定につなげる。","見積りを一社だけから取得し、比較は行わずに決めることで、選定の時間を短縮し、手続の負担も減らす。","見積りの取得は、契約の締結の後に行い、選定の判断には用いず、記録も残さず、関係者の承認も得ず、評価の結果も残さない。","見積りは売手の要望どおりに決めるため、比較の対象にはせず、買手の予算との照合も行わない。"],"correctIndex":0,"explanations":["○ 正しい。複数の見積りを比較して、公平で根拠のある選定につなげる。","× 誤り。一社だけでは比較ができず、選定の根拠を示せない。","× 誤り。締結後の見積りでは、選定の判断に使えない。","× 誤り。売手の要望だけで決めると、比較による公平な選定を損なう。"]},{"id":"pmp-128","type":"mc","chapterIndex":1,"stem":"ハイブリッド型で、変更への対応の方法として最も適切なものはどれか。","options":["すべての変更を予測型の方法だけで統制し、アジャイルの柔軟性は使わない。","予測型の部分は変更管理委員会で統制し、アジャイルの部分はバックログの優先順位で柔軟に対応するなど、両方の方法を組み合わせる。","すべての変更をアジャイルの方法だけで決め、予測型の統制は行わない。","変更は、プロジェクトの途中で一切受け付けず、最後まで計画を変えない。"],"correctIndex":1,"explanations":["× 誤り。予測型だけでは、アジャイルの部分の柔軟性を活かせない。","○ 正しい。両方の方法を組み合わせ、部分ごとに適切な統制と柔軟性を使う。","× 誤り。アジャイルだけでは、予測型の部分の統制が失われる。","× 誤り。途中の変更を受け付けないと、適応の要素を持たない。"]},{"id":"pmp-129","type":"mc","chapterIndex":1,"stem":"教訓の文書化に含めるべき内容として最も適切なものはどれか。","options":["担当者の評価だけを記載し、プロジェクトの要因や問題への対応は記載せず、次のプロジェクトで参照できる形にもせず、関係者の評価も含めない。","完了後の一般的な感想だけを記載し、具体的な事例は含めず、数値の根拠も示さない。","成功や失敗の要因、問題とその対応、効果的だった方法、改善の提案を整理し、次のプロジェクトで参照できる形にする。","外部に公開することを前提とし、社内では参照しないようにする。"],"correctIndex":2,"explanations":["× 誤り。担当者の評価だけでは、プロジェクトの要因の学習にならない。","× 誤り。具体的な事例がないと、次の参考にならない。","○ 正しい。要因、問題と対応、効果的な方法、改善案を整理して参照できる形にする。","× 誤り。社内で参照できないと、組織の学習につながらない。"]},{"id":"pmp-130","type":"mc","chapterIndex":1,"stem":"スケジュールを短縮するクラッシングの特徴として最も適切なものはどれか。","options":["作業を並行させて期間を短縮する方法であり、コストは増加せず、手戻りのリスクも生じない。","クリティカルでない作業を削減して期間を短縮する方法であり、クリティカルパスの作業には影響せず、品質への影響も確認しない。","品質の基準を下げることで作業期間を短縮する方法であり、品質の確認も省くため、顧客の満足度は問わない。","資源やコストを追加して作業期間を短縮する方法であり、コストが増加する一方、期間を短縮できる。"],"correctIndex":3,"explanations":["× 誤り。作業の並行はファストトラッキングの特徴で、クラッシングとは異なる。","× 誤り。クリティカルでない作業の削減は、期間の短縮につながらない。","× 誤り。品質の基準を下げる方法は、クラッシングの手法ではない。","○ 正しい。クラッシングは資源やコストを追加して期間を短縮する方法である。"]},{"id":"pmp-131","type":"mc","chapterIndex":1,"stem":"会議の運営を効率的に行うための方法として最も適切なものはどれか。","options":["会議の目的とアジェンダを事前に共有し、決定事項と担当者を記録して、次の行動につなげる。","会議では目的を定めず、参加者が自由に話すことで、決定事項は後から決め、記録も残さず、参加者の役割も決めない。","会議の記録は必要な時にだけ作成し、決定事項は口頭で伝えるだけにして、担当者も明確にせず、次回の日程も決めない。","参加者の人数を最大にし、全員に発言の機会を与えて、結論は出さず、次の行動も決めず、時間の管理も行わない。"],"correctIndex":0,"explanations":["○ 正しい。目的とアジェンダの共有、決定と担当の記録で、次の行動につなげる。","× 誤り。目的がないと、議論が拡散し、決定ができない。","× 誤り。記録がないと、決定事項の実行が確認できない。","× 誤り。結論を出さない会議は、プロジェクトの判断に寄与しない。"]},{"id":"pmp-132","type":"mc","chapterIndex":1,"stem":"統計的プロセス管理（SPC）の考え方として最も適切なものはどれか。","options":["工程の変動は、すべて特殊原因として扱い、統計的な判断は行わない。","管理図を用いて工程の変動を監視し、偶然原因と特殊原因を区別して、工程の安定性を確保する。","工程の変動は、検査の結果だけを見て判断し、工程の推移は監視しない。","工程の安定性は作業者の経験だけに依存するため、統計の手法は用いない。"],"correctIndex":1,"explanations":["× 誤り。変動を一律に特殊原因とみなすと、不要な対応が増える。","○ 正しい。管理図で変動を監視し、偶然と特殊の原因を区別して安定性を確保する。","× 誤り。工程の推移を監視しないと、変動の傾向を捉えられない。","× 誤り。経験だけに依存すると、工程の安定性を客観的に示せない。"]},{"id":"pmp-133","type":"mc","chapterIndex":1,"stem":"スコープのクリープ（範囲の拡大）を防ぐための方法として最も適切なものはどれか。","options":["顧客の要望を最大限に取り込むことで防ぎ、変更は歓迎して、範囲の拡大による影響は後から評価し、要望の数に上限を設けず、すべて受け入れる。","担当者の判断で要望を受け入れ、記録は後でまとめて行う。","スコープ記述書とWBSを基準にして、変更要求を変更管理プロセスで審議し、承認された変更だけを反映する。","プロジェクトの完了後に防げばよく、実行中は範囲の変更を受け付けず、対応も行わない。"],"correctIndex":2,"explanations":["× 誤り。要望を無条件に取り込むと、範囲が際限なく拡大する。","× 誤り。担当者の判断と後の記録では、統制が効かない。","○ 正しい。基準を定め、変更を審議して承認されたものだけを反映すると、範囲の拡大を防げる。","× 誤り。実行中に対応しないと、範囲の拡大が進んでしまう。"]},{"id":"pmp-134","type":"mc","chapterIndex":1,"stem":"プロセスの改善計画を立てる目的として最も適切なものはどれか。","options":["プロセスの改善は、プロジェクトの完了後に行うべきであり、現在の作業には適用せず、次のプロジェクトでも検討しない。","プロセスの改善は、既存のプロセスを維持することを目的とし、変更は行わない。","プロセスの改善は、担当者の個人の作業だけを対象とし、プロセス全体は対象外とし、組織の方針とも切り離して進める。","プロセスの課題を特定し、改善の目標と手順を定めて、現在の作業や次のプロジェクトの効率と品質を高める。"],"correctIndex":3,"explanations":["× 誤り。改善は現在の作業にも適用して、効果を得る必要がある。","× 誤り。維持だけでは、改善の目的を果たせない。","× 誤り。プロセス全体を対象としないと、改善の効果が限られる。","○ 正しい。課題を特定し、改善の目標と手順を定め、効率と品質を高める。"]},{"id":"pmp-135","type":"mc","chapterIndex":2,"stem":"戦略との整合について、最も適切なものはどれか。","options":["プロジェクトの目標は担当部門が決め、戦略との整合は完了後に確認すれば十分である。","戦略目標との整合を定期的に確認する。","戦略目標は経営層だけが把握すればよく、プロジェクトチームへの共有は必要ない。","プロジェクトの目標は個別の成果物を基準に決め、組織の戦略目標とは切り離して管理する。"],"correctIndex":1,"explanations":["× 誤り。戦略との整合を完了後に確認すると、投資の優先順位の誤りを早期に防げない。","○ 正しい。戦略目標との整合は、プロジェクトの方向性を保つため定期的に確認する。","× 誤り。戦略目標を一部の経営層に閉じると、チームの判断が戦略からずれる。","× 誤り。成果物だけを基準にすると、組織の戦略への貢献を評価できない。"]},{"id":"pmp-136","type":"mc","chapterIndex":2,"stem":"ベネフィットの管理として、最も適切なものはどれか。","options":["成果は完了後にまとめて確認すれば十分である。","ベネフィットの実現状況を、定めた測定指標で定期的に確認し、必要に応じて計画を見直す。","ベネフィットは測定しなくてよい。","成果の確認は担当者の感覚に任せる。"],"correctIndex":1,"explanations":["× 誤り。完了後だけの確認では、途中での軌道修正ができない。","○ 正しい。ベネフィットは測定指標で継続的に確認し、計画の見直しにつなげる。","× 誤り。測定しないと、投資の成果が得られたかを判断できない。","× 誤り。主観だけでは、成果を客観的に評価できない。"]},{"id":"pmp-137","type":"mc","chapterIndex":2,"stem":"ビジネスケースの扱いとして、最も適切なものはどれか。","options":["ビジネスケースは承認の時点で一度作成すれば、以後は内容を変えずに使い続けることが望ましい。","一度作成すれば、以後の見直しは不要である。","承認が得られれば、更新は不要になる。","ビジネスケースを更新し、投資を継続する根拠として使う。"],"correctIndex":3,"explanations":["× 誤り。環境や前提が変われば、ビジネスケースは見直して更新する必要がある。","× 誤り。一度作成しただけでは、前提の変化に対応できない。","× 誤り。承認後もベネフィットの確認に用いるため、不要にはならない。","○ 正しい。ビジネスケースは投資継続の判断根拠として、定期的に更新して用いる。"]},{"id":"pmp-138","type":"mc","chapterIndex":2,"stem":"規制やコンプライアンスへの対応として、最も適切なものはどれか。","options":["規制の要求事項は、法務部門の承認を得た後に、各プロジェクトの担当者が個別に判断して対応方法を決めればよい。","規制は確認せず、現場任せでよい。","要求事項を一覧にし、対応状況を確認する。","規制対応は、問題が発生した時点で事後的に行えば十分であり、事前の一覧化や確認までは不要である。"],"correctIndex":2,"explanations":["× 誤り。担当者任せでは、要求事項の抜け漏れを防げない。","× 誤り。規制を確認しないと、違反のリスクを把握できない。","○ 正しい。要求事項を一覧にし、対応状況を確認することで抜け漏れを防げる。","× 誤り。事後対応だけでは、違反による損害や信頼の低下を防げない。"]},{"id":"pmp-139","type":"mc","chapterIndex":2,"stem":"プロジェクトのガバナンスについて、最も適切なものはどれか。","options":["権限は現場の判断に任せ、ガバナンス体制は必要が生じた時点で整備すれば十分とする。","ガバナンス体制と権限を明確にする。","ガバナンスは経営層が個別の案件ごとに都度決めるもので、事前の体制整備は不要である。","ガバナンスは監査部門だけの役割として位置づけ、プロジェクトチームは関与しなくてよい。"],"correctIndex":1,"explanations":["× 誤り。権限を現場任せにすると、重要な判断の責任の所在があいまいになる。","○ 正しい。権限と責任を明確にすることは、ガバナンスの基本である。","× 誤り。事前に体制を整えないと、案件ごとの判断が一貫しなくなる。","× 誤り。ガバナンスは組織全体で担うもので、監査部門だけの役割ではない。"]},{"id":"pmp-140","type":"mc","chapterIndex":2,"stem":"組織の変革管理として、最も適切なものはどれか。","options":["変更を受け入れる組織の準備状況を評価し、必要な研修と支援を計画に含める。","変更は現場が自然に受け入れるため、準備は不要である。","変更の準備は、変更が始まった後に行えば十分である。","組織は変更に抵抗しないため、支援は必要ない。"],"correctIndex":0,"explanations":["○ 正しい。準備状況を評価し、研修や支援を計画に含めることで、変革が定着しやすくなる。","× 誤り。現場が自然に受け入れるとは限らず、準備を省くと抵抗が生じやすい。","× 誤り。変更の後に準備しても、混乱を防ぎにくい。","× 誤り。変更には抵抗が生じることが多く、支援を省くべきではない。"]},{"id":"pmp-141","type":"mc","chapterIndex":2,"stem":"外部環境の把握として、最も適切なものはどれか。","options":["市場や規制の変化は、プロジェクトの範囲に直接関係する場合にのみ確認すればよく、戦略とは切り離して扱うべきである。","外部環境は確認せず、社内情報だけで判断する。","変化は事後に把握すれば足りる。","市場や規制の変化を定期的に把握し、戦略に反映する。"],"correctIndex":3,"explanations":["× 誤り。外部環境を戦略と切り離すと、変化への対応が遅れる。","× 誤り。外部環境を確認しないと、事業機会や脅威を把握できない。","× 誤り。事後に把握するだけでは、戦略の見直しが間に合わない。","○ 正しい。外部環境の変化を定期的に把握し、戦略に反映することが求められる。"]},{"id":"pmp-142","type":"mc","chapterIndex":2,"stem":"利益の管理として、最も適切なものはどれか。","options":["利益の見込みは、投資を承認した時点の数値だけで判断し、以後の実績との比較は必要に応じて行えばよい。","利益は確認せず、投資を進めてよい。","コストとベネフィットの両面から、利益の見込みを定期的に評価する。","利益の管理は、会計部門が年度末にまとめて行えば足り、プロジェクトの途中で評価する必要はない。"],"correctIndex":2,"explanations":["× 誤り。承認時点の数値だけでは、実績との乖離を把握できない。","× 誤り。利益を確認しないと、投資の是非を判断できない。","○ 正しい。コストとベネフィットを定期的に評価すると、利益の見込みの変化を把握できる。","× 誤り。途中で評価しないと、問題の早期発見が遅れる。"]},{"id":"pmp-143","type":"mc","chapterIndex":2,"stem":"法規制への対応として、最も適切なものはどれか。","options":["法規制の要件は、リリースの直前にまとめて確認すれば、通常の品質確認で十分にカバーできる。","法規制の要件を確認する。","法規制は、担当部門が過去の事例をもとに判断し、外部の専門家に確認する必要はない。","法規制の要件は、プロジェクトの範囲外として、関係部門の判断に任せて問題ないとする。"],"correctIndex":1,"explanations":["× 誤り。直前の確認では、設計段階での要件の見落としを防げない。","○ 正しい。法規制の要件を早い段階で確認することは、対応の基本である。","× 誤り。過去の事例だけでは、改正後の要件を把握できない。","× 誤り。関係部門任せにすると、組織全体の責任があいまいになる。"]},{"id":"pmp-144","type":"mc","chapterIndex":2,"stem":"組織変革への対応として、最も適切なものはどれか。","options":["変革の影響を受ける人々に、目的と影響を早期に説明し、意見を反映する場を設ける。","変革の内容は、関係者へ直前に伝えれば十分である。","変革は経営層だけで決めるため、現場への説明は不要である。","説明は文書の配布だけで足りるため、対話の場は設けなくてよい。"],"correctIndex":0,"explanations":["○ 正しい。早期に説明し意見を反映すると、変革への理解と協力が得られやすくなる。","× 誤り。直前の伝達では、準備や理解の時間が不足する。","× 誤り。現場への説明を省くと、変革への抵抗が強まりやすい。","× 誤り。一方向の配布だけでは、疑問や懸念を把握できない。"]},{"id":"pmp-145","type":"mc","chapterIndex":2,"stem":"PMOの役割として、最も適切なものはどれか。","options":["PMOは、各プロジェクトの進捗報告を受けるだけの事務機能とし、優先順位や資源配分の判断には関与させないことが望ましい。","PMOは置かず、案件ごとに判断すればよい。","資源配分は各案件に任せ、全体の調整はしない。","PMOを通じて、案件の優先順位と資源配分を組織全体で調整する。"],"correctIndex":3,"explanations":["× 誤り。事務機能だけでは、組織全体での優先順位付けができない。","× 誤り。PMOがないと、案件間の調整や資源配分が分散しやすい。","× 誤り。案件ごとに任せると、組織全体の資源が最適に配分されない。","○ 正しい。PMOが優先順位と資源配分を調整することで、組織の戦略との整合を保てる。"]},{"id":"pmp-146","type":"mc","chapterIndex":2,"stem":"事業価値の定義として、最も適切なものはどれか。","options":["事業価値は、プロジェクトの完了時点で納品物の数量を数えて定義すれば十分であり、財務面や利用者への効果は考慮しなくてよい。","事業価値は測らず、納品の完了だけを確認する。","事業価値は、財務的な成果と顧客・組織への効果の両面で定義する。","事業価値の定義は、経営層の判断に委ね、プロジェクトチームは納品物の品質の確保だけに集中すべきである。"],"correctIndex":2,"explanations":["× 誤り。納品物の数量だけでは、事業への効果を示せない。","× 誤り。価値を測らないと、投資の成果を判断できない。","○ 正しい。財務面と利用者・組織への効果の両面で定義すると、価値を総合的に評価できる。","× 誤り。経営層任せにすると、チームが価値の実現に責任を持てない。"]},{"id":"pmp-147","type":"mc","chapterIndex":2,"stem":"ステークホルダーの戦略的な期待への対応として、最も適切なものはどれか。","options":["ステークホルダーの戦略的な期待は、プロジェクトの開始後に担当者が個別に確認すれば足り、開始前に整理する必要はない。","期待を整理し、合意する。","戦略的な期待は、経営層が一方的に決めるもので、現場との合意は形式的な手続きとして扱う。","期待は、関係者の立場ごとに別々に扱い、全体で共有する必要はない。"],"correctIndex":1,"explanations":["× 誤り。開始後の確認では、初期の方向性のずれを防げない。","○ 正しい。戦略的な期待を整理して合意することは、プロジェクトの方向性を揃える基本である。","× 誤り。現場との合意を形式化すると、実行段階で齟齬が生じやすい。","× 誤り。関係者間で共有しないと、期待の食い違いを解消できない。"]},{"id":"pmp-148","type":"mc","chapterIndex":2,"stem":"事業継続への対応として、最も適切なものはどれか。","options":["事業継続の要件を確認し、重要な業務の復旧目標と計画を事業戦略と整合させる。","事業継続は、災害が起きてから検討すれば足りる。","復旧目標は、担当者の判断で都度決めればよい。","事業継続は、IT部門だけの課題として扱えば十分である。"],"correctIndex":0,"explanations":["○ 正しい。事業継続の要件を戦略と整合させると、重要業務の復旧を優先的に計画できる。","× 誤り。事後に検討すると、重要業務の復旧が遅れる。","× 誤り。復旧目標が定まらないと、対応の優先順位を決められない。","× 誤り。事業全体の課題であり、IT部門だけでは対応しきれない。"]},{"id":"pmp-149","type":"mc","chapterIndex":2,"stem":"投資案件の優先順位付けとして、最も適切なものはどれか。","options":["投資案件の優先順位は、担当部門が提出した金額の大きさだけで決め、戦略への寄与は報告書の付録として扱えば十分である。","優先順位は決めず、先に着手できるものから進める。","投資は先着順で決め、戦略との関係は見ない。","投資案件の優先順位を、戦略への寄与と実現可能性で比較する。"],"correctIndex":3,"explanations":["× 誤り。金額だけでは、戦略への寄与を反映できない。","× 誤り。優先順位を決めないと、限られた資源を配分できない。","× 誤り。先着順では、戦略的に重要な案件が後回しになる。","○ 正しい。戦略への寄与と実現可能性で比較すると、投資の優先順位を合理的に決められる。"]},{"id":"pmp-150","type":"mc","chapterIndex":2,"stem":"事業上のリスクと機会の扱いとして、最も適切なものはどれか。","options":["事業上のリスクと機会は、プロジェクトの範囲内に限って評価し、戦略目標との関係は、年度の計画策定時に一度だけ確認すればよい。","リスクは評価せず、事業の判断を進める。","事業上のリスクと機会を、戦略目標に照らして定期的に評価する。","リスクは脅威としてのみ扱い、機会の評価は、利益が確定した後に行うことが望ましいとされる。"],"correctIndex":2,"explanations":["× 誤り。戦略との関係を一度だけ確認すると、環境の変化を捉えられない。","× 誤り。リスクを評価しないと、事業への影響を予見できない。","○ 正しい。戦略目標に照らして定期的に評価すると、リスクと機会の両方を捉えられる。","× 誤り。機会を利益確定後に評価すると、事業上の好機を逃しやすい。"]},{"id":"pmp-151","type":"mc","chapterIndex":2,"stem":"組織文化への対応として、最も適切なものはどれか。","options":["組織の文化は、変革の成否に影響しないため、確認は不要であり、手順や規程だけを整備すれば十分である。","組織文化を変革の前提として確認する。","文化は個人の価値観の問題であり、組織としての変革計画の中で扱う必要はない。","組織文化は、変革の終了後に評価すれば足り、計画段階で把握する必要はないと考える。"],"correctIndex":1,"explanations":["× 誤り。文化を無視すると、規程を整えても行動は変わりにくい。","○ 正しい。組織文化を変革の前提として確認すると、施策を実態に合わせられる。","× 誤り。組織としての計画に含めないと、変革が個人任せになる。","× 誤り。計画段階で把握しないと、抵抗の要因に対応できない。"]},{"id":"pmp-152","type":"mc","chapterIndex":2,"stem":"ポートフォリオ管理として、最も適切なものはどれか。","options":["プロジェクトとプログラムのポートフォリオを、戦略目標への寄与で定期的に見直し、資源を再配分する。","ポートフォリオは、一度決めたら変更しない。","案件は数が多いほど良いため、絞り込みは不要である。","見直しは、担当部門の判断で個別に行えばよい。"],"correctIndex":0,"explanations":["○ 正しい。戦略への寄与で定期的に見直すと、限られた資源を重要な案件へ配分できる。","× 誤り。環境の変化に応じた見直しをしないと、戦略との整合が崩れる。","× 誤り。案件を絞り込まないと、資源が分散して成果が上がりにくい。","× 誤り。部門ごとの判断では、組織全体の最適な配分ができない。"]},{"id":"pmp-153","type":"mc","chapterIndex":2,"stem":"法規制違反の疑いが生じた場合の対応として、最も適切なものはどれか。","options":["法規制違反の疑いは、事実関係が確定するまで関係者に共有せず、プロジェクトの担当者が単独で調べて対応を決めることが望ましい。","違反の疑いは様子を見て、事態の推移を待つ。","疑いは個人の判断だけで処理し、報告はしない。","法規制違反の疑いが生じたら、速やかに法務部門へ報告し、対応を決める。"],"correctIndex":3,"explanations":["× 誤り。単独で調べると、事実の把握や組織的な対応が遅れる。","× 誤り。様子見では、被害や違反が拡大するおそれがある。","× 誤り。個人の判断では、組織としての責任ある対応ができない。","○ 正しい。速やかに法務部門へ報告すると、組織として適切な対応を決められる。"]},{"id":"pmp-154","type":"mc","chapterIndex":2,"stem":"重要な意思決定の進め方として、最も適切なものはどれか。","options":["重要な意思決定は、直近の担当者の提案をもとに、会議を開かずに関係者へ回覧して承認を得る方法で行えば、迅速さが確保できる。","意思決定は記録せず、経緯も残さない。","重要な意思決定は、根拠を示した上で、権限を持つ会議体が行う。","意思決定は、先に実行してから承認を得る方法を標準とし、事後の報告で足りるとする。"],"correctIndex":2,"explanations":["× 誤り。回覧のみでは、根拠の検討や権限の確認が不十分になる。","× 誤り。意思決定を記録しないと、後から経緯を検証できない。","○ 正しい。根拠を示したうえで権限を持つ会議体が決めると、決定の妥当性を確保できる。","× 誤り。先に実行すると、承認の前に組織の判断を覆せなくなる。"]},{"id":"pmp-155","type":"mc","chapterIndex":2,"stem":"変革の準備状況の扱いとして、最も適切なものはどれか。","options":["変革の準備度は、変革が始まった後に現場の反応を見て評価するのが効率的であり、事前の評価は不要である。","変革の準備度を事前に評価する。","準備度の評価は、経営層の判断だけで行えば足り、現場への調査は負担になるため省略すべきである。","準備度は、組織の規模に関係なく一律と考えて、評価の手順を標準化せずに進めるのが望ましい。"],"correctIndex":1,"explanations":["× 誤り。変革後の評価では、抵抗への事前の対策が取れない。","○ 正しい。事前に準備度を評価すると、必要な支援や研修を計画に含められる。","× 誤り。現場の状況を調べないと、実態に合った計画を立てられない。","× 誤り。組織の状況に応じた評価をしないと、準備の不足を見落とす。"]},{"id":"pmp-156","type":"mc","chapterIndex":2,"stem":"投資対効果の判断として、最も適切なものはどれか。","options":["投資対効果は、投資の回収期間と期待されるベネフィットを、前提を明示して比較し、継続判断に用いる。","投資対効果は、金額の大きさだけで判断する。","回収期間は考えず、投資額だけで判断する。","効果は、投資後に確認すれば足りる。"],"correctIndex":0,"explanations":["○ 正しい。前提を明示して比較すると、投資の継続や中止の判断に根拠を与えられる。","× 誤り。金額だけでは、得られる効果との関係を判断できない。","× 誤り。回収期間を考えないと、資金繰りへの影響を評価できない。","× 誤り。投資後の確認だけでは、判断の前に投資の妥当性を検討できない。"]},{"id":"pmp-157","type":"mc","chapterIndex":2,"stem":"プロジェクトの終了判断として、最も適切なものはどれか。","options":["戦略上の目的が達成できないことが明らかになっても、投資の回収を優先し、当初の計画どおりに完了させるべきである。","終了は検討せず、現状の計画を続ける。","中止は失敗を意味するので、避けるべきである。","戦略上の目的を達成できないと判断した時点で、プロジェクトの終了を検討する。"],"correctIndex":3,"explanations":["× 誤り。回収を優先して完了させると、戦略に寄与しない投資を続けることになる。","× 誤り。終了を検討しないと、資源の浪費を止められない。","× 誤り。中止は、資源を戦略上重要な案件へ振り向ける判断でもある。","○ 正しい。目的の達成が難しいと判断したら終了を検討すると、資源を適切に配分できる。"]},{"id":"pmp-158","type":"mc","chapterIndex":2,"stem":"戦略を変更する際の進め方として、最も適切なものはどれか。","options":["戦略の変更は、経営層が決定した時点で直ちに計画へ反映すれば足り、影響の整理や関係者との合意は、実行の段階で必要に応じて行えばよい。","戦略は変更せず、当初の計画を維持する。","戦略を変更する際は、変更の理由と影響を整理し、関係者の合意を得てから計画に反映する。","戦略を変更した場合は、既存の計画を変えずに、新しい目標だけを別の計画として並行して進めることが望ましい。"],"correctIndex":2,"explanations":["× 誤り。影響を整理せずに反映すると、計画と実態が食い違う。","× 誤り。環境が変わっても戦略を変えないと、事業の機会を失う。","○ 正しい。理由と影響を整理し合意を得てから反映すると、変更を円滑に進められる。","× 誤り。既存計画を残したまま並行させると、資源が分散して混乱が生じる。"]},{"id":"pmp-159","type":"mc","chapterIndex":2,"stem":"ベンダー市場への対応として、最も適切なものはどれか。","options":["ベンダーの選定は、過去の取引実績だけで決めればよく、市場の変化や新しい選択肢を調べる必要はない。","市場の動向を継続的に把握する。","市場の変化は、競合の製品を購入した後に分析すれば十分であり、市場全体の動向を追う必要はない。","ベンダー市場の動向は、調達が決まった後に確認すれば十分であり、事前の調査や比較は不要と考える。"],"correctIndex":1,"explanations":["× 誤り。過去の実績だけでは、市場の変化への対応を判断できない。","○ 正しい。市場の動向を継続的に把握すると、調達や戦略判断の前提を更新できる。","× 誤り。購入後の分析では、事前の比較検討ができない。","× 誤り。調達後の確認では、より適した選択肢を検討できない。"]},{"id":"pmp-160","type":"mc","chapterIndex":2,"stem":"財務管理として、最も適切なものはどれか。","options":["財務の計画と実績を定期的に比較し、差異の原因を分析して、資金の配分を見直す。","財務の計画は、期末に確認すれば足りる。","差異は分析せず、結果だけを報告すればよい。","資金の配分は、最初に決めたまま変えない。"],"correctIndex":0,"explanations":["○ 正しい。定期的な比較と差異の分析で、資金の配分を実態に合わせられる。","× 誤り。期末だけの確認では、途中での是正が遅れる。","× 誤り。差異の原因を分析しないと、同じ問題を繰り返す。","× 誤り。環境の変化に応じた見直しをしないと、資金の効率が下がる。"]},{"id":"pmp-161","type":"mc","chapterIndex":2,"stem":"ガバナンス委員会の役割として、最も適切なものはどれか。","options":["ガバナンス委員会は、重要な変更や投資判断について、事後の報告を受けるだけにとどめ、承認の権限は担当部門に委ねることが望ましい。","委員会は設置せず、担当部門の判断に任せる。","承認は担当者が単独で行い、記録はしない。","ガバナンス委員会は、重要な変更や投資判断を承認し、その経緯を記録する。"],"correctIndex":3,"explanations":["× 誤り。事後報告だけでは、重要な判断を統制できない。","× 誤り。委員会がないと、判断の責任の所在があいまいになる。","× 誤り。担当者の単独判断では、組織としての統制が効かない。","○ 正しい。委員会が承認し経緯を記録すると、判断の妥当性と説明責任を確保できる。"]},{"id":"pmp-162","type":"mc","chapterIndex":2,"stem":"ベネフィットの測定と報告として、最も適切なものはどれか。","options":["ベネフィットの測定指標は、プロジェクトの完了後に、利用可能なデータをもとに関係者が自由に定めるものとし、事前の定義は必要ない。","報告は不要とし、実現状況は確認しない。","ベネフィットの測定指標を事前に定義し、実現状況を定期的に報告する。","ベネフィットは、測定が難しいものを対象外とし、測定しやすい指標だけを報告に用いることが望ましいとされる。"],"correctIndex":2,"explanations":["× 誤り。事後に指標を定めると、達成の判断基準が曖昧になる。","× 誤り。報告しないと、ベネフィットの実現状況を把握できない。","○ 正しい。指標を事前に定義し定期的に報告すると、実現状況を客観的に判断できる。","× 誤り。測定しやすい指標だけでは、重要な効果を見落とす。"]},{"id":"pmp-163","type":"mc","chapterIndex":2,"stem":"個人データの取扱いへの対応として、最も適切なものはどれか。","options":["個人データの保護は、システムの稼働後に問題が生じたときに対応すれば足り、設計段階で規制を確認する必要はない。","個人データの取扱いを法規制に照らして確認する。","個人データは、担当部門が便利なように利用して構わず、規制の範囲を細かく確認する必要はない。","データ保護の規制は、海外のサービスには適用されないため、国内の基準だけで判断すれば十分である。"],"correctIndex":1,"explanations":["× 誤り。設計段階で確認しないと、後の改修費用や違反のリスクが大きい。","○ 正しい。個人データの取扱いを規制に照らして確認することは、違反を防ぐ基本である。","× 誤り。担当部門の便宜で使うと、目的外利用になるおそれがある。","× 誤り。海外のサービスでも、対象となる場合があり、一律に除外はできない。"]},{"id":"pmp-164","type":"mc","chapterIndex":2,"stem":"組織の学習の仕組みとして、最も適切なものはどれか。","options":["組織として学習する仕組みを作り、プロジェクトで得た教訓を次の案件の計画や標準へ反映する。","教訓は個人の経験として残せば足りる。","教訓の共有は行わず、各自の記録にとどめる。","学習は、失敗したときだけ行えば十分とされる。"],"correctIndex":0,"explanations":["○ 正しい。教訓を組織の標準へ反映すると、次の案件で同じ問題を防げる。","× 誤り。個人の経験にとどめると、組織として活用できない。","× 誤り。共有しないと、同じ失敗が繰り返される。","× 誤り。成功例からも学ばないと、良い実践を広げられない。"]},{"id":"pmp-165","type":"mc","chapterIndex":2,"stem":"プロジェクトの利益計画として、最も適切なものはどれか。","options":["プロジェクトの利益計画は、便益の発生時期にかかわらず、全期間の合計金額だけを示せば足り、費用の見込みを時期ごとに示す必要はない。","利益計画は作成せず、投資の判断を行う。","費用は実績が出た後に、まとめて記録する。","プロジェクトの利益計画は、便益の発生時期と費用の見込みを対応させて策定する。"],"correctIndex":3,"explanations":["× 誤り。時期を対応させないと、資金繰りの判断を誤るおそれがある。","× 誤り。利益計画がないと、投資の効果を事前に評価できない。","× 誤り。費用を後から記録すると、見込みに基づく判断ができない。","○ 正しい。便益と費用の時期を対応させると、利益計画の実現性を確認できる。"]},{"id":"pmp-166","type":"mc","chapterIndex":2,"stem":"競合環境への対応として、最も適切なものはどれか。","options":["競合の動向は、自社の製品と直接競合する企業だけを対象とすればよく、市場全体や代替となる手段の分析は、必要性が低いため省略してよい。","競合は分析せず、自社の方針だけで判断する。","競合の動向を定期的に分析し、自社の強みと弱みを戦略に反映する。","競合の分析は、担当者が公開情報を一度確認すれば十分であり、その後は戦略の見直しに使う必要はない。"],"correctIndex":2,"explanations":["× 誤り。代替手段を含めないと、市場の脅威を見落とす。","× 誤り。競合を分析しないと、自社の位置づけを判断できない。","○ 正しい。競合の動向を定期的に分析し戦略に反映すると、市場での優位性を保てる。","× 誤り。一度の確認だけでは、環境の変化に対応できない。"]},{"id":"pmp-167","type":"mc","chapterIndex":2,"stem":"変革への抵抗への対応として、最も適切なものはどれか。","options":["変革への抵抗は、意思の弱さによるものとして扱い、説明や対話の場を設ける必要はないと考える。","変革への抵抗の理由を把握する。","抵抗が表れたら、対象者を配置転換して、変革の進行を優先させることが望ましいと判断する。","抵抗は、変革の終了後に自然に解消されるため、途中で対応を検討する必要はないと考える。"],"correctIndex":1,"explanations":["× 誤り。意思の問題と決めつけると、懸念の原因を把握できない。","○ 正しい。抵抗の理由を把握すると、対象者に合った支援や説明を計画できる。","× 誤り。配置転換で抑えると、組織の信頼と協力を損なう。","× 誤り。途中で対応しないと、抵抗が定着して変革が進まない。"]},{"id":"pmp-168","type":"mc","chapterIndex":2,"stem":"ビジネスケースの管理として、最も適切なものはどれか。","options":["ビジネスケースは、前提や環境の変化を反映して定期的に更新し、投資継続の判断に用いる。","ビジネスケースは、承認時点の内容を保持する。","前提の変化は考慮しなくてよい。","更新は、投資が失敗した後に行えば足りる。"],"correctIndex":0,"explanations":["○ 正しい。前提の変化を反映して更新すると、投資継続の判断を現実に即して行える。","× 誤り。前提が変わっても承認時の内容だけでは、判断を誤るおそれがある。","× 誤り。前提の変化を考慮しないと、投資の妥当性を評価できない。","× 誤り。失敗後の更新では、損失を防ぐ判断ができない。"]},{"id":"pmp-169","type":"mc","chapterIndex":2,"stem":"内部統制と法令遵守の確認として、最も適切なものはどれか。","options":["内部統制と法令遵守の状況は、問題が指摘されたときにのみ確認すればよく、定期的な監査は、担当部門の負担を増やすため不要とされる。","監査は行わず、現場の自己点検だけで足りる。","報告は担当部門が任意の時期に行えばよい。","内部統制と法令遵守の状況を、定期的に監査部門が確認し、結果を経営層へ報告する。"],"correctIndex":3,"explanations":["× 誤り。指摘時のみの確認では、問題の早期発見ができない。","× 誤り。監査を行わないと、統制の有効性を確認できない。","× 誤り。任意の報告では、経営層が状況を把握できない。","○ 正しい。定期的な確認と経営層への報告は、統制の有効性を保つ基本である。"]},{"id":"pmp-170","type":"mc","chapterIndex":2,"stem":"組織の意思決定ルールとして、最も適切なものはどれか。","options":["意思決定のルールは、担当者ごとの経験に基づいて個別に運用するのが柔軟であり、明文化すると判断が硬直化するため、文書化は最小限にとどめるべきである。","ルールは作らず、個々の判断に任せる。","権限と判断基準を明文化し、組織全体で共有する。","意思決定のルールは、経営層だけが把握していればよく、現場への共有は、判断に直接関係する一部の担当者に限定してよい。"],"correctIndex":2,"explanations":["× 誤り。担当者ごとの運用では、判断が一貫せず説明責任を果たせない。","× 誤り。ルールがないと、組織としての判断の一貫性を保てない。","○ 正しい。権限と判断基準を明文化し共有すると、判断の一貫性と説明責任を確保できる。","× 誤り。現場への共有を制限すると、判断の前提を現場が理解できない。"]},{"id":"pmp-171","type":"mc","chapterIndex":2,"stem":"製品の市場投入の判断として、最も適切なものはどれか。","options":["製品の市場投入は、開発が完了した時点で直ちに行うことが原則であり、市場の需要や競合の動きを確認する必要はない。","市場投入の時期を、市場の需要に合わせて決める。","市場投入の時期は、社内の準備状況だけで決めればよく、外部の需要や競合の状況を考慮する必要はない。","投入時期は、経営層の希望する日付に合わせて一律に設定し、市場の状況による見直しは行わないことが望ましい。"],"correctIndex":1,"explanations":["× 誤り。需要を確認しないと、売れない時期に投入するおそれがある。","○ 正しい。市場の需要に合わせて投入時期を決めると、事業の成果を高めやすい。","× 誤り。外部の状況を考慮しないと、競合に対して不利になるおそれがある。","× 誤り。市場の状況で見直さないと、投入の機会を逃すおそれがある。"]},{"id":"pmp-172","type":"mc","chapterIndex":2,"stem":"組織のリスク選好の扱いとして、最も適切なものはどれか。","options":["組織のリスク選好を経営層が明確にし、それに沿って個々の投資やプロジェクトのリスク許容範囲を定める。","リスク選好は、現場の判断に任せる。","リスクは、すべて避けるべきと考える。","許容範囲は、案件ごとに都度決めればよい。"],"correctIndex":0,"explanations":["○ 正しい。リスク選好を明確にすると、投資判断の基準を組織全体で揃えられる。","× 誤り。現場任せでは、組織としての判断基準が揃わない。","× 誤り。すべて避けると、事業上の機会を取れなくなる。","× 誤り。案件ごとに決めると、組織全体で一貫した判断ができない。"]},{"id":"pmp-173","type":"mc","chapterIndex":2,"stem":"成果の運用への移管として、最も適切なものはどれか。","options":["プロジェクトの成果の運用への移管は、開発チームが完了を宣言した後に、運用担当者が必要に応じて引き受けるものとし、事前の合意は必要ない。","移管は行わず、開発チームで運用も続ける。","責任は後から決め、移管の時期は後で調整する。","プロジェクトの成果を運用へ移管する時期と責任を、事前に関係者と合意する。"],"correctIndex":3,"explanations":["× 誤り。事前の合意がないと、移管後の責任が曖昧になる。","× 誤り。移管しないと、成果が事業の価値に結びつかない。","× 誤り。責任を後で決めると、運用の混乱が生じやすい。","○ 正しい。移管の時期と責任を事前に合意すると、成果を運用で確実に活かせる。"]},{"id":"pmp-174","type":"mc","chapterIndex":2,"stem":"事業価値の継続として、最も適切なものはどれか。","options":["事業の価値は、導入が完了した時点で確定するため、その後の確認や改善は、新たな投資が必要になった場合に限り行えばよい。","価値は確認せず、導入の成功だけで判断する。","事業の価値は、導入後も継続的に確認し、必要な改善を行うことで維持する。","導入後の価値の確認は、利用者の満足度調査の結果だけで判断し、財務上の効果は評価の対象に含めないことが望ましい。"],"correctIndex":2,"explanations":["× 誤り。導入後の確認を省くと、価値の低下に気づけない。","× 誤り。確認しないと、事業の価値が維持されているか判断できない。","○ 正しい。導入後も継続的に確認し改善すると、価値を維持できる。","× 誤り。財務上の効果を除くと、事業の価値を総合的に評価できない。"]},{"id":"pmp-175","type":"mc","chapterIndex":2,"stem":"持続可能性への対応として、最も適切なものはどれか。","options":["持続可能性への影響は、事業の利益に直接関係しない場合には評価対象から外し、法令で求められた場合にのみ検討すればよい。","持続可能性への影響を評価する。","環境や社会への影響は、プロジェクトの範囲外として扱い、担当部門が個別に判断することが望ましいとされる。","持続可能性の評価は、投資の承認後に、関係者の要望があった場合にのみ行えば十分であると考える。"],"correctIndex":1,"explanations":["× 誤り。利益と無関係として外すと、事業上のリスクを見落とす。","○ 正しい。持続可能性への影響を評価すると、事業の長期的なリスクと機会を把握できる。","× 誤り。範囲外として扱うと、組織としての責任ある判断ができない。","× 誤り。承認後の評価では、投資判断に反映できない。"]},{"id":"pmp-176","type":"mc","chapterIndex":2,"stem":"業界の規制変更への対応として、最も適切なものはどれか。","options":["業界の規制の変更を定期的に確認し、自社の事業計画と製品の要件へ速やかに反映する。","規制の変更は、施行された後に対応すれば足りる。","規制は業界ごとに違うため、確認しなくてよい。","規制の変更は、経営層が把握していれば十分である。"],"correctIndex":0,"explanations":["○ 正しい。規制の変更を定期的に確認し計画へ反映すると、違反や機会の逸失を防げる。","× 誤り。施行後の対応では、準備期間を活かせず混乱が生じる。","× 誤り。自社に関係する規制を把握しないと、対応の要否を判断できない。","× 誤り。経営層だけの把握では、現場の製品や業務への反映が遅れる。"]},{"id":"pmp-177","type":"mc","chapterIndex":2,"stem":"組織の方針の扱いとして、最も適切なものはどれか。","options":["組織の方針は、策定した部門だけが把握していればよく、プロジェクトの判断基準として周知する必要はなく、必要な場合に限って個別に参照すればよい。","方針は周知せず、各部門の判断に任せる。","方針は個人の裁量で扱い、統一はしていない。","組織の方針を、戦略目標と整合させ、プロジェクトの判断基準として周知する。"],"correctIndex":3,"explanations":["× 誤り。周知しないと、現場の判断が方針から外れる。","× 誤り。周知がないと、組織の判断基準が共有されない。","× 誤り。個人の裁量では、組織としての一貫性を保てない。","○ 正しい。方針を戦略と整合させて周知すると、判断基準を組織で揃えられる。"]},{"id":"pmp-178","type":"mc","chapterIndex":2,"stem":"新規事業の評価として、最も適切なものはどれか。","options":["新規事業は、担当部門が有望だと考える案件を対象に、事業の規模や収益性を詳しく評価せずに、早期に投資を開始して成果を見極める方法が効率的であるとされる。","新規事業は評価せず、勘で投資を決める。","市場規模・収益性・戦略適合性を評価し、投資の判断を行う。","新規事業の評価は、起業家の経験と熱意を中心に判断し、市場規模や収益性は、事業が始まった後に確認すれば十分である。"],"correctIndex":2,"explanations":["× 誤り。詳細な評価を省くと、収益性の低い事業に投資するおそれがある。","× 誤り。評価しないと、投資の妥当性を判断できない。","○ 正しい。市場規模・収益性・戦略適合性を評価すると、投資の判断に根拠を与えられる。","× 誤り。開始後の確認では、投資の前に収益性の見込みを判断できない。"]},{"id":"pmp-179","type":"mc","chapterIndex":2,"stem":"経営層への報告として、最も適切なものはどれか。","options":["経営層への報告は、問題が解決した後にまとめて行えば足り、進行中の重要な課題を途中で報告する必要はない。","重要な事業上の課題を経営層へ報告する。","報告の内容は、担当者が良い結果だけを選んで伝え、課題は経営層の関心があった場合にのみ報告すればよい。","報告は年に一度の定例会議で足り、重要な課題も次回の会議まで待つ。"],"correctIndex":1,"explanations":["× 誤り。解決後の報告では、経営層が判断の機会を失う。","○ 正しい。重要な課題を経営層へ報告すると、迅速な判断と資源の投入が可能になる。","× 誤り。課題を選んで伝えると、経営層が事業の実態を誤って判断する。","× 誤り。次回まで待つと、課題への対応が遅れて事業に影響する。"]},{"id":"pmp-180","type":"mc","chapterIndex":2,"stem":"事業環境の変化への対応として、最も適切なものはどれか。","options":["事業環境、戦略、組織の変化を統合的に捉え、プロジェクトの価値が継続して実現されるよう、定期的に計画と体制を見直す。","事業環境の変化は、プロジェクトの範囲外とする。","計画は一度定めたら変更しない。","体制の見直しは、問題が発生した時点で行えばよい。"],"correctIndex":0,"explanations":["○ 正しい。環境・戦略・組織の変化を統合して見直すと、価値の実現を継続して支えられる。","× 誤り。範囲外として扱うと、変化による価値の低下を防げない。","× 誤り。計画を変更しないと、環境の変化に対応できない。","× 誤り。問題が起きてからでは、価値の実現に遅れが生じる。"]}];
  const CHAPTERS = ["People（チームのリード・支援、ステークホルダーの関与、紛争の解決）","Process（計画・実行・監視・変更対応、予測型・アジャイル・ハイブリッド）","Business Environment（組織の戦略、コンプライアンス、価値の実現）"];
  const BASE_CHAPTER_COUNT = 3;   // これ以降の章は新シラバス仮問題集（deck:'extra3'）用

const MODE_LABEL = { mc: '模擬試験', tf: '一問一答', extra: '追加問題', extra2: '追加問題2', extra3: '新シラバス仮問題', review: '復習' };
// 成績記録（QuizTracking.js）のシートを分けるための mode 変換。
// 'extra'（追加問題、別ソースの問題集）は既存の 模擬試験(seiseiai_mc) と混在しないよう

// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。
const TRACKING_MODE = { mc: 'mc', tf: 'tf', extra: 'mc2', extra2: 'mc3', extra3: 'mc4', review: 'review' };

// 復習モードの「卒業」条件。復習でこの回数だけ連続正解したら、既定の出題対象から外す
// （「記録にある全部」を選べば卒業ぶんも出題できる）。バックエンド QuizReview.js は
// 生の連続正解数(streak)だけを返し、閾値の判断はこの画面側で持つ。
const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}

</script>
</body>
</html>
