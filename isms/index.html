をしない。","情報へのアクセスは、業務上及び情報セキュリティ上の要求事項に基づき、物理的・論理的に制限する方針を確立する。"],"correctIndex":3,"explanations":["× 誤り。一律の権限付与は、業務上の必要性を反映せず、最小権限の原則に反する。","× 誤り。アクセス制御は、利用者の希望ではなく、情報の重要度と業務要求に基づいて定める必要がある。","× 誤り。利用者への説明や理解の確保も、アクセス制御の運用上重要である。","○ 正しい。5.15は、業務要求と情報セキュリティ要求に基づき、物理的・論理的なアクセスを制限する方針の確立を求める。"]},{"id":"isms-129","type":"mc","chapterIndex":6,"stem":"管理策5.18「アクセス権」に関する記述として、最も適切なものはどれか。","options":["利用者のアクセス権は、定められた手順に従って付与・レビュー・削除する。","アクセス権は、一度付与すれば変更しない。","申請だけで付与し、承認は不要である。","アクセス権は、システムごとに異なる方法で管理し、統一された手順を設けず、各担当者の判断で付与と削除を行う。"],"correctIndex":0,"explanations":["○ 正しい。5.18は、アクセス権のライフサイクル（付与・変更・レビュー・削除）を、定められた手順で管理することを求める。","× 誤り。異動や退職があれば、アクセス権は見直し、必要に応じて変更又は削除する必要がある。","× 誤り。申請だけで付与し承認を省くと、権限の妥当性を統制できない。","× 誤り。統一された手順を持たないと、アクセス権の管理にばらつきと抜けが生じる。"]},{"id":"isms-130","type":"mc","chapterIndex":6,"stem":"管理策5.3「職務の分離」の目的として、最も適切なものはどれか。","options":["職務を一人に集中させ、承認と実行を同じ担当者が行うことで業務の効率を最大化し、確認の手間を省く。","相反する職務や責任を分離し、不正や誤りのリスクを低減する。","担当者ごとに業務を属人化させる。","職務の分離は、役職の上下関係を明確にし、指示系統を一本化するためだけに行う。"],"correctIndex":1,"explanations":["× 誤り。職務を一人に集中させると、不正や誤りを防ぐ統制が効かなくなる。","○ 正しい。職務の分離は、一人が相反する作業を単独で行えないようにし、不正や誤りの発生を抑えるための統制である。","× 誤り。担当者ごとの属人化は、統制の観点からは望ましくない。","× 誤り。職務の分離の目的は、上下関係の明確化ではなく、不正や誤りのリスク低減にある。"]},{"id":"isms-131","type":"mc","chapterIndex":6,"stem":"管理策5.19「供給者関係における情報セキュリティ」に関する記述として、最も適切なものはどれか。","options":["供給者には情報セキュリティの要求を伝えず、委託先の裁量に任せ、契約書にも情報の取扱いに関する条項は記載しない。","供給者の選定は価格だけで決め、情報セキュリティの確認や契約上の要求事項の設定は、取引開始後にまとめて行う。","供給者が取り扱う情報に関するセキュリティ要求事項を契約等で定め、管理する。","供給者の管理は、委託を開始する時点で一度行えば足り、その後の遵守状況の確認や契約内容の見直しは一切行わない。"],"correctIndex":2,"explanations":["× 誤り。要求事項を伝えないまま委託すると、供給者の管理はできない。","× 誤り。価格だけで選定すると、情報セキュリティの要件を満たさない供給者を選ぶおそれがある。","○ 正しい。5.19は、供給者関係において情報セキュリティ要求事項を定め、契約等を通じて管理することを求める。","× 誤り。委託後も、供給者の遵守状況を継続的に確認する必要がある。"]},{"id":"isms-132","type":"mc","chapterIndex":6,"stem":"管理策5.23「クラウドサービスの利用における情報セキュリティ」の要点として、最も適切なものはどれか。","options":["クラウドサービスは提供者に任せ、利用者側の設定や責任は一切考慮しない。","クラウドサービスの情報セキュリティ要求事項を定め、責任共有モデルを踏まえて、利用者と提供者の責任範囲を明確にして管理する。","クラウドサービスを利用する場合は、必ずオンプレミスと同じ設定を施すことを要求する。","クラウドサービスの利用状況は把握せず、部門ごとの判断で自由に利用させる。"],"correctIndex":1,"explanations":["× 誤り。クラウドサービスでも、利用者側の設定や管理の責任は残る。","○ 正しい。5.23は、利用するクラウドサービスの要求事項を定め、責任共有を前提として管理することを求める。","× 誤り。オンプレミスと同一の設定を求めるわけではなく、サービスの特性に応じた管理が必要である。","× 誤り。クラウドサービスの利用状況を把握せず、部門の判断で自由に利用させることは、管理策の趣旨に反する。"]},{"id":"isms-133","type":"mc","chapterIndex":6,"stem":"管理策5.30「事業継続のためのICTの備え」に関する記述として、最も適切なものはどれか。","options":["事業継続のためのICTの要求事項を計画し、実施し、評価する。","ICTの継続性は、障害が起きてから対応する方針とし、事前の準備は行わない。","継続性の計画は、情報システム部門だけで決める。","要求事項は一度定めれば、見直さない。"],"correctIndex":0,"explanations":["○ 正しい。5.30は、事業継続の目的に基づき、ICTの継続性要求事項を計画・実施・評価することを求める。","× 誤り。障害発生後の対応だけでは、事業継続の目標を満たせない。","× 誤り。事業継続の要件は、事業部門と合わせて決める必要がある。","× 誤り。事業環境の変化に応じて、要求事項は見直す必要がある。"]},{"id":"isms-134","type":"mc","chapterIndex":6,"stem":"管理策5.34「PII（個人を特定できる情報）のプライバシー及び保護」に関する記述として、最も適切なものはどれか。","options":["PIIの取扱いは、担当者の判断で決め、法令や契約上の要求事項は考慮しない。","PIIのプライバシーと保護について、適用される法令・規制・契約上の要求事項を満たすことを求める。","PIIは、保護の対象外とし、事業上必要と判断した場合は、本人への通知や同意を得ることなく自由に利用し、第三者へ提供する。","PIIの保護は、情報セキュリティの管理策とは別に扱い、ISMSの範囲外として、各部門の判断で個別に管理させる。"],"correctIndex":1,"explanations":["× 誤り。PIIの取扱いは、法令や契約上の要求事項を前提に定める必要がある。","○ 正しい。5.34は、PIIのプライバシーと保護について、法令・規制・契約上の要求事項を満たすことを求める。","× 誤り。PIIは保護の対象であり、自由に利用してよいものではない。","× 誤り。PIIの保護は、ISMSの中で扱うべき重要な要素である。"]},{"id":"isms-135","type":"mc","chapterIndex":7,"stem":"管理策6.3「情報セキュリティの意識向上、教育及び訓練」に関する記述として、最も適切なものはどれか。","options":["教育や訓練は、入社時に一度だけ実施すれば十分であり、その後の周知や見直しは行わなくてもよい。","役職員や関係する委託先に対し、役割に応じた教育・訓練を行い、定期的に周知する。","教育や訓練は、管理職だけを対象とし、一般の従業員や委託先は対象としないが、その理由は文書化しなくてもよい。","教育や訓練の効果は確認せず、参加者の出席記録のみを残し、内容の改善や見直しは行わない。"],"correctIndex":1,"explanations":["× 誤り。一度の教育では、継続的な意識向上の要求を満たさない。","○ 正しい。6.3は、役割に応じた教育・訓練と周知を、関係者に対して継続的に行うことを求める。","× 誤り。管理職だけを対象とすると、一般の従業員や委託先への周知が欠ける。","× 誤り。効果の確認も含めて管理する必要がある。"]},{"id":"isms-136","type":"mc","chapterIndex":7,"stem":"管理策6.5「雇用の終了又は変更後の責任」に関する記述として、最も適切なものはどれか。","options":["雇用が終了した後は、情報セキュリティ上の責任もすべて消滅する。","雇用の終了や変更に関わらず、情報セキュリティの責任を定め、本人に通知し、必要に応じて秘密保持義務を継続させる。","雇用の変更時は、アクセス権を見直す必要はなく、従来の権限を維持する。","雇用の終了に関する責任は、人事部門だけが管理し、情報セキュリティ部門は関与しない。"],"correctIndex":1,"explanations":["× 誤り。雇用の終了後も、秘密保持義務などの責任が残る場合がある。","○ 正しい。6.5は、雇用の終了又は変更に伴う情報セキュリティ上の責任を定め、継続的な義務を含めて管理することを求める。","× 誤り。雇用の変更時には、業務の変化に合わせてアクセス権を見直す必要がある。","× 誤り。雇用の終了に関する責任は、人事部門だけでなく、情報セキュリティ部門も関与して管理する必要がある。"]},{"id":"isms-137","type":"mc","chapterIndex":7,"stem":"管理策6.6「秘密保持契約又は守秘義務契約」に関する記述として、最も適切なものはどれか。","options":["秘密保持契約は、要員の情報保護の要求事項を反映し、定期的にレビューする。","秘密保持契約は、締結後に内容を変更することを禁止し、どのような状況でも見直さない。","一部の役職者とだけ締結すれば足りる。","秘密保持契約の内容は、締結時の条件で固定する。"],"correctIndex":0,"explanations":["○ 正しい。6.6は、秘密保持契約が要員の情報保護要求を反映し、必要に応じて見直されることを求める。","× 誤り。要求事項の変化に応じて、内容を見直すことが求められる。","× 誤り。秘密保持の要求は、関係する要員の範囲に応じて適用する必要がある。","× 誤り。事業や要求事項の変化に応じて、契約内容は見直す必要がある。"]},{"id":"isms-138","type":"mc","chapterIndex":7,"stem":"管理策6.8「情報セキュリティ事象の報告」に関する記述として、最も適切なものはどれか。","options":["本人が問題ないと判断した場合にだけ報告する。","要員は、情報セキュリティ事象を適切な窓口へ速やかに報告する仕組みを利用する。","情報セキュリティ事象は、被害が確定し、影響範囲の全容が判明するまで、上司にも報告しない。","情報セキュリティ事象の報告は、同僚の間で共有すれば十分であり、窓口へは不要である。"],"correctIndex":1,"explanations":["× 誤り。本人の判断で報告を省くと、事象の把握が遅れるおそれがある。","○ 正しい。6.8は、要員が情報セキュリティ事象を速やかに報告できる仕組みを確立し、利用できるようにすることを求める。","× 誤り。被害の確定を待つと、対応が遅れるため趣旨に反する。","× 誤り。同僚への共有だけでは、組織として対応できない。"]},{"id":"isms-139","type":"mc","chapterIndex":8,"stem":"管理策7.1「物理的セキュリティ境界」に関する記述として、最も適切なものはどれか。","options":["施設の境界は設けず、どの区域でも誰もが自由に出入りできるようにし、来訪者の記録も残さない。","保護すべき区域の境界を、運用上の都合で定期的に移動させ、対象となる情報資産の所在を文書化しないようにする。","保護すべき情報や資産がある区域について物理的な境界を定め、それを守る。","物理的な境界は、セキュリティ担当者が口頭で指示する範囲に限り、施設の全体で統一した基準は設けないようにする。"],"correctIndex":2,"explanations":["× 誤り。境界を設けず自由に出入りできるようにすると、区域の保護ができない。","× 誤り。境界を運用上の都合で移動させ、資産の所在を文書化しないことは、区域の保護の趣旨に反する。","○ 正しい。保護すべき情報や資産がある区域に物理的な境界を定め、それを守ることが物理的セキュリティ境界の基本である。","× 誤り。統一した基準を設けずに口頭指示だけに頼ると、境界の管理が一貫しない。"]},{"id":"isms-140","type":"mc","chapterIndex":8,"stem":"管理策7.2「物理的入退」に関する記述として、最も適切なものはどれか。","options":["来訪者は区域内で自由に行動してよく、記録は不要である。","入退の記録は、担当者の判断で残すかどうかを決める。","安全な区域の鍵は、全員が共有して自由に使えるようにする。","安全な区域には、権限を持つ者だけが入退できるように管理し、入退を記録する。"],"correctIndex":3,"explanations":["× 誤り。無制限の立入りと記録の省略は、入退の管理の趣旨に反する。","× 誤り。記録の要否を担当者の判断に任せると、入退の管理が一貫しない。","× 誤り。鍵を全員で共有すると、権限を持つ者だけの入退という要求を満たせない。","○ 正しい。7.2は、安全な区域への入退を権限のある者に限定し、適切に管理することを求める。"]},{"id":"isms-141","type":"mc","chapterIndex":8,"stem":"管理策7.4「物理的セキュリティの監視」の目的として、最も適切なものはどれか。","options":["施設内の監視カメラや侵入検知などで、不正な立入りを検知し、対応につなげる。","施設内の監視カメラや侵入検知を導入するが、記録は担当者の判断で残さず、映像の保存期間も定めない。","監視は夜間の施錠確認だけで十分であり、日中は行わない。","監視カメラは映像を見る必要がなく、設置するだけでよいとされる。"],"correctIndex":0,"explanations":["○ 正しい。7.4は、施設への不正な立入りを監視し、検知して対応することを求める。","× 誤り。記録や保存期間を定めない監視では、不正な立入りを検知し対応することができない。","× 誤り。夜間だけの確認では、日中の不正な立入りを検知できない。","× 誤り。映像を確認しない監視では、不正な立入りを検知し対応につなげられない。"]},{"id":"isms-142","type":"mc","chapterIndex":8,"stem":"管理策7.7「クリアデスク及びクリアスクリーン」に関する記述として、最も適切なものはどれか。","options":["離席時でも、机上の機密情報はそのままにしてよく、画面は離席後しばらく経ってからロックする。","離席時には、機密情報を机上に放置せず、画面を見られないようロックする。","書類は机上に置いたままにし、画面のロックは行わない。","離席時には、機密情報を机上に放置せず、画面はロックせずに、同じ部署の者が見られる状態にしておく。"],"correctIndex":1,"explanations":["× 誤り。離席中の機密情報の放置は、情報の漏えいを招く。","○ 正しい。7.7は、離席時の机上の情報や、画面表示の保護を求める。","× 誤り。画面のロックを省くと、第三者による閲覧を防げない。","× 誤り。同じ部署でも不要な閲覧を許すことは、機密の保護の趣旨に反する。"]},{"id":"isms-143","type":"mc","chapterIndex":8,"stem":"管理策7.9「組織の施設外にある資産のセキュリティ」に関する記述として、最も適切なものはどれか。","options":["施設外に持ち出した機器や記録媒体は、保護の対象外とし、利用者の判断で自由に扱ってよい。","施設外の機器は、持ち出しの記録を残さず、紛失や盗難が起きた場合にも、組織への報告は必要としない。","施設外に持ち出した機器や記録媒体も、組織の方針に従って保護する。","施設外の作業は、保護の方針を定めず、各自の判断で情報を持ち出し、必要に応じて外部の端末で処理する。"],"correctIndex":2,"explanations":["× 誤り。施設外の資産を保護の対象外とすると、情報の漏えいを防げない。","× 誤り。持ち出しの記録や報告を省くと、紛失時の対応ができない。","○ 正しい。7.9は、施設外の資産についても、組織の方針に従って保護することを求める。","× 誤り。方針なしに情報を持ち出すことは、組織の方針に従った保護の趣旨に反する。"]},{"id":"isms-144","type":"mc","chapterIndex":8,"stem":"管理策7.14「装置のセキュリティを保った処分又は再利用」に関する記述として、最も適切なものはどれか。","options":["装置は、処分の前に特に何もせず、そのまま廃棄してよい。","記憶媒体は、再利用の前に初期化しなくてもよい。","機密データは、消去せずに保管し、再利用の際にだけ確認する。","記憶媒体を含む装置は、処分や再利用の前に、機密データを消去又は物理的に破壊する。"],"correctIndex":3,"explanations":["× 誤り。機密データを消去せず廃棄すると、情報が外部に残るおそれがある。","× 誤り。初期化を省くと、前の利用者の情報が残るおそれがある。","× 誤り。消去しないまま保管すると、漏えいの危険が残る。","○ 正しい。7.14は、装置の処分や再利用の前に、記憶媒体の機密データを確実に消去又は破壊することを求める。"]},{"id":"isms-145","type":"mc","chapterIndex":9,"stem":"管理策8.2「特権的アクセス権」の管理として、最も適切なものはどれか。","options":["特権的アクセス権は、必要最小限に限定し、割当てと利用を記録・監視する。","特権的アクセス権は、業務の効率化のため、多くの利用者に付与し、利用記録は必要に応じて残すだけとする。","特権的アクセス権は、一度付与すれば見直さない。","システム管理者の判断だけで割り当て、記録は残さない。"],"correctIndex":0,"explanations":["○ 正しい。特権的アクセス権は、必要最小限に限定し、割当てと利用を記録・監視することで管理する。","× 誤り。多くの利用者に付与すると、不正や誤操作のリスクが高まる。","× 誤り。見直しを行わないと、不要になった特権が残り続ける。","× 誤り。割当てと利用の記録を残さないと、事後の検証ができない。"]},{"id":"isms-146","type":"mc","chapterIndex":9,"stem":"管理策8.5「セキュリティに配慮した認証」に関する記述として、最も適切なものはどれか。","options":["認証は、パスワードだけで行い、方式は全社で一律にする。","認証は、利用者の情報の重要度に応じた方式（パスワードや多要素認証など）で確実に行う。","認証は、利用者の情報の重要度に関わらず、同じ方式で行い、多要素認証は必要な場合にだけ、利用者の申告に基づいて使う。","認証は、利用者の利便性を最優先し、重要な情報を扱う場合でも、認証の強度を下げて、ログインの手間を減らす。"],"correctIndex":1,"explanations":["× 誤り。パスワードだけの一律の認証では、重要な情報を守る強度が足りない場合がある。","○ 正しい。8.5は、情報の重要度に応じた安全な認証の方式を用いることを求める。","× 誤り。重要度に関わらず同じ方式にすると、重要な情報を適切に保護できない。","× 誤り。認証の強度を下げることは、情報の重要度に応じた確実な認証という趣旨に反する。"]},{"id":"isms-147","type":"mc","chapterIndex":9,"stem":"管理策8.8「技術的脆弱性の管理」に関する記述として、最も適切なものはどれか。","options":["利用中のシステムの脆弱性情報は、入手せず、問題が顕在化してから、その時点で対応を検討すれば十分とする。","脆弱性への対応は、システムの管理者だけが行い、リスクの評価や関係者への共有は、必要と判断した場合にだけ行う。","利用中のシステムの技術的脆弱性に関する情報を入手し、リスクを評価して適切に対応する。","脆弱性に関する情報は、外部の公開情報を一切確認せず、更新プログラムの適用は、毎年一度だけまとめて行うこととする。"],"correctIndex":2,"explanations":["× 誤り。脆弱性情報を入手せず対応を後回しにすると、攻撃の機会を放置することになる。","× 誤り。リスクの評価と関係者への共有を省くと、組織として適切に対応できない。","○ 正しい。8.8は、利用中のシステムの脆弱性情報を入手し、リスクを評価して適切に対処することを求める。","× 誤り。年一回のまとめ適用では、重大な脆弱性に速やかに対応できない。"]},{"id":"isms-148","type":"mc","chapterIndex":9,"stem":"管理策8.9「構成管理」に関する記述として、最も適切なものはどれか。","options":["構成は、担当者が作業のたびに自由に変更し、記録や文書化は行わない。","構成の設定は、初期値のまま運用し、見直しは行わない。","ハードウェアの構成は、記録せずに、障害が起きたときだけ確認する。","ハードウェア・ソフトウェア・サービスのセキュリティ構成を定め、文書化し、監視する。"],"correctIndex":3,"explanations":["× 誤り。構成を無秩序に変え記録しないと、セキュリティ上の設定の一貫性が保てない。","× 誤り。初期値のまま見直さないと、脆弱な設定が残る。","× 誤り。構成を記録せず障害時だけ確認すると、管理と監視が行えない。","○ 正しい。8.9は、セキュリティ構成を定めて文書化し、その状態を監視することを求める。"]},{"id":"isms-149","type":"mc","chapterIndex":9,"stem":"管理策8.15「ログ取得」に関する記述として、最も適切なものはどれか。","options":["ログは、活動・例外・障害・情報セキュリティ事象を記録し、保護して保存する。","ログは、個人情報を含む場合でも、保護せずに誰でも閲覧できる場所に、無期限に保存しておく。","ログは、障害が起きたときだけ取得する。","ログは、必要と判断した場合にだけ、短期間保存する。"],"correctIndex":0,"explanations":["○ 正しい。8.15は、活動・例外・障害・情報セキュリティ事象のログを取得し、保護して保存することを求める。","× 誤り。ログを保護せず閲覧可能な場所に置くと、改ざんや情報漏えいのおそれがある。","× 誤り。障害時だけの取得では、事象の経緯を追跡できない。","× 誤り。必要時だけの取得と短期保存では、事後の検証に必要な記録が残らない。"]},{"id":"isms-150","type":"mc","chapterIndex":9,"stem":"管理策8.24「暗号の使用」に関する記述として、最も適切なものはどれか。","options":["暗号の使用は、担当者の判断に任せ、ルールは定めず、鍵は利用者が個人で保管する。","暗号の使用に関するルールを定め、鍵管理を含めて管理する。","暗号化は行わず、通信の安全性は確認しない。","暗号は、強度の確認をせずに古い方式を使い続け、鍵の管理は担当者ごとに個別に行い、記録を残さない。"],"correctIndex":1,"explanations":["× 誤り。ルールを定めず鍵を個人保管にすると、暗号を組織として管理できない。","○ 正しい。8.24は、暗号の使用ルールを定め、鍵の管理を含めて適切に運用することを求める。","× 誤り。暗号を使わないと、通信内容の保護ができない。","× 誤り。強度の確認なしに古い方式を使うことは、暗号の趣旨に反する。"]},{"id":"isms-151","type":"mc","chapterIndex":10,"stem":"ISO 19011 の監査原則のうち「独立性」に関する記述として、最も適切なものはどれか。","options":["監査対象の業務に責任を持たない立場で監査し、客観性と公平性を保つ。","監査人は、監査対象部門の業務を自ら担当し、その結果を自分で評価して報告する立場を取る。","監査人は、監査対象部門の上司の指示に従い、評価の基準や対象の選び方を部門の判断に委ね、その結果を報告する。","監査人は、監査の結論を被監査部門と事前に合意し、その合意内容に沿って証拠を選び、報告書を作成する。"],"correctIndex":0,"explanations":["○ 正しい。独立性は、監査対象の業務に責任を持たない立場で監査し、客観性と公平性を保つことを指す。","× 誤り。業務を担当する者が自ら評価すると、客観性が損なわれる。","× 誤り。評価の基準や対象を被監査部門に委ねると、独立性が保てない。","× 誤り。結論を事前に合意すると、監査の客観性と公平性が損なわれる。"]},{"id":"isms-152","type":"mc","chapterIndex":10,"stem":"ISO 19011 が定める監査原則に含まれないものはどれか。","options":["独立性を保ち、利害関係から離れること。","誠実性を保ち、正直に行動すること。","証拠に基づくアプローチを採って結論を導く。","監査対象部門の業務改善を監査人が直接実施すること"],"correctIndex":3,"explanations":["× 誤り。独立性は、ISO 19011 の監査原則に含まれる。","× 誤り。誠実性は、ISO 19011 の監査原則に含まれる。","× 誤り。証拠に基づくアプローチは、監査原則に含まれる。","○ 正しい。監査対象部門の業務改善を監査人が直接実施することは、ISO 19011 の監査原則に含まれない。"]},{"id":"isms-153","type":"mc","chapterIndex":10,"stem":"監査証拠の定義として、ISO 19011 の考え方に最も合うものはどれか。","options":["監査基準に関連し、検証可能な記録、事実の記述又はその他の情報。","監査人の個人的な感想や推測のみを指し、監査対象部門への聞き取りで得た内容や、記録の写しとは区別して扱うべきものである。","監査対象部門が作成した、都合のよい説明資料のみを指す。","監査の最終報告書に記載された結論そのものを指す。"],"correctIndex":0,"explanations":["○ 正しい。監査証拠は、監査基準に関連し、検証可能な記録・事実の記述・その他の情報である。","× 誤り。監査証拠は、個人的な感想や推測ではなく、検証可能な記録や事実の記述である。","× 誤り。被監査部門の説明資料だけでは、検証可能な証拠の要件を満たさない場合がある。","× 誤り。結論は監査証拠を評価した後に導かれるものであり、証拠そのものではない。"]},{"id":"isms-154","type":"mc","chapterIndex":10,"stem":"監査所見（audit findings）の説明として、最も適切なものはどれか。","options":["監査人が監査の初期に立てた仮説を、経営層へ提示する文書。","収集した監査証拠を監査基準に照らして評価した結果。","監査人が被監査部門の承認を得て、監査の範囲を一方的に変更した記録の写し。","監査人が個人的に抱いた印象や推測。"],"correctIndex":1,"explanations":["× 誤り。仮説は監査所見ではなく、監査証拠の評価の結果として所見が導かれる。","○ 正しい。監査所見は、監査証拠を監査基準に照らして評価した結果である。","× 誤り。範囲の一方的な変更は、監査計画の趣旨に反する。","× 誤り。個人的な印象や推測は、監査所見の根拠となる監査証拠ではない。"]},{"id":"isms-155","type":"mc","chapterIndex":10,"stem":"監査プログラムの管理に関する記述として、最も適切なものはどれか。","options":["監査プログラムは、担当者の経験だけに基づき、毎年同じ内容で策定し、目的やリスクの変化は考慮せず、結果のレビューも行わない。","監査プログラムは、監査の結果に関係なく、全ての部門を毎回同じ範囲で監査し、資源の配分は担当者の判断に任せる。","監査プログラムは、目的・範囲・リスク・資源を考慮して策定し、結果をレビューして改善する。","監査プログラムは、監査の実施後に作成し、目的や範囲の定義を省いて、実施結果を次年度の計画に反映させない。"],"correctIndex":2,"explanations":["× 誤り。経験だけに基づき毎年同じ内容とすると、リスクの変化に対応できない。","× 誤り。全部門を毎回同じ範囲で監査すると、リスクに応じた資源配分ができない。","○ 正しい。監査プログラムは、目的・範囲・リスク・資源を考慮して策定し、結果を踏まえて見直すものである。","× 誤り。実施後に作成し目的を省くと、監査の計画としての役割を果たせない。"]},{"id":"isms-156","type":"mc","chapterIndex":10,"stem":"内部監査の範囲（scope）の決定に関する記述として、最も適切なものはどれか。","options":["範囲は、担当者が思いついた部門だけに限定する。","範囲は、監査の目的を考えずに、前年の範囲をそのまま使う。","範囲は、監査人の裁量で決め、被監査部門には伝えない。","範囲は、監査の目的、監査基準、リスクを踏まえて、明確に定める。"],"correctIndex":3,"explanations":["× 誤り。担当者の思いつきで範囲を限定すると、重要なリスクの領域を見落とす。","× 誤り。目的を考えず前年を踏襲すると、リスクの変化に対応できない。","× 誤り。被監査部門に伝えない範囲では、監査の準備と協力が得られない。","○ 正しい。範囲は、監査の目的・基準・リスクを踏まえ、明確に定めるべきものである。"]},{"id":"isms-157","type":"mc","chapterIndex":10,"stem":"内部監査員の選定に関する記述として、最も適切なものはどれか。","options":["監査員は、監査対象との利害関係がなく、客観性を確保できる者を選ぶ。","監査員は、監査対象の業務を長年担当してきた者を優先して選び、その業務の経験を生かして、評価の客観性を確保する。","監査員は、誰でもよく、資格は問わない。","監査員は、被監査部門の管理者が指名する者に限る。"],"correctIndex":0,"explanations":["○ 正しい。内部監査員は、監査対象との利害関係がなく、客観性を確保できる者を選ぶことが求められる。","× 誤り。担当業務を長く担った者は利害関係を持ちやすく、客観性を損なうおそれがある。","× 誤り。資格や適性を問わなければ、監査の品質を確保できない。","× 誤り。被監査部門の指名に限ると、独立性を損なう。"]},{"id":"isms-158","type":"mc","chapterIndex":10,"stem":"リスクに基づく監査計画の考え方として、最も適切なものはどれか。","options":["重要性とリスクの高い領域に、監査資源を優先的に配分する。","監査資源は、過去に問題が無かった領域に偏って配分し、リスクの高い領域は監査の対象としない。","監査資源は、一律に均等に配分する。","監査資源は、監査人の興味のある領域に優先して配分し、リスクの重要性は判断の材料にしない。"],"correctIndex":0,"explanations":["○ 正しい。リスクに基づく監査計画は、重要性とリスクの高い領域へ資源を優先的に配分するものである。","× 誤り。問題の無かった領域に偏らせると、リスクの高い領域を見落とす。","× 誤り。一律配分では、リスクの大きさに応じた監査ができない。","× 誤り。個人の興味で配分すると、リスクに基づく監査計画の趣旨に反する。"]},{"id":"isms-159","type":"mc","chapterIndex":10,"stem":"監査におけるサンプリングの考え方として、最も適切なものはどれか。","options":["サンプルは、母集団の一部から都合のよいものを選び、結論は選んだ範囲の結果だけで決め、母集団全体への推定はしない。","サンプルは、件数を少なくするため、重要な項目を含めず、残りの項目から無作為に選び、結果の限界は示さない。","サンプルは、母集団の特徴を代表するように選び、結論の根拠とともに限界を明示する。","サンプルは、監査人が結論を先に決めてから、その結論に合う項目だけを選び、限界の説明は最終報告書に記載しない。"],"correctIndex":2,"explanations":["× 誤り。都合のよい項目だけで母集団全体の結論を導くと、結論の根拠として不十分である。","× 誤り。重要な項目を除くと、母集団の特徴を代表させられない。","○ 正しい。サンプリングは、母集団を代表するように抽出し、結論の根拠と限界を示すことが求められる。","× 誤り。結論に合わせて項目を選ぶことは、客観性を損なう。"]},{"id":"isms-160","type":"mc","chapterIndex":10,"stem":"面談（インタビュー）による証拠の扱いとして、最も適切なものはどれか。","options":["面談の内容は、そのまま結論の根拠とする。","面談は記録に残さず、担当者の記憶だけで評価する。","面談で得た情報は、本人の発言なので、疑わずに採用する。","面談の内容は、記録等の客観的証拠で裏付けてから、結論の根拠として扱う。"],"correctIndex":3,"explanations":["× 誤り。面談の内容だけで結論を導くと、客観的な裏付けを欠く。","× 誤り。記録を残さない評価は、検証できない。","× 誤り。発言をそのまま採用すると、証拠としての信頼性を確認できない。","○ 正しい。面談の内容は、記録などの客観的証拠で裏付けてから、結論の根拠とするべきである。"]},{"id":"isms-161","type":"mc","chapterIndex":10,"stem":"監査人が収集した監査証拠の扱いとして、最も適切なものはどれか。","options":["監査証拠は、追跡できるように記録し、保存する。","監査証拠は、監査人の記憶だけに基づいて扱い、記録は残さず、必要になった時点で作成する。","監査証拠は、確認せずに廃棄してよい。","監査証拠は、個人の端末に保存する。"],"correctIndex":0,"explanations":["○ 正しい。監査証拠は、追跡できるように記録し、保存する。","× 誤り。記憶だけに基づき記録を残さないと、証拠として追跡できない。","× 誤り。証拠を確認せず廃棄すると、監査結論の根拠を示せない。","× 誤り。個人の端末だけに保存すると、組織として管理・追跡できない。"]},{"id":"isms-162","type":"mc","chapterIndex":10,"stem":"内部監査の初回会議（opening meeting）の目的として、最も適切なものはどれか。","options":["初回会議は、被監査部門への事前通知を省き、監査人が一方的に監査の範囲と日程を決めて通知する場とする。","監査の目的・範囲・計画・日程を被監査部門と確認する。","会議は行わず、書面の通知だけで済ませる。","初回会議では、監査の結論を先に伝え、被監査部門の回答を求める。"],"correctIndex":1,"explanations":["× 誤り。事前通知を省き一方的に決めると、被監査部門の協力を得られない。","○ 正しい。初回会議では、監査の目的・範囲・計画・日程を被監査部門と確認する。","× 誤り。会議を省くと、目的や範囲を確認する機会がなくなる。","× 誤り。結論を先に伝えることは、監査の目的に反する。"]},{"id":"isms-163","type":"mc","chapterIndex":10,"stem":"終了会議（closing meeting）の目的として、最も適切なものはどれか。","options":["監査所見と結論を被監査部門と確認し、事実誤認を解消する機会を設ける。","終了会議は、被監査部門の反論を聞かずに、監査所見を一方的に確定させ、結果の報告書は非公開とする。","終了会議は、経営層だけの参加に限り、被監査部門の担当者には結論を伝えない運用とする。","終了会議は、監査が終わった後に省略し、所見は報告書の提出時にだけ、関係者へ書面で通知する。"],"correctIndex":0,"explanations":["○ 正しい。終了会議では、監査所見と結論を被監査部門と確認し、事実誤認を解消する機会を設ける。","× 誤り。反論を聞かずに所見を確定すると、事実誤認を解消できない。","× 誤り。被監査部門に結論を伝えないと、是正の合意が得られない。","× 誤り。終了会議を省くと、所見を確認する機会がなくなる。"]},{"id":"isms-164","type":"mc","chapterIndex":10,"stem":"不適合（nonconformity）と観察事項（observation）の区別として、最も適切なものはどれか。","options":["不適合は軽微な指摘にすぎず、観察事項と同じく扱う。","観察事項は、要求事項を満たしていないことを指す。","不適合と観察事項は、区別せずに、同じ是正の期限で扱う。","不適合は要求事項を満たしていないことを指し、観察事項は改善の機会として扱う。"],"correctIndex":3,"explanations":["× 誤り。不適合は要求事項を満たしていない指摘であり、観察事項と同一ではない。","× 誤り。要求事項を満たしていないことを指すのは不適合であり、観察事項ではない。","× 誤り。両者は性質が異なり、区別して扱う必要がある。","○ 正しい。不適合は要求事項を満たしていないこと、観察事項は改善の機会として扱うことを指す。"]},{"id":"isms-165","type":"mc","chapterIndex":10,"stem":"内部監査報告書の内容として、最も適切なものはどれか。","options":["監査の範囲・基準・所見・結論を、読み手に分かる形で報告する。","内部監査報告書は、結論だけを簡潔に記載し、監査の範囲・基準・所見の根拠は、読み手に分からないように省略する。","報告書は、口頭の説明だけで済ませ、文書にはしない。","報告書は、担当者だけが読めるように作成する。"],"correctIndex":0,"explanations":["○ 正しい。監査報告書には、範囲・基準・所見・結論を、読み手に分かる形で記載する。","× 誤り。根拠を省略すると、読み手が所見の妥当性を判断できない。","× 誤り。文書にしないと、記録として残らず、フォローアップができない。","× 誤り。関係者が読めない報告書では、改善につなげられない。"]},{"id":"isms-166","type":"mc","chapterIndex":10,"stem":"是正処置後のフォローアップの要点として、最も適切なものはどれか。","options":["是正処置の実施後は、結果を確認せずに、次回の監査まで対応を保留し、原因が残っているかは問わない。","是正処置の実施後、原因が除去されたかを確認し、その結果を記録する。","是正処置の実施後は、特に何もしない。","是正処置の実施後は、原因の除去を確認せずに、対応した事実だけを記録して、フォローアップを終了する。"],"correctIndex":1,"explanations":["× 誤り。結果を確認しないまま保留すると、原因が残ったままになる。","○ 正しい。フォローアップでは、是正処置の実施後に原因が除去されたかを確認し、記録する。","× 誤り。確認を行わないと、是正の有効性を判断できない。","× 誤り。原因の除去を確認せず終了すると、同じ問題が再発するおそれがある。"]},{"id":"isms-167","type":"mc","chapterIndex":5,"stem":"根本原因分析（root cause analysis）の考え方として、最も適切なものはどれか。","options":["指摘された事象は、その場で処理し、原因は調べずに、担当者の注意を促すことで、再発防止の対策として十分とする。","原因分析は、担当者の責任を明確にすることを目的とし、個人の過失を特定して処分を決めることを中心に行う。","指摘された事象の原因を特定し、同じ問題が再発しないように是正する。","根本原因の分析は、事象の表面的な現象だけを記録し、原因の追究は再発時に限って行う。"],"correctIndex":2,"explanations":["× 誤り。原因を調べずに注意だけで済ませると、同じ問題が再発する。","× 誤り。責任追及を中心にすると、原因の究明と再発防止が進まない。","○ 正しい。根本原因分析は、原因を特定し、再発防止につなげるためのものである。","× 誤り。表面的な記録だけでは、根本原因を特定できない。"]},{"id":"isms-168","type":"mc","chapterIndex":10,"stem":"内部監査の結果を経営層へ報告する目的として、最も適切なものはどれか。","options":["経営層に、結論だけを伝えて、詳細は報告しない。","経営層への報告は、良い結果だけを示すことを目的とする。","経営層の判断に関係なく、担当部門だけで共有する。","経営層がISMSの運用状況と、改善すべき事項を判断できるようにする。"],"correctIndex":3,"explanations":["× 誤り。詳細を報告しないと、経営層は運用状況を判断できない。","× 誤り。良い結果だけを示すと、改善すべき事項が伝わらない。","× 誤り。経営層が判断できない共有では、組織としての改善につながらない。","○ 正しい。内部監査の結果は、経営層がISMSの状況を判断し、改善の方向を決めるために報告される。"]},{"id":"isms-169","type":"mc","chapterIndex":4,"stem":"ISO/IEC 27001:2022 の 9.2（内部監査）の要求事項に関する記述として、最も適切なものはどれか。","options":["内部監査は計画された間隔で実施し、監査プログラムには頻度・方法・責任・報告を含める。","内部監査は、問題が起きたときだけ、担当者が必要と判断した時点で実施し、監査プログラムは作成せず、報告の方法も定めない。","内部監査は、認証審査の直前だけに実施する。","内部監査の頻度は、担当者の判断に任せる。"],"correctIndex":0,"explanations":["○ 正しい。9.2は、内部監査を計画された間隔で実施し、監査プログラムに頻度・方法・責任・報告を含めることを求める。","× 誤り。問題発生時だけで監査プログラムを持たないと、計画された間隔での実施という要求を満たさない。","× 誤り。直前だけの監査では、継続的な有効性を確認できない。","× 誤り。頻度を担当者任せにすると、計画された実施が保証されない。"]},{"id":"isms-170","type":"mc","chapterIndex":10,"stem":"監査基準（audit criteria）の説明として、最も適切なものはどれか。","options":["監査基準は、監査人が監査の途中で自由に定めてよく、事前に被監査部門へ伝える必要はなく、結果の評価にだけ使う基準のことである。","ISMSの要求事項、社内規程、適用される法令などの、適合性を判断するための基準。","監査人が気づいた問題点の一覧。","監査基準は、監査対象の部門が自ら作成した目標値であり、監査人はその目標値の達成度だけを確認する基準のことである。"],"correctIndex":1,"explanations":["× 誤り。事前に示さない自由な基準では、適合性を公正に判断できない。","○ 正しい。監査基準は、ISMSの要求事項・社内規程・適用法令など、適合性を判断するための基準である。","× 誤り。問題点の一覧は、監査基準ではなく所見の材料である。","× 誤り。被監査部門の目標値だけでは、要求事項への適合性を判断できない。"]},{"id":"isms-171","type":"mc","chapterIndex":10,"stem":"監査プログラムを見直す契機として、最も適切なものはどれか。","options":["監査プログラムは、一度作成すれば、監査結果や組織の変化があっても、同じ内容を翌年以降も継続して用いる。","監査結果や、組織の重大な変化があった場合に、監査プログラムを見直す。","監査プログラムは、監査人の交代があった場合にだけ、担当者が個人的に見直し、組織としての承認は必要としない。","監査プログラムは、監査の結果が良好であった場合に限り、次回の監査の頻度を減らすために見直す。"],"correctIndex":1,"explanations":["× 誤り。変化があっても内容を変えないと、リスクに合わない監査になる。","○ 正しい。監査結果や組織の重大な変化は、監査プログラムを見直す契機となる。","× 誤り。組織としての承認を省くと、プログラムの妥当性を確保できない。","× 誤り。結果の良否だけで頻度を減らすと、リスクの変化を反映できない。"]},{"id":"isms-172","type":"mc","chapterIndex":10,"stem":"監査人の質問の仕方として、最も適切なものはどれか。","options":["相手に圧力をかけ、回答を一つに絞るように求める。","質問は、はいかいいえだけで答えさせる。","質問は、相手の回答を遮り、次の項目へ進める。","オープンな質問で状況を聞き、必要に応じて記録を確認する。"],"correctIndex":3,"explanations":["× 誤り。圧力をかけると、正確な情報を引き出せない。","× 誤り。答えを限定すると、状況の全体像を把握できない。","× 誤り。回答を遮ると、重要な情報を聞き漏らすおそれがある。","○ 正しい。オープンな質問で状況を聞き、記録などで裏付けることが、適切な質問の仕方である。"]},{"id":"isms-173","type":"mc","chapterIndex":10,"stem":"監査証拠の「十分性」と「適切性」の説明として、最も適切なものはどれか。","options":["十分性は、証拠が結論を支えるのに足りる量であること。適切性は、関連性と信頼性があること。","十分性は、証拠の量が多ければ常に足りることであり、適切性は、誰が作成した証拠であっても関連性と信頼性を問わないことである。","十分性と適切性は、同じ意味であり、区別しない。","適切性は、証拠の量であり、十分性は証拠の質のことである。"],"correctIndex":0,"explanations":["○ 正しい。十分性は量の観点、適切性は関連性と信頼性の観点で、証拠を評価するものである。","× 誤り。量が多くても、関連性や信頼性がなければ適切な証拠とはいえない。","× 誤り。両者は異なる概念であり、区別して評価する必要がある。","× 誤り。十分性は量、適切性は質の観点であり、逆に説明している。"]},{"id":"isms-174","type":"mc","chapterIndex":10,"stem":"規程や手順書の文書レビューの目的として、最も適切なものはどれか。","options":["規程や手順書は、文書の段階では確認せず、運用の実績を見てから、要求事項を満たしているかを判断するものとする。","規程や手順書がISMSの要求事項を満たしているかを、文書の段階で確認する。","文書の形式だけを確認し、内容は問わない。","文書レビューは、作成者本人だけが行い、第三者による確認や要求事項との照合は行わない形で、効率を重視する。"],"correctIndex":1,"explanations":["× 誤り。運用の実績だけで判断すると、文書の不備を早期に見つけられない。","○ 正しい。文書レビューは、規程や手順書がISMSの要求事項を満たしているかを確認するものである。","× 誤り。形式だけを見ると、要求事項を満たすかを確認できない。","× 誤り。第三者による確認を省くと、文書の妥当性を客観的に評価できない。"]},{"id":"isms-175","type":"mc","chapterIndex":10,"stem":"監査における観察（observation）の要点として、最も適切なものはどれか。","options":["実際の作業を観察し、手順書どおりに行われているかを確認する。","観察は、事前に通知せずに行い、作業者には見られていることを伝えず、作業の様子を記録することも控える。","観察は、作業者の一部だけを対象にし、対象外の作業は手順書に照らして確認せず、結果を全体の結論として扱う。","観察は、実施した後で作業者に口頭で確認するだけとし、作業の時点での状況は記録に残さないようにする。"],"correctIndex":0,"explanations":["○ 正しい。観察は、実際の作業を見て、手順書どおりに行われているかを確認する。","× 誤り。作業者に伝えず記録もしないと、観察の結果を検証できない。","× 誤り。一部だけを観察して全体の結論とすると、結論の根拠として不十分である。","× 誤り。事後の口頭確認だけでは、作業時点の実態を把握できない。"]},{"id":"isms-176","type":"mc","chapterIndex":5,"stem":"是正処置の計画と追跡に関する記述として、最も適切なものはどれか。","options":["是正処置は、期限を定めず、担当者の都合に合わせて行う。","是正処置は、合意された期限内に計画を立て、実施状況を追跡する。","是正処置は、計画を立てずに、思いついた時点で行う。","是正処置の進捗は、追跡せずに、完了の報告だけを待つ。"],"correctIndex":1,"explanations":["× 誤り。期限を定めないと、是正が遅延し、管理できない。","○ 正しい。是正処置は、合意された期限内に計画を立て、実施状況を追跡する。","× 誤り。計画を立てないと、是正の効果を確認できない。","× 誤り。追跡しないと、未完了の是正を把握できない。"]},{"id":"isms-177","type":"mc","chapterIndex":10,"stem":"監査人の独立性を保つための対応として、最も適切なものはどれか。","options":["監査対象との利害関係がある場合は、その監査から外れる。","監査人は、監査対象との利害関係があっても、業務に支障がなければ監査を継続し、その事実は報告書に記載しない。","利害関係は、監査の結論に関係しない。","独立性は、監査人の気持ちの問題である。"],"correctIndex":0,"explanations":["○ 正しい。利害関係がある場合は、客観性を保つために、その監査から外れることが必要である。","× 誤り。利害関係を開示せず監査を続けると、結論の客観性が損なわれる。","× 誤り。利害関係は結論に影響するおそれがあり、無関係とはいえない。","× 誤り。独立性は、客観的な仕組みと態度の両面で確保する必要がある。"]},{"id":"isms-178","type":"mc","chapterIndex":10,"stem":"監査中に重大なリスクを発見した場合の対応として、最も適切なものはどれか。","options":["重大なリスクは、監査報告書の提出後に、次回の監査で扱うものとし、監査中には関係者へ伝えない。","重大なリスクは、速やかに管理責任者へ報告し、適切な対応を求める。","重大なリスクは、監査人だけで対処する。","重大なリスクは、担当者の判断で解決できた場合にだけ報告し、その他は監査報告書にまとめて翌年に伝える。"],"correctIndex":1,"explanations":["× 誤り。監査中に伝えないと、重大なリスクへの対応が遅れる。","○ 正しい。重大なリスクは、速やかに管理責任者へ報告し、適切な対応を求めるべきである。","× 誤り。監査人だけで対処すると、管理責任者の判断と統制を欠く。","× 誤り。担当者判断に任せると、重大なリスクが管理者に伝わらない。"]},{"id":"isms-179","type":"mc","chapterIndex":10,"stem":"内部監査の記録の保管に関する記述として、最も適切なものはどれか。","options":["監査の記録は、報告書が完成した時点で破棄し、監査計画や証拠は保持せず、必要になったときに再作成する。","監査の記録は、個人の端末に保存し、組織として保持や提示の方法を定めず、担当者が異動する際には記録を消去する。","監査計画、証拠、報告書などの記録を保持し、必要に応じて提示できるようにする。","監査の記録は、保持期間を定めずに、必要な範囲の関係者にだけ口頭で説明できるように、要点のみをメモしておく。"],"correctIndex":2,"explanations":["× 誤り。計画や証拠を破棄すると、監査結論の根拠を後から示せない。","× 誤り。個人の端末に任せると、組織として記録を管理できない。","○ 正しい。監査計画・証拠・報告書などの記録は、保持し、必要に応じて提示できるようにすべきである。","× 誤り。保持期間を定めず要点のみでは、事後の検証に必要な情報が残らない。"]},{"id":"isms-180","type":"mc","chapterIndex":4,"stem":"内部監査の目的として、最も適切なものはどれか。","options":["担当部門が自ら判断し、監査は行わない。","要求事項を満たさなくてもよいかを判断する。","監査は、外部の認証機関の審査結果のみを確認する。","ISMSが要求事項を満たし、有効に運用されているかを判断する。"],"correctIndex":3,"explanations":["× 誤り。監査を行わないと、要求事項を満たしているかを確認できない。","× 誤り。要求事項を満たさなくてもよいとする判断は、内部監査の目的に反する。","× 誤り。外部審査だけでは、組織内の運用状況を継続的に確認できない。","○ 正しい。内部監査は、ISMSが要求事項を満たし、有効に運用されているかを判断するために行う。"]}];

// 成績記録（QuizTracking.js）のシートを分けるための mode 変換。
// 'extra'（追加問題、別ソースの問題集）は既存の 模擬試験(seiseiai_mc) と混在しないよう
// 'mc2' という別モード名で記録する。'extra2'（3つ目の問題集）は同様に'mc3'。
// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。
const TRACKING_MODE = { mc: 'mc', tf: 'tf', extra: 'mc2', extra2: 'mc3', extra3: 'mc4', review: 'review' };

// 復習モードの「卒業」条件。復習でこの回数だけ連続正解したら、既定の出題対象から外す
// （「記録にある全部」を選べば卒業ぶんも出題できる）。バックエンド QuizReview.js は
// 生の連続正解数(streak)だけを返し、閾値の判断はこの画面側で持つ。
const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}

</script>
