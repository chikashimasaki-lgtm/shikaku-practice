。設計と評価を同じ者が行うと自己監査になり、独立性が確保されない。","○ 正しい。利害関係がないことと、外観上の客観性の両方が独立性の要件になる。","× 誤り。改善の指導と検証を同じ担当者が行うと、独立性の欠如に当たる。"]},{"id":"au-128","type":"mc","chapterIndex":3,"stem":"事業継続計画（BCP）の監査で確認すべき事項として、最も適切なものはどれか。","options":["計画書が作成されていることと、その計画を承認した経営者の署名がそろっていることを確認し、訓練の記録は問わない。","復旧にかかる費用をすべて保険でまかなえるかを確認し、業務の復旧手順は確認しない。","すべての業務を同じ復旧時間で扱うことが、もっとも効率的であるかを確認する。","重要業務の目標復旧時間（RTO）と目標復旧時点（RPO）が事業影響度分析に基づいて定められ、訓練などで検証されているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。計画書と署名だけでは、訓練や復旧手順の有効性は確認できない。","× 誤り。保険の範囲は財務面の検討であり、業務の復旧手順の確認に代わるものではない。","× 誤り。業務ごとに重要度と許容時間は異なるため、一律の復旧時間は適切でない。","○ 正しい。業務の重要度に応じた復旧目標を、影響度分析と訓練で裏付けることが要点になる。"]},{"id":"au-129","type":"mc","chapterIndex":3,"stem":"リスクアセスメントの監査で確認すべき事項として、最も適切なものはどれか。","options":["リスクの識別・分析・評価の手順が文書化され、評価結果が管理策の選択と優先順位の決定に反映されているかを確認する。","リスク評価の結果がすべて低リスクと判定されていれば、対策は不要と判断してよく、その判断を裏付ける評価の手順や根拠の文書化は省略して差し支えない。","リスクアセスメントは、システム導入後の一度だけ実施すれば、以後は見直す必要がない。","リスクの評価は担当者の経験に基づいて行い、評価の根拠を文書化しなくてよい。"],"correctIndex":0,"explanations":["○ 正しい。手順の文書化と、評価結果が対策に結び付いていることの確認が要点になる。","× 誤り。低リスクの判定だけで対策を不要とすることはできず、根拠の文書化も必要である。","× 誤り。リスクは環境の変化で変わるため、継続的な見直しが必要である。","× 誤り。経験だけによる評価は根拠が残らず、手順の文書化と見直しが必要である。"]},{"id":"au-130","type":"mc","chapterIndex":0,"stem":"成熟度モデルを情報セキュリティ監査で用いる目的として、最も適切なものはどれか。","options":["監査人が結論を自動的に算出し、報告書の記述や根拠の説明を省略して、依頼者の判断に委ねるため、監査期間を短縮するため。","管理の現状を段階で示し、目指す水準との差から改善の優先順位を決めるため。","組織の全従業員の情報リテラシーを、統一した試験で評価するため。","外部の監査人の報酬を、監査の結果の良し悪しに応じて段階的に決定し、その差額を組織の損益として計上するため。"],"correctIndex":1,"explanations":["× 誤り。報告書の根拠の省略は説明責任を損なうもので、成熟度モデルの目的ではない。","○ 正しい。現状と目標の差を段階で示すことで、改善の優先順位を議論しやすくなる。","× 誤り。全従業員の試験は成熟度モデルの目的ではなく、管理の水準の段階評価が目的である。","× 誤り。報酬の決定は成熟度モデルの目的ではなく、改善の優先順位付けに用いる。"]},{"id":"au-131","type":"mc","chapterIndex":3,"stem":"アクセス制御の監査で確認すべき事項として、最も適切なものはどれか。","options":["利用者が自分で権限を追加できるようにしていれば、申請の承認を省けて業務が効率的に進み、権限の付与も迅速に行える。","共有アカウントを多数の担当者で使い回すことは、操作者を特定できないという点を除けば、業務上の問題にはならない。","利用者に付与された権限が、業務上必要な範囲を超えていないかを、付与の承認記録と定期的な棚卸しで確認する。","退職者のアカウントは、業務上の混乱を避けるため、一定期間は削除せず残しておくべきであり、その間も利用できる状態にしておく。"],"correctIndex":2,"explanations":["× 誤り。自分で権限を追加できると、承認の統制が効かず、不要な権限が残る。","× 誤り。共有アカウントは操作者の特定ができず、アクセス制御上の問題になる。","○ 正しい。権限の付与に承認があり、定期的な棚卸しで妥当性が保たれているかが要点になる。","× 誤り。退職者のアカウントを残すと、不正利用の恐れがあるため、速やかに削除する。"]},{"id":"au-132","type":"mc","chapterIndex":3,"stem":"インシデント対応の監査で確認すべき事項として、最も適切なものはどれか。","options":["インシデントを関係部門に報告せず、情報システム部門だけで対応を完了させる。","インシデント対応は情報システム部門だけが担当し、他部門との連携手順は定めなくてよい。","過去のインシデントの記録は残さず、その都度の対応で十分とみなす。","検知から報告、封じ込め、復旧、事後検証までの手順が定められ、訓練や実際の事例で機能しているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。関係部門への報告を省くと、影響の把握と再発防止の共有ができない。","× 誤り。他部門との連携手順がないと、影響範囲の判断と対応の遅れを招く。","× 誤り。過去の記録がないと、同種のインシデントの傾向を分析できない。","○ 正しい。手順の整備と、実際の運用での機能の確認が監査の要点になる。"]},{"id":"au-133","type":"mc","chapterIndex":3,"stem":"暗号化の運用に関する監査で、確認すべき事項として最も適切なものはどれか。","options":["暗号化は外部との通信だけで行えばよく、内部のデータベースへの適用は不要である。","暗号化の方式が古くても、暗号化されていれば十分であるため、方式の見直しは不要である。","暗号鍵の生成、保管、更新、廃棄の管理が定められ、鍵が暗号化対象のデータと同じ場所に保管されていないかを確認する。","暗号鍵は、利用しやすさを優先して全担当者が共有できる場所に保管し、必要に応じて誰でも取り出せるようにしておくのが望ましい。"],"correctIndex":2,"explanations":["× 誤り。内部データベースも暗号化の対象であり、通信だけでは情報は守れない。","× 誤り。古い方式は解読のリスクがあるため、方式の定期的な見直しが必要である。","○ 正しい。鍵の管理ライフサイクルと保管の分離が、暗号化の効果を確かめる要点になる。","× 誤り。鍵を全担当者が取り出せる場所に置くと、暗号化の効果がなくなる。"]},{"id":"au-134","type":"mc","chapterIndex":3,"stem":"ログ管理の監査で確認すべき事項として、最も適切なものはどれか。","options":["ログは容量の節約のため、すべてのシステムで取得しないことが望ましく、必要と判断した場合にのみ、担当者の裁量で取得する。","重要なシステムのログが取得され、改ざん防止の措置が取られ、定期的な点検が行われているかを確認する。","ログの点検は、障害が発生したときにだけ行えば十分である。","ログは利用者本人が自由に編集できるようにし、誤記を修正できるよう、編集の履歴は残さず、管理者も変更を確認しないものとする。"],"correctIndex":1,"explanations":["× 誤り。ログを取得しないと、事後の検証と不正の発見ができない。","○ 正しい。取得、保護、点検の三つが揃って初めてログは監査や調査に役立つ。","× 誤り。点検を障害時だけに限ると、異常の早期発見ができない。","× 誤り。利用者が自由に編集できると、ログの改ざんを防げない。"]},{"id":"au-135","type":"mc","chapterIndex":3,"stem":"パスワード管理の監査で確認すべき事項として、最も適切なものはどれか。","options":["パスワードの有効期限を設けると利用者の負担が増えるため、期限は設けず、利用者が必要と判断したときだけ変更させるようにする。","共有アカウントは業務の効率化のため、複数の担当者が同じパスワードで利用してよく、利用者ごとの管理は省略して差し支えない。","初期パスワードのまま利用されることを防ぐため、初回ログイン時に変更を強制しているかを確認する。","パスワードは運用担当者が一括で管理し、利用者本人には知らせない方法が望ましく、利用者は必要なときに担当者へ問い合わせて初期化を依頼する。"],"correctIndex":2,"explanations":["× 誤り。有効期限の省略は、長期間の不正利用のリスクを高める。","× 誤り。共有パスワードは利用者の特定を妨げ、アクセス制御の統制が効かない。","○ 正しい。初期パスワードの放置は、不正アクセスの典型的な原因になる。","× 誤り。担当者が一括で管理すると、利用者の責任が曖昧になり、本人確認と変更の統制が効かない。"]},{"id":"au-136","type":"mc","chapterIndex":3,"stem":"教育・訓練の監査で確認すべき事項として、最も適切なものはどれか。","options":["全員に同じ内容の研修を一度実施すれば、その後は受講記録を残す必要はない。","教育は情報システム部門の要員だけを対象にすれば、組織全体の管理水準は確保できる。","研修の内容は担当者の判断に任せ、対象者の範囲は定めない。","全従業員と委託先の要員を対象に、役割に応じた教育を実施し、その記録と理解度の確認が行われているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。一度の研修と記録の省略は、受講状況と理解度の確認ができない。","× 誤り。部門を限定すると、組織全体の教育水準を把握できない。","× 誤り。研修の基準と対象者を定めないと、教育の網羅性を確認できない。","○ 正しい。対象範囲と役割別の内容、記録と理解度の確認が要点になる。"]},{"id":"au-137","type":"mc","chapterIndex":3,"stem":"脆弱性管理のプロセスの監査で確認すべき事項として、最も適切なものはどれか。","options":["脆弱性情報の収集、リスク評価に基づく修正の優先付け、修正後の確認までの流れが定められているかを確認する。","脆弱性が見つかった場合は、影響の評価や修正の優先付けを行わず、すべてを直ちに本番環境で修正することを基本とし、業務への影響は事後に確認する。","修正の完了は担当者の報告だけで判断し、再確認は行わない。","脆弱性情報は担当者の個人的な関心に任せ、組織として収集する仕組みは不要である。"],"correctIndex":0,"explanations":["○ 正しい。収集、評価、優先付け、確認の一連の流れが管理として揃っていることが要点になる。","× 誤り。影響を評価せずに本番で修正すると、業務への障害を招く恐れがある。","× 誤り。修正後の確認をしないと、修正が有効かどうか分からない。","× 誤り。組織として情報を収集しなければ、必要な脆弱性を見落とす。"]},{"id":"au-138","type":"mc","chapterIndex":1,"stem":"テレワークの情報セキュリティ監査で確認すべき事項として、最も適切なものはどれか。","options":["テレワークは自宅での作業であるため社内と同じルールを適用する必要はなく、各自が安全だと判断した方法で業務データを扱い、結果の報告も任意とする。","私物の端末を業務で使う場合でも、利用条件と持ち出し・保管のルールが定められ、安全な通信手段が使われているかを確認する。","業務データを私物の端末に保存することは、利用者の利便性を高めるため、原則として禁止しない方がよい。","公共の無線LANを使うことは、通信内容が暗号化されていれば組織の許可を得る必要はないが、接続先の確認と利用記録は残す必要がある。"],"correctIndex":1,"explanations":["× 誤り。テレワークでも社内と同等のルールが必要であり、各自の判断に任せてはならない。","○ 正しい。私物端末の扱いと通信の安全性は、テレワークのリスクの中心になる。","× 誤り。私物端末への業務データ保存は情報漏えいの原因になるため、原則として禁止すべきである。","× 誤り。暗号化だけでは接続先の安全性は確認できず、利用の許可と記録が必要である。"]},{"id":"au-139","type":"mc","chapterIndex":1,"stem":"委託先の再委託に関する監査で確認すべき事項として、最も適切なものはどれか。","options":["委託先が再委託を行っても、委託元が把握する必要はなく、再委託先の実態はその結果だけを確認すれば、管理の状況を把握できる。","再委託先の選定は委託先に任せ、委託元の承認や再委託先の管理状況の報告を求める仕組みは設けず、結果の良否だけを確認すればよい。","再委託の可否と条件が契約上明確で、再委託先にも委託先と同等の管理が求められているかを確認する。","再委託は委託先の業務効率を高めるため、必ず許可すべきであり、再委託先の条件や管理の方法を個別に定める必要はない。"],"correctIndex":2,"explanations":["× 誤り。再委託の把握なしに結果だけを確認しても、管理の実態は分からない。","× 誤り。再委託の承認と報告の仕組みがなければ、委託元の監督が及ばない。","○ 正しい。再委託の連鎖の中でも管理が途切れないことが要点になる。","× 誤り。再委託を無条件に許可すると、管理の条件が不明確になり、情報が漏えいする。"]},{"id":"au-140","type":"mc","chapterIndex":2,"stem":"情報資産の棚卸しの監査で確認すべき事項として、最も適切なものはどれか。","options":["資産の台帳は、導入時に一度作成すれば、以後は更新しなくてよい。","重要度の判定は、資産の所有者に任せず、情報システム部門が一括で行う。","廃棄した資産は台帳から消さずに残しておく。","資産の所在、所有者、重要度を台帳で把握し、定期的に更新されているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。導入時の一度の作成では、資産の変化が台帳に反映されない。","× 誤り。重要度は資産の所有者が業務の観点から判断すべきである。","× 誤り。廃棄した資産を残すと、台帳の実態と現状が一致しなくなる。","○ 正しい。資産の所在と責任者が把握されていることが、統制の出発点になる。"]},{"id":"au-141","type":"mc","chapterIndex":3,"stem":"情報セキュリティ監査における監査証拠の評価として、最も適切なものはどれか。","options":["委託先の自己申告書に加えて、現地確認や関連記録の検証など複数の証拠で裏付けを取る。","委託先からの自己申告書のみで、統制が実施されていると結論づけてよく、現地確認や記録の検証は、監査人の判断で必要と認められた場合にだけ行えばよい。","監査証拠は入手しやすい資料に限り、入手困難な資料は対象外とする。","監査証拠は、監査の結論を出した後に作成すれば、結論との整合性が取れる。"],"correctIndex":0,"explanations":["○ 正しい。複数の独立した証拠を組み合わせることで、結論の信頼性が高まる。","× 誤り。自己申告書だけでは、統制の実施を客観的に裏付けられない。","× 誤り。入手しやすい資料に限ると、結論の根拠が偏り、十分な証拠とならない。","× 誤り。結論の後に証拠を作ると、結論を裏付ける証拠とは言えない。"]},{"id":"au-142","type":"mc","chapterIndex":3,"stem":"ペネトレーションテストを監査の一環として実施する際の確認事項として、最も適切なものはどれか。","options":["事前の取り決めは攻撃の現実性を損なうため省き、突然の実施で実態を確認する。","対象範囲、実施時間帯、禁止事項を事前に取り決め、被監査部門の承認を得てから実施する。","事前の取り決めは攻撃の現実性を損なうため省き、突然の実施で実態を確認し、対象範囲は監査人が現場の状況に応じて随時決めてよい。","業務に影響が出る場合でも、テストの成果を優先し、本番環境で制限を設けずに実施して、業務への影響は事後に評価する。"],"correctIndex":1,"explanations":["× 誤り。事前の取り決めを省くと、業務への影響を管理できず、実施の承認も得られない。","○ 正しい。範囲と影響を事前に合意することで、業務への影響を抑えつつ安全に実施できる。","× 誤り。範囲を随時決めると、被監査部門の合意がなく、テストの統制が効かない。","× 誤り。本番環境で制限なく実施すると、業務が停止する恐れがあり、承認を得る必要がある。"]},{"id":"au-143","type":"mc","chapterIndex":1,"stem":"情報セキュリティ監査の計画段階で行うべき事項として、最も適切なものはどれか。","options":["監査の対象範囲は、実施の途中で状況に応じて自由に変更できるように、あえて定めず、監査人の裁量で必要と判断したときに決める。","準拠する管理基準は監査の結果を見てから後付けで選定し、結論が依頼者の期待に沿うように、対象範囲は途中で自由に変更してよく、報告書にはその経緯を記載しない。","監査の目的、対象範囲、準拠する管理基準を明確にし、監査計画書として依頼者の承認を得る。","監査計画は監査人の内部資料とし、依頼者には提示せず、必要な場合にだけ結論の段階で概要を伝えればよい。"],"correctIndex":2,"explanations":["× 誤り。対象範囲を定めないと、監査の目的と結論の範囲が明確にならない。","× 誤り。管理基準を結果を見て選ぶのは、結論の客観性を損なう不適切な進め方である。","○ 正しい。目的、範囲、基準を明確にし、依頼者と合意することが計画の要点になる。","× 誤り。計画を依頼者に示さないと、監査の範囲と目的について合意が得られない。"]},{"id":"au-144","type":"mc","chapterIndex":3,"stem":"物理的セキュリティの監査で確認すべき事項として、最も適切なものはどれか。","options":["サーバ室の入退室は、業務の効率を優先し、記録を残さずに自由にできるようにする。","物理的な区域の区分は、業務の状況により変わるため、定義しないことが望ましい。","来訪者は身元の確認と立会いを省き、入室の記録も残さずに対応してよい。","サーバ室などの重要な区域について、入退室の記録と定期的な権限の見直しが行われているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。記録を残さないと、入退室の事実を事後に検証できない。","× 誤り。区域を定義しないと、重要な区域に必要な管理を適用できない。","× 誤り。身元確認と立会いを省くと、不正な立ち入りを防げない。","○ 正しい。入退室の記録と権限の見直しが、物理的な統制の要点になる。"]},{"id":"au-145","type":"mc","chapterIndex":1,"stem":"業務委託先の監査で、委託する情報の取扱いについて確認すべき事項として、最も適切なものはどれか。","options":["委託する情報の範囲を必要最小限に限定し、委託終了時の返却または消去の手順を契約に含めているか。","委託先が必要と判断した情報は範囲の制限なく提供し、委託元は提供した内容を確認せず、委託先の判断で必要な情報を追加してよく、契約上の定めも不要とする。","委託が終了しても、委託先が保有する情報は、再利用のために保存し続けることが望ましい。","情報の取扱いは、委託先の社内規程に任せ、委託元と委託先の間で合意する必要はない。"],"correctIndex":0,"explanations":["○ 正しい。提供範囲の限定と、終了時の返却・消去が情報保護の要点になる。","× 誤り。範囲の制限なく提供すると、必要以上の情報が漏えいする恐れがある。","× 誤り。終了後も保存し続けると、返却と消去の統制が効かず、漏えいの恐れがある。","× 誤り。取扱いを委託先に任せると、委託元が監督できず、契約上の責任が不明確になる。"]},{"id":"au-146","type":"mc","chapterIndex":3,"stem":"マルウェア対策の監査で確認すべき事項として、最も適切なものはどれか。","options":["定義ファイルは、システムへの影響を避けるため、一度導入すれば以後は更新しないことが望ましく、必要と判断した場合にだけ更新する。","定義ファイルの更新状況を確認し、未適用の端末を検出して隔離する仕組みが機能しているかを確認する。","マルウェア対策ソフトは、利用者の判断で停止できるようにしておく。","未適用の端末は、業務への支障を避けるため検出の対象から外し、必要な時期に担当者が個別に対応することで、全体の管理の状況は問わない。"],"correctIndex":1,"explanations":["× 誤り。定義ファイルを更新しないと、新しい脅威を検知できず、防御が効かなくなる。","○ 正しい。更新の状況と、未適用の検出・隔離が機能しているかが要点になる。","× 誤り。利用者が自由に停止できると、感染の検知と対策が行われなくなる。","× 誤り。未適用の端末を検出しないと、感染の拡大を防げず、全体の管理状況を把握できない。"]},{"id":"au-147","type":"mc","chapterIndex":3,"stem":"変更管理の監査で確認すべき事項として、最も適切なものはどれか。","options":["変更は担当者の判断で随時実施し、記録は障害が発生したときだけ作成すればよく、変更の承認は必要としない。","緊急変更は承認の手続きを省いて即時に実施し、テストや記録は障害の再発を防ぐ必要がある場合にだけ、事後に担当者がまとめて作成する。","変更の申請、承認、テスト、本番移行の記録が残り、緊急変更も事後に承認されているかを確認する。","テストは本番移行後に行えば十分であり、移行前のテストは効率を下げるため省くべきで、移行後に不具合が見つかった場合に限り、対応すればよい。"],"correctIndex":2,"explanations":["× 誤り。判断で随時変更すると、変更の統制が効かず、障害の原因を追跡できない。","× 誤り。緊急変更の承認を省くと、統制の逸脱となり、事後の検証もできない。","○ 正しい。承認、テスト、記録の一連の流れが、変更の統制の要点になる。","× 誤り。移行後のテストだけでは、本番の障害を防げず、変更の品質を確保できない。"]},{"id":"au-148","type":"mc","chapterIndex":2,"stem":"情報セキュリティ方針の監査で確認すべき事項として、最も適切なものはどれか。","options":["方針は、担当部門だけが把握していれば十分であり、周知は不要である。","方針は一度策定すれば見直す必要はなく、長期にわたり維持する。","方針の内容は、部門が独自に定めてよく、統一は不要である。","経営陣が承認し、従業員に周知され、定期的な見直しが行われているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。担当部門だけが把握すると、組織全体で方針が共有されない。","× 誤り。見直しをしないと、環境の変化に対応できず、方針が陳腐化する。","× 誤り。部門ごとに方針が異なると、組織全体の統制にならない。","○ 正しい。承認、周知、見直しの三つが揃っていることが、方針の有効性の要点になる。"]},{"id":"au-149","type":"mc","chapterIndex":5,"stem":"保証型の監査で重大な欠陥を発見した場合の報告として、最も適切なものはどれか。","options":["重大な欠陥は報告書で明示し、経営者へ速やかに伝達する。","最終報告書の末尾に記載すれば、読み手が確認できるため、他の指摘と同じ扱いとし、特段の伝達は行わない。","次回に確認すれば、報告は見送ってよい。","被監査部門が判断し、監査人は報告しない。"],"correctIndex":0,"explanations":["○ 正しい。重大な欠陥は明示し、速やかに伝えることで、経営者が対応を判断できる。","× 誤り。末尾の記載では読み手が気付かず、重大な欠陥の重要性が伝わらない。","× 誤り。次回に回すと、重大な欠陥が放置され、経営者の対応が遅れる。","× 誤り。監査人が報告を省くことは、監査人の責任を果たさないことになる。"]},{"id":"au-150","type":"mc","chapterIndex":4,"stem":"情報セキュリティ監査の結論の記述として、最も適切なものはどれか。","options":["確認していない事項も含めて、全体として問題がないと断定的に記述する。","確認できた範囲と、確認できなかった範囲を明示し、その限界の中で結論を述べる。","結論は、被監査部門の要望に沿う内容に調整して記述し、被監査部門が納得できる表現を優先して、指摘の重みを和らげる。","結論の根拠となる証拠は、報告書の付録にまとめず、監査人の記憶に基づいて述べ、詳細は必要に応じて口頭で補足する。"],"correctIndex":1,"explanations":["× 誤り。確認していない事項を含めて断定すると、根拠のない結論になる。","○ 正しい。確認範囲と限界を明示することで、結論の信頼性と読み手の理解が確保される。","× 誤り。被監査部門の要望に合わせると、監査の独立性と客観性が損なわれる。","× 誤り。根拠を記憶だけに頼ると、結論の検証ができず、説明責任を果たせない。"]},{"id":"au-151","type":"mc","chapterIndex":5,"stem":"監査報告の指摘事項の記載として、最も適切なものはどれか。","options":["指摘の内容を簡潔にするため、事実と原因は省き、改善の推奨と担当者の判断だけを記載し、読み手が必要に応じて追加の資料を求めればよい。","指摘の対象者を明確にするため、担当者の氏名を記載し、その担当者の責任を追及する表現を用いて、改善の責任の所在を明らかにする。","事実、原因、影響（リスク）、改善の推奨を明記し、読み手が状況を理解できる形で記載する。","指摘の内容は網羅的に列挙し、事実や原因、重要度の区別は付けず、読み手が必要な箇所を自分で選び出せるように、一覧だけを示して記載し、結論は付けない。"],"correctIndex":2,"explanations":["× 誤り。事実と原因を省くと、指摘の根拠が読み手に伝わらず、改善につながらない。","× 誤り。個人の責任追及の表現は、指摘を仕組みの問題として捉える報告の原則に反する。","○ 正しい。四つの要素を揃えることで、指摘の根拠と対応の方向が明確になる。","× 誤り。指摘を網羅するだけで重要度を示さないと、読み手は優先順位を判断できない。"]},{"id":"au-152","type":"mc","chapterIndex":5,"stem":"助言型監査における改善提案の示し方として、最も適切なものはどれか。","options":["監査人が改善の方法を決め、従うよう求める。","改善提案は、実施可能性を問わず、理想的な水準をすべて示す。","改善提案は、費用にかかわらず、すべて実施することを前提とする。","実施可能性と費用対効果を考慮し、経営者が判断できる選択肢として示す。"],"correctIndex":3,"explanations":["× 誤り。監査人が実施方法を決めると、経営者の責任と判断が損なわれる。","× 誤り。実施可能性を考えない提案は、経営者が判断できる現実的な選択肢にならない。","× 誤り。費用対効果を考えずに全て実施を前提とすると、判断の材料にならない。","○ 正しい。助言は経営者の判断を支える形で示すのが助言型の基本である。"]},{"id":"au-153","type":"mc","chapterIndex":5,"stem":"監査報告書の記載事項として、最も適切なものはどれか。","options":["監査の目的、範囲、実施期間、準拠した基準、結論を含める。","監査人の個人的な見解のみを記載し、準拠した基準や監査の範囲は記載しなくてよく、読み手は報告の結論だけを参照すればよい。","監査で入手した資料の原本を、報告書に添付する。","結論は報告書の最後に一度だけ記載する。"],"correctIndex":0,"explanations":["○ 正しい。目的、範囲、基準、結論が揃って、報告の信頼性と再現性が確保される。","× 誤り。準拠した基準を記載しないと、結論の妥当性を読み手が判断できない。","× 誤り。原本の添付は報告書の必須事項ではなく、記載事項の要件ではない。","× 誤り。結論だけでは、目的、範囲、基準が記載されず、報告の対象と限界が伝わらない。"]},{"id":"au-154","type":"mc","chapterIndex":5,"stem":"監査報告書の提出先として、最も適切なものはどれか。","options":["被監査部門にのみ提出し、依頼者へは口頭で伝えればよい。","監査の依頼者（経営者や監査委員会など）に提出し、必要に応じて被監査部門へ回付する。","外部の不特定多数の関係者に広く公開し、監査結果の透明性を確保する。被監査部門や依頼者への提出は、公開後に限って行うものとする。","監査人の所属する組織の内部にのみ保管し、依頼者には提出しないことを原則とし、必要な場合でも依頼者の求めがあったときに限って、その内容を提示する。"],"correctIndex":1,"explanations":["× 誤り。被監査部門にのみ提出すると、依頼者が結果を把握できず、監督機能が働かない。","○ 正しい。依頼者に提出することで、監査の結果が経営判断に結び付く。","× 誤り。不特定多数への公開は、監査の秘密と機密情報の保護の観点から適切でない。","× 誤り。依頼者に提出しない報告は、監査の依頼に応えておらず、報告の責任を果たせない。"]},{"id":"au-155","type":"mc","chapterIndex":6,"stem":"監査後のフォローアップとして、最も適切なものはどれか。","options":["指摘事項の改善は被監査部門の自主性に任せ、監査人は確認しないことを原則とし、改善の結果も特段の報告を求めないものとする。","フォローアップは次回の監査までに一度だけ行えば十分であり、改善の途中経過は報告せず、完了した指摘の一覧だけを次回の監査で提示する。","指摘事項の改善状況を期限を定めて確認し、未完了の場合は理由と再計画を求める。","改善が完了していない指摘は、報告書から削除し、改善の経過や理由を記録として残さないこととし、次回の監査でも扱わないものとする。"],"correctIndex":2,"explanations":["× 誤り。改善の確認を省くと、指摘が解消されたかどうかを把握できない。","× 誤り。次回監査まで報告しないと、改善の遅れに対応する機会を失う。","○ 正しい。期限と確認により、指摘が実際の改善につながったかを確かめられる。","× 誤り。未完了の指摘を消すと、改善の経緯が残らず、監査の追跡ができない。"]},{"id":"au-156","type":"mc","chapterIndex":3,"stem":"監査調書（ワーキングペーパー）の役割として、最も適切なものはどれか。","options":["作業時間を記録し、報酬の算定に用いる。","被監査部門に提示して判断を承認してもらう。","監査終了後は、速やかに廃棄して記録を残さないことが望ましい。","監査の結論の根拠を示すため、監査手続と入手した証拠を記録し保存する。"],"correctIndex":3,"explanations":["× 誤り。作業時間の記録は報酬のためのものであり、監査調書の役割ではない。","× 誤り。被監査部門による判断の承認は、監査人の独立性を損なう。","× 誤り。廃棄して記録を残さないと、結論の根拠を後から検証できない。","○ 正しい。監査調書は結論の根拠を後から検証可能にするための記録である。"]},{"id":"au-157","type":"mc","chapterIndex":5,"stem":"監査報告書における経営者の回答の扱いとして、最も適切なものはどれか。","options":["指摘に対する経営者の対応（改善計画、期限、責任者）を報告書に併記する。","経営者の回答は、監査人の結論を覆すものとして扱い、回答の内容が事実と異なる場合であっても、報告書からは除外して、監査人の判断で残すかどうかを決める。","経営者の回答は、口頭で伝えればよい。","経営者の回答は、指摘の内容に応じて省略してよい。"],"correctIndex":0,"explanations":["○ 正しい。回答を併記すると、指摘への対応の責任と期限が明確になる。","× 誤り。経営者の回答は監査人の結論を覆すものではなく、併記して読み手に示す。","× 誤り。記録に残さないと、改善の約束と進捗を後から確認できない。","× 誤り。指摘の内容によって回答を省略すると、経営者の対応状況が不明になる。"]},{"id":"au-158","type":"mc","chapterIndex":5,"stem":"監査の過程で重大な欠陥を発見した場合の対応として、最も適切なものはどれか。","options":["最終報告まで待ち、途中の伝達は不要である。","重大な欠陥は、最終報告を待たず、速やかに関係者へ伝達する。","重大な欠陥は、被監査部門が自主的に改善するまで報告を控え、改善が見込まれた段階で関係者へ一括して伝えればよい。","重大な欠陥は、他の指摘と同じ時期にまとめて報告すれば十分であり、最終報告の内容とあわせて提示すれば、関係者の判断に影響しない。"],"correctIndex":1,"explanations":["× 誤り。最終報告まで待つと、重大な欠陥への対応が遅れる。","○ 正しい。重大な欠陥は、影響の大きさから速やかな伝達が求められる。","× 誤り。改善を待って報告を控えると、関係者が重大な欠陥を把握できない。","× 誤り。他の指摘と同じ時期にすると、重大な欠陥の緊急性が伝わらない。"]},{"id":"au-159","type":"mc","chapterIndex":5,"stem":"保証報告書の説明として、最も適切なものはどれか。","options":["委託元の社内監査部門が、自社の内部統制の状況を自己評価した結果をまとめたもので、その評価は社内の基準だけに基づいて行われる。","受託会社の業務の品質を、顧客の満足度調査の結果に基づいて報告するもので、統制の有効性は報告の対象にしない。","受託会社の内部統制の有効性について、独立した第三者が検証した結果を報告するもの。","保証報告書は、監査の対象範囲を定めず、全体の状況を概括的に示すものであり、利用者は報告の内容を自らの判断で補って利用する。"],"correctIndex":2,"explanations":["× 誤り。自己評価は独立した第三者による検証ではなく、保証報告書の説明に当たらない。","× 誤り。満足度調査は内部統制の有効性を検証するものではなく、保証報告書の対象ではない。","○ 正しい。第三者の独立した検証結果に基づき、内部統制の状況を利用者に伝える。","× 誤り。範囲を定めない報告は、保証の対象と水準が不明になり、保証報告書の説明にならない。"]},{"id":"au-160","type":"mc","chapterIndex":5,"stem":"監査範囲に制約があった場合の報告として、最も適切なものはどれか。","options":["制約がある部分も含めて、問題がないと結論づける。","制約は監査人の責任ではないため、記載は省く。","制約がある場合は、監査を中止する。","制約の内容と、それが結論に与える影響を報告書に明記する。"],"correctIndex":3,"explanations":["× 誤り。制約のある部分を問題なしとすると、確認していない事項を保証することになる。","× 誤り。制約の内容は、読み手が結論の限界を理解するために必要な情報である。","× 誤り。制約があっても監査を中止せず、制約の内容と結論への影響を報告することが求められる。","○ 正しい。制約とその影響を示すことで、読み手は結論の限界を理解できる。"]},{"id":"au-161","type":"mc","chapterIndex":5,"stem":"監査報告の表現として、最も適切なものはどれか。","options":["確認していない事項を、確認したかのように記載せず、確認の限界を明示する。","読み手に安心感を与えるため、確認していない事項も含めて、全体として肯定的で問題のない表現を用い、確認の限界については読み手が気付かないよう簡潔に記載する。","指摘の重みを和らげるため、重要な事項を脚注に移して記載する。","専門用語を多用して、読み手が理解しにくい形で記載する。"],"correctIndex":0,"explanations":["○ 正しい。確認の限界を明示することで、報告の信頼性が確保される。","× 誤り。確認していない事項を肯定的に記載すると、読み手に誤った保証を与える。","× 誤り。重要な事項を脚注に移すと、読み手が見落とし、報告の目的を果たせない。","× 誤り。読みにくい記載は、報告の内容を正しく伝えられず、説明責任に反する。"]},{"id":"au-162","type":"mc","chapterIndex":7,"stem":"監査人の説明責任として、最も適切なものはどれか。","options":["結論の根拠は、監査人の専門性を信頼してもらうため、示す必要はなく、報告書の結論の文言だけで読み手が判断できるように記載する。","報告書の根拠（証拠）と結論の関係を、読み手が追跡できるように記載する。","根拠は依頼者に口頭で伝えればよい。","結論の根拠は監査人の専門性を信頼してもらうため報告書には示さず、必要に応じて依頼者へ個別に説明すれば十分である。"],"correctIndex":1,"explanations":["× 誤り。根拠を示さないと、読み手は結論の妥当性を検証できない。","○ 正しい。根拠と結論を追跡可能にすることで、報告の検証と説明が可能になる。","× 誤り。根拠を口頭だけで伝えると、報告書の記録として残らず、追跡できない。","× 誤り。専門性への信頼だけでは、報告の説明責任を果たしたことにはならない。"]},{"id":"au-163","type":"mc","chapterIndex":6,"stem":"フォローアップで指摘事項の改善完了を判定する方法として、最も適切なものはどれか。","options":["担当者が完了したと報告した時点で、改善が完了したものと判定し、その報告の内容が事実であるかどうかは、必要と判断した場合にだけ確認する。","改善の完了は、経営者が判断すれば十分であり、監査人が確認する必要はなく、経営者の判断の根拠も報告書に記載しないものとする。","改善の完了を示す証拠（規程の改定記録、設定の変更記録など）を確認して判定する。","改善の完了は、指摘から一定期間が経過したことをもって判定し、経過後に改善の実施内容や証拠の提示を求めることなく、そのまま完了として扱う。"],"correctIndex":2,"explanations":["× 誤り。担当者の報告だけでは、改善が実際に行われたかどうかを確認できない。","× 誤り。経営者の判断だけでは、監査人が改善の有効性を客観的に確認できない。","○ 正しい。改善の証拠を確認することで、完了の判定が客観的になる。","× 誤り。期間の経過だけでは改善の実施は確認できず、証拠の提示を求める必要がある。"]},{"id":"au-164","type":"mc","chapterIndex":5,"stem":"監査報告の時期として、最も適切なものはどれか。","options":["報告は、監査の結果が完全に明らかになるまで、無期限に遅らせてよい。","報告は、次回の監査と合わせて一度に行えば、依頼者の負担を大きく減らせる。","報告の時期は被監査部門の都合に合わせて決め、依頼者の承認を待つ。","監査終了後、定められた期限内に報告し、フォローアップの期限を依頼者と合意しておく。"],"correctIndex":3,"explanations":["× 誤り。期限を設けずに報告を遅らせると、依頼者の判断と改善の機会を失う。","× 誤り。まとめて報告すると、指摘への対応が遅れ、フォローアップの期限も決まらない。","× 誤り。被監査部門の都合で時期を決めると、監査の独立性と報告の期限が保てない。","○ 正しい。期限の遵守とフォローアップの合意で、改善が着実に進む。"]},{"id":"au-165","type":"mc","chapterIndex":6,"stem":"経営者の改善計画に対する監査人の確認として、最も適切なものはどれか。","options":["改善計画が指摘に対応しているか、実施可能性を含めて監査人が妥当性を確認する。","改善計画は経営者の専権事項であり、監査人は内容を確認してはならない。","改善計画は、指摘の内容と無関係でも、経営者が作成したものであれば受け入れ、その実施の可否は報告書の記載事項とはしない。","改善計画は経営者の専権で、確認は不要とする。"],"correctIndex":0,"explanations":["○ 正しい。改善計画が指摘に対応しているかを確認することで、改善の実効性が高まる。","× 誤り。改善計画の内容確認を禁じると、指摘への対応が有効かを判断できない。","× 誤り。指摘と無関係な計画を受け入れると、指摘への対応にならない。","× 誤り。計画の確認を省くと、監査人が改善の妥当性を評価できない。"]},{"id":"au-166","type":"mc","chapterIndex":5,"stem":"監査報告書の表現として、最も適切なものはどれか。","options":["指摘の原因は担当者の不注意として記載し、個人の責任を明確にすることで、再発を防ぐための確実な責任の所在を示す。","指摘を個人の責任追及ではなく、仕組みの問題として記述する。","指摘の内容は、関係者の名前を明示して記録として残す。","指摘の表現は、批判的な印象を与えないよう、事実を曖昧にして記載し、読み手が細部を推測できるようにする。"],"correctIndex":1,"explanations":["× 誤り。担当者の不注意とすると、仕組みの問題が見えず、再発防止につながらない。","○ 正しい。仕組みの問題として記述すると、組織全体の改善につながる。","× 誤り。関係者の名前を記録すると、個人の責任追及になり、報告の目的に反する。","× 誤り。事実を曖昧にすると、指摘の内容が伝わらず、改善の根拠にならない。"]},{"id":"au-167","type":"mc","chapterIndex":5,"stem":"指摘事項の優先度の決め方として、最も適切なものはどれか。","options":["指摘の件数が多い部門の指摘を、一律に優先させることを原則とし、部門ごとの件数の多さを優先度の基準として、その順序で報告する。","優先度は、被監査部門が希望する順番に従って決め、部門の要望を尊重する立場から、報告の順序も同じ基準に合わせて示す。","影響の大きさと発生可能性で優先度を付け、経営判断に資するように示す。","指摘の件数が多い部門の指摘を一律に優先させ、影響の大きさや発生可能性は考慮せず、被監査部門の要望を踏まえて、報告の順序と内容の両方を決めて示す。"],"correctIndex":2,"explanations":["× 誤り。件数だけで優先させると、影響の大きい指摘が後回しになる。","× 誤り。被監査部門の希望で決めると、監査の客観性が損なわれる。","○ 正しい。影響と発生可能性の両面で判断すると、経営者が対応の順序を決められる。","× 誤り。被監査部門の要望で順序を決めると、影響の大きさが反映されない。"]},{"id":"au-168","type":"mc","chapterIndex":5,"stem":"保証型の監査で、監査範囲に制約があった場合の結論の表し方として、最も適切なものはどれか。","options":["制約を無視して、全体について無条件の結論を述べる。","制約のある部分を伏せて、全体の結論だけを示す。","制約がある場合は、報告を終える。","制約のある部分を除いて結論を述べ、その旨と理由を明記する。"],"correctIndex":3,"explanations":["× 誤り。制約を無視した無条件の結論は、保証の範囲を偽ることになる。","× 誤り。制約を伏せると、読み手が結論の限界を知ることができない。","× 誤り。結論を述べずに終えると、依頼者が監査の結果を判断できない。","○ 正しい。制約の範囲を明確にすれば、確認できた部分の結論を読み手に伝えられる。"]},{"id":"au-169","type":"mc","chapterIndex":5,"stem":"監査報告の結論として、不適切なものはどれか。","options":["十分な証拠がない事項について、断定的な結論を述べること。","確認した範囲と結果を、証拠に基づいて記載すること。これは、読み手が結論の根拠を検証できるようにするための基本的な要件である。","結論の前提となる限界や制約を、明確に記載すること。","指摘と結論の関係を明記すること。"],"correctIndex":0,"explanations":["○ 正しい。十分な証拠がない事項の断定は、報告の信頼性を損なう。","× 適切。確認範囲と結果を証拠で示すことは、報告の基本であり適切である。","× 適切。限界と制約の明記は、結論の信頼性を読み手が判断するために適切である。","× 適切。指摘と結論の関係の明記は、読み手の理解を助けるため適切である。"]},{"id":"au-170","type":"mc","chapterIndex":5,"stem":"監査人の報告先について、独立性の観点から最も適切なものはどれか。","options":["監査人は被監査部門の管理者に報告し、その管理者が依頼者へ伝えることが望ましい。","監査人は被監査部門の上司ではなく、監査の依頼者に直接報告できる体制であることが望ましい。","監査人の報告先は被監査部門の判断によって決め、依頼者への直接の報告は、被監査部門の管理者が認めた場合に限るものとし、その判断の経緯も併せて記録する。","監査人は報告先を持たず、監査の結果は組織内で自由に扱うことが望ましく、結果を誰にどのように伝えるかも、必要に応じて各部門の判断に任せる。"],"correctIndex":1,"explanations":["× 誤り。管理者を経由すると、被監査部門の影響が結果に及び、独立性が損なわれる。","○ 正しい。直接報告できる体制は、被監査部門の影響を受けずに結果を伝える前提になる。","× 誤り。被監査部門の判断で報告先を決めると、独立性が確保されない。","× 誤り。報告先がなく結果を自由に扱うと、監査の結果が適切に伝わらない。"]},{"id":"au-171","type":"mc","chapterIndex":5,"stem":"監査報告書の機密管理として、最も適切なものはどれか。","options":["報告書は関係者が閲覧しやすいように組織内で広く配布し、機密区分の表示や保管、廃棄の方法は、各部門の判断に任せることを基本とする。","報告書は、機密性が低いため、保管や廃棄の方法を定める必要はなく、各自の判断で扱ってよく、配布先の制限も設けなくてよい。","報告書は配布先を限定し、機密区分に応じて保管と廃棄の方法を定める。","報告書は、監査の終了後に全従業員に公開し、透明性を確保するため、機密区分の表示は省き、誰でも閲覧できる状態で保管し、保管期間も定めない。"],"correctIndex":2,"explanations":["× 誤り。広く配布し、扱いを各部門任せにすると、機密情報が漏えいする恐れがある。","× 誤り。機密性が低いとは限らず、保管と廃棄の方法を定めないのは不適切である。","○ 正しい。配布先と保管、廃棄を機密区分に応じて定めることで、情報の漏えいを防げる。","× 誤り。全従業員に公開すると、機密情報の保護が損なわれ、報告の目的に反する。"]},{"id":"au-172","type":"mc","chapterIndex":6,"stem":"フォローアップの期限の定め方として、最も適切なものはどれか。","options":["すべての指摘に同じ期限を一律に設定する。","期限は経営者が一方的に決める。","期限は設けず、完了の報告だけを受ける。","指摘の重要度に応じて期限を定め、経営者と合意する。"],"correctIndex":3,"explanations":["× 誤り。一律の期限では、重要度に応じた対応の優先順位が反映されない。","× 誤り。経営者だけで期限を決めると、監査人の確認と合意の手続きがない。","× 誤り。期限を設けないと、改善の遅れを把握できず、残るリスクを管理できない。","○ 正しい。重要度に応じた期限と合意により、対応の優先順位と実効性が確保される。"]},{"id":"au-173","type":"mc","chapterIndex":6,"stem":"報告後の対応として、最も適切なものはどれか。","options":["監査人は改善の進捗を一定期間ごとに確認し、その結果を依頼者に報告する。","報告書を出せば、監査人の役割は終わる。","改善の進捗は、被監査部門が必要と判断したときだけ報告すればよく、監査人は報告の時期や内容に関与せず、依頼者にも改めて連絡しないものとする。","改善の進捗は、次回の監査で一括して確認する。"],"correctIndex":0,"explanations":["○ 正しい。定期的な確認と報告により、改善の遅れを早期に把握できる。","× 誤り。報告書の提出で役割が終わると、改善が行われず、監査の効果がなくなる。","× 誤り。被監査部門の判断に任せると、監査人の確認と報告の機会が失われる。","× 誤り。次回の監査まで待つと、改善の遅れに対応できず、途中の報告が必要である。"]},{"id":"au-174","type":"mc","chapterIndex":6,"stem":"未改善の重大な指摘がある場合の次回監査の計画として、最も適切なものはどれか。","options":["次回の監査計画には組み込まず、経過を見る。","次回の監査計画に優先的に組み込み、改善状況を重点的に確認する。","未改善の指摘は監査の対象から外して記録を残さず、次回の監査では新しい指摘の確認に専念し、経営者の判断に任せることが望ましい。","未改善の指摘は、次回の監査で扱わず、経営者の判断に任せ、改善の状況は監査人が確認する必要のない事項として整理する。"],"correctIndex":1,"explanations":["× 誤り。計画に組み込まないと、重大な未改善の指摘への確認が行われない。","○ 正しい。重大な未改善事項を重点的に確認することで、リスクの継続を防げる。","× 誤り。記録を残さず対象から外すと、未改善の指摘が放置される。","× 誤り。次回の監査で扱わないと、重大な指摘の改善状況を確認できない。"]},{"id":"au-175","type":"mc","chapterIndex":5,"stem":"助言型監査の結論の扱いとして、最も適切なものはどれか。","options":["保証型と同じく、適切か不適切かの意見表明を必ず行い、その意見の根拠となる詳細な判定の基準と評価の過程を、報告書の本文に全て記載する。","結論を示さず、監査の実施経過と作業時間の内訳のみを報告し、問題点や改善の提言は、被監査部門が必要と判断したときに個別に伝える。","保証を与える結論の代わりに、問題点と改善の提言を示すことが中心になる。","結論は、被監査部門が満足する表現に調整して示し、指摘の内容は要望に応じて伏せ、改善の提言も依頼者の希望に合わせて修正する。"],"correctIndex":2,"explanations":["× 誤り。助言型は保証の意見表明を行わないので、保証型と同じ扱いにはならない。","× 誤り。結論を示さず作業時間のみを報告すると、改善に役立つ提言が伝わらない。","○ 正しい。助言型では、保証のための意見表明より、問題点と改善の提言が中心になる。","× 誤り。被監査部門の満足に合わせた結論は、監査の客観性を損なう。"]},{"id":"au-176","type":"mc","chapterIndex":5,"stem":"保証報告書の読み手への説明として、最も適切なものはどれか。","options":["保証報告書は、範囲の説明を省く。","保証の範囲は、報告書の末尾にのみ記載する。","保証報告書は、専門的な内容のため、説明を簡略化して示さない。","保証の範囲と水準を明示し、読み手が保証の限界を理解できるようにする。"],"correctIndex":3,"explanations":["× 誤り。保証の範囲を説明しないと、読み手が保証の内容を誤って理解する。","× 誤り。保証の範囲を末尾だけに記載すると、読み手が本文で範囲を確認できない。","× 誤り。専門的な内容であっても、読み手が保証の内容を理解できるよう説明を工夫することが必要である。","○ 正しい。保証の範囲と限界を明示すると、読み手が誤解なく利用できる。"]},{"id":"au-177","type":"mc","chapterIndex":4,"stem":"指摘事項を報告する前に行うべき確認として、最も適切なものはどれか。","options":["被監査部門と事実関係を確認し、認識の相違を解消してから報告する。","事実関係は確認せず、指摘を確定させる。","被監査部門に知らせずに報告して驚きを与えることが望ましく、被監査部門の反応を見て、報告の内容を後から変えるかどうかを決める。","事実の確認は、報告を出した後にまとめて行う。"],"correctIndex":0,"explanations":["○ 正しい。事実の確認と認識の統一により、指摘の妥当性と受け入れやすさが高まる。","× 誤り。事実を確認せずに指摘を確定させると、誤った指摘になる恐れがある。","× 誤り。被監査部門に知らせず報告すると、事実誤認を正す機会を失う。","× 誤り。報告後の確認では、誤りの修正が遅れ、報告の信頼性を損なう。"]},{"id":"au-178","type":"mc","chapterIndex":5,"stem":"改善提案の範囲として、最も適切なものはどれか。","options":["監査人は、改善の具体的な実施方法をすべて決め、経営者に実施を命じ、その結果が出るまで監査人が改善の進め方を直接管理する。","監査人は具体的な実施方法を決めず、経営者が判断できる選択肢を示す。","監査人は、改善提案を示さず、経営者の判断に任せる。","監査人は、改善の効果を保証するため、実施後の結果を必ず監査人が担当し、経営者の関与は報告の受領に限る。"],"correctIndex":1,"explanations":["× 誤り。監査人が実施方法を決めると、経営者の責任と判断が損なわれる。","○ 正しい。選択肢を示すことで、経営者が実情を踏まえて判断できる。","× 誤り。改善提案を示さないと、経営者が改善の方向を判断する材料がない。","× 誤り。監査人が結果を担当すると、監査の独立性が損なわれ、改善の責任も移る。"]},{"id":"au-179","type":"mc","chapterIndex":5,"stem":"監査報告書の構成として、最も適切なものはどれか。","options":["詳細な経緯を冒頭に示し、経過と時系列の説明を先に行い、結論と主要な指摘は末尾にまとめることで、読み手が全体の流れを理解してから結論に至れるようにする。","すべての指摘を同じ分量で時系列に並べ、結論や要点は示さず、読み手が報告書全体を読み進めて自ら判断できるよう構成して記載する。","結論と主要な指摘を冒頭に示し、詳細は別添とすると、読み手が要点を把握しやすい。","報告書は、読み手の専門性に関係なく、統一した形式で詳細まで記載し、要点の整理は読み手に任せることを基本とする。"],"correctIndex":2,"explanations":["× 誤り。経緯を冒頭に置くと、読み手が結論にたどり着くまでに時間がかかる。","× 誤り。結論を示さず読み進めさせると、読み手が要点を把握しにくくなる。","○ 正しい。結論と要点を先に示すことで、経営者が重要事項を素早く判断できる。","× 誤り。詳細を全て統一形式で記載すると、読み手の専門性に応じた要点が伝わらない。"]},{"id":"au-180","type":"mc","chapterIndex":6,"stem":"監査の終結として、最も適切なものはどれか。","options":["監査報告の提出だけで終了し、フォローアップ計画は合意しなくてよい。","監査の結論が出た時点で終了し、報告書の提出は省略する。","監査は一度終わると再開しないため、指摘の改善状況は確認しない。","監査報告の提出と、指摘事項のフォローアップ計画の合意をもって監査を終える。"],"correctIndex":3,"explanations":["× 誤り。フォローアップ計画を合意しないと、指摘の改善が追跡されなくなる。","× 誤り。報告書を提出しないと、依頼者が監査の結果を把握できない。","× 誤り。改善状況を確認しないと、指摘事項が解消されたかを判断できない。","○ 正しい。報告とフォローアップの合意がそろって、監査の責任が果たされる。"]}];

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

async function startReview() {

  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}
