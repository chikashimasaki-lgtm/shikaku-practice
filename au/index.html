<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>システム監査技術者 問題集（仮問題）</title>
<meta name="robots" content="noindex,nofollow">
<script>
(function () {
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === "withSuccessHandler") return function (f) { return make(f, fail); };
      if (name === "withFailureHandler") return function (f) { return make(ok, f); };
      return function () {
        var reading = /^(apiLoad|apiGet)/.test(String(name));
        setTimeout(function () {
          if (reading) { if (ok) ok(null); }
          else if (fail) fail(new Error("公開版では記録・AI助言は使えません"));
        }, 0);
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
  <style>
    :root {
      --theme-color: #2d4f6b;
      --theme-color-dark: #18303f;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon { font-size: 32px; }

.header-text { min-width: 0; flex: 1 1 140px; }   /* ボタンに押されてタイトルが1文字幅に潰れ、縦書きのように見えるのを防ぐ */
.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; writing-mode: horizontal-tb; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.quiz-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

.screen { width: 100%; max-width: 520px; margin: 0 auto; }

/* --- モード選択画面 --- */
/* カード数が増えても幅が細くなりすぎないよう、flexではなくgridで自動折り返しする
   （4つ目の「追加問題2」追加時にスマホで窮屈にならないための変更）。 */
.mode-select {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.mode-card {
  min-width: 0;
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.mode-card:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

/* 復習モードのカードだけ、出題元の問題集カードと見分けられるよう薄く色を敷く。 */
.review-card {
  background: #fffaf2;
  border-color: #f0d9b5;
}
.review-card:hover { border-color: #e0a75e; }
.mode-card:disabled { opacity: 0.6; cursor: wait; }

.mode-icon { font-size: 36px; margin-bottom: 8px; }
.mode-title { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 4px; }
.mode-desc { font-size: 13px; color: #888; }

/* --- 範囲選択画面（全部 / 章ごとにチャレンジ） --- */
.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 4px 0;
  font-family: inherit;
}

.back-link:hover { color: var(--theme-color); }

.scope-select {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-all-btn {
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  margin-bottom: 8px;
}

.scope-all-btn:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

.scope-all-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 4px; }
.scope-all-desc { font-size: 13px; color: #888; }

.scope-chapter-heading {
  font-size: 12px;
  font-weight: 700;
  color: #999;
  margin: 4px 0 2px;
}

.scope-chapter-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scope-chapter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 48px;
  background: #f8f9ff;
  border: 1.5px solid #e8eaf6;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.scope-chapter-btn:hover { border-color: var(--theme-color); }

.scope-chapter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.scope-chapter-btn:disabled:hover { border-color: #e6e8ee; }

/* 範囲選択画面の下に出す補足（復習モードの「克服」ルールの説明など） */
.scope-note {
  margin-top: 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.scope-chapter-btn .name { flex: 1; padding-right: 12px; }
.scope-chapter-btn .count { flex-shrink: 0; color: var(--theme-color); font-weight: 700; font-size: 13px; }

/* --- 出題画面 --- */
.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.chapter-label {
  text-align: center;
  font-size: 12px;
  color: var(--theme-color);
  font-weight: 600;
  margin-bottom: 16px;
}

.question-card {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stem {
  font-size: 15.5px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.option-btn:hover { border-color: var(--theme-color); }

.option-btn.selected {
  border-color: var(--theme-color);
  background: #f0f0ff;
  font-weight: 600;
}

.option-btn.tf-btn {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

/* 回答後の表示状態 */
.option-btn.correct {
  border-color: #2e7d32;
  background: #e8f5e9;
}

.option-btn.incorrect {
  border-color: #c62828;
  background: #fdecea;
}

.option-btn:disabled { cursor: default; }

.option-badge {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
}

.option-explain {
  display: block;
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.6;
  font-weight: 400;
}

.answer-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.answer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 回答（複数選択のときだけ表示）とスキップを縦に並べる操作行。
   mc / tf は選択した時点で判定するため、この行にはスキップだけが残る。 */
.question-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.skip-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  background: white;
  color: #888;
  border: 1.5px solid #e6e8ee;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.skip-btn:hover { border-color: var(--theme-color); color: var(--theme-color); }

.reveal-area { margin-top: 20px; }

.reveal-options { margin-bottom: 16px; }

.reveal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.action-btn:hover { border-color: var(--theme-color); }

.action-btn.primary {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
}

/* --- 終了サマリー画面 --- */
#screenSummary { text-align: center; }
#screenSummary h2 { font-size: 22px; color: #333; margin-bottom: 16px; }

.summary-score {
  font-size: 32px;
  font-weight: 700;
  color: var(--theme-color);
  margin-bottom: 20px;
}

.summary-chapters {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.summary-chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}

.summary-chapter-row .name { color: #333; }
.summary-chapter-row .score { color: var(--theme-color); font-weight: 700; }

.summary-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 間違えた問題だけを解き直すボタン。記録ボタンの次に置いて目に入るようにする。 */
.action-btn.retry-wrong {
  border-color: #f0d9b5;
  background: #fffaf2;
  color: #a1670f;
  font-weight: 700;
}
.action-btn.retry-wrong:hover { border-color: #e0a75e; }

.summary-note {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.record-status,
.advice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #888;
  min-height: 18px;
}

.advice-area {
  margin-top: 12px;
  text-align: left;
  white-space: pre-wrap;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 12px;
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #333;
}

.quiz-body::-webkit-scrollbar { width: 5px; }
.quiz-body::-webkit-scrollbar-track { background: transparent; }
.quiz-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

/* --- PCブラウザ（幅900px以上）: 画面幅を広く使う ---
   以前は .screen が max-width:520px の中央寄せで、PCでは画面の中央に細い1列が出るだけだった（2026-09-20 に変更）。
   スマホ（600px以下）の指定とは範囲が重ならない。行が長くなりすぎないよう、上限は 1120px（1400px以上は 1240px）。
   ボタン類は横いっぱいに伸ばさず、中央に寄せた幅に留める。 */
@media (min-width: 900px) {
  .header { padding: 18px 40px; }
  .header-text h1 { font-size: 20px; }
  .header-text p { font-size: 13px; }
  .header-btn { font-size: 12px; padding: 7px 14px; }

  .quiz-body { padding: 32px 48px; }
  .screen { max-width: 1120px; }

  /* モード選択: カードを横に並べて広く使う（4枚なら1行） */
  .mode-select { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 16px; }
  .mode-card { padding: 30px 20px; }
  .mode-icon { font-size: 40px; }
  .mode-title { font-size: 18px; }
  .mode-desc { font-size: 14px; }

  /* 範囲選択: 章のボタンを2列に（章が多くても縦に長くなりすぎない） */
  .scope-chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  .scope-chapter-btn { font-size: 15px; }

  /* 出題: 問題文・選択肢を広く、文字も一段大きく */
  .question-card { padding: 28px 36px; }
  .stem { font-size: 18px; line-height: 1.8; }
  .options { gap: 12px; }
  .option-btn { font-size: 16px; padding: 14px 20px; }
  .answer-btn, .action-btn, .skip-btn { max-width: 520px; margin-left: auto; margin-right: auto; }
  .question-actions { align-items: center; }
  .question-actions .answer-btn, .question-actions .skip-btn { width: 100%; }
  .summary-note, .scope-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .reveal-actions { align-items: stretch; }

  /* 終了サマリー: 章別の結果を2列に */
  .summary-chapters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .summary-chapter-row { font-size: 14.5px; padding: 12px 16px; }
  .summary-actions { align-items: center; }
  .summary-actions .action-btn { width: 100%; }
}

@media (min-width: 1400px) {
  .screen { max-width: 1240px; }
}

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 8px 10px; flex-wrap: wrap; }   /* 狭い画面ではボタン類を2行目へ折り返す */
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 16px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; flex-wrap: wrap; flex-basis: 100%; margin-left: 0; }
  .header-btn { font-size: 11px; padding: 6px 10px; }
  .quiz-body { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .stem { font-size: 16.5px; }
  .option-btn { font-size: 16px; }
  .mode-select { gap: 10px; }
  .mode-card { padding: 16px 8px; }
  .mode-icon { font-size: 26px; margin-bottom: 4px; }
  .mode-title { font-size: 14px; margin-bottom: 2px; }
  .mode-desc { font-size: 11px; }
}

@media (max-height: 480px) {
  .quiz-body { padding-top: 14px; }
  .mode-card { padding: 12px 8px; }
  .mode-icon { font-size: 22px; margin-bottom: 2px; }
}

/* --- 中断した問題集の再開バナー（モード選択画面の先頭） --- */
.resume-banner {
  border: 2px solid var(--theme-color);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.resume-text { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
.resume-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-actions .action-btn { flex: 1 1 140px; width: auto; }

  </style>
<style>#askBtn,#adviceBtn{display:none !important}</style>
</head>
<body>
<div style="background:#fff4d6;color:#5b4300;padding:10px 14px;font-size:14px;line-height:1.6;border-bottom:1px solid #e6c96b">
<strong>非公式・個人作成の仮問題です。</strong>IPA（システム監査技術者試験）・経済産業省（システム監査基準）の公式の試験・規格とは無関係で、公式の出題・難度とは一致しません。事実関係は公式テキストで未照合です。この公開版では成績・途中経過は保存されません。
</div>
<div class="container">
  <div class="header">
    <div class="header-icon">🧭</div>
    <div class="header-text">
      <h1>システム監査技術者 問題集（仮問題）</h1>
      <p id="headerSub">モードを選んでください</p>
    </div>
    <div class="header-actions">
      
      
      
      <button type="button" class="header-btn" id="soundBtn" onclick="toggleSound()">🔊 音</button>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="screen" id="screenMode">
      <div class="resume-banner" id="resumeBanner" style="display:none;">
        <div class="resume-text" id="resumeText"></div>
        <div class="resume-actions">
          <button class="action-btn primary" id="resumeBtn" onclick="resumeProgress()">▶ 続きから再開</button>
          <button class="action-btn" onclick="discardProgress()">破棄</button>
        </div>
      </div>
      <div class="mode-select">
        <button class="mode-card" onclick="chooseMode('mc')">
          <div class="mode-icon">📝</div>
          <div class="mode-title" id="mcTitle">模擬試験</div>
          <div class="mode-desc"><span id="mcCount">0</span>問・<span id="mcKind">4択</span></div>
        </button>
        <button class="mode-card" id="tfCard" onclick="chooseMode('tf')">
          <div class="mode-icon">⭕</div>
          <div class="mode-title">一問一答</div>
          <div class="mode-desc"><span id="tfCount">0</span>問・正誤判定</div>
        </button>
        <button class="mode-card" id="extraCard" onclick="chooseMode('extra')">
          <div class="mode-icon">📘</div>
          <div class="mode-title">追加問題</div>
          <div class="mode-desc"><span id="extraCount">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra2Card" onclick="chooseMode('extra2')">
          <div class="mode-icon">📗</div>
          <div class="mode-title">追加問題2</div>
          <div class="mode-desc"><span id="extra2Count">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra3Card" onclick="chooseMode('extra3')">
          <div class="mode-icon">🆕</div>
          <div class="mode-title">新シラバス仮問題</div>
          <div class="mode-desc"><span id="extra3Count">0</span>問・4択（2027年2月〜の追加分）</div>
        </button>
        <button class="mode-card review-card" id="reviewCard" onclick="chooseMode('review')">
          <div class="mode-icon">🔁</div>
          <div class="mode-title">復習</div>
          <div class="mode-desc" id="reviewCount">間違えた問題だけ</div>
        </button>
      </div>
    </div>

    <div class="screen" id="screenScope" style="display:none;">
      <button class="back-link" onclick="backToModeSelect()">← モード選択に戻る</button>
      <div class="scope-select" id="scopeSelect"></div>
    </div>

    <div class="screen" id="screenQuestion" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="chapter-label" id="chapterLabel"></div>
      <div class="question-card">
        <p class="stem" id="stem"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="question-actions" id="questionActions">
        <button class="answer-btn" id="answerBtn" onclick="reveal()" disabled>回答</button>
        <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">回答せずに次へ →</button>
      </div>
      <div class="reveal-area" id="revealArea" style="display:none;">
        <div class="reveal-options" id="revealOptions"></div>
        <div class="reveal-actions">
          <button class="action-btn" id="askBtn" style="display:none !important" onclick="askInChat()">🤖 チャットに詳しく聞く</button>
          <button class="action-btn primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSummary" style="display:none;">
      <h2>お疲れさまでした！</h2>
      <div class="summary-score" id="summaryScore"></div>
      <div class="summary-chapters" id="summaryChapters"></div>
      <div class="summary-actions">
        <button class="action-btn primary" id="recordBtn" onclick="recordResults()">この回の結果を記録</button>

<script>
  const GAS_WEBAPP_URL = '';
  const EXAM_ID = 'au';
  const EXAM_SHORT_TITLE = 'システム監査技術者';
  const TRACKING_EXAM_ID = 'au';
  const MC_TITLE = '問題集';
  const QUESTIONS = [{"id":"au-1","type":"mc","chapterIndex":0,"stem":"システム監査の目的として最も適切なものはどれか。","options":["情報システムのガバナンス、マネジメント、コントロールの適切性を、独立した立場から点検・評価・検証し、必要に応じて改善のための助言を行うこと。","情報システムの障害原因を技術的に特定し、復旧作業を担当部門に代わって直接行い、再発防止策の実装まで監査人が完了させ、その結果の品質まで保証し、継続的に管理すること。","開発担当者のソースコードを全行レビューし、見つけたバグを監査人が修正すること。","経営者に代わって情報システムへの投資判断を行い、その結果に責任を負うこと。"],"correctIndex":0,"explanations":["○ 正しい。システム監査の目的は、ガバナンス・マネジメント・コントロールの評価と、必要な場合の助言にある。","× 誤り。監査人が復旧作業を代行すると、独立性を損なう。","× 誤り。監査人が修正まで行うと、監査の役割を超え、独立性を損なう。","× 誤り。投資判断は経営者の役割であり、監査人が代行するものではない。"]},{"id":"au-2","type":"mc","chapterIndex":0,"stem":"保証型監査の説明として最も適切なものはどれか。","options":["監査対象の改善策を監査人が自ら設計し、その実装を担当部門に代わって行うことで、改善の成果を確実にする形式の監査。","監査対象の改善策を監査人が設計し、その実装を担当部門に代わって行うこと。","監査人が一定の基準に照らして評価を行い、その結論に対して一定水準の信頼性を利害関係者に提供する形式の監査。","監査人が監査対象の業務を一時的に引き受け、その結果を組織の成果として利害関係者に報告する形式の監査であり、業務の実行責任も監査人が負うもの。"],"correctIndex":2,"explanations":["× 改善策の設計と実装を監査人が行うと、評価者としての独立性を損なう。","× 誤り。監査人が改善策の実装まで担うと、独立した評価ができなくなる。","○ 正しい。保証型監査は、基準に照らした評価の結論に対して信頼性を保証する形式である。","× 誤り。監査人が業務を引き受けると、評価者としての独立性が失われる。"]},{"id":"au-3","type":"mc","chapterIndex":0,"stem":"助言型監査の説明として最も適切なものはどれか。","options":["監査人が保証の結論を表明し、利害関係者が意思決定の根拠として利用できる水準の意見を、監査対象の全体にわたって述べる形式の監査。","監査人が監査対象のあるべき姿（ベストプラクティス等）と比較して、課題を明らかにし、改善のための提言を行う形式の監査。","監査人が監査対象の財務諸表が適正かどうかについて、一定の基準に照らして意見を表明し、その結論に保証を付与する形式の監査であり、利害関係者の判断の根拠となる。","監査人が監査対象の情報資産を自ら管理し、その安全性を担保する責任を担い、障害時の復旧作業まで一貫して引き受ける形式の監査。"],"correctIndex":1,"explanations":["× 誤り。意見の表明と保証は保証型監査の特徴であり、助言型の説明ではない。","○ 正しい。助言型監査は、あるべき姿との比較で課題を示し、改善の提言を行う形式である。","× 誤り。財務諸表の適正性に対する意見表明は財務諸表監査であり、助言型の説明ではない。","× 誤り。監査人が資産を管理すると、独立性が損なわれる。"]},{"id":"au-4","type":"mc","chapterIndex":7,"stem":"システム監査人の独立性を確保するための対応として最も適切なものはどれか。","options":["監査対象部門の管理者を監査チームに加え、現場の業務知識を活かして監査の精度を高めるようにする。","開発を担当したメンバーを監査人に指名し、内部事情を熟知した者が監査を行うようにする。","監査報告書の内容を、監査対象部門の承認を得てから確定させ、事実誤認が起きないようにする。","監査報告の経路を監査対象部門から独立させ、監査人の評価が監査対象部門の判断に左右されないようにする。"],"correctIndex":3,"explanations":["× 監査対象部門の管理者が監査に加わると、監査の客観性を損なう。","× 誤り。内部事情に詳しい者が監査を行う点は、独立性の観点から問題がある。","× 報告内容を監査対象部門が承認すると、監査結論が監査対象の影響を受ける。","○ 正しい。報告経路の独立は、監査人の判断を監査対象から守る基本的な対応である。"]},{"id":"au-5","type":"mc","chapterIndex":3,"stem":"監査証拠の評価に関する基本的な考え方として最も適切なものはどれか。","options":["監査証拠は入手元の独立性・客観性・適時性を考慮し、監査意見を裏付けるのに十分かつ適切なものを用いる。","監査対象部門が作成した説明資料は業務の実態を最もよく反映しているため、監査人の検証を省いても、他の証拠より優先して採用してよいものとされている。","口頭による質問への回答は、記録として残されていれば単独で十分な監査証拠となる。","監査証拠は件数が多いほど信頼性が高まるため、母集団の大きさにかかわらず全件を収集すべきである。"],"correctIndex":0,"explanations":["○ 正しい。証拠は独立性・客観性・適時性と、量と質の両面で評価する。","× 誤り。被監査部門の作成資料は独立性が低く、他の証拠より優先する根拠はない。","× 誤り。口頭の回答のみでは、単独では十分な監査証拠とならない。","× 誤り。件数よりも母集団の特性や重要性に応じた抽出が求められる。"]},{"id":"au-6","type":"mc","chapterIndex":0,"stem":"情報システム監査を実施主体により分類したものとして最も適切な組合せはどれか。","options":["保証型監査と助言型監査という、監査の性質による区分","予備調査","内部監査と外部監査","定期監査と臨時監査、そして随時監査という時期による区分"],"correctIndex":2,"explanations":["× 誤り。保証型と助言型は、監査の性質による分類である。","× 誤り。予備調査は監査の段階であり、実施主体の分類ではない。","○ 正しい。内部監査は組織内部の監査部門が行い、外部監査は外部の監査人に依頼して行う。","× 定期・臨時・随時は、実施の時期による区分である。"]},{"id":"au-7","type":"mc","chapterIndex":0,"stem":"システム監査基準の位置づけとして最も適切なものはどれか。","options":["法律上の強制力を持つ規範であり、これに違反したシステム監査人は、法令に基づく罰則の対象となり、資格も取り消される。","システム監査人の行為規範として、システム監査業務の品質を確保するための基準である。","監査対象組織が独自に定める内部規程であり、組織の外部に依頼した監査にも適用されない、組織内部のみの規定である。","情報セキュリティ管理策を具体的に定めた技術的な実装手順書であり、設定値の指示を含むものである。"],"correctIndex":1,"explanations":["× 誤り。システム監査基準は法的強制力を持つものではない。","○ 正しい。システム監査基準は、監査人の行為規範として品質確保の基準を示す。","× 誤り。外部に依頼した監査にも適用される基準である。","× 基準は実装手順や設定値を定めるものではない。"]},{"id":"au-8","type":"mc","chapterIndex":0,"stem":"システム監査人が監査の判断尺度を選ぶ際に、原則として参照することが望ましいものはどれか。","options":["ベンダーの運用手順書をそのまま判断尺度とすること。","過去の監査指摘事項を一覧にし、そのまま判断尺度とすること。","監査人個人の経験による目安を、明文化せず用いること。","システム管理基準、またはこれを組織の特性や状況に応じて編集した基準や規程。"],"correctIndex":3,"explanations":["× 誤り。ベンダーの手順書は組織の監査基準ではない。","× 誤り。過去の指摘は判断尺度として適切ではない。","× 誤り。明文化されていない個人の経験則は尺度として適切でない。","○ 正しい。システム管理基準は、システム監査の判断尺度として参照することが望ましいとされている。"]},{"id":"au-9","type":"mc","chapterIndex":1,"stem":"システム監査人が監査を計画する際、独立性の観点から最も避けるべき行為はどれか。","options":["監査対象の設計書の作成や変更に、監査人自身が関与して、その内容を監査で評価すること。","監査対象部門と報告書の草案の事実関係を確認し、誤認がないかを検証すること。","監査計画を責任者が承認し、手続の分担を事前に決めること。","監査対象部門から要望を聞き取った上で、監査範囲の優先順位を監査人が自ら判断して決めること。"],"correctIndex":0,"explanations":["○ 正しい。自らが作成した設計を評価すると、評価の客観性を損なうため避けるべきである。","× 誤り。事実確認は独立性を損なわない、望ましい手続である。","× 誤り。計画の承認と分担の事前決定は、独立性を損なう行為ではなく望ましい統制である。","× 要望を聞き取った上で、監査人が優先順位を判断することは適切であり、独立性を損なわない。"]},{"id":"au-10","type":"mc","chapterIndex":0,"stem":"情報システム監査における監査目的の説明として最も適切なものはどれか。","options":["監査人が監査に要した工数と費用の上限を、監査開始前に監査対象部門と合意しておくための取り決め。","監査報告書の体裁と様式を統一するために、監査部門が定めた書式の指定と記載上の注意事項の一覧。","監査によって達成しようとする目標を示し、評価の対象と評価の基準を明確にしたもの。","監査対象部門の作業量を減らすための、監査範囲の縮小方針。"],"correctIndex":2,"explanations":["× 工数と費用の合意は監査の運営上の取り決めであり、監査目的そのものではない。","× 報告書の書式は監査の成果物の形式であり、監査目的ではない。","○ 正しい。監査目的は、何を評価するか（対象）と何に照らすか（基準）を明確にするものである。","× 誤り。監査目的は、監査の工数や対象部門の負担を減らすことではない。"]},{"id":"au-11","type":"mc","chapterIndex":4,"stem":"監査人が保証型監査において意見を表明する前提として、最も重要なものはどれか。","options":["監査対象部門の管理者から、監査結果に異議を唱えないという確約を文書で得ておくこと。","十分かつ適切な監査証拠を入手し、その証拠に基づいて結論を導けていること。","監査報告書の作成に、監査対象部門の担当者が立ち会い、その場で内容の承認を得ておくこと。","監査計画の段階で、監査対象のすべての統制の不備を事前に把握し、報告の対象から外しておくこと。"],"correctIndex":1,"explanations":["× 異議を唱えない確約は独立性を損ない、意見表明の前提にはならない。","○ 正しい。意見は十分かつ適切な監査証拠に基づいて表明する必要がある。","× 報告内容への立ち会いと承認は独立性を損なう。","× 不備を事前に除外することは、監査の目的に反する。"]},{"id":"au-12","type":"mc","chapterIndex":7,"stem":"監査人の『外観上の独立性』の説明として最も適切なものはどれか。","options":["監査人が自らの内面で、監査対象に影響されずに公正な判断を行うことができる状態を保つこと。","監査人が監査対象の業務改善を自ら実施し、その結果を次の監査で評価するという手順を踏むこと。","監査人が監査報告書の作成工数を、監査対象部門の要望に合わせて調整すること。","第三者から見て、監査人が監査対象との利害関係によって判断を歪められていないと認められる状態を保つこと。"],"correctIndex":3,"explanations":["× これは精神的独立性の説明であり、外観上の独立性の説明ではない。","× 改善の実施と次の監査での評価は自己評価となり、独立性を損なう。","× 誤り。監査対象部門の要望で工数を決めると、外観上の独立性を損なう。","○ 正しい。外観上の独立性は、第三者から見た客観性の確保を指す。"]},{"id":"au-13","type":"mc","chapterIndex":5,"stem":"保証型監査と助言型監査の結論の性質の違いとして最も適切なものはどれか。","options":["保証型監査は監査人が結論を表明して信頼性を保証し、助言型監査は改善のための提言を中心とする。","助言型監査は保証の結論を表明するが、保証型監査は改善のための提言を行わないという違いがあり、利害関係者の判断に直接用いられる点が特徴である。","保証型監査も助言型監査も、結論の表明と提言の双方を同じ分量で行う。","保証型監査は監査対象の業務を代行し、助言型監査は業務を監視する。"],"correctIndex":0,"explanations":["○ 正しい。保証型は結論の信頼性を示し、助言型は改善の提言を中心とする。","× 保証と助言の関係が逆になっている。","× 誤り。保証と助言の分量は決まっておらず、同じ分量と定めるものではない。","× 誤り。監査人が業務を代行・監視するのは監査の性質に反する。"]},{"id":"au-14","type":"mc","chapterIndex":3,"stem":"監査手続の説明として最も適切なものはどれか。","options":["監査対象の業務全体を、一定期間ごとに監査人が一括して確認し、その結果を年次報告書にまとめる作業。","監査対象の改善策を監査人が設計し、その実装が完了した後に、その結果を次年度の監査計画へ反映すること。","監査目的を達成するため、監査人が監査証拠を入手するために実施する具体的な作業の方法と手順。","管理者の判断を尊重し、妥当性は検討せず結論に反映させる。"],"correctIndex":2,"explanations":["× 一括確認は監査手続の一般的な説明ではなく、個別の手続の集合を指すものではない。","× 改善策の設計は監査人の役割を超えており、独立性を損なう。","○ 正しい。監査手続は、監査証拠を入手するための具体的な方法である。","× 誤り。判断の妥当性を検討せず反映させると、監査の客観性を損なう。"]},{"id":"au-15","type":"mc","chapterIndex":7,"stem":"監査人の専門能力の維持に関して最も適切なものはどれか。","options":["一度取得した資格があれば、以後は技術や基準の変化に関係なく、同じ知識で監査を行うことができる。","最新の技術動向や監査基準の改訂に対応し、必要な専門知識を継続的に更新する。","監査対象組織の業務知識だけを深めれば、監査に必要な専門能力は十分に確保されると考える。","専門能力は監査チーム全体で補うものとし、監査人一人ひとりが自らの能力を高める必要はない。"],"correctIndex":1,"explanations":["× 資格取得後も、技術や基準の変化に対応して知識を更新する必要がある。","○ 正しい。専門能力の維持には、継続的な学習と知識の更新が必要である。","× 業務知識だけでは、監査に必要な技術・基準の専門性を補えない。","× チーム全体で補うだけでは、各監査人の専門性の欠如を解消できない。"]},{"id":"au-16","type":"mc","chapterIndex":3,"stem":"監査調書（ワーキングペーパー）の位置づけとして最も適切なものはどれか。","options":["作業結果を一時的に保管し、報告後は速やかに廃棄するもの。","監査対象部門に提出し、承認を得て結論を確定させる公式文書。","監査人の個人的な覚え書きで、品質管理や検証の対象にはならない。","監査の実施過程と結論の根拠を記録し、監査の品質を事後に検証できるようにするためのもの。"],"correctIndex":3,"explanations":["× 誤り。監査調書は、品質の事後検証のため一定期間保管する。","× 誤り。監査調書は、監査対象部門の承認で結論を決めるものではない。","× 誤り。監査調書は、品質管理や第三者による検証の対象になる。","○ 正しい。監査調書は、作業と結論の根拠を記録し、事後の検証を可能にするものである。"]},{"id":"au-17","type":"mc","chapterIndex":1,"stem":"監査範囲の決定に関して最も適切なものはどれか。","options":["監査目的とリスクの大きさに応じて、監査対象とする組織・システム・業務プロセスを定める。","監査対象の範囲は、監査人の関心が高い領域を優先して決め、監査目的との関連性は事後に確認して調整するものとする。","監査範囲は監査対象部門の希望に沿って決める。","前回の監査範囲を原則として維持し、リスクの変化には対応しない。"],"correctIndex":0,"explanations":["○ 正しい。範囲は監査目的とリスクに基づいて決める。","× 誤り。監査範囲は監査目的との関連で定めるものであり、関心の高さで決めるものではない。","× 誤り。監査対象部門の希望だけで範囲を決めると、独立性を損なう。","× 誤り。リスクの変化に対応しない範囲では、監査の目的を果たせない。"]},{"id":"au-18","type":"mc","chapterIndex":5,"stem":"監査報告書を作成する際の最も重要な留意点として最も適切なものはどれか。","options":["指摘事項は、監査対象部門が受け入れやすい表現を選び、改善の必要性と影響の記載を控えめにすること。","指摘事項は、監査人の経験に基づく印象を中心に記述し、客観的な証拠の記載は必要最小限にとどめること。","指摘事項を事実と証拠に基づいて記述し、改善の必要性と影響を明確にすること。","指摘事項の数を多くし、影響度は記載せず一律に扱う。"],"correctIndex":2,"explanations":["× 受け入れやすさを優先して影響を控えめにすると、報告の客観性と有用性を損なう。","× 印象を中心に記述すると、事実と証拠に基づく報告の原則に反する。","○ 正しい。報告は事実・証拠・影響・改善の必要性を明確にすることが基本である。","× 誤り。影響度を区別せず一律に扱うと、報告の有用性が下がる。"]},{"id":"au-19","type":"mc","chapterIndex":7,"stem":"監査の品質管理の仕組みとして最も適切なものはどれか。","options":["監査人の作業は、個々の監査人の判断に任せ、事後のレビューは監査対象からの苦情があった場合にだけ行う。","監査人の作業を監査責任者がレビューし、監査手続と結論が基準に適合しているかを確認する。","監査の品質は監査人の経験年数で保証されるため、レビューの仕組みを設ける必要はないと判断する。","監査報告書は、監査対象部門の承認を得てから提出することで、品質の検証に代えるものとし、監査責任者のレビューは不要とする。"],"correctIndex":1,"explanations":["× 苦情を契機とするだけでは、事前と事後の体系的な品質管理にならない。","○ 正しい。監査責任者による作業のレビューは、基準適合性を確保する基本的な仕組みである。","× 経験年数だけでは品質を保証できず、レビューの仕組みが必要である。","× 誤り。被監査部門の承認は品質の検証に代わるものではない。"]},{"id":"au-20","type":"mc","chapterIndex":0,"stem":"情報システム監査の対象の説明として最も適切なものはどれか。","options":["人事評価制度と面談記録の保存状況に限る。","従業員の行動を日々監視し、人事部門の判断材料とする。","外部ベンダーの社内検査の方法と結果に限る。","情報システムのガバナンス、マネジメント、コントロールの状況。"],"correctIndex":3,"explanations":["× 誤り。人事評価は情報システム監査の対象の中心ではない。","× 誤り。日々の行動監視は監査の対象・目的ではない。","× 誤り。外部ベンダーの社内検査は、監査対象組織の情報システムの監査ではない。","○ 正しい。システム監査の対象は、ガバナンス・マネジメント・コントロールである。"]},{"id":"au-21","type":"mc","chapterIndex":1,"stem":"監査における『重要性』の考え方として最も適切なものはどれか。","options":["事象が監査目的や利害関係者の判断に影響を与える程度を基準にして、対応の優先度を定める。","金額の大小だけを基準に判断し、質的影響は考慮しない。","監査人が重要と感じた事象をすべて監査報告書に記載し、その後に優先度を判断するという順序を取る。","監査対象部門の判断に従い、一律に定める。"],"correctIndex":0,"explanations":["○ 正しい。重要性は、監査目的と利害関係者の判断への影響で判断する。","× 誤り。金額だけでなく質的影響も重要性の判断に含める。","× すべてを記載してから優先度を判断するのは、報告の焦点を失わせる。","× 誤り。重要性は、監査対象部門ではなく監査目的に照らして判断する。"]},{"id":"au-22","type":"mc","chapterIndex":5,"stem":"監査人が監査意見に制約を付すべき状況として最も適切なものはどれか。","options":["監査対象部門の協力が十分に得られ、必要な証拠を確実に入手できた場合で、報告書の表現を見直した場合。","監査報告書の記載内容について、監査対象部門から軽微な表現の修正を求められた場合。","監査人が結論を導くために必要な監査証拠を入手できず、その影響が重要であると判断した場合。","監査人の専門能力が十分でなかったと感じたが、結論への影響は軽微であると判断し、そのまま意見を表明した場合。"],"correctIndex":2,"explanations":["× 誤り。必要な証拠を入手できていれば、制約を付す状況にはならない。","× 表現の修正は制約の理由にならず、独立性の観点で慎重に扱うべき事項である。","○ 正しい。証拠の制約が重要であれば、その旨を意見に反映する必要がある。","× 誤り。専門能力に不足があるなら、結論への影響を見極めて対応すべきである。"]},{"id":"au-23","type":"mc","chapterIndex":7,"stem":"システム監査人の行為規範として最も適切なものはどれか。","options":["監査人は、監査対象部門の意向に配慮して報告内容を調整し、関係者間の良好な関係を維持することを最優先に、報告の表現を穏当なものへ調整する。","監査人は、独立性・客観性・専門能力・正当な注意を保持し、監査の結果を公正に報告する。","監査人は、自らの専門性を示すために、監査報告書に専門用語を多用し、利用者の理解を重視しない。","監査人は、監査の結果が組織に与える影響を考慮して、重要な指摘事項を報告しないことも許容される。"],"correctIndex":1,"explanations":["× 誤り。監査人は、意向への配慮で報告内容を変えてはならない。","○ 正しい。独立性、客観性、専門能力、正当な注意は、監査人の基本的な規範である。","× 利用者の理解を軽視した報告は、報告の有用性を損なう。","× 重要な指摘を報告しないことは、公正な報告の義務に反する。"]},{"id":"au-24","type":"mc","chapterIndex":4,"stem":"監査対象部門から監査結論を変更するよう要請を受けた場合の対応として最も適切なものはどれか。","options":["要請の内容を記録し、監査対象部門との関係を損なわないように、結論の表現を穏当なものへ変更する。","要請を受けた時点で監査人の判断は揺らいだものとみなし、監査対象部門の見解を結論に反映させる。","要請を社内評価への影響から記録せず、口頭で了解したことにして報告書を作成する。","要請の内容を記録し、事実と証拠に基づく監査結論を維持するとともに、必要に応じて上位の監査責任者へ報告する。"],"correctIndex":3,"explanations":["× 結論の表現を変えるのは、結論の実質を変えることになり、独立性と公正性を損なう。","× 監査対象部門の見解を結論に反映させると、独立性を損なう。","× 誤り。要請を記録しないことは、事実と証拠に基づく結論の維持と両立しない。","○ 正しい。要請を記録し、事実と証拠に基づく結論を維持して上位へ報告することが適切である。"]},{"id":"au-25","type":"mc","chapterIndex":7,"stem":"監査の計画・実施・報告に一貫して求められる姿勢として最も適切なものはどれか。","options":["監査対象の事実と証拠に基づき、偏りのない判断を行うこと。","監査対象部門の協力を最優先にし、対立を避けるために指摘事項の数を抑えること。","経験と直感で判断し、証拠がなくても結論とすること。","監査の結論確定まで、進捗を一切伝えないこと。"],"correctIndex":0,"explanations":["○ 正しい。監査の一貫した姿勢は、事実と証拠に基づく偏りのない判断である。","× 協力を優先して指摘を抑えると、監査の客観性を損なう。","× 誤り。証拠に基づかない判断は、監査の姿勢として認められない。","× 誤り。進捗の共有を完全に断つことは、適切な監査の姿勢ではない。"]},{"id":"au-26","type":"mc","chapterIndex":1,"stem":"リスクアプローチの考え方として最も適切なものはどれか。","options":["監査対象のすべての業務プロセスを、リスクの大小にかかわらず同一の時間と手続で確認する方法。","監査対象部門から提示された問題点を中心に監査を行い、それ以外の領域には原則として立ち入らない方法。","監査資源を、リスクの大きい領域に重点的に配分し、効率的かつ効果的に監査を行う方法。","指摘のない領域を優先して監査する方法。"],"correctIndex":2,"explanations":["× 一律の時間と手続は、リスクに応じた効率化の考え方と一致しない。","× 監査対象部門の提示に依存すると、監査の独立性とリスク評価の網羅性を損なう。","○ 正しい。リスクアプローチは、リスクに応じて監査資源を配分する方法である。","× 誤り。指摘の少ない領域を優先すると、リスクの所在を見落とす。"]},{"id":"au-27","type":"mc","chapterIndex":1,"stem":"監査リスクの構成要素の組合せとして最も適切なものはどれか。","options":["経営リスク、財務リスク、運用リスク、法令リスク","固有リスク、統制リスク、発見リスク","情報セキュリティリスク、可用性リスク、完全性リスク","予算リスク、人員リスク、スケジュールリスク"],"correctIndex":1,"explanations":["× 誤り。監査リスクの構成要素は、固有リスク・統制リスク・発見リスクである。","○ 正しい。監査リスクは固有リスク、統制リスク、発見リスクの組合せで捉える。","× 情報セキュリティの三要素等は、情報資産のリスクの分類であり、監査リスクの構成要素ではない。","× 予算・人員・スケジュールは計画上の制約であり、監査リスクの構成要素ではない。"]},{"id":"au-28","type":"mc","chapterIndex":2,"stem":"予備調査の目的として最も適切なものはどれか。","options":["監査対象の全体の事実関係を網羅的に確認し、証拠をすべて得ておくこと。","結論を予備調査の段階で部門と合意し、本調査の確認のみにすること。","不備を予備調査の段階で改善させ、本調査の対象から外すこと。","監査対象の概要と内部統制の状況を把握し、本調査で重点的に検証する範囲とリスクを絞り込むこと。"],"correctIndex":3,"explanations":["× 誤り。予備調査で証拠を網羅的に集めることは目的ではない。","× 誤り。結論を予備調査で決めることは、本調査の意味を失わせる。","× 誤り。不備を理由に対象から外すと、リスクを見落とすおそれがある。","○ 正しい。予備調査は、対象の把握と、本調査でのリスクの絞り込みが目的である。"]},{"id":"au-29","type":"mc","chapterIndex":1,"stem":"監査計画の策定において、監査要点を設定する際の基本的な考え方として最も適切なものはどれか。","options":["監査要点は、監査目的に対応して、確かめるべき観点（例: 網羅性・正確性・適時性・機密性）を具体的に定める。","監査要点は、監査対象部門が確認を希望する事項を中心に、監査人が後から決めればよいものとし、監査手続の結果に応じて随時調整する。","監査要点は、すべての監査で同一の項目を用いることで、監査人による判断の差を防ぐものとする。","監査要点は、監査手続を実施した後に、その結果を整理するための分類として事後に定めるものとする。"],"correctIndex":0,"explanations":["○ 正しい。監査要点は監査目的に対応して具体的に定め、監査手続の設計の出発点とする。","× 誤り。監査要点は、監査対象部門の希望ではなく監査目的に基づいて定める。","× 全監査で同一の項目を用いると、監査目的とリスクに対応しない。","× 監査要点は手続の前に定め、手続の設計の基礎とする必要がある。"]},{"id":"au-30","type":"mc","chapterIndex":1,"stem":"統制リスクの評価として最も適切なものはどれか。","options":["業務そのものの性質から、統制がなくても誤りや問題が生じやすい可能性を、業務の規模や取引の複雑さの観点から評価すること。","監査人が監査手続を実施しても、重要な誤りを見逃してしまう可能性を、監査人の能力や手続の範囲の両面から評価すること。","内部統制が整備されていても、重要な誤りや問題が防止・発見されない可能性を評価すること。","監査対象組織の財務状況が悪化し、経営が継続できなくなる可能性を評価すること。"],"correctIndex":2,"explanations":["× 誤り。統制がなくても生じやすい可能性は固有リスクである。","× 監査人が見逃す可能性は、発見リスクの説明である。","○ 正しい。統制リスクは、統制が重要な誤りや問題を防止・発見できない可能性である。","× 財務状況の悪化は、組織の経営リスクであり、統制リスクの評価ではない。"]},{"id":"au-31","type":"mc","chapterIndex":3,"stem":"監査要点と監査手続の関係として最も適切なものはどれか。","options":["監査要点は監査手続を実施した後の結果を示すものであり、手続の結果を見て、その都度監査要点を事後に決めるものである。","監査要点は確かめるべき観点を示し、監査手続はその観点を検証するための具体的な方法である。","監査要点と監査手続は独立しており、両者を結び付けて検討する必要はないとされており、それぞれ別々の担当者が決める。","監査手続は監査対象部門が指定するものであり、監査要点はそれに合わせて事後に設定するものである。"],"correctIndex":1,"explanations":["× 誤り。監査要点は手続より先に定め、手続はそれを検証する方法である。","○ 正しい。要点が観点を示し、手続がそれを検証する方法となる。","× 誤り。監査要点と手続は結び付けて検討すべきものである。","× 手続は監査人が設計するものであり、監査対象部門が指定すると独立性を損なう。"]},{"id":"au-32","type":"mc","chapterIndex":1,"stem":"監査計画の策定において、監査人が最初に行うべき作業として最も適切なものはどれか。","options":["監査手続の実施方法と証拠の一覧を作成すること。","報告様式と報告日を先に決めておくこと。","人員配置を先に決め、範囲は後で調整すること。","監査の目的と範囲を明確にし、監査の基準を定めること。"],"correctIndex":3,"explanations":["× 誤り。手続の具体化は、目的と範囲の明確化の後に行う。","× 誤り。報告の様式や日程は、最初に行う作業ではない。","× 誤り。範囲を後から調整する進め方は、計画の基本に反する。","○ 正しい。目的・範囲・基準が定まって初めて、計画の他の要素を設計できる。"]},{"id":"au-33","type":"mc","chapterIndex":0,"stem":"年間監査計画で重点対象を選定する際に、最も関係が深い情報として最も適切なものはどれか。","options":["過去の監査結果、障害やインシデントの発生状況、システムの変更状況などのリスク情報。","監査対象部門の職員の出勤状況と、各部門の執務室の配置、及び来訪者の受付記録や入退室の記録を示す情報。","監査人が個人的に関心を持つ技術テーマの一覧と、外部の研修の受講予定。","監査対象組織の年間の備品購入計画と、その購入先の業者の一覧。"],"correctIndex":0,"explanations":["○ 正しい。リスクの大きさを示す情報を用いて、重点対象を選定する。","× 誤り。出勤や執務室配置は、監査の重点対象を選ぶ情報ではない。","× 監査人の関心は選定の根拠とならず、リスクに基づく判断ではない。","× 備品購入計画は、監査のリスクを示す情報とは言えない。"]},{"id":"au-34","type":"mc","chapterIndex":0,"stem":"監査資源の配分に関して最も適切なものはどれか。","options":["すべての監査対象に同一の時間と人員を配分し、公平性を保つことを最優先とし、リスクの違いは配分の判断に一切反映させない。","監査人の経験年数に応じて監査時間を割り当てる。","リスクの大きさに応じて監査時間と人員を配分し、リスクの小さい領域は簡易な手続で対応する。","監査対象部門が求める時間を優先的に配分し、残った時間でリスクの高い領域を監査するという順序で進める方法。"],"correctIndex":2,"explanations":["× 誤り。リスクを配分に反映しない公平性の優先は、効果的な監査資源配分に反する。","× 誤り。経験年数だけで配分すると、リスクの大きさを反映できない。","○ 正しい。監査資源はリスクに応じて配分するのが、リスクアプローチの基本である。","× 誤り。部門の要望を優先すると、リスクの高い領域の監査が不十分になる。"]},{"id":"au-35","type":"mc","chapterIndex":3,"stem":"監査人が統制に依拠する（統制テストを行い、その結果を利用する）判断をするための条件として最も適切なものはどれか。","options":["統制が存在しない業務であっても、監査対象部門の担当者が有効であると口頭で説明しており、その説明を根拠として統制に依拠する場合。","統制の設計と運用を検証でき、統制が有効に機能していると見込まれ、依拠によって実証テストを減らせる場合。","統制の運用状況を確かめないまま、過去に指摘がなかったことのみを根拠として統制に依拠し、実証テストの範囲を縮小する場合。","統制の有効性を検証する手間を省くため、監査対象部門が作成した自己評価書のみを根拠として統制に依拠し、テストを実施しない場合。"],"correctIndex":1,"explanations":["× 誤り。統制が存在しなければ、依拠の前提が成り立たない。","○ 正しい。統制に依拠するには、設計と運用の有効性を検証できることが前提となる。","× 誤り。運用状況の確認なしの依拠は、判断の根拠として不十分である。","× 誤り。自己評価書のみでは、統制の有効性の十分な証拠とならない。"]},{"id":"au-36","type":"mc","chapterIndex":2,"stem":"予備調査で入手する情報として最も適切なものはどれか。","options":["本調査で検証する取引データの全件を、監査対象部門から直接受け取った電子データの形で入手すること。","監査報告書の結論に記載する予定の改善提案を、監査対象部門の担当者から事前に聞き取ること。","監査人が個人的に関係する業者との取引条件を確認し、その契約内容を監査の参考資料とすること。","組織の情報システムの概要、業務フロー、関連規程、前回の監査結果など、対象の全体像を把握するための情報。"],"correctIndex":3,"explanations":["× 全件のデータ取得は本調査の段階で行うべき作業であり、予備調査の目的に含まれない。","× 結論に関わる提案を事前に聞き取ると、監査の独立性を損なう。","× 監査人が個人的に関係する業者の情報を扱うことは、独立性の観点から不適切である。","○ 正しい。予備調査は、対象の全体像と統制の状況を把握するための情報を入手する段階である。"]},{"id":"au-37","type":"mc","chapterIndex":1,"stem":"残余リスク（残存リスク）の説明として最も適切なものはどれか。","options":["統制を実施した後にも残るリスクで、監査人が監査の重点を検討する際の対象となるもの。","統制を実施する前に存在し、業務の性質そのものから生じるリスクのうち、統制によって影響を受けないもの。","監査人の能力によって決まる、誤りを発見できない可能性。","監査の計画が途中で変更され、範囲が当初より縮小することから生じるリスク。"],"correctIndex":0,"explanations":["○ 正しい。統制後も残るリスクを評価し、監査の重点の検討に用いる。","× これは固有リスクに近い説明であり、統制後に残るリスクの説明ではない。","× 誤り。残余リスクは、統制を実施した後に残るリスクを指す。","× 誤り。計画の変更による範囲の縮小は、残余リスクの説明ではない。"]},{"id":"au-38","type":"mc","chapterIndex":1,"stem":"監査計画の承認に関して最も適切なものはどれか。","options":["監査計画は監査対象部門の承認を得てから、監査責任者が承認すれば有効とする。","監査計画は一度承認されれば、監査の途中で状況が変わっても変更の承認は不要とする。","監査計画は監査責任者が承認し、重要な変更がある場合は再度承認を得る。","監査人が自ら作成するため、承認は不要とされている。"],"correctIndex":2,"explanations":["× 監査対象部門の承認は独立性を損なう。","× 状況の変化に応じた変更の承認を省くと、計画の妥当性を失う。","○ 正しい。計画は監査責任者が承認し、重要な変更時は再承認を行うことで品質を確保する。","× 誤り。計画は承認を得て有効とする必要がある。"]},{"id":"au-39","type":"mc","chapterIndex":2,"stem":"監査の前に被監査部門と打合せを行う目的として最も適切なものはどれか。","options":["監査結論の方向性を事前に合意し、監査報告書の指摘事項を減らすため、被監査部門との打合せで結論の内容を先に示しておくため。","監査の目的・範囲・スケジュール・必要な資料を共有し、監査の実施を円滑にするため。","監査対象部門の業務の進め方について助言を行い、その結果として監査の対象から外すため、被監査部門の業務範囲を事前に確定させるため。","監査人の判断に影響を与え、監査対象部門に有利な範囲で監査を実施させ、指摘事項の数を抑えるため。"],"correctIndex":1,"explanations":["× 誤り。監査結論の事前合意は、独立性を損なう。","○ 正しい。事前の打合せは、監査の目的・範囲・資料などを共有し、円滑な実施を図るためである。","× 誤り。被監査部門の業務助言と対象除外は、監査の目的に反する。","× 誤り。部門に有利な範囲の監査は、独立性と客観性に反する。"]},{"id":"au-40","type":"mc","chapterIndex":3,"stem":"統制テストと実証テストの違いとして最も適切なものはどれか。","options":["統制テストは取引の正確性を直接確かめ、実証テストは統制を確かめる。","統制テストと実証テストは、いずれも統制の設計を確かめるものであり、その目的に違いはない。","統制テストは部門の自己評価を確かめ、実証テストは外部の評価を確かめる。","統制テストは統制が有効に機能しているかを確かめ、実証テストは取引や残高等の正確性を直接確かめる。"],"correctIndex":3,"explanations":["× 誤り。取引の正確性を直接確かめるのは実証テストである。","× 統制テストは運用の有効性を確かめるものであり、設計だけを確かめるものではない。","× 誤り。統制テストは内部統制の有効性を確かめるものである。","○ 正しい。統制テストは統制の有効性を、実証テストは金額や記録の正確性を直接確かめる。"]},{"id":"au-41","type":"mc","chapterIndex":3,"stem":"サンプリングにおける母集団の定義として最も適切なものはどれか。","options":["監査人が結論を導きたい対象全体の集合を、特性を明確にして定めたもの。","監査人が抽出の対象とするデータのうち、最も金額の大きいものだけを選んだ集合。","監査対象部門が指定した、一部の業務に限定した記録の集合。","過去に検証したことがある取引のみを対象とする集合。"],"correctIndex":0,"explanations":["○ 正しい。母集団は結論を導きたい対象全体であり、特性を明確にして定める。","× 金額の大きいものだけを選ぶと、母集団の全体を表さず、結論の推定に使えない。","× 誤り。監査対象部門の指定で範囲を限定すると、母集団の定義として不適切。","× 誤り。過去の検証済み取引に限定すると、母集団の代表性を損なう。"]},{"id":"au-42","type":"mc","chapterIndex":2,"stem":"計画段階で統制の不備を発見した場合の対応として最も適切なものはどれか。","options":["不備は監査対象部門が改善するまで監査を中断し、改善後に監査を再開することとする。","不備は報告対象としてのみ扱い、監査計画の変更は次回の監査で行うこととする。","不備の影響を評価して、監査計画（手続の種類・範囲・時期）を見直す。","不備の内容を協議し、その結果に基づいて範囲を決め直す。"],"correctIndex":2,"explanations":["× 監査を中断して改善を待つのは、監査の計画と進行の基本に反する。","× 次回へ回すと、現在の監査の結論に必要な証拠が不足する。","○ 正しい。不備の影響を評価し、必要な範囲で計画を見直すことが基本となる。","× 誤り。協議のみで範囲を決めると、不備の影響評価が不十分になる。"]},{"id":"au-43","type":"mc","chapterIndex":1,"stem":"監査リスクを適切な水準に抑えるための方法として最も適切なものはどれか。","options":["監査手続の範囲・深さ・実施時期を、リスクに応じて適切に設定する。","監査手続の実施を監査対象部門の作業時間に合わせて、現場の負担をできる限り軽減させる。","監査手続は前年と同一のものを用い、リスクの変化にかかわらず手続を固定する。","監査リスクは監査人の専門性によって決まるため、手続の設計で調整することはできないとする。"],"correctIndex":0,"explanations":["○ 正しい。手続の範囲・深さ・時期をリスクに応じて設定することで、監査リスクを抑える。","× 誤り。部門の作業時間に合わせた手続は、監査の範囲を部門に委ねるもので誤りである。","× 前年と同一の手続を固定すると、リスクの変化に対応できない。","× 監査リスクは手続の設計で調整でき、専門性だけで決まるものではない。"]},{"id":"au-44","type":"mc","chapterIndex":1,"stem":"IT環境の変化が監査計画に与える影響として最も適切なものはどれか。","options":["IT環境が変わっても、監査の範囲と手続は前年の計画をそのまま用いることで十分に確保できる。","IT環境の変化は監査対象部門の責任であり、監査計画の見直しは監査人の役割に含まれない。","IT環境の変化は監査報告書の体裁にのみ影響し、監査計画や監査手続には影響を与えない。","クラウド移行やシステム刷新により統制やデータの流れが変わるため、監査範囲と手続を見直す必要がある。"],"correctIndex":3,"explanations":["× 前年の計画をそのまま用いると、変化したリスクを捉えられない。","× 監査計画の見直しは監査人の役割であり、監査対象部門の責任とは区別される。","× IT環境の変化は、監査計画と手続の双方に影響する。","○ 正しい。IT環境の変化で統制やデータフローが変われば、監査範囲と手続の見直しが必要になる。"]},{"id":"au-45","type":"mc","chapterIndex":1,"stem":"外部委託先の業務が監査目的に影響する場合の監査計画上の扱いとして最も適切なものはどれか。","options":["委託先の統制が委託元の監査目的に影響する場合、保証報告書の利用や直接の検証などで必要な証拠を確保する。","委託先の業務は監査対象外とし、委託元の監査目的との関係を考慮せず、計画上の検討を省略する。","委託先の業務の評価は委託先の自己評価に全面的に依拠し、監査人が独自に確認する必要はないとする。","委託先の業務の評価は、委託元の監査部門の判断にのみ基づき、委託先への直接の確認は行わないものとし、報告書にも記載しない。"],"correctIndex":0,"explanations":["○ 正しい。委託先の統制が影響する場合は、保証報告書の利用や直接の検証で証拠を確保する。","× 委託先の業務を監査対象外とすると、委託元の監査目的を達成できない恐れがある。","× 委託先の自己評価に全面的に依拠すると、客観性と証拠の十分性が確保されない。","× 誤り。委託先の確認を省くと、委託業務の統制を評価できない。"]},{"id":"au-46","type":"mc","chapterIndex":1,"stem":"前回の監査で指摘した事項の改善状況を、今回の監査計画で扱う理由として最も適切なものはどれか。","options":["前回の指摘事項は、監査対象部門が改善を完了したものとみなし、今回の監査計画では扱わないため。","前回の指摘事項は、監査人の評価に影響しないため、改善の有無を確認する必要はないため。","前回の指摘は残存リスクを示す情報であり、改善の有効性を確認する必要があるため。","監査報告書の体裁を整える目的にのみ使うため。"],"correctIndex":2,"explanations":["× 改善済みとみなすだけでは、改善の有効性は確認されない。","× 前回の指摘は今回の評価にも関係するため、影響がないとは言えない。","○ 正しい。改善の有効性を確かめることで、残存リスクの評価とフォローアップが行える。","× 誤り。改善状況の確認は、報告書の体裁のためだけではない。"]},{"id":"au-47","type":"mc","chapterIndex":1,"stem":"監査計画における時間配分の考え方として最も適切なものはどれか。","options":["すべての監査対象に同一の時間を配分し、対象ごとのリスクの違いは配分に一切反映させず、公平性のみを重視すること。","リスクの高い領域に多くの時間を配分し、監査の結論に影響しない領域は時間を抑える。","監査人が得意とする領域に多くの時間を配分し、苦手な領域は時間を割かないようにして、効率を優先する方法をとること。","監査対象部門が希望する領域に時間を優先して配分し、残りの時間で他の領域を確認する方法をとること。"],"correctIndex":1,"explanations":["× 誤り。リスクを反映しない配分は、監査の効果を損なう。","○ 正しい。時間配分はリスクの大きさと結論への影響に基づいて決める。","× 誤り。得意分野への偏りは、重要な領域の見落としを招く。","× 誤り。部門の希望による配分は、リスクに基づく配分ではない。"]},{"id":"au-48","type":"mc","chapterIndex":1,"stem":"監査の実施時期を決める際の考え方として最も適切なものはどれか。","options":["監査対象部門の繁忙期を避け、全部門一律に実施する。","監査人の都合に合わせ、業務サイクルは考慮しない。","年度末に一括して行い、途中の変化は次回に扱う。","重要な業務処理や決算・システム変更の時期を考慮し、必要な証拠が得られる時期に実施する。"],"correctIndex":3,"explanations":["× 誤り。一律の時期では、重要な業務処理の時期を外すおそれがある。","× 誤り。業務サイクルを考慮しない実施は、必要な証拠を得られない。","× 誤り。年度末の一括実施では、途中の変化を監査で扱えない。","○ 正しい。証拠が得られる時期と業務サイクルを考慮して、実施時期を決める。"]},{"id":"au-49","type":"mc","chapterIndex":1,"stem":"重要性の判断に関係する要素として最も適切なものはどれか。","options":["金額・件数・影響度・利害関係者の関心などを考慮して判断する。","監査対象部門の担当者が重要と考える事項のみを基準とし、利用者の関心は考慮しない。","過去の指摘件数だけを基準とし、今回の金額は考慮しない。","監査人が個人的に関心を持つ事象のみを基準とする。"],"correctIndex":0,"explanations":["○ 正しい。重要性は、量的・質的な要素と利害関係者の関心を総合して判断する。","× 監査対象部門の判断のみに基づくと、独立性を損なう。","× 誤り。過去の件数だけでは、今回の重要性は判断できない。","× 誤り。個人的な関心では、組織全体の重要性を判断できない。"]},{"id":"au-50","type":"mc","chapterIndex":1,"stem":"監査計画の見直しが必要になる典型的な状況として最も適切なものはどれか。","options":["監査対象部門から、予定していた監査日程を一日だけ変更してほしいと依頼があった。","監査人の一人が体調を崩して、監査の開始日を一週間遅らせる必要が生じた。","監査の途中で重要な統制の不備や想定外のシステム障害が判明した。","監査報告書の様式を、新しい様式に変更すると決まった。"],"correctIndex":2,"explanations":["× 日程の一日変更はリスク評価に影響しないため、通常は計画の見直しを要しない。","× 人員の変更は実施体制の調整であり、リスクの前提が変わるわけではない。","○ 正しい。重要な不備や障害は、リスク評価と手続の前提を変えるため、計画の見直しが必要となる。","× 誤り。報告様式の変更は、監査計画の見直しを要する状況ではない。"]},{"id":"au-51","type":"mc","chapterIndex":2,"stem":"監査対象の業務プロセスをフローチャート等で整理する目的として最も適切なものはどれか。","options":["監査対象部門の業務を標準化する手順を作成し、その手順を監査人が現場で教えて、統一的に運用させるため。","業務の流れと統制ポイントを把握し、リスクの所在と監査要点を特定するため。","監査報告書の付録として提出するために、業務の図を見栄えよく作成し、体裁を整えるため。","業務の担当者の作業量を計測し、人員の配置を見直すための基礎資料として集計するため。"],"correctIndex":1,"explanations":["× 誤り。業務の標準化は、監査人が教えるための資料ではない。","○ 正しい。業務フローの整理は、リスクと統制の所在を把握し、監査要点を定めるためである。","× 誤り。図の体裁のための作成は、統制ポイントを把握する目的ではない。","× 誤り。作業量の計測は、監査で業務の流れを把握する目的ではない。"]},{"id":"au-52","type":"mc","chapterIndex":3,"stem":"IT全般統制と業務処理統制の関係として最も適切なものはどれか。","options":["業務処理統制を評価すれば、IT全般統制の評価は不要とする。","業務処理統制は基盤を整え、IT全般統制は個々の取引を処理する。","IT全般統制は業務プロセス単位で適用し、業務処理統制は全体に適用する。","IT全般統制は業務処理統制が有効に機能する基盤を支え、両者を組み合わせて評価する。"],"correctIndex":3,"explanations":["× 誤り。両者は独立しておらず、片方の評価で他方を省けない。","× 誤り。IT全般統制と業務処理統制の役割が逆になっている。","× 誤り。適用範囲の説明が逆であり、両者とも全体に関わる。","○ 正しい。IT全般統制は、業務処理統制の前提となる環境を支えるため、両者を組み合わせて評価する。"]},{"id":"au-53","type":"mc","chapterIndex":2,"stem":"予備調査の結果、監査人がリスクが低いと判断した領域の扱いとして最も適切なものはどれか。","options":["リスクが低いと判断した領域は、監査範囲から完全に除外せず、簡易な手続で確認するか、サンプリングの規模を小さくする。","リスクが低いと判断した領域は、監査範囲から完全に除外し、監査報告書にも記載せず、以後の監査でも対象外とし、その判断の根拠を文書に残さない運用を取る。","リスクが低いと判断した領域は、監査人の判断で必ず本調査の対象とし、同一の手続で網羅的に確認する。","リスクが低いと判断した領域は、監査対象部門の自己申告のみで確認を完了させ、監査人の検証は行わない。"],"correctIndex":0,"explanations":["○ 正しい。リスクが低い領域も、簡易な手続や小規模な抽出で確認して判断の妥当性を担保する。","× 誤り。低リスクの領域でも、範囲から完全に除外せず確認を残す必要がある。","× 一律に網羅的に確認すると、リスクに応じた資源配分の考え方に反する。","× 自己申告のみでは、独立した検証とはならない。"]},{"id":"au-54","type":"mc","chapterIndex":1,"stem":"監査責任者が監査計画の段階で果たす役割として最も適切なものはどれか。","options":["監査計画の作成を監査対象部門に委ね、その結果を監査責任者が事後に確認して、計画の内容を部門の判断で決めておく。","監査計画の細部を監査人に任せ、監査責任者は計画の承認も行わない。","監査計画の全体を統括し、監査人の人員配置と監査範囲の妥当性を判断する。","監査計画の作成は監査人の役割であり、監査責任者は計画の内容に関与せず、報告の段階でのみ確認すればよいとされている。"],"correctIndex":2,"explanations":["× 誤り。計画の作成を監査対象部門に委ねると、独立性を損なう。","× 承認を行わないと、計画の品質を確保できない。","○ 正しい。監査責任者は計画全体を統括し、人員配置と範囲の妥当性を判断する。","× 誤り。監査責任者は計画の統括と承認に関与すべきである。"]},{"id":"au-55","type":"mc","chapterIndex":1,"stem":"監査リスクの評価を文書化する意義として最も適切なものはどれか。","options":["監査対象部門に提示する資料を用意し、監査の協力を得やすくするため、リスク評価の根拠は示さないこととする。","リスク評価の根拠を残すことで、監査計画の妥当性を第三者が検証できるようにするため。","監査人の作業時間を記録し、その記録を人事評価に用いて、監査人の業務の成果を管理するため。","監査報告書の本文を省略して、リスク評価の記述だけで報告に代えるため、報告の分量を減らすこと。"],"correctIndex":1,"explanations":["× 誤り。リスク評価の根拠の文書化は、第三者の検証のために必要。","○ 正しい。文書化は、計画の根拠を示し、第三者による検証と品質管理を可能にする。","× 誤り。作業時間の記録と人事評価は、監査の計画の妥当性とは無関係。","× 誤り。本文の省略は、報告の役割を果たさない。"]},{"id":"au-56","type":"mc","chapterIndex":2,"stem":"監査人がデータ分析ツールを監査計画の段階で用いる目的として最も適切なものはどれか。","options":["監査対象部門のデータを改ざんして、監査証拠として提出するため。","監査報告書の文章を自動的に生成し、監査人の記述作業を省略するため。","監査対象部門のシステムの性能を測定し、改善を直接反映させるため。","取引データ全体から異常傾向を把握し、リスクの高い取引や領域を絞り込むため。"],"correctIndex":3,"explanations":["× 誤り。データの改ざんは監査の不正行為であり、目的として不適切。","× 報告書の自動生成は、監査人の判断と責任を代替するものではない。","× 誤り。性能測定は監査の目的ではない。","○ 正しい。データ分析は、全体の異常傾向からリスクの高い領域を特定するのに用いる。"]},{"id":"au-57","type":"mc","chapterIndex":1,"stem":"監査の計画と実施の関係として最も適切なものはどれか。","options":["計画は実施の前提であるが、実施中に得た情報により計画を柔軟に修正する。","計画は実施を始めた後は変更できず、実施中に得た情報は次回の計画にのみ反映させる。","計画は実施の結果を記録するためのものであり、進め方は規定しない。","計画と実施は独立し、実施の結果は計画の妥当性に影響しない。"],"correctIndex":0,"explanations":["○ 正しい。計画は前提として設定し、実施で得た情報によって柔軟に見直す。","× 実施中にリスクが変わった場合は、計画を修正しなければ監査の有効性を保てない。","× 誤り。計画は実施の進め方を規定するものである。","× 誤り。実施の結果は計画の妥当性の検討に影響する。"]},{"id":"au-58","type":"mc","chapterIndex":1,"stem":"監査計画の記録に含めるべき事項として最も適切なものはどれか。","options":["監査対象部門の担当者の個人的な意見と、その意見に対する監査人の感想のみ。","監査報告書の完成後に記載する結論の内容と、その結論を監査対象部門が受け入れた旨。","監査目的、範囲、リスク評価の結果、実施時期、必要な人員と資源。","監査人の経歴と、他の監査の詳細な記録のみ。"],"correctIndex":2,"explanations":["× 個人的な意見と感想のみでは、計画の記録として不十分である。","× 結論は報告の段階で確定するものであり、計画の記録に含めるものではない。","○ 正しい。計画の記録は、目的・範囲・リスク評価・時期・資源を含み、計画の妥当性を示す。","× 誤り。個人の経歴は、監査計画の記録に含めるべき事項ではない。"]},{"id":"au-59","type":"mc","chapterIndex":1,"stem":"監査計画のリスク評価で固有リスクを考慮する意義として最も適切なものはどれか。","options":["監査対象部門の統制が完全に有効であることを前提として、監査の手続を省略し、統制の評価に関する検討をすべて省略するため。","統制が存在しない場合にも、業務や情報の性質からどの程度誤りや問題が生じやすいかを把握するため。","監査人の経験に基づく判断のみで統制の有効性を評価し、その根拠となる証拠の文書化を省略するため、報告書にも記載しない。","監査報告書で固有リスクの数値を開示し、利害関係者の評価を得るとともに、リスク評価の根拠を明らかにしないため。"],"correctIndex":1,"explanations":["× 誤り。統制の有効性を前提に手続を省くのは、固有リスクの把握と逆の考え方である。","○ 正しい。固有リスクは統制の前提となる業務の性質からの誤りの生じやすさであり、評価の出発点となる。","× 誤り。経験のみによる評価は、統制の有効性を裏付けない。","× 誤り。固有リスクの数値を開示する目的ではない。"]},{"id":"au-60","type":"mc","chapterIndex":1,"stem":"監査計画の最終段階で監査人が確認すべき事項として最も適切なものはどれか。","options":["計画を監査対象部門に開示して承認を得て、範囲を部門に委ねること。","計画の作成資料をすべて廃棄し、残さないこと。","計画が前年度と一致し、新たな変更を含まないこと。","計画が監査目的とリスク評価に整合し、必要な監査資源が確保されていること。"],"correctIndex":3,"explanations":["× 誤り。監査範囲は部門の判断に委ねてはならない。","× 誤り。作成資料は、計画の妥当性を検証するために保管する。","× 誤り。前年度と同じ計画では、リスクの変化に対応できない。","○ 正しい。計画は目的とリスクに整合し、必要な資源が確保されていることを確認する。"]},{"id":"au-61","type":"mc","chapterIndex":2,"stem":"予備調査の目的として最も適切なものはどれか。","options":["被監査部門の不正を立証するため、関係者の行動を広く記録し、個人の評価に反映させる。","全件を確認し、指摘事項を確定させる。","監査対象の業務と関連リスクを把握し、本調査の範囲と重点を決める。","報告書の構成を本調査の前に確定させる。"],"correctIndex":2,"explanations":["× 誤り。予備調査は被監査部門の不正を立証する手続ではなく、情報収集とリスク把握が中心である。","× 誤り。全件の確認や指摘事項の確定は本調査の役割であり、予備調査の目的ではない。","○ 正しい。対象業務と関連リスクを把握し、その結果をもとに本調査の範囲と重点を決めるのが予備調査の役割である。","× 誤り。報告書は本調査の結果を踏まえて作成するため、事前に構成を確定させるのは適切ではない。"]},{"id":"au-62","type":"mc","chapterIndex":3,"stem":"監査人は、アクセス権の付与が申請・承認の規程どおり行われているかを確かめたい。最も適切な手続はどれか。","options":["付与記録から試料を抽出し、承認者の記録と申請書を突き合わせる。","担当者に運用の状況を口頭で尋ね、その回答を記録に残さず、そのまま証拠として扱う。","監査人自らが本番システムで権限を付与し、結果を確かめる。","申請書の保管状況は確認せず、システム上の権限一覧だけを見て、承認の有無を判断する。"],"correctIndex":0,"explanations":["○ 正しい。付与記録から試料を抽出し、承認者の記録や申請書と突き合わせると、規程どおりの運用を検証できる。","× 誤り。口頭の説明だけでは証拠として弱く、記録も残さないため、単独では十分な証拠とはならない。","× 誤り。監査人が本番システムで権限を付与すると独立性を損なうため、適切ではない。","× 誤り。承認の証跡を確認しないと、規程どおりの運用かどうかは判断できない。"]},{"id":"au-63","type":"mc","chapterIndex":3,"stem":"統制の運用評価として、逸脱の発生率を推定する目的で抽出を行う場合の適切な方法はどれか。","options":["金額の過大計上の程度を推定するため、変数サンプリングを用いて、その金額の範囲を求める。","担当者の経験に基づき、リスクの高そうな取引を任意に選んで確認する。","母集団の中から逸脱がなかった件数だけを抜き出して、統制の有効性の判断に用いる。","逸脱の発生率を推定するため、属性サンプリングを用いる。"],"correctIndex":3,"explanations":["× 誤り。変数サンプリングは金額などの量の推定に用いるもので、逸脱の発生率の推定には適さない。","× 誤り。担当者の経験に基づく任意の抽出では母集団全体への推定ができず、率の推定には使えない。","× 誤り。逸脱がなかった件数だけでは、母集団の逸脱率を推定できない。","○ 正しい。属性サンプリングは、逸脱の有無といった特性の発生率を統計的に推定する方法である。"]},{"id":"au-64","type":"mc","chapterIndex":2,"stem":"予備調査の結果、ある業務で担当者の交代が多く、手順書が整備されていないことが分かった。監査人の判断として最も適切なものはどれか。","options":["業務は問題ないと判断し、本調査の手続を省略する。","この業務を統制上の重点領域と位置づけ、本調査の手続を厚くする。","手順書の整備を監査人が代行し、報告書に含める。","交代の理由は確認せず、是正は現場に任せる。"],"correctIndex":1,"explanations":["× 誤り。担当者の交代が多く手順書もない状況は統制上のリスクであり、本調査の手続を省略するのは不適切である。","○ 正しい。リスクの高い業務を統制上の重点領域として位置づけ、本調査で手続を厚くするのが適切である。","× 誤り。監査人が手順書を代行すると独立性が損なわれ、監査人の役割を逸脱する。","× 誤り。交代の理由を確認せず是正を現場に任せると、問題の原因が把握されず、統制の改善にならない。"]},{"id":"au-65","type":"mc","chapterIndex":3,"stem":"本調査で、監査人が被監査部門の業務処理結果を独立に再計算した。この手続の位置づけとして最も適切なものはどれか。","options":["業務の説明を聞くことに相当する質問手続である。","証拠を作成するための手続で、監査調書には残さず、監査人の結論にだけ反映させる手続である。","処理の正確性を独立に検証する実証手続（再実施）である。","監査対象外の部門の業務を確認する手続である。"],"correctIndex":2,"explanations":["× 誤り。再計算は業務の説明を聞く質問手続ではなく、実証手続である。","× 誤り。監査人が得た証拠は監査調書に記録して保存するのが原則である。","○ 正しい。監査人が自ら計算して結果を比較することで、処理の正確性を独立に検証する実証手続（再実施）である。","× 誤り。再計算の対象は監査範囲内の業務処理であり、監査対象外の部門は含まれない。"]},{"id":"au-66","type":"mc","chapterIndex":3,"stem":"監査人がシステム間のデータ連携の正確性を確かめるため、件数と合計金額を両システムで突き合わせた。この手続の目的として最も適切なものはどれか。","options":["データの完全性と正確性を確かめる。","処理性能を評価する。","利用者の操作性や画面の使いやすさを評価する。","保守契約の費用が市場の水準に見合っているかを判断する。"],"correctIndex":0,"explanations":["○ 正しい。件数と合計金額の照合は、連携データの欠落や誤りを検出する完全性・正確性の検証である。","× 誤り。件数と合計金額の突き合わせでは、システムの処理性能は評価できない。","× 誤り。操作性や画面の使いやすさの評価には利用者への質問や操作の観察が必要で、この照合の目的ではない。","× 誤り。保守契約の費用の妥当性は契約内容と市場の比較で判断するもので、データ連携の照合とは無関係である。"]},{"id":"au-67","type":"mc","chapterIndex":3,"stem":"監査証拠の信頼性に関する記述として、最も適切なものはどれか。","options":["被監査部門の担当者が口頭で行った説明は、他の証拠に関係なく、常に最も信頼性の高い証拠である。","監査人が直接入手した証拠は、被監査部門経由の証拠に比べて、信頼性が低いとされる。","内部で作成された文書は、外部の独立した情報源から得た文書より、常に信頼性が高いと考えてよく、確認の必要もない。","外部の独立した情報源からの文書は、一般に内部作成の文書より信頼性が高い。"],"correctIndex":3,"explanations":["× 誤り。担当者の口頭の説明は裏付けが弱く、他の証拠と照合しなければ信頼性は高くない。","× 誤り。監査人が直接入手した証拠は、一般に間接的に入手した証拠より信頼性が高い。","× 誤り。内部で作成された文書は、一般に外部の独立した情報源から得た文書より信頼性が低い。","○ 正しい。外部の独立した情報源からの文書は、一般に内部作成の文書より信頼性が高い。"]},{"id":"au-68","type":"mc","chapterIndex":3,"stem":"監査人が経営者への質問で得た回答を監査証拠として用いる場合の留意点として、最も適切なものはどれか。","options":["回答だけで十分な証拠となり、裏付けは要らない。","他の証拠で裏付けを取り、回答と矛盾がないかを確認する。","回答は報告書に載せなければ使えない。","口頭の回答は、記録すると効力を失うので残さない。"],"correctIndex":1,"explanations":["× 誤り。経営者への質問の回答は、それだけでは十分な証拠とはならず、裏付けが必要である。","○ 正しい。質問で得た回答は、他の証拠と照合して裏付けを取り、矛盾がないかを確認することが求められる。","× 誤り。手続で得た情報は、報告書に記載するかどうかに関係なく、証拠として検討の対象になる。","× 誤り。口頭の回答も記録して監査調書に残すのが原則であり、記録しないのは適切ではない。"]},{"id":"au-69","type":"mc","chapterIndex":3,"stem":"監査人が業務手順の遵守状況を観察により確かめる場合の特徴として、最も適切なものはどれか。","options":["観察は実施した時点の状況を示すため、通常時の遵守状況を完全に保証でき、追加の確認はほとんど不要である。","観察は被監査部門の事前承認が必要で、監査人が自由に実施することはできない。","観察は対象者の行動に影響し得るため、時点・条件・観察の事実を記録しておくことが重要である。","観察の結果は、他の証拠に関係なく、そのまま監査意見の根拠として使える。"],"correctIndex":2,"explanations":["× 誤り。観察は実施時点の状況しか示さず、通常時の遵守状況を完全には保証できないため、追加の確認が必要である。","× 誤り。被監査部門の事前の合意が必要かどうかは監査の取り決めによるもので、観察の一般的な特徴ではない。","○ 正しい。観察は対象者の行動に影響し得るため、時点・条件・観察の事実を記録し、結果の解釈に注意する必要がある。","× 誤り。観察の結果は単独では証拠として弱く、他の証拠と併せて検討するのが原則である。"]},{"id":"au-70","type":"mc","chapterIndex":3,"stem":"監査人が統制の設計の有効性を評価する手続として、最も適切なものはどれか。","options":["統制が目的のリスクに対応するように設計されているかを、規程と仕組みに照らして確かめる。","統制が設計どおりに運用されているかを、多数の取引を繰り返し確認し、運用上の逸脱の件数で評価する。","統制の運用担当者に、業務がうまくいっているかを尋ねて判断する。","統制の効果を、監査対象期間の全件の結果と比較し、その差の大きさだけで有効性を判断し、確認の対象は絞ってよい。"],"correctIndex":0,"explanations":["○ 正しい。設計の有効性は、統制が目的のリスクに対応しているかを規程と仕組みに照らして確かめることで評価する。","× 誤り。多数の取引を繰り返し確認するのは運用の有効性の評価であり、設計の有効性の評価ではない。","× 誤り。運用担当者への質問だけでは、設計の有効性を裏付ける証拠として不十分である。","× 誤り。全件の結果との比較だけで判断するのは、設計の有効性の評価方法として適切ではない。"]},{"id":"au-71","type":"mc","chapterIndex":3,"stem":"監査人が、被監査部門から提供された資料の完全性を確かめたい。最も適切な方法はどれか。","options":["資料の作成者に、内容が正しいことを確認する書面を取り寄せて、完全性の裏付けとする。","資料の体裁が整っていることを確かめ、内容の検証は省いて、そのまま監査証拠として使う。","資料の内容を、監査人の経験に基づいて修正し、修正後の資料を監査証拠として使う。","資料の件数や合計を、元となるシステムの記録と照合する。"],"correctIndex":3,"explanations":["× 誤り。資料の作成者による内容の確認書面は、作成者自身の確認にすぎず、完全性を独立に確かめる方法としては弱い。","× 誤り。資料の体裁が整っていることの確認は完全性の検証にはならず、そのまま証拠として使うのは適切ではない。","× 誤り。監査人が資料を修正すると証拠そのものを変えてしまい、監査証拠として適切ではない。","○ 正しい。資料の件数や合計を元となるシステムの記録と照合すると、資料が欠落なく作成されたかを独立に確かめられる。"]},{"id":"au-72","type":"mc","chapterIndex":3,"stem":"監査証拠の十分性に関する記述として、最も適切なものはどれか。","options":["証拠の量が多ければ、監査意見を十分に裏付けられる。","証拠は、監査意見を裏付けるのに必要な量と質を備えていなければならない。","証拠は、監査人が一つの種類を集めれば、他の種類は不要である。","証拠の十分性は、監査人の判断に任せ、基準はない。"],"correctIndex":1,"explanations":["× 誤り。証拠の量が多くても、関連性や信頼性が低ければ十分な証拠とはみなせない。","○ 正しい。証拠は、監査意見を裏付けるのに必要な量と質を備えていなければならない。","× 誤り。証拠は一種類だけでは足りるとは限らず、複数の種類を組み合わせて裏付けるのが原則である。","× 誤り。証拠の十分性は監査人の専門的判断によるが、判断の根拠を説明できる基準が求められる。"]},{"id":"au-73","type":"mc","chapterIndex":3,"stem":"監査人が、システムの処理結果を確かめるため、テストデータを入力して結果を検証した。この手続の名称として最も適切なものはどれか。","options":["質問書法（文書照会）","確認状法（相手先への照会）","テストデータ法（模擬データによる検証）","分析的手続のみで足りる（数値の関係を検討するだけで、個別の処理の正確性は確認しない）"],"correctIndex":2,"explanations":["× 誤り。質問書法は文書による質問への回答を得る手続で、テストデータの入力とは異なる。","× 誤り。確認状法は外部の相手先に残高などを直接確かめる手続で、システム処理の検証とは異なる。","○ 正しい。テストデータ法は、既知の結果が得られるテストデータを入力し、処理結果が期待どおりかを確かめる手法である。","× 誤り。分析的手続は数値の関係の検討であり、テストデータの入力を伴わない。"]},{"id":"au-74","type":"mc","chapterIndex":1,"stem":"監査人が、監査対象期間の途中でシステムの重要な変更があったことを知った。監査計画上の対応として最も適切なものはどれか。","options":["変更前後で手続の範囲を分け、変更の影響を評価する手続を追加する。","変更は監査結果に関係ないため、計画を変更しない。","変更後のみを対象にして、変更前の結果は監査せず、変更の影響は前提として扱わない。","変更の内容は被監査部門に任せ、変更後の結果も監査人は確認せず、被監査部門の報告をそのまま採用する。"],"correctIndex":0,"explanations":["○ 正しい。変更前後で手続の範囲を分け、変更の影響を検証する手続を追加するのが適切である。","× 誤り。重要な変更は統制の有効性に影響し得るため、計画を変えずに無視するのは適切ではない。","× 誤り。変更前の期間の監査を省くと、監査対象期間全体の意見を裏付けられない。","× 誤り。変更の影響を監査人が確認せず報告をそのまま採用すると、独立した監査の目的を果たせない。"]},{"id":"au-75","type":"mc","chapterIndex":3,"stem":"監査証拠の記録に関する記述として、最も適切なものはどれか。","options":["監査証拠は、監査調書に残す必要はなく、監査人が後で記憶をたどれば足りると考えてよい。","監査証拠は、報告書に記載した部分だけを残せばよく、それ以外の証拠は廃棄してかまわない。","監査証拠は、被監査部門が保管していれば監査人が保管する必要はなく、保管の記録も残さなくてよい。","監査証拠は、入手の経緯と内容を監査調書に残し、後から検証できるようにする。"],"correctIndex":3,"explanations":["× 誤り。監査証拠は監査調書に残す必要があり、監査人の記憶だけでは後から検証できない。","× 誤り。報告書に記載しなかった証拠も、監査の過程を裏付ける記録として残すことが求められる。","× 誤り。監査人は自らの判断の根拠となる証拠を保管し、被監査部門の保管に依存しないのが原則である。","○ 正しい。入手の経緯と内容を監査調書に残すと、後から監査の過程と結論を検証できる。"]},{"id":"au-76","type":"mc","chapterIndex":3,"stem":"統制の運用評価で、監査人が100件の取引から試料を抽出し、逸脱が1件見つかった。最も適切な判断として、次のうち正しいものはどれか。","options":["逸脱は1件なので、統制は有効と判断する。","逸脱の原因と影響を分析し、統制の有効性への影響を判断する。","逸脱がなくなるまで抽出し直す。","逸脱は報告書に記載せず、根拠を隠す。"],"correctIndex":1,"explanations":["× 誤り。逸脱が少なくても、統制の有効性に影響し得るため、件数だけで有効とは判断できない。","○ 正しい。逸脱の原因と影響を分析し、統制の有効性への影響を判断するのが適切である。","× 誤り。逸脱がなくなるまで抽出し直すと、結論を都合よく導くことになり適切ではない。","× 誤り。逸脱を報告せず、根拠を隠すのは、監査結論の裏付けを損ない、適切ではない。"]},{"id":"au-77","type":"mc","chapterIndex":3,"stem":"監査人が、統計的サンプリングを用いる利点として、最も適切なものはどれか。","options":["抽出の対象を、監査人が最も重要と考える取引に絞り、そこから全体の結論を導くことができる。","試料の数を、監査の結論に関係なく常に最小にできる。","母集団全体に対して、抽出結果に基づく推定と、その精度の評価ができる。","母集団の情報がなくても、結論を導くことができる。"],"correctIndex":2,"explanations":["× 誤り。重要な取引に絞る方法は判断的サンプリングの特徴であり、統計的サンプリングの利点ではない。","× 誤り。試料の数は母集団の性質と求める精度によって決まり、常に最小にできるわけではない。","○ 正しい。統計的サンプリングでは、抽出結果から母集団を推定し、その精度を統計的に評価できる。","× 誤り。統計的サンプリングには母集団の情報が必要であり、これがないと抽出の設計も推定もできない。"]},{"id":"au-78","type":"mc","chapterIndex":3,"stem":"監査人が、抽出した試料について、被監査部門に対して取引の証拠を提示するよう求めた。提示が得られない場合の対応として、最も適切なものはどれか。","options":["別の方法で裏付けを試み、なお得られない場合は、その事実を報告して影響を評価する。","提示がないことを、その取引が問題ないことの証拠とみなす。","提示がないまま、統制の有効性を判断し、未確認の取引を含めて全体の結論として報告を終える。","提示を受けられなかった取引は試料から除外し、その理由や影響は、結論を出す際にも報告書にも記載しない。"],"correctIndex":0,"explanations":["○ 正しい。別の方法で裏付けを試み、なお得られない場合は、その事実を報告して影響を評価するのが適切である。","× 誤り。証拠の提示がないことは、取引が問題ないことの証拠にはならない。","× 誤り。証拠が得られていないまま結論を出すと、判断の根拠が不十分になる。","× 誤り。提示を受けられなかった取引を除外して結論を出すと、母集団の結果が偏り、適切な結論にならない。"]},{"id":"au-79","type":"mc","chapterIndex":3,"stem":"監査人が、抽出の結果を母集団に推定する際の留意点として、最も適切なものはどれか。","options":["抽出結果は、母集団の性質や抽出方法に関係なく、そのまま全体の結論として扱ってよい。","推定の結果は、監査人の期待に合うように母集団を区切り直し、その区切りの根拠を示さずに使う。","推定の結果は、被監査部門の見解を優先して、その水準と結論を決めてしまってよい。","推定の結果には、標本抽出に伴う誤差があり、その範囲を考慮して結論を出す。"],"correctIndex":3,"explanations":["× 誤り。母集団の性質によっては、抽出結果をそのまま全体の結論として使えない。","× 誤り。母集団を期待に合わせて区切り直すのは、結論の恣意性を生むため適切ではない。","× 誤り。推定の結果の決め方は監査人の独立した判断で行うもので、被監査部門の見解で決めるものではない。","○ 正しい。標本抽出には誤差が伴うため、推定結果にはその範囲を考慮して結論を出す必要がある。"]},{"id":"au-80","type":"mc","chapterIndex":2,"stem":"監査人が、システムの利用者へのアンケートから業務の問題点を把握しようとしている。この手法の特徴として最も適切なものはどれか。","options":["回答は全て事実として確定するため、他の証拠による確認は不要である。","多数の回答を効率的に集められるが、回答の正確性や偏りに注意が必要である。","個別の業務の状況を深く把握でき、原因の究明にも十分に使える。","アンケートだけで結論を完全に裏付けられる。"],"correctIndex":1,"explanations":["× 誤り。アンケートの回答は回答者の認識であり、事実の確定には他の証拠での裏付けが必要である。","○ 正しい。多数の回答を効率的に集められるが、回答者の認識や偏りに注意し、他の証拠と照合する必要がある。","× 誤り。個別の業務の事情の深掘りや原因の究明には不向きで、ヒアリングなど他の手法が必要である。","× 誤り。アンケートだけで結論を完全に裏付けることはできず、直接の確認と併せる必要がある。"]},{"id":"au-81","type":"mc","chapterIndex":3,"stem":"監査人が、被監査部門へのヒアリングを行った。留意点として最も適切なものはどれか。","options":["ヒアリングの内容は、監査人の結論に合うように誘導して聞くのが効率的である。","回答は、記録を残さず、監査人の記憶だけで整理する。","回答の内容は、他の証拠で裏付けを取り、矛盾がないかを確認する。","回答が得られない場合は、その事実を報告書に記載しない。"],"correctIndex":2,"explanations":["× 誤り。誘導的な質問は回答を歪める恐れがあり、適切な監査の方法ではない。","× 誤り。記録を残さず記憶だけで整理すると後から検証できず、記録を残して監査調書に含める必要がある。","○ 正しい。ヒアリングの回答は、他の証拠と照合して裏付けを取り、矛盾を確認することが求められる。","× 誤り。回答が得られなかった事実は監査の結論に影響し得るため、報告すべきである。"]},{"id":"au-82","type":"mc","chapterIndex":3,"stem":"監査人が、業務担当者の作業を再現する方法（再実施）を用いる目的として、最も適切なものはどれか。","options":["統制が実際に規程どおり機能しているかを、監査人自ら同じ手順で確かめるため。","担当者の作業効率を評価するため。","担当者の作業量を基準どおりに配分し、その配分が適切かどうかを作業の成果と結びつけて評価する。","被監査部門の人員が不足するときに、監査人が作業を代わりに補完し、その成果をそのまま結論に用いるため。"],"correctIndex":0,"explanations":["○ 正しい。監査人が同じ手順で再現し、統制が規程どおり機能しているかを独立に確かめるのが再実施の目的である。","× 誤り。担当者の作業効率の評価は、再実施の目的ではなく、監査の目的から外れる。","× 誤り。担当者の作業量の配分は被監査部門の管理事項であり、監査人が行う目的ではない。","× 誤り。監査人が人員を補完すると独立性が損なわれ、再実施の目的として不適切である。"]},{"id":"au-83","type":"mc","chapterIndex":3,"stem":"監査人が、業務の承認証跡（承認者の署名や承認ログ）を確認する手続の狙いとして最も適切なものはどれか。","options":["承認の速さを評価して、その結果を担当者の人事評価に反映させ、評価の基準とする。","承認の書式が統一されているかだけを確かめ、承認の内容や時点は問わない。","承認の有無に関係なく業務の結果が正しいことを確かめ、承認の記録は必要な場合に限って確認する。","承認が、権限のある者により、適切な時点で行われたかを確かめる。"],"correctIndex":3,"explanations":["× 誤り。承認の速さの評価は監査の目的として適切とは限らず、人事評価への反映は監査人の役割ではない。","× 誤り。承認の書式の統一だけでは承認統制の本質を確かめられず、承認の適切性の確認としては不十分である。","× 誤り。承認の有無を問わず結果だけを確かめても、承認統制の検証にはならない。","○ 正しい。承認者の権限と承認時点を確かめることで、承認統制が機能しているかを検証する。"]},{"id":"au-84","type":"mc","chapterIndex":3,"stem":"監査人が、大量のデータを分析するため、データ分析ツール（CAAT）を用いる利点として、最も適切なものはどれか。","options":["分析結果が常に正しいことが保証される。","母集団の全件を対象に、条件に合う取引を効率的に抽出・検証できる。","分析に使うデータの正確性を、ツールが自動的に保証する。","分析の結果を、監査人の判断を経ずに直接報告書に記載できる。"],"correctIndex":1,"explanations":["× 誤り。CAATの分析結果も入力データの正確性や分析の前提に依存するため、結果が保証されるわけではない。","○ 正しい。CAATを用いると、母集団の全件を対象に条件に合う取引を効率よく抽出し、検証できる。","× 誤り。データの正確性はツールが保証するものではなく、データの完全性の確認は別途必要である。","× 誤り。分析結果は監査人が解釈して判断するもので、そのまま報告書に記載するのは適切ではない。"]},{"id":"au-85","type":"mc","chapterIndex":3,"stem":"監査人が、データ分析の前に、対象データの完全性を確かめたい。最も適切な方法はどれか。","options":["データを分析した後で、結果が期待に合うかどうかを確かめる。","データの形式が揃っているかだけを確かめる。","データの件数や合計を、元のシステムの記録と照合する。","担当者に、データが正しいと口頭で伝えてもらう。"],"correctIndex":2,"explanations":["× 誤り。分析の後で期待と比べるだけでは、データの欠落を事前に防げない。","× 誤り。形式の統一はデータの完全性の一部にすぎず、欠落や誤りの検出には不十分である。","○ 正しい。データの件数や合計を元の記録と照合すると、データの欠落や変更がないかを独立に確かめられる。","× 誤り。被監査部門の担当者の口頭の説明だけでは、完全性の裏付けとして弱い。"]},{"id":"au-86","type":"mc","chapterIndex":3,"stem":"監査人が、CAATで取引データの異常を検出した。この異常の扱いとして最も適切なものはどれか。","options":["異常は、データの誤りや不正の可能性があるため、原因を調べて影響を評価する。","検出した異常は分析の結果にすぎず、その原因を確かめずに報告書へそのまま記載して、判断は読み手に委ねる。","異常は、分析ツールの誤りとみなし、無視して報告を終える。","異常は統計上の偶然とみなし、被監査部門の説明だけで処理し、原因の確認は行わない。"],"correctIndex":0,"explanations":["○ 正しい。異常は誤りや不正の可能性があるため、原因を調べて影響を評価することが求められる。","× 誤り。原因を確かめずにそのまま報告すると、誤った判断の根拠になり、適切ではない。","× 誤り。ツールの誤りかどうかは確かめる必要があり、確認せずに無視するのは適切ではない。","× 誤り。被監査部門の説明だけで処理すると、独立した判断ができず、監査の目的を果たせない。"]},{"id":"au-87","type":"mc","chapterIndex":3,"stem":"監査人が、被監査部門のシステムに保存されたログを証拠として使う場合、留意点として最も適切なものはどれか。","options":["ログは改ざんされないと想定し、そのまま監査証拠として扱い、完全性の確認は省く。","ログの内容は、監査の対象期間と無関係なものも含まれるため、期間の確認を省いてよい。","ログは被監査部門の責任で保管されるため、監査人が保管状況を確認する必要はなく、保管の記録も残さなくてよい。","ログの改ざんや欠落の有無を確かめ、ログ自体の完全性を評価する。"],"correctIndex":3,"explanations":["× 誤り。ログが改ざんされないという想定には根拠がなく、証拠として使う前に完全性を評価すべきである。","× 誤り。ログは監査対象期間の証拠であり、期間との関係を確かめないと結論の裏付けにならない。","× 誤り。ログの保管状況の確認は、ログの完全性を評価する上で監査人が行うべき手続である。","○ 正しい。ログの改ざんや欠落の有無を確かめ、ログ自体の完全性を評価してから証拠として使う。"]},{"id":"au-88","type":"mc","chapterIndex":7,"stem":"監査人が、監査手続の一部を監査人の補助者（専門家）に委ねた。監査人の責任として最も適切なものはどれか。","options":["補助者の作業結果は、監査人の確認が不要である。","補助者の作業結果の利用に関わらず、監査意見の責任は監査人にある。","補助者の責任は、補助者が単独で負う。","補助者に委ねた手続は、監査調書に記録する必要がない。"],"correctIndex":1,"explanations":["× 誤り。補助者の作業結果は、監査人が目的に照らして確認し、その適切性を判断する必要がある。","○ 正しい。補助者の作業結果を利用しても、監査意見の責任は監査人が負うのが原則である。","× 誤り。監査意見の責任は監査人に帰属し、補助者が単独で負うわけではない。","× 誤り。補助者に委ねた手続も、監査調書に記録して検証可能にする必要がある。"]},{"id":"au-89","type":"mc","chapterIndex":3,"stem":"監査人が、監査の過程で得たリスクの評価を監査調書に記録する目的として、最も適切なものはどれか。","options":["監査人の作業時間と報酬の配分を管理し、担当者ごとの評価を行うため。","被監査部門の評価を記録するため。","監査の判断の根拠を、後から検証できるようにするため。","監査報告書の体裁を整えるため。"],"correctIndex":2,"explanations":["× 誤り。作業時間の管理や担当者ごとの評価は、監査調書の目的の中心ではなく、判断の根拠の記録が優先される。","× 誤り。被監査部門の評価を記録することは、監査人の判断の根拠を示す目的とは異なる。","○ 正しい。リスク評価の根拠を記録すると、監査の判断の過程を後から検証できる。","× 誤り。報告書の体裁は報告書の作成で扱うもので、監査調書の目的そのものではない。"]},{"id":"au-90","type":"mc","chapterIndex":1,"stem":"監査人が、リスクアプローチに基づく監査計画を立てる際の考え方として、最も適切なものはどれか。","options":["リスクの大きさに応じて、監査の重点と手続の深さを決める。","全ての業務を同じ深さで監査する。","リスクの評価は、被監査部門の見解を中心に決め、監査人の独立した検討は必要な場合に限る。","リスクが小さい業務は、監査の対象から除外し、監査人の工数を大きいリスクの業務に振り向ける。"],"correctIndex":0,"explanations":["○ 正しい。リスクアプローチでは、リスクの大きさに応じて監査の重点と手続の深さを決める。","× 誤り。全ての業務を同じ深さで監査すると、重要なリスクに十分な資源を充てられない。","× 誤り。リスクの評価は監査人が独立に行うもので、被監査部門の見解だけで決めるのは適切ではない。","× 誤り。リスクが小さい業務も、確認が必要な場合があり、一律に除外するのは適切ではない。"]},{"id":"au-91","type":"mc","chapterIndex":5,"stem":"監査人が、監査の過程で重大な不備を発見した。報告のタイミングとして最も適切なものはどれか。","options":["監査報告書を作成するまで、報告を保留して、最終的な結論が固まってから関係者に伝える。","不備の影響が確定するまで、被監査部門にも伝えず、内部だけで扱いを検討する。","不備は、監査終了後のフォローアップで初めて報告し、それまでは監査人の内部資料として管理する。","重大な不備は、速やかに関係者に報告し、必要な対応を促す。"],"correctIndex":3,"explanations":["× 誤り。報告を保留すると是正の機会を失い、適切な対応が遅れる。","× 誤り。不備の影響が確定するまで伝えないと、被監査部門が対応する機会を失う。","× 誤り。フォローアップで初めて報告すると、重大な不備への対応が遅れ、適切ではない。","○ 正しい。重大な不備は速やかに関係者に報告し、必要な対応を促すことが求められる。"]},{"id":"au-92","type":"mc","chapterIndex":4,"stem":"監査人が、監査の結論を出す前に、被監査部門と事実関係を確認する意義として最も適切なものはどれか。","options":["被監査部門の意見に合わせて結論を変えるため。","監査人の認識の誤りを減らし、報告の正確性を高めるため。","監査の結論を、被監査部門の承認に限るため。","事実関係の確認は、監査期間の延長の理由ではない。"],"correctIndex":1,"explanations":["× 誤り。結論を被監査部門の意見に合わせて変えると、独立性が損なわれ、適切ではない。","○ 正しい。事実関係の確認は、監査人の認識の誤りを減らし、報告の正確性を高めるために行う。","× 誤り。監査の結論は監査人の独立した判断によるもので、被監査部門の承認に限るものではない。","× 誤り。事実関係の確認は監査期間の延長の理由ではなく、報告の正確性を高める手続である。"]},{"id":"au-93","type":"mc","chapterIndex":7,"stem":"監査人の独立性に関する記述として、最も適切なものはどれか。","options":["監査人が被監査部門の業務を行っても、影響はない。","監査人は、被監査部門の経営者と親密であるほど、正確な情報を得られる。","監査人は、監査対象の業務に利害関係を持たない立場で判断する。","監査人の独立性は確認しなくてよい。"],"correctIndex":2,"explanations":["× 誤り。監査人が被監査部門の業務を行うと、自らの業務を監査することになり、独立性が損なわれる。","× 誤り。被監査部門の経営者と親密であることは、客観的な判断を妨げ得るため、正確な情報を得る条件とは言えない。","○ 正しい。監査人は、監査対象の業務に利害関係を持たない立場で、客観的に判断することが求められる。","× 誤り。独立性は監査の信頼性の前提であり、確認は監査の品質を保つために必要である。"]},{"id":"au-94","type":"mc","chapterIndex":7,"stem":"監査人が、監査の品質を確保するための取り組みとして、最も適切なものはどれか。","options":["監査計画・実施・報告の各段階で、レビューによる検証を行う。","監査調書を作成せず、監査人の経験と勘に基づいて判断し、判断の過程を記録に残さないで進める。","監査人の作業を、被監査部門が確認する。","監査の結論は、最初の印象を変えずに維持し、後から得られた新たな証拠は扱わない。"],"correctIndex":0,"explanations":["○ 正しい。監査計画・実施・報告の各段階でレビューによる検証を行うことが、監査の品質の確保につながる。","× 誤り。調書を作らず判断の過程を記録しないと、判断の根拠を検証できず、品質を保てない。","× 誤り。被監査部門による確認は監査人の独立性を損なう恐れがあり、品質の確保の方法として適切ではない。","× 誤り。最初の印象を維持すると新たな証拠を取り入れられず、判断の品質が下がる。"]},{"id":"au-95","type":"mc","chapterIndex":1,"stem":"監査人が、監査の過程で監査計画を変更する必要が生じた。最も適切な対応はどれか。","options":["計画の変更は、記録を残さず、実施の過程で監査人が都度判断して進めればよい。","計画を変更すると監査の品質が下がるため、変更せずに当初の計画どおりに監査を完了させる。","計画の変更は、被監査部門の要望に従って、変更の範囲と時期を決めて行う。","変更の理由と影響を記録し、必要に応じて監査の責任者の承認を得る。"],"correctIndex":3,"explanations":["× 誤り。計画の変更を記録しないと、監査の過程を後から検証できず、適切ではない。","× 誤り。必要な変更を行わないと監査の目的を果たせず、品質を下げる恐れがある。","× 誤り。計画の変更は監査人が判断するもので、被監査部門の要望に従うのは独立性の観点から適切ではない。","○ 正しい。変更の理由と影響を記録し、必要に応じて監査の責任者の承認を得ることが求められる。"]},{"id":"au-96","type":"mc","chapterIndex":3,"stem":"IT全般統制に関する記述として、最も適切なものはどれか。","options":["個別の業務処理の正確性と網羅性を確かめるための統制である。","システムの開発・保守・運用・アクセス管理などの基盤に関する統制である。","業務担当者が取引を承認する際の統制である。","監査人が監査報告書を作成する際の統制である。"],"correctIndex":1,"explanations":["× 誤り。個別の業務処理の正確性と網羅性を確かめるのは、業務処理統制の役割である。","○ 正しい。IT全般統制は、開発・保守・運用・アクセス管理などのシステムの基盤に関する統制である。","× 誤り。業務担当者の承認は業務処理統制に関わるもので、IT全般統制の中心ではない。","× 誤り。監査報告書の作成は監査人の手続であり、IT全般統制の対象ではない。"]},{"id":"au-97","type":"mc","chapterIndex":3,"stem":"IT全般統制の一つであるアクセス管理の目的として、最も適切なものはどれか。","options":["利用者の業務効率を高めるため。","システムの処理速度を向上させるため、利用者の認証を省略し、アクセスの記録も必要最小限にとどめて運用する。","権限のない者による情報資産へのアクセスを防ぎ、必要な者だけが利用できるようにするため。","利用者の操作履歴を消去しやすくするため。"],"correctIndex":2,"explanations":["× 誤り。利用者の業務効率の向上は、アクセス管理の主な目的ではない。","× 誤り。処理速度の向上のために認証を省き記録を減らすと、アクセス管理の目的に反する。","○ 正しい。権限のない者のアクセスを防ぎ、必要な利用者だけが情報資産を使えるようにすることが目的である。","× 誤り。操作履歴を消去しやすくすると不正の検出を妨げるため、統制の目的に反する。"]},{"id":"au-98","type":"mc","chapterIndex":3,"stem":"開発と運用の職務分離に関する記述として、最も適切なものはどれか。","options":["開発者と運用者を分けることで、不正や誤りのリスクを低減する。","開発者が本番環境への反映も行うことで、作業が速くなり、テストの工数も削減できる。","職務分離は、小規模なシステムでは必ず不要である。","職務分離は、監査人が担当すべき統制であり、組織は監査人に任せて整備しなくてよく、業務の内容に応じて判断すればよい。"],"correctIndex":0,"explanations":["○ 正しい。開発者と運用者を分けると相互の牽制が働き、不正や誤りのリスクを低減できる。","× 誤り。開発者が本番環境へ反映すると、不正や誤りを相互に牽制できず、統制の観点から不適切である。","× 誤り。小規模なシステムでも職務分離の考え方が必要になる場合があり、一律に不要とは言えない。","× 誤り。職務分離は組織が整備する統制であり、監査人が担当するものではない。"]},{"id":"au-99","type":"mc","chapterIndex":3,"stem":"システムの変更管理に関する統制として、最も適切なものはどれか。","options":["緊急の変更の場合は、事後の承認も記録も残す必要はなく、そのまま本番に反映してよい。","変更は、担当者の判断で随時本番に反映してよく、事後の報告も必要としない。","変更の内容は、利用者に通知する必要がなく、業務への影響も確認しなくてよい。","変更は、影響の評価と承認を経て、テストを行ってから本番に反映する。"],"correctIndex":3,"explanations":["× 誤り。緊急の変更でも事後の承認と記録が必要であり、記録を残さないのは適切ではない。","× 誤り。担当者の判断だけで本番に反映すると、承認の統制が働かず、適切ではない。","× 誤り。変更の内容を利用者に知らせないと、業務への影響を管理できず、適切ではない。","○ 正しい。変更は影響の評価と承認を経て、テストを行ってから本番に反映する。"]},{"id":"au-100","type":"mc","chapterIndex":3,"stem":"システムのバックアップに関する記述として、最も適切なものはどれか。","options":["バックアップは、取得しても復旧手順を確認する必要はない。","バックアップは、定期的に取得し、復旧の手順を確認することで、障害時の対応力を高める。","バックアップは本番と同じ場所に保管すれば、災害時にも有効である。","バックアップは、取得の頻度を業務の重要性と無関係に決めてよい。"],"correctIndex":1,"explanations":["× 誤り。復旧手順を確認しないと、障害時に実際に復旧できるかが分からず、適切ではない。","○ 正しい。バックアップは定期的に取得し、復旧の手順を確認することで、障害時の対応力を高める。","× 誤り。本番と同じ場所に保管すると災害で同時に失われる恐れがあり、保管場所として適切ではない。","× 誤り。取得の頻度は業務の重要性や許容できるデータの損失量に応じて決めるべきである。"]},{"id":"au-101","type":"mc","chapterIndex":3,"stem":"IT全般統制の評価で、監査人がシステムの特権ID（管理者権限）の利用を確かめる理由として最も適切なものはどれか。","options":["特権IDは監査人だけが使えるため、確認は不要である。","特権IDは、業務の効率を上げるため、確認の対象外であるため。","特権IDは、利用者が自由に使えるため、利用の範囲と記録を確かめる必要があるため。","特権IDは、利用頻度が低いため、統制の対象にならず、利用の記録も確認の対象から外れるため。"],"correctIndex":2,"explanations":["× 誤り。特権IDは監査人だけが使うものではなく、確認が必要な統制の対象である。","× 誤り。特権IDの利用は効率のためでも統制の対象であり、確認の対象外にはならない。","○ 正しい。特権IDは強い権限を持つため、利用の範囲と記録を確かめ、不正や誤りを防ぐ必要がある。","× 誤り。利用頻度が低くても、強い権限を持つため統制の対象として確認が必要である。"]},{"id":"au-102","type":"mc","chapterIndex":3,"stem":"システムの保守において、保守担当者が本番データに直接アクセスする場合の統制として、最も適切なものはどれか。","options":["アクセスの目的と期間を定め、承認を得て、作業の記録を残す。","保守担当者の判断で、いつでも本番データにアクセスでき、作業の記録は担当者の裁量で残す。","アクセスの記録は、作業後に消去する。","アクセスには統制を設けず、作業の過程は確認せず、作業後の結果だけを確認すれば足りる。"],"correctIndex":0,"explanations":["○ 正しい。アクセスの目的と期間を定め、承認を得て記録を残すことで、不正や誤りを防げる。","× 誤り。担当者の判断で自由にアクセスできると、統制が働かず、不正や誤りを防げない。","× 誤り。アクセスの記録を作業後に消去すると、後からの検証ができず、統制の目的に反する。","× 誤り。統制を設けず結果だけを確認すると、作業の過程での不正や誤りを検出できない。"]},{"id":"au-103","type":"mc","chapterIndex":0,"stem":"システム管理基準の考え方として、最も適切なものはどれか。","options":["システム管理基準は、監査人が守るべき行為規範を定めたものであり、監査の判断尺度としては用いず、もっぱら監査人の心構えを示す基準である。","システム管理基準は、個別の業務の手順書そのものであり、組織が変更してはならない文書として、監査人が一律に適用する。","システム管理基準は、監査報告書の書式と提出期限、配布先の範囲を定めたものであり、評価の判断尺度は別の基準に委ねることになる。","システム管理基準は、システムのガバナンス、マネジメント、コントロールを評価する際の判断尺度として用いられる。"],"correctIndex":3,"explanations":["× 誤り。システム管理基準は判断尺度であり、監査人の行為規範は別にシステム監査基準が定める。","× 誤り。システム管理基準は組織が自らの特性に応じて調整して用いるもので、手順書そのものではない。","× 誤り。システム管理基準は報告書の書式を定めるものではなく、評価の判断尺度を示すものである。","○ 正しい。システム管理基準は、ガバナンス・マネジメント・コントロールを評価する際の判断尺度として用いられる。"]},{"id":"au-104","type":"mc","chapterIndex":3,"stem":"業務処理統制に関する記述として、最も適切なものはどれか。","options":["業務処理の結果を、運用の担当者が自ら確認して保証する統制である。","個別の業務処理（入力・処理・出力）の正確性と網羅性を確かめる統制である。","開発の計画を立てる統制である。","情報セキュリティ教育を行う統制である。"],"correctIndex":1,"explanations":["× 誤り。システム全体の運用体制はIT全般統制の範囲に属し、業務処理の結果を運用担当者が自ら保証するものではない。","○ 正しい。業務処理統制は、個別の業務処理（入力・処理・出力）の正確性と網羅性を確かめる統制である。","× 誤り。開発の計画はIT全般統制に関わるもので、業務処理統制の中心ではない。","× 誤り。情報セキュリティ教育は組織的な統制であり、業務処理統制の対象ではない。"]},{"id":"au-105","type":"mc","chapterIndex":3,"stem":"入力データのチェックに関する統制として、最も適切なものはどれか。","options":["入力データは、全て正しいと仮定して処理を行う。","入力データの誤りは出力の段階で一括して修正し、入力時点の検査は担当者の判断に任せる。","入力データの形式や範囲をシステムで検査し、誤りを入力時点で検出する。","入力データの検査は、担当者の経験に任せる。"],"correctIndex":2,"explanations":["× 誤り。入力データを全て正しいと仮定すると、誤りが処理に紛れ込み、統制の目的に反する。","× 誤り。入力時の誤りを出力段階で一括修正すると、誤りの原因を特定しにくく、統制として不十分である。","○ 正しい。入力時点でシステムが形式や範囲を検査すると、誤りを早期に検出し、後の処理への影響を防げる。","× 誤り。担当者の経験だけに頼ると、統制の再現性と網羅性が保てない。"]},{"id":"au-106","type":"mc","chapterIndex":3,"stem":"処理の網羅性を確かめる統制の例として、最も適切なものはどれか。","options":["処理の件数と合計金額を、入力と出力の間で照合する。","処理の結果を、担当者の印象で判断する。","処理の所要時間を、利用者が感じた速さで評価し、その結果を業務改善の指標として用いる。","処理の結果を、外部の業界の平均値と比べるだけにし、社内の入力と出力の照合は行わずに結論を出す。"],"correctIndex":0,"explanations":["○ 正しい。入力と出力の件数や金額を照合すると、処理対象の欠落がないかを確かめられる。","× 誤り。担当者の印象での判断は、網羅性を検証する客観的な方法ではない。","× 誤り。処理の所要時間の評価は、処理の網羅性とは直接の関係がない。","× 誤り。外部の業界平均との比較だけでは、個別の処理の網羅性を確かめる手続としては不十分である。"]},{"id":"au-107","type":"mc","chapterIndex":3,"stem":"業務処理の結果に対する監査人の確認として、最も適切なものはどれか。","options":["処理結果を、システムの出力だけで判断し、入力との関係や処理のロジックは見ないで結論を出す。","処理結果は利用者の確認に任せ、監査人は独自の確認を行わず、利用者の承認をもって完了とし、後日の確認も行わない。","処理結果の誤りは後の期間で修正されるため、その期間の結論にも影響せず、監査では問題としない。","処理結果の正確性を、入力データと処理ロジックに照らして検証する。"],"correctIndex":3,"explanations":["× 誤り。出力だけで判断して入力との関係を見ないと、処理の正確性を検証できず、適切ではない。","× 誤り。利用者の確認に任せ監査人が確認しないのは、独立した検証にならない。","× 誤り。後の期間で修正されても、その期間の結論に影響するため、監査で問題として扱うべきである。","○ 正しい。処理結果の正確性を、入力データと処理ロジックに照らして検証する。"]},{"id":"au-108","type":"mc","chapterIndex":3,"stem":"例外処理（エラー処理）の統制として、最も適切なものはどれか。","options":["エラーは、発生しても記録せず、担当者が手作業で修正する。","エラーは、発生した時点で記録し、原因を調べて承認を得て対応する。","エラーは、システムが自動的に無視して結果に含めない。","エラーは、利用者に報告せず、統計にも残さない。"],"correctIndex":1,"explanations":["× 誤り。エラーを記録せず手作業で修正すると、修正の経緯が残らず、統制として不十分である。","○ 正しい。エラーは発生した時点で記録し、原因を調べて承認を得て対応すると、誤りの見逃しや不正を防げる。","× 誤り。エラーを自動的に無視すると、誤りが結果に紛れ込み、正確性を損なう。","× 誤り。エラーを報告も記録もしないと、傾向を把握できず、統制の改善につながらない。"]},{"id":"au-109","type":"mc","chapterIndex":3,"stem":"業務処理統制の評価で、監査人が手作業による修正の件数を確かめる理由として最も適切なものはどれか。","options":["手作業による修正は、監査人の評価の対象外であるため。","手作業による修正は、業務の効率を測る指標として使うため確認する。","手作業による修正は、統制の例外として、その件数と内容から統制の状況を把握するため。","手作業による修正は、監査報告書の体裁のためだけに確認し、統制の状況の評価や、その後の改善の検討には使わない。"],"correctIndex":2,"explanations":["× 誤り。手作業による修正は統制の例外であり、監査の評価の対象になる。","× 誤り。手作業による修正は効率の指標としてではなく、統制の状況を把握する材料として確認する。","○ 正しい。手作業の修正は統制の例外であり、件数と内容から統制が機能しているかを把握するために確認する。","× 誤り。手作業による修正の確認は報告書の体裁のためではなく、統制の評価のために行う。"]},{"id":"au-110","type":"mc","chapterIndex":0,"stem":"ITガバナンスに関する記述として、最も適切なものはどれか。","options":["ITガバナンスは、経営者がITの戦略と投資を評価・指示・監視し、リスクを管理する仕組みである。","ITガバナンスは、システムの個別の開発作業を指揮し、開発の進捗と品質を経営者が直接管理する仕組みである。","ITガバナンスは、利用者の操作を制限する仕組みである。","ITガバナンスは、監査人が独自の判断で定め、経営者や取締役会の関与を必要としない規則であり、監査の基準として用いる。"],"correctIndex":0,"explanations":["○ 正しい。ITガバナンスは、経営者がITの戦略と投資を評価・指示・監視し、リスクを管理する仕組みである。","× 誤り。個別の開発作業の指揮はITマネジメントの役割であり、ガバナンスの中心ではない。","× 誤り。利用者の操作の制限は統制の一部であり、ITガバナンスの定義そのものではない。","× 誤り。ITガバナンスは経営の仕組みであり、監査人が定める規則ではない。"]},{"id":"au-111","type":"mc","chapterIndex":0,"stem":"ITガバナンスの評価で、取締役会や経営者がITの投資の妥当性を確かめる仕組みとして、最も適切なものはどれか。","options":["投資の判断は担当部門の判断に任せ、経営者は関与しないが、結果の報告だけは毎年受け取る。","投資の判断は、最も安い提案を選ぶことだけで決め、事業目的との関係は考えない。","投資の判断は、過去の投資の結果を振り返らず、同じ失敗を繰り返すことを許容する。","投資の判断に、事業目的との整合性と効果の検証を組み込む。"],"correctIndex":3,"explanations":["× 誤り。経営者の関与がないと、ITガバナンスとして機能せず、適切ではない。","× 誤り。最も安い提案を選ぶだけでは、事業目的との整合性を検証できない。","× 誤り。過去の投資の結果を振り返らないと、判断の改善につながらず、適切ではない。","○ 正しい。投資の判断に事業目的との整合性と効果の検証を組み込むことで、ITへの投資の妥当性を確かめられる。"]},{"id":"au-112","type":"mc","chapterIndex":7,"stem":"ITガバナンスに関する指標（KPI・KGI）の役割として、最も適切なものはどれか。","options":["IT部門の業務量を把握するだけの指標である。","ITの目標の達成度と事業への貢献を、経営者が把握するための指標である。","利用者数だけを示す指標である。","監査人の評価の結果を示す指標である。"],"correctIndex":1,"explanations":["× 誤り。IT部門の業務量だけでは、事業への貢献や目標の達成度を把握できない。","○ 正しい。KPI・KGIは、ITの目標の達成度と事業への貢献を経営者が把握し、ITの管理と判断に活かすための指標である。","× 誤り。利用者数だけでは、ITの目標の達成度を十分に示せない。","× 誤り。監査人の評価の結果は、指標とは別のものであり、KPI・KGIの役割ではない。"]},{"id":"au-113","type":"mc","chapterIndex":0,"stem":"ITガバナンスにおけるリスク管理の考え方として、最も適切なものはどれか。","options":["リスクは、発生した後に対応すれば十分であり、事前の評価は不要で、影響が出た時点で判断する。","リスクは、全て回避することが最善である。","リスクは、組織の目標に照らして評価し、許容範囲を定めて対応を決める。","リスクは、担当者の判断に任せ、経営者は把握しない。"],"correctIndex":2,"explanations":["× 誤り。発生後の対応だけでは事前の備えができず、ガバナンスとして不十分である。","× 誤り。全てのリスクを回避すると事業の機会も失うため、最善とは言えない。","○ 正しい。リスクは組織の目標に照らして評価し、許容範囲を定めて対応を決めるのが基本である。","× 誤り。経営者がリスクを把握しないと、組織としての判断と責任が果たせない。"]},{"id":"au-114","type":"mc","chapterIndex":1,"stem":"ITの外部委託（アウトソーシング）に関する統制として、最も適切なものはどれか。","options":["委託先の選定、契約、サービスレベルの監視を行い、委託元が責任を持つ。","委託先に業務を任せれば、委託元の責任はなくなり、委託先の管理は契約書に記載するだけで足り、定期的な確認は不要である。","委託先の選定は、価格だけで決める。","委託先の業務は、委託元の監査の対象にはならず、委託元の統制の範囲にも含まれないと考えてよい。"],"correctIndex":0,"explanations":["○ 正しい。委託先の選定・契約・サービスレベルの監視を通じて、委託元が責任を持って管理する必要がある。","× 誤り。業務を委託しても、委託元は業務の遂行とデータの保護について責任を負う。","× 誤り。価格だけで委託先を選定すると、セキュリティや品質の確保が不十分になり、適切ではない。","× 誤り。委託先の業務も、委託元の統制の一部として監査の対象になり得る。"]},{"id":"au-115","type":"mc","chapterIndex":3,"stem":"システム管理基準における「開発」の管理に関する考え方として、最も適切なものはどれか。","options":["開発は、利用者の要望を聞かずに開発者の判断だけで進め、完成後の検収の段階で要件を確認する。","開発は、テストを省略して早く本番に出すことを優先し、障害は本番で発見すればよいとする。","開発は、完成した後にのみ文書を作成し、それまでの各段階の判断や記録は残さず、後から検証できない形で進める。","開発は、要件の定義、設計、テスト、移行の各段階を管理し、承認を経て進める。"],"correctIndex":3,"explanations":["× 誤り。利用者の要望を聞かないと、業務の要件を満たさないシステムになる恐れがある。","× 誤り。テストを省略すると、障害や誤りを本番で発見することになり、適切ではない。","× 誤り。文書は開発の各段階で作成し、後から検証できるようにするのが原則である。","○ 正しい。開発は要件定義・設計・テスト・移行の各段階を管理し、承認を経て進めることで、品質とリスクを管理できる。"]},{"id":"au-116","type":"mc","chapterIndex":3,"stem":"システム管理基準における「運用」の管理の例として、最も適切なものはどれか。","options":["運用は、担当者の経験と勘に任せ、手順は定めない。","運用の手順を定め、作業の記録を残し、障害の発生時に原因を分析する。","運用の記録は、必要な場合を除き残さない。","運用の障害は、発生しても報告しない。"],"correctIndex":1,"explanations":["× 誤り。運用の手順を定めないと、担当者による作業のばらつきが生じ、統制として不十分である。","○ 正しい。運用の手順を定め、作業の記録を残し、障害の発生時に原因を分析することで、運用の品質とリスクを管理できる。","× 誤り。運用の記録を残さないと、運用の状況を後から検証できず、適切ではない。","× 誤り。運用の障害を報告しないと、原因の分析と再発の防止ができず、適切ではない。"]},{"id":"au-117","type":"mc","chapterIndex":3,"stem":"システム管理基準における「情報セキュリティ」の管理の考え方として、最も適切なものはどれか。","options":["情報セキュリティは、技術的な対策だけで十分であり、組織的な対策や人への教育は不要であるとされる。","情報セキュリティは、一度対策を立てれば、見直しは不要である。","情報セキュリティは、技術・組織・人の各面から、リスクに応じた対策を組み合わせて管理する。","情報セキュリティは、個人の注意に任せ、組織としての規程は定めない方針である。"],"correctIndex":2,"explanations":["× 誤り。技術的対策だけでは、人や組織の要因によるリスクに対応できず、不十分である。","× 誤り。脅威は変化するため、対策は定期的に見直す必要がある。","○ 正しい。情報セキュリティは、技術・組織・人の各面から、リスクに応じた対策を組み合わせて管理する。","× 誤り。組織の規程がないと、対策の統一的な運用と責任の所在が定まらず、不十分である。"]},{"id":"au-118","type":"mc","chapterIndex":3,"stem":"システムの障害時の対応計画（事業継続の観点）に関する記述として、最も適切なものはどれか。","options":["計画は、重要な業務を優先順位づけし、復旧の目標時間と手順を定めて、訓練で確認する。","計画は、作成すれば十分であり、訓練を行う必要はない。","計画は、障害の規模に関係なく同じ手順で対応し、経営者への報告は障害の収束後にまとめて行う。","計画は、経営者には報告せず、担当部門だけで管理し、障害の対応状況も外部には公表せず、事後の検証も行わない。"],"correctIndex":0,"explanations":["○ 正しい。障害時の対応計画は、重要な業務を優先順位づけし、復旧の目標時間と手順を定めて、訓練で実効性を確かめることが求められる。","× 誤り。訓練をしないと、計画が実際に機能するかを確かめられず、不十分である。","× 誤り。障害の規模に応じた対応の違いを定めないと、重大な障害に十分対応できない。","× 誤り。経営者への報告がないと、事業への影響の判断と資源配分ができず、適切ではない。"]},{"id":"au-119","type":"mc","chapterIndex":3,"stem":"システム監査人が、IT全般統制と業務処理統制の関係を評価する際の考え方として、最も適切なものはどれか。","options":["IT全般統制が有効であれば、業務処理統制の評価は不要であり、個別の処理結果も確認しなくてよい。","業務処理統制が有効であれば、IT全般統制の評価は不要であり、基盤の確認は省いてよい。","IT全般統制と業務処理統制は独立しており、関係を考える必要はなく、それぞれの結果を単純に合算する。","IT全般統制は業務処理統制の基盤となるため、両方の関係を踏まえて評価する。"],"correctIndex":3,"explanations":["× 誤り。IT全般統制が有効でも、個別の業務処理の正確性は別途確かめる必要がある。","× 誤り。業務処理統制だけでは、システムの基盤の統制が機能しているかを裏付けられない。","× 誤り。両者は相互に関係しており、独立して評価すると評価の結論に矛盾が生じ得る。","○ 正しい。IT全般統制は業務処理統制の基盤であるため、両者の関係を踏まえて評価するのが適切である。"]},{"id":"au-120","type":"mc","chapterIndex":4,"stem":"情報システムの統制の評価で、監査人が最終的な判断を下すときの留意点として、最も適切なものはどれか。","options":["評価の結果は、被監査部門の意見に合わせて変更する。","評価の結果は、統制の有効性の判断に用いる根拠を示し、残るリスクを明記する。","評価の結果は、統制の有効性だけを示し、残るリスクは示さない。","評価の結果は、判断の根拠を示さず、結論だけを報告する。"],"correctIndex":1,"explanations":["× 誤り。被監査部門の意見で結論を変えると、独立性が損なわれ、適切ではない。","○ 正しい。評価の結果は統制の有効性の判断に用いる根拠を示し、残るリスクを明記することで、経営者が結論を理解し対応を判断できる。","× 誤り。残るリスクを示さないと、経営者が判断に必要な情報を得られない。","× 誤り。判断の根拠を示さない結論は検証できず、報告として不十分である。"]},{"id":"au-121","type":"mc","chapterIndex":0,"stem":"情報セキュリティ管理基準の位置付けとして、最も適切なものはどれか。","options":["監査人が状況を評価する際の判断の物差しとなる管理策の集まりで、組織の実情に応じて適用範囲を選んで用いる。","監査人の独立性と専門的能力の要件を定めたもので、個々の監査の実施手続きや報告の記載方法までを細かく規定し、その全てを必ず満たすことが求められている。","監査人の独立性と専門的能力の要件を定めたもので、監査の実施手続きは含まない。","監査報告書の記載形式だけを定めたもので、評価の基準としては用いない。"],"correctIndex":0,"explanations":["○ 正しい。管理基準はコントロール群で、組織が適用範囲を選んで判断の基準に使う。","× 誤り。管理基準は判断の物差しであり、個々の手続きを必ず満たすことを求めるものではない。","× 誤り。独立性と能力の要件は一般基準の内容で、管理基準の位置付けではない。","× 誤り。管理基準は評価の基準として用いるもので、報告書の形式を定めるものではない。"]},{"id":"au-122","type":"mc","chapterIndex":0,"stem":"保証型の情報セキュリティ監査の特徴として、最も適切なものはどれか。","options":["監査人が問題点の指摘と改善提案を行うことに重点を置き、一定の基準に照らした意見表明や保証の付与は行わず、報告の結論も示さない。","監査人が独立した立場から、一定の基準に照らして情報セキュリティの適切性について意見を表明し、保証を与える。","経営者が実施した内部統制の状況を監査人が追認するだけでよく、独立した立場からの評価や意見表明は、監査の目的に含まれず、必要としない簡易な確認である。","監査対象の情報資産を洗い出し、台帳を整備するための事前の準備作業である。"],"correctIndex":1,"explanations":["× 誤り。助言型の特徴であり、保証型では意見表明と保証の付与を行う。","○ 正しい。保証型は意見表明と保証を与えるタイプの監査である。","× 誤り。経営者の内部統制を追認するだけの確認は、保証型の監査には当たらない。","× 誤り。台帳の整備は監査の前準備にすぎず、保証型の特徴を説明するものではない。"]},{"id":"au-123","type":"mc","chapterIndex":5,"stem":"助言型の情報セキュリティ監査において、報告書の中心となる記載として、最も適切なものはどれか。","options":["監査の対象となった情報システムの全機能を一覧にして、利用者向けの手順書として示し、利用者が迷わず操作できる状態を確認する。","監査人が結論として適切か不適切かを明示し、その判定の根拠は別途示さないことで、報告書の記載を簡潔にする。","管理基準に照らして見つかった問題点と、その改善に向けた提言を示す。","監査人の経歴と独立性の証明を冒頭に示し、指摘事項は付録にまとめて、報告書の本文は結論の要約だけに絞る。"],"correctIndex":2,"explanations":["× 誤り。利用者向けの手順書は助言型監査の報告書の中心ではなく、問題点と提言が中心である。","× 誤り。結論を示しても根拠を省くことは、説明責任の観点から適切な記載ではない。","○ 正しい。助言型では、問題点の指摘と改善提言が報告の中心になる。","× 誤り。経歴や独立性の証明は報告の中心ではなく、指摘と提言を示すことが中心である。"]},{"id":"au-124","type":"mc","chapterIndex":3,"stem":"脆弱性診断の位置付けとして、最も適切なものはどれか。","options":["既知の脆弱性の有無を技術的に検査するもので、設計や運用の統制の有効性を単独で評価できるものではない。","組織の情報セキュリティ方針の妥当性を、経営層へのヒアリングだけで判定する作業である。","外部の攻撃者による侵入を、監査人が実際に成功させて実証することが目的である。","一度実施すれば、その後の変更や新たな脆弱性を含めて安全性が保証される。"],"correctIndex":0,"explanations":["○ 正しい。既知の脆弱性の検査は技術面の確認にとどまり、統制全体の評価にはならない。","× 誤り。方針の妥当性は文書とヒアリングで確認するもので、脆弱性診断の位置付けではない。","× 誤り。侵入の成功自体は目的ではなく、既知の脆弱性の検出が診断の目的である。","× 誤り。一度の診断では、その後の変更や新たな脆弱性への安全性は保証されない。"]},{"id":"au-125","type":"mc","chapterIndex":1,"stem":"クラウドサービスを利用した情報システムの監査で、監査人が最初に確認すべき事項として、最も適切なものはどれか。","options":["利用企業とクラウド事業者の間で、セキュリティの責任範囲（責任共有モデル）が契約と文書で明確に定められているかを確認する。","利用企業が所在地と物理的な台数を調べ、クラウド事業者の内部統制の状況は、利用企業の社内規程に基づいて一律に評価すればよく、契約上の責任範囲の確認は不要である。","利用企業の社内システムと同じ監査手続きを、すべてクラウド事業者に対して実施するよう求める。","クラウド事業者が提供する全ての機能を利用企業が個別に検証できることを確認する。"],"correctIndex":0,"explanations":["○ 正しい。どこまでを利用企業が管理し、どこからを事業者が管理するかが統制の前提になる。","× 誤り。社内規程で一律に評価すれば足りるわけではなく、責任範囲の契約上の確認が必要である。","× 誤り。事業者の設備を利用企業の手続きで直接監査することは通常できず、契約で確認する。","× 誤り。全機能の個別検証は現実的でなく、責任範囲の確認が最初に求められる。"]},{"id":"au-126","type":"mc","chapterIndex":1,"stem":"外部委託先の情報セキュリティ監査で、契約上確認すべき事項として、最も適切なものはどれか。","options":["委託料の支払条件と支払期日を確認するとともに、委託先の売上推移や取引先の一覧を併せて確認すれば、情報セキュリティの管理状況の把握として十分である。","委託契約に監査権、再委託の条件、事故発生時の通知義務と報告内容が定められているかを確認する。","委託先の役員の経歴を確認し、業界での評判を調べることで十分な管理体制が確認できる。","委託先が使用するすべてのソフトウェアのソースコードを、契約締結前に監査人が確認できることを求める。"],"correctIndex":1,"explanations":["× 誤り。支払条件の確認だけでは、委託先の情報セキュリティの管理状況は把握できない。","○ 正しい。監査権、再委託、事故時の通知は委託先の管理を確かめるための契約上の要件である。","× 誤り。役員の経歴や評判は、委託先の管理体制を確認する根拠として不十分である。","× 誤り。ソースコードの全面的な確認を一律に求めるのは現実的でなく、契約で確認すべき事項ではない。"]},{"id":"au-127","type":"mc","chapterIndex":7,"stem":"情報セキュリティ監査における監査人の独立性の説明として、最も適切なものはどれか。","options":["監査人が被監査部門の業務を補助することで、業務の実態を深く理解できる状態を指し、その分だけ判断の客観性が増す。","監査人が自ら情報システムを設計し、その設計の妥当性を監査で評価する状態を指し、設計と監査の両方を一人で担い、判断の独立性を確保する。","監査人が被監査部門と利害関係がなく、外観上も誠実性や客観性を疑われない状態であることを指す。","監査人が被監査部門の業務改善計画を作成してその実施を指導し、結果の検証も同じ担当者が引き続き行う状態を指す。"],"correctIndex":2,"explanations":["× 誤り。業務を補助すると被監査部門と一体になり、独立性は損なわれる。","× 誤り
