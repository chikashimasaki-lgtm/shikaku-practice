が整っており、指摘の対象とはならない。","○ 登録から支払承認まで一人で完結でき、牽制が働かないため重要な指摘事項となる。"]},{"id":"cisa-123","type":"mc","chapterIndex":4,"stem":"暗号鍵の管理に関する監査人の確認事項として、最も適切なものはどれか。","options":["暗号鍵は、生成から廃棄まで管理台帳で追跡する。","暗号鍵は、利用者が個別に保管し、必要な時に各自が生成して利用する運用とし、鍵の管理台帳は作成しない。","暗号鍵は、同一の鍵を全システムで共有し、有効期限を設けずに長期間にわたって使い続けることを原則とする。","暗号鍵は、開発担当者が保管して管理し、本番環境への反映時にだけ、保管場所の変更履歴を記録する。"],"correctIndex":0,"explanations":["○ 鍵のライフサイクルを台帳で追跡することが、管理の基本となる。","× 鍵の管理台帳がなく、個人の判断に任せると追跡できない。","× 同一鍵の共有と無期限の利用は、漏えい時の影響を広げる。","× 開発担当者への集中と、台帳を伴わない管理は適切でない。"]},{"id":"cisa-124","type":"mc","chapterIndex":4,"stem":"ファイアウォールのルール見直しに関して、監査人が確認すべき事項として最も適切なものはどれか。","options":["ルールは作成時のまま、見直しを行わない。","不要になったルールを棚卸しし、業務上の必要性と承認の記録を確認するとともに、変更の影響範囲を評価している。","ルールの変更は、担当者が個別に判断して行い、事後の報告は求めない。","全ての通信を許可するルールを設定し、例外のみを個別に制限する運用とする。"],"correctIndex":1,"explanations":["× 見直しを行わないと、不要な許可が残り続ける。","○ 棚卸しと承認記録の確認は、ルールの妥当性を検証する基本的な手続である。","× 変更を事後報告しない運用では、承認統制が働かない。","× 全通信を許可する設定は、ファイアウォールの防御機能を失わせる。"]},{"id":"cisa-125","type":"mc","chapterIndex":4,"stem":"サーバ室の入退室管理に関する監査人の評価として、最も適切なものはどれか。","options":["入退室の記録は、本人が手書きで記入し、担当者が月末にまとめて確認する。","入退室は、担当者の口頭での申告だけで許可し、入室記録は作成せず、サーバ室の鍵は全員が共有して保管する運用とする。","入退室は、権限者を必要最小限に限定して登録し、入退室の記録を定期的に権限者が確認している。","入退室の記録は、保管期限を設けず、必要に応じて紙の台帳に記入する。"],"correctIndex":2,"explanations":["× 手書きの記録は改ざんが容易で、確認の実効性も低い。","× 口頭申告による許可と記録の不作成は、統制として成立しない。","○ 権限の限定と記録の定期確認は、物理アクセス統制の基本である。","× 保管期限のない紙の記録では、事後の検証が困難になる。"]},{"id":"cisa-126","type":"mc","chapterIndex":4,"stem":"脆弱性への対応に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["重大な脆弱性への対応は、影響範囲と悪用の状況を評価し、優先順位を付けて、対応結果を記録し、管理者が確認している。","脆弱性情報は、資産台帳と照合し、対応期限と担当者を定めて、進捗を月次の会議で報告する運用になっている。","脆弱性の対応状況は、月次で経営層に報告している。","重大な脆弱性が公表されても、対応の要否を判断せず、数か月にわたり放置している状況である。"],"correctIndex":3,"explanations":["× 評価と記録を行っており、指摘の状況にはあたらない。","× 台帳照合と期限管理ができており、問題のない運用である。","× 定期的な報告を行っており、指摘の状況ではない。","○ 対応の要否を判断せず放置することは、既知の脆弱性を悪用されるリスクを高める。"]},{"id":"cisa-127","type":"mc","chapterIndex":4,"stem":"セキュリティインシデントの発生時に、監査人が最初に確認すべき事項として最も適切なものはどれか。","options":["インシデントの事実関係を記録し、対応の責任者を明確にする。","インシデントの原因が特定されるまで、関係者への通知を一切行わない方針を取り、対外的な発表の要否を経営層が判断する。","被害の範囲を確定するまで、関係部門の対応を保留にして、復旧の作業も開始しない運用とする。","インシデントの情報は、担当者の判断で個別に扱い、記録は事後にまとめて残すことを原則とする。"],"correctIndex":0,"explanations":["○ 正しい。事実関係の記録と責任者の明確化が、初動対応の出発点となる。","× 通知を一切行わない方針は、対応の遅れと信頼の低下を招く。","× 被害範囲の確定を待って保留にすると、被害が拡大するおそれがある。","× 個別対応と事後記録では、対応の全体像と証跡が残らない。"]},{"id":"cisa-128","type":"mc","chapterIndex":3,"stem":"バックアップの復旧テストに関する監査人の確認事項として最も適切なものはどれか。","options":["バックアップは取得しているため、復旧テストは不要とする。","復旧テストを定期的に実施し、目標復旧時間を満たすか、結果を記録して経営層が確認している。","バックアップの取得結果は、担当者が口頭で報告する運用とする。","復旧テストは、本番環境に直接適用して、影響が出た場合のみ見直す。"],"correctIndex":1,"explanations":["× 取得だけでは復旧できることは保証されない。","○ 定期的な復旧テストと結果の確認が、復旧能力の検証となる。","× 口頭報告では、取得の完全性を検証できない。","× 本番環境への直接適用は、業務への影響を引き起こすおそれがある。"]},{"id":"cisa-129","type":"mc","chapterIndex":4,"stem":"クラウドサービスの利用における責任分担に関して、監査人の評価として最も適切なものはどれか。","options":["クラウド事業者が全ての情報セキュリティ責任を負うため、利用企業は設定やデータの管理について確認する必要がない。","責任分担はサービスの契約書に記載がないため、監査の対象外とする。","利用企業は、契約と責任分担の範囲を確認し、自社が担う設定やアクセス管理を統制する。","クラウドは外部のサービスなので、社内の統制基準は適用しない。"],"correctIndex":2,"explanations":["× 利用企業も設定やデータの管理に責任を負う。","× 契約書に記載がなくても、監査の対象とすべき統制は存在する。","○ 責任分担の範囲を確認し、利用企業が担う統制を整備・評価することが求められる。","× 外部サービスでも、自社の統制基準を適用して評価する必要がある。"]},{"id":"cisa-130","type":"mc","chapterIndex":4,"stem":"無線LANの管理に関する次の状況のうち、監査人が最も不適切と判断するものはどれか。","options":["無線LANは、WPA2またはWPA3の暗号化を設定し、接続可能な機器を登録制にして、定期的に接続履歴を確認している。","無線LANのSSIDは、利用部門ごとに分けて、認証方式を部門の責任者が定期的に見直し、ログを保管している。","無線LANの利用は、社内の業務に限り、来客には接続を許可しない運用である。","無線LANは、暗号化を設定せず、接続機器の登録も行わず、利用者の判断で接続させている。"],"correctIndex":3,"explanations":["× 暗号化・機器登録・履歴確認は適切な管理である。","× 部門別のSSID分離と認証の見直しは、適切な管理である。","× 来客の接続制限を含む利用制限は適切な運用である。","○ 暗号化も機器登録もなく、利用者任せの接続は、不正アクセスの入口となる。"]},{"id":"cisa-131","type":"mc","chapterIndex":4,"stem":"特権ID（管理者権限）の管理に関して、監査人が確認すべき事項として最も適切なものはどれか。","options":["特権IDの利用は、承認と操作ログを確認する。","特権IDは、開発担当者が業務の都合に応じて自由に利用し、利用記録は障害が起きた時にだけ確認する運用とする。","特権IDは、全員に共通の一つのIDを割り当て、利用者ごとの記録を残さないことを原則とする。","特権IDは、利用期限を設けず、担当者が異動した後も付与したまま維持して、利用実績を年度末に確認する。"],"correctIndex":0,"explanations":["○ 正しい。特権IDの利用を承認し操作ログを確認することが、最小限の統制となる。","× 業務の都合での自由な利用と障害時だけの確認では、不正を防げない。","× 共通IDで記録を残さないと、利用者を特定できない。","× 異動後も付与を維持すると、不要な特権が残り続ける。"]},{"id":"cisa-132","type":"mc","chapterIndex":4,"stem":"情報の分類とラベル付けに関して、監査人の評価として最も適切なものはどれか。","options":["情報の分類は、担当者の判断に任せ、統一の基準は定めない。","情報の重要度に応じた分類基準を定め、ラベルの付与と取扱い区分を明確にして、定期的に分類の妥当性を見直している。","分類は、公開情報と機密情報の2区分だけで、ラベルは付与しない。","分類の結果は、システム上で一覧化し、担当部門だけが閲覧できる運用とする。"],"correctIndex":1,"explanations":["× 統一基準がないと、取扱いの判断が担当者ごとにばらつく。","○ 分類基準とラベル、取扱区分の明確化と定期的な見直しが必要である。","× 区分が粗くラベルがないと、重要度に応じた保護ができない。","× 閲覧範囲を担当部門に限るだけでは、分類と取扱いの基準は定まらない。"]},{"id":"cisa-133","type":"mc","chapterIndex":4,"stem":"セキュリティログの監視に関して、監査人が評価すべき事項として最も適切なものはどれか。","options":["ログは、障害が起きた時にだけ個別に確認し、通常時は取得しない。","ログは、全システムから取得し、通知の基準を設けず、担当者が必要と感じた時にだけ確認して、結果は記録しない運用とする。","重要なイベントを定めて自動で検知し、異常の通知と対応結果を記録して、定期的に監視状況を確認している。","ログの保管期間は、ディスク容量に合わせて担当者が都度決める。"],"correctIndex":2,"explanations":["× 通常時のログを取得しないと、異常の兆候を検知できない。","× 基準のない確認と記録のない運用では、監視が機能しない。","○ 重要イベントの自動検知と対応記録は、監視統制の基本である。","× 保管期間を容量任せにすると、必要な証跡を失うおそれがある。"]},{"id":"cisa-134","type":"mc","chapterIndex":3,"stem":"事業継続計画に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["事業継続計画は、重要業務の復旧目標を定め、年1回以上の訓練結果を踏まえて、経営層の承認を得て見直している。","復旧拠点は、本番拠点と地理的に離れた場所に確保し、切替の手順を文書化して、定期的に切替訓練を行っている。","事業継続計画の責任者を定め、関係部門への周知を年度ごとに行っている。","事業継続計画は作成しているが、重要業務の復旧目標を定めておらず、訓練を実施していない。"],"correctIndex":3,"explanations":["× 目標の設定と訓練結果の反映がされており、指摘の対象ではない。","× 拠点の分散と切替訓練が行われており、問題のない運用である。","× 責任者の任命と周知が行われており、指摘にはあたらない。","○ 復旧目標と訓練がないと、事業継続の実効性を検証できない。"]},{"id":"cisa-135","type":"mc","chapterIndex":4,"stem":"パスワード管理の方針に関して、監査人が最も適切と判断するものはどれか。","options":["初期パスワードは利用開始時に変更させる。","パスワードは、利用者が自由に設定し、定期的な変更は求めず、同じものを長く使うことを認める。","パスワードは、他の利用者と共有して使い回し、管理者が一覧で保管する運用とする。","パスワードは、規則を設けず、一定の文字数以上であれば認め、変更の記録も残さない。"],"correctIndex":0,"explanations":["○ 正しい。初期パスワードを放置しないことは、不正利用を防ぐ基本的な統制である。","× 自由設定と長期の使い回しは、推測や漏えいのリスクを高める。","× 共有と使い回しでは、利用者の特定と責任の所在が不明確になる。","× 規則と変更記録のない運用は、統制として機能しない。"]},{"id":"cisa-136","type":"mc","chapterIndex":4,"stem":"マルウェア対策に関する監査人の評価として最も適切なものはどれか。","options":["マルウェア対策ソフトは、導入後に更新せず、初期の設定のまま運用する。","マルウェア対策ソフトの定義ファイルを自動で更新し、導入状況と検知結果を定期的に確認して、未導入の端末を把握している。","マルウェア対策は、個人の端末では任意とし、業務用の端末にだけ導入する。","検知したマルウェアは、感染した端末を使い続けながら、対応を後日まとめて行う運用とする。"],"correctIndex":1,"explanations":["× 初期設定のまま更新しないと、新しい脅威に対応できない。","○ 正しい。定義の自動更新と導入状況の確認が、マルウェア対策の有効性を支える。","× 個人の端末を任意にすると、組織の情報が危険にさらされる。","× 感染した端末を使い続けると、被害が拡大するおそれがある。"]},{"id":"cisa-137","type":"mc","chapterIndex":4,"stem":"外部保守事業者による遠隔保守に関して、監査人が評価すべき事項として最も適切なものはどれか。","options":["外部保守事業者には、本番環境への常時接続を認め、作業内容の記録は事業者の内部管理に任せて、委託側は確認しない。","遠隔保守は、担当者の口頭の依頼で都度開始し、終了の連絡は省略する。","遠隔保守は、作業の都度承認を得て接続期間を限定し、作業内容を記録して委託側が確認している。","遠隔保守の接続は、保守事業者が必要と判断した時に、社内の承認を経ずに行う。"],"correctIndex":2,"explanations":["× 常時接続と事業者任せの記録は、委託側の統制を欠く。","× 口頭の依頼と終了連絡の省略では、接続の管理ができない。","○ 作業ごとの承認、期間の限定、記録と確認が、遠隔保守の統制となる。","× 社内の承認を経ない接続は、無断の利用を許すことになる。"]},{"id":"cisa-138","type":"mc","chapterIndex":4,"stem":"フィッシング対策に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["不審なメールの報告窓口を設け、受信者からの報告を集計して、訓練の結果を経営層に報告している。","送信元の認証（SPF、DKIM、DMARC）を設定し、なりすましメールの遮断状況を定期的に確認している。","全社員に対し、年1回以上の標的型メール訓練を実施している。","リンクや添付ファイルの扱いに関する社内の基準がなく、受信者の判断に任せている。"],"correctIndex":3,"explanations":["× 報告窓口と集計、経営層への報告は、適切な運用である。","× 送信元認証の設定と確認は、なりすましへの有効な対策である。","× 年次の訓練を行っており、指摘の状況ではない。","○ 基準がなく受信者任せでは、不審なリンクや添付ファイルを防げない。"]},{"id":"cisa-139","type":"mc","chapterIndex":4,"stem":"私物端末（BYOD）の業務利用に関する監査人の確認事項として、最も適切なものはどれか。","options":["私物端末の業務利用は、利用規程と承認を確認する。","私物端末は、利用者の判断で業務データを保存し、紛失時の遠隔消去は行わない運用とする。","私物端末の業務利用は、端末の種類を問わず、管理者の承認を省略して、利用規程の対象外とする。","私物端末は、業務アプリのデータを端末内に残し、暗号化や画面ロックの設定は利用者に任せる。"],"correctIndex":0,"explanations":["○ 正しい。利用規程と承認の確認が、私物端末の業務利用を統制する基本となる。","× 業務データの保存と遠隔消去不可は、情報漏えいの原因となる。","× 承認を省略して規程の対象外にすると、統制の対象が失われる。","× 暗号化や画面ロックを利用者任せにすると、紛失時の被害が大きくなる。"]},{"id":"cisa-140","type":"mc","chapterIndex":4,"stem":"通信データの暗号化に関して、監査人の評価として最も適切なものはどれか。","options":["社内の通信は暗号化が不要であり、外部との通信のみ暗号化する。","機密性の高いデータは、伝送時にTLSで保護し、暗号方式と証明書の設定を定期的に確認している。","暗号化の強度は、通信量が多い時期にだけ見直し、平常時は初期設定を用いる。","通信の暗号化は、利用者が必要と判断した時に、個別に設定する運用とする。"],"correctIndex":1,"explanations":["× 社内の通信も、機密性に応じて暗号化の要否を判断する必要がある。","○ 正しい。伝送時の暗号化と設定の定期確認が、通信の機密性を守る。","× 平常時の初期設定のままでは、脆弱な方式が残るおそれがある。","× 個別判断に任せると、暗号化されない通信が生じる。"]},{"id":"cisa-141","type":"mc","chapterIndex":4,"stem":"電子データの完全性（改ざんの検知）に関して、監査人の評価として最も適切なものはどれか。","options":["完全性は、ファイルの更新日時だけを確認すれば、十分に保たれていると判断する。","完全性は、ファイルのハッシュ値を比較せずに、担当者の目視で内容を照合し、差異があれば修正して記録しない運用とする。","重要なデータは、ハッシュ値や電子署名で改ざんを検知できるようにし、検証の結果を記録している。","完全性を守るため、データの保存先を一箇所に限定することを原則とする。"],"correctIndex":2,"explanations":["× 更新日時だけでは、内容の改ざんを検知できない。","× 目視照合と記録のない運用では、改ざんを確実に検知できない。","○ 正しい。ハッシュ値や電子署名による検証と記録が、完全性の確認となる。","× 保存先の一元化は、改ざん検知の手段にはならない。"]},{"id":"cisa-142","type":"mc","chapterIndex":4,"stem":"侵入テストの実施に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["侵入テストは、対象範囲と実施期間を事前に定めて書面で承認を得て、結果を経営層と共有し、再テストの結果も報告している。","侵入テストの結果は、検出された脆弱性の対応計画と照合し、再テストによって改善を確認して、その記録を監査に提示している。","侵入テストは、年1回の外部業者による実施を計画に含めている。","侵入テストの対象範囲を定めず、承認を書面で得ないまま、実施者の判断で本番環境の試験を行っている。"],"correctIndex":3,"explanations":["× 範囲と承認を事前に定めており、適切な実施である。","× 結果の対応と再テストの確認は、適切な管理である。","× 年次の外部実施を計画しており、問題のない運用である。","○ 対象範囲と承認のない本番試験は、業務停止や情報漏えいを招くおそれがある。"]},{"id":"cisa-143","type":"mc","chapterIndex":4,"stem":"記憶媒体の廃棄に関して、監査人が最も適切と判断するものはどれか。","options":["廃棄するデータは、消去の記録を残して承認を得る。","廃棄する記憶媒体は、ゴミ箱に入れて回収業者に渡し、データの消去は確認しない運用とする。","廃棄する記憶媒体は、データを削除キーで消去したものとみなし、物理的な破壊は行わない。","廃棄するデータは、再利用の可能性を考慮せず、担当者が個別の判断で処分方法を決める運用とする。"],"correctIndex":0,"explanations":["○ 正しい。消去の記録と承認が、廃棄時のデータ漏えいを防ぐ。","× データの消去を確認しない運用は、情報の残留を見逃す。","× 消去の確認なしに物理破壊を省くと、復元のリスクが残る。","× 担当者任せの処分では、統制の基準と記録が残らない。"]},{"id":"cisa-144","type":"mc","chapterIndex":4,"stem":"設備の環境管理に関する監査人の評価として、最も適切なものはどれか。","options":["無停電電源装置は、導入後の保守を行わず、故障した時に交換する。","無停電電源装置と消火設備は、定期的に点検し、点検結果と不具合の是正状況を記録して、管理者が確認している。","消火設備は、火災の発生頻度が低いため、点検の対象から外す運用とする。","空調と電源の設備は、稼働状況を見て、必要と判断した時にだけ確認する運用とする。"],"correctIndex":1,"explanations":["× 保守を行わないと、停電時に機能しないおそれがある。","○ 正しい。定期点検と是正の記録・確認が、設備の可用性を確保する。","× 頻度が低くても、点検対象から外すと故障を見逃す。","× 必要時だけの確認では、設備の劣化を早期に検出できない。"]},{"id":"cisa-145","type":"mc","chapterIndex":4,"stem":"利用者のアクセス権の定期的な見直し（レビュー）に関して、監査人の評価として最も適切なものはどれか。","options":["アクセス権の見直しは、人事異動があった時にだけ行い、定期的な見直しは行わない。","アクセス権の見直しは、各部門の管理者が自部門の利用者を確認し、結果を承認せずに、情報システム部門だけで権限を変更する運用とする。","アクセス権は定期的に見直し、業務上の必要性を管理者が確認して、不要な権限を速やかに削除している。","アクセス権の見直しは、利用者本人の申告だけで行い、管理者の確認は求めない。"],"correctIndex":2,"explanations":["× 定期的な見直しを行わないと、異動後も不要な権限が残る。","× 管理者の承認なしに権限を変更すると、統制が機能しない。","○ 定期的な見直しと管理者による必要性の確認が、権限の過大付与を防ぐ。","× 本人の申告だけで管理者の確認がないと、権限の妥当性を検証できない。"]},{"id":"cisa-146","type":"mc","chapterIndex":4,"stem":"セキュリティインシデントの分類と報告に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["インシデントは影響度と緊急度で分類し、定められた基準に従って経営層へ報告する手順を文書化している。","重大なインシデントは、発生から定められた期限内に報告し、報告後の対応状況を記録して、関係部門と共有している。","インシデントの記録は、対応の経過に応じて随時作成している。","重大なインシデントを、担当者の判断で分類し、経営層への報告は必要が生じた場合にだけ行う。"],"correctIndex":3,"explanations":["× 基準に従った分類と経営層への報告は、適切な手順である。","× 期限内の報告と共有の記録は、適切な運用である。","× 経過に応じた随時の記録は、適切な運用である。","○ 正しい。担当者任せの分類と報告の必要時だけは、重大事態を経営層が把握できないおそれがある。"]},{"id":"cisa-147","type":"mc","chapterIndex":4,"stem":"脆弱性スキャンの結果の扱いに関して、監査人が最も適切と判断するものはどれか。","options":["スキャン結果は、誤検知を確認して対応を記録する。","スキャン結果は、誤検知と判断したものを、確認せずに一覧から除外して、対応の記録は残さない。","スキャン結果は、対応の優先度を定めず、検出された件数の多い順に機械的に対応を進める。","スキャン結果は、資産の重要度を考慮せず、担当者ごとに対応するものを選んで処理する運用とする。"],"correctIndex":0,"explanations":["○ 正しい。誤検知の確認と対応の記録が、結果の信頼性と対応の実効性を保つ。","× 確認なしの除外と記録のない運用は、実際の脆弱性を見逃すおそれがある。","× 件数だけで機械的に対応すると、重要度の高い問題が後回しになる。","× 資産の重要度を考慮しないと、対応の優先順位が適切に決まらない。"]},{"id":"cisa-148","type":"mc","chapterIndex":4,"stem":"アプリケーションの実行制御に関して、監査人の評価として最も適切なものはどれか。","options":["実行可能なアプリケーションは、利用者が個別に判断して追加してよい。","業務で許可するアプリケーションを申請と承認により定め、許可リストを定期的に見直して、未承認の実行を検知している。","アプリケーションの実行制御は、開発環境にだけ適用し、本番環境では行わない。","アプリケーションは、制限を設けず自由に実行させ、不審な動作が確認された時に対応する。"],"correctIndex":1,"explanations":["× 利用者任せの追加では、不正なソフトウェアを防げない。","○ 正しい。承認に基づく許可リストと定期的な見直しが、実行制御の基本となる。","× 本番環境で実行制御をしないと、実際の被害を防げない。","× 制限なしの実行では、不審な動作を事前に防げない。"]},{"id":"cisa-149","type":"mc","chapterIndex":4,"stem":"特権セッションの監視に関して、監査人の評価として最も適切なものはどれか。","options":["特権セッションは、業務時間外には記録せず、業務時間内の作業だけを監視する。","特権セッションは、操作の記録を保存しても確認は行わず、障害が発生した時に限り、担当者の申告に基づいて内容を確認する運用とする。","特権セッションの操作は記録し、承認された作業との整合を定期的に確認して、異常があれば速やかに報告する。","特権セッションの記録は、保存期間を定めず、必要になった時に作成する。"],"correctIndex":2,"explanations":["× 時間外の記録を省くと、不正な操作を検知できない。","× 確認を行わず申告に基づくだけでは、監視が機能しない。","○ 操作の記録と承認との照合、異常時の報告が、特権の監視を成立させる。","× 保存期間がなく必要時に作成する記録では、証跡が不十分となる。"]},{"id":"cisa-150","type":"mc","chapterIndex":4,"stem":"情報セキュリティの教育と啓発に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["全社員を対象に、役割に応じた研修を定期的に実施し、受講状況と理解度の確認結果を管理部門が記録している。","新規採用者と委託先の要員に対し、入社時と契約開始時に、情報セキュリティの研修を実施し、理解の確認も行っている。","研修の受講を全社員に求め、未受講者には案内している。","研修は一度実施したきりで、受講状況を確認せず、内容も現在の脅威に合わせて見直していない。"],"correctIndex":3,"explanations":["× 役割別の定期研修と理解度の確認は、適切な運用である。","× 入社時と委託開始時の研修は、適切に行われている。","× 全社員への受講要請と未受講者への案内は、適切な運用である。","○ 正しい。受講確認と内容の見直しがないと、教育の効果を検証できない。"]},{"id":"cisa-151","type":"mc","chapterIndex":0,"stem":"監査人の独立性に関して、監査人が最も適切と判断する対応はどれか。","options":["監査対象の業務に関与した者は、その監査から外れる。","監査人は、監査対象部門と親しい関係にあることを理由に、監査計画の策定に関与させる。","監査人は、過去に担当した業務の監査を、利害関係を確認しないまま毎年繰り返し引き受けてよい。","監査人は、上司の指示があれば、監査調書の結論を依頼者の意向に合わせて修正する。"],"correctIndex":0,"explanations":["○ 正しい。業務に関与した者が監査すると、客観性が損なわれるため、監査から外す必要がある。","× 親しい関係は独立性を損なうため、計画への関与を避けるべきである。","× 利害関係の確認なしに担当を繰り返すと、独立性の検証ができない。","× 結論を依頼者の意向に合わせて修正することは、監査の客観性を損なう。"]},{"id":"cisa-152","type":"mc","chapterIndex":0,"stem":"監査で入手した情報の取扱いに関して、監査人が最も適切と判断するものはどれか。","options":["監査で入手した情報は、個人的な参考資料として、退職後も保持してよい。","監査で入手した情報は、監査の目的以外には使用せず、必要な範囲で管理し、業務上の必要がなくなった時点で適切に廃棄する。","監査で入手した情報は、監査チーム内であれば、誰に共有してもよいとする。","監査で入手した情報は、依頼者の了解を得れば、監査以外の目的に使用してよい。"],"correctIndex":1,"explanations":["× 退職後の個人保持は、守秘義務に反する。","○ 正しい。目的外使用の禁止と適切な管理・廃棄が、守秘義務の基本となる。","× チーム内でも必要な範囲に限る必要があり、無制限の共有は適切でない。","× 依頼者の了解があっても、監査目的外の使用は守秘の観点から避けるべきである。"]},{"id":"cisa-153","type":"mc","chapterIndex":0,"stem":"内部監査規程（監査憲章）に関して、監査人の評価として最も適切なものはどれか。","options":["監査規程は、監査部門が必要と判断した時に、個別に定めればよい。","監査規程は、監査の目的と権限、報告先を明文化する必要はなく、監査対象部門の了承を得た範囲で柔軟に運用する。","監査規程は、監査の目的、権限、独立性の確保と報告の経路を明文化し、取締役会等の承認を得ている。","監査規程は、監査の対象範囲を年度ごとに監査部門が自由に決める運用とする。"],"correctIndex":2,"explanations":["× 監査規程は、継続的な監査の基盤として定めておく必要がある。","× 目的と権限の明文化を省くと、監査の独立性と権限が担保されない。","○ 正しい。目的・権限・独立性・報告経路の明文化と承認が、監査機能の基盤となる。","× 対象範囲を監査部門だけで自由に決めると、統制と説明責任が欠ける。"]},{"id":"cisa-154","type":"mc","chapterIndex":0,"stem":"リスクベース監査の計画に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["監査計画は、リスク評価の結果を基に監査対象の優先順位を定め、重要な領域の監査頻度を高くし、その理由を記録している。","監査計画の見直しは、重要なリスクの変化や監査結果を反映して、年度途中にも行い、取締役会に報告する運用である。","監査計画は、取締役会と経営層に共有して承認を得ている。","監査計画は、リスク評価を行わず、過去に監査した部門を除外して、残りの部門を順番に監査している。"],"correctIndex":3,"explanations":["× リスクに基づく優先順位付けと頻度設定は、適切な計画である。","× リスクの変化を反映した年度途中の見直しは、適切な運用である。","× 取締役会と経営層への共有と承認は、適切な手続である。","○ 正しい。リスク評価を行わない機械的な順番では、重要なリスクに監査資源を向けられない。"]},{"id":"cisa-155","type":"mc","chapterIndex":0,"stem":"監査人の専門性と職業的懐疑心に関して、監査人が最も適切と判断するものはどれか。","options":["監査人は、必要な専門性の不足を認識し、専門家の助言を得る。","監査人は、過去の経験に頼り、新しい技術の知識は、監査の対象となった時にのみ学習すればよい。","監査人は、依頼者の説明をそのまま受け入れ、追加の確認は、疑義が明確になった時にだけ行う。","監査人は、専門性が不足していても、経験の長い担当者の判断に全面的に従ってよい。"],"correctIndex":0,"explanations":["○ 正しい。専門性の不足を認識して専門家の助言を得ることが、適切な監査の前提となる。","× 新技術の学習を監査の対象時だけに限ると、必要な専門性を欠く。","× 説明を無批判に受け入れると、職業的懐疑心が保てない。","× 専門性の不足を担当者任せにすると、監査の品質を保証できない。"]},{"id":"cisa-156","type":"mc","chapterIndex":0,"stem":"監査証拠の十分性と適切性に関して、監査人の判断として最も適切なものはどれか。","options":["監査証拠は、一件の確認で十分と判断し、追加の入手は行わない。","監査証拠は、リスクの大きさに応じた量を確保し、独立した情報源から入手したものを優先して、結論の根拠とする。","監査証拠は、監査対象部門が作成した資料だけで足りると判断する。","監査証拠は、量を重視し、同じ内容の資料を多く集めることで、信頼性を確保する。"],"correctIndex":1,"explanations":["× 一件の確認では、結論を支えるのに量が不足する。","○ 正しい。リスクに応じた量と独立した情報源が、十分性と適切性を確保する。","× 被監査部門の資料だけでは、独立性と信頼性が不足する。","× 同じ内容の資料を集めても、信頼性は高まらない。"]},{"id":"cisa-157","type":"mc","chapterIndex":0,"stem":"監査証拠の信頼性に関して、監査人の評価として最も適切なものはどれか。","options":["監査証拠は、口頭の説明だけで足り、記録による裏付けは求めない。","監査証拠は、監査対象部門の作成した資料を、監査人の検証なしに、そのまま結論の根拠として採用する運用とし、資料の作成経緯は確認しない。","監査証拠は、独立した外部の情報源や直接の観察による情報の方が、信頼性が高いと判断する。","監査証拠は、作成された日付が新しいものほど、常に信頼性が高いと判断する。"],"correctIndex":2,"explanations":["× 口頭の説明だけでは、裏付けとして信頼性が低い。","× 検証と作成経緯の確認を省くと、資料の信頼性を判断できない。","○ 正しい。独立した情報源と直接の観察は、一般に信頼性の高い証拠となる。","× 日付の新しさだけで信頼性は決まらない。"]},{"id":"cisa-158","type":"mc","chapterIndex":0,"stem":"属性サンプリングを用いた統制テストに関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["サンプルは、母集団の特性に基づいて抽出し、抽出方法と理由を監査調書に記録して、結論の根拠とし、再現できる状態にしている。","統制の逸脱が見つかった場合は、逸脱の原因を分析し、影響範囲を拡大して確認する手続を計画に含め、結果を経営層に報告している。","逸脱の件数は、調書に記録して、結論の根拠として残している。","統制テストでは、逸脱が見つかっても、件数が少ないことを理由に影響範囲の確認を省いて、有効と結論付けている。"],"correctIndex":3,"explanations":["× 母集団に基づく抽出と記録は、適切な手続である。","× 逸脱の原因分析と影響範囲の確認は、適切な手続である。","× 逸脱件数の記録と根拠としての保持は、適切な手続である。","○ 正しい。逸脱の影響範囲を確認せず有効と結論することは、結論の根拠を欠く。"]},{"id":"cisa-159","type":"mc","chapterIndex":0,"stem":"監査サンプルの大きさの決定に関して、監査人が最も適切と判断するものはどれか。","options":["サンプルの大きさは、リスクと許容逸脱率に応じて決める。","サンプルの大きさは、前年の件数をそのまま用い、今年の統制の変化は考慮しない。","サンプルの大きさは、作業時間の制約だけを基準にして、リスクの水準とは関係なく決める。","サンプルの大きさは、母集団の件数に関係なく、一律に五十件とすることを原則とする。"],"correctIndex":0,"explanations":["○ 正しい。リスクと許容逸脱率に応じたサンプル数が、統制テストの十分性を支える。","× 前年の件数をそのまま用いると、変化を反映できない。","× 作業時間だけを基準にすると、リスクに見合った検証ができない。","× 母集団の件数に関係なく一律に決めると、リスクに応じた検証にならない。"]},{"id":"cisa-160","type":"mc","chapterIndex":0,"stem":"監査でのデータ分析の活用に関して、監査人の判断として最も適切なものはどれか。","options":["データ分析は、母集団の一部だけを対象とすれば、結果の信頼性は保たれる。","データ分析は、可能な範囲で母集団の全件を対象とし、データの完全性と正確性を確認したうえで、異常な取引の傾向を抽出する。","データ分析の結果は、分析者の解釈をそのまま報告に記載し、元データの確認は省略する。","データ分析は、分析ツールの出力を、前提条件を確かめずに結論の根拠として採用する運用とする。"],"correctIndex":1,"explanations":["× 一部だけの分析では、母集団全体の傾向や異常を把握できない。","○ 正しい。全件対象とデータの完全性・正確性の確認が、分析結果の信頼性を支える。","× 元データの確認を省くと、解釈の誤りを検出できない。","× 前提条件を確かめずに結論に用いると、誤った判断を導くおそれがある。"]},{"id":"cisa-161","type":"mc","chapterIndex":0,"stem":"コンピュータ利用監査技法（CAAT）の利用に関して、監査人の評価として最も適切なものはどれか。","options":["CAATは、データの量が少ない場合にのみ使い、結果の検証は省略してよい。","CAATは、監査対象システムの本番データを直接書き換えて、検証用のデータを作成し、元の状態に戻す手順は記録しない運用とする。","CAATは、監査対象データの独立した抽出と、プログラムの処理内容の確認を行い、結果の妥当性を検証する。","CAATは、監査人の端末で作成したデータを、そのまま監査調書に添付して用いる。"],"correctIndex":2,"explanations":["× 少量データでも結果の検証は必要である。","× 本番データを書き換えると、システムへの影響と証跡の欠落を招く。","○ 正しい。独立した抽出と処理内容の確認、結果の検証が、CAATの信頼性を確保する。","× 抽出元と処理の妥当性を確認せずに用いると、結論の根拠とならない。"]},{"id":"cisa-162","type":"mc","chapterIndex":0,"stem":"監査における面談（インタビュー）の証拠に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["面談の結果は、担当者の説明を記録し、関連する文書や記録と照合して、説明の裏付けを確認している。","面談の内容は、重要な事項について、複数の関係者から説明を得て、相互の整合性を確認し、結果を記録している。","面談の記録は、監査人が面談後に速やかに作成し、確認者の署名を得ている。","担当者の口頭説明だけを根拠に結論を導き、関連する文書や記録による裏付けを取っていない。"],"correctIndex":3,"explanations":["× 説明を記録し文書で照合することは、適切な手続である。","× 複数の関係者による整合性の確認は、適切な手続である。","× 速やかな記録と署名は、適切な手続である。","○ 正しい。口頭説明だけでは証拠として弱く、裏付けが必要である。"]},{"id":"cisa-163","type":"mc","chapterIndex":0,"stem":"業務プロセスのウォークスルーに関して、監査人が最も適切と判断するものはどれか。","options":["ウォークスルーで、取引の開始から記録までを一件追跡する。","ウォークスルーは、担当者への事前の質問票の回答だけで、実際の取引の追跡を省略して完了とする。","ウォークスルーは、業務の代表的な取引を複数選び、文書を確認せず担当者の説明だけで判断する。","ウォークスルーは、業務の全体像を把握するため、対象外の業務も含めて、網羅的に実施する。"],"correctIndex":0,"explanations":["○ 正しい。一件の取引を追跡することで、統制の設計と実施状況を確認できる。","× 質問票の回答だけでは、実際の運用を確認できない。","× 文書を確認せずに説明だけで判断すると、証拠が不足する。","× 対象外の業務まで網羅すると、監査の範囲と資源の配分が適切でない。"]},{"id":"cisa-164","type":"mc","chapterIndex":0,"stem":"統制の評価における「整備状況」と「運用状況」の違いに関して、監査人の判断として最も適切なものはどれか。","options":["統制の整備状況は、統制が実施された記録があれば確認したことになる。","整備状況は統制が設計どおり存在するかを確認し、運用状況は統制が一定期間にわたり継続して有効に機能しているかを確認する。","整備状況と運用状況は、同じ手続で確認できるため、区別して評価する必要はない。","運用状況は、統制の設計が存在するかどうかを確認し、整備状況は、一定期間の継続的な実施を確認する。"],"correctIndex":1,"explanations":["× 記録があっても、設計どおりの整備と継続的な有効性は別に確認が必要である。","○ 正しい。整備は設計の存在、運用は期間を通じた有効な機能を確認する。","× 両者は確認の対象と手続が異なるため、区別して評価する必要がある。","× 整備状況と運用状況の説明が逆になっている。"]},{"id":"cisa-165","type":"mc","chapterIndex":0,"stem":"補完統制（代替統制）の評価に関して、監査人の判断として最も適切なものはどれか。","options":["補完統制は、正式な文書がなくても、担当者が行っていれば有効と判断する。","補完統制は、対象となる統制の欠陥をそのままにして、担当者の経験に基づく確認を行い、その結果を記録せず、次年度以降も同じ方法を繰り返すものとする。","補完統制は、欠陥を補うだけの精度と頻度があるかを確認し、その有効性を実際のテストで検証する。","補完統制は、既存の統制を置き換えるものとして、評価の対象から外す。"],"correctIndex":2,"explanations":["× 文書がなく担当者任せの統制は、有効性を確認できない。","× 欠陥を放置し記録しない運用は、補完統制の要件を満たさない。","○ 正しい。精度・頻度と実際のテストによる検証が、補完統制の有効性を支える。","× 補完統制を評価対象から除外すると、残存リスクを把握できない。"]},{"id":"cisa-166","type":"mc","chapterIndex":0,"stem":"監査で指摘した不備の原因分析に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["不備の原因は、個人の過失と手続の不備の両面から分析し、再発防止策の有効性を確認する手続を計画している。","原因分析の結果は、対象部門と協議して確定させ、改善計画の実施状況をフォローアップの対象として記録している。","不備の内容は、関係者に説明して、改善の必要性を確認している。","不備の原因を、担当者の不注意とだけ結論付け、業務の仕組みや統制の設計の問題を検討していない。"],"correctIndex":3,"explanations":["× 原因を多面的に分析し再発防止を確認する手続は、適切である。","× 原因の協議確定と改善計画の追跡は、適切な運用である。","× 不備の説明と改善の確認は、適切な対応である。","○ 正しい。担当者の不注意だけに原因を限定すると、再発を防ぐ改善につながらない。"]},{"id":"cisa-167","type":"mc","chapterIndex":0,"stem":"監査報告書の草案の扱いに関して、監査人が最も適切と判断するものはどれか。","options":["監査報告書の草案は、被監査部門と事実誤認の有無を確認する。","監査報告書の草案は、被監査部門の要望に応じて、指摘事項を削除または弱めて、合意を得てから提出する。","監査報告書の草案は、監査人の判断で確定させ、被監査部門には内容を示さずに提出する。","監査報告書の草案は、被監査部門との協議を省略し、経営層だけに提示する運用とする。"],"correctIndex":0,"explanations":["○ 正しい。事実誤認の確認は、報告の正確性を確保する手続である。","× 指摘を弱めることは、監査の独立性と報告の正確性を損なう。","× 被監査部門に内容を示さないと、事実誤認を確認できない。","× 協議を省略すると、事実関係の確認と合意の機会がなくなる。"]},{"id":"cisa-168","type":"mc","chapterIndex":0,"stem":"監査意見の表明に関して、監査人が最も適切と判断するものはどれか。","options":["監査意見は、指摘事項が少なければ、統制が有効であると表明する。","監査意見は、監査で得た証拠に基づき、統制の有効性に関する結論を、範囲の制限や限界を明示して表明する。","監査意見は、経営層の意向を反映して、指摘事項の記載を調整してから表明する。","監査意見は、証拠が不足していても、監査人の経験に基づいて有効と表明してよい。"],"correctIndex":1,"explanations":["× 指摘事項の件数だけで有効性は判断できない。","○ 正しい。証拠に基づく結論と、範囲の制限や限界の明示が、適切な意見表明となる。","× 経営層の意向に応じた調整は、監査の独立性を損なう。","× 証拠が不足する状況で有効と表明すると、意見の根拠を欠く。"]},{"id":"cisa-169","type":"mc","chapterIndex":0,"stem":"是正措置のフォローアップに関して、監査人の評価として最も適切なものはどれか。","options":["是正措置は、報告の提出をもって完了したとみなし、その後の実施状況は確認しない。","是正措置の確認は、改善計画の期限を過ぎても、担当部門の自己申告だけに基づいて完了とし、監査人による実施の検証は、次回の監査まで行わない運用とする。","是正措置は、計画どおりに実施されたかを確認し、再発防止の効果を検証して、完了を判断する。","是正措置は、指摘の内容に関係なく、期限までの提出を確認すれば足りる。"],"correctIndex":2,"explanations":["× 報告の提出だけでは、是正が実施されたかを確認できない。","× 自己申告だけで期限後も検証しないと、是正の実効性を確認できない。","○ 正しい。実施の確認と再発防止の効果の検証が、是正措置の完了判断となる。","× 提出の確認だけでは、是正の内容と効果を確認したことにならない。"]},{"id":"cisa-170","type":"mc","chapterIndex":0,"stem":"監査業務の監督とレビューに関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["監査調書は、責任者が重要な判断と結論を確認し、査閲の記録を残して、品質管理の基準に従い、必要な修正を行っている。","監査チームの配置は、担当者の経験と専門性を考慮し、監査の途中で必要な支援を追加できる体制としている。","監査の進捗は、週次で責任者に報告し、計画との差異を確認している。","監査調書の結論は、担当者の判断のみで確定し、責任者による査閲を経ずに報告書へ反映している。"],"correctIndex":3,"explanations":["× 責任者の査閲と記録は、品質管理の基準に沿う適切な運用である。","× 経験と専門性を考慮した配置と支援の体制は、適切である。","× 週次の進捗報告と差異の確認は、適切な監督の手続である。","○ 正しい。責任者の査閲を経ない結論は、監査品質を保証できない。"]},{"id":"cisa-171","type":"mc","chapterIndex":0,"stem":"監査調書の保存に関して、監査人が最も適切と判断するものはどれか。","options":["監査調書は、結論の根拠を示す記録として保存する。","監査調書は、報告書を提出した後に、必要性がなくなったものから個人の判断で廃棄してよい。","監査調書は、電子データに限り保存し、紙の原本は作業完了時に廃棄する。","監査調書は、保存期間を定めず、監査人の異動時に担当者が個人の端末へ移して管理する。"],"correctIndex":0,"explanations":["○ 正しい。結論の根拠を示す記録として保存することが、監査調書の基本的な役割である。","× 個人判断の廃棄は、保存方針を欠き、監査の証跡を失う。","× 紙の原本を一律に廃棄すると、証跡の完全性を失うおそれがある。","× 個人の端末での管理は、情報の漏えいと散逸のリスクを高める。"]},{"id":"cisa-172","type":"mc","chapterIndex":0,"stem":"不正の兆候（レッドフラッグ）に関して、監査人の判断として最も適切なものはどれか。","options":["不正の兆候は、担当者の勤務態度だけで判断し、取引の記録は確認しない。","不正の兆候は、取引の時期や金額の偏り、承認の欠落などを分析し、職務の状況と照合して、詳細な確認の対象を決める。","不正の兆候は、業績が好調な部門に限って発生するため、その部門だけを重点的に監査する。","不正の兆候は、内部統制の不備とは関係がないため、財務情報の数値だけで判断する。"],"correctIndex":1,"explanations":["× 勤務態度だけでは不正を判断できず、取引の記録の確認が必要である。","○ 正しい。取引の偏りや承認の欠落などを分析し、詳細な確認対象を決めることが適切である。","× 業績が好調な部門に限るという前提は、不正の兆候として根拠がない。","× 統制の不備は不正の兆候となるため、数値だけで判断することは適切でない。"]},{"id":"cisa-173","type":"mc","chapterIndex":0,"stem":"継続的監査に関して、監査人の評価として最も適切なものはどれか。","options":["継続的監査は、監査の完了後に一度だけ実施すれば足り、その後の監視は不要である。","継続的監査は、システムの全取引を対象に、異常の基準を設けず、担当者が必要と判断した時だけ結果を確認し、その結果は監査人の記録に残さない運用とする。","継続的監査は、重要な統制と取引を対象に自動で監視し、異常の検知と対応の状況を定期的に確認する。","継続的監査は、監査人の手作業による確認を、そのまま自動化したものとして扱う。"],"correctIndex":2,"explanations":["× 一度の実施では、継続的な統制の有効性を監視できない。","× 異常の基準と記録のない運用は、継続的監査の目的に合わない。","○ 正しい。重要な統制の自動監視と異常への対応の確認が、継続的監査の本質である。","× 手作業の確認をそのまま自動化したものではなく、基準の設計と検証が必要である。"]},{"id":"cisa-174","type":"mc","chapterIndex":0,"stem":"外部委託先の保証報告書（SOC報告書など）の利用に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["保証報告書は、報告の対象期間と統制範囲を確認し、自社の利用範囲に含まれる統制を特定して、評価に利用している。","保証報告書で示された補完的な統制については、自社の側で実施すべき統制を確認し、その実施状況を記録している。","保証報告書は、受領した時点で内容を確認し、関係部門に共有している。","保証報告書は、対象期間が自社の監査期間と異なるのに、そのまま全期間の証拠として用いている。"],"correctIndex":3,"explanations":["× 対象期間と統制範囲の確認は、報告書を適切に利用する手続である。","× 補完的統制の確認と実施記録は、適切な利用の手続である。","× 受領時の確認と部門への共有は、適切な運用である。","○ 正しい。対象期間が一致しない報告書を全期間の証拠とすると、証拠の適切性を欠く。"]},{"id":"cisa-175","type":"mc","chapterIndex":0,"stem":"監査対象の選定と監査資源の配分に関して、監査人が最も適切と判断するものはどれか。","options":["監査対象は、リスク評価に基づいて選定し、資源を優先度に応じて配分する。","監査対象は、担当者の希望を優先し、リスクの大きさに関係なく、すべての部門を均等な時間で監査する。","監査対象は、前年度に監査した部門を除き、残りの部門から毎年同じ数だけ選んで監査する。","監査対象は、経営層の指示に従って選び、監査の資源は配分の検討をせずに確保する。"],"correctIndex":0,"explanations":["○ 正しい。リスクに基づく選定と優先度に応じた資源配分が、効果的な監査計画となる。","× リスクと関係なく均等配分すると、重要な領域の監査が手薄になる。","× 前年度の監査部門を除く機械的な選定は、リスクを反映しない。","× 経営層の指示だけに頼り、資源配分を検討しないことは適切でない。"]},{"id":"cisa-176","type":"mc","chapterIndex":0,"stem":"監査の目的と範囲の設定に関して、監査人の判断として最も適切なものはどれか。","options":["監査の範囲は、監査人が着手した後に、作業の進み具合に応じて広げる。","監査の目的と範囲は、依頼者の要請とリスク評価に基づいて事前に定め、監査計画書に明記して関係者と合意する。","監査の範囲は、担当者の作業量に合わせて決め、目的は計画書に記載しない。","監査の目的は、監査の途中で必要と判断した事項を追加し、範囲は作業の終了後に決める。"],"correctIndex":1,"explanations":["× 範囲を後から広げると、計画と資源の配分が適切に管理できない。","○ 正しい。事前の目的と範囲の設定と関係者との合意が、監査の方向性を定める。","× 作業量に合わせて範囲を決めると、リスクに基づく監査にならない。","× 範囲を作業終了後に決めると、監査の計画としての意味を欠く。"]},{"id":"cisa-177","type":"mc","chapterIndex":0,"stem":"経営者確認書（マネジメント・レプレゼンテーション）に関して、監査人の評価として最も適切なものはどれか。","options":["経営者確認書は、監査の終了時に取得する必要はなく、監査の途中の口頭の確認で足りる。","経営者確認書は、経営者が重要な事項について確認した内容を文書で示すものであるが、監査人は、その内容が事実と異なっていても、経営者の責任を理由に、独自の検証を省略してよい。","経営者確認書は、経営者が監査で示した情報の完全性について責任を負うことを、文書で確認するものである。","経営者確認書は、監査人が作成した文書に、経営者が署名するだけで完成する。"],"correctIndex":2,"explanations":["× 経営者確認書は、監査の終了時に文書で取得するのが一般的である。","× 経営者の責任を理由に独自の検証を省くことは、監査人の責任に反する。","○ 正しい。経営者確認書は、情報の完全性に対する経営者の責任を文書で確認する。","× 経営者が自ら内容を作成し、確認する文書であり、監査人が作成するものではない。"]},{"id":"cisa-178","type":"mc","chapterIndex":0,"stem":"監査結論の記録（文書化）に関して、監査人が指摘すべき状況として最も適切なものはどれか。","options":["監査結論は、根拠となる証拠と分析の過程を調書に記録し、第三者が結論の妥当性を追跡できる状態にしている。","監査調書には、実施した手続、入手した証拠、判断の理由を記録し、責任者による査閲の記録を残している。","監査結論の記録は、結論の根拠と合わせて、調書の索引を整えている。","監査結論は、判断の理由と根拠を記録せず、結論の内容だけを報告書に記載して調書を残していない。"],"correctIndex":3,"explanations":["× 根拠と分析過程の記録により第三者が追跡できる状態は、適切である。","× 手続・証拠・判断理由と査閲の記録は、適切な文書化である。","× 結論の根拠と索引の整備は、適切な文書化である。","○ 正しい。判断の理由と根拠を記録しない結論は、第三者が検証できない。"]},{"id":"cisa-179","type":"mc","chapterIndex":0,"stem":"監査における専門家の利用に関して、監査人が最も適切と判断するものはどれか。","options":["専門家の作業は、能力と独立性を確認し、結果を監査人が評価する。","専門家の作業は、監査人が内容を評価せず、報告書に専門家の結論をそのまま記載して、責任も専門家に負わせる。","専門家の能力と独立性は、契約書に記載があれば確認を省略して、作業を全面的に委ねてよい。","専門家の作業は、監査人の知識が不足する領域について、作業範囲を定めずに包括的に依頼する。"],"correctIndex":0,"explanations":["○ 正しい。専門家の能力と独立性を確認し、その結果を監査人が評価することが必要である。","× 専門家の結論をそのまま記載し、評価を省くと、監査人の責任を果たせない。","× 契約書の記載だけで能力と独立性を省くことは、確認の手続として不十分である。","× 作業範囲を定めない包括的な依頼では、監査の結論を支える証拠が特定できない。"]},{"id":"cisa-180","type":"mc","chapterIndex":0,"stem":"監査の終結時の対応に関して、監査人が最も適切と判断するものはどれか。","options":["監査の終結会議は、指摘事項の確認を省略して、報告書の提出のみを行う。","監査の終結会議では、指摘事項の事実関係と改善の見込みを被監査部門と確認し、意見の相違がある場合はその内容を報告書に記載する。","監査の終結会議は、経営層だけが出席し、被監査部門には結果を後日に通知する。","監査の終結会議は、指摘事項の数を減らすため、被監査部門の意見を反映した後に行う。"],"correctIndex":1,"explanations":["× 指摘事項の確認を省くと、事実誤認を見逃すおそれがある。","○ 正しい。事実関係と改善の見込みの確認と、意見の相違の記載が、適切な終結手続である。","× 被監査部門を除いて後日通知すると、事実確認と合意の機会を失う。","× 指摘事項を減らす目的で意見を反映すると、監査の独立性を損なう。"]}];
  const CHAPTERS = ["分野1 情報システム監査プロセス（18%）","分野2 ITガバナンスとマネジメント（18%）","分野3 情報システムの取得・開発・導入（12%）","分野4 情報システムの運用・保守とビジネスレジリエンス（26%）","分野5 情報資産の保護（26%）"];

// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。

let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}
