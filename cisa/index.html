<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CISA問題集（仮問題）</title>
<meta name="robots" content="noindex,nofollow">
<script>
(function () {
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === "withSuccessHandler") return function (f) { return make(f, fail); };
      if (name === "withFailureHandler") return function (f) { return make(ok, f); };
      return function () {
        var reading = /^(apiLoad|apiGet)/.test(String(name));
        setTimeout(function () {
          if (reading) { if (ok) ok(null); }
          else if (fail) fail(new Error("公開版では記録・AI助言は使えません"));
        }, 0);
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
  <style>
    :root {
      --theme-color: #3d3b6e;
      --theme-color-dark: #24223f;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon { font-size: 32px; }

.header-text { min-width: 0; flex: 1 1 140px; }   /* ボタンに押されてタイトルが1文字幅に潰れ、縦書きのように見えるのを防ぐ */
.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; writing-mode: horizontal-tb; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.quiz-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

.screen { width: 100%; max-width: 520px; margin: 0 auto; }

/* --- モード選択画面 --- */
/* カード数が増えても幅が細くなりすぎないよう、flexではなくgridで自動折り返しする
   （4つ目の「追加問題2」追加時にスマホで窮屈にならないための変更）。 */
.mode-select {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.mode-card {
  min-width: 0;
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.mode-card:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

/* 復習モードのカードだけ、出題元の問題集カードと見分けられるよう薄く色を敷く。 */
.review-card {
  background: #fffaf2;
  border-color: #f0d9b5;
}
.review-card:hover { border-color: #e0a75e; }
.mode-card:disabled { opacity: 0.6; cursor: wait; }

.mode-icon { font-size: 36px; margin-bottom: 8px; }
.mode-title { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 4px; }
.mode-desc { font-size: 13px; color: #888; }

/* --- 範囲選択画面（全部 / 章ごとにチャレンジ） --- */
.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 4px 0;
  font-family: inherit;
}

.back-link:hover { color: var(--theme-color); }

.scope-select {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-all-btn {
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  margin-bottom: 8px;
}

.scope-all-btn:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

.scope-all-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 4px; }
.scope-all-desc { font-size: 13px; color: #888; }

.scope-chapter-heading {
  font-size: 12px;
  font-weight: 700;
  color: #999;
  margin: 4px 0 2px;
}

.scope-chapter-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scope-chapter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 48px;
  background: #f8f9ff;
  border: 1.5px solid #e8eaf6;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.scope-chapter-btn:hover { border-color: var(--theme-color); }

.scope-chapter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.scope-chapter-btn:disabled:hover { border-color: #e6e8ee; }

/* 範囲選択画面の下に出す補足（復習モードの「克服」ルールの説明など） */
.scope-note {
  margin-top: 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.scope-chapter-btn .name { flex: 1; padding-right: 12px; }
.scope-chapter-btn .count { flex-shrink: 0; color: var(--theme-color); font-weight: 700; font-size: 13px; }

/* --- 出題画面 --- */
.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.chapter-label {
  text-align: center;
  font-size: 12px;
  color: var(--theme-color);
  font-weight: 600;
  margin-bottom: 16px;
}

.question-card {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stem {
  font-size: 15.5px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.option-btn:hover { border-color: var(--theme-color); }

.option-btn.selected {
  border-color: var(--theme-color);
  background: #f0f0ff;
  font-weight: 600;
}

.option-btn.tf-btn {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

/* 回答後の表示状態 */
.option-btn.correct {
  border-color: #2e7d32;
  background: #e8f5e9;
}

.option-btn.incorrect {
  border-color: #c62828;
  background: #fdecea;
}

.option-btn:disabled { cursor: default; }

.option-badge {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
}

.option-explain {
  display: block;
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.6;
  font-weight: 400;
}

.answer-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.answer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 回答（複数選択のときだけ表示）とスキップを縦に並べる操作行。
   mc / tf は選択した時点で判定するため、この行にはスキップだけが残る。 */
.question-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.skip-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  background: white;
  color: #888;
  border: 1.5px solid #e6e8ee;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.skip-btn:hover { border-color: var(--theme-color); color: var(--theme-color); }

.reveal-area { margin-top: 20px; }

.reveal-options { margin-bottom: 16px; }

.reveal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.action-btn:hover { border-color: var(--theme-color); }

.action-btn.primary {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
}

/* --- 終了サマリー画面 --- */
#screenSummary { text-align: center; }
#screenSummary h2 { font-size: 22px; color: #333; margin-bottom: 16px; }

.summary-score {
  font-size: 32px;
  font-weight: 700;
  color: var(--theme-color);
  margin-bottom: 20px;
}

.summary-chapters {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.summary-chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}

.summary-chapter-row .name { color: #333; }
.summary-chapter-row .score { color: var(--theme-color); font-weight: 700; }

.summary-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 間違えた問題だけを解き直すボタン。記録ボタンの次に置いて目に入るようにする。 */
.action-btn.retry-wrong {
  border-color: #f0d9b5;
  background: #fffaf2;
  color: #a1670f;
  font-weight: 700;
}
.action-btn.retry-wrong:hover { border-color: #e0a75e; }

.summary-note {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.record-status,
.advice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #888;
  min-height: 18px;
}

.advice-area {
  margin-top: 12px;
  text-align: left;
  white-space: pre-wrap;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 12px;
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #333;
}

.quiz-body::-webkit-scrollbar { width: 5px; }
.quiz-body::-webkit-scrollbar-track { background: transparent; }
.quiz-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

/* --- PCブラウザ（幅900px以上）: 画面幅を広く使う ---
   以前は .screen が max-width:520px の中央寄せで、PCでは画面の中央に細い1列が出るだけだった（2026-09-20 に変更）。
   スマホ（600px以下）の指定とは範囲が重ならない。行が長くなりすぎないよう、上限は 1120px（1400px以上は 1240px）。
   ボタン類は横いっぱいに伸ばさず、中央に寄せた幅に留める。 */
@media (min-width: 900px) {
  .header { padding: 18px 40px; }
  .header-text h1 { font-size: 20px; }
  .header-text p { font-size: 13px; }
  .header-btn { font-size: 12px; padding: 7px 14px; }

  .quiz-body { padding: 32px 48px; }
  .screen { max-width: 1120px; }

  /* モード選択: カードを横に並べて広く使う（4枚なら1行） */
  .mode-select { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 16px; }
  .mode-card { padding: 30px 20px; }
  .mode-icon { font-size: 40px; }
  .mode-title { font-size: 18px; }
  .mode-desc { font-size: 14px; }

  /* 範囲選択: 章のボタンを2列に（章が多くても縦に長くなりすぎない） */
  .scope-chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  .scope-chapter-btn { font-size: 15px; }

  /* 出題: 問題文・選択肢を広く、文字も一段大きく */
  .question-card { padding: 28px 36px; }
  .stem { font-size: 18px; line-height: 1.8; }
  .options { gap: 12px; }
  .option-btn { font-size: 16px; padding: 14px 20px; }
  .answer-btn, .action-btn, .skip-btn { max-width: 520px; margin-left: auto; margin-right: auto; }
  .question-actions { align-items: center; }
  .question-actions .answer-btn, .question-actions .skip-btn { width: 100%; }
  .summary-note, .scope-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .reveal-actions { align-items: stretch; }

  /* 終了サマリー: 章別の結果を2列に */
  .summary-chapters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .summary-chapter-row { font-size: 14.5px; padding: 12px 16px; }
  .summary-actions { align-items: center; }
  .summary-actions .action-btn { width: 100%; }
}

@media (min-width: 1400px) {
  .screen { max-width: 1240px; }
}

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 8px 10px; flex-wrap: wrap; }   /* 狭い画面ではボタン類を2行目へ折り返す */
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 16px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; flex-wrap: wrap; flex-basis: 100%; margin-left: 0; }
  .header-btn { font-size: 11px; padding: 6px 10px; }
  .quiz-body { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .stem { font-size: 16.5px; }
  .option-btn { font-size: 16px; }
  .mode-select { gap: 10px; }
  .mode-card { padding: 16px 8px; }
  .mode-icon { font-size: 26px; margin-bottom: 4px; }
  .mode-title { font-size: 14px; margin-bottom: 2px; }
  .mode-desc { font-size: 11px; }
}

@media (max-height: 480px) {
  .quiz-body { padding-top: 14px; }
  .mode-card { padding: 12px 8px; }
  .mode-icon { font-size: 22px; margin-bottom: 2px; }
}

/* --- 中断した問題集の再開バナー（モード選択画面の先頭） --- */
.resume-banner {
  border: 2px solid var(--theme-color);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.resume-text { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
.resume-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-actions .action-btn { flex: 1 1 140px; width: auto; }

  </style>
<style>#askBtn,#adviceBtn{display:none !important}</style>
</head>
<body>
<div style="background:#fff4d6;color:#5b4300;padding:10px 14px;font-size:14px;line-height:1.6;border-bottom:1px solid #e6c96b">
<strong>非公式・個人作成の仮問題です。</strong>ISACA（CISA）の公式の試験・規格とは無関係で、公式の出題・難度とは一致しません。事実関係は公式テキストで未照合です。この公開版では成績・途中経過は保存されません。
</div>
<div class="container">
  <div class="header">
    <div class="header-icon">🔍</div>
    <div class="header-text">
      <h1>CISA問題集（仮問題）</h1>
      <p id="headerSub">モードを選んでください</p>
    </div>
    <div class="header-actions">
      
      
      
      <button type="button" class="header-btn" id="soundBtn" onclick="toggleSound()">🔊 音</button>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="screen" id="screenMode">
      <div class="resume-banner" id="resumeBanner" style="display:none;">
        <div class="resume-text" id="resumeText"></div>
        <div class="resume-actions">
          <button class="action-btn primary" id="resumeBtn" onclick="resumeProgress()">▶ 続きから再開</button>
          <button class="action-btn" onclick="discardProgress()">破棄</button>
        </div>
      </div>
      <div class="mode-select">
        <button class="mode-card" onclick="chooseMode('mc')">
          <div class="mode-icon">📝</div>
          <div class="mode-title" id="mcTitle">模擬試験</div>
          <div class="mode-desc"><span id="mcCount">0</span>問・<span id="mcKind">4択</span></div>
        </button>
        <button class="mode-card" id="tfCard" onclick="chooseMode('tf')">
          <div class="mode-icon">⭕</div>
          <div class="mode-title">一問一答</div>
          <div class="mode-desc"><span id="tfCount">0</span>問・正誤判定</div>
        </button>
        <button class="mode-card" id="extraCard" onclick="chooseMode('extra')">
          <div class="mode-icon">📘</div>
          <div class="mode-title">追加問題</div>
          <div class="mode-desc"><span id="extraCount">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra2Card" onclick="chooseMode('extra2')">
          <div class="mode-icon">📗</div>
          <div class="mode-title">追加問題2</div>
          <div class="mode-desc"><span id="extra2Count">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra3Card" onclick="chooseMode('extra3')">
          <div class="mode-icon">🆕</div>
          <div class="mode-title">新シラバス仮問題</div>
          <div class="mode-desc"><span id="extra3Count">0</span>問・4択（2027年2月〜の追加分）</div>
        </button>
        <button class="mode-card review-card" id="reviewCard" onclick="chooseMode('review')">
          <div class="mode-icon">🔁</div>
          <div class="mode-title">復習</div>
          <div class="mode-desc" id="reviewCount">間違えた問題だけ</div>
        </button>
      </div>
    </div>

    <div class="screen" id="screenScope" style="display:none;">
      <button class="back-link" onclick="backToModeSelect()">← モード選択に戻る</button>
      <div class="scope-select" id="scopeSelect"></div>
    </div>

    <div class="screen" id="screenQuestion" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="chapter-label" id="chapterLabel"></div>
      <div class="question-card">
        <p class="stem" id="stem"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="question-actions" id="questionActions">
        <button class="answer-btn" id="answerBtn" onclick="reveal()" disabled>回答</button>
        <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">回答せずに次へ →</button>
      </div>
      <div class="reveal-area" id="revealArea" style="display:none;">
        <div class="reveal-options" id="revealOptions"></div>
        <div class="reveal-actions">
          <button class="action-btn" id="askBtn" style="display:none !important" onclick="askInChat()">🤖 チャットに詳しく聞く</button>
          <button class="action-btn primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSummary" style="display:none;">
      <h2>お疲れさまでした！</h2>
      <div class="summary-score" id="summaryScore"></div>
      <div class="summary-chapters" id="summaryChapters"></div>
      <div class="summary-actions">
        <button class="action-btn primary" id="recordBtn" onclick="recordResults()">この回の結果を記録</button>
        <button class="action-btn retry-wrong" id="retryWrongBtn" onclick="retryWrongInSession()" style="display:none;">🔁 間違えた問題だけもう一度</button>
        <button class="action-btn" id="adviceBtn" style="display:none !important" onclick="getAdvice()">🎯 学習アドバイスを見る</button>
        <button class="action-btn" onclick="restartMode()">もう一度</button>
        <button class="action-btn" onclick="backToScopeSelect()">別の範囲へ</button>

<script>
  const GAS_WEBAPP_URL = '';
  const EXAM_ID = 'cisa';
  const EXAM_SHORT_TITLE = 'CISA';
  const TRACKING_EXAM_ID = 'cisa';
  const MC_TITLE = '問題集';
  const QUESTIONS = [{"id":"cisa-1","type":"mc","chapterIndex":0,"stem":"リスクベース監査の計画段階で、監査人が最初に行うべき作業として最も適切なものはどれか。","options":["監査対象の事業目的と関連するリスクを評価し、重要性の高い領域を特定する。","前年度の監査調書を流用し、範囲を変えない。","経験則のみで、確認する統制項目を決める。","監査終了の間際に、経営者と指摘事項の候補を事前に擦り合わせ、報告の方向性を調整する。"],"correctIndex":0,"explanations":["○ 正しい。リスクベース監査では、事業目的との関係でリスクを評価し、重点領域を定めることが計画の出発点になる。","× 誤り。前年度の調書の流用は、当年度のリスクの変化を反映しないため不適切である。","× 誤り。経験則のみでは、評価の根拠を文書化できず、客観性を確保できない。","× 誤り。終了間際に経営者と指摘候補を擦り合わせると、監査の独立性が損なわれる。"]},{"id":"cisa-2","type":"mc","chapterIndex":0,"stem":"監査計画の承認者として最も適切なものはどれか。","options":["被監査部門の業務責任者が承認する","内部監査部門の現場担当者が、計画の作成と承認を一人で行う。","監査委員会または取締役会などの統治機関","外部の会計監査人が、内部監査計画を独立した立場で承認し、その変更権限も持つ。"],"correctIndex":2,"explanations":["× 誤り。被監査部門の業務責任者が承認すると、監査の独立性が損なわれる。","× 誤り。計画の作成と承認を現場担当者が一人で行うと、統制の牽制が働かない。","○ 正しい。監査計画は統治機関に承認されることで、監査の独立性と権限が担保される。","× 誤り。外部の会計監査人は独立した第三者であり、内部監査計画の承認権限は持たない。"]},{"id":"cisa-3","type":"mc","chapterIndex":0,"stem":"監査の範囲を決める際に、監査人が最も重視すべき要素はどれか。","options":["過去に監査対象とされた回数が多い項目を、今年も優先して範囲に含めること。","監査対象の重要性とリスクの大きさ","監査人の作業負担を平準化するため、年間の監査項目を均等に割り振ること。","監査対象部門の希望を最優先し、その要望に沿って監査範囲を決めること。"],"correctIndex":1,"explanations":["× 誤り。過去の監査回数は、現在のリスクの大きさを示すものではない。","○ 正しい。監査範囲は、対象の重要性とリスクの大きさに応じて決めることが基本である。","× 誤り。作業負担の平準化は運営上の配慮であり、範囲決定の主たる根拠ではない。","× 誤り。被監査部門の希望で範囲を狭めると、監査の客観性が損なわれる。"]},{"id":"cisa-4","type":"mc","chapterIndex":0,"stem":"監査証拠の十分性と適切性を判断する際の考え方として、最も適切なものはどれか。","options":["口頭の説明が一貫していれば、文書による裏付けは不要である。","証拠の量を増やすことで、質の低さを補うことができる。","監査人が作成した要約は、原資料より信頼性が高い。","独立した外部の情報源から得た証拠は、内部で作成された資料より信頼性が高い。"],"correctIndex":3,"explanations":["× 誤り。口頭説明のみでは証拠として弱く、文書による裏付けが必要である。","× 誤り。量を増やしても、証拠の質が低ければ結論を支えられない。","× 誤り。監査人の要約は解釈を含むため、原資料より信頼性が高いとは限らない。","○ 正しい。独立した外部の情報源からの証拠は、内部資料より信頼性が高いとされる。"]},{"id":"cisa-5","type":"mc","chapterIndex":0,"stem":"監査手続の実施に先立って、監査対象のシステムに関する情報を収集する目的として最も適切なものはどれか。","options":["監査リスクを評価し、監査手続の性質・時期・範囲を決めるため。","監査人が担当業務を早く終えるため。","被監査部門の担当者と良好な関係を築くため。","監査報告書の体裁を事前に整えるため、報告の骨子と表現を先に決めておくこと。"],"correctIndex":0,"explanations":["○ 正しい。予備調査で得た情報をもとに、リスクを評価して手続の性質・時期・範囲を決める。","× 誤り。早期終了は目的にならず、監査の品質を優先すべきである。","× 誤り。関係構築は副次的な効果であり、情報収集の主目的ではない。","× 誤り。報告書の体裁や骨子は、監査結果が確定してから検討すべきものである。"]},{"id":"cisa-6","type":"mc","chapterIndex":0,"stem":"監査の実施過程で不適合を発見した場合、監査人が最初に行うべき対応として最も適切なものはどれか。","options":["直ちに監査報告書に記載し、結論を確定させる。","不適合の影響が小さいと判断し、報告の対象から外すとともに、経営者の承認を省略する。","事実関係を確認し、被監査部門の見解を聴取して根拠を補強する。","不適合を自ら是正し、是正後の状態だけを報告書に記録して、指摘を残さない。"],"correctIndex":2,"explanations":["× 誤り。事実確認と見解の聴取の前に結論を確定させると、誤りを含む恐れがある。","× 誤り。影響の判断は監査人の評価を経るべきで、独断で報告対象から外すことは不適切である。","○ 正しい。事実関係を確かめ、被監査部門の見解を聴いたうえで、根拠を補強して評価する。","× 誤り。監査人が是正を行うと、監査の独立性を損なう。"]},{"id":"cisa-7","type":"mc","chapterIndex":0,"stem":"監査報告書に記載する指摘事項の構成要素として、一般的に含めるべきものはどれか。","options":["監査人の個人的な感想と推測を、事実として断定的に記載する。","指摘の事実、基準、原因、影響、改善の提言","被監査部門の職員名と評価点を、個人別の成績として一覧にして記載する。","監査に要した時間の詳細な内訳を、一件ごとに分単位で報告書へ載せる。"],"correctIndex":1,"explanations":["× 誤り。個人的な感想や推測は、根拠のある指摘事項の構成要素ではない。","○ 正しい。事実・基準・原因・影響・提言を揃えることで、読み手が指摘の妥当性を判断できる。","× 誤り。職員の個人評価は監査の目的ではなく、指摘事項に含めるべき内容ではない。","× 誤り。監査時間の内訳は、指摘事項の構成要素として必要な情報ではない。"]},{"id":"cisa-8","type":"mc","chapterIndex":0,"stem":"監査報告後のフォローアップの目的として最も適切なものはどれか。","options":["監査報告書の評価を被監査部門に再度確認してもらうこと。","次回の監査範囲を前回より広く設定すること。","監査人の作業時間を記録し、評価の材料とすること。","指摘事項に対する改善計画の実施状況と、その有効性を確認すること。"],"correctIndex":3,"explanations":["× 誤り。報告書の評価を再確認させることは、フォローアップの目的ではない。","× 誤り。次回の範囲設定は別途リスクに基づいて決めるべきで、フォローアップの目的ではない。","× 誤り。作業時間の記録は、フォローアップの目的とは無関係である。","○ 正しい。改善計画の実施状況と有効性を確認し、指摘事項が解消されたかを見届ける。"]},{"id":"cisa-9","type":"mc","chapterIndex":0,"stem":"監査人の独立性と客観性を保つ方法として、最も適切なものはどれか。","options":["監査人の報告ラインを取締役会または監査委員会へ直接つなぐ。","監査対象部門の業務を担当し、日常運用にも関与する。","監査人の評価を、被監査部門の人事評価へ組み込む。","監査対象部門の判断を事前に確認し、その範囲内でのみ監査を行うことで、関係を円滑にする。"],"correctIndex":0,"explanations":["○ 正しい。報告ラインを統治機関につなぐことで、経営からの独立性が保たれる。","× 誤り。日常の運用に関与すると、監査対象部門の業務を客観的に評価できなくなる。","× 誤り。人事評価を監査対象部門に依存させると、監査の客観性が損なわれる。","× 誤り。被監査部門の判断に従うと、監査の範囲と結論が歪められる。"]},{"id":"cisa-10","type":"mc","chapterIndex":0,"stem":"情報システム監査の目的として最も適切なものはどれか。","options":["情報システムの運用コストを最小化するため、保守と監視の範囲を一律に削減し、重要な統制の確認は省略すること。","最新の技術を導入するための提案を、利用部門の要望を待たず全社へ一律に行い、統制の評価を省くこと。","情報システムが組織の目標達成を支え、適切に統制されているかを独立した立場から評価すること。","情報システムの利用者の操作性を評価すること。"],"correctIndex":2,"explanations":["× 誤り。コストの最小化は経営判断の領域で、統制の確認を省くことは監査の目的に反する。","× 誤り。技術の導入提案は助言的活動であり、統制の評価を省いてまで行うべき監査の目的ではない。","○ 正しい。組織目標への貢献と統制の適切性を、独立した立場から評価することが監査の目的である。","× 誤り。操作性の評価は利用者の評価の領域で、監査の主目的ではない。"]},{"id":"cisa-11","type":"mc","chapterIndex":0,"stem":"監査人が業務の一部を外部の専門家に依頼する場合に、最も重要なことはどれか。","options":["専門家の報酬を最も低く抑えるため、専門性の確認を簡略化し、契約の条件も相手方の提示どおりとすること。","専門家の専門性と独立性を評価し、その作業結果を監査人が自ら評価すること。","専門家の作業結果を、そのまま監査報告書に転記し、監査人による検証の記録を残さないこと。","専門家に監査の結論まで任せ、監査人は確認を省略して、その結果を経営者へそのまま伝えること。"],"correctIndex":1,"explanations":["× 誤り。報酬の抑制は、専門性や独立性の確保より優先されるものではない。","○ 正しい。外部専門家の専門性と独立性を確かめ、結果を監査人が自ら評価して結論に責任を持つ。","× 誤り。結果の転記は、監査人自身の評価を省いており不適切である。","× 誤り。結論を外部に任せると、監査人としての責任と独立性が損なわれる。"]},{"id":"cisa-12","type":"mc","chapterIndex":0,"stem":"監査の実施において、監査人が面談で得た情報の扱いとして最も適切なものはどれか。","options":["面談内容は、そのまま結論の根拠として扱う。","面談内容は、関係者の立場に応じて扱いを変える。","面談内容は、記録に残さず口頭のみで扱う。","面談内容は、文書や記録などの客観的証拠で裏付けを取る。"],"correctIndex":3,"explanations":["× 誤り。面談の内容だけでは、客観的な裏付けがないため結論の根拠としては弱い。","× 誤り。関係者の立場で扱いを変えると、情報の客観性と公平性が損なわれる。","× 誤り。記録を残さないと、監査調書としての検証可能性が失われる。","○ 正しい。面談による情報は、文書や記録などの客観的証拠で裏付けを取ることが必要である。"]},{"id":"cisa-13","type":"mc","chapterIndex":0,"stem":"監査人が監査調書を作成する目的として最も適切なものはどれか。","options":["監査の計画・実施・結論の根拠を示し、後から検証できるようにするため。","監査人の作業時間を正確に記録するため。","被監査部門への報告を円滑にするため。","監査人の評価を社内で比較しやすくするため、全部署の調書を同一の書式にそろえ、結論を一覧で比較すること。"],"correctIndex":0,"explanations":["○ 正しい。監査調書は、計画・実施・結論の根拠を示し、第三者が検証できるようにするものである。","× 誤り。作業時間の記録は副次的なもので、調書の主目的ではない。","× 誤り。報告の円滑化は調書の主目的ではなく、報告書で対応すべき事項である。","× 誤り。社内での比較のために調書を作成することは、調書の目的として適切ではない。"]},{"id":"cisa-14","type":"mc","chapterIndex":0,"stem":"監査の品質を維持するために、監査部門が設けるべき仕組みとして最も適切なものはどれか。","options":["監査人の作業を、監査対象部門の承認なしには記録しない仕組み。","監査人の評価を、監査指摘の件数だけで行い、件数の多い部門ほど高く評価する仕組み。","監査調書を複数の上位者が査閲し、監査基準への準拠を確認する仕組み。","監査計画を、監査の実施後に事後的に作成し、結論が出た後で手続の範囲を決める仕組み。"],"correctIndex":2,"explanations":["× 誤り。被監査部門の承認を前提とすると、監査の独立性が損なわれる。","× 誤り。指摘件数のみで評価すると、質より件数を優先する歪みが生じる。","○ 正しい。調書の査閲と基準準拠の確認は、監査品質を維持する代表的な仕組みである。","× 誤り。計画は実施前に作るべきもので、事後の作成では計画の役割を果たせない。"]},{"id":"cisa-15","type":"mc","chapterIndex":0,"stem":"監査人が重要性（マテリアリティ）を判断する際の基本的な考え方として、最も適切なものはどれか。","options":["金額の大小だけで判断し、利用者への影響や質的な要因は、いかなる場合も考慮しないものとする。","金額と質的な要因の両方を考慮し、利用者の判断に影響するかで判断する。","過去の監査で指摘されなかった項目は、重要性がないとみなし、監査の対象から外しても差し支えない。","被監査部門が重要と考える項目だけを対象とし、監査人は範囲の判断に関与しないものとする。"],"correctIndex":1,"explanations":["× 誤り。質的な要因を無視すると、金額が小さくても重要な問題を見落とす恐れがある。","○ 正しい。金額と質的要因の両面から、利用者の判断に影響するかで重要性を判断する。","× 誤り。過去に指摘がないことは、現在の重要性がないことの根拠にはならない。","× 誤り。被監査部門の判断に委ねると、客観的な重要性の評価ができない。"]},{"id":"cisa-16","type":"mc","chapterIndex":0,"stem":"監査人が予備調査で入手した情報が、計画時の想定と大きく異なる場合の対応として最も適切なものはどれか。","options":["当初の計画をそのまま維持し、実施を進める。","想定と異なる情報は無視し、報告書の段階で触れる。","監査を中止し、次年度に延期する。","計画を見直し、リスクの評価と監査手続の範囲・時期を再検討する。"],"correctIndex":3,"explanations":["× 誤り。想定と異なる情報を無視すると、重要なリスクを見落とす恐れがある。","× 誤り。報告段階での言及では、必要な検証を行う機会を失う。","× 誤り。監査の中止は、対応として過大であり、原則として計画の見直しで対応する。","○ 正しい。情報の変化に応じて、リスク評価と手続の範囲・時期を見直すことが求められる。"]},{"id":"cisa-17","type":"mc","chapterIndex":0,"stem":"監査の目的に照らして、監査の結論を表明する際に必要な要件として最も適切なものはどれか。","options":["結論が、入手した十分かつ適切な証拠によって裏付けられていること。","監査人が個人的に納得できれば十分である。","被監査部門が結論に同意していること。","結論の内容を、経営者の期待に沿うように調整し、関係者の了解を得た形で報告すること。"],"correctIndex":0,"explanations":["○ 正しい。結論は、十分かつ適切な証拠に裏付けられていることが必要である。","× 誤り。個人的な納得では、第三者が検証できる根拠にならない。","× 誤り。被監査部門の同意は結論の要件ではなく、独立性の観点からも適切ではない。","× 誤り。経営者の期待に沿うように結論を調整すると、監査の客観性が損なわれる。"]},{"id":"cisa-18","type":"mc","chapterIndex":0,"stem":"内部監査部門が監査の計画を策定する際に、考慮すべき要素として最も適切なものはどれか。","options":["監査人の個人的な関心事項のみを基準にして、組織全体のリスクとは無関係に監査項目を選ぶこと。","被監査部門の職員数のみを基準にして、人数の多い部門から順に監査の対象とすること。","組織のリスク評価、前回の指摘事項、経営からの要請、利用可能な資源。","前年度の監査予算の残額だけを見て、計画を組むこと。"],"correctIndex":2,"explanations":["× 誤り。個人的な関心事項だけでは、組織全体のリスクを適切に反映できない。","× 誤り。職員数だけでは、リスクの大きさや重要性を判断できない。","○ 正しい。リスク評価、前回の指摘、経営の要請、資源の制約を総合して計画を策定する。","× 誤り。予算の残額は資源の一要素にすぎず、計画の策定要素として十分ではない。"]},{"id":"cisa-19","type":"mc","chapterIndex":0,"stem":"監査人が監査対象の統制を評価する際の、統制の「設計の有効性」の確認として適切なものはどれか。","options":["統制が意図どおりに継続して運用されていたかを、期間を通じて確認し、例外が一件もないことを確かめる。","統制がリスクを低減する設計になっているかを、規程や手順書などから確認する。","統制の実施記録の件数だけを集計し、件数が多いほど統制が有効であると判断して結論を出す。","統制の担当者の経験年数を確認し、経験の長い担当者が設計した統制を有効と判断する。"],"correctIndex":1,"explanations":["× 誤り。継続的な運用の確認は、運用の有効性の評価に当たる。","○ 正しい。設計の有効性は、統制がリスクを低減する形で設計されているかを確認することである。","× 誤り。記録の件数だけでは、統制の設計が適切かどうかを判断できない。","× 誤り。担当者の経験年数は、統制の設計の有効性とは直接関係しない。"]},{"id":"cisa-20","type":"mc","chapterIndex":0,"stem":"監査人が不正の兆候を発見した場合の対応として最も適切なものはどれか。","options":["被監査部門に直ちに問い詰め、事実を確認する。","兆候が小さいと判断し、通常の手続で触れる程度にとどめる。","不正の疑いがある取引を、自ら取り消す。","独断で調査を進めず、速やかに統治機関へ報告し、その指示に従う。"],"correctIndex":3,"explanations":["× 誤り。被監査部門に直接問い詰めると、証拠の隠滅や関係者への影響を招く恐れがある。","× 誤り。兆候を軽視して通常手続で済ませると、重大な不正を見落とす恐れがある。","× 誤り。監査人が取引を取り消すことは、監査人の役割を超えており不適切である。","○ 正しい。不正の兆候は、速やかに統治機関へ報告し、その指示のもとで対応することが原則である。"]},{"id":"cisa-21","type":"mc","chapterIndex":1,"stem":"ITガバナンスの目的として最も適切なものはどれか。","options":["ITへの投資が組織の戦略目標を支え、リスクが適切に管理されるように、経営が意思決定と監督を行う仕組みを確立すること。","IT部門の人員と予算を最大化し、経営の監督を受けずに運用すること。","最新の技術を優先して採用すること。","IT部門の業務を、すべて外部委託し、委託先の判断に従って運用の方針と統制の基準を決め、社内の確認も委託先への監督も一切行わないこと。"],"correctIndex":0,"explanations":["○ 正しい。ITガバナンスは、ITが戦略目標を支え、リスクを管理するための経営の意思決定と監督の仕組みである。","× 誤り。人員と予算の最大化は、ガバナンスの目的ではなく、資源配分の一要素にすぎない。","× 誤り。技術の新しさを優先すると、戦略目標との整合性やリスク管理が後回しになる。","× 誤り。業務をすべて外部委託すると、経営によるIT統制の責任を果たせなくなる。"]},{"id":"cisa-22","type":"mc","chapterIndex":1,"stem":"COBIT の枠組みにおいて、ITガバナンスと経営の役割を分ける基本的な考え方はどれか。","options":["経営は計画と実行を担い、ガバナンスは監督を担うが、両者は必要に応じて権限を相互に交換してよい。","ガバナンスと経営は、同じ組織が同じ権限で担う。","ガバナンスは評価・指示・監視を担い、経営は計画・構築・運用・モニタリングを担う。","ガバナンスは運用の細部に関与し、経営は戦略の決定だけを担い、現場の判断には一切関与しない。"],"correctIndex":2,"explanations":["× 誤り。両者が権限を相互に交換してよいとすると、監督と執行の分離が失われ、COBITの考え方に合わない。","× 誤り。ガバナンスと経営の役割を同じ権限で担うと、監督と執行の分離が失われる。","○ 正しい。COBITでは、ガバナンスが評価・指示・監視を担い、経営が計画・構築・運用・モニタリングを担う。","× 誤り。ガバナンスは運用の細部ではなく、方向性と監督に関与するものである。"]},{"id":"cisa-23","type":"mc","chapterIndex":1,"stem":"情報セキュリティの方針を策定する際に、最も重要なことはどれか。","options":["最新の攻撃手法を網羅的に列挙し、それぞれの対策を担当者ごとに個別に決めること。","組織の事業目的とリスク選好に整合させ、経営層の承認を得ること。","IT部門だけで内容を決め、他部門には完成後に通知して、必要な場合のみ見直すこと。","他社の方針をそのまま採用し、自組織の事業目的やリスク選好の確認は、時間の都合で省略すること。"],"correctIndex":1,"explanations":["× 誤り。攻撃手法の網羅的な列挙は、方針の役割である組織の方向付けに当たらない。","○ 正しい。方針は事業目的とリスク選好に沿い、経営層が承認して組織全体に示されることが重要である。","× 誤り。IT部門だけで決めると、事業側の視点とリスク選好が反映されない。","× 誤り。他社の方針の流用は、自組織の事業目的やリスクに合わない恐れがある。"]},{"id":"cisa-24","type":"mc","chapterIndex":1,"stem":"組織のリスク管理において、経営が設定すべき「リスク選好」の説明として最も適切なものはどれか。","options":["リスクをすべて回避するための具体的な統制手続。","過去に発生したリスクの件数の集計結果。","リスク担当者の個人的な判断基準。","組織が目標達成のために、どの程度のリスクを受け入れるかの方針。"],"correctIndex":3,"explanations":["× 誤り。リスクをすべて回避するのは、リスク選好の考え方とは異なり、目標達成と両立しない。","× 誤り。過去のリスク件数は実績であり、受け入れる水準を定める方針そのものではない。","× 誤り。個人の判断基準では、組織としての一貫した受容水準を示せない。","○ 正しい。リスク選好は、組織が目標達成のために受け入れるリスクの水準を定める方針である。"]},{"id":"cisa-25","type":"mc","chapterIndex":1,"stem":"IT部門の組織設計において、職務分掌の観点から最も避けるべきものはどれか。","options":["データベースの管理者が、業務システムのアクセス権限を自ら承認する。","システムの開発担当者と本番環境の運用担当者を分け、双方の作業を相互に確認できないように担当を固定する。","情報セキュリティ担当が、アクセス権限の審査を独立して行う。","変更の承認者と実施者を分けて管理する。"],"correctIndex":0,"explanations":["○ 正しい。管理者が自ら権限を承認すると、牽制が働かず不正や誤りを防げない。","× 誤り。開発と運用を分けることは、職務分掌の基本であり、避けるべきものではない。","× 誤り。審査の独立は、統制の有効性を高める望ましい職務分掌である。","× 誤り。承認と実施を分けることは、変更管理の牽制として望ましい。"]},{"id":"cisa-26","type":"mc","chapterIndex":1,"stem":"情報セキュリティ管理体制において、経営層の役割として最も適切なものはどれか。","options":["個々のセキュリティ事故の対応手順を、経営層が自ら実施し、現場の担当者には報告のみを求める。","技術的な設定の詳細を、担当者に代わって経営層が一つずつ決定し、現場の判断を認めない。","セキュリティのリスクを経営上の課題として認識し、資源配分と責任体制を決める。","セキュリティ研修を、全職員に直接講義する。"],"correctIndex":2,"explanations":["× 誤り。事故対応の実施は現場の担当者の役割であり、経営層が自ら行うことではない。","× 誤り。技術設定の詳細は専門の担当者が決めるべきもので、経営層が代わって決めることは適切でない。","○ 正しい。経営層はセキュリティを経営課題として捉え、資源配分と責任体制を決める役割を担う。","× 誤り。研修の講義は現場の担当者や専門組織が担うもので、経営層が直接行う役割ではない。"]},{"id":"cisa-27","type":"mc","chapterIndex":1,"stem":"ITの方針と手順の体系に関して、最も適切なものはどれか。","options":["方針は詳細な手順を含み、手順は組織全体の方向性と経営の意図を示すものとして、全社で一律に扱うこと。","方針は組織の意図と原則を示し、手順は方針を実現するための具体的な作業を定める。","方針と手順は同じ文書にまとめて一体で運用し、両者を区別せず、現場が必要に応じて判断すること。","手順は役員のみが承認し、方針は現場の担当者が決めて、経営に事後に報告する運用とする。"],"correctIndex":1,"explanations":["× 誤り。方針と手順の役割が逆になっており、方針は詳細な作業を定めるものではない。","○ 正しい。方針は意図と原則を示し、手順は方針を具体的な作業に落とし込むものである。","× 誤り。方針と手順を区別しないと、原則と具体的作業の関係が曖昧になり、運用が統制されにくい。","× 誤り。承認と決定の役割が逆になっており、方針は経営が承認し、手順は現場が具体化する。"]},{"id":"cisa-28","type":"mc","chapterIndex":3,"stem":"IT資産の管理において、最初に行うべき作業として最も適切なものはどれか。","options":["資産の購入価格を、過去の実績から推定する。","使用していない資産を、直ちに廃棄する。","資産の更新時期を、担当者の判断で決める。","組織が保有するハードウェア・ソフトウェア・データの棚卸しを行い、所在と管理者を把握する。"],"correctIndex":3,"explanations":["× 誤り。購入価格の推定は会計的な関心事であり、管理の出発点ではない。","× 誤り。使用していない資産を直ちに廃棄すると、必要な資産の情報を失う恐れがある。","× 誤り。更新時期を担当者の判断だけで決めると、組織としての計画性と統制が欠ける。","○ 正しい。資産の棚卸しで所在と管理者を把握することが、IT資産管理の出発点になる。"]},{"id":"cisa-29","type":"mc","chapterIndex":1,"stem":"ITの人材管理において、組織が最も重視すべき観点はどれか。","options":["必要なスキルを明確にし、教育と配置を計画的に行う。","特定の担当者に知識を集中させ、代替要員を置かず、業務の属人化を許容する。","人材の採用を、コスト最小の方法に限る。","外部人材への依存を、できるだけ多く増やす。"],"correctIndex":0,"explanations":["○ 正しい。必要なスキルを定義し、教育と配置を計画的に行うことが人材管理の基本である。","× 誤り。特定の担当者に依存すると、欠員や退職の際に業務が停止する恐れがある。","× 誤り。コストの最小化のみを重視すると、必要な能力が確保されない。","× 誤り。外部人材への過度の依存は、知識が社内に蓄積されないリスクを高める。"]},{"id":"cisa-30","type":"mc","chapterIndex":1,"stem":"ITのパフォーマンス管理に用いられる指標として、最も適切なものはどれか。","options":["IT部門のオフィスの広さを、業務の成果と結び付けて評価し、その面積に応じて予算を配分すること。","IT部門の職員の出勤日数を、業務の成果と無関係に集計し、評価の基準として一律に用いること。","システムの可用性、インシデント対応時間、変更の成功率などの測定可能な指標","過去に導入したソフトウェアの本数"],"correctIndex":2,"explanations":["× 誤り。オフィスの広さは、ITの成果や統制の状況を測る指標にはならない。","× 誤り。出勤日数は勤務管理の情報であり、ITのパフォーマンスを示す指標ではない。","○ 正しい。可用性やインシデント対応時間など、成果と統制を測れる指標が管理に用いられる。","× 誤り。導入本数は資産の量を示すにすぎず、成果や有効性を示す指標ではない。"]},{"id":"cisa-31","type":"mc","chapterIndex":1,"stem":"IT戦略と事業戦略の整合性を確保するための取組みとして、最も適切なものはどれか。","options":["IT戦略は事業部門の関与なしに、IT部門が単独で策定し、経営には完成後に報告する。","事業目標を踏まえてIT戦略を策定し、経営層と事業部門が協議して承認する。","IT戦略は、技術の流行に合わせて毎年全面的に変更し、前年度の計画との一貫性は問わない。","IT戦略は策定後、一切の見直しを行わず、当初の計画を最後まで変えずに実施する。"],"correctIndex":1,"explanations":["× 誤り。事業部門の関与がないと、事業目標との整合性を確保できない。","○ 正しい。事業目標に基づき、経営層と事業部門が協議して承認することで整合性が確保される。","× 誤り。流行に合わせて全面的に変更すると、戦略の一貫性と実行計画の継続性が失われる。","× 誤り。見直しを一切行わないと、事業環境の変化に対応できない。"]},{"id":"cisa-32","type":"mc","chapterIndex":1,"stem":"ITガバナンスにおけるリスク管理の一環として、経営層が行うべきことはどれか。","options":["IT部門だけで評価し、報告しない。","リスクの管理を、担当者の裁量に任せる。","事前の評価は行わず、発生後に限り対応する。","リスクの評価結果を、経営の意思決定に反映させる。"],"correctIndex":3,"explanations":["× 誤り。経営に報告しないと、経営が責任を持って意思決定できない。","× 誤り。裁量に任せると、組織としての一貫したリスク管理ができない。","× 誤り。事前の評価を省くと、重大なリスクへの備えが遅れる。","○ 正しい。リスク評価の結果を経営の意思決定に反映させることが、ITガバナンスにおけるリスク管理の要である。"]},{"id":"cisa-33","type":"mc","chapterIndex":1,"stem":"IT投資の評価において、経営が最も重視すべき観点はどれか。","options":["投資が事業目標にどの程度貢献し、その効果が測定されているかどうか。","投資の金額が前年度より大きいかどうか。","投資の対象が最新の技術かどうか。","投資の決裁者が役職の高い人物かどうか、またその人物が過去の投資で成果を上げた実績があるかどうか。"],"correctIndex":0,"explanations":["○ 正しい。投資が事業目標にどう貢献し、効果が測定されているかを確認することが重要である。","× 誤り。前年度との比較のみでは、投資の価値や効果を判断できない。","× 誤り。技術の新しさのみでは、投資が事業目標に資するかを判断できない。","× 誤り。決裁者の役職の高さや実績だけでは、投資の妥当性を示すものではない。"]},{"id":"cisa-34","type":"mc","chapterIndex":1,"stem":"情報セキュリティのポリシーを組織に浸透させるために、最も効果的なものはどれか。","options":["ポリシーを社内の文書管理システムに保存し、閲覧できる状態にしておく。","違反者を公表し、見せしめとする。","役職や業務に応じた教育と、定期的な理解度の確認を行う。","ポリシーを外部の専門企業に一括して説明させ、社内の教育は行わないものとする。"],"correctIndex":2,"explanations":["× 誤り。保存しておくだけでは、職員がポリシーの内容を理解し、実践するとは限らない。","× 誤り。違反者の公表は、職員の萎縮を招くなど逆効果になる恐れがある。","○ 正しい。役割に応じた教育と理解度の確認により、ポリシーの内容が業務に定着する。","× 誤り。外部企業の説明だけでは、自組織の業務に即した理解と定着が図れない。"]},{"id":"cisa-35","type":"mc","chapterIndex":1,"stem":"ITリスクの評価を行う際の基本的な手順として、最も適切なものはどれか。","options":["リスクの発生確率だけを評価し、影響度は考慮せず、発生頻度の高いものから順に対応を決める。","リスクの発生確率と影響度を評価し、優先順位を付けて対応方針を決める。","過去に発生していないリスクは、将来の発生もないとみなして評価の対象から外し、記録に残さない。","リスクの評価は、対応を実施した後に行い、その結果を次回の対応計画の参考として扱う。"],"correctIndex":1,"explanations":["× 誤り。影響度を考慮しないと、発生頻度は低くても重大な損害をもたらすリスクを見落とす。","○ 正しい。発生確率と影響度を評価して優先順位を付け、対応方針を決めることが基本的な手順である。","× 誤り。過去に発生していないことは、将来のリスクが無いことを意味しない。","× 誤り。評価は対応の前に行うべきもので、事後の評価では対応の判断に使えない。"]},{"id":"cisa-36","type":"mc","chapterIndex":1,"stem":"IT部門の業務の外部委託に関して、組織が最も注意すべきことはどれか。","options":["委託先の選定を価格のみで行い、契約内容は委託先に任せる。","委託先が第三者に再委託しても、組織は関知しない。","委託後は、委託先の報告を一切確認しない。","委託先の管理責任は組織に残るため、委託先のサービス品質とセキュリティを継続的に監視する。"],"correctIndex":3,"explanations":["× 誤り。価格のみで選定し契約内容を委託先に任せると、品質とセキュリティを確保できない。","× 誤り。再委託の状況を関知しないと、情報の取扱いが把握できず、統制が及ばなくなる。","× 誤り。委託先の報告を確認しないと、サービスの品質や問題の兆候を把握できない。","○ 正しい。外部委託しても管理責任は組織に残るため、委託先を継続的に監視することが求められる。"]},{"id":"cisa-37","type":"mc","chapterIndex":3,"stem":"ITの変更管理に関する統制として、最も適切なものはどれか。","options":["変更の内容、影響、承認、テスト結果、実施記録を一連の手続として管理する。","変更は緊急時を除き、承認と記録を経ずに実施するが、事後に担当者が報告すれば足りる。","本番環境の変更は、担当者が個人の判断で随時行う。","変更の記録は、システムの稼働後に必要な場合のみ残す。"],"correctIndex":0,"explanations":["○ 正しい。変更の内容、影響、承認、テスト、実施記録を一連の手続として管理することが統制の基本である。","× 誤り。緊急時であっても、事後の承認と記録を省くことは適切な統制とはいえない。","× 誤り。個人の判断で随時変更すると、承認と記録がなく、変更の誤りや不正を防げない。","× 誤り。記録を稼働後に必要な場合のみ残すと、変更の経緯を追跡できない。"]},{"id":"cisa-38","type":"mc","chapterIndex":1,"stem":"情報セキュリティのガバナンスにおいて、取締役会が果たすべき役割として最も適切なものはどれか。","options":["セキュリティの技術的な設定を、経営層が直接決定し、担当者の技術的な助言は必要に応じてのみ聞く。","セキュリティ事故の対応を、個別に指揮する。","セキュリティを経営上のリスクとして監督し、方針と体制の整備状況を確認する。","セキュリティ予算を、担当者の要求どおりに承認し、費用対効果の検討は事後に行うものとする。"],"correctIndex":2,"explanations":["× 誤り。技術設定の決定は専門の担当者が行うもので、取締役会の役割ではない。","× 誤り。個別の事故対応は現場や専門組織が指揮するもので、取締役会が直接指揮するのは適切でない。","○ 正しい。取締役会はセキュリティを経営リスクとして監督し、方針と体制の整備を確認する。","× 誤り。予算は、リスクと投資効果を踏まえて事前に判断すべきで、要求どおりに承認し事後に検討するのは適切でない。"]},{"id":"cisa-39","type":"mc","chapterIndex":1,"stem":"IT部門の内部統制の整備において、最も基本となる考え方はどれか。","options":["統制は、コストが最も低いものだけを選び、リスクの大きさは統制の選定の判断材料としない。","統制は、リスクに応じて設計し、その運用状況を継続的に確認する。","統制は、一度設計すれば変更する必要がなく、環境の変化があっても見直しは行わない。","統制は、担当者の経験に基づいて個別に決め、組織としての基準は設けずに運用する。"],"correctIndex":1,"explanations":["× 誤り。コストの低さのみで選ぶと、重要なリスクに対応できない統制になる。","○ 正しい。統制はリスクに応じて設計し、運用状況を継続的に確認することが基本である。","× 誤り。環境や業務が変われば統制も変更が必要であり、一度の設計で済むものではない。","× 誤り。経験のみで個別に決めると、組織として一貫した統制が保てない。"]},{"id":"cisa-40","type":"mc","chapterIndex":1,"stem":"ITの委員会の設置が組織の統制として有効な理由として、最も適切なものはどれか。","options":["委員会の議論を、経営の意思決定の代わりとするため。","委員会の構成員の報酬を増やすため。","委員会で、IT部門の業務を直接実施するため。","IT投資とリスクの判断を、事業部門とIT部門が協議して行い、経営の監督を実効的にするため。"],"correctIndex":3,"explanations":["× 誤り。委員会は意思決定を支える場であり、経営の意思決定の代わりになるものではない。","× 誤り。報酬の増加は、統制の有効性とは無関係な理由である。","× 誤り。委員会が業務を直接実施すると、監督と執行が一体化し、統制の役割を果たせない。","○ 正しい。事業部門とIT部門が協議し、経営の監督を実効的にすることが委員会の意義である。"]},{"id":"cisa-41","type":"mc","chapterIndex":1,"stem":"情報システムのパフォーマンス指標（KPI）の設定に関して、最も適切なものはどれか。","options":["指標は、組織の目標と結び付けて設定し、達成度を継続的に測定する。","指標は、測定が容易なものだけを選ぶ。","指標は、一度設定すれば変更しない。","指標は、担当者ごとに異なる基準で設定し、部門間の比較は行わず、各部門の裁量で結果を評価する。"],"correctIndex":0,"explanations":["○ 正しい。指標は組織の目標と結び付けて設定し、継続的に測定して達成度を確認する。","× 誤り。測定が容易なものだけを選ぶと、目標の達成度を適切に示せない恐れがある。","× 誤り。環境の変化に応じて指標を見直さないと、目標との関連が失われる。","× 誤り。担当者ごとに基準が異なると、組織として比較と評価ができない。"]},{"id":"cisa-42","type":"mc","chapterIndex":1,"stem":"ITガバナンスにおける「価値の提供」の意味として最も適切なものはどれか。","options":["IT部門の支出を最小限に抑え、支出の削減そのものを成果として評価すること。","IT部門の人員を増やし、業務量の増加に関係なく、組織の体制を大きくすること。","ITが事業に貢献し、投資に見合った成果を生み出すこと。","IT機器の台数を増やし、それを成果とすること。"],"correctIndex":2,"explanations":["× 誤り。支出の削減を成果として評価するだけでは、価値の提供そのものを示せない。","× 誤り。人員の増加は、成果を生むことを保証するものではない。","○ 正しい。価値の提供は、ITが事業に貢献し、投資に見合う成果を生むことを指す。","× 誤り。機器の数は価値の大きさを示さず、事業への貢献とは無関係である。"]},{"id":"cisa-43","type":"mc","chapterIndex":4,"stem":"情報資産の分類を行う目的として最も適切なものはどれか。","options":["分類の作業を、担当者の業務量に合わせて行い、作業の負担が増えないように分類の粒度を粗くするため。","情報の重要性に応じて、必要な保護の水準を決めるため。","分類の結果を、外部の業者に販売して、組織の収益を増やすため。","分類を、全ての情報に同じ水準で適用して、管理の手間を省くため。"],"correctIndex":1,"explanations":["× 誤り。作業量の調整は分類の目的ではなく、管理上の副次的な事項である。","○ 正しい。情報の重要性に応じて分類し、必要な保護の水準を定めることが目的である。","× 誤り。分類の結果を販売することは、分類の目的とは無関係で、情報の保護に反する。","× 誤り。全てに同じ水準を適用すると、重要な情報の保護が不十分になるか、過剰な統制になる。"]},{"id":"cisa-44","type":"mc","chapterIndex":1,"stem":"ITの運用における責任の明確化に関して、最も適切なものはどれか。","options":["責任は、組織全体で共有し、個人の責任範囲を定めない。","責任は、トラブルが起きたときに決める。","責任は、外部委託先に全て移す。","システムごとに所有者と管理者を定め、その責任範囲を文書で明確にする。"],"correctIndex":3,"explanations":["× 誤り。責任の共有だけで個人の範囲を定めないと、問題が起きても所在が不明確になる。","× 誤り。事後に責任を決めると、対応の遅れや責任の押し付け合いを招く。","× 誤り。外部委託しても、組織の管理責任は残るため、全てを委託先に移すことはできない。","○ 正しい。システムごとに所有者と管理者を定め、責任範囲を文書化することで、統制の所在が明確になる。"]},{"id":"cisa-45","type":"mc","chapterIndex":1,"stem":"IT戦略の策定に関して、経営層が事前に確認すべき事項として最も適切なものはどれか。","options":["事業目標、事業環境の変化、投資の優先順位、関連するリスク","競合他社の使用するシステムの名称を調べ、それと同じ構成を採用するかどうかを判断する材料とすること。","担当者が好む技術を一覧にして選定すること","前年度に導入したシステム数だけで判断すること"],"correctIndex":0,"explanations":["○ 正しい。事業目標や環境の変化、投資の優先順位とリスクを確認して、IT戦略を策定する。","× 誤り。競合の構成を模倣する判断材料だけでは、自組織の事業目標と合わない恐れがある。","× 誤り。担当者の好みは、組織の戦略を決める根拠として適切ではない。","× 誤り。導入数は過去の実績にすぎず、今後の戦略の判断材料としては不十分である。"]},{"id":"cisa-46","type":"mc","chapterIndex":1,"stem":"ITの統制環境を評価する際に、最も重要な観点として適切なものはどれか。","options":["統制の文書の量を増やし、規程や手順書の件数が多いほど、統制が有効に機能していると判断すること。","IT部門の人数を増やし、人数の多い部門ほど統制の水準が高いと評価して、予算を配分すること。","経営層が統制の重要性を理解し、倫理観と責任の姿勢を示していること。","統制の実施にかかる費用が高いこと。"],"correctIndex":2,"explanations":["× 誤り。文書の量は統制の実効性を示すものではなく、形式的な整備に終わる恐れがある。","× 誤り。人数の多さは、統制が機能していることを保証しない。","○ 正しい。統制環境の中心は、経営層の姿勢と倫理観、統制の重要性の理解である。","× 誤り。費用の高さは統制の質を示すものではなく、評価の観点として適切ではない。"]},{"id":"cisa-47","type":"mc","chapterIndex":3,"stem":"情報セキュリティの事故が発生した際に、経営層が行うべき対応として最も適切なものはどれか。","options":["事故の事実を公表せず、影響が収まるのを待ち、担当者の判断で必要な範囲だけ関係者に伝える。","事故の状況を速やかに把握し、対応体制を指揮して、関係者への報告を適切に行う。","事故の責任を、直ちに現場の担当者に負わせ、原因の究明と再発防止の検討は後回しにする。","事故の対応を、外部の報道機関に任せ、組織としての説明と報告の責任は負わないものとする。"],"correctIndex":1,"explanations":["× 誤り。事実を隠すと、被害の拡大や信頼の失墜を招き、報告義務にも反する恐れがある。","○ 正しい。状況の把握、対応の指揮、関係者への適切な報告が、経営層の対応として求められる。","× 誤り。責任の押し付けは、原因の究明と再発防止を妨げる。","× 誤り。外部の報道機関に任せると、組織として対応する責任を果たせない。"]},{"id":"cisa-48","type":"mc","chapterIndex":1,"stem":"IT部門が業務の品質を管理するための仕組みとして、最も適切なものはどれか。","options":["業務の結果を、担当者の自己申告のみで把握する。","業務の品質は、顧客からの苦情が来たときだけ確認する。","業務の品質は、担当者ごとに独自の基準で評価する。","業務の基準を定め、結果を測定して、差異を分析し改善につなげる。"],"correctIndex":3,"explanations":["× 誤り。自己申告のみでは、客観的な品質の把握ができない。","× 誤り。苦情が来たときだけでは、問題の早期発見と予防ができない。","× 誤り。担当者ごとの基準では、組織としての品質の一貫性が保てない。","○ 正しい。基準を定めて測定し、差異を分析して改善につなげることが品質管理の基本である。"]},{"id":"cisa-49","type":"mc","chapterIndex":1,"stem":"ITガバナンスの枠組みにおいて、経営が業務を監督する際に用いる情報として最も適切なものはどれか。","options":["目標の達成度、リスクの状況、統制の有効性を示す客観的な報告","担当者の個人的な感想を、組織全体の状況として一般化し、その判断を経営の監督に用いる。","職員の出勤記録だけで業務状況を判断すること","取引先からの口コミを根拠にすること"],"correctIndex":0,"explanations":["○ 正しい。目標の達成度、リスクの状況、統制の有効性を示す客観的な報告が監督に用いられる。","× 誤り。個人的な感想は、客観的な監督の根拠として不十分である。","× 誤り。出勤記録だけでは、業務の目標達成やリスク管理の状況を把握できない。","× 誤り。口コミは客観性に欠け、組織の監督情報としては適切ではない。"]},{"id":"cisa-50","type":"mc","chapterIndex":1,"stem":"情報セキュリティ方針の見直しの時期として、最も適切なものはどれか。","options":["方針を策定した後は、見直しを行わず、当初の内容を変えないことを原則として、運用を続けること。","方針の見直しは、事故が起きたときだけ行う。","事業環境、技術、法令、リスクの変化があった際に、定期的かつ必要に応じて見直す。","方針の見直しは、担当者が個人の判断で随時行い、組織の承認や記録は残さず、関係者にも伝えないこと。"],"correctIndex":2,"explanations":["× 誤り。見直しを行わないと、環境の変化に対応できず、方針が形骸化する。","× 誤り。事故のときだけでは、事前の予防的な見直しができない。","○ 正しい。定期的な見直しと、変化があった際の見直しを組み合わせることが適切である。","× 誤り。個人の判断による随時の見直しは、組織としての承認と一貫性を欠く。"]},{"id":"cisa-51","type":"mc","chapterIndex":1,"stem":"IT部門の業務を評価する際に、経営層が注目すべき指標として最も適切なものはどれか。","options":["IT部門の職員が使用する文房具の数を、毎月集計し、そのばらつきを業務の評価の基準として使うこと。","サービスの可用性、障害の発生と復旧の状況、顧客満足度などの成果指標","IT部門の会議の回数を、月ごとに多い順に集計し、その結果を業務の成果として経営に報告すること。","IT部門の社内での認知度を、アンケートで毎年測定し、その高さを成果の指標として評価すること。"],"correctIndex":1,"explanations":["× 誤り。文房具の数は業務の成果と無関係で、評価の指標として適切ではない。","○ 正しい。可用性や障害の復旧、顧客満足度などは、ITが事業に提供する成果を示す指標である。","× 誤り。会議の回数は活動量にすぎず、業務の成果を示す指標ではない。","× 誤り。社内の認知度は、ITの成果や統制の状況を示すものではない。"]},{"id":"cisa-52","type":"mc","chapterIndex":1,"stem":"情報システムに関する経営層の責任として、最も基本的なものはどれか。","options":["技術的な詳細をすべて理解して、担当者に指示すること。","情報システムの導入判断を、ベンダーに一任すること。","情報システムの運用を、現場の判断に任せて関与しないこと。","情報システムが事業目標を支え、リスクが適切に管理されるよう、体制と資源を確保すること。"],"correctIndex":3,"explanations":["× 誤り。経営層が技術の詳細をすべて理解することは求められておらず、現実的でもない。","× 誤り。導入判断を一任すると、事業の目標とリスクを経営が判断できなくなる。","× 誤り。運用に関与しないと、リスク管理と統制の責任を果たせない。","○ 正しい。事業目標の支援とリスク管理のための体制と資源の確保が、経営層の基本的な責任である。"]},{"id":"cisa-53","type":"mc","chapterIndex":1,"stem":"ITの資源配分を決める際に、経営が優先的に考慮すべき事項として最も適切なものはどれか。","options":["事業への貢献度、リスクの大きさ、法令上の要請","要望の多い担当者から決めること","過去の予算消化率だけを基準にすること","ベンダーの営業の強さや、提案の時期の早さを、導入先の判断材料として重視すること。"],"correctIndex":0,"explanations":["○ 正しい。事業への貢献、リスクの大きさ、法令上の要請を踏まえて、資源配分を決めるべきである。","× 誤り。要望の大きさは、事業への貢献やリスクを示すものではない。","× 誤り。予算の消化率は過去の実績であり、資源配分の優先度を示すものではない。","× 誤り。ベンダーの営業力は、資源配分の判断基準として適切ではない。"]},{"id":"cisa-54","type":"mc","chapterIndex":1,"stem":"IT統制の有効性を経営が確認する方法として、最も適切なものはどれか。","options":["統制の運用状況は、問題が起きるまで確認せず、年度末にまとめて一度だけ確認する。","統制の確認は、担当者に任せて報告を求めず、必要と判断したときにだけ個別に確認する。","統制の運用状況について、監査や自己評価の結果を定期的に報告させる。","統制の有効性は、統制の文書の量で判断する。"],"correctIndex":2,"explanations":["× 誤り。問題が起きてから確認するのでは、事前の予防と早期発見ができない。","× 誤り。担当者に任せ報告を求めないと、経営が統制の状況を把握できない。","○ 正しい。監査や自己評価の結果を定期的に報告させることで、統制の運用状況を確認できる。","× 誤り。文書の量は運用の実効性を示さず、有効性の判断には使えない。"]},{"id":"cisa-55","type":"mc","chapterIndex":4,"stem":"情報セキュリティの教育と訓練の目的として最も適切なものはどれか。","options":["従業員に、セキュリティ関連の資格を取得させ、資格の保有者を業務の担当者に優先して配置すること。","従業員が、脅威を認識し、方針と手順に従って行動できるようにすること。","従業員に、システムの開発技術を習得させ、セキュリティの教育時間を減らして実装に充てること。","従業員の人事評価の材料を集め、教育の受講状況を昇給と賞与の判断にだけ用いること。"],"correctIndex":1,"explanations":["× 誤り。資格の取得は手段にすぎず、教育と訓練の目的は行動の定着にある。","○ 正しい。脅威の認識と、方針や手順に従った行動が取れることが、教育と訓練の目的である。","× 誤り。開発技術の習得は、セキュリティ教育の目的ではない。","× 誤り。人事評価の材料を集めることは、教育の目的として適切ではない。"]},{"id":"cisa-56","type":"mc","chapterIndex":3,"stem":"IT部門の業務の継続性を確保するための基本的な考え方として、最も適切なものはどれか。","options":["業務の継続は、災害が発生してから考える。","業務の継続は、特定の担当者の努力のみに依存する。","業務の継続は、安い方法を選ぶだけで対応する。","重要な業務と、その停止が与える影響を特定し、代替手段と復旧の手順を準備する。"],"correctIndex":3,"explanations":["× 誤り。災害の発生後に考えると、重要な業務の停止を防げない。","× 誤り。特定の担当者に依存すると、その人が不在の際に業務が継続できない。","× 誤り。安価な方法のみでは、重要な業務の継続要件を満たせない恐れがある。","○ 正しい。重要な業務と影響を特定し、代替手段と復旧手順を準備することが継続性の基本である。"]},{"id":"cisa-57","type":"mc","chapterIndex":1,"stem":"ITリスクの対応方針の選択肢として、最も適切な説明はどれか。","options":["リスクを受容する、低減する、回避する、移転する、のいずれかを、リスクの大きさに応じて選ぶ。","リスクは必ず回避しなければならず、他の選択肢は認められず、いかなる状況でも同じ方針を適用すること。","リスクは対応せず、発生した場合にのみ対応する。","リスクの対応方針は、担当者が個人の判断で決める。"],"correctIndex":0,"explanations":["○ 正しい。受容・低減・回避・移転のいずれかを、リスクの大きさと組織のリスク選好に応じて選ぶ。","× 誤り。回避は選択肢の一つであり、全てのリスクに必ず適用すべきものではない。","× 誤り。発生後にのみ対応すると、被害の予防と低減の機会を失う。","× 誤り。対応方針は組織として承認すべきもので、担当者の個人判断で決めるべきではない。"]},{"id":"cisa-58","type":"mc","chapterIndex":1,"stem":"IT部門の職員に対する報酬制度の設計において、最も留意すべき点はどれか。","options":["報酬を、短期の成果のみで決め、長期的なリスク管理への貢献や統制の遵守状況は評価の対象とせず、個人の実績だけで配分すること。","報酬を、職位の高さのみで決め、業績や貢献との関係は問わず、役職に応じた額を一律に支払い、評価の見直しは行わないこと。","報酬を、組織の目標とリスク管理への貢献に結び付け、不正や過度なリスク行動を助長しないようにする。","報酬を、業務の量だけで決める。"],"correctIndex":2,"explanations":["× 誤り。短期の成果のみでは、長期的なリスクを無視した行動を促す恐れがある。","× 誤り。職位の高さのみで決めると、業績や貢献との関係が不明確になる。","○ 正しい。組織の目標とリスク管理への貢献に結び付け、不正や過度なリスクの助長を避けることが重要である。","× 誤り。業務量のみで決めると、業務の質や成果が評価されず、統制の目的に反する。"]},{"id":"cisa-59","type":"mc","chapterIndex":1,"stem":"情報システムの監督において、経営が確認すべきことはどれか。","options":["システムの導入後は一度だけ報告を受け、その後の目標達成やリスクの変化は、担当者の判断に任せること。","システムの目標の達成状況、リスクの変化、重大な課題の対応状況を定期的に確認すること。","システムの詳細な技術仕様を、経営層が全て自ら確認し、承認の判断を最終的に一人で行い、担当者の意見は聞かないこと。","システムの運用を、ベンダーの報告のみで判断し、自組織による確認や定期的な評価は一切行わないこと。"],"correctIndex":1,"explanations":["× 誤り。導入後の一度の報告では、その後の目標達成やリスクの変化を把握できない。","○ 正しい。目標の達成状況、リスクの変化、重大な課題への対応を定期的に確認することが監督の要点である。","× 誤り。技術仕様を経営が全て確認することは現実的でなく、監督の本質でもない。","× 誤り。ベンダーの報告のみでは、組織の視点からのリスク評価と監督ができない。"]},{"id":"cisa-60","type":"mc","chapterIndex":1,"stem":"ITガバナンスの成熟度を高める取組みとして、最も適切なものはどれか。","options":["統制の基準を、部門ごとに独自に定めて運用する。","統制の改善は、監査で指摘されたものだけに対応する。","成熟度は、導入したシステムの数で判断する。","統制の基準を全社で統一し、成果を測定して継続的に改善する。"],"correctIndex":3,"explanations":["× 誤り。部門ごとの独自基準では、全社の統制の一貫性と比較可能性が保てない。","× 誤り。指摘されたものだけへの対応では、潜在的な問題の予防と改善が進まない。","× 誤り。導入するシステムの数は、統制の成熟度を示す指標ではない。","○ 正しい。基準を全社で統一し、成果を測定して継続的に改善することが成熟度を高める取組みである。"]},{"id":"cisa-61","type":"mc","chapterIndex":2,"stem":"開発プロジェクトの計画段階を監査する際、監査人が最初に確認すべき事項はどれか。","options":["プロジェクトの目的、範囲、予算、体制について、経営の承認を得ているかを確認する。","開発着手後に、開発担当者の評価を人事部門が毎月行い、その結果を基に報酬を決定する運用を整えているかを確認する。","開発担当者の人数と役割分担を確認する。","開発で使うツールの種類を確認する。"],"correctIndex":0,"explanations":["○ 正しい。計画段階では、目的・範囲・予算・体制について経営の承認を得ているかが最初の確認点になる。","× 誤り。開発着手後の人事評価や報酬は、計画段階で最初に確認する事項ではない。","× 誤り。担当者の人数は計画の一部だが、最初に確認すべき承認事項ではない。","× 誤り。開発ツールの種類は設計の論点であり、計画段階の承認確認を優先すべきである。"]},{"id":"cisa-62","type":"mc","chapterIndex":2,"stem":"利用部門の要件定義を監査する際の評価として、最も適切なものはどれか。","options":["要件の承認記録は開発完了後にまとめて作成し、要件が変わった場合も承認は不要として、担当者の判断で変更を反映させ、変更の履歴は残さない運用を認める。","利用部門が要件を承認した記録があり、承認後の変更が変更管理の手続で統制されているかを確認し、統制が有効に機能していると評価する。","要件の承認は開発者が行い、利用部門への確認は本番移行の直前に一度だけ行えばよいとして、変更の履歴は残さず、利用部門からの変更要望も開発の判断で取り込まない運用を評価する。","要件の変更は担当者の判断で随時行ってよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。要件は利用部門の業務ニーズに基づいて確定させるもので、利用部門の承認が必要である。","○ 正しい。承認の記録と変更統制の両方を確認することで、要件が業務ニーズどおりに確定され、維持されているかを評価できる。","× 誤り。承認は要件を確定させる時点で必要であり、事後にまとめて作成する記録は統制として不十分である。","× 誤り。担当者の判断で要件を随時変更すると、利用部門の意図とずれた開発になり、統制が機能しない。"]},{"id":"cisa-63","type":"mc","chapterIndex":2,"stem":"テストの計画と実施に関する監査人の評価として、最も適切なものはどれか。","options":["テスト結果の確認は開発担当者が自ら行い、テスト計画に要件との対応を示す必要はなく、結果の承認も開発部門の内部で完結させてよいと評価する。","本番稼働後に問題が起きた場合にだけテストを行い、稼働前のテスト計画や結果の承認記録は、監査で確認する必要がないと評価する。","テスト計画に要件との対応が示され、テスト結果が承認された記録があるかを確認し、必要な検証が行われたかを評価する。","テスト項目は過去の開発で使ったものをそのまま再利用し、今回の要件変更に合わせた項目の追加や見直しは行わなくてよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。開発者による自己確認だけでは、独立した検証が行われないため、統制として不十分である。","× 誤り。本番稼働後の不具合対応だけでは、稼働前に欠陥を発見する機会を失うため、統制が機能しない。","○ 正しい。テスト計画と要件の対応、承認された結果を確認することで、必要な検証が行われたかを評価できる。","× 誤り。過去の開発のテスト項目を再利用するだけでは、今回の要件に対する検証が不足するおそれがある。"]},{"id":"cisa-64","type":"mc","chapterIndex":2,"stem":"情報システムの移行（本番稼働への切替）を監査する際の確認事項として、最も適切なものはどれか。","options":["移行の判断基準は担当者が当日決めればよい。","移行データは確認せず本番へ投入する。","移行後の確認は利用者の連絡を待つ。","移行の判断基準、切り戻し手順、移行後の確認結果が承認されているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。事前の計画がなければ、移行の失敗時に切り戻せず、業務への影響が拡大するおそれがある。","× 誤り。移行データを確認せずに本番へ投入すると、データの欠落や誤りがそのまま業務に影響する。","× 誤り。利用者からの連絡を待つだけでは、移行直後の不具合を統制として発見できない。","○ 正しい。判断基準と切り戻し手順を事前に定め、移行後の確認結果を承認することで、移行の統制が機能しているかを確認できる。"]},{"id":"cisa-65","type":"mc","chapterIndex":2,"stem":"導入後レビュー（Post-implementation review）の目的として、最も適切なものはどれか。","options":["導入したシステムが当初の目的と要件を満たしているかを評価し、必要な改善を次の取組に反映すること。","開発の進め方をプロジェクト終了後に評価し、担当者の評価と次期の人員配置を決めるとともに、導入時の承認記録は必要な場合にだけ残す運用を続ける。","導入後にシステムの設計書を廃棄し、運用の負担を軽くすること。","導入の承認を、導入後に初めて行うこと。"],"correctIndex":0,"explanations":["○ 正しい。目的と要件の達成度を評価し、改善を次の取組に反映することが導入後レビューの目的である。","× 誤り。導入後レビューは、システムの目的達成を評価するものであり、担当者個人の評価が主目的ではない。","× 誤り。設計書は保守や監査の証拠として保管すべきもので、廃棄して運用負担を減らすものではない。","× 誤り。導入の承認は導入前に行うべきもので、導入後に初めて行うのでは統制として成立しない。"]},{"id":"cisa-66","type":"mc","chapterIndex":2,"stem":"アジャイル型の開発手法を監査する際の留意点として、最も適切なものはどれか。","options":["反復ごとに承認と記録を残す仕組みが無くても、短期間で成果を出すことを優先し、統制の手続は担当者の裁量で省略してよいと評価する。","反復ごとの成果物と受入れの記録が残り、要件の優先順位付けに利用部門が関与しているかを確認する。","アジャイル型では文書化が不要なので、設計の根拠や判断の経緯を確認しなくても、開発が順調に進んでいれば、反復ごとの記録も担当者の判断で省略してよく、監査として十分と評価する。","開発チームに権限を集中させれば、利用部門の関与は不要であると評価する。"],"correctIndex":1,"explanations":["× 誤り。反復型でも承認と記録は必要であり、短期間であることは統制を省く理由にならない。","○ 正しい。反復ごとの記録と利用部門の関与を確認することで、アジャイル型でも統制が機能しているかを評価できる。","× 誤り。文書化の要否は別にして、設計の根拠を確認しない評価は監査として不十分である。","× 誤り。利用部門の関与を外すと、要件と業務ニーズの乖離を防げず、統制が機能しない。"]},{"id":"cisa-67","type":"mc","chapterIndex":2,"stem":"パッケージソフトウェアを導入する際の監査人の確認事項として、最も適切なものはどれか。","options":["パッケージの標準機能で業務要件を満たせない部分があっても、カスタマイズの承認を後回しにして、導入後に利用部門が個別に対応する運用を認める。","パッケージは製品として完成しているため、業務要件との適合性を導入前に確認する必要はなく、導入後に問題が生じた時点で対応すればよいと評価する。","パッケージの標準機能で業務要件を満たせない部分の扱いを、カスタマイズの承認と併せて確認する。","パッケージのバージョンは導入時の一度の確認で十分であり、以後の更新による機能や統制の変化は確認せず、利用部門の判断に任せ、更新の記録も残さなくてよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。製品が完成していても、自社の業務要件に合うかは別に確認する必要がある。","× 誤り。バージョンの更新によって統制や機能が変わるため、更新の管理も確認すべき事項である。","○ 正しい。標準機能の適合性とカスタマイズの承認を確認することで、導入後の統制と業務要件の適合を評価できる。","× 誤り。カスタマイズを承認なしに行うと、統制の範囲が不明確になり、監査の根拠を失う。"]},{"id":"cisa-68","type":"mc","chapterIndex":2,"stem":"プロジェクト管理の統制として、監査人が重視すべき事項はどれか。","options":["進捗の遅れは担当者が個別に解決し、経営への報告は不要とする。","予算は年度末にまとめて確認すれば十分であると評価する。","プロジェクトのリスクは、完了後に振り返るだけで足りると評価する。","進捗の遅れや予算超過を定期的に把握し、経営へ報告して対応を決める仕組みがあるか。"],"correctIndex":3,"explanations":["× 誤り。個別の解決だけでは、経営が重要な遅れを把握できず、統制として不十分である。","× 誤り。予算を年度末にまとめて確認すると、超過を早期に是正できない。","× 誤り。リスクは完了後に振り返るだけでは、開発中に対応する機会を失うため不十分である。","○ 正しい。遅れや超過を定期的に把握し、経営へ報告して対応を決める仕組みは、プロジェクト管理の中心的な統制である。"]},{"id":"cisa-69","type":"mc","chapterIndex":2,"stem":"要件定義の監査における「要件のトレーサビリティ」の確認として、最も適切なものはどれか。","options":["要件と設計、テスト、受入れの対応関係が追跡できるかを確認する。","要件は文書化されていれば、対応関係を確認する必要はなく、設計やテストが要件どおりでなくても監査上の問題はないと評価する。","要件の数が多いほど品質が高いと評価する。","要件の追跡は完了後に一度だけで足りると評価する。"],"correctIndex":0,"explanations":["○ 正しい。要件と設計、テスト、受入れの対応を追跡できれば、要件が漏れなく実装・検証されたかを評価できる。","× 誤り。文書化だけでは、要件が設計やテストに反映されたかを確かめられない。","× 誤り。要件の数と品質は関係がなく、数が多いことを品質の根拠とするのは誤りである。","× 誤り。開発完了後に一度だけ確認すると、途中で生じた要件の漏れや変更を早期に発見できない。"]},{"id":"cisa-70","type":"mc","chapterIndex":2,"stem":"システム開発におけるプログラムの変更を、本番環境へ移す前に行うべき統制として、最も適切なものはどれか。","options":["開発担当者が本番環境に直接変更を加えられるようにし、作業の速さを優先すること。","開発環境と本番環境を分け、本番移行前に承認を得る手続を設けること。","本番移行の記録は、移行後に担当者が必要と判断したときだけ残し、移行の承認は移行作業の担当者が自ら行ってよいとすること。","テストは本番環境で行い、利用者の報告で修正すること。"],"correctIndex":1,"explanations":["× 誤り。開発者が本番環境へ直接変更できると、承認と検証を経ない変更が行われ、統制が機能しない。","○ 正しい。環境を分けて承認を得てから移行する手続は、本番環境の不正変更や誤りを防ぐ基本的な統制である。","× 誤り。移行の記録を任意とすると、いつ何が変わったかを追跡できず、監査の証拠が残らない。","× 誤り。本番環境でテストを行い、利用者の報告で修正する方法は、業務への影響を拡大させる。"]},{"id":"cisa-71","type":"mc","chapterIndex":2,"stem":"テスト環境に本番の個人情報を用いる場合の監査人の評価として、最も適切なものはどれか。","options":["テスト環境は社内のみで使うので個人情報の保護は不要とし、テストに必要な本番データは制限なく複製して、テスト担当者が自由に持ち出せるようにすると評価する。","テストが終われば個人情報は保存してもよく、保存先や保存期間を定めず、利用が終わった後も担当者の判断で残し続けてよいと評価する。","個人情報の利用目的と管理方法を確認し、必要に応じてマスキングなどの保護措置が講じられているかを評価する。","テスト担当者であれば、個人情報をいつでも持ち出してよく、持ち出し先の管理や記録は担当者の裁量に任せて統制は不要であると評価する。"],"correctIndex":2,"explanations":["× 誤り。社内であっても、テスト環境は漏えいや不正利用のリスクがあり、個人情報の保護が必要である。","× 誤り。テスト後も不要な個人情報を保存し続けると、漏えいのリスクが残り、廃棄の統制が機能しない。","○ 正しい。利用目的と管理方法を確認し、マスキング等の保護措置を評価することが、テスト環境における個人情報の統制の基本である。","× 誤り。担当者であっても、個人情報を無制限に持ち出すことを認めると、情報資産の保護が機能しない。"]},{"id":"cisa-72","type":"mc","chapterIndex":2,"stem":"開発プロジェクトにおける職務分離の監査として、最も適切なものはどれか。","options":["開発者が本番移行の承認も行うことで、作業の効率を高めていると評価する。","少人数なら職務分離は不要と評価する。","本番移行の承認は、利用部門の誰が行ってもよいと評価する。","開発者と本番移行の承認者を分け、一人が開発から本番移行までを行えないようにしているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。開発者が承認まで行うと、自分の作業を自分で確認することになり、統制が機能しない。","× 誤り。小規模なプロジェクトでも、職務分離の必要性は消えず、人数に応じた代替統制を検討すべきである。","× 誤り。承認者を明確にせず誰でもよいとすると、権限の範囲が管理されず、統制として不十分である。","○ 正しい。開発と本番移行の承認を分けることで、不正や誤りを一人で完結させない統制になる。"]},{"id":"cisa-73","type":"mc","chapterIndex":2,"stem":"情報システムの取得において、ベンダーの選定を監査する際の確認事項として、最も適切なものはどれか。","options":["選定の基準と評価結果が文書化され、選定の経緯が承認されているかを確認する。","選定は価格だけで決めてよいと評価し、品質・保守性・セキュリティの比較や、基準の文書化は不要とする。","ベンダーとの契約は、口頭での合意があれば十分であると評価する。","選定後のベンダーの業務報告は、確認しなくてよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。選定基準と評価結果、承認の経緯を確認することで、選定が客観的に行われたかを評価できる。","× 誤り。価格だけで決めると、品質や保守性、セキュリティの観点が抜け、統制が機能しない。","× 誤り。口頭の合意では契約条件が不明確になり、履行や責任の範囲を確認できない。","× 誤り。選定後のベンダーの業務報告を確認しないと、サービスの水準や問題を把握できない。"]},{"id":"cisa-74","type":"mc","chapterIndex":2,"stem":"ソフトウェア開発のソースコードの管理に関する監査人の評価として、最も適切なものはどれか。","options":["ソースコードは開発者の個人のパソコンに保存し、紛失や改ざんのリスクがあっても、担当者が管理していれば組織としての管理は不要であると評価する。","ソースコードの版管理とアクセス制限が行われ、変更の履歴が追跡できるかを確認する。","ソースコードの変更履歴は必要な場合のみ残し、誰がいつ何を変えたかの記録は、開発の進行に支障が出る場合には省略してよいと評価する。","ソースコードはすべての従業員が自由に閲覧し、変更してよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。個人のパソコンに保存すると、紛失や改ざんのリスクがあり、組織の統制として不十分である。","○ 正しい。版管理、アクセス制限、変更履歴の追跡があれば、コードの不正な変更や誤りを検出できる。","× 誤り。変更履歴を任意とすると、誰がいつ何を変えたかを追跡できず、監査の証拠が残らない。","× 誤り。全従業員が自由に変更できると、権限の範囲が管理されず、不正や誤りを防げない。"]},{"id":"cisa-75","type":"mc","chapterIndex":2,"stem":"テストの結果、重大な不具合が未解決のまま本番移行されようとしている場合の監査人の対応として、最も適切なものはどれか。","options":["不具合は本番稼働後に修正すればよいため、移行の前に影響の内容や対応計画を確認する必要はなく、報告も不要であると判断する。","移行を止める権限が監査人にあるため、影響の大きさを確認せずに、自ら移行を中止させ、経営への報告は後日まとめて行う。","重大な不具合の内容、影響、対応の計画を確認し、移行の可否について経営の判断を求めるよう報告する。","影響は小さいと推測し、重大な不具合の内容や対応計画を確認せずに監査を終え、結論は担当者の説明だけで足りると評価する。"],"correctIndex":2,"explanations":["× 誤り。重大な不具合を未解決のまま本番へ移すと、業務への影響が大きく、報告しないのは監査人の役割に反する。","× 誤り。監査人は独立した立場で助言・報告する役割であり、移行を中止させる権限を持つわけではない。","○ 正しい。監査人は事実を確認して報告し、移行の判断は経営が行う。影響と対応計画を示すことが適切な対応である。","× 誤り。影響を推測して確認を省くと、監査の根拠を欠き、結論の信頼性を損なう。"]},{"id":"cisa-76","type":"mc","chapterIndex":2,"stem":"開発段階で作成された設計書の監査における確認事項として、最も適切なものはどれか。","options":["設計書は開発が終わればすぐに廃棄してよいと評価する。","設計書は担当者の記憶で補えるため作成しなくてよい。","設計書は実装後に必要なときだけ更新すればよい。","設計書が承認され、版管理されて、実装の内容と一致しているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。設計書は保守や監査の証拠として必要であり、開発直後に廃棄するのは適切でない。","× 誤り。担当者の記憶に頼ると、担当者が変わった際に仕様が分からなくなり、保守が困難になる。","× 誤り。実装との乖離を放置すると、設計書が実態を表さず、監査の根拠として使えなくなる。","○ 正しい。承認、版管理、実装との一致を確認することで、設計書が統制の根拠として機能しているかを評価できる。"]},{"id":"cisa-77","type":"mc","chapterIndex":2,"stem":"システムの導入に伴う業務プロセスの変更を監査する際の確認事項として、最も適切なものはどれか。","options":["業務プロセスの変更に対応する内部統制が見直され、導入後も統制が機能しているかを確認する。","業務プロセスの変更はシステムの導入とは関係がないと判断し、統制を見直すと業務の効率が下がるため、導入後も従来どおりの統制で足りると評価する。","業務プロセスの変更は、利用者が慣れるまで統制を一時的に止めてよいと評価する。","業務プロセスの変更は、監査の対象外であると評価する。"],"correctIndex":0,"explanations":["○ 正しい。業務プロセスが変われば統制も変わるため、見直しと導入後の有効性の確認が必要になる。","× 誤り。システムの導入によって業務プロセスは変わるため、統制の見直しは必要である。","× 誤り。統制を一時的に止めると、その期間の取引が統制なしで処理され、重大な不備につながる。","× 誤り。業務プロセスの変更は、内部統制の有効性に直接影響するため、監査の対象である。"]},{"id":"cisa-78","type":"mc","chapterIndex":2,"stem":"開発した情報システムの受入れテストに関する監査人の評価として、最も適切なものはどれか。","options":["開発者だけで受入れテストを行えば、利用部門の確認は不要であり、業務要件との適合性は開発の完了時点で当然に確認されていると評価する。","利用部門が受入れテストを行い、合否の基準と結果を承認しているかを確認する。","受入れテストは本番稼働後に行えば十分であると評価する。","受入れテストの合否基準は、テストの途中で都合に合わせて柔軟に変えてよく、結果が出た後に利用部門が基準を確認すればよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。開発者だけのテストでは、利用部門の業務要件との適合性を確認できない。","○ 正しい。利用部門が合否基準を定めて受入れテストを行い、結果を承認することで、業務要件を満たしているかを確認できる。","× 誤り。本番稼働後の受入れは、問題が業務に影響した後になるため、統制として不十分である。","× 誤り。合否基準を途中で変えると、テストの客観性が失われ、結果の信頼性を損なう。"]},{"id":"cisa-79","type":"mc","chapterIndex":2,"stem":"システム開発における「ドキュメントの整備」に関する監査人の評価として、最も適切なものはどれか。","options":["設計書は開発が終わればすぐに廃棄してよく、保守や監査の証拠として保管する必要はなく、必要が生じた場合は担当者の記憶で補えると評価する。","設計書の作成は効率を下げるため省略し、仕様は担当者の記憶と口頭の引き継ぎで補えるので、担当者が交代しても問題は生じないと評価する。","開発の各段階で必要な文書が作成され、保管と更新の責任者が定められているかを確認する。","設計書は実装後に担当者が必要なときだけ更新すればよく、実装との乖離が生じても、監査の時点で実態に合わせて記述を直せばよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。完成後にまとめて作成すると、開発中の判断の経緯が残らず、正確性も失われる。","× 誤り。文書を省略すると、仕様や判断の根拠を後から確認できず、保守と監査が困難になる。","○ 正しい。開発の各段階の文書と、その保管・更新の責任者を定めることで、文書が統制の証拠として機能する。","× 誤り。保管責任者が不明確だと、必要な文書を見つけられず、更新も行われない。"]},{"id":"cisa-80","type":"mc","chapterIndex":2,"stem":"開発中のシステムに対する監査人の関与の時期として、最も適切なものはどれか。","options":["開発が完了し、本番稼働した後にだけ関与するのが効果的である。","開発中は監査人が関与すると作業を妨げるため、関与しない方がよい。","開発の結果だけを確認し、途中の段階は対象にしない。","開発の企画段階から関与し、重要な判断の時点で統制を評価するのが効果的である。"],"correctIndex":3,"explanations":["× 誤り。稼働後だけの関与では、開発中に作られた統制の欠陥を早期に是正できない。","× 誤り。監査人の独立性を保ちつつ関与すれば、作業を妨げずに統制を評価できる。","× 誤り。途中の段階を対象にしないと、判断の経緯が残らず、結果だけでは統制の有効性を評価できない。","○ 正しい。企画から関与すると、重要な判断の時点で統制を評価でき、問題を早期に是正できる。"]},{"id":"cisa-81","type":"mc","chapterIndex":2,"stem":"プロジェクトの予算管理に関する監査人の評価として、最も適切なものはどれか。","options":["予算と実績の差異を定期的に比較し、差異の原因と対応を経営が承認しているかを確認する。","予算と実績の差異は、計画時に一度だけ決めた予算を基準に、差異の原因や対応の承認を求めず、年度末にまとめて説明すれば十分であると評価する。","予算の超過は、担当者の判断で吸収してよいと評価する。","予算の差異は、プロジェクト完了後にまとめて説明すればよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。差異を定期的に比較し、原因と対応を経営が承認することで、予算超過を早期に統制できる。","× 誤り。実績との比較をしないと、予算超過に気づけず、是正の機会を失う。","× 誤り。担当者の判断で超過を吸収すると、経営が財務上の影響を把握できず、統制が機能しない。","× 誤り。差異の説明が完了後になると、途中で必要な対応を取れず、判断の機会を失う。"]},{"id":"cisa-82","type":"mc","chapterIndex":2,"stem":"情報システムの開発を外部委託する場合の監査人の確認事項として、最も適切なものはどれか。","options":["外部委託は社内の開発より安全であるとの前提に立ち、委託先の成果物の品質やセキュリティ要件を契約で定めず、確認も検収も行わなくてよいと評価する。","委託先の成果物の品質、セキュリティ要件、検収の基準が契約に定められ、委託先を監督しているかを確認する。","委託先の成果物は検収を行わなくても受け入れてよく、品質や要件の不足が後で見つかった場合も、そのまま運用に載せてよいと評価する。","委託契約は、開発完了後に締結すれば足りると評価する。"],"correctIndex":1,"explanations":["× 誤り。外部委託は社内と異なるリスクがあり、安全であるとの前提で確認を省くのは誤りである。","○ 正しい。品質、セキュリティ、検収の基準を契約で定め、委託先を監督することが外部委託の統制の基本である。","× 誤り。検収を行わずに成果物を受け入れると、品質や要件の不足を見逃すおそれがある。","× 誤り。契約を完了後に締結すると、作業中の責任や要件の範囲が不明確なまま進むことになる。"]},{"id":"cisa-83","type":"mc","chapterIndex":2,"stem":"システム開発の品質を確保するため、レビューを実施する目的として、最も適切なものはどれか。","options":["レビューの結果を開発担当者の評価に使い、人事の判断材料とするとともに、指摘が多かった担当者の配置を見直して、レビュー自体は形式的に行うこと。","レビューは形式的に行い、設計やプログラムの誤りの確認よりも開発の期限を守ることを最優先し、指摘の件数は問題にしないこと。","設計やプログラムの誤りを早期に発見し、後工程での手戻りを減らすこと。","レビューの指摘は、担当者が自由に採否を決めてよいとし、採用しなかった指摘の理由は記録せず、重要な誤りであっても開発者の判断に委ねること。"],"correctIndex":2,"explanations":["× 誤り。レビューの結果を人事評価に使うと、指摘を避ける動きが生じ、品質の確保という目的が損なわれる。","× 誤り。形式的なレビューでは誤りを発見できず、期限を優先すると品質が低下する。","○ 正しい。レビューは誤りを早期に発見し、後工程での手戻りを減らすことが主な目的である。","× 誤り。指摘の採否を担当者の自由に任せると、重要な誤りが残るおそれがあり、統制が機能しない。"]},{"id":"cisa-84","type":"mc","chapterIndex":2,"stem":"ソフトウェアの変更に伴う影響範囲の分析に関する監査人の評価として、最も適切なものはどれか。","options":["変更は一つのプログラムに限られるため、影響範囲の分析は不要であると評価する。","影響範囲はユーザーからの苦情が出てから確認すればよいと評価する。","影響範囲の分析は、変更の承認後に行えば十分であると評価する。","変更の影響範囲を分析し、関連するシステムや業務への影響をテストで確認しているかを評価する。"],"correctIndex":3,"explanations":["× 誤り。一つのプログラムの変更でも、他のシステムや業務に影響するおそれがあり、分析は必要である。","× 誤り。苦情が出てからでは、不具合が業務に影響した後になり、統制として不十分である。","× 誤り。承認後に分析すると、承認の判断に影響範囲の情報が反映されず、承認の意味を失う。","○ 正しい。影響範囲を分析し、関連する業務への影響をテストで確認することで、変更による予期しない不具合を防げる。"]},{"id":"cisa-85","type":"mc","chapterIndex":2,"stem":"新しい情報システムを導入する際、移行データの正確性を確認する方法として、最も適切なものはどれか。","options":["移行前後のデータ件数や合計値を照合し、差異の原因を確認して承認する。","移行元が正しいとして照合は行わない。","移行データの確認は、利用者が問題に気づいた場合にだけ行う。","移行データは、移行後に一部だけ確認すれば十分であり、残りのデータは利用者が業務で使い始めてから問題が出た場合に個別に対応すればよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。件数や合計値の照合で差異を把握し、原因を確認して承認することが、移行データの正確性を確保する方法である。","× 誤り。移行元が正しいとの想定だけでは、移行時の変換誤りや欠落を発見できない。","× 誤り。利用者の気づきを待つだけでは、業務に影響が出てからの発見になり、統制として不十分である。","× 誤り。一部の確認では、残りの移行データの誤りや欠落を見逃すおそれがある。"]},{"id":"cisa-86","type":"mc","chapterIndex":2,"stem":"システム開発における「経営者の関与」の監査として、最も適切なものはどれか。","options":["開発の判断は担当部門に任せ、重要な投資やリスクの判断も含めて経営者の関与は不要であり、結果の報告を年度末にまとめて受ければ足りると評価する。","重要な開発の判断について、経営者が承認に関与し、その記録が残っているかを確認する。","経営者は結果の報告だけを受ければよく、開発の途中で生じた重大な問題や計画の変更は、担当部門が判断して事後に報告すればよいと評価する。","経営者の承認は、必要な場合を除き行わないと評価する。"],"correctIndex":1,"explanations":["× 誤り。担当部門だけでは、重要な投資やリスクの判断が組織全体の方針と整合しないおそれがある。","○ 正しい。重要な判断に経営者が関与し、記録が残ることで、開発の方向性と統制の責任が明確になる。","× 誤り。途中の判断に関与しないと、重要な問題を早期に把握できず、是正の機会を失う。","× 誤り。承認を省くと、経営者の責任が不明確になり、重要な判断の統制が機能しない。"]},{"id":"cisa-87","type":"mc","chapterIndex":2,"stem":"開発プロジェクトにおけるリスク評価の監査として、最も適切なものはどれか。","options":["プロジェクトのリスクは、実際に発生してから対応すればよく、事前の識別や影響の評価、対応策の経営への報告は、開発の遅れを招くため不要であると評価する。","リスクは担当者の経験と勘に頼り、識別や評価の結果を文書化せず、対応策も個人の判断で決めてよく、経営への報告も必要ないと評価する。","プロジェクトのリスクを識別し、影響と発生可能性を評価して、対応策が経営に報告されているかを確認する。","リスク評価は、プロジェクトの初期段階で一度行えば十分であり、開発の途中で仕様や体制が変わっても、見直しは行わなくてよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。発生後に対応すると、被害が拡大した後になり、事前の統制としての意味を失う。","× 誤り。担当者の経験だけに頼ると、評価が属人的になり、組織として共有できない。","○ 正しい。リスクの識別、影響と発生可能性の評価、対応策の経営への報告が、プロジェクトのリスク管理の基本である。","× 誤り。リスクは開発の進行とともに変化するため、初期段階だけの評価では不十分である。"]},{"id":"cisa-88","type":"mc","chapterIndex":2,"stem":"開発したシステムの本番移行の承認について、監査人が確認すべき事項として、最も適切なものはどれか。","options":["テスト結果は確認せず、開発者の判断だけで承認してよいと評価する。","承認は移行後にまとめて行えばよいと評価する。","承認者は、移行作業を行う担当者が兼務してもよいと評価する。","テストの結果、未解決の不具合、切り戻しの計画を確認したうえで、権限を持つ者が承認しているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。テスト結果を確認しないまま承認すると、重大な不具合を含んだまま本番へ移すおそれがある。","× 誤り。移行後にまとめて承認すると、移行の可否の判断が行われず、統制として成立しない。","× 誤り。移行作業者が承認を兼ねると、職務分離が機能せず、誤りや不正を一人で完結させるおそれがある。","○ 正しい。テスト結果、未解決の不具合、切り戻し計画を確認したうえで、権限を持つ者が承認することが移行承認の要点である。"]},{"id":"cisa-89","type":"mc","chapterIndex":2,"stem":"開発段階における「検収」の監査として、最も適切なものはどれか。","options":["成果物が要件と契約の基準を満たしていることを、利用部門が確認して検収の記録を残しているかを確認する。","検収は開発者が自ら行えば十分であると評価する。","検収の記録は、必要な場合にだけ残せばよいと評価する。","成果物の不具合は、検収後に利用者が見つけてから対応すればよく、検収の段階で要件や契約の基準との照合や、テストの記録の確認を行う必要はないと評価する。"],"correctIndex":0,"explanations":["○ 正しい。利用部門が要件と契約の基準を確認し、検収の記録を残すことで、成果物の受入れの根拠が残る。","× 誤り。開発者だけの検収では、要件と契約の基準を満たしているかを独立に確認できない。","× 誤り。検収の記録を任意とすると、受入れの根拠を後から確認できず、監査の証拠が残らない。","× 誤り。検収後に不具合を利用者が見つける方法では、業務に影響が出た後の対応になる。"]},{"id":"cisa-90","type":"mc","chapterIndex":2,"stem":"開発中の仕様変更に関する監査人の評価として、最も適切なものはどれか。","options":["仕様変更は担当者の判断で行ってよく、変更の理由や影響の記録は残さず、スケジュールや予算への影響も確認しなくてよいと評価する。","仕様変更の理由、影響、承認が文書化され、スケジュールと予算への影響が把握されているかを確認する。","仕様変更は、開発の完了後にまとめて承認すればよく、途中で生じた影響はその時点の判断に含めず、完成後に影響範囲を一括して評価すればよいと評価する。","仕様変更は、利用者の要望に応じて何度でも自由に行ってよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。担当者の判断だけで変更すると、変更の根拠と影響が残らず、統制として不十分である。","○ 正しい。変更の理由、影響、承認を文書化し、スケジュールと予算への影響を把握することで、変更の統制が機能する。","× 誤り。完了後にまとめて承認すると、変更の影響を開発中に判断できず、手戻りが大きくなる。","× 誤り。利用者の要望に応じて自由に変更すると、スケジュールと品質が管理できず、プロジェクトが統制を失う。"]},{"id":"cisa-91","type":"mc","chapterIndex":3,"stem":"IT運用の監査において、ジョブの実行結果を確認する目的として、最も適切なものはどれか。","options":["ジョブの実行時間を短くして、処理の待ち時間とコストを削減し、実行結果の確認は必要な場合にだけ行うようにするため。","ジョブの実行結果を開発担当者の個人評価と報酬の決定に使い、処理の遅れや誤りを担当者ごとに比較して人事の判断材料とするため。","ジョブが計画どおりに実行され、エラーが適切に処理・記録されているかを確認するため。","ジョブの実行記録は必要な場合だけ残し、エラーの発生や対応の経緯は担当者の記憶で補えるようにして、記録の保存量を減らし、監査で確認する必要も生じないようにするため。"],"correctIndex":2,"explanations":["× 誤り。実行時間の短縮は運用の改善であり、実行結果の確認の目的ではない。","× 誤り。実行結果を人事評価に使うことは、監査の目的として適切でない。","○ 正しい。実行の結果とエラー処理の記録を確認することで、業務処理が計画どおりに行われたかを評価できる。","× 誤り。記録を必要な場合だけ残すと、エラーの発生や対応を後から追跡できない。"]},{"id":"cisa-92","type":"mc","chapterIndex":3,"stem":"システムの運用管理に関する監査で、オペレーターの作業を統制する方法として、最も適切なものはどれか。","options":["オペレーターの作業は担当者の判断で自由に行わせると評価する。","作業記録は、オペレーターの自己申告のみで足りると評価する。","作業の承認は、作業の完了後に担当者がまとめて行えばよいと評価する。","作業の依頼、承認、実施、結果の確認が分離され、作業記録が残っているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。担当者の判断で自由に作業させると、作業の正当性を確認できず、統制が機能しない。","× 誤り。自己申告だけでは記録の客観性が保てず、監査の証拠として不十分である。","× 誤り。作業の承認を完了後にまとめて行うと、事前の統制としての意味を失う。","○ 正しい。依頼、承認、実施、確認を分離し記録を残すことで、オペレーターの作業の不正や誤りを防げる。"]},{"id":"cisa-93","type":"mc","chapterIndex":3,"stem":"変更管理の監査において、緊急変更の扱いとして、監査人が確認すべき事項はどれか。","options":["緊急変更の基準と手続が定められ、事後に承認と記録が行われているかを確認する。","緊急変更は、事後の承認も不要であるため、記録を残す必要がないとし、通常の変更より統制を緩くして、担当者が個人の判断で行ってよいと評価する。","緊急変更は通常の変更より統制を緩くしてよいと評価する。","緊急変更は担当者が個人で判断してよい。"],"correctIndex":0,"explanations":["○ 正しい。緊急変更の基準と手続を定め、事後に承認と記録を行うことで、迅速性と統制を両立させられる。","× 誤り。事後の承認も記録もないと、誰がいつ何を変更したかを追跡できず、統制が機能しない。","× 誤り。緊急変更を通常より緩くすると、不正や誤りの入り口になり、統制として不十分である。","× 誤り。個人の判断だけで行うと、変更の正当性と影響を組織として確認できない。"]},{"id":"cisa-94","type":"mc","chapterIndex":3,"stem":"構成管理の監査において、ハードウェアとソフトウェアの資産台帳を確認する目的として、最も適切なものはどれか。","options":["資産台帳は、会計上の帳簿としてのみ使うため。","資産の所在と状態を把握し、未承認の機器やソフトウェアの利用を検出するため。","資産台帳は、古くなったものを確認せずに残し、実態と合わなくなっても、利用者の判断で必要な項目だけを参照できるようにするため。","資産台帳は、利用者が自由に編集できるようにし、承認や変更の記録を残さずに、各部門が必要に応じて内容を書き換えられるようにするため。"],"correctIndex":1,"explanations":["× 誤り。資産台帳の目的は会計だけではなく、セキュリティと構成の統制にも使う。","○ 正しい。資産の所在と状態を把握することで、未承認の機器やソフトウェアの利用を検出し、構成の統制が機能する。","× 誤り。古い情報を残すと、実態と台帳が乖離し、構成管理の統制が機能しない。","× 誤り。利用者が自由に編集できると、台帳の正確性が保てず、監査の根拠として使えない。"]},{"id":"cisa-95","type":"mc","chapterIndex":3,"stem":"ITサービスの提供に関するサービスレベル管理の監査として、最も適切なものはどれか。","options":["サービスレベルは、利用者の要望に応じて都度変えてよく、変更の理由や承認の記録は残さず、目標が定まらなくても運用上の支障はないと評価する。","実績は、問題が起きた場合にだけ測定すればよく、平常時の傾向や目標との差は把握しなくても、サービスの水準は管理できると評価する。","サービスの目標水準が定められ、実績が定期的に測定・報告され、未達時の対応が決まっているかを確認する。","サービスレベルは目標を定めずに、運用の担当者がその時々の状況で判断すればよく、報告や未達時の対応の取り決めも必要ないと評価する。"],"correctIndex":2,"explanations":["× 誤り。都度変更すると、目標が定まらず、サービスの品質を評価できない。","× 誤り。問題が起きた場合だけ測定すると、平常時の傾向を把握できず、事前の改善ができない。","○ 正しい。目標水準、実績の測定と報告、未達時の対応を確認することが、サービスレベル管理の基本的な統制である。","× 誤り。目標がないと、担当者ごとに判断が異なり、サービスの水準を組織として統制できない。"]},{"id":"cisa-96","type":"mc","chapterIndex":3,"stem":"事業継続計画（BCP）の監査において、監査人が確認すべき事項として、最も適切なものはどれか。","options":["BCPは策定しただけで十分であり、訓練や見直しは不要であると評価する。","重要業務の影響度は、業務担当者の感覚で決めてよいと評価する。","BCPの対象は、災害時のみに限定すればよいと評価する。","重要業務の影響度を分析し、復旧目標と対応手順が定められ、定期的に訓練・見直しが行われているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。策定しただけでは、実際の障害時に手順が機能するかを確認できず、統制として不十分である。","× 誤り。影響度を感覚で決めると、重要業務の優先順位が不適切になり、復旧計画の根拠を失う。","× 誤り。対象を災害時に限ると、システム障害や運用上の事故への備えが欠けてしまう。","○ 正しい。影響度分析と復旧目標を定め、訓練と見直しを行うことで、BCPが実際に機能するかを評価できる。"]},{"id":"cisa-97","type":"mc","chapterIndex":3,"stem":"災害復旧計画（DRP）において、目標復旧時間（RTO）の意味として、最も適切なものはどれか。","options":["障害発生から業務を復旧させるまでに許容される時間の目標。","業務で扱うデータの保存期間を定める期間。","バックアップの作成頻度を定める時間間隔で、データの取得の間隔を示すもの。","原因の特定にかかる時間の目標。"],"correctIndex":0,"explanations":["○ 正しい。RTOは障害発生から業務を復旧させるまでに許容される時間の目標で、復旧計画の中心的な指標である。","× 誤り。データの保存期間は別の規程で定めるもので、RTOの意味とは異なる。","× 誤り。バックアップの作成頻度は、RPO（目標復旧時点）と関係する指標であり、RTOとは異なる。","× 誤り。原因の特定にかかる時間は、復旧の過程の一部であり、RTOの定義そのものではない。"]},{"id":"cisa-98","type":"mc","chapterIndex":3,"stem":"バックアップの監査において、バックアップからの復元テストを行う目的として、最も適切なものはどれか。","options":["復元テストは、バックアップの容量を減らすため。","バックアップが実際に復元でき、業務に必要なデータが回復できるかを確認するため。","復元テストは、バックアップを行う担当者の作業量を増やし、復元の手順を担当者ごとに異なる方法で試すことで、作業の経験を積ませるためである。","復元テストは、バックアップの取得が成功したことを示す記録を作るだけのためであり、復元の可否は取得の記録が残っていれば確認したとみなしてよい。"],"correctIndex":1,"explanations":["× 誤り。復元テストの目的は容量の削減ではなく、復元の可否を確認することである。","○ 正しい。復元テストにより、バックアップが実際に使えるかを確かめられる。取得の成功だけでは復元の可否はわからない。","× 誤り。作業量を増やすことは目的ではなく、確認の結果として必要な作業が生じるものである。","× 誤り。取得の成功記録だけでは、データが実際に復元できるかは確認できない。"]},{"id":"cisa-99","type":"mc","chapterIndex":3,"stem":"インシデント管理の監査として、インシデントの記録と分析に関する確認事項はどれか。","options":["インシデントは対応が終わればすぐに記録を削除してよく、原因や再発防止策を文書に残す必要はなく、次回以降も担当者の記憶に頼ればよいと評価する。","インシデントの原因分析は、担当者が必要と思う場合にだけ行い、同じ問題が繰り返し起きても、個別の対応で足りるとして改善の検討は省略してよいと評価する。","インシデントの内容、原因、対応、再発防止策が記録され、経営に報告されているかを確認する。","インシデントの報告は、被害が大きいものだけに限り、小さな事象は担当者の判断で処理して経営へは報告しなくてよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。記録を削除すると、過去の傾向や再発の有無を分析できず、統制が機能しない。","× 誤り。原因分析を任意とすると、同じ問題が繰り返し発生するおそれがある。","○ 正しい。内容、原因、対応、再発防止策の記録と経営への報告が、インシデント管理の統制の要点である。","× 誤り。報告を被害の大きいものに限ると、小さな兆候を見逃し、重大な事態の予兆を捉えられない。"]},{"id":"cisa-100","type":"mc","chapterIndex":3,"stem":"情報システムの監視（モニタリング）に関する監査人の評価として、最も適切なものはどれか。","options":["監視は、システムが停止した後にだけ行えば十分であると評価する。","アラートは、担当者が必要と判断したものだけに対応すればよいと評価する。","監視の記録は、重要な障害が起きた場合にだけ残せばよいと評価する。","重要なシステムの稼働状況とアラートを監視し、異常に対する対応が記録されているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。停止後だけの監視では、障害の兆候を捉えられず、業務への影響を拡大させる。","× 誤り。アラートの対応を担当者の判断に任せると、重要な異常を見逃すおそれがある。","× 誤り。監視の記録を限定すると、異常の傾向や対応の経緯を後から確認できない。","○ 正しい。稼働状況とアラートを監視し、異常への対応を記録することで、障害を早期に検知し対応できる。"]},{"id":"cisa-101","type":"mc","chapterIndex":3,"stem":"ITサービスの委託先を監査する際の確認事項として、最も適切なものはどれか。","options":["委託先のサービス水準、セキュリティ、障害時の対応が契約に定められ、定期的に報告を受けているかを確認する。","委託先は信頼できる企業であるため、契約の内容や障害時の対応を確認する必要はなく、報告は年に一度の確認で十分であり、委託先の作業は組織側で確認せずに任せてよいと評価する。","委託先の報告は、問題が起きた場合にだけ受ければよいと評価する。","委託先の作業は、組織側で確認せずに任せてよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。サービス水準、セキュリティ、障害対応を契約で定め、定期的な報告を受けることが委託先の監督の基本である。","× 誤り。信頼性の評価だけでは、契約上の責任範囲や水準を確認できず、統制として不十分である。","× 誤り。問題が起きたときだけ報告を受けると、平常時の状況を把握できず、事前の是正ができない。","× 誤り。組織側で確認せずに任せると、委託先の作業の品質と安全性を統制できない。"]},{"id":"cisa-102","type":"mc","chapterIndex":3,"stem":"変更管理における「テスト環境と本番環境の分離」の目的として、最も適切なものはどれか。","options":["テスト環境と本番環境を同じにして、テストの手間を省き、本番のデータを直接使えるようにすることで、テストの結果をそのまま本番の判断に使うため。","テストが本番のデータやサービスに影響を与えないようにし、変更の誤りを本番に持ち込まないため。","本番環境で直接テストを行い、開発の期間を短くし、不具合が見つかった場合は利用者の報告を待って修正することで、作業の効率を高めるため。","テスト環境は、監査の対象から外すため。"],"correctIndex":1,"explanations":["× 誤り。環境を同じにすると、テストが本番に影響し、障害や情報漏えいのおそれがある。","○ 正しい。環境を分けることで、テストが本番に影響せず、変更の誤りを本番に持ち込まない統制になる。","× 誤り。本番環境で直接テストを行うと、不具合が業務に直接影響し、統制として不適切である。","× 誤り。テスト環境も変更統制の一部であり、監査の対象から外すことはできない。"]},{"id":"cisa-103","type":"mc","chapterIndex":3,"stem":"パッチ管理の監査として、監査人が確認すべき事項はどれか。","options":["パッチは、適用すると障害が起きるおそれがあるため、すべて適用せず、既知の脆弱性が残っても、通常の運用で問題が起きなければ対応は不要であると評価する。","パッチは、担当者が思いついたときに適用すればよく、適用の計画や承認、適用後の確認は、作業が遅れる場合には省略してよいと評価する。","パッチの適用の要否が評価され、適用の計画と承認、適用後の確認が記録されているかを確認する。","パッチの適用記録は、必要な場合にだけ残せばよく、どのシステムにどのパッチが適用されたかを一覧にする作業は、運用の負担を理由に省略し、担当者が個別に把握していればよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。すべてを適用しないと、既知の脆弱性が残り、セキュリティ上のリスクが高まる。","× 誤り。思いついたときに適用すると、計画と承認を経ない変更が行われ、統制が機能しない。","○ 正しい。適用の要否の評価、計画と承認、適用後の確認を記録することで、パッチ管理の統制が機能する。","× 誤り。適用記録を限定すると、どのシステムにどのパッチが適用されたかを確認できない。"]},{"id":"cisa-104","type":"mc","chapterIndex":3,"stem":"システムの容量管理に関する監査人の評価として、最も適切なものはどれか。","options":["容量は現在の利用量だけで決めればよく、将来の需要は考慮しないと評価する。","容量の不足は、障害が起きてから増強すればよいと評価する。","容量の確認は、担当者が気づいた場合にだけ行えばよいと評価する。","利用量の傾向を把握し、将来の需要に備えた容量計画が立てられ、閾値を超えた場合の対応が定められているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。現在の利用量だけで決めると、利用の増加に対応できず、将来の障害を招く。","× 誤り。障害が起きてから増強すると、業務の停止を招き、統制として不適切である。","× 誤り。担当者の気づきだけに頼ると、容量の逼迫を組織として把握できない。","○ 正しい。利用量の傾向、将来の需要、閾値を超えた場合の対応を定めることで、容量不足による障害を防げる。"]},{"id":"cisa-105","type":"mc","chapterIndex":3,"stem":"業務の継続性を確保するための代替処理手段の監査として、最も適切なものはどれか。","options":["代替手段の手順が定められ、定期的に訓練され、実際に業務が継続できるかを確認する。","代替手段は、計画を作成するだけで実際の訓練は不要であり、障害が起きた際に担当者が手順を考えればよく、事前の確認や見直しも省略してよいと評価する。","代替手段は、障害が起きた後に考えればよいと評価する。","代替手段の対象は、重要でない業務にのみ限定すればよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。代替手段の手順を定め、訓練によって実際に業務が継続できるかを確かめることが、継続性の確保の要点である。","× 誤り。計画だけでは、実際の障害時に手順が機能するかを確認できず、統制として不十分である。","× 誤り。障害が起きた後に考えると、業務の停止が長引き、影響が大きくなる。","× 誤り。重要な業務に代替手段がないと、障害時に最も影響の大きい業務が止まってしまう。"]},{"id":"cisa-106","type":"mc","chapterIndex":4,"stem":"アクセス権限の定期的な見直しに関する運用の監査として、最も適切なものはどれか。","options":["アクセス権限は一度付与すれば、見直しは不要であると評価する。","利用者の異動や退職に応じてアクセス権限が見直され、見直しの結果が承認・記録されているかを確認する。","退職者のアクセス権限は、本人が申告するまで削除しなくてよく、退職の事実を人事部門から情報システム部門へ連絡する仕組みも不要であり、申告がないまま残っても問題は生じないと評価する。","アクセス権限の見直しは、担当者の判断で個別に行えばよく、見直しの基準や結果の承認、記録は、業務の効率を優先して省略してよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。一度付与したままでは、役割の変化に伴う不要な権限が残り、不正のリスクが高まる。","○ 正しい。異動や退職に応じた見直しと承認・記録があることで、不要な権限の残存を防げる。","× 誤り。退職者の権限を本人の申告に頼ると、申告漏れによって不正利用のリスクが残る。","× 誤り。個別の判断に任せると、見直しの基準と結果が組織として統一されず、統制が機能しない。"]},{"id":"cisa-107","type":"mc","chapterIndex":3,"stem":"システムの障害対応において、監査人が確認すべき事項として、最も適切なものはどれか。","options":["障害は復旧すれば十分であり、原因の分析や再発防止策の検討は、担当者の負担を考えて省略してよく、経営への報告も不要であると評価する。","障害の記録は、重大な障害の場合にだけ残せばよく、小さな障害の対応内容や時刻は、担当者の判断で残さなくてもよいと評価する。","障害の発生から復旧までの対応が記録され、原因分析と再発防止策が経営に報告されているかを確認する。","障害への対応は担当者の判断で自由に行ってよく、対応の手順や記録を統一する必要はなく、復旧の早さだけを評価の基準とすればよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。原因の分析をしないと、同じ障害が再び起き、統制として不十分である。","× 誤り。重大な障害だけを記録すると、小さな障害の傾向を把握できず、重大事態の予兆を見逃す。","○ 正しい。対応の記録、原因分析、再発防止策の経営への報告があることで、障害が再び起きない統制が機能する。","× 誤り。対応を担当者の判断に任せると、対応の手順と記録が統一されず、統制が機能しない。"]},{"id":"cisa-108","type":"mc","chapterIndex":3,"stem":"運用における職務分離の監査として、監査人が確認すべき事項はどれか。","options":["少人数の組織では、職務を一人に集中させてよいと評価する。","運用担当者が開発も行うことで、効率が高まっていると評価する。","データ管理者は運用担当者が兼務してよい。","システムの開発、運用、データの管理の職務が分離され、相互に牽制が働いているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。少人数でも職務の集中は統制上のリスクであり、代替の牽制策を検討すべきである。","× 誤り。運用担当者が開発も行うと、自分の変更を自分で運用することになり、統制が機能しない。","× 誤り。データ管理者を運用担当者が兼務すると、データの改ざんを検出する仕組みが機能しない。","○ 正しい。開発、運用、データ管理を分離して相互に牽制させることで、不正や誤りを一人で完結させない統制になる。"]},{"id":"cisa-109","type":"mc","chapterIndex":3,"stem":"システムの保守において、保守作業の記録を残す目的として、最も適切なものはどれか。","options":["作業の内容、担当者、承認、結果を追跡できるようにし、後からの検証と責任の明確化を可能にするため。","保守作業の記録は、作業者の評価を下げるために使うため。","保守作業の記録は、作業時間を延ばすために必要であり、作業者が記録を残すことで、保守の手順を変更せずに長い時間をかけて行うためである。","保守作業の記録は、監査の対象ではないため。"],"correctIndex":0,"explanations":["○ 正しい。作業の内容、担当者、承認、結果を追跡できることで、後からの検証と責任の明確化ができる。","× 誤り。記録の目的は評価の引き下げではなく、作業の追跡と統制である。","× 誤り。記録は作業時間を延ばすためのものではなく、統制の証拠を残すためのものである。","× 誤り。保守作業は監査の対象であり、記録も監査の証拠として確認される。"]},{"id":"cisa-110","type":"mc","chapterIndex":3,"stem":"業務の継続性に関して、データのバックアップの保管場所を分ける目的として、最も適切なものはどれか。","options":["バックアップの保管場所を増やして、保管費用を増やし、同じ場所に複数の世代を残すことで、復元の選択肢を広げ、障害時の判断を容易にするため。","災害や事故で本番と同じ場所のバックアップが同時に失われることを防ぐため。","バックアップを本番と同じ場所に置いて、復元の手間を省き、障害時にすぐ使えるようにするため。","バックアップの保管場所は、監査の対象から外すため。"],"correctIndex":1,"explanations":["× 誤り。保管費用の増加は目的ではなく、保管場所を分ける理由は費用ではなくリスクの分散である。","○ 正しい。保管場所を分けることで、同じ災害や事故で本番とバックアップが同時に失われるリスクを下げられる。","× 誤り。本番と同じ場所に置くと、同じ災害で両方が失われるおそれがあり、継続性の確保に反する。","× 誤り。保管場所も監査の対象であり、管理の状況を確認する必要がある。"]},{"id":"cisa-111","type":"mc","chapterIndex":1,"stem":"ITガバナンスの観点から、運用の監督の仕組みとして監査人が確認すべき事項はどれか。","options":["運用の結果は、現場の担当者が把握していれば経営に報告する必要はなく、経営の判断は年次の予算編成の時点でまとめて行えば足りると評価する。","運用の目標は、現場の判断で随時変えてよく、変更の理由や承認を記録しなくても、実績との比較ができれば監督の目的は達せられると評価する。","運用の目標と実績が経営に定期的に報告され、経営がその結果に基づいて方針を見直しているかを確認する。","運用の監督は、年に一度の確認だけで十分であり、障害や変更が頻繁に起きても、年次の確認時点で必要な是正を行えばよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。現場だけの把握では、経営が運用の状況とリスクを判断できず、監督として不十分である。","× 誤り。目標を現場の判断で随時変えると、運用の基準が定まらず、評価の根拠を失う。","○ 正しい。目標と実績の定期的な報告と経営による見直しがあることで、運用の監督が機能する。","× 誤り。年一度の確認では、問題を早期に把握できず、運用の監督として不十分である。"]},{"id":"cisa-112","type":"mc","chapterIndex":3,"stem":"情報システムの運用において、ジョブのスケジュール管理に関する監査の評価として、最も適切なものはどれか。","options":["スケジュールは担当者が自由に変更してよい。","問題がなければ変更の記録は残さなくてよいとする。","スケジュールは、過去の実績を見ずに決めてよいと評価する。","スケジュールの変更が承認され、変更後の実行結果が確認されているかを確認する。"],"correctIndex":3,"explanations":["× 誤り。承認なしに変更できると、業務処理の順序や時間が管理されず、統制が機能しない。","× 誤り。問題がない場合も記録を残さないと、変更の経緯を後から確認できない。","× 誤り。過去の実績を見ずに決めると、処理時間の不足や競合を事前に防げない。","○ 正しい。変更の承認と変更後の実行結果の確認があることで、スケジュールの管理が統制されている。"]},{"id":"cisa-113","type":"mc","chapterIndex":3,"stem":"災害時の対応に関するBCPの訓練を監査する際の確認事項として、最も適切なものはどれか。","options":["訓練の計画、実施の記録、発見された課題と改善の結果が文書化されているかを確認する。","訓練は一度行えば、以後は実施しなくてよいと評価する。","訓練の課題は、記録せずに口頭で共有すればよいと評価する。","訓練は、担当者の一部だけが参加すれば十分であり、全社の体制や復旧の手順の見直しは、次の訓練の時期が来るまで行わなくてよいと評価する。"],"correctIndex":0,"explanations":["○ 正しい。計画、実施記録、課題と改善の文書化があることで、訓練が継続的な改善につながっているかを評価できる。","× 誤り。一度の訓練では、体制や手順の変化に対応できず、継続的な改善にならない。","× 誤り。課題を口頭だけで共有すると、改善の結果を確認できず、監査の証拠が残らない。","× 誤り。一部の担当者だけの参加では、組織全体で手順が機能するかを確認できない。"]},{"id":"cisa-114","type":"mc","chapterIndex":3,"stem":"システム運用における「変更の承認」の監査で、監査人が確認すべき事項はどれか。","options":["変更は担当者の判断で承認し、承認記録は残さず、変更の内容や影響の確認も担当者の判断に任せ、テスト結果を示す必要はないと評価する。","変更の内容、影響、テスト結果が示され、権限を持つ者が承認しているかを確認する。","変更の承認は、変更後にまとめて行えばよく、事前の影響評価やテストの結果を示さなくても、変更の内容が正しければ承認の目的は達せられると評価する。","変更の影響は、承認後に確認すればよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。担当者だけの承認と記録の省略は、変更の責任を明確にできず、統制として不十分である。","○ 正しい。内容、影響、テスト結果を示したうえで、権限者が承認することで、変更の統制が機能する。","× 誤り。変更後にまとめて承認すると、事前の統制としての意味を失う。","× 誤り。影響を承認後に確認すると、承認の判断に影響の情報が反映されない。"]},{"id":"cisa-115","type":"mc","chapterIndex":3,"stem":"システムの可用性を確保するための冗長化の監査として、監査人が確認すべき事項はどれか。","options":["冗長化は一度構築すれば、切替えの試験を行う必要はなく、障害が起きてから初めて切り替わるかを確認すればよいと評価する。","冗長化は、コストを優先して最小限の構成にしてよく、要件を満たしていなくても、障害が起きた場合の対応で補えると評価する。","冗長化の構成が要件を満たし、切替えの試験が定期的に行われ、結果が記録されているかを確認する。","冗長化の構成は、担当者の記憶にとどめておけばよく、文書化や構成の変更の記録は、必要が生じた時点で作成すればよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。構築しただけでは、障害時に切り替わるかを確認できず、統制として不十分である。","× 誤り。コストを優先して最小限にすると、障害時の可用性が要件を満たせないおそれがある。","○ 正しい。構成が要件を満たし、切替えの試験を定期的に行って記録することで、冗長化が機能するかを確認できる。","× 誤り。担当者の記憶に頼ると、担当者の交代時に構成を把握できず、障害対応が遅れる。"]},{"id":"cisa-116","type":"mc","chapterIndex":3,"stem":"ITサービスの品質に関する監査として、利用者からの苦情の扱いについて、監査人が確認すべき事項はどれか。","options":["苦情は、担当者が対応できるものだけ記録すればよいと評価する。","苦情の原因分析は、同じ苦情が繰り返された場合にだけ行えばよいと評価する。","苦情は、利用者の感想として扱い、改善の対象外とすると評価する。","苦情が記録され、原因が分析され、改善策が実施されたかが追跡できるかを確認する。"],"correctIndex":3,"explanations":["× 誤り。担当者が対応できるものだけを記録すると、対応できない問題が見えなくなり、改善の機会を失う。","× 誤り。繰り返された後にだけ分析すると、問題の拡大を防げず、早期の改善ができない。","× 誤り。苦情を感想として扱うと、サービスの問題を改善する仕組みが機能しない。","○ 正しい。苦情の記録、原因分析、改善策の実施を追跡できることで、サービス品質の改善の統制が機能する。"]},{"id":"cisa-117","type":"mc","chapterIndex":3,"stem":"情報システムのライフサイクルの最終段階である廃棄に関する監査人の確認事項として、最も適切なものはどれか。","options":["廃棄の手続が定められ、データの消去と機器の処分が承認され、記録が残されているかを確認する。","データは廃棄の際に消去しなくてよいと評価する。","機器の処分は、担当者が自由に行ってよいと評価する。","廃棄の記録は、必要な場合にだけ残せばよく、どの機器のデータをいつ消去したかは、担当者の記憶で確認できれば記録は不要であると評価する。"],"correctIndex":0,"explanations":["○ 正しい。手続の定め、データ消去と機器処分の承認、記録があることで、廃棄時の情報漏えいを防げる。","× 誤り。データを消去しないと、廃棄した機器から情報が漏えいするおそれがある。","× 誤り。担当者が自由に処分すると、消去の確認や承認がなく、統制が機能しない。","× 誤り。廃棄の記録を限定すると、どの機器のデータをいつ消去したかを確認できない。"]},{"id":"cisa-118","type":"mc","chapterIndex":4,"stem":"データセンターの運用において、物理的な入退室の管理に関する監査の確認事項として、最も適切なものはどれか。","options":["データセンターには誰でも自由に入れてよいと評価する。","入退室の権限が承認され、入退室の記録が残され、定期的に権限の見直しが行われているかを確認する。","入退室の記録は、トラブルが起きた場合にだけ確認すればよく、平時の記録の確認や、記録の保存期間を定める必要はないと評価する。","権限は一度付与すれば見直しは不要であり、異動や退職があっても、権限の変更は情報システム部門が必要と判断したときだけ行えばよいと評価する。"],"correctIndex":1,"explanations":["× 誤り。誰でも入れる状態では、機器の盗難や不正操作を防げず、統制が機能しない。","○ 正しい。権限の承認、入退室の記録、定期的な見直しがあることで、物理的な不正の入り口を統制できる。","× 誤り。記録を平時に確認しないと、不正の兆候を早期に発見できない。","× 誤り。権限の見直しをしないと、異動や退職後も不要な入室権限が残るおそれがある。"]},{"id":"cisa-119","type":"mc","chapterIndex":3,"stem":"運用の監査で、システム停止を伴う計画的な保守作業の承認と周知について、監査人が確認すべき事項はどれか。","options":["停止は担当者が必要と判断したときに、利用部門への事前の周知や承認を行わずに行ってよく、影響は停止後に利用部門から連絡があった場合に対応すればよいと評価する。","停止の影響は、利用部門が問題に気づいてから対応すればよく、停止の前に影響範囲や代替手段を確認しなくても、業務の継続には支障がないと評価する。","停止の目的、時間、影響範囲が関係者に周知され、利用部門の承認を得ているかを確認する。","停止の記録は、停止が長引いた場合にだけ残せばよく、計画と実績の差や作業の経緯は、担当者の記憶と口頭の報告で代えてよいと評価する。"],"correctIndex":2,"explanations":["× 誤り。事前の周知なしに停止すると、利用部門が業務の計画を立てられず、業務への影響が大きくなる。","× 誤り。影響を利用部門の気づきに任せると、業務への影響が発生してからの対応になる。","○ 正しい。目的、時間、影響範囲の周知と利用部門の承認があることで、業務への影響を管理できる。","× 誤り。停止の記録を限定すると、計画と実績の差を確認できず、保守の統制が機能しない。"]},{"id":"cisa-120","type":"mc","chapterIndex":0,"stem":"運用の監査における「予防統制」と「発見統制」の違いとして、最も適切なものはどれか。","options":["予防統制と発見統制は、同じ内容を異なる時点で行うだけで、違いはないと考える。","予防統制は事後に行うものであり、発見統制は事前に行うものである。","発見統制は、監査人だけが行うことのできる統制であると考える。","予防統制は誤りや不正が起きないように事前に防ぐものであり、発見統制は起きた誤りや不正を事後に検出するものである。"],"correctIndex":3,"explanations":["× 誤り。両者は目的とタイミングが異なる統制であり、同じ内容を異なる時点で行うものではない。","× 誤り。予防統制は事前に行うものであり、事後に行うのは発見統制である。","× 誤り。発見統制は組織内の担当者や管理者も行う統制であり、監査人だけのものではない。","○ 正しい。予防統制は事前に防ぎ、発見統制は事後に検出する。両者を組み合わせて統制を設計する。"]},{"id":"cisa-121","type":"mc","chapterIndex":4,"stem":"利用者のアクセス権を管理する方法として、監査人が最も適切と判断するものはどれか。","options":["アクセス権は一度付与すれば、退職時まで見直さない。","アクセス権は、部門長の判断だけで付与し、承認者による確認は省略して、付与の記録も残さない運用とする。","アクセス権は業務上必要な最小限に付与し、定期的に棚卸しを行う。","アクセス権は全員に同一の権限を付与する。"],"correctIndex":2,"explanations":["× 付与後に見直さないと、不要になった権限が残り続ける。","× 承認と記録を省くと、不正や誤りを検出できない。","○ 最小権限の原則と定期的な棚卸しにより、権限の過大付与を防ぐ。","× 全員に同一の権限を与えると、職務に応じた制限ができない。"]},{"id":"cisa-122","type":"mc","chapterIndex":4,"stem":"職務分掌に関する次の状況のうち、監査人が最も重要な指摘事項とすべきものはどれか。","options":["担当者ごとの権限を業務フローに沿って定義し、登録と承認を別の担当者が行う体制を整えており、その運用記録を定期的に確認している。","ベンダーの登録・変更・支払について、職務ごとに担当を分け、承認者の操作ログを月次で上長が確認する体制を取っている。","担当者の異動時には、引継ぎ書を作成して上長の承認を得る運用になっている。","同一の担当者が、取引先の登録から支払の承認まで一貫して行え、その利用を検証する仕組みがない。"],"correctIndex":3,"explanations":["× 適切な統制の記述であり、指摘事項にはあたらない。","× 承認者の確認を行っており、問題の状況ではない。","× 引継ぎと承認の手続
