<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GitHub 使いこなし問題集（非公式）</title>
<meta name="robots" content="noindex,nofollow">
<script>
(function () {
  function make(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === "withSuccessHandler") return function (f) { return make(f, fail); };
      if (name === "withFailureHandler") return function (f) { return make(ok, f); };
      return function () {
        var reading = /^(apiLoad|apiGet)/.test(String(name));
        setTimeout(function () {
          if (reading) { if (ok) ok(null); }
          else if (fail) fail(new Error("公開版では記録・AI助言は使えません"));
        }, 0);
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
  <style>
    :root {
      --theme-color: #24292f;
      --theme-color-dark: #0d1117;
    }
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', 'Hiragino Sans', 'Meiryo', sans-serif;
  background: var(--theme-color-dark);
  padding: 0;
  margin: 0;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

.container {
  background: white;
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, var(--theme-color) 0%, var(--theme-color-dark) 100%);
  color: white;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.header-icon { font-size: 32px; }

.header-text { min-width: 0; flex: 1 1 140px; }   /* ボタンに押されてタイトルが1文字幅に潰れ、縦書きのように見えるのを防ぐ */
.header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; writing-mode: horizontal-tb; }
.header-text p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

.header-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

.header-btn:hover { background: rgba(255,255,255,0.3); }

.quiz-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
}

.screen { width: 100%; max-width: 520px; margin: 0 auto; }

/* --- モード選択画面 --- */
/* カード数が増えても幅が細くなりすぎないよう、flexではなくgridで自動折り返しする
   （4つ目の「追加問題2」追加時にスマホで窮屈にならないための変更）。 */
.mode-select {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 16px;
  margin-top: 12px;
}

.mode-card {
  min-width: 0;
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
}

.mode-card:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

/* 復習モードのカードだけ、出題元の問題集カードと見分けられるよう薄く色を敷く。 */
.review-card {
  background: #fffaf2;
  border-color: #f0d9b5;
}
.review-card:hover { border-color: #e0a75e; }
.mode-card:disabled { opacity: 0.6; cursor: wait; }

.mode-icon { font-size: 36px; margin-bottom: 8px; }
.mode-title { font-size: 17px; font-weight: 700; color: #222; margin-bottom: 4px; }
.mode-desc { font-size: 13px; color: #888; }

/* --- 範囲選択画面（全部 / 章ごとにチャレンジ） --- */
.back-link {
  display: inline-block;
  background: none;
  border: none;
  color: #888;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 16px;
  padding: 4px 0;
  font-family: inherit;
}

.back-link:hover { color: var(--theme-color); }

.scope-select {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.scope-all-btn {
  background: white;
  border: 1.5px solid #e6e8ee;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.1s;
  margin-bottom: 8px;
}

.scope-all-btn:hover {
  border-color: var(--theme-color);
  box-shadow: 0 6px 18px rgba(0,0,0,0.1);
  transform: translateY(-2px);
}

.scope-all-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 4px; }
.scope-all-desc { font-size: 13px; color: #888; }

.scope-chapter-heading {
  font-size: 12px;
  font-weight: 700;
  color: #999;
  margin: 4px 0 2px;
}

.scope-chapter-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.scope-chapter-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  min-height: 48px;
  background: #f8f9ff;
  border: 1.5px solid #e8eaf6;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 14px;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
}

.scope-chapter-btn:hover { border-color: var(--theme-color); }

.scope-chapter-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.scope-chapter-btn:disabled:hover { border-color: #e6e8ee; }

/* 範囲選択画面の下に出す補足（復習モードの「克服」ルールの説明など） */
.scope-note {
  margin-top: 14px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.scope-chapter-btn .name { flex: 1; padding-right: 12px; }
.scope-chapter-btn .count { flex-shrink: 0; color: var(--theme-color); font-weight: 700; font-size: 13px; }

/* --- 出題画面 --- */
.progress {
  text-align: center;
  font-size: 13px;
  color: #999;
  margin-bottom: 4px;
}

.chapter-label {
  text-align: center;
  font-size: 12px;
  color: var(--theme-color);
  font-weight: 600;
  margin-bottom: 16px;
}

.question-card {
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
}

.stem {
  font-size: 15.5px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 16px;
  white-space: pre-wrap;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 15px;
  line-height: 1.5;
  text-align: left;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.option-btn:hover { border-color: var(--theme-color); }

.option-btn.selected {
  border-color: var(--theme-color);
  background: #f0f0ff;
  font-weight: 600;
}

.option-btn.tf-btn {
  text-align: center;
  font-size: 17px;
  font-weight: 700;
}

/* 回答後の表示状態 */
.option-btn.correct {
  border-color: #2e7d32;
  background: #e8f5e9;
}

.option-btn.incorrect {
  border-color: #c62828;
  background: #fdecea;
}

.option-btn:disabled { cursor: default; }

.option-badge {
  display: inline-block;
  font-weight: 700;
  margin-right: 6px;
}

.option-explain {
  display: block;
  font-size: 13px;
  color: #555;
  margin-top: 6px;
  line-height: 1.6;
  font-weight: 400;
}

.answer-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}

.answer-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 回答（複数選択のときだけ表示）とスキップを縦に並べる操作行。
   mc / tf は選択した時点で判定するため、この行にはスキップだけが残る。 */
.question-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.skip-btn {
  display: block;
  width: 100%;
  min-height: 44px;
  background: white;
  color: #888;
  border: 1.5px solid #e6e8ee;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}

.skip-btn:hover { border-color: var(--theme-color); color: var(--theme-color); }

.reveal-area { margin-top: 20px; }

.reveal-options { margin-bottom: 16px; }

.reveal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.action-btn {
  display: block;
  width: 100%;
  min-height: 48px;
  background: white;
  border: 1.5px solid #e0e0e0;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  color: #333;
  cursor: pointer;
  font-family: inherit;
  transition: border-color 0.15s, background 0.15s;
}

.action-btn:hover { border-color: var(--theme-color); }

.action-btn.primary {
  background: linear-gradient(135deg, var(--theme-color), var(--theme-color-dark));
  color: white;
  border: none;
}

/* --- 終了サマリー画面 --- */
#screenSummary { text-align: center; }
#screenSummary h2 { font-size: 22px; color: #333; margin-bottom: 16px; }

.summary-score {
  font-size: 32px;
  font-weight: 700;
  color: var(--theme-color);
  margin-bottom: 20px;
}

.summary-chapters {
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}

.summary-chapter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 13.5px;
}

.summary-chapter-row .name { color: #333; }
.summary-chapter-row .score { color: var(--theme-color); font-weight: 700; }

.summary-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* 間違えた問題だけを解き直すボタン。記録ボタンの次に置いて目に入るようにする。 */
.action-btn.retry-wrong {
  border-color: #f0d9b5;
  background: #fffaf2;
  color: #a1670f;
  font-weight: 700;
}
.action-btn.retry-wrong:hover { border-color: #e0a75e; }

.summary-note {
  margin-top: 12px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #888;
  text-align: left;
}

.record-status,
.advice-status {
  margin-top: 12px;
  font-size: 13px;
  color: #888;
  min-height: 18px;
}

.advice-area {
  margin-top: 12px;
  text-align: left;
  white-space: pre-wrap;
  background: #f8f9ff;
  border: 1px solid #e8eaf6;
  border-radius: 12px;
  padding: 16px;
  font-size: 13.5px;
  line-height: 1.7;
  color: #333;
}

.quiz-body::-webkit-scrollbar { width: 5px; }
.quiz-body::-webkit-scrollbar-track { background: transparent; }
.quiz-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }

/* --- PCブラウザ（幅900px以上）: 画面幅を広く使う ---
   以前は .screen が max-width:520px の中央寄せで、PCでは画面の中央に細い1列が出るだけだった（2026-09-20 に変更）。
   スマホ（600px以下）の指定とは範囲が重ならない。行が長くなりすぎないよう、上限は 1120px（1400px以上は 1240px）。
   ボタン類は横いっぱいに伸ばさず、中央に寄せた幅に留める。 */
@media (min-width: 900px) {
  .header { padding: 18px 40px; }
  .header-text h1 { font-size: 20px; }
  .header-text p { font-size: 13px; }
  .header-btn { font-size: 12px; padding: 7px 14px; }

  .quiz-body { padding: 32px 48px; }
  .screen { max-width: 1120px; }

  /* モード選択: カードを横に並べて広く使う（4枚なら1行） */
  .mode-select { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 16px; }
  .mode-card { padding: 30px 20px; }
  .mode-icon { font-size: 40px; }
  .mode-title { font-size: 18px; }
  .mode-desc { font-size: 14px; }

  /* 範囲選択: 章のボタンを2列に（章が多くても縦に長くなりすぎない） */
  .scope-chapter-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
  .scope-chapter-btn { font-size: 15px; }

  /* 出題: 問題文・選択肢を広く、文字も一段大きく */
  .question-card { padding: 28px 36px; }
  .stem { font-size: 18px; line-height: 1.8; }
  .options { gap: 12px; }
  .option-btn { font-size: 16px; padding: 14px 20px; }
  .answer-btn, .action-btn, .skip-btn { max-width: 520px; margin-left: auto; margin-right: auto; }
  .question-actions { align-items: center; }
  .question-actions .answer-btn, .question-actions .skip-btn { width: 100%; }
  .summary-note, .scope-note { max-width: 720px; margin-left: auto; margin-right: auto; }
  .reveal-actions { align-items: stretch; }

  /* 終了サマリー: 章別の結果を2列に */
  .summary-chapters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px; }
  .summary-chapter-row { font-size: 14.5px; padding: 12px 16px; }
  .summary-actions { align-items: center; }
  .summary-actions .action-btn { width: 100%; }
}

@media (min-width: 1400px) {
  .screen { max-width: 1240px; }
}

@media (max-width: 600px) {
  body { padding: 0; }
  .container {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-height: none;
    border-radius: 0;
  }
  .header { padding: 12px 14px; gap: 8px 10px; flex-wrap: wrap; }   /* 狭い画面ではボタン類を2行目へ折り返す */
  .header-icon { font-size: 28px; }
  .header-text h1 { font-size: 16px; }
  .header-text p { display: none; }
  .header-actions { gap: 6px; flex-wrap: wrap; flex-basis: 100%; margin-left: 0; }
  .header-btn { font-size: 11px; padding: 6px 10px; }
  .quiz-body { padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  .stem { font-size: 16.5px; }
  .option-btn { font-size: 16px; }
  .mode-select { gap: 10px; }
  .mode-card { padding: 16px 8px; }
  .mode-icon { font-size: 26px; margin-bottom: 4px; }
  .mode-title { font-size: 14px; margin-bottom: 2px; }
  .mode-desc { font-size: 11px; }
}

@media (max-height: 480px) {
  .quiz-body { padding-top: 14px; }
  .mode-card { padding: 12px 8px; }
  .mode-icon { font-size: 22px; margin-bottom: 2px; }
}

/* --- 中断した問題集の再開バナー（モード選択画面の先頭） --- */
.resume-banner {
  border: 2px solid var(--theme-color);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: #fff;
}
.resume-text { font-size: 14px; font-weight: 600; line-height: 1.5; margin-bottom: 10px; }
.resume-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-actions .action-btn { flex: 1 1 140px; width: auto; }

  </style>
<style>#askBtn,#adviceBtn{display:none !important}</style>
</head>
<body>
<div style="background:#fff4d6;color:#5b4300;padding:10px 14px;font-size:14px;line-height:1.6;border-bottom:1px solid #e6c96b">
<strong>非公式・個人作成の仮問題です。</strong>GitHub, Inc.（GitHub）の公式の試験・規格とは無関係で、公式の出題・難度とは一致しません。事実関係は GitHub の公式ドキュメントで確認した内容に基づきますが、GitHub は頻繁に更新されるため最新の公式ドキュメントで確認してください。この公開版では成績・途中経過は保存されません。
</div>
<div class="container">
  <div class="header">
    <div class="header-icon">🐙</div>
    <div class="header-text">
      <h1>GitHub 使いこなし問題集（非公式）</h1>
      <p id="headerSub">モードを選んでください</p>
    </div>
    <div class="header-actions">
      
      
      
      <button type="button" class="header-btn" id="soundBtn" onclick="toggleSound()">🔊 音</button>
    </div>
  </div>

  <div class="quiz-body" id="quizBody">
    <div class="screen" id="screenMode">
      <div class="resume-banner" id="resumeBanner" style="display:none;">
        <div class="resume-text" id="resumeText"></div>
        <div class="resume-actions">
          <button class="action-btn primary" id="resumeBtn" onclick="resumeProgress()">▶ 続きから再開</button>
          <button class="action-btn" onclick="discardProgress()">破棄</button>
        </div>
      </div>
      <div class="mode-select">
        <button class="mode-card" onclick="chooseMode('mc')">
          <div class="mode-icon">📝</div>
          <div class="mode-title" id="mcTitle">模擬試験</div>
          <div class="mode-desc"><span id="mcCount">0</span>問・<span id="mcKind">4択</span></div>
        </button>
        <button class="mode-card" id="tfCard" onclick="chooseMode('tf')">
          <div class="mode-icon">⭕</div>
          <div class="mode-title">一問一答</div>
          <div class="mode-desc"><span id="tfCount">0</span>問・正誤判定</div>
        </button>
        <button class="mode-card" id="extraCard" onclick="chooseMode('extra')">
          <div class="mode-icon">📘</div>
          <div class="mode-title">追加問題</div>
          <div class="mode-desc"><span id="extraCount">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra2Card" onclick="chooseMode('extra2')">
          <div class="mode-icon">📗</div>
          <div class="mode-title">追加問題2</div>
          <div class="mode-desc"><span id="extra2Count">0</span>問・4択</div>
        </button>
        <button class="mode-card" id="extra3Card" onclick="chooseMode('extra3')">
          <div class="mode-icon">🆕</div>
          <div class="mode-title">新シラバス仮問題</div>
          <div class="mode-desc"><span id="extra3Count">0</span>問・4択（2027年2月〜の追加分）</div>
        </button>
        <button class="mode-card review-card" id="reviewCard" onclick="chooseMode('review')">
          <div class="mode-icon">🔁</div>
          <div class="mode-title">復習</div>
          <div class="mode-desc" id="reviewCount">間違えた問題だけ</div>
        </button>
      </div>
    </div>

    <div class="screen" id="screenScope" style="display:none;">
      <button class="back-link" onclick="backToModeSelect()">← モード選択に戻る</button>
      <div class="scope-select" id="scopeSelect"></div>
    </div>

    <div class="screen" id="screenQuestion" style="display:none;">
      <div class="progress" id="progress"></div>
      <div class="chapter-label" id="chapterLabel"></div>
      <div class="question-card">
        <p class="stem" id="stem"></p>
        <div class="options" id="options"></div>
      </div>
      <div class="question-actions" id="questionActions">
        <button class="answer-btn" id="answerBtn" onclick="reveal()" disabled>回答</button>
        <button class="skip-btn" id="skipBtn" onclick="skipQuestion()">回答せずに次へ →</button>
      </div>
      <div class="reveal-area" id="revealArea" style="display:none;">
        <div class="reveal-options" id="revealOptions"></div>
        <div class="reveal-actions">
          <button class="action-btn" id="askBtn" style="display:none !important" onclick="askInChat()">🤖 チャットに詳しく聞く</button>
          <button class="action-btn primary" id="nextBtn" onclick="nextQuestion()">次の問題へ →</button>
        </div>
      </div>
    </div>

    <div class="screen" id="screenSummary" style="display:none;">
      <h2>お疲れさまでした！</h2>
      <div class="summary-score" id="summaryScore"></div>
      <div class="summary-chapters" id="summaryChapters"></div>
      <div class="summary-actions">
        <button class="action-btn primary" id="recordBtn" onclick="recordResults()">この回の結果を記録</button>
        <button class="action-btn retry-wrong" id="retryWrongBtn" onclick="retryWrongInSession()" style="display:none;">🔁 間違えた問題だけもう一度</button>
        <button class="action-btn" id="adviceBtn" style="display:none !important" onclick="getAdvice()">🎯 学習アドバイスを見る</button>

<script>
  const GAS_WEBAPP_URL = '';
  const EXAM_ID = 'github';
  const EXAM_SHORT_TITLE = 'GitHub';
  const TRACKING_EXAM_ID = 'github';
  const MC_TITLE = '問題集';
  const QUESTIONS = [{"id":"github-1","type":"mc","chapterIndex":0,"stem":"変更を履歴に残すまでの手順として正しいものはどれか。","options":["git add で変更をステージし、git commit で履歴に保存する","git commit で変更をリモートへ送り、そのあと git add で履歴に残す","git push で変更をステージし、git commit で保存する","git add だけで履歴に残るので、commit は要らない"],"correctIndex":0,"explanations":["○ git add はステージ、git commit はステージ済みの変更を履歴に保存する。記録は2段階で行う。","× commit はローカルの履歴への保存で、リモートへ送るのは push である。","× push はリモートへの送信で、ステージは add が行う。","× add はステージだけで、履歴に保存するには commit が必要である。"]},{"id":"github-2","type":"mc","chapterIndex":0,"stem":"チームメンバーが push した最新の変更を、自分のローカルブランチにも1コマンドで取り込みたい。適切なコマンドはどれか。","options":["git fetch を実行すると、取得と同時に自分のブランチへマージされる","git pull は fetch と merge を一度に行うコマンド","git clone を毎回実行すると、既存のローカルブランチに変更が取り込まれる","git push を実行すると、リモートの変更が自分のブランチへ届く"],"correctIndex":1,"explanations":["× fetch は新しい作業を取得するだけで、自分のブランチへはマージしない。","○ git pull は fetch と merge を続けて行うため、ローカルブランチが変わる。","× clone は新しい完全なローカルコピーを作る操作で、既存の作業は取り込まない。","× push は手元の変更をリモートへ送る操作で、受け取りには使わない。"]},{"id":"github-3","type":"mc","chapterIndex":0,"stem":"git clone の動作として正しいものはどれか。","options":["リモートの最新コミットだけを取得し、過去の履歴は含まれない","既存のローカルリポジトリにリモートを追加するだけで、ファイルは取得されない","全履歴を含む完全な複製を作り、既定ブランチを取り出す","ブランチを作成すると同時に、リモートへ push する操作が行われる"],"correctIndex":2,"explanations":["× clone は過去の履歴を含む完全なコピーを作るため、最新コミットだけという説明は誤りである。","× clone は新しいローカルリポジトリを作る操作で、既存リポジトリにリモートを足す操作ではない。","○ clone は全ファイルと全コミットを含む完全なコピーを作り、既定ブランチをチェックアウトする。","× clone はリモートから取得する操作で、push は行われない。"]},{"id":"github-4","type":"mc","chapterIndex":0,"stem":"新しいPCで既存のGitHubリポジトリを複製したあと、リモートの扱いについて正しいものはどれか。","options":["main という名前のリモートが作成され、既定ブランチと同名になる","remote という名前のリモートが作られ、手動で名前を変える必要がある","clone の直後は、リモートが一切登録されない","origin という名前で、複製元の URL を指すリモートが自動的に作成される"],"correctIndex":3,"explanations":["× リモートの既定名は main ではなく origin である。","× 既定の名前は origin であり、remote ではない。","× clone の直後には origin が自動で登録される。","○ clone は複製元の URL を指す origin というリモートを自動で作成する。"]},{"id":"github-5","type":"mc","chapterIndex":0,"stem":".gitignore に書いたのに、以前から追跡されているファイルの変更がコミットされ続けている。適切な対処はどれか。","options":["同じファイルを .gitignore に再度書き加えるだけで、追跡は自動的に止まる","git rm --cached で追跡を解除し、.gitignore を効かせる","そのファイルを削除してから .gitignore を書くと、履歴からも消える","ファイル名を変えると、.gitignore の対象外になる"],"correctIndex":1,"explanations":["× 既に追跡されているファイルは、.gitignore を書いただけでは追跡が止まらない。","○ すでに追跡されているファイルは .gitignore だけでは追跡が止まらない。git rm --cached で追跡解除する必要がある。","× 作業フォルダから消しても、追跡状態と履歴は残るので、追跡は止まらない。","× 名前を変えても追跡は続くため、対象外にはならない。"]},{"id":"github-6","type":"mc","chapterIndex":0,"stem":"PC上のすべての Git リポジトリに、同じ無視ルールを適用したい。適切な方法はどれか。","options":["各リポジトリのルートの .gitignore を全部同じ内容にコピーして管理する","リポジトリ内の .git/config に、無視するファイルの名前一覧を直接書き込む","~/.config/git/ignore に書き、PC 全体に適用する","コミットのたびに --ignore オプションを付けて指定する"],"correctIndex":2,"explanations":["× 個別に書くと手間がかかり、全リポジトリに一括で適用はできない。","× .git/config に無視ルールを書く仕組みは、ここでは使われない。","○ グローバルの ignore ファイルは、そのPC上のすべての Git リポジトリに適用される。","× --ignore というコミット時のオプションは存在しない。"]},{"id":"github-7","type":"mc","chapterIndex":0,"stem":"GitHub へ Git で接続するときの認証方式について、公式の推奨として正しいものはどれか。","options":["SSH だけが使え、HTTPS での接続はサポートされていない","リモートの URL にパスワードを直接埋め込むことが最も推奨される","認証は Git の設定に関係なく、GitHub Desktop でのみ行える","HTTPS を推奨し、認証情報のキャッシュを勧めている"],"correctIndex":3,"explanations":["× HTTPS と SSH の両方がサポートされている。","× URL にパスワードを埋め込むことは推奨されていない。","× Git の認証は GitHub Desktop に限られない。","○ GitHub の接続は HTTPS か SSH で行い、公式は HTTPS を推奨して認証情報のキャッシュを勧めている。"]},{"id":"github-8","type":"mc","chapterIndex":0,"stem":"Git と GitHub の関係について正しい説明はどれか。","options":["Git は分散型のバージョン管理ソフトで、GitHub は Git のリポジトリをクラウド上にホストし、協働のためのツールを加えたプラットフォームである","GitHub は Git の後継となる、まったく別のバージョン管理ソフトである","Git と GitHub は同じ機能を持つ別名であり、区別する必要はない","GitHub は Git を使わず、履歴を独自の方式で管理するシステムである"],"correctIndex":0,"explanations":["○ Git はオープンソースのバージョン管理ソフトで、GitHub はその上に協働の機能を加えたホスティングのプラットフォームである。","× GitHub は Git の後継ではなく、Git を土台にしたサービスである。","× Git はソフトウェア、GitHub はそれを使うサービスで、同じものではない。","× GitHub は Git のリポジトリを扱うため、Git を使っている。"]},{"id":"github-9","type":"mc","chapterIndex":0,"stem":"ターミナルを使わずに、コミットやプッシュを GUI で行いたい。無料で使える公式のデスクトップアプリとして適切なものはどれか。","options":["GitHub CLI（gh）は、GUI で変更を操作するための公式アプリである","GitHub Mobile は、スマートフォンで Git のコミットを作るための専用アプリである","GitHub Desktop（Windows と macOS で動く無料のアプリ）","Git Bash は、GitHub が提供する GUI のクライアントである"],"correctIndex":2,"explanations":["× GitHub CLI はターミナルから使うツールで、GUI アプリではない。","× GitHub Mobile は Issue や PR の確認などが中心で、コミットを作る用途ではない。","○ GitHub Desktop は無料のオープンソースの GUI アプリで、Windows と macOS で動作する。","× Git Bash は Git を使うためのターミナルで、GitHub の GUI ではない。"]},{"id":"github-10","type":"mc","chapterIndex":0,"stem":"GitHub CLI（gh）の説明として正しいものはどれか。","options":["GitHub の機能は使えず、Git の操作だけを行うためのツールである","GitHub 専用ではなく、どのホスティングでも使える Git の拡張である","Windows でしか動かない","ターミナルから PR や Issue などを扱えるツール"],"correctIndex":3,"explanations":["× gh は GitHub の機能をターミナルから扱うためのツールである。","× gh は GitHub 専用で、他のホスティングには使えない。","× gh は特定の OS に限られない。","○ GitHub CLI は、PR、Issue、Actions などの GitHub 機能をターミナルから扱えるオープンソースのツールである。"]},{"id":"github-11","type":"mc","chapterIndex":0,"stem":"リモートの新しい履歴を取り込むが、自分のローカルブランチは変えない操作はどれか。","options":["git fetch（ローカルのブランチは変えない）","git pull（取得したあと、自分のブランチにも自動でマージする）","git merge（別のブランチの内容を現在のブランチへ取り込む）","git clone（リモートのリポジトリを新しく複製する）"],"correctIndex":0,"explanations":["○ fetch は新しい作業を取得するだけで、自分のブランチは変わらない。","× pull は fetch と merge を続けて行うため、ローカルブランチが変わる。","× merge は現在のブランチを変更する操作である。","× clone は新しいリポジトリを複製する操作で、既存の作業は変えない操作ではない。"]},{"id":"github-12","type":"mc","chapterIndex":0,"stem":"コミットを識別するための ID について正しいものはどれか。","options":["コミット ID は作成者が自由に決める連番で、リポジトリ内で重複することがある","コミットには一意の ID（SHA、ハッシュ）が付き、変更内容・時刻・作成者を特定するのに使われる","コミット ID はブランチ名と同じ値になり、ブランチごとに1つだけ存在する","コミット ID は GitHub のユーザー名を基にした文字列である"],"correctIndex":1,"explanations":["× コミット ID は連番ではなく、重複しない一意のハッシュである。","○ コミットには SHA と呼ばれる一意の ID が付き、変更内容、時刻、作成者を特定できる。","× コミット ID はブランチ名とは別の値である。","× コミット ID はユーザー名から作られるものではない。"]},{"id":"github-13","type":"mc","chapterIndex":0,"stem":"GUI で Git を使う人が、Windows と macOS のどちらでも同じ操作をしたい。GitHub Desktop の対応OSとして正しいものはどれか。","options":["Windows、macOS、Linux のすべてで動作する","Linux でのみ動作する","macOS だけで動く","Windows と macOS の両方で動作する"],"correctIndex":3,"explanations":["× Linux は対応OSに含まれない。","× Windows でも動作する。","× Windows でも動作し、Web 版に限られない。","○ GitHub Desktop は Windows と macOS で動作する。"]},{"id":"github-14","type":"mc","chapterIndex":0,"stem":"GitHub Mobile の機能として正しいものはどれか。","options":["通知の確認、Issue や PR のレビューなどができる","リポジトリを clone して、ローカルでビルドを実行できる","Codespaces の開発環境を作成し、ターミナルで操作できる","Git のコマンドを提供する"],"correctIndex":0,"explanations":["○ GitHub Mobile は Android と iOS 向けのアプリで、通知の整理やレビュー、2要素認証の確認などに使う。","× clone やビルドは GitHub Mobile の機能ではない。","× Codespaces は GitHub Mobile から作成して操作するものではない。","× Git のコマンドラインは提供されていない。"]},{"id":"github-15","type":"mc","chapterIndex":0,"stem":"分散型バージョン管理システムの特徴として正しいものはどれか。","options":["中央サーバーとの常時接続が無いと、履歴の確認ができない","各開発者が全履歴の完全なコピーを持つ","変更は中央リポジトリにだけ記録され、手元のコピーには履歴が残らない","過去の任意のバージョンを復元する機能は持たない"],"correctIndex":1,"explanations":["× 分散型では手元で履歴を確認できるため、常時接続は必要ない。","○ 分散型では、各開発者が全履歴を持つため、中央への常時接続は必要ない。","× 分散型では手元にも全履歴があり、中央だけに記録されるわけではない。","× 分散型でも、任意のバージョンを復元できる。"]},{"id":"github-16","type":"mc","chapterIndex":1,"stem":"個人アカウントで作ったリポジトリを、インターネット上の誰でも閲覧できる状態にしたい。適切な設定はどれか。","options":["private に設定すると、インターネット上の誰でも閲覧できる状態になる","ライセンスファイルを追加するだけで、閲覧は誰にでも許可される","リポジトリの可視性を public にすると、インターネット上の誰でも閲覧できる","README を置けば、既定で誰でも閲覧できる状態になる"],"correctIndex":2,"explanations":["× private は閲覧者を限定する設定である。","× ライセンスの有無は閲覧できる範囲を決めない。","○ public のリポジトリは、インターネット上の誰でも閲覧できる。","× README の有無は公開範囲に影響しない。"]},{"id":"github-17","type":"mc","chapterIndex":1,"stem":"社内の限られたメンバーだけに見せたい。リポジトリの設定として適切なものはどれか。","options":["private にし、本人と共有した人だけがアクセスできる","public にして、閲覧者をリポジトリの Issue で絞る","public にして、閲覧者を Issue で絞る","ライセンスを付けて、閲覧できる人を指定する"],"correctIndex":0,"explanations":["○ private のリポジトリは、本人と明示的に共有した人、組織では一部のメンバーにだけアクセスを許す。","× public は誰でも閲覧できるので、閲覧者の絞り込みには使えない。","× 共有した人は作成者以外でもアクセスできる。","× ライセンスは閲覧者を指定する仕組みではない。"]},{"id":"github-18","type":"mc","chapterIndex":1,"stem":"リポジトリの可視性（public か private）を変更できるのは誰か。","options":["write 権限を持つ人なら誰でも、いつでも変更できる","admin 権限を持つ人が変更できる","読み取り権限を持つ人なら、公開設定を切り替えられる","サポートへ依頼するしかない"],"correctIndex":1,"explanations":["× write 権限では可視性は変えられない。","○ リポジトリの可視性を変更できるのは admin 権限を持つ人である。","× read 権限で公開設定は変えられない。","× 管理者が自分で変更でき、サポートへの依頼は不要である。"]},{"id":"github-19","type":"mc","chapterIndex":1,"stem":"fork と clone の違いとして正しいものはどれか。","options":["fork も clone も、元のリポジトリへ直接 push するための操作である","clone は新しいリポジトリを作成し、fork は手元にデータを複製する操作である","fork は新しいリポジトリを作る操作で、clone は手元へ複製する操作","fork は手元のデータを複製する操作で、clone はGitHub上に新しいリポジトリを作る操作である"],"correctIndex":2,"explanations":["× fork と clone はどちらも、元のリポジトリへの直接の push ではない。","× clone と fork の説明が入れ替わっている。","○ fork は GitHub 上に別のリポジトリを作り、clone は手元にデータをダウンロードする操作である。","× fork と clone の説明が入れ替わっている。"]},{"id":"github-20","type":"mc","chapterIndex":1,"stem":"README を表示させたい。GitHub が自動で表示する場所として正しいものはどれか。","options":["リポジトリの設定画面の Description に書いた内容が、README として表示される","コード内の最初の .md ファイルが自動的に README として表示される","wiki に置いたページが、リポジトリのトップに表示される","ルート、docs、.github のいずれかのディレクトリに置くと自動で表示され、複数ある場合は .github、ルート、docs の順に最初のものが使われる"],"correctIndex":3,"explanations":["× Description は README の本文ではない。","× 最初に見つかった .md ファイルが README になるわけではない。","× wiki は README の表示場所ではない。","○ README は .github、ルート、docs のいずれかにあると表示され、複数ある場合は .github、ルート、docs の順に使われる。"]},{"id":"github-21","type":"mc","chapterIndex":1,"stem":"コードの所有者を決めて、そのファイルが変更された PR に自動でレビュー依頼したい。どのファイルに書くか。","options":["SECURITY.md に担当者名を書く","CODEOWNERS に所有者を書く","LICENSE に名前を列挙する","README に担当者を書く"],"correctIndex":1,"explanations":["× SECURITY.md は脆弱性の報告方法を書くファイルである。","○ CODEOWNERS に書いた所有者は、そのファイルが変更された PR でレビューを依頼される。","× LICENSE はライセンス文を書くファイルである。","× README はプロジェクトの説明を書くファイルで、所有者の指定には使わない。"]},{"id":"github-22","type":"mc","chapterIndex":1,"stem":"CODEOWNERS で同じファイルに複数のパターンが一致した場合の扱いとして正しいものはどれか。","options":["最初に一致したパターンが優先され、以降は無視される","すべての一致した所有者に、同時にレビューが依頼される","最後に一致したパターンが優先される","一致数が多いほど優先される"],"correctIndex":2,"explanations":["× 最初のパターンが優先されるわけではない。","× すべての一致が使われるのではなく、最後の一致が優先される。","○ CODEOWNERS では、最後に一致したパターンが優先される。","× パターンの数は優先順位を決めない。"]},{"id":"github-23","type":"mc","chapterIndex":1,"st ://\u003cowner>.github.io/\u003cリポジトリ名>","https://pages.github.com/\u003cリポジトリ名>"],"correctIndex":2,"explanations":["× ホスト名とパスの順が違う。","× github.io のドメインの位置が違う。","○ プロジェクトサイトの既定の URL は https://\u003cowner>.github.io/\u003cリポジトリ名> になる。","× pages.github.com は既定の URL の形式ではない。"]},{"id":"github-129","type":"mc","chapterIndex":8,"stem":"Pages の公開元として選べるものはどれか。","options":["ブランチの / か /docs、または Actions","Wiki のページだけ","Issue のテンプレートフォルダ","Discussions のカテゴリの一覧を公開元にする設定"],"correctIndex":0,"explanations":["○ Pages の公開元は、ブランチの / または /docs、あるいは GitHub Actions から選べる。","× Wiki は公開元にできない。","× Issue テンプレートは公開元にできない。","× Discussions は公開元にできない。"]},{"id":"github-130","type":"mc","chapterIndex":8,"stem":"ブランチ公開の Pages サイトで、既定の Jekyll の処理を無効にしたい。どうするか。","options":["_config.yml に jekyll: off と書く","ルートに空の .nojekyll ファイルを置く","Settings で Jekyll の欄をオフにするだけでよい","Jekyll は無効化できない"],"correctIndex":1,"explanations":["× その書き方は無効化の方法ではない。","○ ブランチ公開のサイトは既定で Jekyll を使い、ルートに空の .nojekyll を置くと無効にできる。","× 設定画面では切り替えない。","× 無効化はできる。"]},{"id":"github-131","type":"mc","chapterIndex":8,"stem":"独自ドメインを GitHub Pages に設定するときの DNS の設定として正しいものはどれか。","options":["すべてのドメインに、MX レコードを設定する","apex ドメインにも CNAME レコードを必ず設定する","サブドメインは CNAME を使う","DNS の設定は不要で、リポジトリの名前だけで決まる"],"correctIndex":2,"explanations":["× MX レコードはメールの設定である。","× apex ドメインには CNAME を使うのが基本ではない。","○ サブドメインは CNAME、apex ドメインは A、ALIAS、ANAME などを使う。www は最も安定した設定とされる。","× DNS の設定は必要である。"]},{"id":"github-132","type":"mc","chapterIndex":8,"stem":"Wiki の編集権限について正しいものはどれか。","options":["既定では誰でも編集でき、権限は変えられない","admin 権限のある人だけが、どの設定でも編集できる","Wiki は private リポジトリでは使えない","既定では write 権限のある人だけが編集でき、public リポジトリでは全員に開放できる"],"correctIndex":3,"explanations":["× 既定の編集者は write 権限者である。","× 編集は write 権限でできる。","× private でも Wiki は使える。","○ Wiki は既定では write 権限のある人が編集でき、public リポジトリでは全員に編集を開放できる。"]},{"id":"github-133","type":"mc","chapterIndex":8,"stem":"Gist の説明として正しいものはどれか。","options":["secret にすると、本人以外は見られない","public と secret があり、Git リポジトリ","Gist は Git リポジトリではなく、fork できない","個人では作れず 性を通知する","security updates は通知だけで、PR は作らない","alerts は既知の脆弱性を通知し、security updates は修正の PR を作り、version updates は依存関係を最新に保つ PR を作る","3つとも同じ機能で、呼び名が違うだけである"],"correctIndex":2,"explanations":["× 通知と PR の役割が入れ替わっている。","× security updates は修正の PR を作る。","○ Dependabot alerts は脆弱性を通知し、security updates は修正 PR を作り、version updates は最新に保つための PR を作る。","× 3つは役割が違う。"]},{"id":"github-145","type":"mc","chapterIndex":9,"stem":"Dependabot version updates の設定ファイルの場所として正しいものはどれか。","options":[".github/dependabot.yml","dependabot.json をルートに置く","workflows に置く","Settings の画面の YAML 欄"],"correctIndex":0,"explanations":["○ version updates の設定は .github/dependabot.yml に書き、version: 2、updates、package-ecosystem、schedule.interval などが必要である。","× ファイル名と形式が違う。","× workflows ディレクトリには置かない。","× 設定は画面ではなく、ファイルに書く。"]},{"id":"github-146","type":"mc","chapterIndex":9,"stem":"シークレットスキャンの説明として正しいものはどれか。","options":["コードの脆弱性を分析して修正する","ハードコードされた認証情報を検出する","依存パッケージの脆弱性を見つけて通知する","PR のレビュー担当を、自動で決めて割り振る"],"correctIndex":1,"explanations":["× 脆弱性の分析は code scanning の役割である。","○ シークレットスキャンは、API キーやトークンなど、ハードコードされた認証情報を全ブランチの履歴から検出する。","× 依存関係の通知は Dependabot の役割である。","× レビュー担当は CODEOWNERS の役割である。"]},{"id":"github-147","type":"mc","chapterIndex":9,"stem":"認証情報が誤ってコミットされ、公開されてしまった。最初に行うべきことはどれか。","options":["コミットを履歴から消して、force push する","リポジトリを private にして、様子を見る","認証情報を失効させる","そのファイルを削除して次のコミットに含める"],"correctIndex":2,"explanations":["× 履歴の書き換えは、まず行うべきことではない。","× 公開範囲を変えても、漏えいした情報は戻らない。","○ 漏えいした認証情報は、まず失効させる（ローテーションする）のが先で、履歴の書き換えは多くの場合不要である。","× 削除しても履歴に残るため、対策にならない。"]},{"id":"github-148","type":"mc","chapterIndex":9,"stem":"push protection（プッシュ保護）の説明として正しいものはどれか。","options":["push の後に、シークレットの一覧をメールで送る","push を自動で取り消して、履歴から消す","push の前に、ブランチ名を変更する","シークレットを含む push を、ブロックできる機能である"],"correctIndex":3,"explanations":["× push の後の通知ではなく、push 自体をブロックする。","× 履歴は自動では消さない。","× ブランチ名は変えない。","○ プッシュ保護は、シークレットを含む push をブロックする機能である。"]},{"id":"github-149","type":"mc","chapterIndex":9,"stem":"code scanning（コードスキャン）の説明として正しいものはどれか。","options" // 'extra'（追加問題、別ソースの問題集）は既存の 模擬試験(seiseiai_mc) と混在しないよう
// 'mc2' という別モード名で記録する。'extra2'（3つ目の問題集）は同様に'mc3'。
// 'review'（復習モード）は章別推移表には記録せず、専用の復習ログへ書く（recordResults参照）。
const TRACKING_MODE = { mc: 'mc', tf: 'tf', extra: 'mc2', extra2: 'mc3', extra3: 'mc4', review: 'review' };

// 復習モードの「卒業」条件。復習でこの回数だけ連続正解したら、既定の出題対象から外す
// （「記録にある全部」を選べば卒業ぶんも出題できる）。バックエンド QuizReview.js は
// 生の連続正解数(streak)だけを返し、閾値の判断はこの画面側で持つ。
const GRADUATE_STREAK = 2;
// 復習の範囲「最近間違えた問題」が遡る日数。
const RECENT_MISS_DAYS = 14;

let mode = null;             // 'mc' | 'tf' | 'extra' | 'extra2' | 'extra3' | 'review'
let modePool = [];           // モードごとの出題プール（下記参照）
let scopeChapterIndex = null; // null = 全部、それ以外は対象chapterIndex
let scopeGroup = null;        // null = 章全体、それ以外は章の中のテーマ別グループ名
let questions = [];          // 範囲確定時に modePool を全部 or 該当章でfilterしたもの
let idx = 0;
let selectedOption = null;   // mc: 0-3 の数値、tf: true/false、mc-multi: 選択中indexの配列、未選択は null（mc-multiは[]）
let revealed = false;
let sessionResults = [];     // [{id, chapterIndex, correct, selectedOption}]
let skippedCount = 0;        // 回答せずに飛ばした問題数（正答率の母数には入れない）

// 復習モード用の状態。reviewEntries はバックエンド apiGetReviewPool の戻り
// [{id, mode, missCount, lastMissAt, reviewCount, streak, lastReviewAt}]。
let reviewEntries = [];
let reviewEntryById = {};
let reviewScopeKey = null;   // 'active' | 'repeat' | 'recent' | 'all' | chapterIndex(数値)
let reviewMissingCount = 0;  // 記録にあるが今の問題集に見つからない問題数（ID未記録の旧データなど）

(function initCounts() {
  document.getElementById('mcCount').textContent = QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).length;
  document.getElementById('tfCount').textContent = QUESTIONS.filter((q) => q.type === 'tf' && !q.deck).length;
  document.getElementById('extraCount').textContent = QUESTIONS.filter((q) => q.deck === 'extra').length;
  document.getElementById('extra2Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra2').length;
  document.getElementById('extra3Count').textContent = QUESTIONS.filter((q) => q.deck === 'extra3').length;
  // 問題が1問も無いモードのカードは出さない（FP3のように問題集が1本だけの資格向け）。
  [['tfCard', 'tfCount'], ['extraCard', 'extraCount'], ['extra2Card', 'extra2Count'], ['extra3Card', 'extra3Count']].forEach(([card, count]) => {
    if (!Number(document.getElementById(count).textContent)) document.getElementById(card).style.display = 'none';
  });
  // 模擬試験カードの選択肢数表記（FP3は3択）。選択肢数が混在するときは「3〜4択」のように範囲で出す。
  const sizes = Array.from(new Set(QUESTIONS.filter((q) => q.type === 'mc' && !q.deck).map((q) => q.options.length)));
  if (sizes.length) {
    const lo = Math.min.apply(null, sizes), hi = Math.max.apply(null, sizes);
    document.getElementById('mcKind').textContent = (lo === hi ? lo : lo + '〜' + hi) + '択';
  }
  // 問題集1本だけの資格は「模擬試験」ではなく exams.js の quiz.mcTitle で呼び替える。
  if (typeof MC_TITLE === 'string' && MC_TITLE) {
    MODE_LABEL.mc = MC_TITLE;
    document.getElementById('mcTitle').textContent = MC_TITLE;
  }
})();

function showScreen(id) {
  ['screenMode', 'screenScope', 'screenQuestion', 'screenSummary'].forEach((s) => {
    document.getElementById(s).style.display = s === id ? '' : 'none';
  });
}

function chooseMode(m) {
  if (m === 'review') { startReview(); return; }
  const pool = m === 'extra' || m === 'extra2' || m === 'extra3'
    ? QUESTIONS.filter((q) => q.deck === m)
    : QUESTIONS.filter((q) => q.type === m && !q.deck);
  if (!pool.length) { alert('このモードの問題がまだ登録されていません。'); return; }
  mode = m;
  modePool = pool;
  renderScopeScreen();
}

// ── 復習モード（間違えた問題だけの再学習） ────────────────────────────────
// 出題プールはスプレッドシートの記録（<examId>_<mode>_ミス、全モードぶん）から作る。
// 端末のlocalStorageは使わない: このページはGASのサンドボックスiframe（*.googleusercontent.com）
// で配信されるため保存先が端末・ブラウザごとにバラバラになり、スマホとPCで復習状況が
// 食い違ってしまう。記録は既にスプレッドシートにあるのでそれを唯一の正とする。
async function startReview() {
  const card = document.getElementById('reviewCard');
  const desc = document.getElementById('reviewCount');
  const prevDesc = desc.textContent;
  card.disabled = true;
  desc.textContent = '記録を読み込み中...';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiGetReviewPool({ examId: TRACKING_EXAM_ID });
    });
    if (!data.ok) {
      alert('復習リストを取得できませんでした: ' + (data.error || ''));
      desc.textContent = prevDesc;
      return;
    }

    reviewEntries = data.entries || [];
    reviewEntryById = {};
    reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });

    const pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
    reviewMissingCount = reviewEntries.length - pool.length;
    if (!pool.length) {
      alert(reviewEntries.length
        ? '記録にある問題が今の問題集に見つかりませんでした（問題IDの無い古い記録のみです）。'
        : 'まだ間違えた問題の記録がありません。\n各モードを解いたあとサマリー画面で「この回の結果を記録」を押すと、ここに溜まっていきます。');
      desc.textContent = prevDesc;
      return;
    }

    mode = 'review';
    modePool = pool;
    desc.textContent = pool.filter((q) => !isGraduated(q)).length + '問が未克服';
    renderScopeScreen();
  } catch (err) {
    alert('通信エラー: ' + (err && err.message ? err.message : err));
    desc.textContent = prevDesc;
  } finally {
    card.disabled = false;
  }
}

// 復習プールの1問あたりの状態を引く小物。記録に無い問題（通常は起きない）は0扱い。
function isGraduated(q) {
  const e = reviewEntryById[q.id];
  return !!e && e.streak >= GRADUATE_STREAK;
}
function missCountOf(q) {
  const e = reviewEntryById[q.id];
  return e ? e.missCount : 0;
}
function lastMissTimeOf(q) {
  const e = reviewEntryById[q.id];
  return e && e.lastMissAt ? new Date(e.lastMissAt).getTime() : 0;
}

// 復習の範囲キー → 出題対象の絞り込み条件。
function reviewFilter(key) {
  if (key === 'all') return function () { return true; };
  if (key === 'repeat') return function (q) { return !isGraduated(q) && missCountOf(q) >= 2; };
  if (key === 'recent') {
    const since = Date.now() - RECENT_MISS_DAYS * 24 * 60 * 60 * 1000;
    return function (q) { return !isGraduated(q) && lastMissTimeOf(q) >= since; };
  }
  if (typeof key === 'number') return function (q) { return !isGraduated(q) && q.chapterIndex === key; };
  return function (q) { return !isGraduated(q); }; // 'active'（既定）
}

function reviewScopeLabel(key) {
  if (key === 'all') return '記録にある全部';
  if (key === 'repeat') return '2回以上間違えた問題';
  if (key === 'recent') return '最近' + RECENT_MISS_DAYS + '日で間違えた問題';
  if (typeof key === 'number') return chapterLabelText(key);
  return '未克服の問題';
}

// 復習モードでは色々なデッキの問題が混ざるので、その問題がどの問題集のものかを示す。
function deckLabelOf(q) {
  if (q.deck === 'extra') return '追加問題';
  if (q.deck === 'extra2') return '追加問題2';
  if (q.deck === 'extra3') return '新シラバス仮問題';
  return q.type === 'tf' ? '一問一答' : '模擬試験';
}

// モード確定後、「全部」か「章ごとにチャレンジ」かを選ぶ画面を組み立てる。
function renderScopeScreen() {
  if (mode === 'review') { renderReviewScopeScreen(); return; }
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">📚 全部</div><div class="scope-all-desc">' + modePool.length + '問すべて出題</div>';
  allBtn.onclick = () => chooseScope(null);
  el.appendChild(allBtn);

  const chapterIndexes = Array.from(new Set(modePool.map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとにチャレンジ';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const count = modePool.filter((q) => q.chapterIndex === ci).length;
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + count + '問</span>';
      btn.onclick = () => chooseScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);

    // 章の下のテーマ別グループ（問題に group が付いているときだけ）。
    if (modePool.some((q) => q.group)) {
      const gHeading = document.createElement('div');
      gHeading.className = 'scope-chapter-heading';
      gHeading.textContent = 'テーマ別にチャレンジ';
      el.appendChild(gHeading);
      chapterIndexes.forEach((ci) => {
        const inChapter = modePool.filter((q) => q.chapterIndex === ci && q.group);
        const names = [];
        inChapter.slice().sort((a, b) => (a.groupIndex || 0) - (b.groupIndex || 0)).forEach((q) => { if (names.indexOf(q.group) < 0) names.push(q.group); });
        if (!names.length) return;
        const sub = document.createElement('div');
        sub.className = 'scope-note';
        sub.textContent = chapterLabelText(ci);
        el.appendChild(sub);
        const gList = document.createElement('div');
        gList.className = 'scope-chapter-list';
        names.forEach((name) => {
          const n = inChapter.filter((q) => q.group === name).length;
          const btn = document.createElement('button');
          btn.className = 'scope-chapter-btn';
          btn.innerHTML = '<span class="name">' + escapeHtml(name) + '</span><span class="count">' + n + '問</span>';
          btn.onclick = () => chooseScope(ci, name);
          gList.appendChild(btn);
        });
        el.appendChild(gList);
      });
    }
  }

  showScreen('screenScope');
}

// 復習モードの範囲選択画面。章ではなく「未克服／繰り返しミス／最近／全部」で切る。
function renderReviewScopeScreen() {
  document.getElementById('headerSub').textContent = '復習　範囲を選んでください';

  const el = document.getElementById('scopeSelect');
  el.innerHTML = '';

  const countOf = (key) => modePool.filter(reviewFilter(key)).length;

  const allBtn = document.createElement('button');
  allBtn.className = 'scope-all-btn';
  allBtn.innerHTML = '<div class="scope-all-title">🔁 未克服の問題</div><div class="scope-all-desc">'
    + countOf('active') + '問・間違えたまま克服できていない問題</div>';
  allBtn.onclick = () => chooseReviewScope('active');
  el.appendChild(allBtn);

  const presets = [
    { key: 'repeat', name: '🔥 2回以上間違えた問題' },
    { key: 'recent', name: '📅 最近' + RECENT_MISS_DAYS + '日で間違えた問題' },
    { key: 'all', name: '📚 記録にある全部（克服済みも含む）' },
  ];
  const presetList = document.createElement('div');
  presetList.className = 'scope-chapter-list';
  presets.forEach((p) => {
    const n = countOf(p.key);
    const btn = document.createElement('button');
    btn.className = 'scope-chapter-btn';
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="name">' + escapeHtml(p.name) + '</span><span class="count">' + n + '問</span>';
    btn.onclick = () => chooseReviewScope(p.key);
    presetList.appendChild(btn);
  });
  el.appendChild(presetList);

  // 章ごと（未克服のぶんだけ）。0問の章はボタン自体を出さない。
  const chapterIndexes = Array.from(new Set(modePool.filter(reviewFilter('active')).map((q) => q.chapterIndex))).sort((a, b) => a - b);
  if (chapterIndexes.length > 1) {
    const heading = document.createElement('div');
    heading.className = 'scope-chapter-heading';
    heading.textContent = '章ごとに復習（未克服ぶん）';
    el.appendChild(heading);

    const list = document.createElement('div');
    list.className = 'scope-chapter-list';
    chapterIndexes.forEach((ci) => {
      const n = countOf(ci);
      const btn = document.createElement('button');
      btn.className = 'scope-chapter-btn';
      btn.innerHTML = '<span class="name">' + escapeHtml(chapterLabelText(ci)) + '</span><span class="count">' + n + '問</span>';
      btn.onclick = () => chooseReviewScope(ci);
      list.appendChild(btn);
    });
    el.appendChild(list);
  }

  const note = document.createElement('div');
  note.className = 'scope-note';
  note.textContent = '復習で' + GRADUATE_STREAK + '回連続で正解した問題は「克服」として既定の出題から外れます。'
    + (reviewMissingCount > 0 ? '（記録のうち' + reviewMissingCount + '問は今の問題集に無いため対象外）' : '');
  el.appendChild(note);

  showScreen('screenScope');
}

// 復習モードの範囲確定。ミスが多い問題・最近間違えた問題から先に出す。
function chooseReviewScope(key) {
  const pool = modePool.filter(reviewFilter(key));
  if (!pool.length) { alert('この条件に当てはまる問題がありません。'); return; }
  reviewScopeKey = key;
  scopeChapterIndex = typeof key === 'number' ? key : null;
  scopeGroup = null;
  questions = pool.slice().sort((a, b) => (missCountOf(b) - missCountOf(a)) || (lastMissTimeOf(b) - lastMissTimeOf(a)));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = '復習　' + reviewScopeLabel(key) + '（' + questions.length + '問）';
  showScreen('screenQuestion');
  renderQuestion();
}

function chooseScope(chapterIndex, group) {
  scopeChapterIndex = chapterIndex;
  scopeGroup = group || null;
  questions = chapterIndex == null ? modePool : modePool.filter((q) => q.chapterIndex === chapterIndex && (!scopeGroup || q.group === scopeGroup));
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent = MODE_LABEL[mode] + '　' + (chapterIndex == null ? '全部' : chapterLabelText(chapterIndex) + (scopeGroup ? '／' + scopeGroup : ''));
  showScreen('screenQuestion');
  renderQuestion();
}

function restartMode() {
  if (mode === 'review') { chooseReviewScope(reviewScopeKey); return; }
  chooseScope(scopeChapterIndex, scopeGroup);
}

// 今のセッションで間違えた問題だけを、その場でもう一度出題する（記録を待たない簡易復習）。
// 記録ベースの本格的な復習はモード選択の「🔁 復習」。
function retryWrongInSession() {
  const wrong = sessionResults.filter((r) => !r.correct)
    .map((r) => questions.find((q) => q.id === r.id))
    .filter(Boolean);
  if (!wrong.length) return;
  questions = wrong;
  idx = 0;
  sessionResults = [];
  skippedCount = 0;
  document.getElementById('headerSub').textContent =
    (mode === 'review' ? '復習' : MODE_LABEL[mode]) + '　間違えた' + wrong.length + '問をもう一度';
  showScreen('screenQuestion');
  renderQuestion();
}

function backToScopeSelect() {
  renderScopeScreen();
}

function backToModeSelect() {
  mode = null;
  modePool = [];
  scopeChapterIndex = null;
  scopeGroup = null;
  document.getElementById('headerSub').textContent = 'モードを選んでください';
  showScreen('screenMode');
}

function chapterLabelText(chapterIndex) {
  if (chapterIndex == null || !CHAPTERS[chapterIndex]) return '';
  // BASE_CHAPTER_COUNT 以降は新シラバス仮問題集の章（旧シラバスの章と名前が重なるので「新」を付ける）
  if (chapterIndex >= BASE_CHAPTER_COUNT) return '新シラバス第' + (chapterIndex - BASE_CHAPTER_COUNT + 1) + '章：' + CHAPTERS[chapterIndex];
  return '第' + (chapterIndex + 1) + '章：' + CHAPTERS[chapterIndex];
}

function renderQuestion() {
  const q = questions[idx];
  selectedOption = q.type === 'mc-multi' ? [] : null;
  revealed = false;

  // 復習モードは色々なデッキが混ざるので、どの問題集の何問目かと通算ミス回数も出す。
  const progressLabel = mode === 'review'
    ? '復習（' + deckLabelOf(q) + '）　' + (idx + 1) + ' / ' + questions.length + '　通算' + missCountOf(q) + '回ミス'
    : MODE_LABEL[mode] + '　' + (idx + 1) + ' / ' + questions.length;
  document.getElementById('progress').textContent = progressLabel;
  document.getElementById('chapterLabel').textContent = chapterLabelText(q.chapterIndex) + (q.group ? '／' + q.group : '');
  document.getElementById('stem').textContent = q.stem + (q.type === 'mc-multi' ? '（複数選択可）' : '');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';

  if (q.type === 'mc' || q.type === 'mc-multi') {
    q.options.forEach((text, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = '(' + (i + 1) + ') ' + text;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });
  } else {
    const trueBtn = document.createElement('button');
    trueBtn.className = 'option-btn tf-btn';
    trueBtn.textContent = '○ 正しい';
    trueBtn.onclick = () => selectOption(true);
    const falseBtn = document.createElement('button');
    falseBtn.className = 'option-btn tf-btn';
    falseBtn.textContent = '× 誤り';
    falseBtn.onclick = () => selectOption(false);
    optionsEl.appendChild(trueBtn);
    optionsEl.appendChild(falseBtn);
  }

  // 「回答」ボタンは複数選択（mc-multi）専用。mc / tf は選択した時点で即判定するため出さない。
  const answerBtn = document.getElementById('answerBtn');
  answerBtn.disabled = true;
  answerBtn.style.display = q.type === 'mc-multi' ? '' : 'none';
  document.getElementById('questionActions').style.display = '';
  document.getElementById('revealArea').style.display = 'none';
}

// 回答せずに次の問題へ飛ばす。スキップした問題は sessionResults に入れないので
// 正答率の母数にも、間違えた問題の記録にも入らない（＝ミス扱いにはしない）。
function skipQuestion() {
  if (revealed) return;
  skippedCount++;
  saveProgress(idx + 1);
  nextQuestion();
}

// mc / tf は「選択＝回答」で、選択肢を押した時点でそのまま正誤を表示する（回答ボタンは出さない）。
// mc-multi（すべて選びなさい）は複数選んでから確定する必要があるため、従来どおり
// トグル選択 →「回答」ボタンで reveal() する。
function selectOption(v) {
  if (revealed) return;
  const q = questions[idx];

  if (q.type !== 'mc-multi') {
    selectedOption = v;
    reveal();
    return;
  }

  const i = selectedOption.indexOf(v);
  if (i === -1) selectedOption.push(v);
  else selectedOption.splice(i, 1);
  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, j) => {
    btn.classList.toggle('selected', selectedOption.includes(j));
  });
  document.getElementById('answerBtn').disabled = selectedOption.length === 0;
}

function sameIndexSet(a, b) {
  if (a.length !== b.length) return false;
  const sortedA = a.slice().sort();
  const sortedB = b.slice().sort();
  return sortedA.every((v, i) => v === sortedB[i]);
}

// ── 効果音（正解＝ピンポン／不正解＝ブブー） ─────────────────────────────────────
// 音声ファイルは使わず Web Audio で合成する。鳴らすのは回答の瞬間（利用者のクリック直後）なので
// ブラウザの自動再生制限にかからない。失敗しても回答の処理は止めない。ON/OFFは端末ごとの好みなので
// localStorage に覚える（読めない環境ではONのまま）。
let soundOn = true;
let audioCtx = null;
try { soundOn = localStorage.getItem('quizSound') !== 'off'; } catch (e) { /* 読めなければON */ }

function getAudioCtx() {
  if (audioCtx) return audioCtx;
  const AC = typeof AudioContext !== 'undefined' ? AudioContext
    : (typeof webkitAudioContext !== 'undefined' ? webkitAudioContext : null);
  if (!AC) return null;
  audioCtx = new AC();
  return audioCtx;
}

// 1音: 立ち上がりを素早く、あとは指数的に減衰させる（ぷつっというノイズを避ける）。
function playTone(ctx, start, freq, dur, type, peak) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playResultSound(correct) {
  if (!soundOn) return;
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    const t = ctx.currentTime;
    // 音量: 同時に鳴る音の合計が 1.0 を超えない範囲（超えると割れる）。
    if (correct) {
      // ピン（高）→ポーン（低）。倍音を足してベルらしくする。
      playTone(ctx, t, 1175, 0.3, 'sine', 0.65);
      playTone(ctx, t, 2350, 0.2, 'sine', 0.18);
      playTone(ctx, t + 0.18, 880, 0.6, 'sine', 0.65);
      playTone(ctx, t + 0.18, 1760, 0.35, 'sine', 0.18);
    } else {
      // ブッ、ブー。少しずらした低いのこぎり波2本でブザーらしいざらつきを出す。
      [150, 157].forEach((f) => {
        playTone(ctx, t, f, 0.16, 'sawtooth', 0.31);
        playTone(ctx, t + 0.22, f, 0.5, 'sawtooth', 0.31);
      });
    }
  } catch (e) { /* 音が鳴らなくても学習の邪魔をしない */ }
}

function updateSoundBtn() {
  const btn = document.getElementById('soundBtn');
  if (!btn) return;
  btn.textContent = soundOn ? '🔊 音' : '🔇 音';
  btn.title = soundOn ? '効果音ON（押すとOFF）' : '効果音OFF（押すとON）';
}

function toggleSound() {
  soundOn = !soundOn;
  try { localStorage.setItem('quizSound', soundOn ? 'on' : 'off'); } catch (e) { /* 保存できなくても今回は有効 */ }
  updateSoundBtn();
  if (soundOn) playResultSound(true);   // ONにしたときに音を確かめられるよう、ピンポンを鳴らす
}
updateSoundBtn();

function reveal() {
  if (selectedOption === null || revealed) return;
  if (Array.isArray(selectedOption) && selectedOption.length === 0) return;
  revealed = true;

  const q = questions[idx];
  const correct = q.type === 'mc' ? selectedOption === q.correctIndex
    : q.type === 'mc-multi' ? sameIndexSet(selectedOption, q.correctIndexes)
    : selectedOption === q.correct;
  sessionResults.push({ id: q.id, chapterIndex: q.chapterIndex, correct, selectedOption });
  saveProgress(idx + 1);   // 回答した時点で保存（次へを押す前に閉じても、次の問題から再開できる）
  playResultSound(correct);

  const optionsEl = document.getElementById('options');
  Array.from(optionsEl.children).forEach((btn, i) => {
    btn.disabled = true;
    btn.classList.remove('selected');
    const isCorrectChoice = q.type === 'mc' ? i === q.correctIndex
      : q.type === 'mc-multi' ? q.correctIndexes.includes(i)
      : (i === 0) === q.correct;
    const isSelectedChoice = q.type === 'mc' ? i === selectedOption
      : q.type === 'mc-multi' ? selectedOption.includes(i)
      : (i === 0) === selectedOption;
    if (isCorrectChoice) btn.classList.add('correct');
    else if (isSelectedChoice) btn.classList.add('incorrect');
  });

  const revealOptions = document.getElementById('revealOptions');
  revealOptions.innerHTML = '';
  if (q.type === 'mc' || q.type === 'mc-multi') {
    // バッジは「選択肢として選ぶべきか(correctIndex/correctIndexes)」ではなく、解説文が本来持つ○/×
    // （その文が事実として正しいか）をそのまま使う。「最も不適切なものはどれか」形式の設問では
    // 正解の選択肢が「事実として誤り（×）」であるため、correctIndexだけで○/×を決めると意味が逆転する。
    q.explanations.forEach((text, i) => {
      const row = document.createElement('div');
      row.className = 'option-explain';
      const m = text.match(/^([○×])\s*/);
      const fallbackCorrect = q.type === 'mc-multi' ? q.correctIndexes.includes(i) : i === q.correctIndex;
      const badge = m ? m[1] : (fallbackCorrect ? '○' : '×');
      row.innerHTML = '<span class="option-badge">' + badge + '</span>' + escapeHtml(text.replace(/^[○×]\s*/, ''));
      revealOptions.appendChild(row);
    });
  } else {
    const row = document.createElement('div');
    row.className = 'option-explain';
    row.innerHTML = '<span class="option-badge">' + (q.correct ? '○ 正しい' : '× 誤り') + '</span><br>' + escapeHtml(q.explanation.replace(/^[○×]\s*/, ''));
    revealOptions.appendChild(row);
  }

  document.getElementById('questionActions').style.display = 'none';
  document.getElementById('revealArea').style.display = '';
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// 選択肢のindex（mc/mc-multi）やbool（tf）を、スプレッドシート出力・アドバイス用に
// 人が読めるテキストへ変換する。
function answerText(q, val) {
  if (q.type === 'mc') return val == null ? '（未回答）' : q.options[val];
  if (q.type === 'mc-multi') return (val || []).map((i) => q.options[i]).join(' / ');
  return val ? '正しい' : '誤り';
}

function buildAskPrompt(q, selected) {
  // ラベルは問題タイプではなく、現在解いているモード（MODE_LABEL）から決める。
  // mc3（追加問題2）もtype:'mc'なので、type起点だと「模擬試験」と誤表示されてしまうため。
  // 復習モードは複数デッキが混ざるので、その問題自身の出自（deckLabelOf）を使う。
  const deckLabel = mode === 'review' ? deckLabelOf(q) : (MODE_LABEL[mode] || '問題集');
  if (q.type === 'mc') {
    const selfAnswerLine = selected != null && selected !== q.correctIndex
      ? '\n自分は(' + (selected + 1) + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + (q.correctIndex + 1) + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  if (q.type === 'mc-multi') {
    const selectedList = (selected || []).map((i) => i + 1).join(', ');
    const correctList = q.correctIndexes.map((i) => i + 1).join(', ');
    const selfAnswerLine = selected != null && !sameIndexSet(selected, q.correctIndexes)
      ? '\n自分は(' + selectedList + ')を選んで間違えました。なぜそれが誤りかも教えてください。'
      : '';
    return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の問題（複数選択）について教えてください。\n\n' +
      '問題：' + q.stem + '\n' +
      q.options.map((o, i) => '(' + (i + 1) + ') ' + o).join('\n') + '\n\n' +
      '正解は(' + correctList + ')です。' + selfAnswerLine +
      '\nこの問題の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
  }
  const selfAnswerLine = selected != null && selected !== q.correct
    ? '\n自分は「' + (selected ? '正しい' : '誤り') + '」と回答して間違えました。なぜそれが誤りかも教えてください。'
    : '';
  return EXAM_SHORT_TITLE + 'の問題集（' + deckLabel + '）より、以下の文の正誤について教えてください。\n\n' +
    '問題文：' + q.stem + '\n' +
    '正解：' + (q.correct ? '正しい' : '誤り') + selfAnswerLine +
    '\nこの論点の考え方や関連する周辺知識を要点だけ簡潔に解説してください。';
}

function askInChat() {
  const q = questions[idx];
  // GASのHtmlServiceはページをiframe（サンドボックス）内に読み込むため、
  // location.href だとiframe内だけが遷移してしまう（top.location.hrefが必要）。
  // さらに相対URLはiframeの内部配信元（googleusercontent.com）を基準に解決
  // されてしまうため、GAS_WEBAPP_URLを前置した絶対URLにする必要がある。
  // チャットの「元の問題に戻る」ボタン用に、戻り先（この問題を開き直すURL）を一緒に渡す。
  // 復習モードは記録の読み込みが要るので、その問題が属する通常モード（出自のデッキ）へ戻す。
  const backMode = mode === 'review' ? (q.deck || q.type) : mode;
  let backUrl = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '-quiz&resume=' + encodeURIComponent(q.id) + '&m=' + encodeURIComponent(backMode);
  if (mode !== 'review' && scopeChapterIndex != null) backUrl += '&c=' + scopeChapterIndex;
  if (mode !== 'review' && scopeGroup) backUrl += '&g=' + encodeURIComponent(scopeGroup);
  top.location.href = GAS_WEBAPP_URL + '?page=' + EXAM_ID + '&ask=' + encodeURIComponent(buildAskPrompt(q, selectedOption))
    + '&back=' + encodeURIComponent(backUrl);
}

// チャットの「元の問題に戻る」から開かれたとき、?resume=<問題ID>&m=<モード>[&c=<章>][&g=<グループ>] の問題を開き直す。
// 出題順は固定（シャッフルなし）なので、同じ範囲を作り直して該当の位置へ移れば続きから解ける。
function initResumeParam() {
  if (typeof google === 'undefined' || !google.script || !google.script.url || !google.script.url.getLocation) return;
  google.script.url.getLocation(function (loc) {
    const p = (loc && loc.parameter) || {};
    if (!p.resume || !p.m) return;
    const target = QUESTIONS.find((q) => q.id === p.resume);
    if (!target) return;
    chooseMode(p.m);
    if (mode !== p.m) return;
    const c = p.c != null && p.c !== '' ? Number(p.c) : null;
    chooseScope(Number.isInteger(c) ? c : null, p.g || null);
    let at = questions.findIndex((q) => q.id === target.id);
    if (at < 0) { chooseScope(null, null); at = questions.findIndex((q) => q.id === target.id); }
    if (at < 0) return;
    idx = at;
    renderQuestion();
  });
}
initResumeParam();

// ── 中断→再開 ─────────────────────────────────────────────────────────
// 1問回答／スキップするたびに、いまの出題セッションの途中経過をバックエンド（UserProperties）へ送る。
// 次に開いたとき、モード選択画面の先頭に「続きから再開」を出し、中断した次の問題から続けられる。
// 1資格につき1枠（最後に解いていたセッション）。端末をまたいで再開できる。最後まで解くと消える。
// 状態は小さく詰める（UserProperties は1値約9KB上限）: q=出題順のID列、a=[[ID, 正誤(1/0), 選んだ答え]…]、i=次に解く位置。
let pendingProgress = null;

function hasGoogleRun() {
  return typeof google !== 'undefined' && google && google.script && google.script.run;
}

function saveProgress(nextIdx) {
  if (!hasGoogleRun() || !mode || !questions.length) return;
  const state = {
    v: 1, t: Date.now(), mode: mode, c: scopeChapterIndex, g: scopeGroup, r: reviewScopeKey,
    h: document.getElementById('headerSub').textContent,
    q: questions.map((q) => q.id).join(','), i: nextIdx,
    a: sessionResults.map((r) => [r.id, r.correct ? 1 : 0, r.selectedOption]), sk: skippedCount,
  };
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiSaveQuizProgress({ examId: TRACKING_EXAM_ID, state: state });
  } catch (e) { /* 保存に失敗しても出題は続ける */ }
}

function clearProgress() {
  pendingProgress = null;
  if (!hasGoogleRun()) return;
  try {
    google.script.run.withSuccessHandler(function () {}).withFailureHandler(function () {})
      .apiClearQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 無視 */ }
}

// 保存された途中経過が、今の問題集でそのまま復元できるか（問題が差し替わっていたら諦める）。
function isResumableProgress(s) {
  if (!s || s.v !== 1 || typeof s.q !== 'string' || !Array.isArray(s.a) || !Number.isInteger(s.i)) return false;
  const ids = s.q.split(',');
  if (s.i < 0 || s.i >= ids.length) return false;
  const known = {};
  QUESTIONS.forEach((q) => { known[q.id] = true; });
  return ids.every((id) => known[id]) && s.a.every((r) => Array.isArray(r) && known[r[0]]);
}

function offerResume(s) {
  if (!isResumableProgress(s)) return;
  pendingProgress = s;
  const total = s.q.split(',').length;
  document.getElementById('resumeText').textContent =
    '📌 途中の問題集があります：' + (s.h || '') + '　' + (s.i + 1) + '問目から（全' + total + '問・回答済み' + s.a.length + '問）';
  document.getElementById('resumeBanner').style.display = '';
}

(function initProgress() {
  if (!hasGoogleRun()) return;
  try {
    google.script.run
      .withSuccessHandler(function (res) { if (res && res.ok && res.state) offerResume(res.state); })
      .withFailureHandler(function () {})
      .apiLoadQuizProgress({ examId: TRACKING_EXAM_ID });
  } catch (e) { /* 再開バナーが出ないだけ */ }
})();

function discardProgress() {
  document.getElementById('resumeBanner').style.display = 'none';
  clearProgress();
}

async function resumeProgress() {
  const s = pendingProgress;
  if (!s || !isResumableProgress(s)) { discardProgress(); return; }
  const btn = document.getElementById('resumeBtn');
  btn.disabled = true;
  try {
    let pool;
    if (s.mode === 'review') {
      // 復習は問題ごとの通算ミス回数・卒業判定が画面に出るので、記録を読み直してから復元する。
      const data = await new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiGetReviewPool({ examId: TRACKING_EXAM_ID });
      });
      if (!data.ok) { alert('復習の記録を取得できませんでした: ' + (data.error || '')); return; }
      reviewEntries = data.entries || [];
      reviewEntryById = {};
      reviewEntries.forEach(function (e) { reviewEntryById[e.id] = e; });
      pool = QUESTIONS.filter((q) => !!reviewEntryById[q.id]);
      reviewMissingCount = reviewEntries.length - pool.length;
    } else {
      pool = s.mode === 'extra' || s.mode === 'extra2' || s.mode === 'extra3'
        ? QUESTIONS.filter((q) => q.deck === s.mode)
        : QUESTIONS.filter((q) => q.type === s.mode && !q.deck);
    }
    const byId = {};
    QUESTIONS.forEach((q) => { byId[q.id] = q; });
    mode = s.mode;
    modePool = pool;
    scopeChapterIndex = s.c == null ? null : s.c;
    scopeGroup = s.g || null;
    reviewScopeKey = s.r == null ? null : s.r;
    questions = s.q.split(',').map((id) => byId[id]);
    idx = s.i;
    sessionResults = s.a.map((r) => ({ id: r[0], chapterIndex: byId[r[0]].chapterIndex, correct: !!r[1], selectedOption: r[2] }));
    skippedCount = s.sk || 0;
    pendingProgress = null;
    document.getElementById('resumeBanner').style.display = 'none';
    document.getElementById('headerSub').textContent = s.h || MODE_LABEL[mode] || '';
    showScreen('screenQuestion');
    renderQuestion();
  } catch (err) {
    alert('再開できませんでした: ' + (err && err.message ? err.message : err));
  } finally {
    btn.disabled = false;
  }
}

function nextQuestion() {
  idx++;
  if (idx >= questions.length) showSummary();
  else renderQuestion();
}

// CHAPTERS の全章を常に含めて返す（今回未出題の章は total:0）。
// スプレッドシート側は最初の記録時に受け取った章名で行を確定するため、
// 章の集合が回によってブレると2回目以降の記録で行が見つからなくなる。
// 常に全章を送ることでこれを防ぐ。
function aggregateByChapter(results) {
  const byIndex = {};
  results.forEach((r) => {
    if (!byIndex[r.chapterIndex]) byIndex[r.chapterIndex] = { correct: 0, total: 0 };
    byIndex[r.chapterIndex].total++;
    if (r.correct) byIndex[r.chapterIndex].correct++;
  });
  // 新シラバス仮問題集（extra3）は新シラバスの章だけ、それ以外の問題集は旧シラバスの章だけを送る
  // （新しい成績シートに旧章の行が並んだり、既存シートの章の集合が変わって行が見つからなくなるのを防ぐ）。復習は全章。
  const inScope = (i) => mode === 'review' || (mode === 'extra3' ? i >= BASE_CHAPTER_COUNT : i < BASE_CHAPTER_COUNT);
  return CHAPTERS.map((label, i) => ({
    chapterIndex: i,
    chapterLabel: i >= BASE_CHAPTER_COUNT ? chapterLabelText(i) : label,
    correct: (byIndex[i] && byIndex[i].correct) || 0,
    total: (byIndex[i] && byIndex[i].total) || 0,
  })).filter((c) => inScope(c.chapterIndex));
}

function showSummary() {
  clearProgress();   // 最後まで解いたので、途中経過は不要
  showScreen('screenSummary');
  const total = sessionResults.length;
  const correct = sessionResults.filter((r) => r.correct).length;
  const wrongCount = total - correct;
  const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
  document.getElementById('summaryScore').textContent =
    correct + ' / ' + total + '（' + pct + '%）' + (skippedCount > 0 ? '　スキップ ' + skippedCount + '問' : '');

  const byChapter = aggregateByChapter(sessionResults);
  const chaptersEl = document.getElementById('summaryChapters');
  chaptersEl.innerHTML = '';
  byChapter.forEach((c) => {
    const row = document.createElement('div');
    row.className = 'summary-chapter-row';
    const scoreText = c.total > 0
      ? c.correct + '/' + c.total + '（' + Math.round((c.correct / c.total) * 1000) / 10 + '%）'
      : '未出題';
    row.innerHTML = '<span class="name">' + escapeHtml(c.chapterLabel) + '</span><span class="score">' + scoreText + '</span>';
    chaptersEl.appendChild(row);
  });

  document.getElementById('recordStatus').textContent = '';
  const recordBtn = document.getElementById('recordBtn');
  // 全問スキップ（回答0問）のときは記録しても中身が無いので押させない。
  recordBtn.disabled = total === 0;
  recordBtn.textContent = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';

  // 間違えた問題があるときだけ、その場で解き直すボタンを出す。
  const retryBtn = document.getElementById('retryWrongBtn');
  retryBtn.style.display = wrongCount > 0 ? '' : 'none';
  retryBtn.textContent = '🔁 間違えた' + wrongCount + '問だけもう一度';

  const note = document.getElementById('summaryNote');
  if (mode === 'review') {
    note.textContent = '復習の結果は「' + TRACKING_EXAM_ID + '_復習ログ」に記録され、'
      + GRADUATE_STREAK + '回連続で正解した問題は次回から「克服」として出題対象から外れます'
      + '（章別の正答率推移シートには影響しません）。';
    note.style.display = '';
  } else {
    note.style.display = 'none';
    note.textContent = '';
  }

  document.getElementById('adviceArea').style.display = 'none';
  document.getElementById('adviceStatus').textContent = '';
  document.getElementById('adviceBtn').disabled = false;
  document.getElementById('adviceBtn').textContent = '🎯 学習アドバイスを見る';
}

// 今回の結果（章別正答率・間違えた問題）と、過去に蓄積した「ミス」シートの履歴を
// バックエンドで突き合わせ、Geminiに弱点分野・復習優先度・次のアクションをまとめさせる。
async function getAdvice() {
  const btn = document.getElementById('adviceBtn');
  const status = document.getElementById('adviceStatus');
  const area = document.getElementById('adviceArea');
  btn.disabled = true;
  btn.textContent = 'アドバイスを作成中...';
  status.textContent = '';

  try {
    const data = await new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .apiQuizAdvice({
          examId: EXAM_ID,
          trackingExamId: TRACKING_EXAM_ID,
          mode: TRACKING_MODE[mode] || mode,
          chapters: aggregateByChapter(sessionResults),
          wrongAnswers: buildWrongAnswers(),
        });
    });
    if (data.ok) {
      area.textContent = data.advice;
      area.style.display = '';
      btn.textContent = '🎯 学習アドバイスを見る';
    } else {
      status.textContent = '⚠️ ' + (data.error || 'アドバイスの取得に失敗しました');
      btn.textContent = '🎯 学習アドバイスを見る';
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.textContent = '🎯 学習アドバイスを見る';
  } finally {
    btn.disabled = false;
  }
}

// 間違えた問題だけを、問題文・自分の回答・正解を添えたスプレッドシート出力用の形へ整形する。
function buildWrongAnswers() {
  return sessionResults.filter((r) => !r.correct).map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

// 復習モードの記録用。正解した問題も含めて全問を送る（連続正解＝克服の判定に必要なため）。
function buildReviewResults() {
  return sessionResults.map((r) => {
    const q = questions.find((qq) => qq.id === r.id);
    const correctVal = q.type === 'mc' ? q.correctIndex : q.type === 'mc-multi' ? q.correctIndexes : q.correct;
    return {
      id: r.id,
      deckLabel: deckLabelOf(q),
      chapterLabel: chapterLabelText(r.chapterIndex),
      stem: q.stem,
      correct: r.correct,
      selectedText: answerText(q, r.selectedOption),
      correctText: answerText(q, correctVal),
    };
  });
}

async function recordResults() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const labelWhenIdle = mode === 'review' ? 'この回の復習結果を記録' : 'この回の結果を記録';
  btn.disabled = true;
  btn.textContent = '記録中...';
  status.textContent = '';

  const byChapter = aggregateByChapter(sessionResults);
  try {
    // fetchではなく google.script.run を使う（理由は chat-app.js の callBackend 参照）。
    // 復習モードは章別の正答率推移シートに混ぜない（出題が間違えた問題に偏っていて
    // 推移のグラフが本来の実力より低く歪むため）。専用の復習ログへ全問を書く。
    const data = await new Promise(function (resolve, reject) {
      const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      if (mode === 'review') {
        runner.apiRecordReviewLog({
          examId: TRACKING_EXAM_ID,
          results: buildReviewResults(),
          attemptAt: new Date().toISOString(),
        });
        return;
      }
      runner.apiRecordQuizResult({
        examId: TRACKING_EXAM_ID,
        mode: TRACKING_MODE[mode] || mode,
        chapters: byChapter,
        wrongAnswers: buildWrongAnswers(),
        attemptAt: new Date().toISOString(),
      });
    });
    if (data.ok) {
      status.textContent = '✅ 記録しました';
      btn.textContent = '記録済み';
    } else {
      status.textContent = '⚠️ ' + (data.error || '記録に失敗しました');
      btn.disabled = false;
      btn.textContent = labelWhenIdle;
    }
  } catch (err) {
    status.textContent = '⚠️ 通信エラー: ' + (err && err.message ? err.message : err);
    btn.disabled = false;
    btn.textContent = labelWhenIdle;
  }
}

</script>
</body>
</html>
